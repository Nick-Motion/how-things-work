<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Robot vacuum</title></head><body>
<script src="core.js"></script>
<script>
/* Robot vacuum — a round lidar robot (Roborock-style, 35 cm across, 10 cm tall) on a patch of oak floor in the corner of
   a room, with its charging dock against the back wall and a pet's food bowl. 1 unit = 1 cm.
   x = depth (toward viewer-right), y = width (toward viewer-left), z = up. Walls: the back wall along x = 0 and the
   right wall along y = 0, each with a skirting board.

   How it really works (where everything is after each step):
   DOCKED   wall socket -> cord -> dock's DC inlet -> dock board -> two spring contacts on the dock's floor plate ->
            the robot's two charge pads under its rear -> BMS board -> 14.4 V Li-ion pack (4S2P, eight 18650 cells).
   CLEAN    the CLEAN button on top -> main board. The lidar motor spins the laser head (belt drive) ~5 turns a second:
            the laser emitter fires, the receiver lens images the spot onto its sensor and the angle gives the distance
            (triangulation), so the board builds a map. Both drive motors turn their wheels through gearboxes (encoders
            count the turns); the robot drives forward off the dock. The side brush flicks dirt at the edge inward, the
            brush roll lifts it, the suction fan pulls air: brush roll -> air inlet -> dust bin -> filter -> fan ->
            exhaust vent at the rear. Dirt stays in the bin.
   BUMP     driving toward the wall the bumper (sprung, it floats on the chassis) hits it, slides back and its tab
            presses a microswitch; the board stops the wheels, reverses 2 cm and turns (wheels run opposite ways).
            Cliff sensors under the rim watch for stairs; the wall sensor on the right side keeps its distance.
   LANES    it cleans in back-and-forth lanes, sucking up the dust and kibble it passes.
   HOME     the dock's IR beacon (three LEDs behind its smoked window) is picked up by the IR receiver at the robot's
            rear; the robot lines up in front of the dock, turns its back to it and reverses on until its charge pads
            sit on the dock's contacts. Charging starts again.
   EMPTY    lift the lid at the rear, take the bin (with its filter) out, tip it in the trash, put it back.
   KIBBLE   the cat flicks kibble out of its bowl onto the floor: something to clean up.

   Parts (each held by another):
   CASE     top cover . bumper (front 216 deg, floating) . rubber strip . lid . lidar turret cover with its window band .
            exhaust vent . wall-sensor window . IR receiver window . CLEAN and DOCK buttons with the status ring
   CHASSIS  base pan . cliff sensors x4 (on the pan, looking down) . charge pads (under the pan, at the rear)
   DRIVE    two wheel modules: wheel . gearbox . drive motor . encoder disc . suspension spring + bracket under the cover .
            front caster on its swivel mount
   CLEANING side brush + its motor . brush roll in its housing (gear case at the left end) . brush motor .
            air inlet sleeve . dust bin (with handle) . pleated filter on its side . fan sleeve . suction fan (impeller in
            its scroll) . fan motor on top of it . exhaust at the rear right
   SENSING  lidar: standoffs on the board . fixed base . turntable . drive belt . lidar motor . spinning head with the laser
            emitter and the receiver lens . bumper microswitches x2 with levers . bumper springs x2 . wall sensor .
            IR receiver . gyro on the board
   POWER    battery pack (8 cells, end holders) . BMS board . battery leads . main board (processor, gyro, Wi-Fi module,
            capacitors) . wires to the motors
   DOCK     sloped case . smoked IR window . IR beacon LEDs x3 . dock board . floor plate . two spring contacts . DC inlet .
            cord along the skirting to the wall socket . plug */

/* ---------- room ---------- */
const W = 90, D = 100, H = 19, WALL_H = 16, WT = 3, WF = 3.6;     // floor patch, wall height, wall thickness, wall face (skirting front)
const RR = 17.5, RIN = 16.8, RTOP = 8.5;                         // robot radius, inner wall radius, top of the cover
const DOCKX = 31.3, DOCKY = 62, APPR = [50, 62];                  // robot centre when docked, the approach point in front of the dock
const BOWL = [11, 93];
const DRIVE = 28, REVV = 14, TURNV = 210;                        // cm/s, cm/s, deg/s
const FLOORM = { l:'#e6bf86', m:'#cfa063', d:'#9c7140' };
const WALLM = { l:'#f4ede1', m:'#dfd5c4', d:'#bbb09d' };
const SKIRTM = { l:'#fffdf7', m:'#ebe7dc', d:'#c4beb0' };
const DOCKM = { l:'#615c56', m:'#48443f', d:'#2d2a27' };
const TYREM = { l:'#57524c', m:'#3b3733', d:'#24211e' };
const PANM = matOf('#7b7772'), HOUSM = matOf('#8d8f92'), GEARM = matOf('#b9b4a8');
const PCBM = { l:'#4fa36a', m:'#2f8a4a', d:'#1d5f31' }, CELLM = matOf('#4f86d6'), BINM = '#a9c3cf';
const BRISTM = matOf('#5b5650'), FLAPM = '#e2483d', COPPER = matOf('#d08a52'), YELM = matOf('#f2c230');
const BOWLM = matOf('#e2483d'), KIBM = matOf('#9a6431');
const rad = a => a*Math.PI/180;
const wrap180 = a => ((a + 540) % 360) - 180;

/* ---------- the robot's own frame: u forward, v to its left, z up ---------- */
let RX = DOCKX, RY = DOCKY, RCs = 1, RSn = 0;
const rvFrame = st => { RX = st.x; RY = st.y; RCs = Math.cos(rad(st.th)); RSn = Math.sin(rad(st.th)); };
const W3 = (u, v, z) => [RX + u*RCs - v*RSn, RY + u*RSn + v*RCs, z];
const dirW = (du, dv, dz = 0) => [du*RCs - dv*RSn, du*RSn + dv*RCs, dz];
const ringL = (cu, cv, r, z, n = 48, a0 = 0, a1 = 360) => Array.from({length: n}, (_, i) => { const a = rad(a0 + (a1 - a0)*i/(a1 - a0 === 360 ? n : n - 1)); return W3(cu + r*Math.cos(a), cv + r*Math.sin(a), z); });
const aabb = (pts, e = .05) => [[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - e), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + e)];
// sort parts given boxes in the robot's frame (so a turned robot still sorts by its own axes)
function lSort(parts){
  const V = [CAM_V[0]*RCs + CAM_V[1]*RSn, -CAM_V[0]*RSn + CAM_V[1]*RCs, CAM_V[2]];
  const dep = b => [0,1,2].reduce((a, k) => a + (b[0][k] + b[1][k])/2*V[k], 0);
  const sep = (p, q) => { for (let k = 0; k < 3; k++){ if (p.b[1][k] <= q.b[0][k] + 1e-6) return V[k] >= 0 ? -1 : 1; if (q.b[1][k] <= p.b[0][k] + 1e-6) return V[k] >= 0 ? 1 : -1; } return 0; };
  return parts.filter(Boolean).sort((p, q) => sep(p, q) || dep(p.b) - dep(q.b)).map(p => p.svg).join('');
}
// a hexahedron from 8 corners (bottom four, then the top four): every face that faces the viewer
function rvHexa(c, M, w = .6){
  const F = [[0,1,2,3],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]], cen = avg(c); let s = '';
  for (const fi of F){ const q = fi.map(i => c[i]); let n = norm(cross(sub(q[2], q[0]), sub(q[3], q[1])));
    if (!isFinite(n[0])) continue; if (dot(n, sub(avg(q), cen)) < 0) n = n.map(v => -v);
    if (vis(n)) s += shape(q, toneI(n, M), w); }
  return s; }
const lbox = (u0, v0, z0, u1, v1, z1, M, w = .6) => rvHexa([W3(u0,v0,z0), W3(u1,v0,z0), W3(u1,v1,z0), W3(u0,v1,z0), W3(u0,v0,z1), W3(u1,v0,z1), W3(u1,v1,z1), W3(u0,v1,z1)], M, w);
const lcyl = (u, v, z0, z1, r, M, w = .7, n = 20) => { const [x, y] = W3(u, v, 0); return cyl(x, y, z0, z1, r, M, toneI, w, n); };
const lrod = (a, b, r, M, w = .7, r1 = r, n = 16) => rod(W3(...a), W3(...b), r, M, toneI, w, r1, n);
const mw = w => `style="stroke-width:${f(w)}"`;
// wires: short pieces that sort on their own (local points)
function rvWire(pts, col, w = .28){
  const out = [];
  for (let i = 0; i < pts.length - 1; i++){ const a = pts[i], b = pts[i+1], d = pd([W3(...a), W3(...b)], false);
    let svg = `<path d="${d}" fill="none" stroke="${INK}" ${mw(2*w + .3)} stroke-linecap="round"/><path d="${d}" fill="none" stroke="${col}" ${mw(2*w)} stroke-linecap="round"/>`;
    out.push({ b: aabb([a, b], w), svg }); }
  return out; }
// a coil spring between two local points
function rvCoil(a, b, r, n = 9){
  const ax = norm(sub(b, a)), p1 = norm(cross(ax, Math.abs(ax[2]) < .9 ? [0,0,1] : [1,0,0])), pts = [];
  for (let i = 0; i <= n*2; i++){ const t = i/(n*2), o = i && i < n*2 ? (i % 2 ? r : -r) : 0; pts.push(W3(...[0,1,2].map(k => a[k] + (b[k] - a[k])*t + p1[k]*o))); }
  const d = pd(pts, false);
  return `<path d="${d}" fill="none" stroke="${INK}" ${mw(.55)} stroke-linejoin="round"/><path d="${d}" fill="none" stroke="#dfe4e6" ${mw(.25)} stroke-linejoin="round"/>`; }

/* ---------- the case ---------- */
const RB = [[16.4, .9], [17.3, 1.6], [17.5, 2.3], [17.5, 7.3], [17.2, 8.1], [16.4, RTOP]];
const bodyRings = (n = 48) => RB.map(([r, z]) => ringL(0, 0, r, z, n));
// a band round part of the side (local angles a0..a1), each strip only if it faces the viewer
function band(r, z0, z1, a0, a1, col, n = 24){
  let s = '';
  for (let i = 0; i < n; i++){ const b0 = a0 + (a1 - a0)*i/n, b1 = a0 + (a1 - a0)*(i + 1)/n, bm = rad((b0 + b1)/2);
    if (!facing(dirW(Math.cos(bm), Math.sin(bm)))) continue;
    const q = [[b0, z0], [b1, z0], [b1, z1], [b0, z1]].map(([a, z]) => W3(r*Math.cos(rad(a)), r*Math.sin(rad(a)), z));
    s += face(pd(q), typeof col === 'function' ? col(dirW(Math.cos(bm), Math.sin(bm))) : col); }
  return s; }
// ink along an arc of the side, only the part facing the viewer
function arcInk(r, z, a0, a1, w = .8, n = 30){
  let segs = [], cur = [];
  for (let i = 0; i <= n; i++){ const a = rad(a0 + (a1 - a0)*i/n);
    if (facing(dirW(Math.cos(a), Math.sin(a)))) cur.push(W3(r*Math.cos(a), r*Math.sin(a), z)); else { if (cur.length > 1) segs.push(cur); cur = []; } }
  if (cur.length > 1) segs.push(cur);
  return segs.map(q => ink(pd(q, false), w)).join(''); }
const LIDP = Array.from({length: 17}, (_, i) => { const a = rad(106 + 148*i/16); return [15.2*Math.cos(a), 15.2*Math.sin(a)]; });
const LID_HU = -15.2;                                                 // lid hinge at the rear
const lidPt = (u, v, z, k) => { const p = rad(105*k), d = u - LID_HU; return W3(LID_HU + d*Math.cos(p) - (z - RTOP)*Math.sin(p), v, RTOP + d*Math.sin(p) + (z - RTOP)*Math.cos(p)); };
function rvLid(st, m){
  const k = ease(st.lid), A = LIDP.map(([u, v]) => lidPt(u, v, RTOP - .5, k)), B = LIDP.map(([u, v]) => lidPt(u, v, RTOP + .02, k));
  const p = rad(105*k), nTop = dirW(-Math.sin(p), 0, Math.cos(p));
  let s = loft(A, B, n => tone(n, m));
  if (facing(nTop)) s += fill(pd(B), tone(nTop, m)) + ink(pd(B), .9);
  else s += fill(pd(A), mix(tone(nTop.map(x => -x), m), '#000000', .12)) + ink(pd(A), .9);
  return s + hullInk([...A, ...B], 1.2); }
function rvButtons(st, m){
  const runC = st.mode === 'run' ? '#43c25c' : st.mode === 'docked' && st.bat < 99.5 ? (Math.sin(st.t*4) > 0 ? '#f4a62a' : '#f7cf7c') : '#f2f0e8';
  let s = '';
  // status ring round CLEAN, then the two buttons with their marks
  s += fill(pd(ringL(10.2, 2.6, 1.95, RTOP + .02, 24)), runC) + ink(pd(ringL(10.2, 2.6, 1.95, RTOP + .02, 24)), .5);
  s += act('clean', cyl(...W3(10.2, 2.6, 0).slice(0, 2), RTOP, RTOP + .38, 1.35, matOf(mix(m.l, '#ffffff', .35)), toneI, .7, 20)
    + `<path d="${pd(ringL(10.2, 2.6, .62, RTOP + .4, 12, 130, 410), false)}${pd([W3(10.2 + .15, 2.6, RTOP + .4), W3(10.2 + .85, 2.6, RTOP + .4)], false)}" fill="none" stroke="${INK}" ${mw(.22)} stroke-linecap="round"/>`);
  s += act('dock', cyl(...W3(10.2, -2.6, 0).slice(0, 2), RTOP, RTOP + .38, 1.35, matOf(mix(m.l, '#ffffff', .35)), toneI, .7, 20)
    + `<path d="${pd([[9.6,-3.2],[10.4,-3.2],[10.85,-2.6],[10.4,-2.0],[9.6,-2.0]].map(([u, v]) => W3(u, v, RTOP + .4)))}" fill="none" stroke="${INK}" ${mw(.22)} stroke-linejoin="round"/>`);
  return s; }
function rvTurret(st, m){
  const [cx, cy] = W3(1, 0, 0);
  let s = cyl(cx, cy, RTOP - .1, RTOP + .3, 5.0, m, tone, .8, 36);
  const A = ringL(1, 0, 4.4, RTOP + .3, 36), B = ringL(1, 0, 4.4, 10.4, 36);
  s += loft(A, B, n => tone(n, m));
  s += loft(ringL(1, 0, 4.43, 9.25, 36), ringL(1, 0, 4.43, 9.95, 36), n => mix('#26232a', '#55505a', Math.max(0, dot(rotV(n), L))));   // the smoked window band
  if (st.lidar){ const a = rad(st.la); if (facing([Math.cos(a), Math.sin(a), 0])){ const [X, Y] = P(cx + 4.46*Math.cos(a), cy + 4.46*Math.sin(a), 9.6);
    s += `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(.9)}" fill="#ff5a4a" opacity=".45"/><circle cx="${f(X)}" cy="${f(Y)}" r="${f(.38)}" fill="#ff2a1a"/>`; } }
  s += fill(pd(B), tone([0,0,1], m)) + ink(pd(B), .9) + fill(pd(ringL(1, 0, 2.2, 10.42, 20)), mix(tone([0,0,1], m), '#000000', .06));
  return s + hullInk([...A, ...B], 1.4); }
// the bin's top part above the cover, and the bin clipped to the lid opening (closed view, lid up)
function rvBody(st, m, xr){
  const R = bodyRings();
  let s = '';
  for (let i = 0; i < R.length - 1; i++) s += loft(R[i], R[i+1], n => tone(n, m));
  // bumper: rubber strip round the front, seams; exhaust vent, wall-sensor window, IR receiver window
  s += band(17.56, 3.9, 4.7, -100, 100, n => tone(n, TYREM), 40);
  s += arcInk(17.53, 7.3, -108, 108, .8, 40) + arcInk(17.57, 3.9, -100, 100, .5, 40) + arcInk(17.57, 4.7, -100, 100, .5, 40);
  for (const a of [-108, 108]) if (facing(dirW(Math.cos(rad(a)), Math.sin(rad(a))))) s += line([W3(17.53*Math.cos(rad(a)), 17.53*Math.sin(rad(a)), 1.6), W3(17.53*Math.cos(rad(a)), 17.53*Math.sin(rad(a)), 7.3)], .8);
  for (let i = 0; i < 7; i++){ const a0 = 206 + i*5; s += band(17.53, 3, 6.4, a0, a0 + 2.6, '#2d2925', 1); }
  s += band(17.58, 5.4, 6.4, -81, -75, '#1f1c22', 2) + band(17.53, 5.0, 6.3, 176, 184, '#1f1c22', 2);
  // top: cover, lid seam (or the opening), buttons, turret
  const topR = R[R.length - 1];
  s += fill(pd(topR), tone([0,0,1], m));
  const lidO = LIDP.map(([u, v]) => W3(u, v, RTOP + .02));
  if (st.lid > .002) s += shape(lidO, '#2b2623', .9);
  else s += ink(pd(lidO), .9) + fill(pd([[-4.5,-1.8],[-3.9,-1.8],[-3.9,1.8],[-4.5,1.8]].map(([u, v]) => W3(u, v, RTOP + .03))), mix(tone([0,0,1], m), '#000000', .22));
  const top = [];
  if (st.lid > .002) top.push({ u: -16, svg: rvLid(st, m) });
  if (!xr && st.binUp > .002) top.push({ u: -12, svg: binAbove(st) });
  top.push({ u: 1, svg: rvTurret(st, m) }, { u: 10, svg: rvButtons(st, m) });
  top.sort((a, b) => facing(dirW(1, 0, 0)) ? a.u - b.u : b.u - a.u);
  if (!xr && st.binUp > .002) s += clipTo(lidO, rvBin(st, 0));
  s += top.map(t => t.svg).join('');
  s += hullInk(R.flat(), 2.6);
  return s; }
const binAbove = st => { const z0 = 1.6 + 9*ease(st.binUp); return z0 + 5.8 > RTOP ? rvBin(st, RTOP) : ''; };

/* ---------- the dust bin (local; zc = cut: draw only above this height) ---------- */
function rvBin(st, zc = 0){
  const up = 9*ease(st.binUp), op = 1 - st.binOut;
  if (op < .02) return '';
  const u0 = -15, u1 = -8.5, v0 = -6, v1 = 5.5, z0 = 1.6 + up, z1 = 7.4 + up, zb = Math.max(z0, zc);
  if (zb >= z1) return '';
  const c = [W3(u0,v0,zb), W3(u1,v0,zb), W3(u1,v1,zb), W3(u0,v1,zb), W3(u0,v0,z1), W3(u1,v0,z1), W3(u1,v1,z1), W3(u0,v1,z1)];
  const F = [[[0,0,-1],[0,1,2,3]], [[0,0,1],[4,5,6,7]], [[0,-1,0],[0,1,5,4]], [[1,0,0],[1,2,6,5]], [[0,1,0],[2,3,7,6]], [[-1,0,0],[3,0,4,7]]];
  let far = '', near = '';
  for (const [n, q] of F){ const nw = dirW(...n), pts = q.map(i => c[i]);
    if (facing(nw)) near += fill(pd(pts), BINM, 'opacity=".32"') + ink(pd(pts), .6);
    else far += fill(pd(pts), mix(BINM, '#4a5a62', .35), 'opacity=".5"'); }
  // dust inside, up to its level
  let dust = '';
  const dz = Math.min(z1 - .3, z0 + .15 + 5.3*st.bin);
  if (st.bin > .01 && dz > zb) dust = lbox(u0 + .3, v0 + .3, Math.max(zb, z0 + .15), u1 - .3, v1 - .3, dz, matOf('#9d958a'), .3)
    + fill(pd([[u0+1.5,v0+1.2],[u0+3.2,v0+1],[u0+2.6,v0+2.4]].map(([u, v]) => W3(u, v, dz + .02))), '#7d766c');
  // handle on the top, the filter on the right side
  const hdl = z1 > zc ? lrod([-12.6, -3, z1 + .1], [-12.6, 2.5, z1 + .1], .35, matOf('#6f6a64'), .5) : '';
  const flt = rvFilter(up, zb);
  const fF = facing(dirW(0, -1, 0));
  return `<g opacity="${f(op)}">` + (fF ? far + dust + near + flt : flt + far + dust + near) + hdl + `</g>`; }
function rvFilter(up, zc){
  const z0 = Math.max(2.2 + up, zc), z1 = 6.8 + up; if (z0 >= z1) return '';
  let s = lbox(-14, -6.6, z0, -9.5, -6, z1, matOf('#f6f2e6'), .5);
  if (facing(dirW(0, -1, 0))){ let pl = ''; for (let u = -13.5; u <= -9.9; u += .45) pl += pd([W3(u, -6.62, z0 + .2), W3(u, -6.62, z1 - .2)], false);
    s += `<path d="${pl}" fill="none" stroke="#b9b2a0" ${mw(.18)}/>`; }
  return s; }

/* ---------- working parts (see-through) ---------- */
function rvWheel(sg, ang){
  const v0 = sg > 0 ? 10.2 : -12.8, v1 = sg > 0 ? 12.8 : -10.2, zc = 3.6, r = 3.6;
  let s = lrod([0, v0, zc], [0, v1, zc], r, TYREM, .9, r, 24);
  let tr = '';
  for (let i = 0; i < 12; i++){ const a = ang + i*Math.PI/6; if (!facing(dirW(Math.cos(a), 0, Math.sin(a)))) continue;
    tr += pd([W3(r*Math.cos(a), v0 + .2, zc + r*Math.sin(a)), W3(r*Math.cos(a), v1 - .2, zc + r*Math.sin(a))], false); }
  if (tr) s += `<path d="${tr}" fill="none" stroke="#1b1916" ${mw(.3)}/>`;
  const vo = facing(dirW(0, 1)) ? v1 + .05 : v0 - .05;
  const ring = (rr, n) => Array.from({length: n}, (_, i) => { const a = i/n*2*Math.PI; return W3(rr*Math.cos(a), vo, zc + rr*Math.sin(a)); });
  s += shape(ring(2.3, 18), '#b9c0c3', .6);
  let sp = ''; for (let i = 0; i < 5; i++){ const a = ang + i*2*Math.PI/5; sp += pd([W3(.6*Math.cos(a), vo, zc + .6*Math.sin(a)), W3(2.15*Math.cos(a), vo, zc + 2.15*Math.sin(a))], false); }
  return s + `<path d="${sp}" fill="none" stroke="${INK}" ${mw(.4)}/>` + fill(pd(ring(.6, 10)), INK); }
function rvSideBrush(st){
  const cu = 11.5, cv = -9; let s = '';
  for (let i = 0; i < 3; i++){ const a = rad(st.sa + i*120);
    let br = '';
    for (const da of [-.13, -.04, .05, .14]){ let t = W3(cu + 6.8*Math.cos(a + da), cv + 6.8*Math.sin(a + da), .15);
      t = [Math.max(WF + .3, t[0]), Math.max(WF + .3, t[1]), t[2]];
      br += pd([W3(cu + 1*Math.cos(a), cv + 1*Math.sin(a), .4), t], false); }
    s += `<path d="${br}" fill="none" stroke="${INK}" ${mw(.42)} stroke-linecap="round"/><path d="${br}" fill="none" stroke="#6a625a" ${mw(.2)} stroke-linecap="round"/>`; }
  return s + lcyl(cu, cv, .25, .85, 1.25, matOf('#4a4642'), .6, 14) + lcyl(cu, cv, .85, 1.4, .35, METAL, .4, 8); }
function rvCaster(){
  return lbox(12.9, -.9, .9, 14.1, -.6, 2.4, GEARM, .4) + lrod([13.5, -.6, 1.1], [13.5, .6, 1.1], 1.1, TYREM, .6, 1.1, 14)
    + lbox(12.9, .6, .9, 14.1, .9, 2.4, GEARM, .4) + lcyl(13.5, 0, 2.4, 3.2, 1.25, DARK, .6, 14); }
function rvBrushRoll(st){

    if (q.get('homing') === '1') st.homing = true;
    if (q.has('run')){ clean(st); const n = Math.round(+q.get('run')*60); for (let i = 0; i < n; i++) stepSim(st, 1/60); }
    if (q.has('spill')){ spill(st); for (let i = 0; i < 60; i++) stepSim(st, 1/60); }
    if (q.has('empty')){ st.bin = .6; emptyBin(st); const n = Math.round(+q.get('empty')*60); for (let i = 0; i < n; i++) stepSim(st, 1/60); }
  },
});
xrMount(() => ui, () => '');
</script></body></html>
