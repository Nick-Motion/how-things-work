<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photo booth</title></head><body>
<script src="core.js"></script>
<script>
/* Photo booth — a coin-op street booth (the classic Photo-Me shape).
   x = depth 90 (front face x = W is lit, right side of the screen), y = width 150, z = up, 1 unit ~ 1 cm.

   TRUTH FIRST (how a real booth works):
   - You step through a side opening into a small cabin and pull a curtain across it. Light from the cabin and the flash
     stays in, street light stays out.
   - Pay: coins go in a slot on the outside. A coin acceptor checks each coin's size and metal with coils, sends good ones
     down a chute into a locked cash box and rejects bad ones to the return cup. The acceptor tells the IO board the credit.
   - Pose: you sit on a round stool that screws up and down on a threaded spindle so your face is in frame. You face the
     camera wall: a monitor shows the live picture, the camera looks through a smoked window above it ("look here").
   - Press start (or it counts down): the PC takes four shots, a few seconds apart. Before each, a 3-2-1 on screen. Each
     shot fires a xenon tube behind a big diffuser; the flash board charges capacitors to ~300 V and a trigger coil fires
     the tube. LED strips beside the tube are the modelling light that stays on so you can see yourself.
   - Print: a dye-sublimation printer in the machine side pulls paper off a roll, past a heated print head with a ribbon
     carrying yellow, magenta, cyan and a clear overcoat panel (four passes). A cutter cuts the strip and it drops down a
     chute into the delivery pocket on the outside. The strip is 4 frames.
   - Also: a cooling fan, a power supply and mains inlet, a cabin light, a lit roof sign, levelling feet.

   PARTS LIST (each held by something):
   BODY      plinth on 4 levelling feet; cabinet; partition at y = 61..64 splits the machine side (y < 61) from the cabin
   CABIN     side opening on the front face; curtain on a rail; seat (floor plate, sleeve, threaded spindle, plate, pad);
             camera wall with screen window, smoked lens window, LOOK HERE, speaker grille, start button, flash diffuser;
             cabin light on the ceiling
   CAMERA    shelf on the partition; camera body + viewfinder hump; lens to the window
   FLASH     reflector box on the partition, xenon tube, two LED modelling strips; capacitor shelf + 2 caps on the back
             wall; flash board on the back wall (transformer, trigger coil, transistor)
   CONTROL   PC on the floor; IO board on the back wall (relay, chip); monitor behind the screen; start switch; speaker
   PRINTER   shelf on the front wall; base; side plates; paper roll; feed rollers; platen; print head + bracket; ribbon
             supply/take-up spools + ribbon; cutter (anvil + blade); feed motor; strip chute down to the pocket
   COINS     coin plate with slot + return button; coin acceptor with its coil; coin chute; reject chute to the return cup;
             cash box with a lock, behind the lower service door
   POWER     mains inlet on the back, PSU, cooling fan + side grille, wires
   SIGN      lit box on the roof with a fluorescent tube */
const W = 90, D = 150, H = 195, Z0 = 6, HT = 211;
const OUT = rrUV(0, Z0, D, H, 4);
const OPN = { y0:70, y1:142, z0:12, z1:184 };                 // the side opening into the cabin, on the front face
const PKT = { y0:12, y1:28, z0:72, z1:102 };                  // the delivery pocket, on the front face
const SEATP = [60, 98], SEATZ = [48, 54, 60];
const LS = 21, SX = 84, SY0 = 17, SY1 = 23, EXIT = 112, ZREST = 73.2 + LS;
const PRICE = 4;
const PLAST = matOf('#e8e4da'), PCB = { l:'#4fa36a', m:'#2f8a4a', d:'#1d5f31' }, GREY = { l:'#7c8389', m:'#5c6369', d:'#3b4146' };
const BRASS = { l:'#f4d27a', m:'#d8b257', d:'#9c7a2c' }, PAPER = { l:'#fbfaf3', m:'#ecebe2', d:'#c9c6b8' };
const CURT = { l:'#5a6aa0', m:'#43507f', d:'#2a3253' }, WALLI = matOf('#e4dfd2'), CAMW = matOf('#4a4744');
const VINYL = { l:'#5b5550', m:'#3f3a36', d:'#262320' }, LITE = { l:'#fff6da', m:'#f4e6b8', d:'#d6c592' }, RUBBER = matOf('#3a3632');
const COPPER = { l:'#f0b07a', m:'#d08a52', d:'#9a5a2c' }, CAPM = { l:'#7e9ee0', m:'#5a7cc0', d:'#2f467a' };
const RECESS = '#2b2523', SKIN = '#e9b996', HAIR = '#3b2a20', BACKDROP = '#c3ccd0', SHIRT = '#4f78b8', CREAM = '#fff4d6';
const RIB = ['#f2d33a', '#e2479a', '#3fb6e0', '#e9eef0'];
const POSES = [{ du:0, tilt:0, grin:0 }, { du:-.06, tilt:10, grin:1 }, { du:.05, tilt:-8, grin:0 }, { du:0, tilt:0, grin:2 }];

/* ---------- small helpers ---------- */
const pbBox = pts => [[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - 1), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + 1)];
const txBk = (x,y,z,str,size,col=INK,weight=700) => `<text transform="${txM(P(x,y,z), Dv(0,1,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`;
const txYn = (x,y,z,str,size,col=INK,weight=700) => `<text transform="${txM(P(x,y,z), Dv(-1,0,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`;
const rectX = (x, y0, y1, z0, z1) => on(PX(x), rectUV(y0, z0, y1, z1));
const rectY = (y, x0, x1, z0, z1) => on(PY(y), rectUV(x0, z0, x1, z1));
const pbBend = (pts, r = 2.5) => { if (pts.length < 3) return pts; const out = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++){ const [a, b, c] = [pts[i - 1], pts[i], pts[i + 1]];
    const la = Math.hypot(...a.map((v, k) => v - b[k])), lc = Math.hypot(...c.map((v, k) => v - b[k])), d = Math.min(r, la/2.2, lc/2.2);
    const p = a.map((v, k) => b[k] + (v - b[k]) * d/la), q = c.map((v, k) => b[k] + (v - b[k]) * d/lc);
    for (let j = 0; j <= 5; j++){ const t = j/5; out.push([0,1,2].map(k => (1-t)*(1-t)*p[k] + 2*(1-t)*t*b[k] + t*t*q[k])); } }
  out.push(pts[pts.length - 1]); return out; };
// a wire cut into short pieces so each piece sorts on its own among the parts it passes
const pbWire = (pts, col, w = .55, L = 7) => { const q = pbBend(pts), out = [];
  for (let i = 0; i < q.length - 1; ){
    let j = i + 1, len = 0; while (j < q.length - 1 && len < L){ len += Math.hypot(...q[j].map((v, k) => v - q[j - 1][k])); j++; }
    if (len < L) while (j < q.length - 1) j++;
    const seg = q.slice(i, j + 1), d = pd(seg, false);
    let svg = `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${f(2*w + 1.1)}" stroke-linecap="round" stroke-linejoin="round"/>`
      + `<path d="${d}" fill="none" stroke="${col}" stroke-width="${f(2*w)}" stroke-linecap="round" stroke-linejoin="round"/>`;
    if (i === 0){ const [X, Y] = P(...q[0]); svg += `<circle cx="${f(X)}" cy="${f(Y)}" r="1.3" fill="${INK}"/>`; }
    if (j === q.length - 1){ const [X, Y] = P(...q[j]); svg += `<circle cx="${f(X)}" cy="${f(Y)}" r="1.3" fill="${INK}"/>`; }
    out.push({ box: pbBox(seg), svg }); i = j; }
  return out; };

/* ---------- a portrait on any plane: mp(u, v) -> 3D, u to the right as seen, v up ---------- */
function pbPortrait(mp, u0, v0, w, h, pose, seatN, shirt, big){
  const M = pts => pd(pts.map(([u, v]) => mp(u, v)));
  const hr = Math.min(w, h), cu = u0 + w/2, hu = cu + pose.du*w, hc = v0 + h*(.5 + .1*(seatN - 1)), nv = hc - .3*hr;
  const a = -pose.tilt*Math.PI/180, R = ([u, v]) => [hu + (u - hu)*Math.cos(a) - (v - nv)*Math.sin(a), nv + (u - hu)*Math.sin(a) + (v - nv)*Math.cos(a)];
  const ell = (u, v, ru, rv, n = 16) => ellUV(u, v, ru, rv, n).map(R);
  let s = fill(M(rectUV(u0, v0, u0 + w, v0 + h)), BACKDROP);
  const ry = Math.max(.05*h, nv - v0 + .02*hr);
  s += fill(M(Array.from({ length:13 }, (_, i) => { const t = i/12*Math.PI; return [cu + .44*w*Math.cos(t), v0 + ry*Math.sin(t)]; })), shirt);
  s += fill(M(rectUV(hu - .07*hr, nv - .04*hr, hu + .07*hr, nv + .1*hr).map(R)), mix(SKIN, '#000000', .12));
  s += fill(M(ell(hu, hc + .05*hr, .21*hr, .22*hr)), HAIR) + fill(M(ell(hu, hc - .02*hr, .17*hr, .2*hr)), SKIN);
  if (big){
    s += fill(M(ell(hu - .065*hr, hc + .02*hr, .022*hr, .022*hr, 8)) + M(ell(hu + .065*hr, hc + .02*hr, .022*hr, .022*hr, 8)), INK);
    const mo = pose.grin === 2 ? ell(hu, hc - .1*hr, .05*hr, .035*hr, 10)
      : pose.grin === 1 ? Array.from({ length:7 }, (_, i) => { const t = Math.PI*(1 + i/6); return [hu + .06*hr*Math.cos(t), hc - .08*hr + .035*hr*Math.sin(t)]; }).map(R)
      : ell(hu, hc - .1*hr, .055*hr, .01*hr, 8);
    s += fill(M(mo), pose.grin === 2 ? '#7a2a2a' : INK);
  }
  return s;
}
// four frames on a strip of paper: u0 left, vTop top, w wide, h tall
function pbFrames(mp, u0, vTop, w, h, seats, shirt, big = false){
  const g = w*.07, fh = (h - 5*g)/4, M = pts => pd(pts.map(([u, v]) => mp(u, v)));
  let s = fill(M(rectUV(u0, vTop - h, u0 + w, vTop)), PAPER.l);
  for (let i = 0; i < 4; i++){ const v1 = vTop - g - i*(fh + g);
    s += pbPortrait(mp, u0 + g, v1 - fh, w - 2*g, fh, POSES[i], seats[i], shirt, big); }
  return s + ink(M(rectUV(u0, vTop - h, u0 + w, vTop)), big ? .8 : .45);
}
// the real strip: thin paper standing on the plane x, from zTop down LS, seen only between zLo and zHi
function pbStrip(x, zTop, seats, zLo = -1e9, zHi = 1e9){
  const z0 = Math.max(zTop - LS, zLo), z1 = Math.min(zTop, zHi); if (z1 - z0 < .05) return '';
  let s = box(x - .12, SY0, zTop - LS, x + .12, SY1, zTop, PAPER, toneI, .5);
  if (vis([1,0,0])) s += pbFrames((u, v) => [x + .14, SY1 - u, v], 0, zTop, SY1 - SY0, LS, seats, SHIRT);
  return clipTo(on(PX(x), rectUV(SY0 - 3, z0, SY1 + 3, z1)), s);
}
/* ---------- the monitor picture, on the camera wall (y = 64, faces the seat) ---------- */
function pbScreen(st){
  const y = 64.08, R = (x0, z0, x1, z1, c, ex = '') => fill(pd(rectY(y, x0, x1, z0, z1)), c, ex);
  let s = R(46, 94, 74, 111, '#1b2a33');
  if (st.flash > .05) return s + R(46, 94, 74, 111, '#ffffff', `opacity="${f(Math.min(1, st.flash*1.4))}"`);
  const ph = st.phase, live = ph === 'shoot' || (ph === 'idle' && st.credit >= PRICE);
  if (live){
    s += pbPortrait((u, v) => [u, y + .02, v], 52, 94.5, 16, 16, POSES[Math.min(3, st.shots)], st.seat, SHIRT, true);
    if (ph === 'shoot' && st.count) s += txY(70.5, y + .04, 99, String(st.count), 7, '#ff4a3a', 800);
    else if (ph === 'idle') s += R(52, 95, 68, 98.6, '#1b2a33', 'opacity=".75"') + txY(60, y + .05, 96, 'PRESS START', 2.1, '#ffffff', 800);
  } else if (['print', 'eject', 'cut', 'drop'].includes(ph)){
    const p = ph === 'print' ? st.pt/2.8*.8 : ph === 'eject' ? .8 + st.pt/.7*.15 : .97;
    s += txY(60, y + .04, 104, 'PRINTING', 3, '#ffffff', 800) + R(50, 99, 70, 100.6, '#3b4a55') + R(50, 99, 50 + 20*Math.min(1, p), 100.6, '#7fe08a');
  } else if (ph === 'ready' || ph === 'take'){
    s += txY(60, y + .04, 104.5, 'THANK YOU', 3, '#ffffff', 800) + txY(60, y + .04, 99.5, 'PHOTOS OUTSIDE', 2, '#f4d27a', 800);
  } else s += txY(60, y + .04, 103.5, st.credit ? `PAID ${st.credit}.00` : 'INSERT 4.00', 3, '#ffffff', 800)
    + txY(60, y + .04, 98.5, '4 POSES', 2, '#f4d27a', 800);
  return s;
}

/* ---------- the cabin: camera wall, flash diffuser, start button, the seat ---------- */
function cabinParts(st, xr){
  const parts = [], put = (b, svg) => parts.push({ box: b, svg }), on1 = (a, b) => a ? b : '';
  const FY = vis([0,1,0]);
  // camera wall decals (only seen from the cabin side)
  if (FY){ const y = 64.04;
    let w = shape(rectY(y, 44.6, 75.4, 92.6, 112.4), '#2e2a28', .9) + pbScreen(st);
    w += clipTo(rectY(y, 54, 66, 115, 127), fill(pd(rectY(y + .02, 54, 66, 115, 127)), '#151a20', xr ? 'opacity=".35"' : '')
      + fill(pd(on(PY(y + .04), ellUV(60, 121, 3.4, 3.4, 18))), '#2a3d55', `opacity="${xr ? .3 : .9}"`)
      + fill(pd(on(PY(y + .05), ellUV(58.8, 122.4, .9, .9, 10))), '#ffffff', 'opacity=".6"'));
    w += ink(pd(on(PY(y), rrUV(54, 115, 66, 127, 2))), .9);
    w += txY(60, y + .02, 129.6, 'LOOK HERE', 2.4, '#f4d27a', 800);
    let dots = ''; for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) if (i*i + j*j <= 5) dots += pd(on(PY(y + .03), ellUV(32 + 1.6*i, 104 + 1.6*j, .45, .45, 6)));
    w += fill(dots, '#1b1917');
    put([[30, 63.9, 92], [76, 64.1, 131]], w); }
  // flash diffuser: an opal panel in front of the reflector
  { const g = st.flash;
    const d = box(37, 64, 136, 83, 65.2, 168, LITE, toneI, 1);
    const lit = g > .02 && vis([0,1,0]) ? fill(pd(rectY(65.3, 37, 83, 136, 168)), '#ffffff', `opacity="${f(g)}"`) + `<g filter="url(#pbBlur)" opacity="${f(.8*g)}">${fill(pd(rectY(65.4, 33, 87, 132, 172)), '#fffbe8')}</g>` : '';
    put([[37, 64, 136], [83, 65.2, 168]], (xr ? `<g opacity=".45">${d}</g>` : d) + lit); }
  // start button, below the screen
  put([[57.6, 64, 84.6], [62.4, 66.4, 89.4]], act('start', rod([60, 64, 87], [60, 64.8, 87], 2.4, METAL, toneI, .8)
    + rod([60, 64.8, 87], [60, st.phase === 'shoot' && st.pt < .2 ? 65.4 : 66.3, 87], 1.7, { l:'#8fe08f', m:'#45b04a', d:'#2a7a30' }, toneI, .8)));
  // the seat: floor plate, sleeve, threaded spindle, seat plate, vinyl pad (it screws up and down as it turns)
  const [sx, sy] = SEATP, sz = st.seatZ;
  put([[sx - 13, sy - 13, 12], [sx + 13, sy + 13, 14]], cyl(sx, sy, 12, 14, 13, METAL, toneI, 1, 28)
    + [0, 1, 2, 3].map(i => { const a = i*Math.PI/2 + .6; return cyl(sx + 10*Math.cos(a), sy + 10*Math.sin(a), 14, 14.6, .9, GREY, toneI, .5, 10); }).join(''));
  put([[sx - 3.6, sy - 3.6, 14], [sx + 3.6, sy + 3.6, 34]], cyl(sx, sy, 14, 34, 3.6, GREY, toneI, 1, 18));
  { let sp = cyl(sx, sy, 34, sz - 6, 2, METAL, toneI, .8, 14), th = '';
    const ph = (st.seatA/360*2) % 1;
    for (let z = 35 + ph*1.4; z < sz - 6.5; z += 1.4) th += pd([[sx + 1.4, sy - 1.4, z], [sx - 1.4, sy + 1.4, z + .7]], false);
    if (th) sp += `<path d="${th}" fill="none" stroke="${INK}" stroke-width=".5" opacity=".6"/>`;
    put([[sx - 2, sy - 2, 34], [sx + 2, sy + 2, sz - 6]], sp); }
  put([[sx - 9, sy - 9, sz - 6], [sx + 9, sy + 9, sz - 5]], cyl(sx, sy, sz - 6, sz - 5, 9, GREY, toneI, .8, 24));
  { const a = st.seatA*Math.PI/180;
    let pad = cyl(sx, sy, sz - 5, sz, 17, VINYL, toneI, 1.3, 32);
    pad += ink(pd(on(PZ(sz + .05), ellUV(sx, sy, 14.5, 14.5, 28))), .5);
    pad += ink(pd([[sx + 3*Math.cos(a), sy + 3*Math.sin(a), sz + .06], [sx + 14*Math.cos(a), sy + 14*Math.sin(a), sz + .06]], false), .7);
    put([[sx - 17, sy - 17, sz - 5], [sx + 17, sy + 17, sz]], act('seat', pad)); }
  if (xr) put([[40, 90, 190], [76, 122, 192]], box(40, 90, 190, 76, 122, 192, LITE, toneI, .8)
    + (vis([0,0,-1]) ? '' : `<g filter="url(#pbBlur)" opacity=".5">${fill(pd(on(PZ(189.8), rectUV(38, 88, 78, 124))), '#fff2c0')}</g>`));
  return parts;
}

// the cabin as seen through the side opening (closed case): walls, floor, then the parts
function cabinView(st){
  const FY = vis([0,1,0]), FYn = vis([0,-1,0]);
  let s = fill(pd(rectX(3, 64, 147, 12, 192)), toneI([1,0,0], WALLI));
  if (FY) s += fill(pd(rectY(64, 3, 90, 12, 192)), toneI([0,1,0], CAMW));
  if (FYn) s += fill(pd(rectY(147, 3, 90, 12, 192)), toneI([0,-1,0], WALLI));
  s += fill(pd(on(PZ(12), rectUV(3, 64, 90, 147))), mix(toneI([0,0,1], matOf('#8a8378')), '#000000', .1));
  s += ink(pd([[3, 64, 12], [3, 64, 192]], false), .8) + ink(pd([[3, 147, 12], [3, 147, 192]], false), .8)
    + ink(pd([[3, 64, 12], [3, 147, 12]], false), .8) + ink(pd([[3, 64, 12], [90, 64, 12]], false), .8) + ink(pd([[3, 147, 12], [90, 147, 12]], false), .8);
  s += byDepth(cabinParts(st, false));
  if (st.flash > .02) s += fill(pd(rectX(89.9, 60, 150, 0, 200)), '#fffdf0', `opacity="${f(.55*st.flash)}"`);
  // the jambs of the opening (the wall is 3 thick)
  if (FYn) s += fill(pd(rectY(70, 87, 90, 12, 184)), tone([0,-1,0], PLAST));
  if (FY) s += fill(pd(rectY(142, 87, 90, 12, 184)), tone([0,1,0], PLAST));
  return s;
}
/* ---------- see-through: the machine side (y < 61) ---------- */
const WOFF = '#3a3632', WON = '#ff8a3d';
function mechParts(st){
  const parts = [], put = (b, svg) => parts.push({ box: b, svg });
  const bx = (x0, y0, z0, x1, y1, z1, m, w = .8, op = 1) => put([[x0, y0, z0], [x1, y1, z1]], op < 1 ? `<g opacity="${op}">${box(x0, y0, z0, x1, y1, z1, m, toneI, w)}</g>` : box(x0, y0, z0, x1, y1, z1, m, toneI, w));
  const ph = st.phase, shoot = ph === 'shoot', printing = ph === 'print', paying = st.coins.length > 0;
  const glow = (d, c, op) => `<g filter="url(#pbBlur)" opacity="${f(op)}">${fill(d, c)}</g>`;
  // floors and the partition
  bx(3, 3, 6, 87, 61, 9, GREY, .7);
  bx(3, 64, 6, 87, 147, 12, matOf('#8a8378'), .7);
  bx(3, 61, 9, 87, 64, 192, WALLI, .8, .22);
  parts.push(...cabinParts(st, true));
  // camera on its shelf, looking through the smoked window
  bx(52, 47, 113, 68, 61, 116, GREY, .7);
  put([[54, 49, 116], [66, 58, 128.6]], box(54, 49, 116, 66, 58, 126, DARK, toneI, .9) + box(57, 50.5, 126, 63, 55, 128.6, DARK, toneI, .7)
    + (vis([0,1,0]) ? fill(pd(on(PY(58.05), ellUV(64.4, 124.6, .5, .5, 8))), shoot ? '#ff3a2a' : '#5a2a2a') : ''));
  put([[56.8, 58, 117.8], [63.2, 63.6, 124.2]], rod([60, 58, 121], [60, 63.6, 121], 3.2, DARK, toneI, .9)
    + (vis([0,1,0]) ? fill(pd(on(PY(63.65), ellUV(60, 121, 2.2, 2.2, 14))), '#3a6a9a') + fill(pd(on(PY(63.7), ellUV(59.2, 121.9, .6, .6, 8))), '#ffffff', 'opacity=".7"') : ''));
  // monitor behind the screen, start switch, speaker
  bx(45, 55, 93, 75, 61, 112, DARK, .8);
  bx(58, 57, 85, 62, 61, 89, PLAST, .6);
  put([[29, 55, 101], [35, 57, 107]], rod([32, 55, 104], [32, 57, 104], 1.8, GREY, toneI, .6));
  put([[27, 57, 99], [37, 61, 109]], rod([32, 57, 104], [32, 61, 104], 2.2, DARK, toneI, .7, 4.6));
  // flash: reflector box on the partition, xenon tube, LED modelling strips; caps + flash board on the back wall
  bx(37, 49, 136, 83, 50.5, 168, METAL, .7);
  bx(37, 50.5, 136, 38, 61, 168, METAL, .5); bx(82, 50.5, 136, 83, 61, 168, METAL, .5);
  bx(38, 50.5, 167, 82, 61, 168, METAL, .5); bx(38, 50.5, 136, 82, 61, 137, METAL, .5);
  for (const z of [141, 161]) put([[39, 50.5, z], [81, 52, z + 2]], box(39, 50.5, z, 81, 52, z + 2, LITE, toneI, .5)
    + (vis([0,1,0]) ? fill(pd(rectY(52.05, 40, 80, z + .4, z + 1.6)), '#fff8e0') : ''));
  { const g = st.flash, tube = rod([38, 55.5, 152], [82, 55.5, 152], 1.1, { l:'#f6fbff', m:'#dde8f0', d:'#b5c3cc' }, toneI, .7);
    put([[38, 54.4, 150.9], [82, 56.6, 153.1]], tube + (g > .02 ? `<g filter="url(#pbBlur)" opacity="${f(g)}">${rod([38, 55.5, 152], [82, 55.5, 152], 2.6, { l:'#ffffff', m:'#fffbe8', d:'#fff0c0' }, toneI, 0)}</g>` : '')); }
  bx(3, 38, 133, 24, 61, 136, GREY, .6);

// where the strip is: printing it, dropping it down the chute, resting in the pocket, or being taken
function pbStripAt(st){

  if (ph === 'eject') return { x:SX, zTop:EXIT + LS*(1 - ease(Math.min(1, t/.7))), zLo:73.2, zHi:EXIT };
  if (ph === 'cut') return { x:SX, zTop:EXIT, zLo:73.2, zHi:EXIT };
  if (ph === 'drop'){ const e = Math.min(1, t/.4); return { x:SX, zTop:EXIT - (EXIT - ZREST)*e*e, zLo:73.2, zHi:EXIT }; }
  if (ph === 'ready') return { x:SX, zTop:ZREST, zLo:73.2, zHi:EXIT };

      if (st.flash > .02) col = mix(col, '#fff4d0', st.flash*c*.35);
      cs.push({ at: avg(q), svg: face(pd(q), col) }); all.push(...q); }
    let cv = byDepth(cs) + ink(pd(Array.from({ length:N + 1 }, (_, i) => [xs(i), ys(i), z0]), false), 1.2)
      + ink(pd(Array.from({ length:N + 1 }, (_, i) => [xs(i), ys(i), z1]), false), 1) + hullInk(all, 2);
    let hooks = ''; for (let i = 0; i <= N; i += 2) hooks += pd([[xs(i), ys(i), z1], [93.5, ys(i), 187.5]], false);
    cv += ink(hooks, .7);
    mounted.push({ box: [[90.5, y1 - wd, z0], [96.6, y1, z1 + 1.6]], svg: act('curtain', `<g opacity="${f(1 - .72*k)}">${cv}</g>`) }); }
  mounted.push({ box: [[90, 66, 186.5], [94.3, 147, 188.5]], svg: box(90, 66, 186.5, 94.3, 68, 188.5, GREY, tone, .7)
    + box(90, 145, 186.5, 94.3, 147, 188.5, GREY, tone, .7) + rod([93.5, 68, 187.5], [93.5, 145, 187.5], .7, METAL, tone, .8) });
  { let pl = box(90, 46, 116, 91.2, 58, 134, METAL, tone, .9);
    if (FRONT) pl += fill(pd(rectX(91.25, 51.3, 52.7, 121.5, 129)), RECESS) + tx(91.3, 52, 130.4, 'COINS', 2, INK, 800)
      + fill(pd(rectX(91.25, 48, 56, 117.4, 120.6)), RECESS, 'opacity=".25"');
    pl += cylX(91.2, 92, 55, 119.2, 1.2, { l:'#f07a6a', m:'#d0453a', d:'#8a2a22' }, toneI, .7, 12);
    mounted.push({ box: [[90, 46, 116], [92, 58, 134]], svg: act('slot', pl) }); }
  for (const cn of st.coins){ const p = pbCoinAt(cn.u); if (p && p[0] >= 91.8) mounted.push({ box: [[p[0] - 1.3, 51.6, p[2] - 1.3], [p[0] + 1.3, 52.4, p[2] + 1.3]], svg: pbCoin(p) }); }
  { const sp = pbStripAt(st);
    if (sp && sp.x >= 90.5) mounted.push({ box: [[sp.x - .2, SY0, sp.zTop - LS], [sp.x + .2, SY1, sp.zTop]], svg: act('strip', `<g opacity="${f(sp.op)}">${pbStrip(sp.x, sp.zTop, st.fseat)}</g>`) }); }
  const front = byDepth(mounted);

  // ---- the lit sign on the roof ----
  let sign = box(62, 8, H, 86, 142, HT, LITE, tone, 1.2);
  if (FRONT) sign += tx(86.3, 75, 199.2, 'PHOTOS', 12, '#c0392b', 800);
  if (BACK) sign += txBk(61.7, 75, 199.2, 'PHOTOS', 12, '#c0392b', 800);
  if (LEFT) sign += txY(74, 142.3, 201, 'PHOTO', 5, '#c0392b', 800);
  if (RIGHT) sign += txYn(74, 7.7, 201, 'PHOTO', 5, '#c0392b', 800);
  if (k > 0) sign = `<g opacity="${f(1 - .65*k)}">${sign}</g><g opacity="${f(k)}">${rod([74, 12, 203.5], [74, 138, 203.5], 1.2, LITE, toneI, .7)
    + box(72, 20, H, 76, 22, 202, GREY, toneI, .5) + box(72, 128, H, 76, 130, 202, GREY, toneI, .5)}</g>`;
  // mains cable out of the inlet on the back and along the floor
  const cp = [[0, 50, 17], [-3, 50.5, 14], [-5, 51.5, 6], [-7, 52.5, 1.5], [-14, 54, 1], [-26, 54, 1]], cd = pd(cp, false);
  const cable = `<path d="${cd}" fill="none" stroke="${INK}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><path d="${cd}" fill="none" stroke="#3f3a36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  s += FRONT ? cable + body + sign + front : front + (BACK ? body + cable : cable + body) + sign;

  // ---- labels ----
  const ph = st.phase, shoot = ph === 'shoot', printing = ph === 'print', paying = st.coins.length > 0, out = ['eject', 'cut', 'drop'].includes(ph);
  if (k > .6) s += pbCallouts([
    { at:[60, 53, 126], text:'CAMERA', on:shoot }, { at:[60, 64, 115], text:'LENS WINDOW', on:shoot },
    { at:[74, 64, 102], text:'SCREEN', on:ph !== 'idle' || st.credit > 0 }, { at:[60, 66, 87], text:'START BUTTON', on:shoot && st.pt < .3 },
    { at:[32, 61, 104], text:'SPEAKER', on:shoot && st.count > 0 }, { at:[83, 65, 168], text:'FLASH DIFFUSER', on:st.flash > .05 },
    { at:[38, 55.5, 152], text:'FLASH TUBE', on:st.flash > .05 }, { at:[81, 52, 142], text:'MODELLING LIGHT', on:shoot },
    { at:[14, 55, 154], text:'CAPACITORS', on:shoot }, { at:[3, 30, 166], text:'FLASH BOARD', on:shoot },
    { at:[62, 23, 132], text:'PAPER ROLL', on:printing }, { at:[71, 25, 121.6], text:'FEED ROLLERS', on:printing },
    { at:[80, 20, 124], text:'PRINT HEAD', on:printing }, { at:[73, 24.5, 131], text:'INK RIBBON', on:printing },
    { at:[85, 25, 115], text:'CUTTER', on:ph === 'cut' }, { at:[85.4, 24, 106], text:'STRIP CHUTE', on:out },
    { at:[90, 28, 90], text:'PHOTO POCKET', on:ph === 'ready' }, { at:[84, 17, 80], text:'PHOTO STRIP', on:ph === 'ready' || ph === 'take' },
    { at:[91.2, 52, 129], text:'COIN SLOT', on:paying }, { at:[87, 58, 130], text:'COIN ACCEPTOR', on:paying },
    { at:[82, 54, 80], text:'COIN CHUTE', on:paying }, { at:[92, 55, 119.2], text:'COIN RETURN', on:false },
    { at:[86, 60, 30], text:'CASH BOX', on:paying }, { at:[3, 32, 72], text:'IO BOARD', on:paying || shoot },
    { at:[32, 6, 40], text:'PC', on:ph !== 'idle' }, { at:[28, 58, 20], text:'POWER SUPPLY', on:false },
    { at:[0, 50, 17], text:'MAINS INLET', on:false }, { at:[53, 7, 64], text:'COOLING FAN', on:printing },
    { at:[93.5, 145, 187.5], text:'CURTAIN RAIL', on:false }, { at:[96, 144 - 16 - 58*c, 120], text:'CURTAIN', on:c > 0 && c < 1 },
    { at:[SEATP[0] + 17, SEATP[1], st.seatZ], text:'SEAT', on:st.seatZ !== st.seatT }, { at:[SEATP[0] + 2, SEATP[1], st.seatZ - 8], text:'SPINDLE', on:st.seatZ !== st.seatT },
    { at:[84, 6, 1], text:'LEVELLING FEET', on:false },
  ], [0, 96, 0, D, 0, HT]);
  else { if (FRONT) s += tag([91.2, 52, 129], 46, -30, 'COIN SLOT', paying) + tag([W, 20, 90], 50, 18, 'PHOTO POCKET', ph === 'ready');
    s += tag([95, 144 - (16 + 58*c)/2, 120], -70, 40, 'CURTAIN', c > 0 && c < 1) + tag([74, 100, HT], -50, -30, 'SIGN', false); }
  return s;
}
/* ---------- behaviour: one state, one clock ---------- */
let ui, loopOn = false;
const BUSY = ['shoot', 'print', 'eject', 'cut', 'drop', 'take'];
function pbStep(st, dt){
  let busy = false;
  if (st.curt !== st.curtT){ st.curt = st.curtT > st.curt ? Math.min(st.curtT, st.curt + dt/.8) : Math.max(st.curtT, st.curt - dt/.8); busy = true; }
  if (st.seatZ !== st.seatT){ const d = Math.sign(st.seatT - st.seatZ)*Math.min(Math.abs(st.seatT - st.seatZ), 9*dt); st.seatZ += d; st.seatA += d*55; busy = true; }
  for (const cn of st.coins){ const was = cn.u; cn.u += dt/1.3; if (was < .55 && cn.u >= .55) st.credit++; }
  st.coins = st.coins.filter(cn => cn.u <= .85); if (st.coins.length) busy = true;
  st.flash = 0; st.cut = 0;
  if (BUSY.includes(st.phase)){ busy = true; st.pt += dt; const t = st.pt;
    if (st.phase === 'shoot'){ const i = Math.floor(t/1.1), tt = t - 1.1*i;
      if (t < 0){ st.count = 3; }
      else if (i >= 4){ st.phase = 'print'; st.pt = 0; st.count = 0; }
      else { st.count = tt < .81 ? 3 - Math.min(2, Math.floor(tt/.27)) : 0;
        if (tt >= .8){ st.flash = Math.max(0, 1 - (tt - .8)/.28); if (st.shots <= i){ st.shots = i + 1; st.fseat[i] = st.seat; } } } }
    else if (st.phase === 'print'){ st.fanA += dt*900; if (t >= 2.8){ st.phase = 'eject'; st.pt = 0; } }
    else if (st.phase === 'eject'){ st.fanA += dt*900; if (t >= .7){ st.phase = 'cut'; st.pt = 0; } }
    else if (st.phase === 'cut'){ st.cut = Math.sin(Math.PI*Math.min(1, t/.25)); if (t >= .25){ st.phase = 'drop'; st.pt = 0; st.cut = 0; } }
    else if (st.phase === 'drop'){ if (t >= .4){ st.phase = 'ready'; st.pt = 0; ui.flash('Your strip is in the pocket'); } }
    else if (st.phase === 'take'){ if (t >= .8){ st.phase = 'idle'; st.pt = 0; st.shots = 0; st.strips++; ui.flash('Four photos for 4.00'); } }
  }
  return busy;
}
function pbRun(){ if (loopOn) return; loopOn = true;
  ui.animate(dt => { const b = pbStep(ui.st, dt); if (!b) loopOn = false; return b; }); }
function pay(st){
  if (BUSY.includes(st.phase)) return ui.flash('Your photos are on the way');
  const due = PRICE - st.credit - st.coins.filter(cn => cn.u < .55).length;
  if (due <= 0) return ui.flash(st.coins.length ? 'Counting your coins' : 'Paid: press Take photos');
  for (let i = 0; i < due; i++) st.coins.push({ u: -i*.32 });
  pbRun();
}
function shoot(st){
  if (st.phase === 'ready') return ui.flash('Take your strip first');
  if (BUSY.includes(st.phase)) return ui.flash('Already taking photos');
  if (st.credit < PRICE) return ui.flash(st.coins.length ? 'Counting your coins' : 'Pay 4.00 first');
  st.credit -= PRICE; st.shots = 0; st.phase = 'shoot'; st.pt = st.curt < 1 ? -.7 : -.2; st.curtT = 1;
  pbRun();
}
function spin(st){ st.seat = st.seat % 3 + 1; st.seatT = SEATZ[st.seat - 1]; pbRun(); }
function curtain(st){ st.curtT = st.curtT ? 0 : 1; pbRun(); }
function takeStrip(st){
  if (st.phase === 'ready'){ st.phase = 'take'; st.pt = 0; return pbRun(); }
  if (BUSY.includes(st.phase) && st.phase !== 'take') return ui.flash('Your strip is not out yet');
  if (st.phase !== 'take') ui.flash('No strip yet: pay and take photos');
}

ui = mountFigure({
  fig:'05', turn:'full', title:'Photo booth',
  size:[97, D, HT], center:[W/2 + 3, D/2], palette:'tomato',
  state:{ curt:0, curtT:0, credit:0, coins:[], phase:'idle', pt:0, shots:0, flash:0, count:0, seat:2, seatZ:54, seatT:54, seatA:0, fanA:0, cut:0, fseat:[2, 2, 2, 2], strips:0 },
  scene,
  stats: st => [{ label:'Credit', value:st.credit.toFixed(2) }, { label:'Photos', value:`${st.shots}/4`, small:true }, { label:'Strips', value:String(st.strips), small:true }],
  buttons:[
    { label:'Pull the curtain', onClick:st => curtain(st) },
    { label:'Pay', onClick:st => pay(st) },
    { label:'Spin the seat', onClick:st => spin(st) },
    { label:'Take photos', onClick:st => shoot(st) },
    { label:'Take the strip', onClick:st => takeStrip(st) },
  ],
  acts:{ curtain:st => curtain(st), slot:st => pay(st), seat:st => spin(st), start:st => shoot(st), strip:st => takeStrip(st) },
  params:(st, q) => {
    if (q.has('curt')) st.curt = st.curtT = +q.get('curt');
    if (q.has('credit')) st.credit = +q.get('credit') | 0;
    if (q.has('seat')){ st.seat = Math.max(1, Math.min(3, +q.get('seat') | 0)); st.seatZ = st.seatT = SEATZ[st.seat - 1]; }
    if (q.has('flash')) st.flash = +q.get('flash');
    if (q.has('shots')) st.shots = +q.get('shots') | 0;
    if (q.has('count')){ st.phase = 'shoot'; st.count = +q.get('count') | 0; st.curt = st.curtT = 1; }
    if (q.has('print')){ st.phase = 'print'; st.pt = 2.8*+q.get('print'); st.shots = 4; st.fseat = [1, 2, 3, 2]; }
    if (q.get('strip') === 'ready'){ st.phase = 'ready'; st.shots = 4; st.fseat = [1, 2, 3, 2]; }
  },
});
xrMount(() => ui, () => '');
