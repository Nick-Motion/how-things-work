<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pin tumbler lock</title></head><body>
<script src="core.js"></script>
<script>
/* Pin tumbler lock: a section of a front door (44 mm thick) with a euro-profile key-and-thumbturn cylinder driving a
   mortise deadbolt, the door frame (jamb) beside it with its strike, all standing on a demo base board. Two keys lie on
   the board: the right key (brass) and a wrong key (nickel).
   Modelled large: 3 units = 1 mm. x = depth (outside face of the door at x = 167, inside face at x = 35),
   y = width (door edge at y = 95, the jamb at y = 20..86), z = up (board top at z = 10).

   How it really works:
   0. Locked: the bolt is thrown 17 mm out of the door edge into the strike box in the jamb. In the cylinder, five pin
      stacks (key pin, driver pin, spring) sit in chambers drilled through the housing into the plug. The springs push the
      stacks down, so every driver pin crosses the shear line (the gap between the plug and the housing) and the plug
      cannot turn.
   1. Insert the key: the blade slides into the keyway; the pins ride up the tip ramp and over the cuts (bitting) and
      drop into them. With the right key each cut lifts its key pin so the key pin's top sits exactly at the shear line:
      the drivers are all in the housing, the key pins all in the plug.
   2. Turn: the plug turns with the key. Its tail turns the clutch, the clutch turns the cam. The cam's lobe swings round
      the bottom, enters the fork under the bolt and carries the bolt 17 mm (a detent lever with two notches lets go and
      re-catches at each end). A full turn brings the key back upright, where the pins drop back in line and the key can
      come out. Turning the other way throws the bolt again.
   3. Wrong key: its cuts lift some key pins over the shear line and leave some drivers across it: the plug only rocks
      a few degrees and the bolt stays put.

   Parts (each held by another):
   DOOR      door section (painted faces, timber cut faces) . jamb with strike plate (2 screws) and strike box let into it
   CYLINDER  euro housing (outer half with the pins, inner half for the thumbturn) . plug . keyway . 5 pin chambers .
             chamber cover strip . 5 key pins . 5 driver pins . 5 springs . clutch . cam . bridge joining the halves with
             the threaded fixing hole . fixing screw from the forend . outside escutcheon . inside escutcheon .
             thumbturn on its spindle
   KEY       bow with ring hole . shoulder . blade with warding groove . bitting (5 cuts) . tip
   LOCK      mortise case (walls) . forend (2 screws) . deadbolt with guide slot and two detent notches . bolt fork .
             guide stud . detent lever on its pivot . detent leaf spring */
const BH = 10;
const DX0 = 35, DX1 = 167, DY0 = 95, DY1 = 305, DZ1 = 250;     // door section
const JY0 = 20, JY1 = 86;                                       // jamb
const YC = 230, ZC = 145;                                       // cylinder axis: 45 mm backset
const XE = 171, XF = 176;                                       // escutcheon front, cylinder face (outside)
const RP = 18, RH = 25.5, BW2 = 15, BIBT = ZC + 73.5, ZCOV = ZC + 66;
const XK0 = 89, XK1 = 96, XC1 = 106, XB0 = 26;                  // clutch, cam, inner half starts
const PIN_X = [164, 152, 140, 128, 116], PR = 4.5, DRV = 18;
const CUTS = { right:[-3, 6, 0, 9, 3], wrong:[6, -3, 9, 3, 0] };
const KP = CUTS.right.map(h => RP - h);                         // key pin lengths: tops at the shear line with the right key
const PIN_REST = -12, BLADE = 72;
const T_BOLT = 51, LOBE = 37.5, LOBE_R = 7.5, HUB = 22, SINW = .68;
const BX0 = 86, BX1 = 116, BZ0 = 35, BZ1 = 95, BTAIL = 285, FORK = 255.5;
const ESC = rrUV(YC - 34, ZC - 38, YC + 34, ZC + 96, 34);
const EURO = [[YC - BW2, BIBT], [YC + BW2, BIBT], ...arcUV(YC, ZC, RH, 54, -234, 26)];
const BRD = [0, 0, 245, 327];
const BRASS = { l:'#f4d684', m:'#dcb04e', d:'#9a742c' }, NICKEL = { l:'#eef1f3', m:'#c5ccd2', d:'#8a949c' };
const STEEL = { l:'#d9dee0', m:'#aab2b6', d:'#6f787d' }, WHITE = { l:'#fbf8f0', m:'#e6e1d3', d:'#bdb6a4' };
const CUTB = '#f8e6a6', CUTB2 = '#efd07a', HOLE = '#2b2523';
const BOARD_KEY = { right:[207, 255, BH + 4.5], wrong:[207, 115, BH + 4.5] }, READY = [XF + 76, YC, ZC];
const lkClamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp3 = (a, b, t) => a.map((v, i) => v + (b[i] - v)*t);
const rad = a => a*Math.PI/180;

/* ---------- small drawing helpers ---------- */
const quad = (n, pts, col, w = 1) => vis(n) ? shape(pts, col, w) : '';
const holed = (outer, hole, col, w = 1) => `<path d="${pd(outer)}${pd(hole)}" fill="${col}" fill-rule="evenodd"/>` + ink(pd(outer), w) + ink(pd(hole), w*.8);
const it = (b, svg) => ({ box: b, svg });
const bxi = (x0, y0, z0, x1, y1, z1, m, w = .8) => it([[x0, y0, z0], [x1, y1, z1]], box(x0, y0, z0, x1, y1, z1, m, toneI, w));
const boxOf = pts => [[0, 1, 2].map(i => Math.min(...pts.map(p => p[i]))), [0, 1, 2].map(i => Math.max(...pts.map(p => p[i])))];
const screwHead = (pts3, w = .8) => fill(pd(pts3), STEEL.l) + ink(pd(pts3), w);
// a profile in (y, z) swept along x, drawn as strips with known outward normals (for open or concave outlines)
function stripsX(pts, x0, x1, m, shade = toneI, closed = false){
  let s = ''; const n = pts.length, cen = [pts.reduce((a, p) => a + p[0], 0)/n, pts.reduce((a, p) => a + p[1], 0)/n];
  for (let i = 0; i < (closed ? n : n - 1); i++){ const p = pts[i], q = pts[(i + 1) % n];
    let nr = [0, q[1] - p[1], -(q[0] - p[0])]; const l = Math.hypot(nr[1], nr[2]) || 1; nr = nr.map(v => v/l);
    if ((p[0] + q[0])/2 - cen[0] < 0 === nr[1] > 0 && Math.abs(nr[1]) > .2) {}  // orientation checked below
    const mid = [(p[0] + q[0])/2 - cen[0], (p[1] + q[1])/2 - cen[1]];
    if (mid[0]*nr[1] + mid[1]*nr[2] < 0) nr = nr.map(v => -v);
    if (vis(nr)) s += face(pd([[x0, p[0], p[1]], [x1, p[0], p[1]], [x1, q[0], q[1]], [x0, q[0], q[1]]]), shade(nr, m)); }
  return s;
}
// the euro profile cylinder between x0 and x1 (closed, seen from outside)
function euroCyl(x0, x1, m, shade = tone){
  const bib = rectUV(YC - BW2, ZC, YC + BW2, BIBT), arc = arcUV(YC, ZC, RH, 54, -234, 26);
  let s = loft(on(PX(x0), bib), on(PX(x1), bib), n => shade(n, m)) + stripsX(arc, x0, x1, m, shade);
  const fx = vis([1, 0, 0]) ? x1 : vis([-1, 0, 0]) ? x0 : null;
  if (fx != null) s += fill(pd(on(PX(fx), EURO)), shade([fx === x1 ? 1 : -1, 0, 0], m)) + ink(pd(on(PX(fx), EURO)), 1.1);
  return s + hullInk([...on(PX(x0), EURO), ...on(PX(x1), EURO)], 1.8);
}
// a pill plate (escutcheon) between x0 and x1
function escPlate(x0, x1){
  const A = on(PX(x0), ESC), B = on(PX(x1), ESC), fx = vis([1, 0, 0]) ? B : vis([-1, 0, 0]) ? A : null;
  return loft(A, B, n => tone(n, NICKEL)) + (fx ? fill(pd(fx), tone(fx === B ? [1, 0, 0] : [-1, 0, 0], NICKEL)) + ink(pd(fx), 1.3) : '') + hullInk([...A, ...B], 2);
}
const rotYZ = (b, c, beta) => { const r = rad(beta); return [YC + b*Math.cos(r) - c*Math.sin(r), ZC + b*Math.sin(r) + c*Math.cos(r)]; };
const plugPt = (x, c, beta, b = 0) => [x, ...rotYZ(b, c, beta)];

/* ---------- the keys ---------- */
const keyH = (a, cuts) => { let h = Math.min(12, -7 + 1.3*(BLADE - a));
  cuts.forEach((c, i) => { h = Math.min(h, c + 1.25*Math.max(0, Math.abs(a - 12*(i + 1)) - 1.5)); }); return h; };
function bladePoly(cuts){
  const as = new Set(); for (let a = 0; a <= BLADE; a += 1.5) as.add(+a.toFixed(2));
  for (let i = 1; i <= 5; i++){ as.add(12*i - 1.5); as.add(12*i + 1.5); }
  const top = [...as].sort((p, q) => q - p).map(a => [a, keyH(a, cuts)]);
  return [[0, -13.5], [66, -13.5], ...top];
}
const BLADES = { right: bladePoly(CUTS.right), wrong: bladePoly(CUTS.wrong) };
function keyXf(o, psi, rho){
  const ps = rad(psi), r = rad(rho), u = [-Math.cos(ps), -Math.sin(ps), 0], v0 = [-Math.sin(ps), Math.cos(ps), 0];
  const B = [v0[0]*Math.cos(r), v0[1]*Math.cos(r), Math.sin(r)], Cc = [-v0[0]*Math.sin(r), -v0[1]*Math.sin(r), Math.cos(r)];
  return { u, B, Cc, T: (a, b, c) => [0, 1, 2].map(i => o[i] + a*u[i] + b*B[i] + c*Cc[i]), N: (na, nb, nc) => [0, 1, 2].map(i => na*u[i] + nb*B[i] + nc*Cc[i]) };
}
function clipA(poly, lo, hi){
  const cut = (pts, keep, edge) => { const o = []; for (let i = 0; i < pts.length; i++){ const p = pts[i], q = pts[(i + 1) % pts.length], kp = keep(p), kq = keep(q);
    if (kp) o.push(p); if (kp !== kq){ const t = (edge - p[0]) / (q[0] - p[0]); o.push([edge, p[1] + t*(q[1] - p[1])]); } } return o; };
  let r = cut(poly, p => p[0] >= lo, lo); if (r.length) r = cut(r, p => p[0] <= hi, hi);
  return r.length >= 3 && Math.max(...r.map(p => p[0])) - Math.min(...r.map(p => p[0])) > .5 ? r : null;
}
// a flat key piece: polygon in (a, c), b from -t to t
function slab(X, poly, t, M, extra){
  let ar = 0; poly.forEach((p, i) => { const q = poly[(i + 1) % poly.length]; ar += p[0]*q[1] - q[0]*p[1]; });
  const sg = ar > 0 ? 1 : -1, Fp = poly.map(([a, c]) => X.T(a, t, c)), Bp = poly.map(([a, c]) => X.T(a, -t, c));
  const fv = vis(X.B), front = fv ? Fp : Bp, back = fv ? Bp : Fp, bf = fv ? t : -t;
  let s = ink(pd(back), .8);
  poly.forEach((p, i) => { const q = poly[(i + 1) % poly.length], ea = q[0] - p[0], ec = q[1] - p[1], n = X.N(sg*ec, 0, -sg*ea);
    if (Math.hypot(ea, ec) > 1e-6 && vis(n)) s += face(pd([X.T(p[0], t, p[1]), X.T(q[0], t, q[1]), X.T(q[0], -t, q[1]), X.T(p[0], -t, p[1])]), toneI(norm(n), M)); });
  s += fill(pd(front), toneI(fv ? X.B : X.B.map(v => -v), M)) + (extra ? extra(bf) : '') + ink(pd(front), 1);
  return { svg: s, pts: [...Fp, ...Bp] };
}
function keyPose(st, which){
  const kt = st.key === which ? st.kt : 0;
  if (kt <= 1){ const e = ease(kt), o = lerp3(BOARD_KEY[which], READY, e); o[2] += 70*Math.sin(Math.PI*e); return { o, psi: 90*(1 - e), rho: 90*(1 - e), inLine: false }; }
  const e = ease(kt - 1); return { o: [READY[0] + (XF - READY[0])*e, YC, ZC], psi: 0, rho: st.beta, inLine: true };
}
// key pieces between a = lo and a = hi, as sorted items
function keyItem(st, which, lo = -1e9, hi = 1e9){
  const ps = keyPose(st, which), X = keyXf(ps.o, ps.psi, ps.rho), M = which === 'right' ? BRASS : NICKEL;
  const bow = rrUV(-60, -27, -6, 27, which === 'right' ? 14 : 27, 6), neck = rectUV(-8, -16, 0, 14);
  const hole = bf => { const ha = which === 'right' ? -47 : -44, hp = ellUV(ha, 0, 6, 6, 16).map(([a, c]) => X.T(a, bf, c));
    return fill(pd(hp), HOLE, 'opacity=".75"') + ink(pd(hp), .7) + ink(pd(rrUV(-56, -23, -10, 23, which === 'right' ? 11 : 23, 5).map(([a, c]) => X.T(a, bf*1.01, c))), .5); };
  const g0 = Math.max(4, lo), g1 = Math.min(62, hi), groove = bf => g1 - g0 > 1 ? ink(pd([X.T(g0, bf*1.02, -6), X.T(g1, bf*1.02, -6)], false), .7) : '';
  const pieces = [[bow, 4.5, hole], [neck, 3.2, null], [BLADES[which], 3, groove]].map(([p, t, ex]) => { const c = clipA(p, lo, hi); return c ? slab(X, c, t, M, ex) : null; }).filter(Boolean);
  if (!pieces.length) return null;
  const order = vis(X.u) ? pieces : pieces.slice().reverse();
  return { box: boxOf(order.flatMap(p => p.pts)), svg: order.map(p => p.svg).join(''), X };
}
// where the bottom of key pin i sits (plug frame, units above the axis)
function pinBottom(st, i){
  if (!st.key || st.kt <= 1) return PIN_REST;
  const ps = keyPose(st, st.key), a = ps.o[0] - XF + (XF - PIN_X[i]);
  return a >= 0 && a <= BLADE ? Math.max(PIN_REST, keyH(a, CUTS[st.key])) : PIN_REST;
}
const kpTop = (st, i) => pinBottom(st, i) + KP[i];
const aligned = st => [0, 1, 2, 3, 4].filter(i => Math.abs(kpTop(st, i) - RP) < 1.2).length;

/* ---------- the closed object ---------- */
function doorSvg(m){
  let s = '';
  const F = (n, pts, col, extra = '') => { if (vis(n)) s += fill(pd(pts), col) + extra + ink(pd(pts), 1.6); };
  F([-1, 0, 0], [[DX0, DY0, BH], [DX0, DY1, BH], [DX0, DY1, DZ1], [DX0, DY0, DZ1]], tone([-1, 0, 0], m));
  F([0, -1, 0], [[DX0, DY0, BH], [DX1, DY0, BH], [DX1, DY0, DZ1], [DX0, DY0, DZ1]], tone([0, -1, 0], m));
  F([1, 0, 0], [[DX1, DY0, BH], [DX1, DY1, BH], [DX1, DY1, DZ1], [DX1, DY0, DZ1]], tone([1, 0, 0], m));
  let g = ''; for (const x of [45, 61, 80, 97, 118, 133, 151]) g += pd([[x, DY1 + .2, BH + 2], [x + 2, DY1 + .2, 90], [x - 1, DY1 + .2, 170], [x + 1, DY1 + .2, DZ1 - 2]], false);
  F([0, 1, 0], [[DX0, DY1, BH], [DX1, DY1, BH], [DX1, DY1, DZ1], [DX0, DY1, DZ1]], tone([0, 1, 0], WOOD), `<path d="${g}" fill="none" stroke="${WOOD.d}" stroke-width=".8" opacity=".7"/>`);
  let gt = ''; for (const x of [52, 74, 99, 126, 150]) gt += pd([[x, DY0 + 6, DZ1 + .2], [x + 2, 200, DZ1 + .2], [x, DY1 - 6, DZ1 + .2]], false);
  F([0, 0, 1], [[DX0, DY0, DZ1], [DX1, DY0, DZ1], [DX1, DY1, DZ1], [DX0, DY1, DZ1]], WOOD.l, `<path d="${gt}" fill="none" stroke="${WOOD.d}" stroke-width=".8" opacity=".6"/>`);
  // paint edges on the timber cut faces
  if (vis([0, 0, 1])) s += ink(pd([[DX1 - 2, DY0, DZ1 + .3], [DX1 - 2, DY1, DZ1 + .3]], false), .6) + ink(pd([[DX0 + 2, DY0, DZ1 + .3], [DX0 + 2, DY1, DZ1 + .3]], false), .6);
  const cs = []; for (const x of [DX0, DX1]) for (const y of [DY0, DY1]) for (const z of [BH, DZ1]) cs.push([x, y, z]);
  return s + hullInk(cs, 2.8);
}
function strikePlate(){
  const out = [[71, 87.5, 16], [131, 87.5, 16], [131, 87.5, 114], [71, 87.5, 114]], hole = [[84, 87.5, 32], [118, 87.5, 32], [118, 87.5, 98], [84, 87.5, 98]];
  if (!vis([0, 1, 0])) return '';
  return fill(pd(hole.map(p => [p[0], 87.4, p[2]])), HOLE) + holed(out, hole, tone([0, 1, 0], BRASS), 1)
    + [24, 106].map(z => screwHead(on(PY(87.7), ellUV(101, z, 4.5, 4.5, 14)))).join('');
}
function jambSvg(){
  let s = '';
  s += quad([0, -1, 0], [[DX0, JY0, BH], [DX1, JY0, BH], [DX1, JY0, DZ1], [DX0, JY0, DZ1]], tone([0, -1, 0], WHITE), 1.4);
  s += quad([-1, 0, 0], [[DX0, JY0, BH], [DX0, JY1, BH], [DX0, JY1, DZ1], [DX0, JY0, DZ1]], tone([-1, 0, 0], WHITE), 1.4);
  s += quad([1, 0, 0], [[DX1, JY0, BH], [DX1, JY1, BH], [DX1, JY1, DZ1], [DX1, JY0, DZ1]], tone([1, 0, 0], WHITE), 1.4);
  if (vis([0, 1, 0])) s += shape([[DX0, JY1, BH], [DX1, JY1, BH], [DX1, JY1, DZ1], [DX0, JY1, DZ1]], tone([0, 1, 0], WHITE), 1.4) + strikePlate();
  s += quad([0, 0, 1], [[DX0, JY0, DZ1], [DX1, JY0, DZ1], [DX1, JY1, DZ1], [DX0, JY1, DZ1]], WOOD.l, 1.4);
  const cs = []; for (const x of [DX0, DX1]) for (const y of [JY0, JY1]) for (const z of [BH, DZ1]) cs.push([x, y, z]);
  return s + hullInk(cs, 2.6);
}
function forendSvg(){
  const y0 = 93, y1 = 95, fv = vis([0, -1, 0]), yf = fv ? y0 : y1;
  const out = [[68, yf, 16], [134, yf, 16], [134, yf, 244], [68, yf, 244]], hole = [[85, yf, 34], [117, yf, 34], [117, yf, 96], [85, yf, 96]];
  let s = quad([1, 0, 0], [[134, y0, 16], [134, y1, 16], [134, y1, 244], [134, y0, 244]], toneI([1, 0, 0], BRASS), .6)
    + quad([-1, 0, 0], [[68, y0, 16], [68, y1, 16], [68, y1, 244], [68, y0, 244]], toneI([-1, 0, 0], BRASS), .6)
    + quad([0, 0, 1], [[68, y0, 244], [134, y0, 244], [134, y1, 244], [68, y1, 244]], toneI([0, 0, 1], BRASS), .6);
  if (fv || vis([0, 1, 0])) s += holed(out, hole, tone(fv ? [0, -1, 0] : [0, 1, 0], BRASS), 1.1);
  if (fv){ for (const z of [28, 232]){ const h = on(PY(92.8), ellUV(101, z, 5, 5, 14)); s += screwHead(h) + ink(pd([[101, 92.7, z - 3.5], [101, 92.7, z + 3.5]], false), .8); }
    const h = on(PY(92.8), ellUV(101, 207, 5.5, 5.5, 14)); s += screwHead(h) + ink(pd([[97, 92.7, 207], [105, 92.7, 207]], false), .8) + ink(pd([[101, 92.7, 203], [101, 92.7, 211]], false), .8); }
  return s;
}
// bolt pieces split where it passes the forend and the strike plate (hidden bits inside them are skipped)
function boltItems(st, inner){
  const d = st.d, y0 = DY0 - d, y1 = BTAIL - d, cuts = [86, 87.5, 93, 95].filter(v => v > y0 + .01 && v < y1 - .01), ed = [y0, ...cuts, y1], out = [];
  for (let i = 0; i < ed.length - 1; i++){ const a = ed[i], b = ed[i + 1];
    if ((a >= 86 && b <= 87.5) || (a >= 93 && b <= 95)) continue;
    if (!inner && (b > 95.01 || a < 86)) continue;                     // closed view: only the bit in the gap shows
    let s = box(BX0, a, BZ0, BX1, b, BZ1, NICKEL, toneI, 1);
    if (b > 95.01){ const xf = vis([1, 0, 0]) ? BX1 + .2 : vis([-1, 0, 0]) ? BX0 - .2 : null;
      if (xf != null){ s += shape(on(PX(xf), rrUV(197 - d, 59, 263 - d, 71, 6, 4)), HOLE, .7);
        for (const ny of [215 - d, 266 - d]) s += fill(pd(on(PX(xf), rectUV(ny - 3, BZ0, ny + 3, BZ0 + 6))), HOLE); } }
    out.push(it([[BX0, a, BZ0], [BX1, b, BZ1]], s)); }
  return out;
}
function edgeSvg(st){
  const bolt = byDepth(boltItems(st, false));
  const endFace = st.d < 2 && vis([0, -1, 0]) ? shape(on(PY(DY0 - st.d - .1), rectUV(BX0, BZ0, BX1, BZ1)), tone([0, -1, 0], NICKEL), .9) : '';
  return vis([0, -1, 0]) ? forendSvg() + endFace + bolt : bolt;
}
function frontSvg(st){
  const parts = [escPlate(DX1, XE), euroCyl(XE, XF, BRASS)];
  if (vis([1, 0, 0])){
    const pf = on(PX(XF + .2), ellUV(YC, ZC, RP, RP, 28));
    let p = fill(pd(pf), tone([1, 0, 0], BRASS)) + ink(pd(pf), .9);
    const kw = [[-3, 13], [3, 13], [3, -2], [1, -5], [3, -8], [3, -15], [-3, -15], [-3, 4], [-1, 6], [-3, 8]];
    p += fill(pd(kw.map(([b, c]) => [XF + .3, ...rotYZ(b, c, st.beta)])), HOLE);
    parts.push(p);
  }
  return (vis([1, 0, 0]) ? parts : parts.reverse()).join('');
}
function thumbturnSvg(){
  const shaft = cylX(17, XB0, YC, ZC, 9, NICKEL, toneI, 1.1, 20);
  const pad = rrUV(YC - 5, ZC - 26, YC + 5, ZC + 26, 5, 5), A = on(PX(7), pad), B = on(PX(17), pad), fa = vis([-1, 0, 0]);
  const paddle = loft(A, B, n => toneI(n, NICKEL)) + (fa ? fill(pd(A), toneI([-1, 0, 0], NICKEL)) + ink(pd(A), 1) : fill(pd(B), toneI([1, 0, 0], NICKEL))) + hullInk([...A, ...B], 1.5);
  return fa ? shaft + paddle : paddle + shaft;
}
function backSvg(){
  const parts = [escPlate(31, DX0), euroCyl(XB0, 31, BRASS), thumbturnSvg()];
  return (vis([-1, 0, 0]) ? parts : parts.reverse()).join('');
}

/* ---------- see-through: the cylinder cut in half through its axis, and the lock case ---------- */
function halfHousing(x0, x1, sg){        // sg = -1 keeps y <= YC (seen from +y), +1 keeps y >= YC

function removeKey(st){
  if (!st.key) return ui.flash('There is no key in the lock');
  if (st.turnDir) return ui.flash('Let the key come back upright first');
  st.kT = 0; runLoop();
}

ui = mountFigure({
  fig:'47', turn:'full', title:'Pin tumbler lock', palette:'tomato',
  size:[245, 327, DZ1],
  state:{ key:null, kt:0, kT:0, beta:0, d:T_BOLT, turnDir:0, tt:0, wig:0 },
  scene,
  readout: st => st.d > T_BOLT/2 ? 'locked' : 'unlocked',
  stats: st => [{ label:'Pins at shear line', value:`${aligned(st)}/5` }, { label:'Bolt out', value:`${Math.round(st.d/3)} mm`, small:true }],
  buttons:[
    { label:'Insert key', choices: st => ['right', 'wrong'].map(w => ({ label: w === 'right' ? 'Right key' : 'Wrong key',
        current: st.key === w && st.kT === 2, disabled: !!st.key && st.key !== w, why:'Take the other key out first', onClick: st => insertKey(st, w) })) },
    { label:'Turn key', onClick: st => turnKey(st) },
    { label:'Take key out', onClick: st => removeKey(st) },
  ],
  params:(st, q) => {
    if (q.get('key') === 'right' || q.get('key') === 'wrong'){ st.key = q.get('key'); st.kt = st.kT = q.has('kt') ? +q.get('kt') : 2; }
    if (q.has('beta')) st.beta = +q.get('beta');
    if (q.has('bolt')) st.d = lkClamp(+q.get('bolt'), 0, 1)*T_BOLT;
  },
});
addEventListener('keydown', e => {
  if (/input|textarea|button/i.test(e.target.tagName)) return;
  const kk = e.key.toLowerCase(), st = ui.st;
  if (kk === 'k') insertKey(st, 'right'); else if (kk === 'w') insertKey(st, 'wrong'); else if (kk === ' ' || kk === 't') turnKey(st); else if (kk === 'r') removeKey(st); else return;
  e.preventDefault(); ui.render();
});
xrMount(() => ui, () => '');
</script></body></html>
