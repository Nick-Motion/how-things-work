<!doctype html>
<html lang="en" data-errors=""><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Special relativity</title></head><body>
<script src="core.js"></script>
<script>
/* Truth first. This is a teaching model of an ideal light-clock thought experiment, viewed in the platform frame.
   https://www.einstein-online.info/en/spotlight/light-clocks-time-dilation/
   https://openstax.org/books/physics/pages/10-2-consequences-of-special-relativity
   1. Select a constant inertial speed. Changing speed resets the pass, it does not simulate acceleration.
   2. Start both pulses together at their lower mirrors at platform time zero.
   3. Each pulse travels at c. The moving pulse has horizontal speed v and vertical speed c/gamma.
      A tick is one return to the lower mirror, not each reflection. Proper time on the train is t/gamma.
   4. Length contraction changes only the train's longitudinal dimensions by 1/gamma. Mirror height is unchanged.
      Turning the overlay off shows the uncontracted reference shape, not a different physical prediction.
   The bench model cannot reach relativistic speeds. Light paths, pulses, displayed ns and contraction are teaching
   overlays, slowed uniformly to read. The pass stops at 16 ns without wrapping or reversing the inertial train.
   Parts and attachments.
   TRACK: bench board; sleepers screwed to board; two rails held on sleepers.
   TRAIN: flatbed chassis on two axles; four wheels on axles, each tread on a rail; four axle bearings under chassis;
          two end beams and side panels on chassis. No invented engine or drive mechanism.
   CLOCKS: identical baseplates on chassis/platform; two posts bolted to each base; top crossbar on posts;
           lower mirror holder on base and upper holder under crossbar; mirror coatings face each other;
           lower-mirror return counter housed on base. Light and trail are overlays, not anatomy.
   PLATFORM: slab on four legs on the board; edge strip fixed to slab; stationary clock bolted to slab.
   State is {beta,t,running,contract}. Geometry, proper time, ticks and pulse phase derive from it. */
const relC = 10, relHeight = 26, relEnd = 16, relStart = 30;
const relGamma = beta => 1 / Math.sqrt(1 - beta * beta);
const relProper = st => st.t / relGamma(st.beta);
const relZ = time => { const p = (time * relC / relHeight) % 2; return relHeight * (p <= 1 ? p : 2 - p); };
const relX = st => relStart + relC * st.beta * st.t;
const relScale = st => st.contract ? 1 / relGamma(st.beta) : 1;
const relPulse = (st, moving, time) => [moving ? relStart + relC * st.beta * time : 99,
  moving ? 26 : 72, (moving ? 28 : 33) + relZ(time / (moving ? relGamma(st.beta) : 1))];
let relLoop = false;
let relFrame = null;
function relRun(st, ui){
  if (st.t >= relEnd){ st.t = 0; }
  st.running = !st.running;
  if (relLoop || !st.running) return;
  relLoop = true;
  ui.animate(dt => {
    if (!st.running){ relLoop = false; return false; }
    st.t = Math.min(relEnd, st.t + dt * 2);
    if (st.t >= relEnd){ st.running = false; relLoop = false; }
    return st.running;
  });
}
function relScene(st, m){
  const viewport=document.getElementById('fig').viewBox.baseVal;
  if(!relFrame) relFrame={height:viewport.height,oy:OY};
  viewport.height=innerWidth<=560?viewport.width*1.25:relFrame.height;
  OY=relFrame.oy+(viewport.height-relFrame.height)/2;
  const parts = [], labels = [], internal = [], k = ease(st.xr || 0), cx = relX(st), sx = relScale(st);
  const put = (pts, svg, name, hidden = false) => {
    const bounds = [[0,1,2].map(i => Math.min(...pts.map(p => p[i]))), [0,1,2].map(i => Math.max(...pts.map(p => p[i])))];
    (hidden ? internal : parts).push({box:bounds, svg});
    if (name) labels.push({at:avg(pts), text:name, on:false});
  };
  const bx = (a,b,mat,name,ghost=false,hidden=false) => put([a,b], `<g opacity="${ghost ? 1 - .85*k : 1}">${box(...a,...b,mat,toneI,1)}</g>`, name, hidden);
  const rr = (a,b,r,mat,name,hidden=false) => {
    const lo = a.map((v,i)=>Math.min(v,b[i])-r), hi = a.map((v,i)=>Math.max(v,b[i])+r);
    put([lo,hi], rod(a,b,r,mat,toneI,.9), name, hidden);
  };
  let svg = castShadow([[3,9,0],[214,9,0],[214,93,0],[3,93,0]]) + board(3,9,214,93,3,4,WOOD);
  svg += castShadow([[cx-22*sx,18,14],[cx+22*sx,34,14],[cx,26,57],[91,65,57],[107,79,57]],3,boardTop(3,9,214,93,3,4));
  for (let x=9;x<214;x+=10) bx([x,15,3],[x+4,37,5],BOARD,x===9?'TRACK SLEEPERS':null);
  for (const [y,name] of [[18,'FAR RAIL'],[34,'NEAR RAIL']]) bx([7,y-.8,5],[211,y+.8,7],METAL,name);
  const trackParts=parts.splice(0);
  for (const x of [84,114]) for(const y of [63,82]) bx([x,y,3],[x+3,y+3,19],BOARD,x===84&&y===63?'PLATFORM LEGS':null);
  bx([82,61,19],[119,87,23],BOARD,'PLATFORM SLAB');
  bx([82,61,23],[119,63,24],PALS.mustard,'PLATFORM EDGE');
  const platformParts=parts.splice(0);
  const at = (x,y,z) => [cx+x*sx,y,z];
  bx(at(-22,15,12),at(22,37,18),m,'TRAIN CHASSIS',true);
  for(const x of [-22,20]) bx(at(x,15,18),at(x+2,37,23),m,x<0?'REAR END BEAM':'FRONT END BEAM',true);
  for(const y of [15,36]) bx(at(-20,y,18),at(20,y+1,22),m,y===15?'NEAR SIDE PANEL':'FAR SIDE PANEL',true);
  for(const [x,prefix] of [[-14,'REAR'],[14,'FRONT']]){
    rr(at(x,15,11),at(x,37,11),.8,METAL,prefix+' AXLE',true);
    for(const y of [18,34]){
      bx(at(x-2,y-1.5,11),at(x+2,y+1.5,12),DARK,x===-14&&y===18?'AXLE BEARINGS':null,false,true);
      const a=at(x,y-1.2,11),b=at(x,y+1.2,11),r=4;
      const rings = [a,b].map(p=>on(PY(p[1]),ellUV(p[0],p[2],r*sx,r,20)));
      const wheel = loft(...rings,n=>toneI(n,DARK)) + shape(rings[vis([0,1,0])?1:0],DARK.m,1.3);
      put([[cx+(x-4)*sx,y-1.2,7],[cx+(x+4)*sx,y+1.2,15]],wheel,y===18?prefix+' WHEELS':null);
    }
  }
  function clock(x,y,bottom,scale,prefix,moving){
    const pt=(dx,dy,z)=>[x+dx*scale,y+dy,z+bottom-18];
    bx(pt(-9,-7,18),pt(9,7,25),METAL,prefix+' BASE');
    for(const dx of [-8,8]){
      rr(pt(dx,0,25),pt(dx,0,56),.75,METAL,prefix+(dx<0?' LEFT POST':' RIGHT POST'));
      bx(pt(dx-1,-1,25),pt(dx+1,1,26),DARK,null);
    }
    bx(pt(-9,-2,56),pt(9,2,58),m,prefix+' CROSSBAR');
    bx(pt(-5,-5,25),pt(5,5,27.5),DARK,prefix+' LOWER HOLDER');
    bx(pt(-5,-5,54.5),pt(5,5,56),DARK,prefix+' UPPER HOLDER');
    bx(pt(-5,-5,27.5),pt(5,5,28),METAL,prefix+' LOWER MIRROR');
    bx(pt(-5,-5,54),pt(5,5,54.5),METAL,prefix+' UPPER MIRROR');
    const count=Math.floor((moving?relProper(st):st.t)/(2*relHeight/relC)+1e-9);
    let counter=box(...pt(-4,3,25),...pt(4,7,28),DARK,toneI,.8);
    if(vis([0,1,0])) counter+=txY(x,y+7.05,bottom+8,String(count),2.2,'#8af0ae');
    put([pt(-4,3,25),pt(4,7,28)],counter,prefix+' RETURN COUNTER');
  }
  clock(cx,26,18,sx,'TRAIN',true);
  const trainParts=parts.splice(0);
  clock(99,72,23,1,'PLATFORM',false);
  svg += byDepth(trackParts) + byDepth([
    {box:[[cx-22*sx,15,7],[cx+22*sx,37,58]],svg:byDepth(trainParts)+(k>0?`<g opacity="${k}">${byDepth(internal)}</g>`:'')},
    {box:[[82,61,3],[119,87,63]],svg:byDepth(platformParts)+byDepth(parts)}
  ]);
  for(const moving of [false,true]){
    const half=relHeight/relC*(moving?relGamma(st.beta):1), pts=[relPulse(st,moving,0)];
    for(let time=half;time<st.t;time+=half) pts.push(relPulse(st,moving,time));
    pts.push(relPulse(st,moving,st.t));
    const color=moving?'#dc5936':'#287e91';
    svg += `<path data-overlay="${moving?'train':'platform'}-light-path" d="${pd(pts,false)}" fill="none" stroke="${color}" stroke-width="2.1" stroke-linejoin="round"/>`;
    const p=P(...pts[pts.length-1]);
    svg += `<circle data-overlay="${moving?'train':'platform'}-photon" cx="${f(p[0])}" cy="${f(p[1])}" r="${f(2.8)}" fill="#ffe26a" stroke="${INK}" stroke-width="1"/>`;
  }
  if(k>.6){
    const vb=document.getElementById('fig').viewBox.baseVal;
    const sorted=labels.map(it=>({...it,p:P(...it.at)})).sort((a,b)=>a.p[0]-b.p[0]);
    const half=Math.ceil(sorted.length/2);
    for(const [i,column] of [sorted.slice(0,half),sorted.slice(half)].entries()){
      column.sort((a,b)=>a.p[1]-b.p[1]);
      column.forEach((it,j)=>{
        const top=innerWidth<=560?.16:.34;
        const x=vb.width*(i?.86:.14),y=vb.height*(top+(.88-top)*j/(column.length-1));
        svg+=tag(it.at,(x-it.p[0])/INK_K,(y-it.p[1])/INK_K,it.text,it.on);
      });
    }
  }
  return svg;
}
const relUI = mountFigure({fig:'REL',title:'Special relativity',turn:'full',size:[220,100,67],palette:'tomato',
  state:{beta:.5,t:0,running:false,contract:false},scene:relScene,
  stats: st => [
    {label:'Speed',value:st.beta.toFixed(1)+' c',small:true},
    {label:'Lorentz factor',value:relGamma(st.beta).toFixed(3)},
    {label:'Platform clock',value:st.t.toFixed(2)+' ns',small:true},
    {label:'Train clock',value:relProper(st).toFixed(2)+' ns',small:true},
    {label:'Train length',value:st.contract?(100*relScale(st)).toFixed(1)+'%':'100% ref.',small:true}
  ],
  buttons:[
    {label:'Train speed',choices: st => [0,.5,.9].map(beta=>({label:beta.toFixed(1)+' c',current:st.beta===beta,onClick:(st,ui)=>{
      st.beta=beta;st.t=0;st.running=false;ui.flash('New inertial pass. Both clocks reset.');
    }}))},
    {label:'Start / pause clocks',onClick:relRun},
    {label:'Length contraction',onClick:(st,ui)=>{st.contract=!st.contract;ui.flash(st.contract?'Platform-frame length shown.':'Uncontracted reference shape shown.');}},
    {label:'Reset',onClick:(st)=>{st.t=0;st.running=false;}}
  ],
  params:(st,q)=>{
    const beta=Number(q.get('speed'));if(q.has('speed')&&[0,.5,.9].includes(beta))st.beta=beta;
    const t=Number(q.get('time'));if(q.has('time')&&Number.isFinite(t))st.t=Math.max(0,Math.min(relEnd,t));
    st.contract=q.get('contract')==='1';
  }
});
xrMount(()=>relUI,()=>'');
const relStyle=document.createElement('style');
relStyle.textContent='.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 14px;width:370px;align-items:start}.stat .v{font-size:24px}.stat.small .v{font-size:18px}#art .tag path{opacity:.45}@media(max-width:560px){.stats{width:100%;gap:8px}.stat .v{white-space:nowrap}}';
document.head.appendChild(relStyle);
addEventListener('resize',()=>relUI.render());
</script></body></html>
