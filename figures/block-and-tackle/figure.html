<!doctype html>
<html lang="en" data-errors=""><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Block and tackle</title></head><body>
<script src="core.js"></script><script>
/* Truth first. Source is the saved 2016 printed page 57 scan named in the brief.
   One rope starts at the upper becket, passes below L1, above U1, below L2,
   above U2, and so on through L5 and U5, then a distinct guide to the hand.
   Ten rope legs support the moving assembly. The guide adds no supporting leg.
   Pull shortens those legs and turns each sheave independently on its axle.
   Lower reverses that same path with the pulling end always held by a hand.
   Add load raises an external bench support under the pan, carries one spare
   specimen by hand onto its spindle, then withdraws the support.
   Teaching adaptations are the gantry, support jack, test specimens, hands,
   slowed motion and ideal force/travel readouts. Small fleet angles are drawn;
   the displayed 10:1 is the ideal parallel-strand limit. No friction is simulated.
   The upper fifth wheel uses a 60 degree wrap and the guide the remaining
   120 degrees, so both incoming and outgoing rope tangents remain continuous.
   Anatomy. Structure has two cheeks and one tiebar per block, a becket fixed
   to the upper cheek, and an axle held in each pair of cheeks. Mechanism has
   five loose sheaves per axle, each with a hub, groove and two flanges, plus
   a separate guide and axle held by a fork on the gantry. Load hook joins
   the lower tiebar to a hanger, spindle and pan. Rope touches every groove.
   Fixtures and specimens are distinct from anatomy and never counted as parts.
   Data shape is lift in cm, a phase (idle/pull/lower/exchange), and exchange
   progress. Geometry, rope travel, pan and sheave angles all derive from lift.
   Scope is this standalone figure, copied core, built page, metadata and proof.
*/
const btX = [28,34,40,46,52], btY = 36, btTop = 126, btR = 7.5;
const btGuide = [52,36-30*Math.sqrt(3)/2,141];
const btSteel = matOf('#859ca8'), btGold = matOf('#ecc15e'), btRope = '#e7a04a', btSkin = matOf('#e8ae87');
const btBounds = pts => [[0,1,2].map(i=>Math.min(...pts.map(p=>p[i]))-.1),[0,1,2].map(i=>Math.max(...pts.map(p=>p[i]))+.1)];
const btArc = (x,y,z,r,a,b,n=20) => Array.from({length:n+1},(_,i)=>{const t=(a+(b-a)*i/n)*Math.PI/180;return [x,y+r*Math.cos(t),z+r*Math.sin(t)];});
function btRoute(lift){
 const low=66+lift, q=[[28,btY-btR,112],[28,btY-btR,low]];
 for(let i=0;i<5;i++){
  q.push(...btArc(btX[i],btY,low,btR,180,360));
  q.push([btX[i],btY+btR,btTop]);
  q.push(...btArc(btX[i],btY,btTop,btR,0,i===4?60:180));
  if(i<4)q.push([btX[i+1],btY-btR,low]);
 }
 q.push(...btArc(...btGuide,btR,60,180));
 return q;
}
const btLength = q => q.slice(1).reduce((sum,p,i)=>sum+Math.hypot(...sub(p,q[i])),0);
const btInitialLength = btLength(btRoute(0));
function btHand(parts,at){
 const [x,y,z]=at;
 const put=(a,b,r,m)=>parts.push({box:btBounds([a.map(v=>v-r),b.map(v=>v+r)]),svg:rod(a,b,r,m,toneI,.7)});
 put([x+1,y-1,z],[x+5,y-3,z-2],2.2,btSkin);
 for(let i=0;i<3;i++)put([x-1+i*.9,y-1.7,z+1.2],[x-1+i*.9,y+1.5,z-.8],.65,btSkin);
 put([x+5,y-3,z-2],[x+10,y-6,z-3],2.6,matOf('#5a82c6'));
}
function btScene(st,m){
 const low=66+st.lift, k=ease(st.xr||0), parts=[], labels=[], put=(b,svg)=>parts.push({box:b,svg});
 const bx=(a,b,mat,w=.9)=>put([a,b],box(...a,...b,mat,tone,w));
 const rd=(a,b,r,mat=btSteel)=>put(btBounds([a.map(v=>v-r),b.map(v=>v+r)]),rod(a,b,r,mat,toneI,.8));
 const lab=(at,text,on=false)=>labels.push({at,text,on});
 let s=board(0,0,90,76,3,4,WOOD);
 s+=castShadow([[8,28,3],[12,44,3],[12,44,166],[70,44,166],[74,28,3]],3,boardTop(0,0,90,76,3,4));
 for(const x of [10,72]){
  bx([x-4,24,3],[x+4,48,6],btSteel);
  for(const [a,b] of [[6,55],[55,110],[110,162]])bx([x-1.7,34,a],[x+1.7,38,b],m);
 }
 bx([8,33,162],[74,39,167],m);
 for(const x of [25,55])rd([x,47,137],[x,36,162],1.2);
 function wheel(x,y,z,angle,guide=false){
  const mat=guide?btSteel:btGold;
  put([[x-.65,y-7.1,z-7.1],[x+.65,y+7.1,z+7.1]],cylX(x-.65,x+.65,y,z,7.1,mat,toneI,.7,32));
  for(const sg of [-1,1]){
   const xf=x+sg*.95;
   let faceSvg=cylX(xf-.22,xf+.22,y,z,8,mat,toneI,.8,32);
   if(vis([sg,0,0])){
    faceSvg+=line([[xf+sg*.24,y,z],[xf+sg*.24,y+6*Math.cos(angle),z+6*Math.sin(angle)]],1.3);
    faceSvg+=shape(on(PX(xf+sg*.25),ellUV(y,z,2,2,16)),METAL.l,.7);
   }
   put([[xf-.22,y-8,z-8],[xf+.22,y+8,z+8]],faceSvg);
  }
 }
 for(const [z,moving] of [[btTop,false],[low,true]]){
  for(const x of [24,56]){
   const shell=box(x-.6,25,z-11,x+.6,47,z+11,m,tone,1.1);
   put([[x-.6,25,z-11],[x+.6,47,z+11]],`<g opacity="${f(1-.85*k)}">${shell}</g>`);
  }
  bx([24,46,z-11],[56,48,z-8.5],m);
  if(!moving)bx([24,46,z+9],[56,48,z+11],m);
  for(let i=0;i<6;i++){
   const a=i===0?23:btX[i-1]+1.2, b=i===5?57:btX[i]-1.2;
   rd([a,btY,z],[b,btY,z],1.3,METAL);
  }
  for(let i=0;i<5;i++)wheel(btX[i],btY,z,(2*i+(moving?1:2))*st.lift/btR);
  lab([24,26,z],moving?'MOVING CHEEK':'FIXED CHEEK',moving&&st.phase!=='idle');
  lab([39,btY,z],moving?'LOWER AXLE':'UPPER AXLE');
 }
 for(const x of [50,54])rd([x,btGuide[1],141],[x,34,162],.9);
 rd([49,btGuide[1],141],[55,btGuide[1],141],1.1,METAL);
 wheel(...btGuide,10*st.lift/btR,true);
 rd([24,28.5,115],[28,28.5,112],1.2,btSteel);
 const rope=btRoute(st.lift), payout=btInitialLength-btLength(rope), hand=[52,btGuide[1]-btR,112-payout];
 rope.push(hand);
 let cursor=0;
 for(let i=0;i<rope.length-1;i++){
  const a=rope[i],b=rope[i+1],len=Math.hypot(...sub(b,a));if(len<.001)continue;
  const n=Math.max(1,Math.ceil(len/5));
  for(let j=0;j<n;j++){
   const a1=a.map((v,h)=>v+(b[h]-v)*j/n),b1=a.map((v,h)=>v+(b[h]-v)*(j+1)/n);
   const d=pd([a1,b1],false);
   put(btBounds([a1,b1]),`<path d="${d}" fill="none" stroke="${INK}" stroke-width="2.4" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${btRope}" stroke-width="1.4" stroke-linecap="round"/>`);
  }
  for(let mark=Math.ceil(cursor/13)*13;mark<cursor+len;mark+=13){
   const t=(mark-cursor)/len, pt=a.map((v,h)=>v+(b[h]-v)*t), pp=P(...pt);
   put(btBounds([pt]),`<circle cx="${f(pp[0])}" cy="${f(pp[1])}" r=".65" fill="#fff1c9"/>`);
  }
  cursor+=len;
 }
 btHand(parts,hand);
 rd([40,47,low-10],[40,36,low-13],1.4);
 const hook=btArc(40,36,low-16,3,90,340,18);
 for(let i=0;i<hook.length-1;i++)rd(hook[i],hook[i+1],.9,METAL);
 rd([40,36,low-18.8],[40,36,low-32],.7);
 const pan=low-34;
 bx([31,27,pan],[49,45,pan+2],btSteel);
 rd([40,36,pan+2],[40,36,pan+11],.65,METAL);
 const disc=(x,y,z)=>put([[x-6,y-6,z],[x+6,y+6,z+3]],cyl(x,y,z,z+3,6,DARK,toneI,1,28));
 disc(40,36,pan+2);
 for(let i=0;i<st.loads;i++)disc(40,36,pan+5+i*3);
 for(let i=st.loads;i<2;i++){
  let p=[79,57,3+i*3];
  if(st.phase==='exchange'&&i===st.loads){
   const t=Math.max(0,Math.min(1,(st.exchange-.4)/1.2));
   if(t<.3)p=[79,57,3+i*3+(pan+20-3-i*3)*ease(t/.3)];
   else if(t<.7){const e=ease((t-.3)/.4);p=[79-39*e,57-21*e,pan+20];}
   else p=[40,36,pan+20+(5+i*3-20)*ease((t-.7)/.3)];
   btHand(parts,[p[0]+4,p[1],p[2]+1.5]);
  }
  disc(...p);
 }
 const support=st.phase==='exchange'?Math.min(1,st.exchange/.4,Math.max(0,(2-st.exchange)/.4)):0;
 bx([29,26,3],[51,46,6],matOf('#b4afa2'));
 const jackTop=8+(pan-8)*support;
 rd([40,36,6],[40,36,jackTop-1],2.4,btSteel);
 bx([32,28,jackTop-1],[48,44,jackTop],btSteel);
 lab([28,28.5,112],'ROPE ANCHOR');lab([28,28.5,(low+112)/2],'CONTINUOUS ROPE',st.phase==='pull'||st.phase==='lower');
 for(let i=0;i<5;i++){
  lab([btX[i],btY,btTop+5],'UPPER SHEAVE '+(i+1),st.phase==='pull'||st.phase==='lower');
  lab([btX[i],btY,low-5],'LOWER SHEAVE '+(i+1),st.phase==='pull'||st.phase==='lower');
 }
 lab([52,btGuide[1],148.5],'GUIDE WHEEL',st.phase==='pull'||st.phase==='lower');
 lab([55,btGuide[1],141],'GUIDE AXLE');lab([40,34,low-18],'LOAD HOOK');
 lab([40,36,low-25],'LOAD HANGER');lab([48,44,pan+2],'LOAD PAN');
 s+=byDepth(parts);
 if(k>.6)s+=xrCallouts(labels,[20,58,4,49,pan,151]);
 return s;
}
function btMove(st,u,phase){
 if(st.phase!=='idle')return u.flash('Finish the current operation first');
 const target=phase==='pull'?Math.min(8,st.lift+4):Math.max(0,st.lift-4);
 if(target===st.lift)return u.flash(phase==='pull'?'At the bench travel limit':'The load is already lowered');
 const start=st.lift;let time=0;st.phase=phase;
 u.animate(dt=>{time=Math.min(1,time+dt/1.8);st.lift=start+(target-start)*ease(time);if(time===1){st.phase='idle';return false;}return true;});
}
function btAdd(st,u){
 if(st.phase!=='idle')return u.flash('Finish the current operation first');
 if(st.loads===2)return u.flash('Both spare specimens are on the pan');
 st.phase='exchange';st.exchange=0;
 u.animate(dt=>{st.exchange=Math.min(2,st.exchange+dt);if(st.exchange===2){st.loads++;st.phase='idle';return false;}return true;});
}
const btUI=mountFigure({fig:'57',turn:'full',title:'Block and tackle',size:[90,76,169],palette:'tomato',state:{lift:0,loads:0,phase:'idle',exchange:0},scene:btScene,
 stats:st=>[{label:'Moving weight',value:(120+50*st.loads)+' N'},{label:'Ideal effort',value:(12+5*st.loads)+' N'},{label:'Load rise',value:st.lift.toFixed(1)+' cm',small:true},{label:'Ideal rope drawn',value:(10*st.lift).toFixed(1)+' cm',small:true}],
 buttons:[{label:'Pull',onClick:(st,u)=>btMove(st,u,'pull')},{label:'Add load',onClick:btAdd},{label:'Lower',onClick:(st,u)=>btMove(st,u,'lower')}],
 params:(st,q)=>{for(const [key,max] of [['lift',8],['loads',2]]){const n=Number(q.get(key));if(q.has(key)&&Number.isFinite(n))st[key]=Math.max(0,Math.min(max,key==='loads'?Math.floor(n):n));}}
});
xrMount(()=>btUI,()=>'');
</script></body></html>
