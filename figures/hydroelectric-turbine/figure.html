   5. Reduce flow keeps head and electrical load fixed. Close gate removes drive and rotation decays under load.

   Flow and output are normalized qualitative comparisons, not a calibrated generator performance prediction.
   No adjustable guide vanes or generator internals. 1988 is inaccessible and unverified. No edition union claim.
   Parts. Hydraulic: gate in its seat, supply passage, tangential inlet, spiral casing, cover, guide vanes between
   guide rings, curved blades held by runner crown and band, central outlet and mouth.
   Drive: crown fixed to shaft, coaxial coupling, enclosed generator on bridge attached to casing support frame.
   Fixtures: reservoir on four legs, turbine support frame on board, separate catch tray, wired lamp on its base.
   Coordinates. Runner axis [88,48], r10.5, z44..59. Guides r12..16, z46..59. Casing r16..31, z43..63.
