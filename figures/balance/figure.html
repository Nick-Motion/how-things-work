<!doctype html>
<html lang="en" data-errors=""><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Balance</title></head><body>
<script src="core.js"></script>
<script>
/* Truth first.
   Book evidence is the suspended-pan balance on printed page 22 in the 1998 and 2016 editions.
   Equal distances from the central fulcrum let an unknown object balance known masses.
   The inaccessible 1988 edition is unverified. This is not a Roberval parallel-link balance.
   Representative construction adds three knife edges, bearing seats, a pointer and a fixed index.
   The US Army Mass Measurements lesson, double-pan balance, describes these construction details.
   https://armymunitions.tpub.com/mm0479/mm04790030.htm
   NIST describes oscillation about the center knife edge and a fixed pointer scale.
   https://tsapps.nist.gov/publication/get_pdf.cfm?pub_id=902420
   Parts. Structure is a base on a teaching tabletop, column on base, bearing plate on column.
   Mechanism is a central knife edge on that plate, two equal beam arms fixed to its carrier,
   two end knife edges fixed to the beam, bearing saddles below the end edges, three suspension
   wires per saddle, and two shallow pans hung from those wires. Pan rims are rolled physical edges.
   A beam-mounted pointer extends down in front of the column to a stationary zero index.
   No power, motors, parallel links or automatic loading hardware are claimed.
   Teaching actions move a blue unknown object and three 50 g masses by an implicit operator.
   Load carries the object from the tabletop over the rim into the positive-y pan.
   Add weight carries one 50 g mass from the tabletop into the opposing pan, three times.
   Compare lifts both sets of contents over the rims and carries them round opposite sides of the
   column before lowering them into the other pans. The pans and their suspension never swap.
   Repeated Load returns all contents to their table positions and stages the same unknown again.
   Supplies are conserved. In-flight objects do not count as supported pan loads.
   Both 16 cm horizontal moment arms shorten by cos(angle); opposed moments are m*g*arm.
   Tilt is an exaggerated, damped teaching indication, not a calibrated angular mass reading.
   Equal empty pan assemblies cancel. The beam's center of mass is below its central pivot.
   Timings compress slow real settling. Force arrows and arm dimensions are overlays, not anatomy.
*/
const balArm = 40, balPivot = [32,72,68], balBrass = matOf('#d6ad59');
const balState = {loaded:false, weights:0, swapped:false, phase:'idle', progress:0, angle:0, velocity:0, checked:false};
const balPoint = (y,z=0,x=32,a=balState.angle) => [x,72+y*Math.cos(a)-z*Math.sin(a),68+y*Math.sin(a)+z*Math.cos(a)];
const balBounds = (pts,r=0) => [[0,1,2].map(i=>Math.min(...pts.map(p=>p[i]))-r),[0,1,2].map(i=>Math.max(...pts.map(p=>p[i]))+r)];
const balSide = st => st.swapped ? -1 : 1;
const balPan = sign => { const p=balPoint(sign*balArm); return [p[0],p[1],p[2]-33]; };
const balTable = id => id==='object' ? [67,111,3] : [67,30+id*19,3];
const balSeat = (id,sign) => {const p=balPan(sign);const offsets=[[-4,-3],[4,-3],[0,4]];return id==='object' ? [p[0],p[1],p[2]+.8] : [p[0]+offsets[id][0],p[1]+offsets[id][1],p[2]+.8];};
function balMasses(st){
  let unknown=st.loaded ? 150 : 0, known=st.weights*50;
  if(st.phase==='comparing'||st.phase==='returning'){unknown=0;known=0;}
  return st.swapped ? [known,unknown] : [unknown,known];
}
function balTorque(st){const [left,right]=balMasses(st),arm=.16*Math.cos(st.angle);return [left*.00981*arm,right*.00981*arm];}
function balPosition(st,id){
  const sign=balSide(st)*(id==='object'?1:-1), loaded=id==='object'?st.loaded:id<st.weights;
  let start=loaded?balSeat(id,sign):balTable(id),end=start;
  const active=st.phase==='loading'&&id==='object'||st.phase==='adding'&&id===st.weights||st.phase==='comparing'&&loaded;
  if(!active)return start;
  if(st.phase==='loading'||st.phase==='adding')end=balSeat(id,sign);
  else end=balSeat(id,-sign);
  const t=st.progress, mixP=(a,b,q)=>a.map((v,i)=>v+(b[i]-v)*ease(q));
  const high=Math.max(start[2],end[2])+15;
  if(t<.22)return mixP(start,[start[0],start[1],high],t/.22);
  if(t>.78)return mixP([end[0],end[1],high],end,(t-.78)/.22);
  const q=(t-.22)/.56;
  if(st.phase!=='comparing')return mixP([start[0],start[1],high],[end[0],end[1],high],q);
  const lane=id==='object'?58:6;
  if(q<.2)return mixP([start[0],start[1],high],[lane,start[1],high],q/.2);
  if(q>.8)return mixP([lane,end[1],high],[end[0],end[1],high],(q-.8)/.2);
  return mixP([lane,start[1],high],[lane,end[1],high],(q-.2)/.6);
}
function balRun(st,ui){
  if(st.running)return;st.running=true;
  ui.animate(dt=>{
    if(st.phase!=='idle'&&st.phase!=='returning'){
      st.progress=Math.min(1,st.progress+dt/(st.phase==='comparing'?2:1.1));
      if(st.progress===1){
        if(st.phase==='loading')st.loaded=true;
        if(st.phase==='adding')st.weights++;
        if(st.phase==='comparing'){st.swapped=!st.swapped;st.checked=true;}
        st.phase='idle';
      }
    }
    const [left,right]=balMasses(st),target=Math.atan((right-left)/700);
    st.velocity+=(65*(target-st.angle)-12*st.velocity)*dt;st.angle+=st.velocity*dt;
    if(st.phase==='idle'&&Math.abs(target-st.angle)<.0002&&Math.abs(st.velocity)<.001){st.angle=target;st.velocity=0;st.running=false;return false;}
    return true;
  });
}
function balAct(action,st,ui){
  if(st.phase!=='idle')return ui.flash('Let the objects settle first');
  if(action==='load'){
    if(st.loaded){st.phase='returning';st.progress=0;ui.flash('Returning the same teaching masses to the table');
      const from=['object',0,1,2].map(id=>balPosition(st,id));
      ui.animate(dt=>{st.progress=Math.min(1,st.progress+dt/.9);st.returnFrom=from;
        if(st.progress===1){st.loaded=false;st.weights=0;st.swapped=false;st.checked=false;st.phase='loading';st.progress=0;st.returnFrom=null;balRun(st,ui);return false;}return true;});balRun(st,ui);return;}
    st.phase='loading';
  }
  if(action==='add'){
    if(!st.loaded)return ui.flash('Load the unknown object first');
    if(st.weights===3)return ui.flash('150 g of known masses already balances the object');
    st.checked=false;st.phase='adding';
  }
  if(action==='compare'){
    if(!st.loaded)return ui.flash('Load an object before comparing');
    st.phase='comparing';st.checked=false;
  }
  st.progress=0;balRun(st,ui);
}
function balScene(st,m){
  const xr=ease(st.xr||0),parts=[],labels=[];
  const put=(pts,svg,r=0)=>parts.push({box:balBounds(pts,r),svg});
  const tube=(a,b,r,material)=>put([a,b],rod(a,b,r,material,toneI,.9),r);
  const solid=(a,b,material)=>put([a,b],box(...a,...b,material,toneI,1));
  const label=(at,text,on=false)=>labels.push({at,text,on});
  let svg=board(0,0,88,144,3,5,WOOD);
  const shadow=[...on(PZ(3),ellUV(32,72,17,19)),...on(PZ(68),ellUV(32,72,3,42))];
  svg+=castShadow(shadow,3,boardTop(0,0,88,144,3,5));
  put([[14,54,3],[50,90,9]],cyl(32,72,3,9,18,m,tone,2));
  label([37,81,9],'BASE');
  for(const [lo,hi] of [[9,37],[37,59],[59,65]]){
    const body=cyl(32,72,lo,hi,3.7,m,tone,1.3);
    put([[28.3,68.3,lo],[35.7,75.7,hi]],`<g opacity="${1-.78*xr}">${body}</g>`);
  }
  label([32,75.7,29],'COLUMN');
  solid([25,67,65],[39,77,67],METAL);
  solid([26,68,67],[38,76,68],matOf('#b0b0a6'));
  label([36,73,68],'BEARING PLATE');
  for(const sign of [-1,1]){
    const a=balPoint(sign*2,-2),b=balPoint(sign*40,-2);
    tube(a,b,1.6,m);label(balPoint(sign*21,-2),sign>0?'LEFT EQUAL ARM':'RIGHT EQUAL ARM',st.running);
  }
  const knife=(y,central)=>{
    const base=central?3:-3;
    const prof=[balPoint(y-2.3,base,27),balPoint(y+2.3,base,27),balPoint(y,0,27)];
    const back=prof.map(p=>[37,p[1],p[2]]);
    let ksvg=loft(prof,back,n=>toneI(n,balBrass));
    ksvg+=shape(vis([1,0,0])?back:prof,balBrass.l,.8)+hullInk([...prof,...back],1.3);
    put([...prof,...back],ksvg);
    label(balPoint(y,0,37),central?'CENTRAL KNIFE EDGE':y>0?'LEFT END KNIFE':'RIGHT END KNIFE',st.running);
  };
  const carrier=[balPoint(-3,-3,30),balPoint(3,3,34)];
  put(carrier,rod(balPoint(0,-3),balPoint(0,3),3,m,toneI,1));
  knife(0,true);
  tube(balPoint(0,2),balPoint(0,2,40),.7,balBrass);
  tube(balPoint(0,2,40),balPoint(0,-21,40),.65,balBrass);
  const tip=balPoint(0,-22,40);
  put([tip,balPoint(-1.1,-19,40),balPoint(1.1,-19,40)],shape([tip,balPoint(-1.1,-19,40),balPoint(1.1,-19,40)],balBrass.m,.7));
  label(balPoint(0,-15,40),'POINTER',st.running);
  solid([39,63,44],[40,81,48],CERAMIC);
  for(let y=64;y<=80;y+=2)put([[40.1,y,44.5],[40.1,y,47.5]],line([[40.1,y,44.5],[40.1,y,y===72?47.5:46.5]],y===72?1:.5));
  tube([32,72,37],[39,72,44],.65,METAL);label([40,72,46],'ZERO INDEX');
  for(const sign of [-1,1]){
    const end=balPoint(sign*40),pan=balPan(sign);knife(sign*40,false);
    solid([end[0]-5,end[1]-3,end[2]],[end[0]+5,end[1]+3,end[2]+1],METAL);
    const apex=[end[0],end[1],end[2]+1];
    for(const deg of [90,210,330]){
      const a=deg*Math.PI/180,foot=[pan[0]+13*Math.cos(a),pan[1]+13*Math.sin(a),pan[2]+3.4];
      tube(apex,foot,.27,METAL);
    }
    label([pan[0]-6,pan[1]+3,pan[2]+18],sign>0?'LEFT SUSPENSION':'RIGHT SUSPENSION',st.running);
    const low=on(PZ(pan[2]),ellUV(pan[0],pan[1],10,10,32)),rim=on(PZ(pan[2]+3.5),ellUV(pan[0],pan[1],13,13,32));
    let shell=loft(low,rim,n=>toneI(n,balBrass),true)+shape(low,balBrass.l,.8)+loft(low,rim,n=>toneI(n,balBrass))+ink(pd(rim),1.3);
    put([...low,...rim],`<g opacity="${1-.55*xr}">${shell}</g>`);
    label([pan[0],pan[1]+7,pan[2]],sign>0?'LEFT PAN':'RIGHT PAN');
    label([pan[0]+13,pan[1],pan[2]+3.5],sign>0?'LEFT ROLLED RIM':'RIGHT ROLLED RIM');
  }
  for(const id of ['object',0,1,2]){
    let p=balPosition(st,id);
    if(st.phase==='returning'&&st.returnFrom){const from=st.returnFrom[id==='object'?0:id+1],to=balTable(id),q=ease(st.progress);p=from.map((v,i)=>v+(to[i]-v)*q+(i===2?16*Math.sin(Math.PI*q):0));}
    const [x,y,z]=p;
    if(id==='object')put([[x-4,y-4,z],[x+4,y+4,z+9]],box(x-4,y-4,z,x+4,y+4,z+9,PALS.cobalt,tone,1.7));
    else put([[x-3,y-3,z],[x+3,y+3,z+7]],cyl(x,y,z,z+4,3,balBrass,toneI,1)+cyl(x,y,z+4,z+6,1.1,balBrass,toneI,.7)+cyl(x,y,z+6,z+7,1.8,balBrass,toneI,.7));
  }
  svg+=byDepth(parts);
  if(xr>.01){
    let overlay='';
    for(const sign of [-1,1]){
      const p=balPoint(sign*40),z=p[2]+12,arrow=[[p[0],p[1],z],[p[0],p[1],z-9]];
      const mass=balMasses(st)[sign>0?0:1];
      if(mass)overlay+=`<g stroke="${sign>0?'#d05c40':'#466db4'}" stroke-width="1.6">${line(arrow,1.6).replaceAll(INK,sign>0?'#d05c40':'#466db4')}${line([[p[0],p[1]-2,z-6],arrow[1],[p[0],p[1]+2,z-6]],1.6).replaceAll(INK,sign>0?'#d05c40':'#466db4')}</g>`;
      const mid=balPoint(sign*20,10),[sx,sy]=P(...mid);
      overlay+=`<path d="${pd([balPoint(0,10),balPoint(sign*40,10)],false)}" fill="none" stroke="#466db4" stroke-width=".8" stroke-dasharray="2 1.5"/><text x="${sx}" y="${sy-2}" text-anchor="middle" font-size="2.5" fill="#466db4">16 cm</text>`;
    }
    svg+=`<g opacity="${xr}">${overlay}</g>`;
  }
  if(xr>.6)svg+=xrCallouts(labels,[6,78,16,128,3,74]);
  return svg;
}
const balUi=mountFigure({fig:'22',turn:'full',title:'Balance',size:[88,144,84],palette:'mustard',state:balState,scene:balScene,
  stats:st=>{const moments=balTorque(st);return [
    {label:'Known masses',value:`${st.weights*50} g`},
    {label:'Left / right moment',value:`${moments[0].toFixed(3)} / ${moments[1].toFixed(3)} Nm`,small:true},
    {label:'Comparison',value:st.phase!=='idle'?'Moving':!st.loaded?'Empty':st.weights===3?(st.checked?'Equal after swap':'Equal'):(st.checked?'Unequal after swap':'Unequal'),small:true}
  ];},
  buttons:[{label:'Load',onClick:(st,ui)=>balAct('load',st,ui)},{label:'Add weight',onClick:(st,ui)=>balAct('add',st,ui)},{label:'Compare',onClick:(st,ui)=>balAct('compare',st,ui)}],
  params:(st,q)=>{st.loaded=q.get('loaded')==='1';const n=Number(q.get('weights')||0);st.weights=st.loaded&&Number.isFinite(n)?Math.min(3,Math.max(0,Math.floor(n))):0;st.swapped=q.get('swapped')==='1';const [left,right]=balMasses(st);st.angle=Math.atan((right-left)/700);}
});
xrMount(()=>balUi,()=>'');
</script></body></html>
