/* Truth first. The inspected 2016 pages 68 and 69 show the complete crop path.
   Harvest sweeps eight finite model stalks into the reciprocating knife and opposed stalk auger,
   then the slatted elevator. Separate continues this feed into the cylinder and concave.
   Straw passes the rear beater and walkers to the rear ground. Grain and chaff pass the pan
   to two vibrating sieves. Fan air carries chaff out. Unthreshed heads return by auger and
   tailings elevator to the cylinder. Clean grain falls through both sieves, travels along
   the grain auger and up the grain elevator into the tank. Unload moves only stored grain
   up the unloading screw and along the spout into the external teaching trailer.
   Eight crop identities contain 24 grain, eight straw and 16 chaff tokens, conserved throughout.
   Teaching adaptation. Enlarged colored specimens, slowed staged actions, tray and trailer.
   Replace crop is specimen replacement, not combine self-repair. 1988 remains unverified.
   Parts and attachments.
   CASE/STRUCTURE. Chassis carries wheel axles, threshing housing, header feeder and operator
   platform. Tank rests on housing roof. Header tray carries knife guards and auger bearings.
   Reel shaft ends sit in two arms attached to header sidewalls. Tine bars join reel spokes.
   FEED. Reel spokes, shaft, tine bars and tines. Cutter bar, sliding knife and fixed fingers.
   Opposed auger flights on shaft. Elevator slats on a loop with end rollers, inside feeder.
   SEPARATION. Cylinder shaft in housing side bearings carries drum and rasp bars. Concave
   grate below drum fixed to housing. Beater shaft in sidewalls. Four walkers and grain pan
   supported from housing sides. Sieve frames carry transverse slats and cross wires. Fan
   rotor in scroll housing under pan. Return auger feeds attached tailings elevator and return.
   GRAIN. Clean-grain auger in bottom trough connects to side elevator and tank inlet. Tank
   outlet connects vertical unloading screw to horizontal unloading auger, casing and outlet.
   POWER/CONTROLS. The book's drive source is not detailed. No invented geartrain is drawn.
   Stage controls illustrate the named driven mechanisms without claiming independent operation.
*/

function cfAt(route,t){

}

function cfRun(phase,st,ui){
  if(st.phase!=='idle')return ui.flash('Wait for this batch to finish');
  if(phase==='harvest'&&st.harvest===1)return ui.flash('The crop tray is empty');
  if(phase==='separate'&&st.harvest!==1)return ui.flash('Harvest the model wheat first');
  if(phase==='separate'&&st.separate===1)return ui.flash('This batch is already separated');
  if(phase==='unload'&&st.separate!==1)return ui.flash('Separate the crop into the tank first');
  if(phase==='unload'&&st.unload===1)return ui.flash('The grain tank is empty');
  st.phase=phase;st.clock=0;
  const duration={harvest:5,separate:12,unload:5}[phase];
  ui.animate(dt=>{st.clock+=dt;st.rot+=dt*5;st[phase]=cfClamp(st.clock/duration);if(st[phase]===1){st.phase='idle';return false;}return true;});
}

const cfUI=mountFigure({fig:'68',title:'Combine harvester',size:[294,224,170],center:[147,112],palette:'tomato',turn:'full',state:cfFresh(),scene:cfScene,
  stats:st=>{const g=cfMaterial(st).filter(p=>p.kind==='grain');return [{label:'Tank grain',value:g.filter(p=>p.place==='tank').length,small:true},{label:'Trailer grain',value:g.filter(p=>p.place==='trailer').length,small:true}];},
  buttons:[{label:'Harvest',onClick:(st,ui)=>cfRun('harvest',st,ui)},{label:'Separate',onClick:(st,ui)=>cfRun('separate',st,ui)},{label:'Unload',onClick:(st,ui)=>cfRun('unload',st,ui)},{label:'Replace crop',onClick:(st,ui)=>{if(st.phase!=='idle')return ui.flash('Wait before replacing the teaching specimens');Object.assign(st,cfFresh());ui.flash('New model wheat; teaching collectors cleared');}}],
  params:(st,q)=>{for(const key of ['harvest','separate','unload'])if(q.has(key)){const v=Number(q.get(key));if(Number.isFinite(v))st[key]=cfClamp(v);}if(st.unload>0)st.separate=st.harvest=1;if(st.separate>0)st.harvest=1;}
});
xrMount(()=>cfUI,()=> '');
</script></body></html>
