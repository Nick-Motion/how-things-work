<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Steam locomotive</title></head><body>
<script src="core.js"></script>
<script>
/* Steam locomotive: a small red 0-4-0 well-tank engine (the kind that shunted yards and quarries) on a short length of
   track between two buffer stops. x = across the track (the +x side faces the viewer at the front view), y = along the
   track (the smokebox end is at high y), z = up. 1 unit ≈ 5 cm: driving wheels 1.2 m, gauge 1435 mm.

   Truth: coal burns on the grate at the bottom of the firebox. The fireman throws it in through the firehole door in
   the backhead (the back of the firebox, inside the cab); a brick arch makes the flames take a long path. The firebox
   sits inside the boiler's outer shell with water all round it, and the hot gas goes forward through the fire tubes in
   the barrel to the smokebox, boiling the water round them. Steam collects above the water and in the dome; the
   regulator valve in the dome, worked by a rod from the handle in the cab, lets it into the main steam pipe, through
   the smokebox and the outside steam pipes to the steam chest on top of each cylinder. A slide valve, driven from an
   eccentric on the driving axle through a rocking shaft, lets steam in at one end of the cylinder and out at the other,
   so it pushes the piston back and forth. The piston rod moves the crosshead along the slide bars and the connecting
   rod turns the crankpin on the driving wheel; a coupling rod turns the other pair of wheels with it. The two sides are
   set a quarter turn apart so the engine will start whatever the wheel position, so there are four exhaust beats a turn.
   The used steam goes up the blastpipe and out of the chimney in puffs; the blast draws air through the fire. A safety
   valve blows off when the pressure reaches its limit (160 psi here), the whistle runs on steam from the top of the
   firebox, the injector feeds water from the well tank under the cab into the boiler through the clack valve, and the
   sandboxes drop sand in front of the wheels for grip. The reverser sets which way the valves send the engine.
   Parts (each sits on, or is held by, another part):
   TRACK   ballast . sleepers and chairs . two rails . two buffer stops (uprights, struts, timber beam)
   FRAME   two plate frames . footplate and valance . two buffer beams . four buffers . coupling hooks . lamp
           . four axleboxes and their leaf springs . two sandboxes and sand pipes . four brake blocks
   BOILER  firebox (outer) . barrel and its brass bands . smokebox and door (hinges, dart) . chimney and cap . brass dome
           . two safety valves . whistle and its cord . two handrails . injector, delivery pipe and clack valve
   CAB     two side sheets with doorways . spectacle plate and windows . rear sheet and windows . roof . bunker and coal
           . coal hole . firehole and door . pressure gauge . water gauge . regulator handle . whistle handle
           . reverser lever . hand brake . shovel
   MOTION  four wheels (tyre, flange, spokes, balance weight, hub) . two axles . crankpins . two coupling rods . two
           connecting rods . two crossheads . slide bars and motion brackets . two cylinders and steam chests . outside
           steam pipes . piston rods . valve rods
   INSIDE  inner firebox . firebed and flames . brick arch . ash pan . boiler water . fourteen fire tubes . tube plate
           . regulator valve . regulator rod . main steam pipe . smokebox T-pipe . blastpipe . petticoat pipe . exhaust
           passages . pistons . slide valves . eccentrics and eccentric rods . rocking shaft . well tank and water . feed pipe */

const rad = d => d*Math.PI/180, lerp3 = (a, b, t) => a.map((v, i) => v + (b[i] - v)*t);
const toward = (v, to, d) => v + Math.max(-d, Math.min(d, to - v));
const STEEL = { l:'#d9dee0', m:'#a9b1b5', d:'#6f787d' }, IRON = { l:'#8a8f95', m:'#666b71', d:'#43474c' };
const BRASS = matOf('#d8b25a'), COPPER = matOf('#c8794a'), COALM = { l:'#5a5651', m:'#3e3b38', d:'#242220' };
const SLEEP = matOf('#8a6a4a'), BALLAST = matOf('#bdb19c'), ROOFM = matOf('#625d58'), DECK = matOf('#4c4844');
const WATERM = matOf('#8cc3e3'), BRICK = matOf('#b4553a'), TIMBER = matOf('#a8743f'), GLASS = '#3f4d58';

/* ---------- dimensions ---------- */
const TX = 30, RT = 8, AX = 20, WR = 12, CRK = 5, CROD = 55, AXY = [50, 90];
const CYO = 19.5, CYZ = 20, CY0 = 112.5, CY1 = 127.5, CYR = 5.5;
const FP0 = 33.5, FP = 35, BZ = 49.5, BR = 13, WL = 59;
const PH0 = rad(60), POSMAX = 31, VMAX = 28, ACC = 10, BRK = 14, COAST = 6, PMAX = 160;
const XO = (s, o) => TX + s*o;
const span = (s, a, b) => [Math.min(XO(s, a), XO(s, b)), Math.max(XO(s, a), XO(s, b))];
const yoff = st => 46 + st.pos;
const crankA = (st, s) => PH0 - st.pos/WR + (s < 0 ? Math.PI/2 : 0);
const pinAt = (st, s, yc) => { const a = crankA(st, s); return [yc + CRK*Math.cos(a), AX + CRK*Math.sin(a)]; };
const xheadY = (st, s) => { const [py, pz] = pinAt(st, s, AXY[0]); return py + Math.sqrt(CROD*CROD - (pz - CYZ)**2); };
const pistonY = (st, s) => xheadY(st, s) + 15;
const eccA = (st, s) => crankA(st, s) + st.rv*(Math.PI/2 + .35);
const valveD = (st, s) => 1.5*Math.cos(eccA(st, s));
const TUBES = [[22,52],[26,52],[30,52],[34,52],[38,52],[24,48],[28,48],[32,48],[36,48],[26,44],[30,44],[34,44],[28,40],[32,40]];

/* ---------- helpers (as in the four-stroke engine) ---------- */
const BB = (x0, y0, z0, x1, y1, z1) => [[x0, y0, z0], [x1, y1, z1]];
const it = (box, svg) => ({ box, svg });
const boxOf = (pts, e = .05) => [[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - e), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + e)];
const rodY = (x, z, y0, y1, r, m, sh = toneI, w = 1, n = 18) => rod([x, y0, z], [x, y1, z], r, m, sh, w, r, n);
function exY(prof, y0, y1, m, sh = toneI, w = 1.2){ const A = on(PY(y0), prof), B = on(PY(y1), prof), up = vis([0,1,0]);
  return loft(A, B, n => sh(n, m)) + shape(up ? B : A, sh([0, up ? 1 : -1, 0], m), .8) + hullInk([...A, ...B], w); }
function exX(prof, x0, x1, m, sh = tone, w = 1.6){ const A = on(PX(x0), prof), B = on(PX(x1), prof), fr = vis([1,0,0]);
  return loft(A, B, n => sh(n, m)) + shape(fr ? B : A, sh([fr ? 1 : -1, 0, 0], m), .8) + hullInk([...A, ...B], w); }
// a flat plate with a concave outline (a cab side with its doorway): side faces get their normals from the outline's
// winding, not from its centre, and the outline is inked as drawn (a hull would close the doorway)
function plate(uv, a0, a1, axis, m, sh = tone, w = 1.3){
  const pl = axis === 'x' ? PX : PY, A = on(pl(a0), uv), B = on(pl(a1), uv);
  let ar = 0; uv.forEach((p, i) => { const q = uv[(i + 1) % uv.length]; ar += p[0]*q[1] - q[0]*p[1]; });
  let s = '';
  for (let i = 0; i < uv.length; i++){ const j = (i + 1) % uv.length, du = uv[j][0] - uv[i][0], dv = uv[j][1] - uv[i][1];
    const nu = ar > 0 ? dv : -dv, nv = ar > 0 ? -du : du, n = norm(axis === 'x' ? [0, nu, nv] : [nu, 0, nv]);
    if (vis(n)) s += face(pd([A[i], A[j], B[j], B[i]]), sh(n, m)); }
  const nf = axis === 'x' ? [1,0,0] : [0,1,0], up = vis(nf);
  return s + shape(up ? B : A, sh(up ? nf : nf.map(v => -v), m), w);
}
// the far, inside walls of a box (a firebox or a tank seen through its ghosted shell)
function openBox(x0, y0, z0, x1, y1, z1, m){
  const F = [[[0,1,0],[[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]], [[1,0,0],[[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]],
    [[0,-1,0],[[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]], [[-1,0,0],[[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],
    [[0,0,-1],[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]]], [[0,0,1],[[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]]];
  return F.filter(([n]) => !vis(n)).map(([n, q]) => shape(q, toneI(n.map(v => -v), m), .6)).join('');
}
const boxEdge = (x0, y0, z0, x1, y1, z1, w = 1) => { const c = []; for (const x of [x0, x1]) for (const y of [y0, y1]) for (const z of [z0, z1]) c.push([x, y, z]); return hullInk(c, w); };
const strokeW = (pts, col, w) => { const d = pd(pts, false); return `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${f(2*w + .9)}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${col}" stroke-width="${f(2*w)}" stroke-linecap="round" stroke-linejoin="round"/>`; };
const bend = (pts, r = 1.2) => { if (pts.length < 3) return pts; const out = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++){ const [a, b, c] = [pts[i - 1], pts[i], pts[i + 1]];
    const la = Math.hypot(...a.map((v, k) => v - b[k])), lc = Math.hypot(...c.map((v, k) => v - b[k])), d = Math.min(r, la/2.2, lc/2.2);
    if (d < 1e-3){ out.push(b); continue; }
    const p = a.map((v, k) => b[k] + (v - b[k]) * d/la), q = c.map((v, k) => b[k] + (v - b[k]) * d/lc);
    for (let j = 0; j <= 4; j++){ const t = j/4; out.push([0,1,2].map(k => (1-t)*(1-t)*p[k] + 2*(1-t)*t*b[k] + t*t*q[k])); } }
  out.push(pts[pts.length - 1]); return out; };
const wireParts = (pts, col, w = .3, L = 4) => { const q = bend(pts, 1.6), out = [];
  for (let i = 0; i < q.length - 1; ){
    let j = i + 1, len = 0; while (j < q.length - 1 && len < L){ len += Math.hypot(...q[j].map((v, k) => v - q[j - 1][k])); j++; }
    if (len < L) while (j < q.length - 1) j++;
    const seg = q.slice(i, j + 1); out.push(it(boxOf(seg), strokeW(seg, col, w))); i = j; }
  return out; };
const along = (pts, s) => { const L = pts.slice(1).map((p, i) => Math.hypot(...sub(p, pts[i]))), T = L.reduce((a, b) => a + b, 0); let d = s*T;
  for (let i = 0; i < L.length; i++){ if (d <= L[i]) return lerp3(pts[i], pts[i + 1], d/L[i]); d -= L[i]; } return pts[pts.length - 1]; };
const dotAt = (p, r, col) => { const [X, Y] = P(...p); return `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(r)}" fill="${col}" stroke="${INK}" stroke-width=".4"/>`; };
// painted text on a side x = const; dir = the way it reads along y (-1 on the +x side, +1 on the -x side)
const txX = (x, y, z, str, size, dir) => `<text transform="${txM(P(x, y, z), Dv(0, dir, 0), Dv(0, 0, -1))}" font-size="${size}" fill="${BRASS.l}" stroke="${INK}" stroke-width=".4" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800">${str}</text>`;
// a brass band round the barrel: its outer face only (a capped rod would paint a brass disc over the barrel's end)
const bandY = (y, r) => { const A = on(PY(y - .45), ellUV(TX, BZ, r, r, 28)), B = on(PY(y + .45), ellUV(TX, BZ, r, r, 28));
  return loft(A, B, n => tone(n, BRASS)); };
const discY = (x, y, z, r, col, w = .7) => shape(on(PY(y), ellUV(x, z, r, r, 20)), col, w);

// core's byDepth sorts with a comparator that isn't transitive, and with a few hundred parts (a whole engine) that
// lets a far part land on a near one. Here: an edge only between parts that overlap on screen (box-separated pairs
// by their separation, others by centre depth), then a topological order, nearest-last; a cycle is broken at the
// remaining part with the fewest parts still to go before it.
// every axis that separates two boxes gives an order; if two axes disagree the parts cannot overlap on screen (2: no edge)
const sepAll = (p, q) => { if (!p.box || !q.box) return 0; let r = 0;
  for (let k = 0; k < 3; k++){ let o = 0;
    if (p.box[1][k] <= q.box[0][k] + 1e-6) o = CAM_V[k] >= 0 ? -1 : 1; else if (q.box[1][k] <= p.box[0][k] + 1e-6) o = CAM_V[k] >= 0 ? 1 : -1;
    if (o){ if (r && r !== o) return 2; r = o; } }
  return r; };
function zsort(parts){
  parts = parts.filter(Boolean); const n = parts.length;
  const d = parts.map(p => depthOf(p.at || boxMid(p.box))), sb = parts.map(p => { if (!p.box) { const q = P(...p.at); return [q[0], q[1], q[0], q[1]]; }
    let a = 1e9, b = 1e9, c = -1e9, e = -1e9; for (const x of [p.box[0][0], p.box[1][0]]) for (const y of [p.box[0][1], p.box[1][1]]) for (const z of [p.box[0][2], p.box[1][2]]){
      const q = P(x, y, z); a = Math.min(a, q[0]); b = Math.min(b, q[1]); c = Math.max(c, q[0]); e = Math.max(e, q[1]); } return [a, b, c, e]; });
  const after = Array.from({ length:n }, () => []), indeg = new Array(n).fill(0);
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++){
    const A = sb[i], B = sb[j]; if (A[2] < B[0] || B[2] < A[0] || A[3] < B[1] || B[3] < A[1]) continue;
    let o = sepAll(parts[i], parts[j]); if (o === 2) continue; if (!o) o = d[i] - d[j] < 0 ? -1 : 1;
    if (o < 0){ after[i].push(j); indeg[j]++; } else { after[j].push(i); indeg[i]++; } }
  const done = new Array(n).fill(false), out = [];
  for (let k = 0; k < n; k++){
    let pick = -1;
    for (let i = 0; i < n; i++) if (!done[i] && indeg[i] === 0 && (pick < 0 || d[i] < d[pick])) pick = i;
    if (pick < 0){ window.__zcyc = (window.__zcyc || 0) + 1; for (let i = 0; i < n; i++) if (!done[i] && (pick < 0 || indeg[i] < indeg[pick] || (indeg[i] === indeg[pick] && d[i] < d[pick]))) pick = i; }
    done[pick] = true; out.push(parts[pick].svg); for (const j of after[pick]) indeg[j]--; }
  return out.join('');
}

/* ---------- track (sleepers and ballast in world coordinates, drawn under everything) ---------- */
const SLEEPERS = Array.from({ length:24 }, (_, i) => 6 + i*10);
function groundSvg(){
  let s = board(0, 0, 60, 242, 3, 4, BALLAST);
  const sl = SLEEPERS.map(y => it(BB(6, y - 2, 3, 54, y + 2, 5), box(6, y - 2, 3, 54, y + 2, 5, SLEEP, tone, .9)
    + [-1, 1].map(s2 => { const [a, b] = span(s2, 13, 15.8); return box(a, y - 1.2, 5, b, y + 1.2, 5.8, IRON, toneI, .6); }).join('')));
  return s + zsort(sl);
}
// rails and buffer stops go in the moving engine's group, in its coordinates, so they sort against the wheels
function trackItems(Y){
  const L = [];
  for (const s of [-1, 1]){ const [a, b] = span(s, 13.7, 15.1);
    for (let y = -Y; y < 242 - Y - 1e-6; y += 11){ const y1 = Math.min(242 - Y, y + 11);
      L.push(it(BB(a, y, 5, b, y1, RT), box(a, y, 5, b, y1, RT, IRON, (n, m) => n[2] > .5 ? toneI(n, STEEL) : tone(n, m), .8))); } }
  for (const [gy, d] of [[15, -1], [227, 1]]){ const y0 = gy - Y, yb = y0 + (d < 0 ? -3 : 0), ye = yb + 3;
    for (const x of [10, 50]){
      L.push(it(BB(x - 1, Math.min(yb, ye), 5, x + 1, Math.max(yb, ye), 33), box(x - 1, yb, 5, x + 1, ye, 33, IRON, tone, 1.1)));
      const a = [x, y0 + d*1.5, 30], b = [x, y0 + d*13, 5.2];
      L.push(it(boxOf([a, b], .7), rod(a, b, .7, IRON, tone, 1)));
    }
    L.push(it(BB(4, yb, 22, 56, ye, 32), box(4, yb, 22, 56, ye, 32, TIMBER, tone, 1.4)
      + (vis([0, -d, 0]) ? shape(on(PY(d < 0 ? ye + .02 : yb - .02), rectUV(12, 24, 48, 30)), '#f2efe7', .7) + shape(on(PY(d < 0 ? ye + .03 : yb - .03), rectUV(12, 26.4, 48, 27.6)), '#c8372d', 0) : '')));
  }
  return L;
}

/* ---------- body: the paintwork and casings (ghosted in see-through) ---------- */
const CAB_SIDE = [[25,FP],[25,75.5],[52,75.5],[52,FP],[45,FP],[45,62], ...arcUV(38, 62, 7, 0, 180, 10).slice(1, -1), [31,62],[31,FP]];
const SPEC = [[5,FP],[5,75.5],[55,75.5],[55,FP],[43.3,FP],[43.3,54.5], ...arcUV(34, 54.5, 9.3, 0, 90, 6).slice(1), ...arcUV(26, 54.5, 9.3, 90, 180, 6), [16.7,FP]];
const FBOX = [[17,FP],[43,FP], ...arcUV(34, 54.5, 9, 0, 90, 6), ...arcUV(26, 54.5, 9, 90, 180, 6)];
const ROOF = [[57,75.5],[3,75.5], ...Array.from({ length:10 }, (_, i) => { const x = 3 + i*6; return [x, 76.5 + 2.6*(1 - ((x - 30)/27)**2)]; })];
const deckShade = R => (n, m) => n[2] > .5 ? tone(n, DECK) : tone(n, R);
function bodyItems(st, R){
  const L = [], sv = vis([1,0,0]) ? 1 : -1, sy = vis([0,1,0]);
  // footplate, buffer beams, frames
  L.push(it(BB(4, 12, FP0, 56, 139, FP), box(4, 12, FP0, 56, 139, FP, R, deckShade(R), 1.6)));
  for (const [y0, y1] of [[9, 12], [139, 142]]) L.push(it(BB(4, y0, 24, 56, y1, FP), box(4, y0, 24, 56, y1, FP, R, tone, 1.5)
    + (vis([0, y0 < 50 ? -1 : 1, 0]) ? shape(on(PY(y0 < 50 ? y0 - .02 : y1 + .02), rectUV(5, 24.6, 55, 25.6)), DECK.m, 0) : '')));
  for (const s of [-1, 1]){ const [a, b] = span(s, 9.8, 11); L.push(it(BB(a, 12, 13, b, 139, FP0), box(a, 12, 13, b, 139, FP0, R, tone, 1.2))); }
  // buffers and coupling hooks
  for (const x of [13, 47]){
    L.push(it(BB(x - 3, 2, 26, x + 3, 9, 32), [[7.5, rodY(x, 29, 6, 9, 2, DARK, tone, 1)], [4.5, rodY(x, 29, 3, 6, 1.2, STEEL, tone, .9)], [2.5, rodY(x, 29, 2, 3, 3, STEEL, tone, 1.1)]]
      .sort((p, q) => sy ? p[0] - q[0] : q[0] - p[0]).map(e => e[1]).join('')));
    L.push(it(BB(x - 3, 142, 26, x + 3, 149, 32), [[143.5, rodY(x, 29, 142, 145, 2, DARK, tone, 1)], [146.5, rodY(x, 29, 145, 148, 1.2, STEEL, tone, .9)], [148.5, rodY(x, 29, 148, 149, 3, STEEL, tone, 1.1)]]
      .sort((p, q) => sy ? p[0] - q[0] : q[0] - p[0]).map(e => e[1]).join('')));
  }
  L.push(it(BB(29, 142, 26.5, 31, 145, 29.5), box(29, 142, 26.5, 31, 145, 29.5, IRON, tone, .8)));
  L.push(it(BB(29, 6, 26.5, 31, 9, 29.5), box(29, 6, 26.5, 31, 9, 29.5, IRON, tone, .8)));
  // lamp on the front beam
  L.push(it(BB(16, 139.5, FP, 20, 141.8, 40), box(16, 139.5, FP, 20, 141.8, 39, DARK, tone, 1) + cyl(18, 140.6, 39, 40, 1.2, DARK, tone, .8)
    + (sy ? shape(on(PY(141.82), ellUV(18, 37, 1.3, 1.3, 14)), '#fff6c8', .7) : '')));
  // axleboxes and leaf springs
  for (const s of [-1, 1]) for (const yc of AXY){ const [a, b] = span(s, 11, 13);
    L.push(it(BB(a, yc - 7, AX - 3, b, yc + 7, 29.5), box(a, yc - 2.5, AX - 3, b, yc + 2.5, AX + 4, DARK, tone, 1)
      + box(a, yc - 1, AX + 4, b, yc + 1, 27, IRON, tone, .7) + box(a, yc - 7, 27, b, yc + 7, 28.2, STEEL, tone, .9) + box(a, yc - 5, 28.2, b, yc + 5, 29.5, STEEL, tone, .8))); }
  // bunker and coal
  L.push(it(BB(6, 12, FP, 54, 24, 58), box(6, 12, FP, 54, 24, 58, R, tone, 1.8)
    + txX(54.05, 18, 43, '7', 8, -1) + txX(5.95, 18, 43, '7', 8, 1)
    + (sy ? shape(on(PY(24.05), rectUV(23, 36, 37, 44)), DARK.d, .8) + [[25, 37], [28, 36.6], [31, 37.3], [34.5, 36.8]].map(([x, z]) => shape(on(PY(24.1), ellUV(x, z, 1.4, .9, 8)), COALM.l, .4)).join('') : '')));
  const ch = .6 + 5*st.coal/20, CA = on(PZ(58), rectUV(6.6, 12.6, 53.4, 23.4)), CB = on(PZ(58 + ch), rectUV(11, 14.5, 49, 21.5));
  L.push(it(BB(6.6, 12.6, 58, 53.4, 23.4, 58 + ch), loft(CA, CB, n => toneI(n, COALM)) + shape(CB, COALM.l, .7)
    + [[16, 16], [24, 19], [31, 15.5], [38, 18.5], [44, 16.5], [20, 20.5], [35, 20.8]].map(([x, y]) => dotAt([x, y, 58 + ch], .55*INK_K, COALM.d)).join('')));
  // cab: side sheets, spectacle plate, rear sheet, roof
  for (const s of [-1, 1]){ const [a, b] = span(s, 24, 25);

}
function build(st){
  if (st.fire < .1) return ui.flash('The fire is nearly out: shovel coal into the firebox first', 2400);
  const to = Math.min(PMAX, Math.round(40 + 120*st.fire));
  if (st.bT > 0) return ui.flash('Still raising steam');
  if (st.p >= to - 1) return ui.flash(st.p >= PMAX - 1 ? 'Already at full pressure, 160 psi' : `This fire holds about ${to} psi: shovel more coal`, 2400);
  st.pFrom = st.p; st.pTo = to; st.bT = 2.6; st.fire = Math.max(.1, st.fire - .04);
  ui.flash('The hot gas in the tubes boils the water; steam collects in the dome', 2400); runLoop();
}
function regulator(st){
  if (st.regOn){ st.regOn = false; ui.flash('Regulator shut: no more steam, the engine coasts to a stop', 2400); return runLoop(); }
  if (st.p < 60) return ui.flash(`Only ${Math.round(st.p)} psi: build pressure to at least 60 first`, 2400);
  st.regOn = true; st.drain = st.v < 1 ? 1.1 : 0;
  ui.flash('Steam from the dome to the cylinders: the pistons push, the wheels turn', 2400); runLoop();
}
function whistle(st){
  if (st.p < 15) return ui.flash('No steam to blow the whistle: build pressure first', 2400);
  st.wh = 1.4; st.p = Math.max(0, st.p - 2); ui.flash('Peep! Steam through the whistle bell', 1600); runLoop();
}
const caption = st => st.regOn ? 'Steam from the dome runs through the regulator to each steam chest; the slide valve lets it push the piston one way, then the other. The connecting rod turns the driving wheels, and the used steam blasts up the chimney, drawing the fire.'
  : st.bT > 0 ? 'Raising steam: the hot gas from the fire runs through the boiler tubes to the smokebox and boils the water round the tubes and the firebox. Steam collects above the water and in the dome.'
  : st.fire < .1 ? 'The fire is almost out. Coal goes in through the firehole door and burns on the grate under the brick arch.'
  : 'Coal burns on the grate under the brick arch; the hot gas runs forward through the fire tubes, heating the water round them, and leaves by the smokebox and the chimney.';

ui = mountFigure({
  fig:'S7', turn:'full', title:'Steam locomotive', size:[60, 242, 84], palette:'tomato',
  state:{ fire:.25, p:25, coal:20, pos:0, v:0, dir:1, rv:1, regOn:false, reg:0, sh:-1, shDone:false, door:0, bT:0, pFrom:0, pTo:0,
    wh:0, blow:0, smoke:0, drain:0, emitT:0, t:0, puffs:[] },
  scene,
  buttons:[
    { label:'Shovel coal', onClick:st => shovel(st) },
    { label:'Build pressure', onClick:st => build(st) },
    { label:'Open regulator', onClick:st => regulator(st) },
    { label:'Pull the whistle', onClick:st => whistle(st) },
  ],
  stats:st => [
    { label:'Boiler pressure', value:`${Math.round(st.p)} psi` },
    { label:'Speed', value:`${(st.v*.05*2.237).toFixed(1)} mph`, small:true },
    { label:'Fire', value:`${Math.round(st.fire*100)}%`, small:true },
  ],
  acts:{ fire:st => shovel(st), reg:st => regulator(st), wh:st => whistle(st) },
  params:(st, q) => {
    for (const key of ['fire', 'p', 'pos', 'coal', 'door']) if (q.has(key)) st[key] = +q.get(key);
    if (q.has('shovel')) st.sh = +q.get('shovel');
    if (q.has('reg')) st.reg = +q.get('reg');
    if (q.get('run') === '1'){ st.regOn = true; st.reg = 1; st.p = Math.max(st.p, 150); st.fire = Math.max(st.fire, .8); st.v = VMAX; }
    if (q.get('wh') === '1') st.wh = 1.4;
    if (q.get('still') === '1') STILL = true;
    // testing: ?sim=Shovel@0,Build@1.5&simT=4 presses buttons at those times and steps the engine to simT, without a frame loop
    if (q.has('sim')) SIM = { ev:q.get('sim').split(',').map(e => { const [l, t] = e.split('@'); return [l, +t || 0]; }).sort((a, b) => a[1] - b[1]), T:+(q.get('simT') || 0) };
  },
});
xrMount(() => ui, caption);
{ const rb = [...document.querySelectorAll('#btns .act')][2], r1 = ui.render;
  ui.render = () => { r1(); if (rb) rb.textContent = ui.st.regOn ? 'Close regulator' : 'Open regulator'; }; ui.render(); }
if (SIM){ const btns = [...document.querySelectorAll('#btns .act')]; let t = 0, i = 0;
  for (; t <= SIM.T + 1e-9; t += 1/60){
    while (i < SIM.ev.length && SIM.ev[i][1] <= t + 1e-9){ const b = btns.find(b => b.textContent.trim().toLowerCase().startsWith(SIM.ev[i][0].toLowerCase())); if (b) b.click(); i++; }
    locoStep(ui.st, 1/60); }
  ui.render(); }
if (!SIM && !STILL && (ui.st.regOn || ui.st.wh > 0 || ui.st.sh >= 0)) runLoop();
</script></body></html>
