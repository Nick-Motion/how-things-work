<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Washing machine</title></head><body>
<script src="core.js"></script>
<script>
/* Washing machine: a front loader standing on the floor, its tap, standpipe and socket behind it, a laundry basket in
   front of its right side and a bottle of detergent on its worktop.
   x = depth (the front is at x = W), y = width (+y is the viewer's left, seen from the front), z = up; 1 unit = 1 cm.

   TRUTH FIRST: how a front loader runs a cycle, and where everything is after each step
   1 LOAD       the door swings open on its hinges (left side); the clothes go from the basket, through the door seal,
                into the drum, and the door is shut.
   2 DETERGENT  the drawer slides out of the dispenser; detergent from the bottle goes into its main compartment; the
                drawer slides back in.
   3 START      the start button tells the control board to run the programme; the door lock bolts the door shut.
   4 FILL       the board opens the inlet valve: mains water from the tap -> inlet hose -> valve -> fill hoses -> dispenser,
                where it washes the detergent out of the drawer -> soap hose -> tub. Water pushes air up the air tube
                from the sump to the pressure switch, which tells the board when the level is right; the valve shuts.
   5 WASH       the heater in the bottom of the tub warms the water (the temperature sensor beside it reports to the
                board). The motor turns the drum pulley through the belt: a few turns one way, a pause, a few the other,
                about 50 rpm. The lifters inside the drum carry the clothes up and drop them through the soapy water.
   6 DRAIN      the drain pump pulls the water out of the sump, through the sump hose and the pump filter, and pushes it
                up the drain hose into the standpipe behind the machine.
   7 SPIN       the motor runs the drum up to 1200 rpm: the clothes are pressed to the drum wall and the water flies out
                through its holes and is pumped away. The tub hangs from two springs and stands on two shock absorbers,
                and a concrete counterweight steadies it, so its shaking stays inside the cabinet.
   8 DONE       the motor stops, the door lock lets go, and the clean, damp clothes go back into the basket.

   PARTS (each is held by another)
   CASE       cabinet on four feet . worktop . fascia with display, programme dial, start button and its light .
              detergent drawer . door: frame, glass bowl, handle, two hinges on the cabinet front . filter flap .
              back panel: service panel, transit bolt caps, rating label
   TUB        plastic tub hung on two springs from brackets on the side walls, two shock absorbers down to the base
              frame . concrete counterweight bolted on top . rubber door seal from the tub front to the cabinet front .
              sump under the tub . heater and temperature sensor through the tub front, under the drum
   DRUM       stainless drum with three lifters, holes in its back . spider (three arms) on its back . shaft through the
              bearings in the tub's back hub . drum pulley on the shaft
   DRIVE      motor bolted under the tub by two brackets . motor pulley . belt . tacho on the motor's back end
   WATER      tap on the supply pipe . inlet hose . inlet valve (two coils) on the back panel . two fill hoses .
              dispenser behind the drawer . soap hose to the tub top . air tube to the pressure switch on the side wall .
              sump hose . drain pump with its filter and motor, on its bracket on the base frame . drain hose along the
              floor and up the back in a clip, over into the standpipe
   POWER      socket on the floor . power cord . mains filter on the back panel . control board behind the fascia with
              the programme switch . door lock . wires from the board to each part */
const W = 60, D = 60, H = 85, Z0 = 2;
const OUT = rrUV(0, Z0, D, H, 2.2);                     // cabinet profile in (y, z), swept along x
const DC = [30, 44];                                    // door and drum axis (y, z)
const RT = 26.5, TX0 = 6, TX1 = 52;                     // tub radius, back, front
const RD = 23.5, DX0 = 9, DX1 = 49, RO = 16.5;          // drum radius, back, front; the drum mouth = the door hole
const DRO = 21, DRG = 15, DTH = 3.4, HINGE = [62, 51.8];// door outer / glass radius, thickness, hinge axis (x, y)
const DRAWER = [41, 57, 75, 83], PULL = 16;             // drawer front (y0, y1, z0, z1); how far it slides out
const DISP = [15, 31, 76, 82], DIAL = [36.3, 79, 3.4], STARTB = [9.5, 79.5, 2.1], FLAP = [3, 12, 3.5, 10.5];
const BASK = { x0:62.5, x1:87.5, y0:-23.5, y1:-2.5, h:22 };
const CLOTHES = ['#ef6a4c', '#76a0e2', '#f4b829', '#93d3b0', '#f6f1e4', '#f3a6bb', '#8a7fb8'];
const GR = 4.8;                                         // a garment's size
const MOT = [34, 11.5, 5.5];                            // motor axis (y, z) and radius, under the tub
const WM = {
  tub: matOf('#e2dfd6'), drum: METAL, drumIn: matOf('#b9c1c4'), rub: matOf('#77706a'), frame: matOf('#f5f3ec'),
  conc: matOf('#bdb6a8'), motor: matOf('#9aa2a6'), alu: matOf('#d6dadc'), white: matOf('#f2efe6'), coil: matOf('#4a7fc1'),
  pump: matOf('#4b4743'), pcb: { l:'#4fa36a', m:'#2f8a4a', d:'#1d5f31' }, copper: matOf('#d08a52'), pvc: matOf('#e6e2d6'),
  bask: matOf('#7fb0e0'), bottle: matOf('#f39a3c'), knob: matOf('#eeeae0'), heat: matOf('#9d8f84'), red: matOf('#e2483d'),
};
const HOSE = '#d4d8d8', WFLOW = '#6fb6ec', WOFF = '#3a3632', LIVE = '#ff9a3a';

/* ---------- helpers ---------- */
const clamp01 = v => Math.max(0, Math.min(1, v));
const lerp3 = (a, b, t) => a.map((v, i) => v + (b[i] - v)*t);
const ringX = (x, r, yc = DC[0], zc = DC[1], n = 36) => on(PX(x), ellUV(yc, zc, r, r, n));
const annulus = (A, B, col) => `<path d="${pd(A)}${pd(B)}" fill="${col}" fill-rule="evenodd"/>`;
const boxOf = (pts, e = .05) => [[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - e), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + e)];
const txBack = (x, y, z, str, size, col = INK, weight = 700) => `<text transform="${txM(P(x,y,z), Dv(0,1,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`;
const dotX = (x, y, z, r, col, w = .4) => { const q = on(PX(x), ellUV(y, z, r, r, 10)); return fill(pd(q), col) + (w ? ink(pd(q), w) : ''); };
// round each inner corner of a route (a hose bends, it doesn't kink)
const bend = (pts, r = 1.6) => { if (pts.length < 3) return pts; const out = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++){ const [a, b, c] = [pts[i - 1], pts[i], pts[i + 1]];
    const la = Math.hypot(...a.map((v, k) => v - b[k])), lc = Math.hypot(...c.map((v, k) => v - b[k])), d = Math.min(r, la/2.2, lc/2.2);
    if (d < 1e-3){ out.push(b); continue; }
    const p = a.map((v, k) => b[k] + (v - b[k]) * d/la), q = c.map((v, k) => b[k] + (v - b[k]) * d/lc);
    for (let j = 0; j <= 4; j++){ const t = j/4; out.push([0,1,2].map(k => (1-t)*(1-t)*p[k] + 2*(1-t)*t*b[k] + t*t*q[k])); } }
  out.push(pts[pts.length - 1]); return out; };
// a hose or wire cut into short pieces, each with its own box, so byDepth puts it behind or in front of what it passes
const wireParts = (pts, col, w = .45, ends = true, seg = 5) => { const q = bend(pts), out = [];
  for (let i = 0; i < q.length - 1; ){
    let j = i + 1, len = 0; while (j < q.length - 1 && len < seg){ len += Math.hypot(...q[j].map((v, k) => v - q[j - 1][k])); j++; }
    if (len < seg) while (j < q.length - 1) j++;
    const pc = q.slice(i, j + 1), d = pd(pc, false);
    let svg = `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${f(2*w + .9)}" stroke-linecap="round" stroke-linejoin="round"/>`
      + `<path d="${d}" fill="none" stroke="${col}" stroke-width="${f(2*w)}" stroke-linecap="round" stroke-linejoin="round"/>`;
    if (ends && i === 0){ const [X, Y] = P(...q[0]); svg += `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(w*.9)}" fill="${INK}"/>`; }
    if (ends && j === q.length - 1){ const [X, Y] = P(...q[j]); svg += `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(w*.9)}" fill="${INK}"/>`; }
    out.push({ box: boxOf(pc, w), svg }); i = j; }
  return out; };
// a box in its own frame (a door, a tilted bottle): T maps a local point to the world, NT a local normal
function tbox(T, NT, x0, y0, z0, x1, y1, z1, m, w = .8){
  const F = [[[0,1,0],[[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]], [[1,0,0],[[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]],
    [[0,-1,0],[[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]], [[-1,0,0],[[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],
    [[0,0,1],[[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]], [[0,0,-1],[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]]]];
  return F.map(([n, q]) => { const nw = NT(n); return vis(nw) ? shape(q.map(T), toneI(nw, m), w) : ''; }).join('');
}

/* ---------- the clothes ---------- */
const baskSpot = i => i < 6 ? [68 + (i % 3)*7, -17.5 + Math.floor(i/3)*8.5, 15 + (i % 2)*1.5] : [75, -13, 19.5];
const REST_A = [-.7, -.2, -.5, .1, -.9, -.35, -.6];          // heaped toward the front right of the drum, where the door looks in
const drumRest = i => { const r = RD - GR - .5 - [2, 6, 10, 4, 12, 8, 14][i], a = REST_A[i]; return [43 + ((i*2) % 5), r*Math.sin(a), -r*Math.cos(a)]; };   // heaped near the front, seen through the door
// a crumpled garment: a lumpy blob facing the viewer, a lighter fold, dirt spots before the wash
function garment(st, g, p, rot){
  const [X, Y] = P(...p), R = GR*CAM_K, c = CLOTHES[g.i], pts = [], lp = [];
  for (let k = 0; k < 12; k++){ const a = k/12*2*Math.PI, rr = R*(1 + .15*Math.sin(3*(a - rot) + g.i*1.3) + .07*Math.sin(5*(a - rot) + g.i));
    pts.push([X + rr*Math.cos(a), Y + rr*.86*Math.sin(a)]); lp.push([X - .22*R + .5*rr*Math.cos(a), Y - .26*R + .42*rr*Math.sin(a)]); }
  const fx = Math.cos(rot), fy = Math.sin(rot);
  let s = fill(sp(pts), c) + fill(sp(lp), mix(c, '#ffffff', .3));
  s += `<path d="M${f(X - .55*R*fx)} ${f(Y - .55*R*fy)}Q${f(X + .2*R*fy)} ${f(Y - .2*R*fx)} ${f(X + .5*R*fx)} ${f(Y + .5*R*fy)}" fill="none" stroke="${mix(c, '#000000', .45)}" stroke-width=".6" stroke-linecap="round"/>`;
  if (st.dirt > .02) for (const [u, v] of [[.35, .3], [-.3, .4], [.1, -.45]])
    s += `<circle cx="${f(X + R*(u*fx - v*fy))}" cy="${f(Y + R*(u*fy + v*fx))}" r="${f(.13*R)}" fill="#7a5634" opacity="${f(.85*st.dirt)}"/>`;
  return s + ink(sp(pts), .9);
}
function flyPt(g, t, yc, zc){                           // t: 0 in the basket .. 1 at rest in the drum
  const b0 = baskSpot(g.i), cp = [82, 8, 66], m0 = [65, DC[0] - 1, DC[1] + 3], dr = drumRest(g.i), d0 = [dr[0], yc + dr[1], zc + dr[2]];
  if (t < .7){ const u = t/.7; return [0,1,2].map(k => (1-u)*(1-u)*b0[k] + 2*(1-u)*u*cp[k] + u*u*m0[k]); }
  return lerp3(m0, d0, (t - .7)/.3);
}
// where each garment is: [world point, spin of the blob, inside the cabinet?]
function garmentAt(st, g, yc, zc){
  if (g.mode === 'basket') return [baskSpot(g.i), g.i*1.7, false];
  if (g.mode === 'fly' || g.mode === 'flyout'){ const p = flyPt(g, g.ft, yc, zc); return [p, g.i + g.ft*5, p[0] < W]; }
  return [[g.p[0], yc + g.p[1], zc + g.p[2]], g.rot || 0, true];
}

/* ---------- the drum (seen through the door, and whole in see-through) ---------- */
function perfs(x, yc, zc, ang){
  let s = '';
  for (const [r, n] of [[6.5, 6], [11.5, 10], [16.5, 14], [20.8, 18]]) for (let i = 0; i < n; i++){ const a = ang + i*2*Math.PI/n + r;
    s += pd(on(PX(x), ellUV(yc + r*Math.sin(a), zc - r*Math.cos(a), .55, .55, 8))); }
  return fill(s, '#5d6568');
}
function lifterSvgs(yc, zc, ang){
  const far = [], near = [];
  for (let k = 0; k < 3; k++){ const th = ang + k*2*Math.PI/3, pt = (r, a) => [yc + r*Math.sin(a), zc - r*Math.cos(a)];
    const tri = [pt(RD - .15, th - .14), pt(RD - 3.4, th), pt(RD - .15, th + .14)], A = on(PX(DX0 + 1.5), tri), B = on(PX(DX1 - 1.5), tri);
    let s = loft(A, B, n => toneI(n, WM.drum)); const cap = facing([1,0,0]) ? B : A;
    s += fill(pd(cap), WM.drum.m) + ink(pd(cap), .5) + hullInk([...A, ...B], .8);
    (facing([0, Math.sin(th), -Math.cos(th)]) ? near : far).push(s); }
  return [far.join(''), near.join('')];
}
// water lying in a horizontal cylinder of radius r between x0 and x1, up to height lz
function waterIn(x0, x1, r, yc, zc, lz, op = .38){
  const h = lz - (zc - r); if (h <= .2) return '';
  const al = Math.acos(clamp01((zc - lz)/r) * (zc - lz >= 0 ? 1 : -1)), seg = [];
  for (let i = 0; i <= 14; i++){ const a = -al + 2*al*i/14; seg.push([yc + r*Math.sin(a), zc - r*Math.cos(a)]); }
  const A = on(PX(x0), seg), B = on(PX(x1), seg), c = r*Math.sin(al);
  const top = [[x0, yc - c, lz], [x1, yc - c, lz], [x1, yc + c, lz], [x0, yc + c, lz]];
  return fill(sp(hull([...A, ...B].map(p => P(...p)))), WATER_C, `opacity="${op}"`) + fill(pd(top), '#bfe2f8', `opacity="${f(op*.8)}"`) + `<path d="${pd(top)}" fill="none" stroke="#3a7fc0" stroke-width=".5" opacity=".6"/>`;
}
const WATER_C = '#4f9fe0';
const levelZ = (st, zc) => zc - RT + 15*st.water;       // water level in the tub (the drum dips into it)
function drumInside(st, yc, zc){
  const A = ringX(DX0, RD, yc, zc), B = ringX(DX1, RD, yc, zc), mouth = ringX(DX1, RO, yc, zc), fF = facing([1,0,0]);
  let s = loft(A, B, n => toneI(n, WM.drumIn), true);
  s += fF ? fill(pd(A), WM.drumIn.m) + perfs(DX0 + .05, yc, zc, st.ang) + cylX(DX0, DX0 + 1, yc, zc, 3, WM.drum, toneI, .6, 16) : annulus(B, mouth, WM.drumIn.m);
  const [farL, nearL] = lifterSvgs(yc, zc, st.ang);
  s += farL;
  const gs = []; for (const g of st.cl){ const [p, rot, inside] = garmentAt(st, g, yc, zc); if (inside) gs.push({ at: p, svg: garment(st, g, p, rot) }); }
  s += byDepth(gs);
  const lz = levelZ(st, zc);
  s += waterIn(DX0 + .3, DX1 - .3, RD - .3, yc, zc, lz, .34);
  if (st.suds > .05 && lz > zc - RD + 1){ const c = Math.sqrt(Math.max(0, RD*RD - (zc - lz)**2)); let b = '';
    for (let i = 0; i < 16; i++){ const x = DX0 + 3 + ((i*13) % 34), y = yc - c*.8 + ((i*7) % 16)/16*1.6*c, r = .9 + (i % 3)*.5;
      if (i/16 < st.suds) b += `<circle cx="${f(P(x, y, lz + r*.4)[0])}" cy="${f(P(x, y, lz + r*.4)[1])}" r="${f(r*CAM_K)}" fill="#ffffff" stroke="${INK}" stroke-width=".35"/>`; }
    s += b; }
  return s + nearL;
}
function drumFull(st, yc, zc){
  const A = ringX(DX0, RD, yc, zc), B = ringX(DX1, RD, yc, zc), mouth = ringX(DX1, RO, yc, zc), fF = facing([1,0,0]);
  const near = loft(A, B, n => toneI(n, WM.drum)) + (fF ? annulus(B, mouth, toneI([1,0,0], WM.drum)) : fill(pd(A), toneI([-1,0,0], WM.drum)) + perfs(DX0 - .05, yc, zc, st.ang));
  return drumInside(st, yc, zc) + `<g opacity=".42">${near}</g>` + (fF ? ink(pd(mouth), .9) + ink(pd(B), .7) : ink(pd(A), .7)) + hullInk([...A, ...B], 1.3);
}
// through the hole in the cabinet front: the far side of the rubber door seal, then (through the drum mouth) the drum
function portal(st){
  const yc = DC[0] + st.jy, zc = DC[1] + st.jz;
  let s = loft(ringX(TX1, RO + 1, yc, zc), ringX(W, RO), n => toneI(n, WM.rub), true);
  s += clipTo(ringX(DX1, RO, yc, zc), drumInside(st, yc, zc));
  return clipTo(ringX(W, RO), s);
}

/* ---------- the cabinet ---------- */
const PH_NAME = { idle:'COTTON 40', load:'COTTON 40', unload:'END', soap:'COTTON 40', lock:'LOCK', fill:'FILL', wash:'WASH', drain:'DRAIN', spin:'SPIN', unlock:'END' };
const CYCLE = [['lock', .7], ['fill', 3.2], ['wash', 4.6], ['drain', 2.4], ['spin', 4.2], ['unlock', .8]];
const CYC = Object.fromEntries(CYCLE), CYC_T = CYCLE.reduce((a, c) => a + c[1], 0);
function timeLeft(st){
  let rem = CYC_T;
  if (CYC[st.phase]){ rem = 0; let past = true; for (const [n, d] of CYCLE){ if (n === st.phase){ rem += Math.max(0, d - st.t); past = false; } else if (!past) rem += d; } }
  else if (st.washed) rem = 0;
  const mins = Math.round(88*rem/CYC_T); return `${Math.floor(mins/60)}:${String(mins % 60).padStart(2, '0')}`;
}
const running = st => !!CYC[st.phase];
function caseBody(st, m){
  const FRONT = facing([1,0,0]), BACK = facing([-1,0,0]), hole = ringX(W, RO);
  let s = '';
  if (FRONT){
    const fr = tone([1,0,0], m), dk = mix(fr, '#000000', .45), F = PX(W + .08);
    s += annulus(on(PX(W), OUT), hole, fr);
    s += portal(st);
    s += annulus(ringX(W + .05, RO + 1.8), hole, mix(fr, '#000000', .12)) + ink(pd(ringX(W + .05, RO + 1.8)), .9);
    s += line([[W + .05, .6, 73], [W + .05, D - .6, 73]], 1.1);                                       // fascia seam
    s += shape(on(F, rectUV(DRAWER[0] + .3, DRAWER[2] + .3, DRAWER[1] - .3, DRAWER[3] - .3)), '#2b2523', .8);   // drawer opening
    s += shape(on(F, rrUV(DISP[0], DISP[2], DISP[1], DISP[3], .8)), '#1d2a26', 1);
    s += tx(W + .15, (DISP[0] + DISP[1])/2, DISP[2] + 3.7, (PH_NAME[st.phase] || '') + (st.w ? ' ' + rpmOf(st) + ' RPM' : ''), 1.7, '#8af0ae', 700);
    s += tx(W + .15, (DISP[0] + DISP[1])/2, DISP[2] + .9, timeLeft(st), 2.6, '#8af0ae', 800);
    for (let i = 0; i < 8; i++){ const a = (-135 + i*270/7)*Math.PI/180; s += dotX(W + .1, DIAL[0] - 4.7*Math.sin(a), DIAL[1] + 4.7*Math.cos(a), .32, i === 0 ? '#e2483d' : dk, 0); }
    s += dotX(W + .1, 13.2, STARTB[1], .6, running(st) ? '#43c25c' : '#8d877a', .35);
    s += tx(W + .15, STARTB[0], 75.4, 'START', 1.4, dk, 800);
    s += tx(W + .15, DC[0], 68.2, 'AQUA 8', 2.6, dk, 800);
    s += shape(on(F, rrUV(FLAP[0], FLAP[2], FLAP[1], FLAP[3], 1)), mix(fr, '#000000', .06), 1) + shape(on(PX(W + .1), rectUV(6.2, FLAP[3] - 1.4, 8.8, FLAP[3] - .6)), dk, .4);
    s += shape(on(F, rectUV(7.4, 43, 9.6, 46.2)), '#2b2523', .6);                                    // the door lock's catch slot
  }
  if (BACK){
    const bk = tone([-1,0,0], m), B = PX(-.1);
    s += fill(pd(on(PX(0), OUT)), bk);
    s += shape(on(B, rrUV(9, 20, 51, 62, 2)), mix(bk, '#000000', .06), 1.1);                         // service panel
    for (const [y, z] of [[11, 22], [30, 22], [49, 22], [11, 60], [30, 60], [49, 60]]) s += dotX(-.15, y, z, .45, METAL.l);
    for (const [y, z] of [[12, 70], [48, 70], [30, 14]]) s += dotX(-.15, y, z, 1.5, '#f2efe6', .6) + dotX(-.2, y, z, .5, '#bdb8a6', 0);   // transit bolt caps
    s += shape(on(B, rectUV(20, 6, 38, 15)), '#f3f0e6', .7);
    s += txBack(-.2, 29, 11.4, '230V 2100W', 1.6, INK, 800) + txBack(-.2, 29, 8.6, 'AQUA 8 KG', 1.4, INK, 700);
  }
  s += extrude(OUT, 0, W, m);
  for (const [n, y] of [[[0,1,0], D + .05], [[0,-1,0], -.05]]) if (facing(n)) s += line([[.8, y, H - 2], [W - .8, y, H - 2]], .8);
  if (BACK) s += line([[-.05, .8, H - 2], [-.05, D - .8, H - 2]], .8) + ink(pd(on(PX(0), OUT)), 2.2);
  if (FRONT) s += ink(pd(on(PX(W), OUT)), 2.2) + ink(pd(hole), 1.6);
  return s + hullInk([...on(PX(0), OUT), ...on(PX(W), OUT)], 2.8);
}

/* ---------- things on the front: door, drawer, dial, start button ---------- */
const doorT = b => { const c = Math.cos(b), s = Math.sin(b);

  if (inDrum(st)) return ui.flash(st.washed ? 'Unload the clean washing first' : 'The clothes are in. Add detergent, then Start');
  st.phase = 'load'; st.t = 0; runLoop();
}
function addSoap(st){
  if (running(st)) return ui.flash('Add detergent before you start');
  if (busyAnim(st)) return ui.flash('One moment');
  if (st.soap > .5) return ui.flash('Detergent is already in the drawer');
  st.phase = 'soap'; st.t = 0; runLoop();
}
function startWash(st){
  if (running(st)) return ui.flash('Already washing');
  if (busyAnim(st)) return ui.flash('One moment');
  if (!inDrum(st)) return ui.flash('Load the clothes first');
  if (st.washed) return ui.flash('All clean. Unload the washing');
  if (st.soap < .5) return ui.flash('Add detergent first');
  st.phase = 'lock'; st.t = 0; runLoop();
}
function unload(st){
  if (running(st)) return ui.flash('The door is locked while it washes');
  if (busyAnim(st)) return ui.flash('One moment');
  if (!inDrum(st)) return ui.flash('The drum is empty');
  st.phase = 'unload'; st.t = 0; runLoop();
}
const rpmOf = st => st.phase === 'spin' && st.w > 3 ? Math.round(29 + (1200 - 29)*(st.w - 3)/29) : Math.round(Math.abs(st.w)*9.55);

ui = mountFigure({
  fig:'07', turn:'full', title:'Washing machine', hint:'',
  size:[88, 84, 95], center:[W/2, D/2], palette:'mint',
  state:{ phase:'idle', t:0, ang:0, w:0, dir:1, tum:0, door:0, pull:0, bot:0, pour:0, soap:0, water:0, heat:0, suds:0, dirt:1, washed:false,
    lock:0, press:0, valve:0, pump:0, jy:0, jz:0, settle:0, cl: CLOTHES.map((c, i) => ({ i, mode:'basket', ft:0, p:null, rot:0 })) },
  scene,
  buttons:[
    { label:'Load clothes', onClick: st => loadClothes(st) },
    { label:'Add detergent', onClick: st => addSoap(st) },
    { label:'Start', onClick: st => startWash(st) },
    { label:'Unload', onClick: st => unload(st) },
  ],
  acts:{ door: st => inDrum(st) && st.washed ? unload(st) : loadClothes(st), basket: st => loadClothes(st), drawer: st => addSoap(st), start: st => startWash(st) },
  params:(st, q) => {
    const ph = q.get('phase');
    if (q.get('load') === '1' || CYC[ph]) st.cl.forEach(g => { g.mode = 'drum'; g.p = drumRest(g.i); });
    if (q.get('soap') === '1' || ph === 'lock' || ph === 'fill') st.soap = 1;
    for (const key of ['door', 'pull', 'bot', 'water', 'dirt']) if (q.has(key)) st[key] = +q.get(key);
    if (q.get('washed') === '1'){ st.washed = true; st.dirt = 0; }
    if (CYC[ph]){ st.phase = ph; st.t = +(q.get('t') || 0); if (ph === 'wash' || ph === 'drain') st.water = .85; if (ph !== 'lock' && ph !== 'fill') st.dirt = ph === 'wash' ? 1 : 0; st.lock = 1; }
  },
});
// the framing box above runs from y = 0; the scene's box starts at y = -24 (the basket), so shift the drawing to match
OX -= 24*C; OY += 12;
ui.render();
if (ui.st.phase !== 'idle') runLoop();
xrMount(() => ui, () => '');
</script></body></html>
