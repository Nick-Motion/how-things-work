<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flashlight</title></head><body>
<script src="core.js"></script>
<script>
/* Flashlight: a classic two-D-cell torch with a slide switch on top and a twist-to-focus head.
   Truth (how it really works, and where the current is):
   1. Two D cells sit in the body tube in series, + end toward the head (1.5 V each, 3.0 V fresh, ~1.2 V each when worn).
   2. The front cell's + nub presses the centre spring on the back of the driver board; the driver board feeds the LED
      through two wires that run over the heat sink to the LED board, at the focus of the reflector.
   3. The LED's return goes back through the driver board to the fixed contact, a brass tab running back along the top
      inside the tube. A brass contact strip runs the rest of the tube's length and folds over the tail rim (the strip tab).
   4. The slide switch: a knob on the switch housing carries a slider through a slot in the tube; under it a contact bridge.
      Slid forward, the bridge spans the fixed contact and the strip: the circuit closes.
   5. The tail cap screws onto the tube's tail thread (an O-ring seals it). Inside it a conical tail spring on a brass
      spring plate presses the rear cell's - end, and the plate touches the strip tab on the rim: the loop is
      cell + -> centre spring -> driver -> LED -> fixed contact -> bridge -> strip -> tab -> plate -> tail spring -> cell -.
      Cap off: the loop is open, no light, whatever the switch says.
   6. Focus: the head screws on the focus thread at the front of the tube. The reflector (a parabola) and the lens ride in
      the head; the LED stays put on the tube. Screwed fully in, the LED sits at the reflector's focus: a narrow spot.
      Twisted out, the reflector moves forward, the LED falls behind the focus and the beam spreads (flood).
   7. Swap: cap off, the old cells slide out of the tail, fresh ones from the box slide in + end first, cap back on.
   Parts (each held by another):
   HEAD    bezel . lens . bezel O-ring . reflector . head shell with grip flutes (screws on the focus thread)
   LIGHT   LED (die + dome) . LED board . heat sink (pressed into the tube front) . two LED wires
   DRIVER  two standoffs on the heat sink . driver board . inductor . driver chip . capacitor . centre spring
   SWITCH  switch housing on the tube . switch knob . slider through the tube slot . contact bridge . fixed contact
   BODY    body tube . focus thread . grip rings . contact strip . strip tab . tail thread . cap O-ring
   POWER   front cell . rear cell . + terminal . - end
   TAIL    tail cap . spring plate . tail spring . lanyard loop
   SCENE   wooden table . beam test card in its stand . box of spare D cells . a wooden block under the tube
   x = across (the box of cells is at +x), y = along the torch (the head points to -y, at the card), z = up. 1 unit = 1 mm. */
const BT = 6;                                         // table top
const AX = 98, AZ = 37;                               // the torch's axis (x, z), along y; the bezel rests on the table
const TBL = [0, 0, 186, 352];                         // table board (x0, y0, x1, y1)
const CARD = { x0: AX - 56, x1: AX + 56, y0: 13, y1: 15.5, z0: BT + 7, z1: BT + 80 };
const TUBE_R = 20, TUBE_IN = 18.5, TUBE_Y0 = 128, TUBE_Y1 = 282;
const GRIPS = [232, 239, 246, 253, 260];             // grip rings, each 3 long
const BOSS = [160, 194];                              // switch housing on top of the tube
const CAPG = { y0: 266, y1: 296, r: 22.5, rin: 21 };
const PLATE_Y = 282.6, THREAD_LEN = 16;
const CELL_L = 61.5, CELL_R = 17.1, NUB_R = 4.75, NUB_L = 1.5;
const HOME_Y0 = [149, 210.5], OUT_Y0 = 285;
const BOXC = { x0: 135, x1: 179, y0: 166, y1: 308, z1: BT + 24 };
const BOX_CZ = BT + 2 + CELL_R;
const USED = [{ x: 26, y0: 160 }, { x: 26, y0: 228 }];
const REST_T = [26 - AX, 30, BT + CAPG.r - AZ];       // where the cap lies on the table when it is off
const BLOCK = [AX - 12, 238, BT, AX + 12, 258, AZ - 20.8];
// reflector: a parabola, focus at the LED when the head is screwed fully in
const RF = 5.385, RV = 126.385, RMOUTH = 26, RHOLE = 9, LED_Y = RV - RF, HS_Y0 = LED_Y + 2.4;
const reflY = r => RV - r*r/(4*RF);
const FOCI = { spot: { label: 'Spot', fd: 0 }, medium: { label: 'Medium', fd: 3 }, flood: { label: 'Flood', fd: 6 } };
const LUMENS = 120;

const ALU = matOf('#d4d8da'), BRASS = matOf('#d8b25a'), PCB = { l: '#4fa36a', m: '#2f8a4a', d: '#1d5f31' }, CHIPM = matOf('#3a3632'),
  INDM = matOf('#5c6369'), CAPM = matOf('#3f7fc0'), PLAS = matOf('#efe9dc'), KRAFT = matOf('#c9a46a'), CARDM = matOf('#fbf8ee'),
  REFM = { l: '#ffffff', m: '#dfe5e8', d: '#aab4b8' }, PHOS = matOf('#f2d04a'),
  CELL_NEW = matOf('#34302c'), BAND_NEW = matOf('#d0884a'), CELL_OLD = matOf('#7d8f9c'), BAND_OLD = matOf('#d5d9dc');

/* ---------- helpers: round parts on an axis parallel to y ---------- */
const ringY = (y, r, n = 24, cx = AX, cz = AZ) => on(PY(y), ellUV(cx, cz, r, r, n));
const boxY = (y0, y1, r, cx = AX, cz = AZ) => [[cx - r, y0, cz - r], [cx + r, y1, cz + r]];
const rodY = (y0, y1, r0, M, w = 1, r1 = r0, n = 24, cx = AX, cz = AZ, sh = tone) => rod([cx, y0, cz], [cx, y1, cz], r0, M, sh, w, r1, n);
const flBoxOf = (pts, e = .05) => [[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - e), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + e)];
const stroke2 = (d, c, w) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${f(w + .9)}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${c}" stroke-width="${f(w)}" stroke-linecap="round" stroke-linejoin="round"/>`;
const add3 = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
// lines along y on a round part, only those turned toward the viewer (grip flutes, knurling)
function flutes(cx, cz, y0, y1, r, n, rot, w = .6, op = .55){
  let d = ''; for (let i = 0; i < n; i++){ const a = (i*360/n + rot)*Math.PI/180, nr = [Math.cos(a), 0, Math.sin(a)], q = rotV(nr);
    if (q[0] + q[1] + q[2] < .35) continue;
    d += pd([[cx + r*Math.cos(a), y0, cz + r*Math.sin(a)], [cx + r*Math.cos(a), y1, cz + r*Math.sin(a)]], false); }
  return d ? `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" opacity="${op}"/>` : ''; }
// the near half of a thread (a helix on the surface), as short visible pieces
function helixNear(cx, cz, y0, y1, r, pitch, w = .55, op = .7){
  const pts = [], n = Math.ceil((y1 - y0)/pitch*24); let d = '', run = [];
  for (let i = 0; i <= n; i++){ const y = y0 + (y1 - y0)*i/n, a = (y - y0)/pitch*2*Math.PI, nr = [Math.cos(a), 0, Math.sin(a)], q = rotV(nr);
    if (q[0] + q[1] + q[2] > .05) run.push([cx + r*Math.cos(a), y, cz + r*Math.sin(a)]); else if (run.length){ if (run.length > 1) d += pd(run, false); run = []; } }
  if (run.length > 1) d += pd(run, false);
  return d ? `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" opacity="${op}"/>` : ''; }
// the near half of a ring round the axis (an O-ring seen on a tube)
function ringNear(y, r, col, w){ const pts = []; for (let i = 0; i <= 36; i++){ const a = i/36*2*Math.PI, q = rotV([Math.cos(a), 0, Math.sin(a)]);
    pts.push(q[0] + q[1] + q[2] > -.05 ? [AX + r*Math.cos(a), y, AZ + r*Math.sin(a)] : null); }
  let d = '', run = []; for (const p of pts){ if (p) run.push(p); else { if (run.length > 1) d += pd(run, false); run = []; } } if (run.length > 1) d += pd(run, false);
  return d ? stroke2(d, col, w) : ''; }
// a coil spring along y from ya to yb, radius r0 at ya to r1 at yb
function coilY(ya, yb, r0, r1, turns, col = '#cfd6d8', cx = AX, cz = AZ){
  const pts = []; for (let i = 0; i <= turns*16; i++){ const t = i/(turns*16), a = t*turns*2*Math.PI, r = r0 + (r1 - r0)*t;
    pts.push([cx + r*Math.cos(a), ya + (yb - ya)*t, cz + r*Math.sin(a)]); }
  return { box: flBoxOf([[cx - Math.max(r0, r1), Math.min(ya, yb), cz - Math.max(r0, r1)], [cx + Math.max(r0, r1), Math.max(ya, yb), cz + Math.max(r0, r1)]]),
    svg: stroke2(pd(pts, false), col, .9) }; }

/* ---------- state helpers ---------- */
const capHome = st => !st.capT[0] && !st.capT[1] && !st.capT[2];
const capCoax = st => !st.capT[0] && !st.capT[2];
const cellsHome = st => st.inLight.every((i, k) => { const c = st.cells[i]; return c.x === AX && c.z === AZ && Math.abs(c.y0 - HOME_Y0[k]) < .01; });
const isFresh = st => st.cells[st.inLight[0]].fresh;
const level = st => st.sw > .5 && capHome(st) && cellsHome(st) && !st.busy ? (isFresh(st) ? 1 : .3) : 0;
const beamHalf = fd => fd <= 3 ? 4 + 9*fd/3 : 13 + 17*(fd - 3)/3;            // degrees: spot 8 deg wide, medium 26, flood 60
const spotR = st => RMOUTH + (95 - st.fd - CARD.y1) * Math.tan(beamHalf(st.fd)*Math.PI/180);
const glowCol = st => isFresh(st) ? '#fff8d8' : '#ffd77a';

/* ---------- the reflector, LED and LED board (the head's optics) ---------- */
const REF_RS = [RHOLE, 11, 13.5, 16, 18.5, 21, 23.5, RMOUTH];
function reflLoft(hy, inner){ const rings = REF_RS.map(r => ringY(reflY(r) + hy, r, 32)); let s = '';
  for (let i = 0; i < rings.length - 1; i++) s += loft(rings[i], rings[i + 1], n => toneI(n, REFM), inner);
  return s; }
function ledSvg(st){
  const lv = level(st), parts = [];
  parts.push(rodY(LED_Y + 1.4, HS_Y0, 8, ALU, .6, 8, 20, AX, AZ, toneI));                     // LED board (star)
  parts.push(box(AX - 2.8, LED_Y + .2, AZ - 2.8, AX + 2.8, LED_Y + 1.4, AZ + 2.8, PHOS, toneI, .5));   // LED package
  const c = P(AX, LED_Y, AZ), r = 2.4*1.2247;
  parts.push((lv ? `<circle cx="${f(c[0])}" cy="${f(c[1])}" r="${f(r*2.6)}" fill="${glowCol(st)}" opacity="${f(.7*lv)}"/>` : '')
    + `<circle cx="${f(c[0])}" cy="${f(c[1])}" r="${f(r)}" fill="${lv ? '#ffffff' : '#f4f1e2'}" fill-opacity=".85" stroke="${INK}" stroke-width=".6"/>`
    + `<circle cx="${f(c[0] - r*.35)}" cy="${f(c[1] - r*.35)}" r="${f(r*.25)}" fill="#ffffff"/>`);
  return facing([0, -1, 0]) ? parts.join('') : parts.reverse().join('');
}

/* ---------- a D cell lying along y, + end toward -y; ymin/ymax keep only the part between them ---------- */
function cellItems(c, ymin = -1e9, ymax = 1e9){
  const out = [], M = c.fresh ? CELL_NEW : CELL_OLD, BD = c.fresh ? BAND_NEW : BAND_OLD, y0 = c.y0, cx = c.x, cz = c.z;
  const seg = (a, b, r, mat, extra) => { const A = Math.max(a, ymin), B2 = Math.min(b, ymax); if (B2 - A < .05) return;
    out.push({ box: boxY(A, B2, r, cx, cz), svg: rodY(A, B2, r, mat, .9, r, 24, cx, cz, toneI) + (extra ? extra(A, B2) : '') }); };
  seg(y0, y0 + NUB_L, NUB_R, METAL);
  seg(y0 + NUB_L, y0 + 18, CELL_R, BD, (A) => A === y0 + NUB_L && facing([0, -1, 0])
    ? shape(ringY(y0 + NUB_L - .05, 13, 20, cx, cz), METAL.m, .5) : '');
  seg(y0 + 18, y0 + CELL_L, CELL_R, M, (A, B2) => {
    let s = '';
    if (B2 === y0 + CELL_L && facing([0, 1, 0])) s += shape(ringY(y0 + CELL_L + .05, 14, 20, cx, cz), METAL.l, .5);
    if (A <= y0 + 28 && B2 >= y0 + 54) s += tx(cx + CELL_R + .15, y0 + 41, cz + 2, 'D  1.5V', 6, c.fresh ? '#f4e2c8' : '#ffffff', 800);
    return s; });
  return out;
}

/* ---------- the tail cap (pose: translation T, knurl turned by rot) ---------- */
function capParts(st, k){
  const T = st.capT, rot = st.capRot, cx = AX + T[0], cz = AZ + T[2], y0 = CAPG.y0 + T[1], y1 = CAPG.y1 + T[1];
  const shell = [], mech = [], m = st.m;
  let body = loft(ringY(y0, CAPG.r, 32, cx, cz), ringY(y1, CAPG.r, 32, cx, cz), n => tone(n, m));
  body += flutes(cx, cz, y0 + 4, y1 - 3, CAPG.r + .05, 20, rot, .6, .5);
  if (facing([0, 1, 0])) body += shape(ringY(y1, CAPG.r, 32, cx, cz), tone([0, 1, 0], m), 1.1);
  if (facing([0, -1, 0])){ const bore = ringY(y0 - .05, CAPG.rin, 32, cx, cz);
    body += shape(ringY(y0 - .02, CAPG.r, 32, cx, cz), tone([0, -1, 0], m), 1) + shape(bore, '#2b2523', .8)
      + clipTo(bore, shape(ringY(PLATE_Y + T[1], 19, 28, cx, cz), BRASS.m, .5) + coilY(PLATE_Y + T[1], tailFront(st), 9, 6, 4, '#cfd6d8', cx, cz).svg); }
  body += hullInk([...ringY(y0, CAPG.r, 24, cx, cz), ...ringY(y1, CAPG.r, 24, cx, cz)], 2.2);
  shell.push({ box: boxY(y0, y1, CAPG.r, cx, cz), svg: act('cap', body) });
  // lanyard: a lug on the closed end, and a steel loop through it
  const lug = rodY(y1, y1 + 3, 3, m, .8, 2.6, 14, cx, cz);
  const loopPts = Array.from({ length: 25 }, (_, i) => { const a = i/24*2*Math.PI; return [cx, y1 + 7 + 4.5*Math.cos(a), cz + 5.5*Math.sin(a)]; });
  const loop = stroke2(pd(loopPts, false), METAL.m, 1.2);
  shell.push({ box: [[cx - 3, y1, cz - 6], [cx + 3, y1 + 12, cz + 6]], svg: act('cap', facing([0, 1, 0]) ? lug + loop : loop + lug) });
  // inside: the brass spring plate and the conical tail spring
  mech.push({ box: boxY(PLATE_Y + T[1], PLATE_Y + T[1] + 1, 19, cx, cz), svg: rodY(PLATE_Y + T[1], PLATE_Y + T[1] + 1, 19, BRASS, .7, 19, 28, cx, cz, toneI) });
  mech.push(coilY(PLATE_Y + T[1], tailFront(st), 9, 6, 5, '#cfd6d8', cx, cz));
  return { shell, mech };
}
// where the tail spring's front end is: on the rear cell's - end while it presses, free (18 long) otherwise
function tailFront(st){
  const free = PLATE_Y + st.capT[1] - 18;
  if (!capCoax(st)) return free;
  let y = free; for (const c of st.cells) if (c.x === AX && c.z === AZ){ const e = c.y0 + CELL_L; if (e > y && e < PLATE_Y + st.capT[1]) y = e; }
  return y;
}

/* ---------- the torch body (case parts, each sorted) ---------- */
function shellItems(st, m){
  const hy = -st.fd, hr = st.fd*60, items = [], put = (b, svg) => items.push({ box: b, svg }), lv = level(st);
  // bezel with the lens; through the lens: the reflector and the LED
  { const y0 = 90 + hy, y1 = 97 + hy; let s = rodY(y0, y1, 31, METAL, 1.4, 31, 36);
    if (facing([0, -1, 0])){ const lr = ringY(y0 - .05, 26.5, 36);
      const inside = fill(pd(ringY(reflY(RHOLE) + hy, RHOLE, 20)), '#55504a') + reflLoft(hy, true) + ledSvg(st);
      s += clipTo(lr, inside) + fill(pd(lr), lv ? glowCol(st) : CLEAR.l, `opacity="${lv ? f(.45 + .45*lv) : .3}"`) + ink(pd(lr), 1.1);
      const a = P(AX - 14, y0 - .1, AZ + 16), b = P(AX - 4, y0 - .1, AZ + 21), c2 = P(AX - 18, y0 - .1, AZ + 9);
      s += `<path d="M${f(c2[0])} ${f(c2[1])}L${f(a[0])} ${f(a[1])}L${f(b[0])} ${f(b[1])}" fill="none" stroke="#ffffff" stroke-width="1.4" opacity=".38" stroke-linecap="round"/>`; }
    put(boxY(y0, y1, 31), act('focus', s)); }
  // head shell: barrel with grip flutes (they turn as the head is twisted), cone, neck
  put(boxY(97 + hy, 126 + hy, 30), act('focus', rodY(97 + hy, 126 + hy, 30, m, 1.8, 30, 36) + flutes(AX, AZ, 100 + hy, 123 + hy, 30.05, 18, hr)));
  put(boxY(126 + hy, 138 + hy, 30), act('focus', rodY(126 + hy, 138 + hy, 30, m, 1.4, 22.5, 36)));
  put(boxY(138 + hy, 156 + hy, 22.5), act('focus', rodY(138 + hy, 156 + hy, 22.5, m, 1.3, 22.5, 32)));
  // body tube in pieces between the grip rings; the tail end shows its thread and O-ring when the cap is off
  const coax = capCoax(st), tEnd = coax ? Math.min(TUBE_Y1, CAPG.y0 + st.capT[1]) : TUBE_Y1;
  const cuts = [156 + hy]; for (const g of GRIPS) cuts.push(g, g + 3); cuts.push(tEnd);
  for (let i = 0; i < cuts.length - 1; i++){ const a = cuts[i], b = cuts[i + 1], grip = i % 2 === 1;
    let s = rodY(a, b, grip ? TUBE_R + .8 : TUBE_R, grip ? DARK : m, grip ? .9 : 1.3, grip ? TUBE_R + .8 : TUBE_R, 32);
    if (i === 0 && facing([1, 0, 0])) s += tx(AX + TUBE_R + .2, 212, AZ - 2.5, 'BRIGHTBEAM 2D', 6.2, mix(m.d, '#000000', .2), 800);
    if (i === cuts.length - 2 && b > 266){
      s += helixNear(AX, AZ, 270, Math.min(b, TUBE_Y1), TUBE_R + .1, 1.6);
      if (b > 269.5) s += ringNear(268.75, TUBE_R + .5, DARK.m, 1.3);
      if (b >= TUBE_Y1 - .01 && facing([0, 1, 0])){ const bore = ringY(TUBE_Y1 + .05, TUBE_IN, 32);
        let ins = '';
        for (const c of st.cells) if (c.x === AX && c.z === AZ && c.y0 + CELL_L <= TUBE_Y1 && c.y0 + CELL_L > TUBE_Y1 - 30)
          ins += shape(ringY(c.y0 + CELL_L, CELL_R, 28), (c.fresh ? CELL_NEW : CELL_OLD).d, .6) + shape(ringY(c.y0 + CELL_L + .05, 14, 20), METAL.m, .5);
        s += shape(ringY(TUBE_Y1 + .05, TUBE_R, 32), tone([0, 1, 0], m), 1) + shape(bore, '#2b2523', .8) + clipTo(bore, ins)
          + box(AX - 2.2, TUBE_Y1 - .5, AZ + 17.2, AX + 2.2, TUBE_Y1 + .6, AZ + 20.2, BRASS, toneI, .5); } }
    put(boxY(a, b, grip ? TUBE_R + .8 : TUBE_R), s); }
  // switch housing: a rounded block on the tube with the slot the slider runs in
  { const prof = rrUV(AX - 7.5, AZ + 18.4, AX + 7.5, AZ + 23.5, 2.2, 4), A = on(PY(BOSS[0]), prof), B = on(PY(BOSS[1]), prof);
    let s = loft(A, B, n => tone(n, m));
    if (facing([0, -1, 0])) s += shape(A, tone([0, -1, 0], m), 1); if (facing([0, 1, 0])) s += shape(B, tone([0, 1, 0], m), 1);
    s += shape(on(PZ(AZ + 23.55), rrUV(AX - 1.8, BOSS[0] + 5, AX + 1.8, BOSS[1] - 5, 1.6, 3)), '#2b2523', .6);
    s += tx(AX + 7.55, BOSS[0] + 7, AZ + 19.6, 'ON', 3.2, INK, 800) + tx(AX + 7.55, BOSS[1] - 7, AZ + 19.6, 'OFF', 3.2, INK, 800);
    s += hullInk([...A, ...B], 1.4);
    items.push({ box: [[AX - 7.5, BOSS[0], AZ + 20.01], [AX + 7.5, BOSS[1], AZ + 23.5]], svg: s }); }
  items.push(knobItem(st));
  return items;
}
function knobItem(st){
  const ky = 182 - 10*st.sw;
  let s = box(AX - 5.5, ky - 5.5, AZ + 23.5, AX + 5.5, ky + 5.5, AZ + 27.5, DARK, tone, 1.1);
  if (facing([0, 0, 1])) for (const d of [-3, 0, 3]) s += line([[AX - 4.5, ky + d, AZ + 27.55], [AX + 4.5, ky + d, AZ + 27.55]], .7);
  return { box: [[AX - 5.5, ky - 5.5, AZ + 23.5], [AX + 5.5, ky + 5.5, AZ + 27.5]], svg: act('switch', s) };
}

/* ---------- see-through: the working parts inside the case ---------- */
function mechItems(st){
  const hy = -st.fd, lv = level(st), items = [], put = (b, svg) => items.push({ box: b, svg });
  const ky = 182 - 10*st.sw, wireCol = lv ? '#ff9a3a' : null;
  // lens, bezel O-ring, reflector (far inside wall, the LED, near outer wall)
  put(boxY(92 + hy, 94 + hy, 27), rodY(92 + hy, 94 + hy, 27, CLEAR, .7, 27, 36, AX, AZ, toneI).replace(/<path d="([^"]*)" fill="([^"]*)" stroke="([^"]*)" stroke-width="\.7"/g, '<path d="$1" fill="$2" fill-opacity=".55" stroke="$3" stroke-width=".7"'));
  put(boxY(94 + hy, 95.2 + hy, 27.8), rodY(94 + hy, 95.2 + hy, 27.8, DARK, .6, 27.8, 36, AX, AZ, toneI));
  put([[AX - RMOUTH, 95 + hy, AZ - RMOUTH], [AX + RMOUTH, reflY(RHOLE) + hy, AZ + RMOUTH]],
    reflLoft(hy, true) + ledSvg(st) + reflLoft(hy, false) + hullInk([...ringY(95 + hy, RMOUTH, 24), ...ringY(reflY(RHOLE) + hy, RHOLE, 16)], 1.1));
  // heat sink pressed into the tube front, two LED wires over its top, standoffs, the driver board and its parts
  put(boxY(HS_Y0, 133, 17.8), rodY(HS_Y0, 133, 17.8, ALU, .9, 17.8, 32, AX, AZ, toneI) + flutes(AX, AZ, HS_Y0 + 1.5, 131.5, 17.85, 12, 15, .5, .45));
  for (const [dx, col] of [[-1.6, '#d8443a'], [1.6, '#2b2523']]){
    const zr = Math.sqrt(18.1*18.1 - dx*dx);
    put([[AX + dx - .4, HS_Y0 - .35, AZ + 7.6], [AX + dx + .4, HS_Y0 - .05, AZ + zr + .4]], stroke2(pd([[AX + dx, LED_Y + 1.9, AZ + 7.8], [AX + dx, HS_Y0 - .2, AZ + 8.2], [AX + dx, HS_Y0 - .2, AZ + zr]], false), wireCol || col, .7));

/* ---------- behaviour ---------- */
let ui;
function slideSwitch(st, ui){
  st.swT = st.swT ? 0 : 1;
  if (st.swT){ if (!capCoax(st) || !capHome(st)) ui.flash('The cap is off: the circuit is open, so no light');
    else if (!cellsHome(st)) ui.flash('No batteries in'); }
  if (st.swAnim) return; st.swAnim = true;
  ui.animate(dt => { st.sw += Math.sign(st.swT - st.sw)*Math.min(Math.abs(st.swT - st.sw), dt/.22);
    if (st.sw === st.swT){ st.swAnim = false; return false; } return true; });
}
function setFocus(st, ui, key){
  st.focus = key; const goal = FOCI[key].fd;
  if (st.focusing) return; st.focusing = true;
  ui.animate(dt => { st.fd += Math.sign(goal - st.fd)*Math.min(Math.abs(goal - st.fd), dt*9);
    if (st.fd === FOCI[st.focus].fd){ st.focusing = false; return false; } return true; });
}
// a list of timed steps, one after another: { dur (s), at(e, k) } with e eased
function runSeq(st, ui, steps, done){
  st.busy = true; let i = 0, t = 0;
  ui.animate(dt => { const sp2 = steps[i]; t += dt/sp2.dur; const k = Math.min(1, t); sp2.at(ease(k), k);
    if (k >= 1){ i++; t = 0; if (i >= steps.length){ st.busy = false; st.capMoving = false; if (done) done(); return false; } }
    return true; });
}
const lerp3 = (a, b, e, lift = 0) => [0, 1, 2].map(j => a[j] + (b[j] - a[j])*e + (j === 2 ? lift*Math.sin(Math.PI*e) : 0));
function capOffSteps(st){
  return [
    { dur: .8, at: e => { st.capMoving = true; st.capT = [0, THREAD_LEN*e, 0]; st.capRot = -720*e; } },
    { dur: .6, at: e => { st.capT = lerp3([0, THREAD_LEN, 0], REST_T, e, 30); if (e >= 1) st.capT = REST_T.slice(); } } ];
}
function capOnSteps(st){
  return [
    { dur: .6, at: e => { st.capMoving = true; st.capT = lerp3(REST_T, [0, THREAD_LEN, 0], e, 30); if (e >= 1) st.capT = [0, THREAD_LEN, 0]; } },
    { dur: .8, at: e => { st.capT = [0, THREAD_LEN*(1 - e), 0]; st.capRot = -720*(1 - e); if (e >= 1) st.capT = [0, 0, 0]; } } ];
}
const slideCell = (c, from, to, dur) => ({ dur, at: e => { c.x = AX; c.z = AZ; c.y0 = from + (to - from)*e; } });
const carryCell = (c, to, dur = .6) => { let from = null; return { dur, at: e => { if (!from) from = [c.x, c.y0, c.z];
  const p = lerp3(from, to, e, 34); c.x = p[0]; c.y0 = p[1]; c.z = p[2]; if (e >= 1){ c.x = to[0]; c.y0 = to[1]; c.z = to[2]; } } }; };
function capButton(st, ui){
  if (st.busy) return ui.flash('One moment, still working');
  if (capHome(st)) runSeq(st, ui, capOffSteps(st), () => ui.flash('Cap off: the tail spring has let go of the cells'));
  else runSeq(st, ui, capOnSteps(st), () => ui.flash('Cap back on: the tail spring presses the cells again'));
}
function swap(st, ui){
  if (st.busy) return ui.flash('One moment, still working');
  if (isFresh(st)) return ui.flash('These cells are fresh (3.0 V) and the spares box is empty');
  const [i0, i1] = st.inLight, a = st.cells[i0], b = st.cells[i1], n0 = st.cells[2], n1 = st.cells[3];
  const steps = capHome(st) ? capOffSteps(st) : [];
  steps.push(slideCell(b, HOME_Y0[1], OUT_Y0, .55), carryCell(b, [USED[1].x, USED[1].y0, BT + CELL_R]),
    slideCell(a, HOME_Y0[0], OUT_Y0, .75), carryCell(a, [USED[0].x, USED[0].y0, BT + CELL_R]),
    carryCell(n0, [AX, OUT_Y0, AZ]), slideCell(n0, OUT_Y0, HOME_Y0[0], .75),
    carryCell(n1, [AX, OUT_Y0, AZ]), slideCell(n1, OUT_Y0, HOME_Y0[1], .55),
    { dur: .01, at: () => { st.inLight = [2, 3]; } }, ...capOnSteps(st));
  runSeq(st, ui, steps, () => ui.flash(st.sw > .5 ? 'Fresh cells in: 3.0 V, full brightness' : 'Fresh cells in: 3.0 V. Slide the switch'));
}

const initCells = () => [
  { x: AX, y0: HOME_Y0[0], z: AZ, fresh: false }, { x: AX, y0: HOME_Y0[1], z: AZ, fresh: false },
  { x: (BOXC.x0 + BOXC.x1)/2, y0: 172, z: BOX_CZ, fresh: true }, { x: (BOXC.x0 + BOXC.x1)/2, y0: 236, z: BOX_CZ, fresh: true } ];

      { label: 'Beam', value: Math.round(2*beamHalf(st.fd)) + '°', small: true },
      { label: 'Batteries', value: home ? (isFresh(st) ? '3.0 V' : '2.4 V') : 'out', small: true } ]; },

  params: (st, q) => {
    if (q.get('on') === '1') st.sw = st.swT = 1;
