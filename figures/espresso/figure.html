<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Espresso machine</title></head><body>
<script src="core.js"></script>
<script>
/* Espresso machine: a home single-group machine with a brew boiler and a steam thermoblock, on a kitchen counter.
   x = depth (front face x = 80), y = width (+y = viewer-left), z = up; 2 units = 1 cm (case 28 x 25 x 32 cm).

   TRUTH FIRST: how it really works, and where the water is after each step
   1 FILL THE TANK   water jug -> lid flap -> clear 1.8 L tank hung on the back (half the width, nearly full height).
                     The tank's spring valve sits in a socket in the tank seat; the intake hose leaves the socket
                     through the back wall.
   2 SWITCH ON       mains inlet -> control board -> power switch -> boiler element. The brew thermostat holds the
                     boiler at about 93 C; the ready light comes on when it is there.
   3 LOCK            the portafilter (basket of ground coffee) is lifted under the group head, its two lugs go into the
                     bayonet and the handle twists to the front: the basket rim seals against the gasket.
   4 PULL A SHOT     brew switch -> vibration pump: tank -> inlet filter -> valve -> intake hose -> flowmeter -> pump
                     -> OPV (bleeds back to the tank above ~9 bar) -> T-junction -> PTFE tube -> boiler -> 3-way solenoid
                     -> group head -> shower screen -> coffee puck -> basket -> spouts -> cup on the drip tray. The gauge
                     line from the boiler feed shows ~9 bar. Brew switch off: the solenoid vents the group through the
                     drain pipe into the drip tray, so the puck comes out dry.
   5 STEAM MILK      steam switch -> thermoblock heats to ~135 C. Steam knob opens the steam valve; the pump pulses
                     water from the T-junction through a check valve into the thermoblock, where it flashes to steam:
                     thermoblock -> steam pipe -> steam valve -> ball joint -> steam wand -> tip, under the milk in the
                     pitcher. The milk heats to ~60 C and the foam rises. Knob shut, steam switch off.

   PARTS (each is fixed to something)
   CASE       body shell with the brew recess . head . top cup-warmer plate and rail . tank seat . drip tray + grate
   WATER      water tank . tank lid + fill flap . tank valve . inlet filter . intake hose . flowmeter (on the chassis)
              . vibration pump on two rubber mounts (on the chassis) . OPV on the pump outlet . return hose to the tank
              . T-junction . PTFE tube up to the boiler
   BREW       boiler (on the head floor, bolted to the group) . heating element (horseshoe inside) . brew thermostat
              . thermal fuse . 3-way solenoid valve (on the boiler outlet) . drain pipe to the drip tray . group head
              . gasket . shower screen . portafilter . filter basket . coffee puck . spouts . cup + saucer
   STEAM      check valve . thermoblock (bracket to the left wall) . steam thermostat . steam pipe . steam valve (behind
              the knob, through the left wall) . steam knob . ball joint . steam wand . milk pitcher
   CONTROLS   pressure gauge (front) + gauge line . power / brew / steam rocker switches . three lights . control board
              (on the right wall) . mains inlet (back) . wiring harness . chassis plate */

const G = 3;                                   // counter top
const X0 = 24, XR = 62, X1 = 80;               // case back, back wall of the brew recess, front face
const Y0 = 26, Y1 = 76, ZT = 67, ZH = 43;      // right side, left side, top, underside of the head
const GX = 71, GY = 51;                        // axis of the group head and the boiler
const TK = { x0:12.5, x1:23.5, y0:52, y1:75.5, z0:7, z1:62 };
const ESP_FULL = 1.8, ESP_CAPL = 2.0;          // litres: a full fill, what the tank holds
const CASE_BOX = [[X0, Y0, G], [X1, Y1, ZT]];
const ROCK = [{ y:73, name:'POWER' }, { y:67, name:'BREW' }, { y:61, name:'STEAM' }];
const GAUGE = [34, 55, 5.5];                   // y, z, radius on the front
const KNOB = [68, 59];                         // steam knob (x, z) on the left side
const WAND = [[74, Y1, 47], [74, Y1 + 3, 47], [76, 83.5, 44], [83, 88, 12], [83, 88, 9.5]];
const WAND_R = [1.6, .9, .9, 1.1];
const PIT = { x:83, y:88, r0:7, r1:6, h:20 };
const PF_REST = [93, 40, 11.5], PF_IN = [71, 51, 32.6], PF_LOCK = 36;
const BRASS = { l:'#f1cf7a', m:'#d2a94e', d:'#93702c' }, COPPER = { l:'#f0b07a', m:'#d08a52', d:'#9a5a2c' };
const ALU = matOf('#d5d9dc'), RUBBER = matOf('#4a4642'), PCB = matOf('#3f8f5c'), WHITEP = matOf('#f4f1e8');
const WATER = '#4f9fd8', COFFEE = '#6b3a1c', CREMA = '#c58a4a', MILK = '#fbf8f0', RECESS = '#2b2523';
const SIL = '#e3f0f2', PTFE = '#f3f1ea', HOTW = '#e9773d', STEAMC = '#ffffff';

const eLerp = (a, b, t) => a.map((v, i) => v + (b[i] - v)*t);
const eClamp = t => Math.max(0, Math.min(1, t));
const eBoxOf = (pts, pad = 0) => [[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - pad), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + pad)];
const eCyl = (x, y, z0, z1, r, m, w = .9, n = 18) => ({ box:[[x - r, y - r, z0], [x + r, y + r, z1]], svg: cyl(x, y, z0, z1, r, m, toneI, w, n) });
const eBx = (x0, y0, z0, x1, y1, z1, m, w = .9, extra = '') => ({ box:[[x0, y0, z0], [x1, y1, z1]], svg: box(x0, y0, z0, x1, y1, z1, m, toneI, w) + extra });
const eRod = (a, b, r, m, w = .8, r1 = r) => ({ box: eBoxOf([a, b], Math.max(r, r1)), svg: rod(a, b, r, m, toneI, w, r1, 14) });
const eCylX = (x0, x1, y, z, r, m, w = .9) => ({ box:[[x0, y - r, z - r], [x1, y + r, z + r]], svg: cylX(x0, x1, y, z, r, m, toneI, w, 18) });
const espTxB = (x, y, z, str, size) => `<text transform="${txM(P(x, y, z), Dv(0,1,0), Dv(0,0,-1))}" font-size="${size}" fill="${INK}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em">${str}</text>`;

// a hose, pipe or wire in short pieces (each with its own box, so it sorts with the solids round it);
// flow = colour of the dashes that run along it while something flows, t = clock
function espTube(pts, col, w, flow = null, t = 0, len = 5){
  const out = []; let cum = 0;
  for (let i = 0; i < pts.length - 1; i++){
    const a = pts[i], b = pts[i + 1], n = Math.max(1, Math.round(Math.hypot(...sub(b, a)) / len));
    for (let j = 0; j < n; j++){
      const p = eLerp(a, b, j/n), q = eLerp(a, b, (j + 1)/n), d = pd([p, q], false), s0 = P(...p), s1 = P(...q);
      let svg = `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${f(2*w + .9)}" stroke-linecap="round"/>`
        + `<path d="${d}" fill="none" stroke="${col}" stroke-width="${f(2*w)}" stroke-linecap="round"/>`;
      if (flow) svg += `<path d="${d}" fill="none" stroke="${flow}" stroke-width="${f(1.1*w)}" stroke-dasharray="1.3 1.7" stroke-dashoffset="${(cum - t*12).toFixed(2)}"/>`;
      cum += Math.hypot(s1[0] - s0[0], s1[1] - s0[1]);
      out.push({ box: eBoxOf([p, q], .4), svg });
    }
  }
  return out;
}

/* ---------- what each process is doing right now (from its progress 0..1, -1 = not running) ---------- */
function espShotInfo(st){
  const t = st.shotT;
  if (t < 0) return { brew:0, pump:0, bar:0, pour:0, vent:0 };
  const up = ease(eClamp((t - .04)/.22)), down = t < .9 ? 1 : eClamp(1 - (t - .9)/.05);
  return { brew: t < .92 ? 1 : 0, pump: t > .04 && t < .9 ? 1 : 0, bar: 9.2*up*down, pour: t > .2 && t < .93 ? 1 : 0, vent: t > .9 ? 1 : 0 };
}
function espSteamInfo(st){
  const t = st.steamT;
  if (t < 0) return { sw:0, knob:0, steam:0, pump:0 };
  const knob = t < .25 ? 0 : t < .33 ? ease((t - .25)/.08) : t < .85 ? 1 : t < .93 ? 1 - ease((t - .85)/.08) : 0;
  return { sw:1, knob, steam: knob > .4 ? 1 : 0, pump: knob > .4 && (st.clock*3) % 1 < .5 ? 1 : 0 };
}
function espJugPose(st){
  const t = st.fillT, R0 = [12, 88, G], R1 = [18, 82, 70.2];
  if (t < 0) return { b: R0, a: 0, pour: 0 };
  const up = t < .16 ? ease(t/.16) : t < .9 ? 1 : 1 - ease((t - .9)/.1);
  const tilt = t < .18 ? 0 : t < .28 ? ease((t - .18)/.1) : t < .8 ? 1 : t < .9 ? 1 - ease((t - .8)/.1) : 0;
  return { b: eLerp(R0, R1, up), a: 70*tilt*Math.PI/180, pour: t > .29 && t < .8 ? 1 : 0 };
}
function espPfPose(st){
  const s = st.pf;
  if (s <= .6){ const u = s/.6, mv = ease(eClamp((u - .3)/.7));
    return { c: [PF_REST[0] + (PF_IN[0] - PF_REST[0])*mv, PF_REST[1] + (PF_IN[1] - PF_REST[1])*mv, PF_REST[2] + (PF_IN[2] - PF_REST[2])*ease(eClamp(u/.4))], th: -90 + 130*mv }; }
  const u = (s - .6)/.4;
  return { c: [PF_IN[0], PF_IN[1], PF_IN[2] + (PF_LOCK - PF_IN[2])*ease(eClamp(u/.5))], th: 40*(1 - ease(eClamp((u - .5)/.5))) };
}

/* ---------- the case: a box with the brew recess cut out under the head (a C-shaped side profile) ----------
   Two convex blocks: the back block (x 24..62, full height) and the head (x 62..80 above z 43). Whichever is nearer
   the viewer is drawn last and carries the faces they share (both sides, the top), so no seam is inked. */
const espQuad = (poly, n, m, w) => face(pd(poly), tone(n, m)) + ink(pd(poly), w);
const espCapPoly = y => [[X0, y, G], [XR, y, G], [XR, y, ZH], [X1, y, ZH], [X1, y, ZT], [X0, y, ZT]];
const ESP_BACKC = [], ESP_HEADC = [];
for (const y of [Y0, Y1]) for (const z of [G, ZT]) for (const x of [X0, XR]) ESP_BACKC.push([x, y, z]);
for (const y of [Y0, Y1]) for (const z of [ZH, ZT]) for (const x of [XR, X1]) ESP_HEADC.push([x, y, z]);
function espFrontDecor(){
  let s = shape([[X1 + .05, Y0 + 1, 44], [X1 + .05, Y1 - 1, 44], [X1 + .05, Y1 - 1, 45.2], [X1 + .05, Y0 + 1, 45.2]], METAL.l, .8);   // chrome trim
  s += tx(X1 + .06, 50, 61.2, 'ESPRESSO', 2.4, INK, 800);
  for (const r of ROCK) s += tx(X1 + .06, r.y, 48.9, r.name, 1.25, INK, 800);
  return s;
}
function espSideDecor(y){
  const o = y === Y1 ? .06 : -.06; let d = '';
  for (let z = 10; z <= 20; z += 2.5) d += pd([[30, y + o, z], [52, y + o, z]], false);
  return `<path d="${d}" fill="none" stroke="${INK}" stroke-width="1.1" opacity=".55"/>`;
}
function espBackDecor(){
  const x = X0 - .05;
  let s = shape(on(PX(x), rrUV(29, 42, 47, 53, 1.2)), '#f3f0e6', .9);
  s += espTxB(x - .02, 38, 49, '230V 50HZ 1350W', 1.4) + espTxB(x - .02, 38, 45.5, 'ESPRESSO E1', 1.3);
  let d = ''; for (let z = 24; z <= 36; z += 2.4) d += pd([[x, 30, z], [x, 46, z]], false);
  s += `<path d="${d}" fill="none" stroke="${INK}" stroke-width="1.1" opacity=".55"/>`;
  return s + shape(on(PX(x), rrUV(33, 11, 39, 17, .8)), RECESS, 1);    // mains socket
}
function espTopDecor(m){
  const pl = on(PZ(ZT + .05), rectUV(28, 30, 76, 72));
  let d = ''; for (let x = 32; x <= 72; x += 4) d += pd([[x, 30, ZT + .07], [x, 72, ZT + .07]], false);
  return shape(pl, mix(tone([0,0,1], m), '#ffffff', .22), 1.1) + `<path d="${d}" fill="none" stroke="${INK}" stroke-width=".7" opacity=".45"/>`;
}
function espCase(m, inner){
  const FR = CAM_V[0] >= 0;
  let early, late;
  if (FR){
    early = hullInk(ESP_BACKC, 2.8) + (vis([1,0,0]) ? espQuad([[XR, Y0, G], [XR, Y1, G], [XR, Y1, ZH], [XR, Y0, ZH]], [1,0,0], m, 1.8) : '');
    late = hullInk(ESP_HEADC, 2.8) + (vis([1,0,0]) ? espQuad([[X1, Y0, ZH], [X1, Y1, ZH], [X1, Y1, ZT], [X1, Y0, ZT]], [1,0,0], m, 2.2) + espFrontDecor() : '');
  } else {
    early = hullInk(ESP_HEADC, 2.8);
    late = hullInk(ESP_BACKC, 2.8) + (vis([-1,0,0]) ? espQuad([[X0, Y0, G], [X0, Y1, G], [X0, Y1, ZT], [X0, Y0, ZT]], [-1,0,0], m, 2.2) + espBackDecor() : '');
  }
  for (const [y, n] of [[Y0, [0,-1,0]], [Y1, [0,1,0]]]) if (vis(n)) late += espQuad(espCapPoly(y), n, m, 2.2) + espSideDecor(y);
  if (vis([0,0,1])) late += espQuad([[X0, Y0, ZT], [X1, Y0, ZT], [X1, Y1, ZT], [X0, Y1, ZT]], [0,0,1], m, 2.2) + espTopDecor(m);
  return early + inner + late;
}

/* ---------- things in the brew recess: drip tray, cup, coffee streams, group head, portafilter ---------- */
const espStream = (a, b) => { const d = pd([a, b], false);
  return `<path d="${d}" fill="none" stroke="${INK}" stroke-width="1.5" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${COFFEE}" stroke-width=".8" stroke-linecap="round"/>`; };
function espTray(st){
  let s = box(XR, 34, G, 86, 68, 10, DARK, toneI, 1.4);
  if (vis([1,0,0])){ s += shape(on(PX(86.05), rrUV(59, 4.5, 64.5, 8.5, 1)), '#cfe9f0', .8) + shape(on(PX(86.1), rectUV(60.2, 5, 63.3, 6.2 + 1.2*st.drip)), '#e2483d', .5); }
  s += box(XR + .5, 34.5, 10, 85.5, 67.5, 10.6, METAL, toneI, .9);
  if (vis([0,0,1])){ let d = ''; for (let x = 64.5; x <= 83.5; x += 1.9) d += pd([[x, 37, 10.65], [x, 65, 10.65]], false);
    s += `<path d="${d}" fill="none" stroke="${METAL.d}" stroke-width="1.2" stroke-linecap="round"/>`; }
  return { box: [[XR, 34, G], [86, 68, 10.6]], svg: s };
}
function espCup(st, sh){
  const A = on(PZ(11.3), ellUV(GX, GY, 3.4, 3.4, 24)), B = on(PZ(21), ellUV(GX, GY, 4.8, 4.8, 24));
  let cont = fill(pd(on(PZ(11.4), ellUV(GX, GY, 3.3, 3.3, 24))), CERAMIC.m), zs = 11.4;
  if (st.ml > .3){ zs = 11.5 + 8*st.ml/40; const r = 3.4 + 1.4*(zs - 11.3)/9.7 - .1, cr = on(PZ(zs), ellUV(GX, GY, r, r, 24));
    cont += fill(pd(cr), CREMA) + fill(pd(on(PZ(zs + .02), ellUV(GX + .4, GY - .3, r*.55, r*.5, 16))), mix(CREMA, '#f0c890', .45)) + ink(pd(cr), .5); }
  if (sh.pour) for (const g of [-1.6, 1.6]) cont += espStream([GX, GY + g, 21], [GX, GY + g*.6, zs]);
  const hp = [[GX, GY + 4.5, 19.4], [GX, GY + 7.2, 18.6], [GX, GY + 7.2, 14.6], [GX, GY + 3.9, 13.6]];
  let hd = ''; for (let i = 0; i < 3; i++) hd += rod(hp[i], hp[i + 1], .65, CERAMIC, toneI, .8, .65, 10);
  const cup = openShell(A, B, n => toneI(n, CERAMIC), cont) + ink(pd(B), 1) + hullInk([...A, ...B], 1.3);
  const sau = cyl(GX, GY, 10.6, 11.3, 6.4, CERAMIC, toneI, 1, 28);
  return { box: [[GX - 6.4, GY - 6.4, 10.6], [GX + 6.4, GY + 7.9, 21]], svg: sau + (vis([0,1,0]) ? cup + hd : hd + cup) };
}
function espGroup(){
  const s = cyl(GX, GY, 36, 36.3, 4.6, METAL, toneI, .6, 20) + cyl(GX, GY, 36.3, 36.9, 5.9, DARK, toneI, .7, 24)
    + cyl(GX, GY, 36.9, 41.6, 6.5, METAL, toneI, 1.3, 28) + cyl(GX, GY, 41.6, 43, 7, METAL, toneI, 1.1, 28);
  return { box: [[GX - 7, GY - 7, 36], [GX + 7, GY + 7, ZH]], svg: s };
}
function espPf(st, k){
  const { c:[cx, cy, cz], th } = espPfPose(st), a = th*Math.PI/180, ca = Math.cos(a), sa = Math.sin(a), R = 5.6, nx = -sa, ny = ca;
  const droop = 2*(1 - eClamp(st.pf*4));                                  // at rest the handle lies on the counter
  const hb = [cx + R*ca, cy + R*sa, cz - 2.4], hn = [cx + 9*ca, cy + 9*sa, cz - 3 - droop*.3], he = [cx + 20*ca, cy + 20*sa, cz - 4.6 - droop];
  // under the body: the spout block and its two spouts
  let low = '';
  for (const [p, q] of [-1, 1].map(g => [[cx + g*1.1*nx, cy + g*1.1*ny, cz - 6.2], [cx + g*1.6*nx, cy + g*1.6*ny, cz - 8.5]]).sort((p, q) => depthOf(p[1]) - depthOf(q[1])))
    low += rod(p, q, .55, METAL, toneI, .7, .45, 10);
  low += cyl(cx, cy, cz - 6.2, cz - 4.5, 2.1, METAL, toneI, .8, 14);
  let body = cyl(cx, cy, cz - 4.5, cz, R, METAL, toneI, 1.2, 28);
  const inner = on(PZ(cz + .02), ellUV(cx, cy, R - .9, R - .9, 24));
  body += fill(pd(inner), st.spent ? '#3a2416' : '#5a3a22') + ink(pd(inner), .7);
  // the two lugs that ride the group's bayonet: the far one before the body, the near one after
  for (const g of [-1, 1]){ const lug = rod([cx + g*(R - .2)*nx, cy + g*(R - .2)*ny, cz - .8], [cx + g*(R + 1.2)*nx, cy + g*(R + 1.2)*ny, cz - .8], .55, METAL, toneI, .6, .55, 8);
    body = vis([g*nx, g*ny, 0]) ? body + lug : lug + body; }
  if (k > 0) body = cyl(cx, cy, cz - 4.1, cz - .1, R - .8, METAL, toneI, .7, 22) + cyl(cx, cy, cz - 3.9, cz - 1.3, R - 1, matOf(st.spent ? '#3a2416' : '#6a4428'), toneI, .6, 22)
    + `<g opacity="${f(1 - .65*k)}">${body}</g>`;
  const hf = vis([ca, sa, 0]);
  const neck = rod(hb, hn, 1.05, METAL, toneI, .9, 1.05, 12), grip = rod(hn, he, 1.45, DARK, toneI, 1.2, 1.75, 14);
  const hs = hf ? neck + grip : grip + neck;
  return { box: eBoxOf([[cx - R - 1.2, cy - R - 1.2, cz - 8.5], [cx + R + 1.2, cy + R + 1.2, cz], he.map(v => v - 1.8), he.map(v => v + 1.8)]),
    svg: low + (hf ? body + hs : hs + body), handle: eLerp(hn, he, .5) };
}
function espRecess(st, k, sh){
  const out = [espTray(st), espCup(st, sh), espGroup()];
  if (sh.pour) out.push({ box: [[GX - .6, GY - 2, 21], [GX + .6, GY + 2, 27.5]], svg: [-1.6, 1.6].map(g => espStream([GX, GY + g, 27.5], [GX, GY + g, 21])).join('') });
  if (st.pf > 0) out.push(espPf(st, k));
  return out;
}

/* ---------- outside the case ---------- */
function espTank(st, m){
  const { x0, x1, y0, y1, z0, z1 } = TK;
  let s = box(12, 51.5, G, 24, 76, z0, m, tone, 1.4);                    // the tank seat, part of the case
  const fcs = [[[1,0,0], [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]], [[-1,0,0], [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],
               [[0,1,0], [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]], [[0,-1,0], [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]]];
  for (const [n, q] of fcs) if (!vis(n)) s += fill(pd(q), CLEAR.d, 'opacity=".4"') + ink(pd(q), .7);
  // inside: the valve in the floor with the inlet filter on it, the return port, then the water
  s += cyl(18, 64, z0, z0 + 2.2, 2.2, WHITEP, toneI, .8, 16) + cyl(18, 64, z0 + 2.2, z0 + 7, 1.6, METAL, toneI, .8, 16)
    + cyl(18, 70, z0, z0 + 3, .9, WHITEP, toneI, .7, 12);
  const wz = z0 + .4 + (z1 - z0 - 1)*st.water/ESP_CAPL;
  if (st.water > .01) s += `<g opacity=".5">${box(x0 + .4, y0 + .4, z0 + .3, x1 - .4, y1 - .4, wz, matOf('#7cc0e6'), toneI, 0)}</g>`
    + `<path d="${pd(on(PZ(wz), rectUV(x0 + .4, y0 + .4, x1 - .4, y1 - .4)))}" fill="none" stroke="#3c86c0" stroke-width=".9"/>`;
  for (const [n, q] of fcs) if (vis(n)){ s += fill(pd(q), CLEAR.l, 'opacity=".28"') + ink(pd(q), 1);
    const c = avg(q), e = sub(q[1], q[0]), up = [0, 0, 1];
    for (const o of [-.28, -.18]) s += `<path d="${pd([c.map((v, i) => v + e[i]*o - up[i]*18), c.map((v, i) => v + e[i]*(o + .12) + up[i]*14)], false)}" fill="none" stroke="#ffffff" stroke-width="1.4" opacity=".38" stroke-linecap="round"/>`; }
  s += box(12, 51.5, z1, 24, 76, z1 + 2, DARK, toneI, 1.2);             // lid
  const cs = []; for (const x of [12, 24]) for (const y of [51.5, 76]) for (const z of [G, z1 + 2]) cs.push([x, y, z]);
  return { box: [[12, 51.5, G], [24, 76, z1 + 2]], svg: s + hullInk(cs, 1.8) };
}
function espFlap(st){

    const gap = Math.min(h + 3*u, (bottom - tops[side] - h)/Math.max(1,col.length - 1));
    col.forEach((it,i) => {
      const n = ((window.__ln || (window.__ln = {}))[it.text] || (__ln[it.text] = Object.keys(__ln).length + 1));
      const w = phone ? h*(n > 9 ? 1.3 : 1) : it.text.length*fs*.62 + fs*1.5;
      const x = side ? vb.x + vb.width - w/2 - 3*u : vb.x + w/2 + 3*u;
      const y = tops[side] + h/2 + i*gap, edge = x + (side ? -w/2 : w/2);
      result += `<g class="tag${it.on ? ' on' : ''}" data-n="${n}" data-t="${it.text}">`
        + `<path d="M${f(it.p[0])} ${f(it.p[1])}L${f(edge)} ${f(y)}" fill="none" stroke="${INK}" stroke-width="1"/>`
        + `<circle cx="${f(it.p[0])}" cy="${f(it.p[1])}" r="${f(u)}" fill="${INK}"/>`
        + `<rect x="${f(x-w/2)}" y="${f(y-h/2)}" width="${f(w)}" height="${f(h)}" rx="${f(h/2)}" fill="${it.on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
        + `<text x="${f(x)}" y="${f(y+fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" fill="${INK}">${phone ? n : it.text}</text></g>`;
    });
  });
  return result;
}

/* ---------- scene ---------- */
function espScene(st, m){
  const k = ease(st.xr || 0), sh = espShotInfo(st), sm = espSteamInfo(st);
  const btop = boardTop(2, 2, 102, 104, G, 6);
  let s = board(2, 2, 102, 104, G, 6);
  const mc = []; for (const x of [12, X1]) for (const y of [Y0, Y1]) for (const z of [G, ZT]) mc.push([x, y, z]);
  const jug = espJug(st), pit = espPitcher(st, sm), pf = espPf(st, 0);
  s += castShadow(mc, G, btop) + castShadow(jug.pts, G, btop) + castShadow(pit.pts, G, btop);
  if (st.pf < 1) s += castShadow([[PF_REST[0] - 6, PF_REST[1] - 6, G], [PF_REST[0] + 6, PF_REST[1] + 6, G], pf.box[0], pf.box[1]], G, btop);
  const ext = [espTank(st, m), espFlap(st), jug, pit, espWand(st, sm), espKnob(sm), espCord(), ...espFrontParts(st, sh, sm)];
  for (let i = 0; i < 4; i++){ const a = ESP_RAIL[i], b = ESP_RAIL[(i + 1) % 4];
    ext.push(eRod([a[0], a[1], ZT + 1.2], [b[0], b[1], ZT + 1.2], .55, METAL, .8), eCyl(a[0], a[1], ZT, ZT + 1.2, .7, METAL, .6, 10)); }
  if (st.pf <= 0) ext.push(espPf(st, k));
  const rec = espRecess(st, k, sh);
  if (k <= 0) s += byDepth([{ box: CASE_BOX, svg: espCase(m, byDepth(rec)) }, ...ext]);
  else {
    const caseIt = { box: CASE_BOX };
    s += byDepth(ext.filter(it => sepOrder(it, caseIt) < 0)) + `<g opacity="${f(1 - .8*k)}">${espCase(m, '')}</g>`
      + byDepth([...rec, ...espMech(st, k, sh, sm)]) + byDepth(ext.filter(it => sepOrder(it, caseIt) >= 0));
  }
  const pfH = espPf(st, 0).handle, B = [12, 90, Y0, 96, G, ZT + 2];
  if (k > .6) s += espCallouts([
    { at:[TK.x1, 74, 30], text:'WATER TANK', on: st.fillT >= 0 },
    { at:[18, 63, 13], text:'INLET FILTER', on: pump(sh, sm) },
    { at:[18, 65.5, 8], text:'TANK VALVE', on: pump(sh, sm) },
    { at:[27, 62, 7], text:'INTAKE HOSE', on: pump(sh, sm) },
    { at:[29, 59.5, 8.5], text:'FLOWMETER', on: pump(sh, sm) },
    { at:[39, 48, 14], text:'VIBRATION PUMP', on: pump(sh, sm) },
    { at:[36, 46.5, 6], text:'RUBBER MOUNTS', on: false },
    { at:[50, 46, 13], text:'OPV', on: sh.bar > 8.8 },
    { at:[42, 53, 17], text:'RETURN HOSE', on: sh.bar > 8.8 },
    { at:[55, 51.5, 13], text:'T-JUNCTION', on: pump(sh, sm) },
    { at:[54.5, 50, 30], text:'PTFE TUBE', on: sh.pump },
    { at:[GX - 1, GY + 7.4, 50], text:'BOILER', on: st.heat },
    { at:[GX + 4.5, GY, 52], text:'HEATING ELEMENT', on: st.heat },
    { at:[GX, GY + 4.5, 57.2], text:'BREW THERMOSTAT', on: st.on },
    { at:[GX, GY - 4.5, 57], text:'THERMAL FUSE', on: false },
    { at:[58, 47, 55], text:'SOLENOID VALVE', on: sh.brew },
    { at:[58, 38.5, 25], text:'DRAIN PIPE', on: sh.vent },
    { at:[GX, GY + 6.5, 40], text:'GROUP HEAD', on: sh.pour },
    { at:[GX - 4, GY + 4.2, 36.6], text:'GASKET', on: false },
    { at:pfH, text:'PORTAFILTER', on: st.phase === 'lock' },
    { at:[espPfPose(st).c[0] - 3, espPfPose(st).c[1] + 3, espPfPose(st).c[2] - 2], text:'FILTER BASKET', on: sh.pour },
    { at:[GX, GY + 1.6, espPfPose(st).c[2] - 8.3], text:'SPOUTS', on: sh.pour },
    { at:[86, 64, 6], text:'DRIP TRAY', on: sh.vent },
    { at:[54.5, 58, 13.5], text:'CHECK VALVE', on: sm.pump },
    { at:[44, 72, 30], text:'THERMOBLOCK', on: st.sheat },
    { at:[39.5, 66, 37.2], text:'STEAM THERMOSTAT', on: sm.sw },
    { at:[68, 74, 61], text:'STEAM VALVE', on: sm.knob > .5 },
    { at:[56, 68, 50], text:'STEAM PIPE', on: sm.steam },
    { at:eLerp(WAND[2], WAND[3], .3), text:'STEAM WAND', on: sm.steam },
    { at:[X1, GAUGE[0], GAUGE[1] + 3.6], text:'PRESSURE GAUGE', on: sh.bar > .5 },
    { at:[66, 36.5, 50.5], text:'GAUGE LINE', on: sh.bar > .5 },
    { at:[42, 28, 34], text:'CONTROL BOARD', on: st.on },
    { at:[X0, 36, 17], text:'MAINS INLET', on: st.on },
    { at:[44, 40, 40], text:'WIRING', on: st.on },
    { at:[78, 67, 58.5], text:'SWITCHES', on: sh.brew || sm.sw },
  ], B);
  else s += xrCallouts([
    { at:[TK.x1, 74, 30], text:'WATER TANK', on: st.fillT >= 0 },
    { at:[12, 88, G + 15], text:'WATER JUG', on: st.fillT >= 0 },
    { at:[50, 72, ZT + 1.2], text:'CUP WARMER', on: false },
    { at:[X1 + 2.2, GAUGE[0], GAUGE[1] + GAUGE[2]], text:'PRESSURE GAUGE', on: sh.bar > .5, n:[1,0,0] },
    { at:[X1 + 1.8, ROCK[1].y, 58], text:'SWITCHES', on: st.on, n:[1,0,0] },
    { at:[KNOB[0], Y1 + 3.4, KNOB[1] + 2.8], text:'STEAM KNOB', on: sm.knob > .5, n:[0,1,0] },
    { at:eLerp(WAND[2], WAND[3], .3), text:'STEAM WAND', on: sm.steam },
    { at:[PIT.x, PIT.y + PIT.r1, G + PIT.h], text:'MILK PITCHER', on: sm.steam },
    { at:[GX, GY + 7, 41], text:'GROUP HEAD', on: sh.pour },
    { at:pfH, text:'PORTAFILTER', on: st.phase === 'lock' },
    { at:[GX, GY + 4.8, 20], text:'CUP', on: sh.pour },
    { at:[86, 64, 6], text:'DRIP TRAY', on: sh.vent, n:[1,0,0] },
  ].filter(it => !it.n || vis(it.n)), B);
  return s;
}
const pump = (sh, sm) => !!(sh.pump || sm.pump);

/* ---------- behaviour: one state object, one clock ---------- */
let ui, espLoopOn = false;
function espStep(st, dt){
  st.clock += dt;
  const sh = espShotInfo(st), sm = espSteamInfo(st);
  // brew boiler: the thermostat keeps it at 93 C; a shot draws heat out of it
  st.heat = st.on && st.temp < 93 ? 1 : 0;
  st.temp = Math.max(22, Math.min(93, st.temp + (st.heat ? 30*dt : st.on ? 0 : -3*dt) - (sh.pump ? 2.5*dt : 0)));
  // steam thermoblock: heats while the steam switch is on
  st.sheat = sm.sw && st.stemp < 135 ? 1 : 0;
  st.stemp = Math.max(22, Math.min(135, st.stemp + (st.sheat ? 70*dt : sm.sw ? 0 : -12*dt) - (sm.steam ? 4*dt : 0)));
  if (st.fillT >= 0){ st.fillT = Math.min(1, st.fillT + dt/3.2); const p = eClamp((st.fillT - .3)/.5);
    st.water = st.w0 + (ESP_FULL - st.w0)*p; st.jug = 1 - p; if (st.fillT >= 1){ st.fillT = -1; st.phase = 'idle'; } }
  if (st.phase === 'lock'){ st.pf = Math.min(1, st.pf + dt/1.9); if (st.pf >= 1) st.phase = 'idle'; }
  if (st.phase === 'shot'){ st.shotT = Math.min(1, st.shotT + dt/5.5);
    if (sh.pour && st.shotT < .9) st.ml = Math.min(38, st.ml + dt*38/(.68*5.5));
    if (sh.pump) st.water = Math.max(0, st.water - dt*.012);
    if (sh.vent) st.drip = Math.min(1, st.drip + dt*.8);
    if (st.shotT >= 1){ st.shotT = -1; st.phase = 'idle'; st.spent = 1; } }
  if (st.phase === 'steam'){ const nt = st.steamT + dt/6;
    st.steamT = nt > .25 && st.stemp < 125 ? Math.min(st.steamT, .2499) : Math.min(1, nt);
    if (sm.steam){ st.foam = Math.min(1, st.foam + dt/3); st.milkT = Math.min(62, st.milkT + dt*56/3); st.water = Math.max(0, st.water - dt*.004); }
    if (st.steamT >= 1){ st.steamT = -1; st.phase = 'idle'; } }
  return st.fillT >= 0 || st.phase !== 'idle' || (st.on && st.temp < 93) || (!st.on && st.temp > 22) || st.stemp > 22;
}
function espRun(){
  if (espLoopOn) return; espLoopOn = true;
  ui.animate(dt => { const busy = espStep(ui.st, dt); if (!busy) espLoopOn = false; return busy; });
}
function espBusy(st){ if (st.phase !== 'idle'){ ui.flash('One step at a time — wait a moment'); return true; } return false; }
function espFill(st){
  if (espBusy(st)) return;
  if (st.water >= ESP_FULL - .05) return ui.flash('The tank is full');
  st.phase = 'fill'; st.fillT = 0; st.w0 = st.water; st.jug = 1; espRun();
}
function espPower(st){
  if (st.on) return ui.flash('It is on already');
  if (st.water < .15) return ui.flash('Fill the tank first');
  st.on = 1; espRun();
}
function espLock(st){
  if (st.pf >= 1) return ui.flash('The portafilter is locked in');
  if (espBusy(st)) return;
  st.phase = 'lock'; espRun();
}
function espShot(st){
  if (st.phase === 'shot' || espBusy(st)) return;
  if (st.water < .1) return ui.flash('Fill the tank first');
  if (!st.on) return ui.flash('Switch on first');
  if (st.pf < 1) return ui.flash('Lock the portafilter first');
  if (st.spent) return ui.flash('That coffee is spent — one shot per dose');
  if (st.temp < 90) return ui.flash('Still heating — wait for the green light');
  st.phase = 'shot'; st.shotT = 0; espRun();
}
function espSteam(st){
  if (st.phase === 'steam' || espBusy(st)) return;
  if (st.water < .1) return ui.flash('Fill the tank first');
  if (!st.on) return ui.flash('Switch on first');
  if (st.foam >= 1) return ui.flash('The milk is steamed');
  st.phase = 'steam'; st.steamT = 0; espRun();
}

ui = mountFigure({
  fig:'12', turn:'full', title:'Espresso machine',
  size:[104, 106, 84], palette:'tomato',
  state:{ phase:'idle', clock:0, water:.2, w0:.2, jug:1, fillT:-1, on:0, temp:22, heat:0, stemp:22, sheat:0, pf:0, shotT:-1, ml:0, spent:0, drip:0,
          steamT:-1, foam:0, milkT:6 },
  scene: espScene,
  stats: st => [
    { label:'Boiler', value:`${Math.round(st.temp)}°C` },
    { label:'Pressure', value:`${espShotInfo(st).bar.toFixed(1)} bar`, small:true },
    { label:'In the cup', value:`${Math.round(st.ml)} ml`, small:true },
    { label:'Milk', value:`${Math.round(st.milkT)}°C`, small:true },
  ],
  buttons:[
    { label:'Fill the tank', onClick: st => espFill(st) },
    { label:'Switch on', onClick: st => espPower(st) },
    { label:'Lock the portafilter', onClick: st => espLock(st) },
    { label:'Pull a shot', onClick: st => espShot(st) },
    { label:'Steam milk', onClick: st => espSteam(st) },
  ],
  params:(st, q) => {
    for (const key of ['water', 'temp', 'pf', 'ml', 'foam', 'milkT', 'stemp', 'jug']) if (q.has(key)) st[key] = +q.get(key);
    if (q.get('on') === '1'){ st.on = 1; if (!q.has('temp')) st.temp = 93; }
    if (q.has('fill')){ st.phase = 'fill'; st.fillT = +q.get('fill'); }
    if (q.has('shot')){ st.phase = 'shot'; st.shotT = +q.get('shot'); st.on = 1; st.temp = 93; st.pf = 1; st.water = Math.max(st.water, 1.5); }
    if (q.has('steam')){ st.phase = 'steam'; st.steamT = +q.get('steam'); st.on = 1; st.stemp = 135; st.water = Math.max(st.water, 1.5); }
  },
});
xrMount(() => ui, () => '');
new ResizeObserver(() => ui.invalidate()).observe(document.getElementById('fig'));
</script></body></html>
