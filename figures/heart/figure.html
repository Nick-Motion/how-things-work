<script>
/* Truth first. Enlarged teaching specimen on a stand, not a medical simulator.
   Sources: https://www.nhlbi.nih.gov/health/heart/blood-flow
   https://www.nhlbi.nih.gov/health/heart/heart-beats
   1. Systemic venous blood enters the right atrium through the venae cavae.
   2. During filling, tricuspid and mitral valves admit blood to the ventricles.
   3. Both ventricles contract together. AV valves close; pulmonary and aortic valves open.
      The right ventricle sends blood to the lungs. The left sends oxygenated blood to the body.
   4. Lungs oxygenate blood; four pulmonary veins return it to the left atrium.
      The tracked parcel takes several beats to traverse the deliberately shortened lung loop.
   5. Valves close passively under reverse pressure. Holding all four open is a teaching fault,
      causing AV regurgitation in systole and arterial regurgitation in diastole.
   6. SA node excites atria; AV delay precedes His, bundle branches and Purkinje activation.
   Blue and red denote oxygen content, not the literal colour of blood. Gold is a signal overlay.
   Anatomy is simplified and enlarged. The separate lung lobes show the external circulation.
   Parts held by the myocardium: four chambers, septa, four valve annuli and their leaflets,
   papillary muscles and chordae attached to the AV leaflets, SA/AV nodes and conduction tissue.
   Vessels join their named chambers. Coronary arteries run on the epicardium.
   Apparatus: board supports the post and cradle under the specimen, a rate dial, and a
   stethoscope with chestpiece, tubing, binaural tubes and eartips. No invented heart machinery.
*/

const heartState = {mode:'idle', phase:0, bpm:60, held:false, tour:-1, elapsed:0};
let heartUI, heartLoop = false;
const heartBounds = pts => [[0,1,2].map(k=>Math.min(...pts.map(p=>p[k]))),[0,1,2].map(k=>Math.max(...pts.map(p=>p[k])))];

const heartDot = (p,r,col) => { const q=P(...p); return `<circle cx="${f(q[0])}" cy="${f(q[1])}" r="${r}" fill="${col}" stroke="${INK}" stroke-width=".6"/>`; };
function heartEllipsoid(c,r,m){

}
function heartTube(parts,p,r,col){
  for(let i=0;i<p.length-1;i++) {const a=p[i],b=p[i+1]; parts.push({box:heartBounds([a.map(v=>v-r),b.map(v=>v+r),a.map(v=>v+r),b.map(v=>v-r)]),svg:rod(a,b,r,matOf(col),toneI,.9,r,12)});}
}
function heartArrow(p,t,col){

  return `<path d="${pd(p,false)}" fill="none" stroke="${col}" stroke-width="1.2" stroke-dasharray="2 2" opacity=".7"/>`+heartDot(b,2.3,col)+`<path d="M${f(q[0])} ${f(q[1])}l${f(-4*Math.cos(ang-.5))} ${f(-4*Math.sin(ang-.5))}M${f(q[0])} ${f(q[1])}l${f(-4*Math.cos(ang+.5))} ${f(-4*Math.sin(ang+.5))}" fill="none" stroke="${col}" stroke-width="1.4"/>`;
}
function heartLabels(items){
  const el=document.getElementById('fig'), vb=el.viewBox.baseVal, matrix=el.getScreenCTM(), original=INK_K;
  const projected=items.map(it=>({...it,q:P(...it.at)})).sort((a,b)=>a.q[0]-b.q[0]);
  const columns=[projected.slice(0,Math.ceil(items.length/2)),projected.slice(Math.ceil(items.length/2))];
  let svg='', leaders='';
  try{
    if(innerWidth>560)INK_K*=.65;
    columns.forEach((col,i)=>{
      col.sort((a,b)=>a.q[1]-b.q[1]);
      const control=document.getElementById(i?'stats':'btns').getBoundingClientRect();
      const top=matrix?new DOMPoint(control.right,control.bottom+14).matrixTransform(matrix.inverse()).y:vb.height*.3;
      const bottom=vb.height*.90, x=vb.width*(i?.83:.19);
      col.forEach((it,j)=>{
        const y=top+(bottom-top)*j/Math.max(1,col.length-1), pill=tag(it.at,(x-it.q[0])/INK_K,(y-it.q[1])/INK_K,it.text,it.on);
        const leader=pill.match(/<path[^>]*\/><circle[^>]*\/>/)[0];
        leaders+=leader;svg+=pill.replace(leader,'');
      });
    });
  }finally{INK_K=original;}
  return `<g class="heart-labels" pointer-events="none">${leaders}${svg}</g>`;
}
function heartScene(st,m){
  const k=ease(st.xr||0), p=st.phase, systole=p>=.4&&p<.75, squeeze=systole?Math.sin((p-.4)/.35*Math.PI)*.07:0;
  const parts=[], sceneParts=[], labels=[], put=(b,svg)=>parts.push({box:b,svg}), label=(at,text,on=false)=>labels.push({at,text,on});

  let svg=board(0,0,90,112,3,5,WOOD);
  svg+=castShadow([[20,30,25],[50,75,80],[33,44,119],[23,99,70],[23,6,70]],3,boardTop(0,0,90,112,3,5));
  sceneParts.push({box:[[25,47,3],[31,53,20]],svg:cyl(28,50,3,20,3,METAL)},
    {box:[[25,42,17],[35,53,29]],svg:rod([28,50,20],[32,45,26],3,METAL)});
  label([28,50,12],'DISPLAY STAND');
  for(const [y,name] of [[9,'LEFT LUNG'],[96,'RIGHT LUNG']]){
    put([[15,y-8,58],[30,y+8,88]],heartEllipsoid([22,y,73],[7,8,15],matOf('#dca2a5')));
    label([22,y,72],name,st.tour>=6&&st.tour<8);
  }
  const outer=[];
  for(const ch of heartChambers){
    const rr=ch.r.map(v=>v*(1-squeeze)), shell=heartEllipsoid(ch.c,rr,m);
    outer.push({box:heartBounds([ch.c.map((v,i)=>v-rr[i]),ch.c.map((v,i)=>v+rr[i])]),svg:`<g opacity="${f(1-.87*k)}">${shell}</g>`});

  parts.push(...outer);
  for(const v of heartVessels){
    heartTube(parts,v.p,v.r,v.col); label(v.p[Math.min(1,v.p.length-1)],v.name,st.mode!=='idle');

  if(k>0){
    const inside=[];
    for(const ch of heartChambers){const rr=ch.r.map(v=>v*.73*(1-squeeze)); inside.push({box:heartBounds([ch.c.map((v,i)=>v-rr[i]),ch.c.map((v,i)=>v+rr[i])]),svg:`<g opacity=".62">${heartEllipsoid(ch.c,rr,matOf(ch.colour))}</g>`});label(ch.c,ch.name,st.mode!=='idle');}
    inside.push({box:[[28,50,28],[41,53,67]],svg:box(28,50,28,41,53,67,matOf('#d9a8a0'),toneI,.8)});label([37,51,46],'VENTRICULAR SEPTUM');
    inside.push({box:[[26,50,68],[38,52,84]],svg:box(26,50,68,38,52,84,matOf('#d9a8a0'),toneI,.7)});label([30,51,77],'ATRIAL SEPTUM');
    for(const v of heartValves){
      const open=st.held||(v.av?!systole:systole), c=v.c, top=on(PZ(c[2]),ellUV(c[0],c[1],v.r,v.r,20));
      let vs=shape(top,'#a67c66',.7)+shape(on(PZ(c[2]+.2),ellUV(c[0],c[1],v.r*.82,v.r*.82,20)),'#693f42',.5);
      for(let j=0;j<v.n;j++) {const a=2*Math.PI*j/v.n,b=2*Math.PI*(j+1)/v.n; const tip=[c[0]+(open?v.r*.75:0)*Math.cos((a+b)/2),c[1]+(open?v.r*.75:0)*Math.sin((a+b)/2),c[2]+(open?(v.av?-4:4):.5)];vs+=shape([[c[0]+v.r*Math.cos(a),c[1]+v.r*Math.sin(a),c[2]],[c[0]+v.r*Math.cos(b),c[1]+v.r*Math.sin(b),c[2]],tip],'#f2dbb2',.6);}
      inside.push({box:[[c[0]-v.r,c[1]-v.r,c[2]-4],[c[0]+v.r,c[1]+v.r,c[2]+4]],svg:vs}); label(c,v.name,open);
      if(v.av){const root=[c[0],c[1],c[2]-16];inside.push({box:[[c[0]-3,c[1]-3,c[2]-19],[c[0]+3,c[1]+3,c[2]]],svg:rod([root[0],root[1],root[2]-5],root,2,matOf('#c57170'))+[-1,1].map(s=>line([root,[c[0]+s*3,c[1],c[2]-(open?4:0)]],.5)).join('')});label(root,v.name==='MITRAL VALVE'?'LEFT PAPILLARY MUSCLE':'RIGHT PAPILLARY MUSCLE');label([c[0]+2,c[1],c[2]-8],v.name==='MITRAL VALVE'?'MITRAL CHORDAE':'TRICUSPID CHORDAE');}
    }
    anatomy+=byDepth(parts)+`<g opacity="${f(k)}">${byDepth(inside)}</g>`;
    for(const s of heartSignals){const active=st.mode!=='idle'&&p>=s.start&&p<s.start+.12; anatomy+=`<path d="${pd(s.p,false)}" fill="none" stroke="${active?'#ffc52f':'#b99550'}" stroke-width="${active?2.4:1}" stroke-dasharray="${active?'0':'1 1'}"/>`+heartDot(s.p[0],active?2.5:1.3,active?'#ffcf42':'#b99550'); label(s.p[0],s.name,active);}
    if(st.mode!=='idle'){
      const u=systole?(p-.4)/.35:p<.4?p/.4:(p-.75)/.25;
      const flows=systole?[[[46,61,46],[47,59,70],[48,52,93],[29,76,91],[23,93,80]],[[32,39,44],[33,43,70],[33,44,99]]]:[[[35,72,103],[37,66,76],[43,63,65],[46,61,46]],[[23,12,78],[27,39,77],[30,39,65],[32,39,44]]];
      flows.forEach((path,i)=>{anatomy+=heartArrow(path,Math.min(.98,u),i?'#d73d3b':'#356fb1');});
      if(st.held){const back=systole?[[[46,61,49],[43,63,65],[37,66,76]],[[32,39,47],[30,39,65],[27,39,77]]]:[[[48,52,93],[47,59,70],[46,61,49]],[[33,44,99],[33,43,70],[32,39,47]]];back.forEach(path=>anatomy+=heartArrow(path,Math.min(.98,u),'#c546b0'));}
    }

  props.push({box:[[71,23,3],[79,31,5.8]],svg:cyl(75,27,3,5.8,4,METAL)});

}
function heartStart(st,ui){
  if(heartLoop)return;heartLoop=true;
  ui.animate(dt=>{
    if(st.mode==='idle'){heartLoop=false;return false;}
    st.elapsed+=dt;st.phase+=dt*(st.mode==='once'?.25:st.bpm/60);
    if(st.tour>=0){st.tour+=dt;if(st.tour>=heartTour.length*2){st.tour=-1;st.mode='idle';}}
    if(st.phase>=1){st.phase%=1;if(st.mode==='once')st.mode='idle';}
    if(st.mode==='idle'){st.phase=0;heartLoop=false;return false;}return true;
  });
}
heartUI=mountFigure({fig:'H',title:'The heart',turn:'full',size:[90,112,124],palette:'blush',state:heartState,scene:heartScene,
  stats:st=>[{label:'Heart rate',value:st.bpm+' bpm'},{label:'Playback',value:st.mode==='once'?'4x slow':st.mode==='idle'?'Paused':'Real time',small:true},{label:'Valve flow',value:st.held?'Backflow':'One way',small:true}],
  readout:st=>st.tour>=0?heartTour[Math.min(6,Math.floor(st.tour/2))].name:'',
  buttons:[
    {label:'Beat once slowly',onClick:(st,ui)=>{st.mode='once';st.phase=0;st.tour=-1;heartStart(st,ui);}},
    {label:'Follow blood',onClick:(st,ui)=>{st.mode='run';st.phase=0;st.tour=0;if(!st.xrT)document.getElementById('xrb').click();heartStart(st,ui);}},
    {label:'Exercise / rest',onClick:(st,ui)=>{st.bpm=st.bpm===60?120:60;st.mode='run';st.tour=-1;heartStart(st,ui);}},
    {label:'Hold / release valves',onClick:(st,ui)=>{st.held=!st.held;st.mode='run';st.tour=-1;heartStart(st,ui);}}
  ],params:(st,q)=>{if(q.get('exercise')==='1')st.bpm=120;st.held=q.get('held')==='1';const p=Number(q.get('phase'));if(Number.isFinite(p))st.phase=Math.max(0,Math.min(.999,p));}
});
xrMount(()=>heartUI,()=> '');

<script>
// Keep the zoom raster inside the SVG viewport and preserve the shared controls and panning.
addEventListener('DOMContentLoaded',()=>{
  const fig=document.getElementById('fig'), base=fig.viewBox.baseVal;
  const frame={x:base.x,y:base.y,w:base.width,h:base.height};
  const zoom=()=>{
    const matrix=new DOMMatrix(fig.style.transform||undefined), s=matrix.a;
    const w=fig.clientWidth,h=fig.clientHeight,u=Math.min(w/frame.w,h/frame.h);
    const x=frame.x+(-matrix.e-(s-1)*(w-u*frame.w)/2)/(u*s);
    const y=frame.y+(-matrix.f-(s-1)*(h-u*frame.h)/2)/(u*s);
    fig.setAttribute('viewBox',`${x} ${y} ${frame.w/s} ${frame.h/s}`);
    heartUI.render();
  };
  new MutationObserver(zoom).observe(fig,{attributes:true,attributeFilter:['style']});
  addEventListener('resize',zoom);
});
</script></body></html>
