<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The double-slit experiment</title></head><body>
<script src="core.js"></script>
<script>
/* ---------- Truth first: the double-slit experiment on a school optical bench ----------
   1. A red diode laser (650 nm, under 1 mW) lies in two V-blocks on a cradle, on a post in a rider clamped to a 1.2 m
      optical rail. Its beam runs along the rail 27 cm above the bench top.
   2. Single photons: a stack of neutral-density filters (OD 12: one photon in 10^12 gets through) on a flip mount is
      flipped down into the beam. A 1 mW laser sends about 3 x 10^15 photons a second; after the filter a few, then a few
      hundred a second, get through. Each crosses the bench in about 2 ns, long before the next one leaves: one at a time.
   3. Each photon meets the double-slit slide (chrome on glass, two slits 0.004 mm wide, 0.016 mm apart, in a holder on
      a post) and lands at one point on the photographic strip clipped across the screen 0.40 m away, leaving one dark
      grain. Where it lands is random, but the odds follow the interference pattern: after thousands of photons the
      grains pile up into fringes lambda L / d = 650 nm x 0.40 m / 0.016 mm = 16 mm apart.
   4. Full beam: flip the filter up out of the beam and some 10^15 photons a second arrive: the bright and dark bands
      show on the screen at once.
   5. Cover a slit: a black tab slides along a rail under the slide and stands over slit B. Only slit A's spread is
      left (P1): one blob, no fringes.
   6. Detector at a slit: a which-path detector on a swing arm drops a ring sensor round slit A and clicks a counter for
      every photon that goes through A. Once the path is known the two waves no longer interfere: the strip records
      P1 + P2, two lumps (one behind each slit).
   7. See-through: plane wavefronts in the beam, circular wavefronts spreading from each open slit; along the lines where
      crest meets crest they add (bright fringes), where crest meets trough they cancel (dark fringes).
   The slits and the offset of each slit's spread are drawn much wider than the real 0.016 mm so you can see them.
   Parts (each is held by another):
   BENCH   lab bench top . optical rail on two end feet . four levelling screws through the feet . two end caps .
           bench scale on the rail's front face
   RIDERS  four riders clamped on the rail, each with its thumbscrew . post holder on each with its clamp screw . post
   LASER   cradle plate on the post . two V-blocks . laser housing . front cap with the aperture . back cap . key switch .
           power LED . warning label . inside: collimating lens in its brass barrel . laser diode (TO can) . aluminium
           heatsink . driver board with its chip, trimmer and capacitor . switch body . wires . power cable down to the
           power supply on the bench (transformer, regulator board, mains cord over the bench's back edge)
   FILTER  flip-mount base on its post . hinge pin . filter frame . ND filter stack (three glasses)
   SLITS   slit holder plate on its post . window behind the slide . double-slit slide . two spring clips . slit A and
           slit B . cover rail under the slide . cover tab and its grip
   PATH    detector bracket on the holder's corner . swing arm . preamp can . ring sensor . detector cable down the post,
           over the rider and along the bench to the click counter (case, display, board, chip, 9 V battery)
   SCREEN  screen frame on a bracket on its post . white card . photographic strip . two strip clips . mm scale
   OVERLAYS laser beam . fan of light to the screen . single photons in flight . wavefronts . add and cancel lines */

/* ---------- geometry (x = depth, y = along the bench, z = up; 1 unit = 1 cm) ---------- */
const BX1 = 34, BY1 = 87, BH = 3, TOPZ = 40;
const XC = 17, ZB = 27;                                        // the beam line
const SCR_Y = 9, SLIT_Y = 49, FIL_Y = 55.5, HZ = 23.9;         // screen face, slide face, filter, filter hinge height
const RID = { scr:7.6, slit:48.5, fil:55.5, las:70 };         // rider centres along the rail
const SA = XC - .65, SB = XC + .65;                            // slit A, slit B (drawn wide; the real gap is 0.016 mm)
const FRINGE = 1.625, LUMP_S = 2.6, LUMP_SIG = 1.5, ENV_SIG = 3; // fringe spacing on the strip (cm), each slit's lump, the envelope
const U_STRIP = 8, U_SCR = 11, STRIP = [XC - 8, XC + 8, 25.5, 28.5];
const CAP = 2400, FT = .8, IMAX = 2;
const AP = [XC, 59.8, ZB];                                     // the laser's aperture
const IRON = matOf('#6f7378'), ALU = matOf('#d4d8da'), BRASS = matOf('#d8b25a'), PCBM = { l:'#4fa36a', m:'#2f8a4a', d:'#1d5f31' };
const CHROME = matOf('#b7c0c5'), FILM = '#efe6cf', RED = '#ff3b2f', CARD = '#fbf8ee';
const COLA = '#3d6fd6', COLB = '#e8823a';

/* ---------- the light: where the photons land ---------- */
// drawn the way Feynman draws it: each slit alone gives a lump behind it (P1, P2; with a path detector the strip records
// P1 + P2). With both open and no detector the two waves add with a phase difference that grows across the screen, so
// the light comes in bands under one envelope: I12 = 2 E(u) (1 + cos(2 pi u / fringe)), bright where the waves add,
// dark where they cancel
const dsG = (u, s) => Math.exp(-u*u/(2*s*s));
const dsP1 = u => dsG(u + LUMP_S, LUMP_SIG), dsP2 = u => dsG(u - LUMP_S, LUMP_SIG);
const dsI12 = u => dsG(u, ENV_SIG)*(1 + Math.cos(2*Math.PI*u/FRINGE));
const dsPat = (st, u) => { const c = st.cover, d = st.det; return (1 - c)*((1 - d)*dsI12(u) + d*(dsP1(u) + dsP2(u))) + c*dsP1(u); };
let dsRand = Math.random;
function dsSample(st){
  let fn = dsI12, slit = 0;
  if (st.coverT) { fn = dsP1; slit = 1; }
  else if (st.detT){ slit = dsRand() < .5 ? 1 : 2; fn = slit === 1 ? dsP1 : dsP2; }
  let u; do { u = (dsRand()*2 - 1)*U_SCR; } while (dsRand()*IMAX > fn(u));
  let z = 0; for (let i = 0; i < 6; i++) z += dsRand(); z = ZB + (z - 3)*.62;
  return { u, z: Math.max(STRIP[2] + .15, Math.min(STRIP[3] - .15, z)), slit };
}

/* ---------- small helpers ---------- */
const dsB = (x0, y0, z0, x1, y1, z1) => [[x0, y0, z0], [x1, y1, z1]];
const dsCorners = b => { const o = []; for (const x of [b[0][0], b[1][0]]) for (const y of [b[0][1], b[1][1]]) for (const z of [b[0][2], b[1][2]]) o.push([x, y, z]); return o; };
const dsBoxOf = (pts, e = .05) => [[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - e), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + e)];
const dsLerp = (a, b, t) => a.map((v, i) => v + (b[i] - v)*t);
const dsBx = (x0, y0, z0, x1, y1, z1, M, w = .8) => box(x0, y0, z0, x1, y1, z1, M, toneI, w);
const sw = w => `style="stroke-width:${w.toFixed(2)}"`;       // a stroke in drawing units (not rescaled)
const dsStroke = (pts, col, w) => { const d = pd(pts, false);
  return `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${f(w + .9)}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${col}" stroke-width="${f(w)}" stroke-linecap="round" stroke-linejoin="round"/>`; };
// a cable cut into short pieces (each with its own box) so it sorts with the solids it passes
function dsWire(pts, col, w = .6, seg = 2.5){
  const q = [pts[0]];
  for (let i = 1; i < pts.length; i++){ const a = pts[i-1], b = pts[i], n = Math.max(1, Math.ceil(Math.hypot(...sub(b, a)) / seg));
    for (let j = 1; j <= n; j++) q.push(dsLerp(a, b, j/n)); }
  const out = [];
  for (let i = 0; i < q.length - 1; i++) out.push({ box: dsBoxOf([q[i], q[i+1]]), svg: dsStroke([q[i], q[i+1]], col, w) });
  return out; }
// a box turned any way: centre c, three half-extent vectors
function dsOBox(c, ax, M, w = .8){
  let s = '';
  for (let i = 0; i < 3; i++) for (const sg of [1, -1]){
    const A = ax[i], B = ax[(i+1)%3], D = ax[(i+2)%3], n = norm(A.map(v => v*sg));
    if (!vis(n)) continue;
    s += shape([[1,1],[1,-1],[-1,-1],[-1,1]].map(([b, d]) => c.map((v, k) => v + sg*A[k] + b*B[k] + d*D[k])), toneI(n, M), w);
  }
  return s; }
const dsOCorners = (c, ax) => { const o = []; for (const a of [-1, 1]) for (const b of [-1, 1]) for (const d of [-1, 1]) o.push(c.map((v, k) => v + a*ax[0][k] + b*ax[1][k] + d*ax[2][k])); return o; };
// byDepth's pairwise rule is not transitive: with ~90 parts a far one can land over a near one. Here every separated
// pair that overlaps on screen is an edge, and the parts go out farthest-first.
function dsSort(items){
  items = items.filter(Boolean); const n = items.length, out = Array.from({length:n}, () => []), deg = new Array(n).fill(0);
  const dep = items.map(p => depthOf(p.at || boxMid(p.box))), done = new Array(n).fill(false);
  const R = items.map(p => { if (!p.box) return null; const xs = [], ys = [];
    for (const x of [0, 1]) for (const y of [0, 1]) for (const z of [0, 1]){ const q = P(p.box[x][0], p.box[y][1], p.box[z][2]); xs.push(q[0]); ys.push(q[1]); }
    return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)]; });
  const hit = (a, b) => a && b && a[0] < b[2] && b[0] < a[2] && a[1] < b[3] && b[1] < a[3];
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++){ const o = hit(R[i], R[j]) ? sepOrder(items[i], items[j]) : 0;
    if (o < 0){ out[i].push(j); deg[j]++; } else if (o > 0){ out[j].push(i); deg[i]++; } }
  let svg = '';
  for (let c = 0; c < n; c++){ let best = -1;
    for (let i = 0; i < n; i++) if (!done[i] && (best < 0 || (deg[i] === 0) > (deg[best] === 0) || ((deg[i] === 0) === (deg[best] === 0) && dep[i] < dep[best]))) best = i;
    done[best] = true; svg += items[best].svg; for (const j of out[best]) deg[j]--; }
  return svg; }

/* ---------- moving parts ---------- */
// flip mount: the filter frame turns about a hinge pin along x; phi 0 = down in the beam, 90 deg = up, lying toward the laser
function dsFilterGeo(st){
  const ph = ease(st.flip)*Math.PI/2, up = [0, Math.sin(ph), Math.cos(ph)], nrm = [0, Math.cos(ph), -Math.sin(ph)];
  const c = [XC, FIL_Y + 3.1*up[1], HZ + 3.1*up[2]];
  return { c, up, nrm, ax: [[2.2, 0, 0], up.map(v => v*3.0), nrm.map(v => v*.3)] }; }
// which-path detector: swing arm about a pin along y on the holder's top-left corner
const PIV = [12.9, 50.25, 32.6], ARM_L = Math.hypot(SA - 12.9, 32.6 - ZB), TH1 = Math.atan2(SA - 12.9, ZB - 32.6), TH0 = -15*Math.PI/180;
function dsDetGeo(st){ const th = TH0 + (TH1 - TH0)*ease(st.det), d = [Math.sin(th), 0, Math.cos(th)];
  const ring = [PIV[0] + ARM_L*d[0], 50.2, PIV[2] + ARM_L*d[2]];
  return { d, ring, rim: [ring[0] - .85*d[0], 50.25, ring[2] - .85*d[2]] }; }
const dsTabX = st => 20.6 + (SB - 20.6)*ease(st.cover);

/* ---------- parts of the scene ---------- */
function dsRider(put, yc, M, hH, top){
  put(dsB(12.8, yc - 2.5, 10, 21.2, yc + 2.5, 12.6), dsBx(12.8, yc - 2.5, 10, 21.2, yc + 2.5, 12.6, M, .9));
  put(dsB(12.8, yc - 2.5, 7.5, 14, yc + 2.5, 10), dsBx(12.8, yc - 2.5, 7.5, 14, yc + 2.5, 10, M, .8));
  put(dsB(20, yc - 2.5, 7.5, 21.2, yc + 2.5, 10), dsBx(20, yc - 2.5, 7.5, 21.2, yc + 2.5, 10, M, .8));
  put(dsB(21.2, yc - .9, 8.3, 23.4, yc + .9, 10.1), rod([21.2, yc, 9.2], [22.4, yc, 9.2], .3, METAL, toneI, .6) + cylX(22.4, 23.4, yc, 9.2, .9, DARK, toneI, .8, 16));
  put(dsB(XC - 1.25, yc - 1.25, 12.6, XC + 1.25, yc + 1.25, hH), cyl(XC, yc, 12.6, hH, 1.25, METAL, toneI, .9, 20));
  put(dsB(XC + 1.25, yc - .6, hH - 1.6, XC + 2.6, yc + .6, hH - .4), rod([XC + 1.25, yc, hH - 1], [XC + 2, yc, hH - 1], .22, METAL, toneI, .5) + cylX(XC + 2, XC + 2.6, yc, hH - 1, .6, DARK, toneI, .7, 12));
  put(dsB(XC - .65, yc - .65, hH, XC + .65, yc + .65, top), cyl(XC, yc, hH, top, .65, METAL, toneI, .9, 14));
}
function dsRail(){
  let s = dsBx(14, 3, 6, 20, 84, 10, METAL, 1.1);
  if (facing([0,0,1])) s += line([[16, 3, 10.02], [16, 84, 10.02]], .6) + line([[18, 3, 10.02], [18, 84, 10.02]], .6);
  if (facing([1,0,0])){
    s += shape(on(PX(20.02), rectUV(4, 6.3, 83, 9.8)), '#f6e7a8', .7);
    let tk = '';
    for (let n = 0; n <= 79; n++){ const y = 4 + n; tk += pd([[20.04, y, 9.8], [20.04, y, n % 10 ? 9.2 : n % 5 ? 8.8 : 8.4]], false); }
    s += `<path d="${tk}" fill="none" stroke="${INK}" stroke-width=".45"/>`;
    for (let n = 0; n <= 75; n += 10) s += tx(20.06, 4 + n, 6.9, String(n), 1.25, INK, 800);
  }
  return s; }

function dsScreen(st){
  const fr = facing([0,1,0]); let s = dsBx(5, 8.3, 19, 29, 9, 35, DARK, 1.1);
  if (!fr) return s + hullInk(dsCorners(dsB(5, 8.3, 19, 29, 9, 35)), 2.2);
  s += shape(on(PY(9.02), rectUV(6, 20, 28, 34)), CARD, .8);
  // glow of the full beam on the card: one thin upright band per step across
  if (st.beamK > .01){ let g = '';
    for (let u = -U_SCR; u < U_SCR - 1e-6; u += .2){ const a = Math.pow(Math.max(0, dsPat(st, u + .1))/IMAX, .55)*st.beamK;
      if (a < .02) continue;
      g += `<path d="${pd(on(PY(9.06), rectUV(XC + u, ZB - 1.7, XC + u + .21, ZB + 1.7)))}" fill="${RED}" opacity="${f(.28*a)}"/>`
        + `<path d="${pd(on(PY(9.07), rectUV(XC + u, ZB - .85, XC + u + .21, ZB + .85)))}" fill="${RED}" opacity="${f(.85*a)}"/>`; }
    s += g; }
  // the photographic strip, its grains, its clips, the mm scale under it
  s += shape(on(PY(9.04), rectUV(STRIP[0], STRIP[2], STRIP[1], STRIP[3])), FILM, .8);
  if (st.hits.length){ let d = ''; const a = .2*CAM_K;
    for (const [u, z] of st.hits){ const [X, Y] = P(XC + u, 9.05, z); d += `M${f(X - a/2)} ${f(Y - a/2)}h${f(a)}v${f(a)}h${f(-a)}z`; }
    s += `<path d="${d}" fill="#2a211a"/>`; }
  if (st.beamK > .01){ let g = '';
    for (let u = -U_STRIP; u < U_STRIP - 1e-6; u += .2){ const a = Math.pow(Math.max(0, dsPat(st, u + .1))/IMAX, .55)*st.beamK;
      if (a > .02) g += `<path d="${pd(on(PY(9.08), rectUV(XC + u, ZB - .85, XC + u + .21, ZB + .85)))}" fill="${RED}" opacity="${f(.7*a)}"/>`; }
    s += g; }
  s += shape(on(PY(9.03), rectUV(STRIP[0], 23.4, STRIP[1], 24.7)), '#f6e7a8', .6);
  let tk = ''; for (let i = 0; i <= 32; i++){ const x = STRIP[0] + i*.5; tk += pd([[x, 9.05, 24.7], [x, 9.05, i % 4 ? 24.3 : 23.95]], false); }
  s += `<path d="${tk}" fill="none" stroke="${INK}" stroke-width=".4"/>`;
  for (const u of [-8, -4, 0, 4, 8]) s += txY(XC + u, 9.06, 23.55, String(u), .55, INK, 800);
  for (const x of [STRIP[0] - .5, STRIP[1] + .5]) s += dsBx(x - .5, 9.02, 25.2, x + .5, 9.45, 28.8, METAL, .7);
  return s + hullInk(dsCorners(dsB(5, 8.3, 19, 29, 9.45, 35)), 2.2); }

function dsLaserIns(st){
  const on_ = st.src !== 'off', parts = [], put = (b, svg) => parts.push({ box: b, svg });
  put(dsB(XC - 2.1, 63.2, ZB - 2.1, XC + 2.1, 66.5, ZB + 2.1), rod([XC, 63.2, ZB], [XC, 66.5, ZB], 2.1, ALU, toneI, .8, 2.1, 22));
  put(dsB(XC - .55, 62.3, ZB - .55, XC + .55, 63.2, ZB + .55), rod([XC, 62.3, ZB], [XC, 63.2, ZB], .55, METAL, toneI, .6, .55, 14));
  put(dsB(XC - 1, 61.5, ZB - 1, XC + 1, 62.3, ZB + 1), rod([XC, 61.5, ZB], [XC, 62.3, ZB], 1, BRASS, toneI, .7, 1, 16));
  put(dsB(15.7, 67, 25.2, 18.3, 75.5, 25.45), dsBx(15.7, 67, 25.2, 18.3, 75.5, 25.45, PCBM, .7));
  put(dsB(16.4, 68.5, 25.45, 17.6, 70, 25.85), dsBx(16.4, 68.5, 25.45, 17.6, 70, 25.85, DARK, .6));
  put(dsB(17.5, 71.6, 25.45, 18.3, 72.4, 26), cyl(17.9, 72, 25.45, 26, .4, matOf('#3f7fc0'), toneI, .5, 10));
  put(dsB(15.75, 73.05, 25.45, 16.65, 73.95, 26.8), cyl(16.2, 73.5, 25.45, 26.8, .45, matOf('#2f4fa0'), toneI, .5, 12));
  put(dsB(16.5, 74, 28, 17.5, 75, 29.4), dsBx(16.5, 74, 28, 17.5, 75, 29.4, DARK, .6));
  const hot = on_ ? '#e2483d' : '#9a3a2c';
  parts.push(...dsWire([[16.7, 78, 26.2], [16.7, 76.5, 25.6], [16.7, 75.5, 25.5]], hot, .3, 1.5));
  parts.push(...dsWire([[17.3, 78, 26.2], [17.3, 76.5, 25.6], [17.3, 75.5, 25.5]], '#2e2b28', .3, 1.5));
  parts.push(...dsWire([[16.8, 67, 25.5], [16.8, 66.6, 26.6]], hot, .25, 1));
  parts.push(...dsWire([[17.2, 67, 25.5], [17.2, 66.6, 26.6]], '#2e2b28', .25, 1));
  parts.push(...dsWire([[17, 74.5, 28], [17.8, 74.9, 25.5]], '#d8a24a', .22, 1));
  return dsSort(parts); }

function dsCounterIns(){
  return dsBx(25.5, 35.5, 3.3, 32.5, 42.5, 3.5, PCBM, .6) + dsBx(26, 36, 3.5, 28.6, 41, 5.4, matOf('#3f4a8a'), .6)
    + dsBx(29.5, 37.5, 3.5, 30.9, 39.5, 3.9, DARK, .5) + dsBx(32.2, 36.5, 4.6, 32.8, 41.5, 7.6, matOf('#3c4a44'), .5)
    + dsStroke([[25.2, 42, 4.2], [27, 41.6, 3.6], [29.5, 39.5, 3.6]], '#2e2b28', .3) + dsStroke([[30.9, 38.5, 3.7], [32.2, 38.5, 5]], '#d8a24a', .25); }
function dsPsuIns(){
  return dsBx(2.6, 77, 3.2, 5.4, 80.2, 5.8, IRON, .6) + cyl(4, 78.6, 3.5, 5.6, 1.1, matOf('#c8763a'), toneI, .5, 14)
    + dsBx(5.8, 76.6, 3.2, 7.6, 82.4, 3.4, PCBM, .6) + dsBx(6.2, 80.4, 3.4, 7.2, 81.6, 4.6, DARK, .5)
    + dsStroke([[5.4, 78.6, 4.6], [6.4, 79.6, 3.5]], '#d8a24a', .25); }

/* ---------- the overlays: beam, fan of light, photons, waves ---------- */
function dsFan(st){
  if (st.beamK < .01) return '';
  const ax = XC - .65*st.cover, y0 = 48, y1 = 9.6; let s = '';
  for (let u = -U_SCR; u < U_SCR - 1e-6; u += .25){ const a = Math.pow(Math.max(0, dsPat(st, u + .125))/IMAX, .7)*st.beamK;
    if (a > .03) s += `<path d="${pd([[ax, y0, ZB], [XC + u, y1, ZB], [XC + u + .26, y1, ZB]])}" fill="${RED}" opacity="${f(.32*a)}"/>`; }
  return s; }
function dsWaves(st){
  const LW = 1.6, ph = st.ph % 1, inside = (x, y) => x >= 5 && x <= 29 && y >= 9.6 && y <= 48;
  let s = '';
  const srcs = [[SA, COLA, 1], [SB, COLB, 1 - st.cover]];
  for (const [xs, col, wgt] of srcs){ if (wgt < .02) continue;
    let d = [];
    for (let n = 0; ; n++){ const r = (n + ph)*LW; if (r > 47) break; if (r < .4) continue;
      const a = wgt*.9*Math.pow(Math.max(0, 1 - r/51), .8); let run = [], segs = '';
      for (let i = 0; i <= 60; i++){ const t = Math.PI*i/60, x = xs + r*Math.cos(t), y = 48 - r*Math.sin(t);
        if (inside(x, y)) run.push([x, y, ZB]); else { if (run.length > 1) segs += pd(run, false); run = []; } }
      if (run.length > 1) segs += pd(run, false);
      if (segs) s += `<path d="${segs}" fill="none" stroke="${col}" ${sw(.24)} opacity="${f(a)}"/>`; }
  }
  // the lines where the two sets of waves add (bright fringes) and cancel (dark fringes)
  const both = (1 - st.cover)*(1 - st.det);
  if (both > .02){ let add = '', can = '';
    for (let j = -4; j <= 4; j++){ const u = j*FRINGE; add += pd([[XC, 48, ZB], [XC + u, 9.6, ZB]], false); }
    for (let j = -4; j < 4; j++){ const u = (j + .5)*FRINGE; can += pd([[XC, 48, ZB], [XC + u, 9.6, ZB]], false); }
    s += `<g opacity="${f(both)}"><path d="${add}" fill="none" stroke="${RED}" ${sw(.2)}/><path d="${can}" fill="none" stroke="${INK}" ${sw(.12)} stroke-dasharray=".6 .5"/></g>`; }
  return s; }
function dsPlaneWaves(st){
  const LW = 1.6; let d = '';

    { at: [19.4, 65.25, 23.4], text:'V-BLOCK', on: false },
    { at: [4, 78.6, 5.6], text:'TRANSFORMER', on: lit },
    { at: [5, 76, 6.6], text:'POWER SUPPLY', on: lit },
    { at: [12.2, 81.5, 15], text:'POWER CABLE', on: lit },
    { at: fg.c, text:'ND FILTER OD 12', on: ph },
    { at: [18.8, FIL_Y, HZ], text:'FLIP MOUNT', on: st.flip > .02 && st.flip < .98 },
    { at: [XC, 49.06, 29.5], text:'DOUBLE-SLIT SLIDE', on: lit },
    { at: [SA, 49.08, 25.6], text:'SLIT A', on: lit },
    { at: [SB, 49.08, 25.6], text:'SLIT B', on: lit && st.cover < .5 },
    { at: [tc, 49.6, 30.2], text:'SLIT COVER', on: st.cover > .5 },
    { at: [21.5, 49.9, 23.6], text:'COVER RAIL', on: false },
    { at: [g.ring[0] - .85*Math.SQRT1_2, 50.45, g.ring[2] - .85*Math.SQRT1_2], text:'WHICH-PATH DETECTOR', on: st.det > .5 },
    { at: [22.4, 49.6, 5], text:'DETECTOR CABLE', on: st.det > .5 && ph },
    { at: [29, 35, 8.5], text:'CLICK COUNTER', on: st.det > .5 && ph },
    { at: [27.3, 36, 5.4], text:'9V BATTERY', on: false },
    { at: [5, 9, 35], text:'SCREEN 40 CM AWAY', on: false },
    { at: [XC + 5.5, 9.05, STRIP[3]], text:'PHOTOGRAPHIC STRIP', on: ph },
    { at: [STRIP[1] + .5, 9.45, 28.8], text:'STRIP CLIP', on: false },
    { at: [XC - 6, 9.04, 24.3], text:'MM SCALE', on: false },
    { at: [20, 50, 10], text:'OPTICAL RAIL', on: false },
    { at: [21.2, RID.fil - 2.5, 11.5], text:'RIDER', on: false },
    { at: [23.4, RID.slit, 9.2], text:'THUMBSCREW', on: false },
    { at: [XC, RID.las - .65, 19.5], text:'POST', on: false },
    { at: [23.5, 78, 7.4], text:'LEVELLING SCREW', on: false },
    { at: [SA - 4, 48 - 6, ZB], text:'WAVEFRONTS', on: lit },
    ...(both ? [{ at: ray(0, 40), text:'WAVES ADD', on: lit }, { at: ray(FRINGE*.5, 30), text:'WAVES CANCEL', on: lit }] : []),
  ], LB);
  if (k > 0) return '';
  return dsCallouts([
    { at: [XC, 69, ZB + 2.6], text:'LASER', on: lit },
    { at: fg.c, text:'ND FILTER', on: ph },
    { at: [XC, 49.06, 29.5], text:'DOUBLE SLIT', on: lit },
    { at: [tc, 49.6, 30.2], text:'SLIT COVER', on: st.cover > .5 },
    { at: [g.ring[0], 50.45, g.ring[2] + .85], text:'WHICH-PATH DETECTOR', on: st.det > .5 },
    { at: [29, 35, 8.5], text:'CLICK COUNTER', on: st.det > .5 && ph },
    { at: [XC + 5.5, 9.05, STRIP[3]], text:'PHOTOGRAPHIC STRIP', on: ph },
    { at: [5, 9, 35], text:'SCREEN', on: false },
    { at: [20, 50, 10], text:'OPTICAL RAIL', on: false },
    { at: [5, 76, 6.6], text:'POWER SUPPLY', on: lit },
    ...(bm ? [{ at: [XC, 54, ZB], text:'LASER BEAM', on: true }] : []),
  ], LB);
}

/* ---------- behaviour (one state object, one clock) ---------- */
let ui, dsLoopOn = false;
const dsApproach = (v, t, step) => v < t ? Math.min(t, v + step) : Math.max(t, v - step);
function dsFresh(st){ st.hits = []; st.count = 0; st.clicks = 0; st.flights = []; st.acc = 0; st.tRun = 0; st.demo = false; }
function dsStep(st, dt){
  st.flip = dsApproach(st.flip, st.flipT, dt/.5);
  st.cover = dsApproach(st.cover, st.coverT, dt/.6);
  st.det = dsApproach(st.det, st.detT, dt/.7);
  st.beamK = dsApproach(st.beamK, st.src === 'beam' && st.flip > .98 ? 1 : 0, dt/.25);
  st.flash = Math.max(0, st.flash - dt);
  if (st.src !== 'off') st.ph = (st.ph + dt*1.2) % 1000;
  if (st.src === 'photons' && st.flip < .02 && st.cover === st.coverT && st.det === st.detT){
    st.tRun += dt; st.rate = Math.min(300, 2*Math.exp(Math.max(0, st.tRun - 2.5)/1.4));
    st.acc += st.rate*dt;
    while (st.acc >= 1 && st.count + st.flights.length < CAP){ st.acc -= 1; const p = dsSample(st);
      st.flights.push({ t: 0, u: p.u, z: p.z, slit: p.slit, sx: p.slit === 1 ? SA : p.slit === 2 ? SB : XC }); }
    if (st.count + st.flights.length >= CAP){ st.src = 'off'; st.rate = 0; ui.flash(`The strip is full: ${CAP} photons`, 2400); }
  } else st.rate = 0;
  for (const fl of st.flights){ const was = fl.t; fl.t += dt; if (fl.slit === 1 && st.detT && was < FT*.14 && fl.t >= FT*.14){ st.clicks++; st.flash = .12; } }
  while (st.flights.length && st.flights[0].t >= FT){ const fl = st.flights.shift(); st.count++; if (Math.abs(fl.u) <= U_STRIP) st.hits.push([fl.u, fl.z]); }
  const busy = st.src !== 'off' || st.flights.length || st.flip !== st.flipT || st.cover !== st.coverT || st.det !== st.detT || st.beamK > 0 || st.flash > 0;
  return !!busy; }
function dsRun(){ if (dsLoopOn) return; dsLoopOn = true; ui.animate(dt => { const go = dsStep(ui.st, dt); if (!go) dsLoopOn = false; return go; }); }
function dsFire(st){
  if (st.src === 'photons'){ st.src = 'off'; return dsRun(); }
  if (st.demo || st.count >= CAP) dsFresh(st);
  st.src = 'photons'; st.flipT = 0; st.tRun = 0; st.acc = 0; dsRun(); }
function dsBeam(st){
  if (st.src === 'beam'){ st.src = 'off'; return dsRun(); }
  st.src = 'beam'; st.flipT = 1; dsRun(); }
function dsCover(st){ st.coverT = st.coverT ? 0 : 1; if (st.hits.length || st.demo){ dsFresh(st); if (st.src === 'photons') ui.flash('A fresh strip for the new set-up'); } dsRun(); }
function dsDetector(st){ st.detT = st.detT ? 0 : 1; if (st.hits.length || st.demo){ dsFresh(st); if (st.src === 'photons') ui.flash('A fresh strip for the new set-up'); } dsRun(); }
// a strip exposed before (for the first look, and for screenshots): seeded, so it is the same every time
function dsPrefill(st, n){ let a = 7; dsRand = () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  st.hits = []; st.count = 0; st.clicks = 0;
  while (st.hits.length < n){ const p = dsSample(st); st.count++; if (p.slit === 1 && st.detT) st.clicks++; if (Math.abs(p.u) <= U_STRIP) st.hits.push([p.u, p.z]); }
  dsRand = Math.random; }

ui = mountFigure({
  fig:'P2', title:'The double-slit experiment',
  size:[BX1, BY1, TOPZ], palette:'cobalt', turn:'full',
  state:{ src:'off', flip:0, flipT:0, cover:0, coverT:0, det:0, detT:0, beamK:0, hits:[], count:0, clicks:0, flights:[], acc:0, tRun:0, rate:0, ph:0, flash:0, demo:true },
  scene,
  stats: st => [
    { label:'Photons', value: st.count.toLocaleString('en-US') },
    { label:'Rate', value: st.src === 'beam' ? '3x10^15 /s' : st.src === 'photons' ? Math.round(st.rate) + ' /s' : 'off', small:true },
    { label:'Fringe spacing', value: st.coverT || st.detT ? 'none' : '16 mm', small:true },
    { label:'Wavelength', value:'650 nm', small:true } ],
  buttons:[
    { label:'Fire photons', onClick: st => dsFire(st) },
    { label:'Full beam', onClick: st => dsBeam(st) },
    { label:'Cover one slit', onClick: st => dsCover(st) },
    { label:'Detector at slit', onClick: st => dsDetector(st) },
  ],
  acts:{ key:(st) => dsFire(st), filter:(st) => dsBeam(st), cover:(st) => dsCover(st), det:(st) => dsDetector(st) },
  params:(st, q) => {
    if (q.get('cover') === '1') st.cover = st.coverT = 1;
    if (q.get('det') === '1') st.det = st.detT = 1;
    if (q.get('src') === 'beam'){ st.src = 'beam'; st.flip = st.flipT = 1; st.beamK = 1; }
    if (q.get('src') === 'photons') st.src = 'photons';
    if (q.has('ph')) st.ph = +q.get('ph');
    dsPrefill(st, q.has('hits') ? Math.max(0, Math.min(CAP, +q.get('hits') | 0)) : 1100);
    if (q.has('hits') || q.has('cover') || q.has('det')) st.demo = false;
    if (q.has('fly')){ const n = +q.get('fly') | 0; for (let i = 0; i < n; i++){ const p = dsSample(st); st.flights.push({ t: FT*(.1 + .8*i/Math.max(1, n)), u: p.u, z: p.z, slit: p.slit, sx: p.slit === 1 ? SA : p.slit === 2 ? SB : XC }); } }
  },
});
if (ui.st.src === 'photons') dsRun();
addEventListener('keydown', e => { if (e.key !== ' ' || /input|textarea|button/i.test(e.target.tagName)) return; e.preventDefault(); dsFire(ui.st); ui.render(); });
xrMount(() => ui, () => '');
</script></body></html>
