<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arduino Uno</title></head><body>
<script src="core.js"></script>
<script>
/* Arduino Uno R3 on a desk, a mini breadboard with a red LED beside it. 1 unit = 1 mm.
   x = depth (front at high x), y = width (+y viewer-left at the default view), z = up.
   The board lies with its USB end toward -y and its digital header toward the front (+x). Board-local (u, v) is the
   usual top view of an Uno: u along the long edge from the USB end (0..68.6), v across from the power/analog edge
   (0..53.3). World x = BX0 + v, y = BY0 + u, which keeps the board unmirrored in this engine's projection.

   How it really works (where power, data and the pin-13 signal are after each step):
   1. Plug in USB: the computer's 5 V reaches the USB-B jack's VBUS contact -> 500 mA polyfuse -> FDN340P P-MOSFET
      (on while no barrel-jack supply is present; the LMV358 comparator decides) -> the 5 V net -> VCC of the
      ATmega328P and ATmega16U2, the 5V header pin, the LP2985 3.3 V regulator. The green ON LED lights. The 16U2 (the
      USB chip, clocked by the 16 MHz HC-49 crystal) enumerates as a serial port. The 328P (clocked by its 16 MHz ceramic
      resonator) runs whatever sketch is in its flash: out of this box, an empty one (444 bytes).
   2. Upload Blink: the IDE opens the port and drops DTR. The 16U2 pulls its DTR pin low, and the 100 nF auto-reset
      capacitor passes that edge to the 328P's RESET pin (held high by a 10 k pull-up): the chip resets into the
      Optiboot bootloader, which flashes the L LED three times. The sketch (924 bytes) arrives over USB D+/D- (through
      two 22 ohm resistors) into the 16U2, which forwards it as serial data through 1 k resistors to the 328P's RXD
      (pin 2); replies go back from TXD (pin 3). The RX and TX LEDs flicker. The bootloader writes it into flash page by
      page, then jumps to the new sketch.
   3. Blink runs: PB5 (DIP pin 19 = digital pin 13) goes HIGH for one second, LOW for one second. The pin-13 trace runs
      to the D13 header socket and to the LMV358 buffer that drives the yellow L LED.
   4. Wire an LED to pin 13: two jumpers already sit in the breadboard; their free ends go into D13 and the GND socket
      beside it. D13 -> jumper -> column 9 -> 220 ohm resistor -> column 5 -> LED anode; LED cathode -> column 4 ->
      jumper -> GND. (5 V - 2 V) / 220 ohm = 14 mA: the red LED blinks with L.
   5. Press reset: the button grounds RESET; the chip stops (pin 13 LOW). On release Optiboot flashes L, waits for an
      upload, then restarts the sketch from the top.
   The barrel jack and the 5 V regulator are drawn but unpowered: this board runs from USB.

   Parts (each held by another):
   DESK       wooden desk top
   BOARD      PCB (FR4, solder mask, silkscreen) . 4 mounting holes . copper traces (top) . bottom-layer traces + vias
   USB        USB-B jack: shell, tongue, 4 contacts . USB-B plug: overmold, metal shell, strain relief . cable over the
              desk edge
   POWER      barrel jack: housing, centre pin, sleeve contact, 3 terminals . M7 reverse-polarity diode . two 47 uF
              electrolytic caps (can, base, foil winding) . NCP1117 5 V regulator (SOT-223 body, tab, leads, die) .
              LP2985 3.3 V regulator . MF-MSMF050 polyfuse . FDN340P MOSFET . LMV358 op-amp
   USB CHIP   ATmega16U2 (QFN, die, bond wires) . 16 MHz HC-49 crystal (can, quartz blank, clips) . 2 load caps .
              2 x 22 ohm USB resistors . 100 nF auto-reset cap . 16U2 ICSP header . 2 x 1 k serial resistors
   MCU        ATmega328P-PU (DIP-28 body, 28 legs, lead frame, die paddle, die with flash / SRAM / CPU, bond wires) .
              DIP socket (2 rails, 2 end bars) . 16 MHz ceramic resonator . 10 k reset pull-up . 100 nF decoupling cap .
              ICSP header (2 x 3)
   CONTROLS   reset tact switch (base, plate, plunger, snap dome, legs) . L, TX, RX, ON LEDs + their resistors
   HEADERS    digital 10 + 8, power 8, analog 6 (black bodies, gold contacts)
   CIRCUIT    mini breadboard (body, 170 holes, centre channel, 34 spring-clip strips) . 220 ohm resistor (body, 4 bands,
              legs) . red 5 mm LED (epoxy, flange, anvil, post, die, bond wire, legs) . 2 Dupont jumpers (housings, wire) */

/* ---------- layout ---------- */
const BH = 6, DW = 116, DD = 138, DRAD = 6;                 // desk top
const BX0 = 108, BY0 = 80;                                   // board v = 0 edge at x = BX0, u = 0 edge at y = BY0
const PB = BH + 2, PT = BH + 3.6, ZH = PT + 8.5;              // PCB bottom (on its solder joints), top; header top
const UW = (u, v, z) => [BX0 - v, BY0 - u, z];
const uon = (z, uv) => uv.map(([u, v]) => UW(u, v, z));
const ubx = (u0, v0, z0, u1, v1, z1) => [[BX0 - Math.max(v0, v1), BY0 - Math.max(u0, u1), z0], [BX0 - Math.min(v0, v1), BY0 - Math.min(u0, u1), z1]];
const uBox = (u0, v0, z0, u1, v1, z1, m, w = .5, sh = toneI) => { const [a, b] = ubx(u0, v0, z0, u1, v1, z1); return box(...a, ...b, m, sh, w); };
const uIt = (u0, v0, z0, u1, v1, z1, svg) => ({ box: ubx(u0, v0, z0, u1, v1, z1), svg });
const uCyl = (u, v, z0, z1, r, m, w = .6, n = 20) => cyl(BX0 - v, BY0 - u, z0, z1, r, m, toneI, w, n);
const mw = w => `style="stroke-width:${(+w).toFixed(2)}"`;   // a stroke in model units (not rescaled by inkScale)
const ghost = (body, inner, k) => k > 0 ? `<g opacity="${f(1 - .8*k)}">${body}</g><g opacity="${f(k)}">${inner()}</g>` : body;
const ucirc = (u, v, z, r, n = 14) => uon(z, ellUV(u, v, r, r, n));
const urect = (u0, v0, u1, v1, z) => uon(z, rectUV(u0, v0, u1, v1));
// text lying on the board top: reading along +u (txU) or along +v (txV)
const txU = (u, v, z, str, size, col = '#f4f6f2', wt = 700, anc = 'middle') => `<text transform="${txM(P(...UW(u, v, z)), Dv(0,-1,0), Dv(1,0,0))}" font-size="${size}" fill="${col}" text-anchor="${anc}" font-family="ui-monospace,Menlo,monospace" font-weight="${wt}" letter-spacing=".04em">${str}</text>`;
const txV = (u, v, z, str, size, col = '#f4f6f2', wt = 700, anc = 'middle') => `<text transform="${txM(P(...UW(u, v, z)), Dv(-1,0,0), Dv(0,-1,0))}" font-size="${size}" fill="${col}" text-anchor="${anc}" font-family="ui-monospace,Menlo,monospace" font-weight="${wt}" letter-spacing=".04em">${str}</text>`;
// text on the breadboard (world): reading along -y, up = -x
const txW = (x, y, z, str, size, col = INK, wt = 700) => `<text transform="${txM(P(x, y, z), Dv(0,-1,0), Dv(1,0,0))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${wt}" letter-spacing=".04em">${str}</text>`;

/* ---------- colours ---------- */
const CHIP = { l:'#4d4a47', m:'#363331', d:'#232120' }, HDR = { l:'#4a4642', m:'#34312e', d:'#211f1d' };
const GOLD = matOf('#e8c45a'), TIN = METAL, COP = '#d8935a', SILK = '#f4f6f2', HOLE = '#2b2523';
const ALU = { l:'#eef0f0', m:'#c9cfd2', d:'#949da1' }, PLUGM = { l:'#5a5651', m:'#3d3935', d:'#262321' };
const BBM = { l:'#fbfaf3', m:'#e6e2d6', d:'#c2bcae' }, WHITE = matOf('#f3efe4'), TAN = matOf('#c9a46a');
const FUSE = matOf('#d7b73e'), RESB = matOf('#d9c49a'), CAPT = matOf('#c8946a'), SMDK = matOf('#2f2c2a');
const LEDR = { l:'#ff8a75', m:'#e2483d', d:'#a8302a' }, LEDRL = { l:'#fff0d8', m:'#ffb08a', d:'#ff6a4a' };
const WYEL = '#f2c230', WBLK = '#2b2724', QUARTZ = matOf('#e6f3f4');

/* ---------- the board's parts, in board mm ---------- */
const OUTL = [[0,0],[66.04,0],[68.58,2.54],[68.58,50.8],[66.04,53.34],[0,53.34]];
const HOLES = [[13.97,2.54],[15.24,50.8],[66.04,7.62],[66.04,35.56]];
const DIG = [['SCL',21.34],['SDA',23.88],['AREF',26.42],['GND',28.96],['13',31.5],['12',34.04],['~11',36.58],['~10',39.12],['~9',41.66],['8',44.2],
  ['7',48.26],['~6',50.8],['~5',53.34],['4',55.88],['~3',58.42],['2',60.96],['TX1',63.5],['RX0',66.04]];
const PWR = ['', 'IOREF', 'RESET', '3V3', '5V', 'GND', 'GND', 'VIN'], ANA = ['A0','A1','A2','A3','A4','A5'];
const DIPU = 47.5, DIPV = 14.3, DIPZ0 = PT + 3.8, DIPZ1 = PT + 7.1;
const dipPinU = k => k <= 14 ? 64.01 - (k - 1)*2.54 : 30.99 + (k - 15)*2.54;   // pin 1 top right, by the notch
const dipPinV = k => k <= 14 ? DIPV + 3.81 : DIPV - 3.81;
const LEDS = { L:[30.5, 44, '#ffcf3a'], TX:[30.5, 40.5, '#ffcf3a'], RX:[30.5, 38.3, '#ffcf3a'], ON:[59, 44.2, '#5fe07a'] };
const XTAL = [21, 23.5], U2 = [21, 33], RESO = [42.5, 21.5], RST = [6.5, 49.5];
// copper: top-layer runs (solid) and bottom-layer runs (dashed, through vias)
const TRK = {
  dm:   [[7.9,37.3],[10.6,37.3],[11.6,35.5],[13.8,35.5],[15.9,33.4],[18.5,33.4]],
  dp:   [[7.9,38.7],[11.3,38.7],[12.2,37.5],[13.8,37.5],[17.1,34.2],[18.5,34.2]],
  vbus: [[9.6,36.6],[10.4,35.8],[10.4,27]],
  v5a:  [[14.6,27],[14.6,21.6],[15.6,20.6],[27.4,20.6],[29.05,22.25],[29.05,23.45]],
  v5b:  [[30,25.75],[31.4,25.75],[33,24.15],[47.6,24.15],[49.4,22.35],[49.4,19.4],[48.77,18.6],[48.77,DIPV + 3.81]],
  v5c:  [[34,24.15],[34.8,23.35],[34.8,5.8],[34.54,4.8],[34.54,2.54]],
  v5d:  [[20.8,4.3],[21.6,5.0],[33.6,5.0],[34.54,4.8]],
  v33:  [[25.55,5.6],[25.55,5.0]],
  vin:  [[6,12.6],[6.3,13.0],[6.3,16]],
  vin2: [[2.6,16],[1.4,17.2],[1.4,19.4],[11.6,19.4],[13,18],[13,5.2],[16.2,5.2],[16.2,4.3]],
  txl:  [[23.5,34.0],[24.8,34.0],[25.4,35.4],[27,35.4],[28.4,36.8],[57.2,36.8],[60.2,33.8],[60.2,20.8],[61.47,19.5],[61.47,DIPV + 3.81]],
  rxl:  [[23.5,33.2],[24.8,33.2],[25.4,34.2],[27,34.2],[28.7,35.9],[56.8,35.9],[59.3,33.4],[59.3,20.8],[58.93,19.6],[58.93,DIPV + 3.81]],
  dtr:  [[21.6,35.5],[21.6,37.3],[25,40.7],[25.7,41.5]],
  rst:  [[27.3,41.5],[28.2,42.4],[57,42.4],[61.6,37.8],[61.6,24],[63.2,22.4],[64.01,19.6],[64.01,DIPV + 3.81]],
  x1:   [[18.56,23.5],[18.56,28.6],[19.4,29.9],[19.4,30.5]],
  x2:   [[23.44,23.5],[23.44,28.6],[22.6,29.9],[22.6,30.5]],
  xc1:  [[18.56,26.6],[17.3,26.6],[16.4,27.4]],
  xc2:  [[23.44,26.6],[24.7,26.6],[25.6,27.4]],
  r1:   [[41.2,21.0],[41.15,19.6],[41.15,DIPV + 3.81]],
  r2:   [[43.8,21.0],[43.69,19.6],[43.69,DIPV + 3.81]],
  opin: [[36.6,26.6],[33.6,26.6],[32.9,27.3]],
  ledL: [[29.5,43.0],[29.5,44]],
  opout:[[30.37,33.6],[30.37,34.6]],
};
const BOT = {
  p13:  [[41.15,DIPV - 3.81],[39.88,DIPV - 2.54],[39.88,43.6],[33.2,50.3],[31.5,50.8]],
  p13b: [[39.88,23.3],[36.6,26.6]],
  ledb: [[30.37,34.6],[29.5,35.5],[29.5,43.0]],
};
const VIAS = [[36.6,26.6],[30.37,34.6],[29.5,43.0]];

/* ---------- the circuit on the breadboard (world coordinates) ---------- */
const BBX0 = 6, BBY0 = BY0 - 49.42, BBT = BH + 8.5, BBW = 35, BBL = 46;
const ROWX = {}; 'abcde'.split('').forEach((r, i) => ROWX[r] = BBX0 + 3.53 + i*2.54); 'fghij'.split('').forEach((r, i) => ROWX[r] = BBX0 + 3.53 + 4*2.54 + 7.62 + i*2.54);
const colY = c => BBY0 + 2.68 + (c - 1)*2.54;
const LEDC = [ROWX.g, (colY(8) + colY(9))/2], LEDZ0 = BBT + 3.2;
const JUMP = [ { hu: 31.5, col: 4, col2: WYEL, name: 'D13', lx: 46.5 }, { hu: 28.96, col: 8, col2: WBLK, name: 'GND', lx: 50.5 } ];
const PLUGX = BX0 - 38, FACE = BY0 + 6.2, ZJACK = PT + 5.45, ZREST = BH + 5.5;

/* ---------- small helpers ---------- */
const add3 = (a, b) => [a[0]+b[0], a[1]+b[1], a[2]+b[2]], scl3 = (a, k) => a.map(v => v*k), lerp3 = (a, b, t) => a.map((v, i) => v + (b[i] - v)*t);
const boxOf = (pts, e = .05) => [[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - e), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + e)];
const bez = (p0, p1, p2, p3, n) => Array.from({length: n + 1}, (_, i) => { const t = i/n, a = (1-t)**3, b = 3*(1-t)**2*t, c = 3*(1-t)*t*t, d = t**3;
  return [0,1,2].map(k => a*p0[k] + b*p1[k] + c*p2[k] + d*p3[k]); });
// round each interior corner of a route (a cable bends, it doesn't kink)
const bend = (pts, r = 3) => { if (pts.length < 3) return pts; const out = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++){ const [a, b, c] = [pts[i - 1], pts[i], pts[i + 1]];
    const la = Math.hypot(...a.map((v, k) => v - b[k])), lc = Math.hypot(...c.map((v, k) => v - b[k])), d = Math.min(r, la/2.2, lc/2.2);
    if (d < 1e-3){ out.push(b); continue; }
    const p = a.map((v, k) => b[k] + (v - b[k]) * d/la), q = c.map((v, k) => b[k] + (v - b[k]) * d/lc);
    for (let j = 0; j <= 4; j++){ const t = j/4; out.push([0,1,2].map(k => (1-t)*(1-t)*p[k] + 2*(1-t)*t*b[k] + t*t*q[k])); } }
  out.push(pts[pts.length - 1]); return out; };
// a cable cut into short pieces, each with its own box, so byDepth puts it behind or in front of the solids it passes
const cable = (pts, col, r, Lp = 3, ends = false) => { const out = [];
  for (let i = 0; i < pts.length - 1; ){
    let j = i + 1, len = 0; while (j < pts.length - 1 && len < Lp){ len += Math.hypot(...pts[j].map((v, k) => v - pts[j - 1][k])); j++; }
    if (len < Lp) while (j < pts.length - 1) j++;
    const seg = pts.slice(i, j + 1), d = pd(seg, false);
    out.push({ box: boxOf(seg, r*.7), svg: `<path d="${d}" fill="none" stroke="${INK}" ${mw(2*r + .55)} stroke-linecap="round" stroke-linejoin="round"/>`
      + `<path d="${d}" fill="none" stroke="${col}" ${mw(2*r)} stroke-linecap="round" stroke-linejoin="round"/>` });
    i = j; }
  return out; };
const polyAt = (pts, t) => { const seg = []; let tot = 0;
  for (let i = 0; i < pts.length - 1; i++){ const l = Math.hypot(pts[i+1][0] - pts[i][0], pts[i+1][1] - pts[i][1]); seg.push(l); tot += l; }
  let d = ((t % 1) + 1) % 1 * tot;
  for (let i = 0; i < seg.length; i++){ if (d <= seg[i]) { const k = seg[i] ? d/seg[i] : 0; return [pts[i][0] + (pts[i+1][0] - pts[i][0])*k, pts[i][1] + (pts[i+1][1] - pts[i][1])*k]; } d -= seg[i]; }
  return pts[pts.length - 1]; };

/* ---------- what the board is doing right now (derived from the one state object) ---------- */
function sig(st, now){
  const o = { pow: st.plugged && st.plugK >= 1, pin: false, tx: false, rx: false, usb: false, ser: false, dtr: false, wr: false };
  if (!o.pow) return o;
  const el = st.frz != null ? st.frz : (now - st.ph0) / 1000;
  const flashes = e => e < .45 && ((e*1000/75) | 0) % 2 === 0;
  if (st.phase === 'run') o.pin = st.sketch === 'blink' && ((st.frzRun != null ? st.frzRun : (now - st.runT0)) % 2000) < 1000;
  else if (st.phase === 'boot') { o.pin = st.bootLen > .5 && flashes(el); o.usb = el < .8 && st.bootLen < .5; }
  else if (st.phase === 'upload'){
    o.usb = true; o.dtr = el < .3;
    if (el >= .25 && el < .7) o.pin = flashes(el - .25);
    if (el >= .7 && el < 2.9){ o.ser = true; o.wr = true; o.rx = ((el*1000/55) | 0) % 2 === 0; o.tx = ((el*1000/90) | 0) % 3 === 0; }
  }
  return o;
}
const upProg = (st, now) => st.phase !== 'upload' ? 0 : Math.max(0, Math.min(1, ((st.frz != null ? st.frz : (now - st.ph0)/1000) - .7) / 2.2));

/* ---------- the PCB: substrate, mask, silkscreen, copper ---------- */
function pcbItem(st, m, k, sg, now){
  const A = uon(PB, OUTL), B = uon(PT, OUTL), zc = PT + .02;
  const top = k > 0 ? mix(m.l, '#f2efe7', .3*k) : m.l;
  let s = loft(A, B, n => toneI(n, { l: m.m, m: m.d, d: mix(m.d, '#000000', .3) })) + fill(pd(B), top);
  const tp = pts => pd(pts.map(([u, v]) => UW(u, v, zc)), false);
  const all = Object.values(TRK).map(tp).join(''), bot = Object.values(BOT).map(tp).join('');
  // the traces show faintly through the solder mask; in see-through the mask clears and the copper shows
  s += `<path d="${all}" fill="none" stroke="${mix(m.l, '#ffffff', .28)}" ${mw(.55)} stroke-linecap="round" stroke-linejoin="round" opacity="${f(1 - k)}"/>`;
  if (k > 0){
    s += `<g opacity="${f(k)}"><path d="${bot}" fill="none" stroke="${mix(COP, '#f2efe7', .35)}" ${mw(.5)} stroke-dasharray="1.1 .7" stroke-linecap="round"/>`
      + `<path d="${all}" fill="none" stroke="${COP}" ${mw(.55)} stroke-linecap="round" stroke-linejoin="round"/>`
      + VIAS.map(([u, v]) => shape(ucirc(u, v, zc, .45, 10), COP, .25) + fill(pd(ucirc(u, v, zc + .01, .2, 8)), HOLE)).join('');
    // live nets
    const hot = (keys, col, w = .7, src = TRK) => `<path d="${keys.map(q => tp(src[q])).join('')}" fill="none" stroke="${col}" ${mw(w)} stroke-linecap="round" stroke-linejoin="round"/>`;
    if (sg.pow) s += hot(['vbus', 'v5a', 'v5b', 'v5c', 'v5d', 'v33'], '#ff8a3a', .6);
    if (sg.pin) s += hot(['opin', 'opout', 'ledL'], '#e2483d') + hot(['p13', 'p13b', 'ledb'], '#e2483d', .6, BOT);
    if (sg.dtr) s += hot(['dtr', 'rst'], '#43c25c');
    const dots = (key, n, speed, col, rev = false, src = TRK) => { let d = ''; for (let i = 0; i < n; i++){ const t = (now/1000*speed + i/n) % 1, [u, v] = polyAt(src[key], rev ? 1 - t : t);
      d += fill(pd(ucirc(u, v, zc + .03, .42, 8)), col); } return d; };
    if (sg.usb) s += hot(['dm', 'dp'], '#3e86d9', .55) + dots('dm', 3, 1.4, '#ffffff') + dots('dp', 3, 1.4, '#ffffff');
    if (sg.ser) s += hot(['txl'], '#f2c230', .55) + dots('txl', 9, .45, '#fff4d6') + hot(['rxl'], '#f2c230', .55) + dots('rxl', 3, .45, '#fff4d6', true);
    s += `</g>`;
  }
  // silkscreen
  const sk = (pts, w = .25) => `<path d="${pd(pts.map(([u, v]) => UW(u, v, zc + .01)), true)}" fill="none" stroke="${SILK}" ${mw(w)}/>`;
  s += txU(50, 33.6, zc, 'ARDUINO', 3.1, SILK, 800) + txU(50, 26.6, zc, 'UNO', 6.2, SILK, 800);
  s += sk(ellUV(47.1, 39.3, 3.1, 2.3, 18), .55) + sk(ellUV(52.9, 39.3, 3.1, 2.3, 18), .55);
  s += `<path d="${pd([UW(46, 39.3, zc), UW(48.2, 39.3, zc)], false)}${pd([UW(51.8, 39.3, zc), UW(54, 39.3, zc)], false)}${pd([UW(52.9, 38.2, zc), UW(52.9, 40.4, zc)], false)}" fill="none" stroke="${SILK}" ${mw(.5)}/>`;
  s += txU(44, 46.3, zc, 'DIGITAL (PWM~)', 1.7, SILK, 700);
  for (const [t, u] of DIG) s += txV(u + .45, 48.6, zc, t, 1.05, SILK, 700, 'end');
  PWR.forEach((t, i) => { if (t) s += txV(24.38 + i*2.54 + .45, 4.3, zc, t, 1.05, SILK, 700, 'start'); });
  ANA.forEach((t, i) => s += txV(50.8 + i*2.54 + .45, 4.3, zc, t, 1.05, SILK, 700, 'start'));
  s += txU(44, 7.4, zc, 'POWER', 1.4, SILK) + txU(57.2, 7.4, zc, 'ANALOG IN', 1.4, SILK);
  s += txU(RST[0], 45.2, zc, 'RESET', 1.3, SILK) + txU(64.5, 21.9, zc, 'ICSP', 1.3, SILK) + txU(16, 45.4, zc, 'ICSP', 1.1, SILK);
  for (const n of ['L', 'TX', 'RX']) s += txU(28.2, LEDS[n][1] - .45, zc, n, 1.3, SILK, 800, 'end');

// a two-terminal SMD chip (resistor / capacitor / fuse): body + two metal ends, along u or v

// gull-wing leads of an SMD package: list of [u, v, side] where side is the outward direction ('u+','u-','v+','v-')

  s += `<path d="${g}" fill="none" stroke="#8a93c0" ${mw(.08)}/>`;

}

    { at: UW(-2, 38, PT + 10.9), text: 'USB-B JACK', on: sg.pow },
    { at: UW(4, 7.8, PT + 11), text: 'BARREL JACK', on: false },
    { at: UW(31.5, 50.8, ZH), text: 'DIGITAL HEADER', on: sg.pin },
    { at: UW(34.5, 2.54, ZH), text: 'POWER HEADER', on: sg.pow },
    { at: UW(LEDS.L[0], LEDS.L[1], PT + .8), text: 'L LED', on: sg.pin },
    { at: UW(LEDS.ON[0], LEDS.ON[1], PT + .8), text: 'ON LED', on: sg.pow },
    { at: [LEDC[0], LEDC[1], LEDZ0 + 7.5], text: 'RED LED', on: st.wired && sg.pin },
    { at: [BBX0 + 8, BBY0 + 36, BBT], text: 'BREADBOARD', on: false },
  ];
}

/* ---------- behaviour (one state object, one clock) ---------- */
let ui, looping = false, edgeT = 0;
const busy = st => st.frz == null && (st.plugK !== (st.plugged ? 1 : 0) || st.wireK !== (st.wired ? 1 : 0) || st.rstT != null || st.phase === 'upload' || st.phase === 'boot');
function tick(st, dt){
  const now = performance.now();
  const goP = st.plugged ? 1 : 0; st.plugK = goP > st.plugK ? Math.min(1, st.plugK + dt/1.1) : goP < st.plugK ? Math.max(0, st.plugK - dt/.8) : goP;
  if (st.plugged && st.plugK >= 1 && st.phase === 'off') setPhase(st, 'boot', now, .3);
  const goW = st.wired ? 1 : 0; st.wireK = goW > st.wireK ? Math.min(1, st.wireK + dt/1.4) : goW < st.wireK ? Math.max(0, st.wireK - dt/1.1) : goW;
  if (st.rstT != null){ st.rstT += dt; const r = st.rstT;
    st.rstK = r < .08 ? r/.08 : r < .38 ? 1 : Math.max(0, 1 - (r - .38)/.08);
    const pow = st.plugged && st.plugK >= 1;
    if (r < .38 && pow && st.phase !== 'upload') st.phase = 'reset';
    if (r >= .38 && st.phase === 'reset') setPhase(st, 'boot', now, 1.0);
    if (r > .46){ st.rstT = null; st.rstK = 0; } }
  const el = (now - st.ph0) / 1000;
  if (st.phase === 'boot' && el > st.bootLen){ st.phase = 'run'; st.runT0 = now; }
  if (st.phase === 'upload'){
    st.bytes = el < .7 ? st.bytes : Math.round(924 * Math.min(1, (el - .7) / 2.2));
    if (el >= 3.0){ st.sketch = 'blink'; st.bytes = 924; st.phase = 'run'; st.runT0 = now; ui.flash('Done uploading: Blink runs', 1800); } }
}
function setPhase(st, ph, now, len = 0){ st.phase = ph; st.ph0 = now; st.bootLen = len; }
function kick(){
  if (looping) return; looping = true;
  ui.animate(dt => { tick(ui.st, dt); const b = busy(ui.st); if (!b){ looping = false; edges(); } return b; });
}
// a steady Blink only needs a redraw at each edge, once a second
function edges(){ clearTimeout(edgeT); const st = ui.st;
  if (st.phase === 'run' && st.sketch === 'blink' && st.plugged && st.frz == null){ const el = performance.now() - st.runT0;
    edgeT = setTimeout(() => { ui.render(); edges(); }, 1000 - (el % 1000) + 8); } }
function plug(st){
  st.frz = st.frzRun = null;
  if (!st.plugged){ st.plugged = true; ui.flash('USB in: 5 V from the computer, ON lights', 1800); }
  else { st.plugged = false; st.phase = 'off'; ui.flash('Unplugged: the sketch stays in flash', 1800); }
  kick();
}
function upload(st){
  st.frz = st.frzRun = null;
  if (!st.plugged){ ui.flash('Plug in the USB cable first'); return; }
  if (st.plugK < 1){ ui.flash('Wait for the plug to seat'); return; }
  if (st.phase === 'upload'){ ui.flash('Already uploading'); return; }
  setPhase(st, 'upload', performance.now()); st.bytes = st.sketch === 'blink' ? 924 : 444; st.wbytes = 0;
  ui.flash('DTR resets the chip; the bootloader takes the sketch', 2200); kick();
}
function wire(st){
  st.wired = !st.wired;
  if (st.wired) ui.flash(st.sketch === 'blink' && st.plugged ? 'D13 and GND wired: the red LED follows pin 13' : 'D13 and GND wired to the LED', 1800);
  else ui.flash('Jumpers pulled out of the header');
  kick();
}
function pressReset(st){
  st.frz = st.frzRun = null;
  if (st.rstT != null) return;
  st.rstT = 0;
  if (!st.plugged || st.plugK < 1) ui.flash('No power: nothing to reset');
  else if (st.phase === 'upload'){ ui.flash('Upload cut short: the old sketch is kept'); st.phase = 'reset'; st.bytes = st.sketch === 'blink' ? 924 : 444; }
  else ui.flash('Reset: Optiboot flashes L, then the sketch restarts', 2000);
  kick();
}

ui = mountFigure({
  fig:'21', title:'Arduino Uno', size:[DW, DD, 40], palette:'cobalt', turn:'full',
  state:{ plugged:false, plugK:0, wired:false, wireK:0, phase:'off', ph0:0, bootLen:0, runT0:0, sketch:'none', bytes:444, rstT:null, rstK:0, frz:null, frzRun:null },
  scene,
  stats: st => { const sg = sig(st, performance.now());
    return [ { label:'Pin 13', value: !sg.pow ? 'OFF' : sg.pin ? 'HIGH' : 'LOW' },
             { label:'Flash used', value: (st.phase === 'upload' && st.bytes > 444 ? st.bytes : st.bytes) + ' B', small:true },
             { label:'Sketch', value: st.phase === 'upload' ? 'uploading' : st.sketch === 'blink' ? 'Blink' : 'empty', small:true } ]; },
  buttons:[
    { label:'Plug in USB', onClick: st => plug(st) },
    { label:'Upload Blink', onClick: st => upload(st) },
    { label:'Wire LED to pin 13', onClick: st => wire(st) },
    { label:'Press reset', onClick: st => pressReset(st) },
  ],
  acts:{ plug: st => plug(st), reset: st => pressReset(st), led: st => wire(st) },
  params:(st, q) => {
    const now = performance.now();
    if (q.get('usb') === '1'){ st.plugged = true; st.plugK = 1; st.phase = 'run'; st.runT0 = now; }
    if (q.get('sketch') === 'blink'){ st.sketch = 'blink'; st.bytes = 924; }
    if (q.get('wire') === '1'){ st.wired = true; st.wireK = 1; }
    if (q.has('wirek')) st.wireK = +q.get('wirek');
    if (q.has('plugk')) st.plugK = +q.get('plugk');
    if (q.has('pin')) st.frzRun = q.get('pin') === '1' ? 200 : 1200;
    if (q.has('up') && st.plugged){ st.phase = 'upload'; st.ph0 = now; st.frz = +q.get('up'); st.bytes = Math.round(924 * Math.max(0, Math.min(1, (st.frz - .7)/2.2))); }
    if (q.has('rst')) st.rstK = +q.get('rst');
  },
});
xrMount(() => ui, () => '');
if (ui.st.plugged && ui.st.frzRun == null) edges();
</script></body></html>
