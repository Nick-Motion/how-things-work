<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heat pump</title>
<style>@media(min-width:561px){#stats{display:grid;grid-template-columns:repeat(2,max-content);gap:10px 18px}html .zchip{right:calc(50% - 48px)}}</style>
</head><body>
<script src="core.js"></script>
<script>
/* Heat pump: an air-to-air split heat pump. An outdoor unit stands on a concrete pad beside the house; an indoor wall unit
   hangs high on the inside of the same wall; the line set (two copper pipes, a drain hose and a cable) runs through a
   sleeve in the wall and down a trunking to the outdoor unit's service valves. The house is cut open (a dollhouse view):
   the front wall is left off so the room shows. 1 unit = 1 cm.
   x = depth (the room's open front at x = 120, the outdoor unit faces +x), y = width (outside at low y, the room at high y),
   z = up. The wall is y 100..122; the outdoor unit y 10..90 beside it, just past the corner; the room floor y 122..210.

   HOW IT REALLY WORKS (vapour compression, one refrigerant loop, R32)
   HEAT  1. The inverter compressor squeezes cool low-pressure gas into hot high-pressure gas (about 70 C).
         2. Discharge pipe -> 4-way reversing valve; in the heating position its slide joins the discharge to the gas line.
         3. Gas line -> service valve -> trunking -> through the wall -> the indoor coil. The cross-flow fan blows room air
            through the coil: the hot gas gives up its heat, the room warms and the gas condenses to a warm liquid.
         4. Liquid line -> back through the wall -> liquid service valve -> electronic expansion valve (EEV): the pressure
            drops and the liquid flashes to a cold mist (about -8 C), colder than the outside air.
         5. Strainer -> distributor -> outdoor coil: outside air (even at 4 C) is warmer than the refrigerant, so it boils
            it to gas; the propeller fan pulls that air through the coil and blows it out of the front grille colder.
         6. Coil header -> reversing valve (outdoor coil port to the suction port) -> accumulator -> compressor. Round again.
   COOL  The pilot solenoid lets go, discharge pressure shoves the slide to the other end, and flow through the coils
         and line set reverses, while compressor suction and discharge stay fixed: the outdoor coil gets the hot gas
         and becomes the condenser (warm air out of the
         grille), the EEV feeds the cold mist up the liquid line, and the indoor coil becomes the cold evaporator (cool
         air into the room, its moisture dripping into the drain pan and down the drain hose).
   The thermostat is the room sensor on the indoor unit: at the set point (22 C heat, 18 C cool) the inverter slows the
   compressor right down to hold it. Every pipe goes port to port; every part is fixed to the case or to another part.

   PARTS
   SCENE      board . room floor . house wall (render outside, plaster inside) . skirting . remote in its wall holder .
              concrete pad . drain gully
   OUTDOOR    case: front panel, fan grille, top, coil guard (back + left), right panel, valve cover, two feet rails,
              four rubber pads . base pan . partition plate . outdoor coil (back + side, fins + tubes) . gas header +
              four stubs . distributor + four feeder tubes . propeller fan (3 blades) . fan hub . fan motor . motor
              bracket . bell-mouth shroud . compressor + three rubber mounts + terminal cover . accumulator + strap .
              discharge pipe . suction pipe . 4-way reversing valve + slide + pilot valve + pilot solenoid + capillaries .
              EEV + stepper coil . strainer . liquid and gas service valves . inverter board box + heat sink + terminal
              block . compressor wires . fan motor wire . air sensor
   LINE SET   wall sleeve . gas line . liquid line . drain hose . interconnect cable . trunking (riser + run)
   INDOOR     case (front panel, top intake grille, end caps) . louvre . mounting plate . indoor coil (three slabs) .
              coil header . cross-flow fan . fan motor . control board box . drain pan . air filter . vertical vanes .
              louvre motor . display board . room sensor */

/* ---------- geometry ---------- */
const BH = 4;                                                   // board
const WY0 = 100, WY1 = 122, WX1 = 120, WZ = 232;                // the house wall
const FLZ = BH + 3, FLY1 = 210;                                 // room floor slab top, its far edge
const OX0 = 112, OX1 = 142, OY0 = 10, OY1 = 90, OZ0 = 16, OZ1 = 76;   // outdoor unit case
const PADZ = BH + 6;                                            // concrete pad top
const FC = [36, 46], FAN_R = 19, GR_R = 21.5, FAN_X = 134;      // fan centre (y, z), blade tip radius, grille radius
const PART_Y = 62;                                              // partition plate
const IX0 = 20, IX1 = 104, IY0 = 123, IY1 = 145, IZ0 = 186, IZ1 = 214;  // indoor unit case
const IOUT = rrUV(IY0, IZ0, IY1, IZ1, 5, 6);
const LV_H = [141, 186.4], LV_L = 6.5, LV_X = [27, 97];         // louvre hinge (y, z), length, span
const SLEEVE = [98.5, 192], SL_R = 4.2;                         // wall sleeve centre (x, z)
const TRV = [93, 104, 20, 197], TRH = [104, 141, 22, 34], TRY = [93, 100];   // trunking riser (x0,x1,z0,z1), run, depth
const SETP = { heat: 22, cool: 18 };
const OUTS = [-5, 4, 15, 32];
const COP_H = { '-5': 2.6, '4': 3.4, '15': 4.3, '32': 4.9 }, EER_C = { '-5': 6.0, '4': 5.6, '15': 5.0, '32': 3.3 };

const PLASTER = { l:'#f6f1e6', m:'#e4ddcd', d:'#c4bca9' }, RENDER = { l:'#e9cfa8', m:'#d0b289', d:'#9d8260' };
const SECT = { l:'#d6cbb8', m:'#bfb39e', d:'#978b76' }, CONC = { l:'#d9d6cf', m:'#bdb9b0', d:'#8f8b83' };
const PVC = { l:'#f7f6f0', m:'#e3e1d8', d:'#bdbab0' }, FINM = { l:'#d9e0e2', m:'#bcc5c8', d:'#8e999d' };
const COPM = { l:'#f0b07a', m:'#d08a52', d:'#9a5a2c' }, BRASS = matOf('#d8b25a'), COMPM = matOf('#4f5552');
const RUB = matOf('#3a3633'), GREYM = matOf('#8c9296'), PCB = { l:'#4fa36a', m:'#2f8a4a', d:'#1d5f31' };
const BLADE = matOf('#5d6468'), FOAM = matOf('#f2f0e8');
const HOT = '#e2483d', WARM = '#f39a2c', COLD = '#3f7fd6', COOLV = '#8cc4ec', COPPER = '#c98a52';
const RECESS = '#2b2523';

/* ---------- helpers ---------- */
const hpBoxOf = (pts, e = .3) => [[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - e), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + e)];
const hpBend = (pts, r = 1.2) => { if (pts.length < 3) return pts; const out = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++){ const [a, b, c] = [pts[i - 1], pts[i], pts[i + 1]];
    const la = Math.hypot(...sub(a, b)), lc = Math.hypot(...sub(c, b)), d = Math.min(r, la/2.2, lc/2.2);
    if (d < 1e-3){ out.push(b); continue; }
    const p = a.map((v, k) => b[k] + (v - b[k]) * d/la), q = c.map((v, k) => b[k] + (v - b[k]) * d/lc);
    for (let j = 0; j <= 4; j++){ const t = j/4; out.push([0,1,2].map(k => (1-t)*(1-t)*p[k] + 2*(1-t)*t*b[k] + t*t*q[k])); } }
  out.push(pts[pts.length - 1]); return out; };
// a pipe or cable cut into short pieces, each sorted on its own box. fl = { ph, dir, c } draws refrigerant dots moving along it.
function hpPipe(pts, r, col, fl = null, Lp = 4){
  const q = hpBend(pts, Math.max(1.2, r*2.4)), cum = [0], out = [], g = 5;
  for (let i = 1; i < q.length; i++) cum.push(cum[i - 1] + Math.hypot(...sub(q[i], q[i - 1])));
  for (let i = 0; i < q.length - 1; ){
    let j = i + 1; while (j < q.length - 1 && cum[j] - cum[i] < Lp) j++;
    const seg = q.slice(i, j + 1), d = pd(seg, false);
    let svg = `<path d="${d}" fill="none" stroke="${INK}" style="stroke-width:${f(2*r + .7*INK_K)}" stroke-linecap="round" stroke-linejoin="round"/>`
      + `<path d="${d}" fill="none" stroke="${col}" style="stroke-width:${f(2*r)}" stroke-linecap="round" stroke-linejoin="round"/>`;
    if (fl){ const ph = ((fl.ph * fl.dir) % g + g) % g;
      for (let s = Math.ceil((cum[i] - ph) / g) * g + ph; s < cum[j]; s += g){
        let kk = i; while (kk < j - 1 && cum[kk + 1] < s) kk++;
        const t = Math.max(0, Math.min(1, (s - cum[kk]) / ((cum[kk + 1] - cum[kk]) || 1))), [X, Y] = P(...q[kk].map((v, c) => v + (q[kk + 1][c] - v) * t));
        svg += `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(Math.max(.5, r*.85))}" fill="#ffffff" opacity=".85"/>`; } }
    out.push({ box: hpBoxOf(seg, r), svg }); i = j; }
  return out;
}
// one face of a box (given its 4 corners and outward normal), only when it faces the viewer
const hpFace = (pts, n, m, sh = tone, w = 1, extra = '') => vis(n) ? shape(pts, sh(n, m), w) + extra : '';
// a thin slab profile in the (y, z) plane from a to b, thickness t on its left side (for extrude along x)
const hpSlab = (a, b, t) => { const d = norm([b[0] - a[0], b[1] - a[1], 0]), n = [-d[1] * t, d[0] * t];
  return [a, b, [b[0] + n[0], b[1] + n[1]], [a[0] + n[0], a[1] + n[1]]]; };
const hpProfInk = (prof, x0, x1, w) => hullInk([...on(PX(x0), prof), ...on(PX(x1), prof)], w);
// a dome on a vertical cylinder: rings from radius r at z0 up to a small cap at z0 + h
const hpDome = (x, y, z0, r, h, m) => { const rs = [1, .92, .72, .4], zs = [0, .4, .78, 1]; let s = '';
  for (let i = 0; i < 3; i++) s += loft(on(PZ(z0 + h*zs[i]), ellUV(x, y, r*rs[i], r*rs[i], 20)), on(PZ(z0 + h*zs[i+1]), ellUV(x, y, r*rs[i+1], r*rs[i+1], 20)), n => toneI(n, m));
  const cap = on(PZ(z0 + h), ellUV(x, y, r*rs[3], r*rs[3], 20));
  return s + fill(pd(cap), toneI([0,0,1], m)) + hullInk([...on(PZ(z0), ellUV(x, y, r, r, 20)), ...cap], 1); };
const hpTxB = (x, y, z, str, size, col = INK) => `<text transform="${txM(P(x,y,z), Dv(0,1,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em">${str}</text>`;
const hpTxYb = (x, y, z, str, size, col = INK) => `<text transform="${txM(P(x,y,z), Dv(-1,0,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em">${str}</text>`;

/* ---------- the refrigerant: colours and directions per pipe, from the valve position and the compressor speed ---------- */
// a segment is described by its colour in heating and in cooling, and its flow direction (+1 = as drawn) in heating
function hpSeg(st, heatCol, coolCol, heatDir, reverses = true){
  const c = mix(coolCol, heatCol, st.valve), col = mix(COPPER, c, Math.min(1, st.run * 1.6));
  return { col, fl: st.run > .03 ? { ph: st.ph, dir: (!reverses || st.valve >= .5 ? 1 : -1) * heatDir, c } : null };
}
const hpTint = (st, heatCol, coolCol, base, k = .5) => mix(base, mix(coolCol, heatCol, st.valve), Math.min(1, st.run * 1.6) * k);

/* ---------- the house: board, floor, wall ---------- */
function ground(){
  let s = board(-4, 2, 152, 214, BH, 6, BOARD);
  // paving joints outside
  let j = ''; for (const y of [28, 54, 80]) j += pd([[-3, y, BH + .05], [151, y, BH + .05]], false);
  for (const x of [26, 56, 86]) j += pd([[x, 3, BH + .05], [x, WY0, BH + .05]], false);
  s += `<path d="${j}" fill="none" stroke="${INK}" stroke-width=".6" opacity=".35"/>`;
  // room floor: a wooden slab on the board, boards running along x
  s += box(0, WY1, BH, WX1, FLY1, FLZ, WOOD, toneI, 1);
  let b = ''; for (let y = WY1 + 11; y < FLY1; y += 11) b += pd([[0, y, FLZ + .05], [WX1, y, FLZ + .05]], false);
  s += `<path d="${b}" fill="none" stroke="${INK}" stroke-width=".55" opacity=".45"/>`;
  return s;
}
function wallSvg(st, k){
  const x0 = 0, x1 = WX1, y0 = WY0, y1 = WY1, z0 = BH, z1 = WZ;
  const hatch = (pts3) => { let h = ''; return h; };
  let s = '';
  // exterior render (low y), brick-coloured with course lines
  if (vis([0,-1,0])){ s += shape([[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]], tone([0,-1,0], RENDER), 1.2);
    let c = ''; for (let z = z0 + 30; z < z1; z += 30) c += pd([[x0 + .5, y0 - .05, z], [x1 - .5, y0 - .05, z]], false);
    s += `<path d="${c}" fill="none" stroke="${INK}" stroke-width=".6" opacity=".3"/>`; }
  // interior plaster (high y) and the skirting
  if (vis([0,1,0])){ s += shape([[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]], tone([0,1,0], PLASTER), 1.2);
    s += shape([[x0,y1+.1,FLZ],[x1,y1+.1,FLZ],[x1,y1+.1,FLZ+8],[x0,y1+.1,FLZ+8]], '#ffffff', .8); }
  // the cut ends and top: section faces, hatched
  for (const [n, pts] of [[[1,0,0], [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]], [[-1,0,0], [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]]]){
    if (!vis(n)) continue; const x = pts[0][0] + n[0]*.05;
    let h = ''; for (let z = z0 + 4; z < z1 + 22; z += 7) h += pd([[x, y0, Math.min(z1, z)], [x, y1, Math.min(z1, z) - Math.min(22, z - z0)]].map(([a, b, c]) => [a, b, c]), false);
    s += shape(pts, tone(n, SECT), 1.2) + clipTo(pts, `<path d="${h}" fill="none" stroke="${INK}" stroke-width=".55" opacity=".4"/>`); }
  const top = [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]];
  let th = ''; for (let x = x0 + 4; x < x1 + 22; x += 7) th += pd([[Math.min(x1, x), y0, z1 + .05], [Math.max(x0, x - 22), y1, z1 + .05]], false);
  s += shape(top, SECT.l, 1.2) + clipTo(top, `<path d="${th}" fill="none" stroke="${INK}" stroke-width=".55" opacity=".4"/>`);
  s += hullInk([[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]], 2.6);
  if (k <= 0) return s;
  // see-through: the wall fades and the sleeve with the line set inside it shows
  let m = '';
  const parts = [];
  parts.push({ box: [[SLEEVE[0] - SL_R, WY0, SLEEVE[1] - SL_R], [SLEEVE[0] + SL_R, WY1, SLEEVE[1] + SL_R]], svg: `<g opacity=".55">${rod([SLEEVE[0], WY0 - .3, SLEEVE[1]], [SLEEVE[0], WY1 + .3, SLEEVE[1]], SL_R, matOf('#bfc4c2'), toneI, .8)}</g>` });
  m += byDepth(parts);
  m += byDepth(lineInWall(st));
  return `<g opacity="${f(1 - .8*k)}">${s}</g><g opacity="${f(k)}">${m}</g>`;
}

/* ---------- the line set: pipe routes (in heating flow direction) ---------- */
// gas line: outdoor gas service valve -> run -> riser -> sleeve -> indoor coil header. Liquid line: indoor -> outdoor.
const GAS_OUT = [[131, 92.5, 28], [131, 96.5, 28], [95.5, 96.5, 28], [95.5, 96.5, 188], [97, 96.5, 193.5], [97, 100, 193.5]];
const GAS_WALL = [[97, 100, 193.5], [97, 122, 193.5]];
const GAS_IN = [[97, 122, 193.5], [97, 126, 193.5], [101.5, 128, 196], [101.5, 130.5, 199]];
const LIQ_IN = [[101.5, 139, 195], [101.5, 128, 195], [100, 125, 193.5], [100, 122, 193.5]];
const LIQ_WALL = [[100, 122, 193.5], [100, 100, 193.5]];
const LIQ_OUT = [[100, 100, 193.5], [100, 96.5, 193.5], [98.5, 96.5, 189], [98.5, 96.5, 31.5], [136, 96.5, 31.5], [136, 92.5, 31.5]];
const DRAIN = [[100.5, 142, 190.2], [102.6, 142, 190], [102.6, 127, 189.6], [97, 124, 189.6], [97, 100, 189.4], [97, 98.8, 189.2], [101.5, 98.8, 186], [101.5, 98.8, 20], [101.5, 98.8, BH + 1.2]];
const CABLE = [[24.5, 128, 202], [24.5, 124.2, 197], [24.5, 124.2, 190], [100.8, 124.2, 189.8], [100.8, 100, 189.8], [100.8, 94.6, 189.8], [102.2, 94.6, 186], [102.2, 94.6, 25.5], [139, 94.6, 25.5], [139, 92.5, 25.5]];
const cut = (pts, pred) => pts;   // routes are split by hand into the in-unit, in-wall and outside pieces above
function lineInWall(st){
  const g = hpSeg(st, HOT, COOLV, 1), l = hpSeg(st, WARM, COLD, 1);
  return [...hpPipe(GAS_WALL, 1, g.col, g.fl), ...hpPipe(LIQ_WALL, .7, l.col, l.fl),
    ...hpPipe([[97, 100, 189.4], [97, 122, 189.6]], .6, '#dfe3e0'), ...hpPipe([[100.8, 100, 189.8], [100.8, 122, 189.8]], .45, '#3a3632')];
}

/* ---------- trunking (riser down the outside wall, run along the ground to the valve cover) ---------- */
function trunkSvg(st, k, which){
  const [y0, y1] = TRY, [a0, a1, b0, b1] = which === 'V' ? TRV : TRH;
  const body = box(a0, y0, b0, a1, y1, b1, PVC, tone, 1.1) + (which === 'V' && vis([0,-1,0]) ? line([[a0 + .6, y0 - .05, b1 - 3], [a1 - .6, y0 - .05, b1 - 3]], .6) : '');
  if (k <= 0) return body;
  const inside = which === 'V' ? linesV(st) : linesH(st);
  return `<g opacity="${f(1 - .8*k)}">${body}</g><g opacity="${f(k)}">${byDepth(inside)}</g>`;
}
// the outside part of each route, split at the riser's foot (x = 104)
const splitAt = (pts, xs) => { const a = [], b = []; let into = a;
  for (let i = 0; i < pts.length; i++){ into.push(pts[i]); if (i < pts.length - 1 && pts[i][0] <= xs && pts[i + 1][0] > xs || i < pts.length - 1 && pts[i][0] > xs && pts[i + 1][0] <= xs){
      const p = pts[i], q = pts[i + 1], t = (xs - p[0]) / (q[0] - p[0]), c = p.map((v, kk) => v + (q[kk] - v) * t); into.push(c); into = into === a ? b : a; into.push(c); } }
  return [a, b]; };
function linesV(st){
  const g = hpSeg(st, HOT, COOLV, 1), l = hpSeg(st, WARM, COLD, 1);
  const [gb, ga] = splitAt(GAS_OUT, 104), [la, lb] = splitAt(LIQ_OUT, 104), [ca, cb] = splitAt(CABLE.slice(4), 104);
  return [...hpPipe(ga.filter(p => p[1] <= 100), 1, g.col, g.fl), ...hpPipe(la, .7, l.col, l.fl),
    ...hpPipe(DRAIN.slice(4, 8), .6, '#dfe3e0'), ...hpPipe(ca, .45, '#3a3632')];
}
function linesH(st){
  const g = hpSeg(st, HOT, COOLV, 1), l = hpSeg(st, WARM, COLD, 1);
  const [gb] = splitAt(GAS_OUT, 104), [, lb] = splitAt(LIQ_OUT, 104), [, cb] = splitAt(CABLE.slice(4), 104);
  return [...hpPipe(gb, 1, g.col, g.fl), ...hpPipe(lb, .7, l.col, l.fl), ...hpPipe(cb, .45, '#3a3632')];
}
// the drain hose leaving the riser's foot, and the gully it drips into
function drainSvg(){
  return rod([101.5, 98.8, 20], [101.5, 98.8, BH + 1.6], .7, matOf('#dfe3e0'), toneI, .8)
    + shape(on(PZ(BH + .05), rrUV(98, 95.4, 105, 99.8, 1)), '#6d6a64', .8);
}

/* ---------- outdoor unit: the closed case ---------- */
const ringX = (x, cy, cz, r, n = 36) => on(PX(x), ellUV(cy, cz, r, r, n));
function fanBlades(st, x = FAN_X){
  let s = '';
  for (let b = 0; b < 3; b++){ const a0 = st.fanA + b * 2*Math.PI/3, lead = [], trail = [];
    for (let i = 0; i <= 8; i++){ const t = i/8, r = 4.5 + (FAN_R - 4.5) * t, w = .32 + .5*Math.sin(Math.PI * Math.min(1, t * 1.15)) + .12*t;
      const al = a0 + .16 + .22*t, at = a0 - w;
      lead.push([x + 1.2, FC[0] + r*Math.cos(al), FC[1] + r*Math.sin(al)]); trail.push([x - 1.2, FC[0] + r*Math.cos(at), FC[1] + r*Math.sin(at)]); }
    const pts = [...lead, ...trail.reverse()], nrm = vis([1,0,0]) ? [1,0,0] : [-1,0,0];
    s += shape(pts, toneI(nrm, BLADE), .8); }
  return s + cylX(x - 1.5, x + 1.8, FC[0], FC[1], 4, DARK, toneI, .9, 20);
}
function ouCase(st, m){
  const F = vis([1,0,0]), x0 = OX0, x1 = OX1, y0 = OY0, y1 = OY1, z0 = OZ0, z1 = OZ1;
  let s = '';
  // back (x0) and left (y0): coil guard over the fins; frame in the body colour
  const guard = (n, pts, inner, lines) => vis(n) ? shape(pts, tone(n, m), 1.1) + shape(inner, mix(FINM.m, '#6f7a7e', .25), .8)
    + `<path d="${lines}" fill="none" stroke="${INK}" stroke-width=".45" opacity=".55"/>` : '';
  { let ln = ''; for (let y = y0 + 4; y < y1 - 30; y += 1.6) ln += pd([[x0 - .05, y, z0 + 3], [x0 - .05, y, z1 - 3]], false);

  st.valve += Math.sign(vt - st.valve) * Math.min(Math.abs(vt - st.valve), dt / .7);
  // shortcut: accelerated room response and illustrative kW, replace with calibrated data for equipment sizing.
  const leak = .012 * (st.room - st.out);

  if (st.mode === 'heat') rt = Math.max(0, Math.min(1, ((SETP.heat - st.room)*.8 + leak) / (COP_H[st.out]*.26)));
  if (st.mode === 'cool') rt = Math.max(0, Math.min(1, ((st.room - SETP.cool)*.8 - leak) / (EER_C[st.out]*.26)));
  if (st.moving && st.mode !== 'off') rt = Math.min(rt, .4);
