<script>
/* Truth first.
   The upper motor turns a reduction gearbox and the transverse main shaft. Two sprockets pull
   the paired step chains around a closed loop. Axles carry each step; separate chain and trailer
   rollers follow different tracks, keeping the treads level and closing the risers at the landings.
   The returning steps turn beneath each landing, then travel upside down inside the truss.
   A chain from the main shaft drives the friction wheels that pull both continuous handrails.
   A rider boards a level step, stays on that same step, and walks over the comb onto the upper floor.
   Reverse stops the drive before restarting the empty escalator. Emergency stop opens the contactor
   and applies the spring brake. Reset releases the stop latch but does not start the motor.
   Sources read for this model.
   https://www.otis.com/en/us/products-services/products/escalators-and-moving-walks
   https://www.dir.ca.gov/title8/3090.html
   Parts and supports.
   CASE. Floor plates and combs fixed to landing frames; skirts and glass fixed to truss posts.
   STRUCTURE. Upper/lower truss chords, diagonal braces, cross members, lower bearing and upper support.
   STEPS. Tread and riser on the step frame; front axle on the chains; chain and trailer rollers in tracks.
   DRIVE. Motor and gearbox bolted to upper bedplate; coupling, shaft, sprockets and bearings on that frame;
   lower sprockets on a spring tension carriage. Handrail wheels, guides and tension roller fixed to truss.
   POWER. Controller and contactor on the upper frame; conduit along truss to motor and stop switch.
   SAFETY. Brake disc on motor input shaft, spring caliper fixed to bedplate; stop switches on landing posts.
   Scale is approximately 1 model unit to 3 cm. Rise 3.12 m, tread width 1.08 m, rider 1.68 m.
   shortcut: track transitions and tooth profiles are schematic, use manufacturer geometry for engineering use.
*/
const escSlope = Math.tan(Math.PI/6), escRise = 180*escSlope;
const escTop = x => x <= 60 ? 40 : x < 80 ? 40 + escSlope*(x-60)**2/40
  : x <= 240 ? 40 + escSlope*(x-70) : x < 260 ? 40 + escSlope*(170 + (x-240) - (x-240)**2/40) : 40 + escRise;
const escFloor = 48, escUpper = 48 + escRise, escRadius = 15;
const escSteel = matOf('#7f969e'), escBlue = matOf('#5a82c6'), escGold = matOf('#f3c749');
const escSkin = matOf('#e9b589'), escPants = matOf('#485066'), escShirt = matOf('#e57354');
const escBounds = pts => [[0,1,2].map(k=>Math.min(...pts.map(p=>p[k]))), [0,1,2].map(k=>Math.max(...pts.map(p=>p[k])))];
const escPath = [];
for(let x=30;x<=290;x+=2) escPath.push({x,z:escTop(x),a:0,top:true});
for(let i=1;i<=24;i++){ const a=Math.PI*i/24; escPath.push({x:290+15*Math.sin(a),z:escTop(290)-15+15*Math.cos(a),a:-a,top:false}); }
for(let x=288;x>=30;x-=2) escPath.push({x,z:escTop(x)-30,a:-Math.PI,top:false});
for(let i=1;i<=24;i++){ const a=Math.PI*i/24; escPath.push({x:30-15*Math.sin(a),z:25-15*Math.cos(a),a:-Math.PI-a,top:false}); }
let escLength=0;
escPath.forEach((p,i)=>{if(i) escLength+=Math.hypot(p.x-escPath[i-1].x,p.z-escPath[i-1].z);p.s=escLength;});
const escCount=Math.round(escLength/14), escPitch=escLength/escCount;
function escAt(s){
  s=((s%escLength)+escLength)%escLength;
  let i=1; while(escPath[i].s<s) i++;
  const p=escPath[i-1],q=escPath[i],t=(s-p.s)/(q.s-p.s);
  return {x:p.x+(q.x-p.x)*t,z:p.z+(q.z-p.z)*t,a:p.a+(q.a-p.a)*t,top:p.top&&q.top};
}
const escPoint=(p,dx,y,dz)=>[p.x+dx*Math.cos(p.a)-dz*Math.sin(p.a),y,p.z+dx*Math.sin(p.a)+dz*Math.cos(p.a)];
function escBlock(parts,a,b,m,extra=''){
  parts.push({box:[a,b],svg:box(...a,...b,m,toneI,.75)+extra});
}
function escRod(parts,a,b,r,m,w=.65){
  const bb=escBounds([a,b]);parts.push({box:[bb[0].map(v=>v-r),bb[1].map(v=>v+r)],svg:rod(a,b,r,m,toneI,w,r,8)});
}
function escStep(parts,p,detail){
  const v=([x,y,z])=>escPoint(p,x,y,z), a=[-7,27,6.8],b=[7,63,8];
  const corners=[];for(const x of [a[0],b[0]])for(const y of [a[1],b[1]])for(const z of [a[2],b[2]])corners.push(v([x,y,z]));
  let svg=loft([v([-7,27,6.8]),v([7,27,6.8]),v([7,63,6.8]),v([-7,63,6.8])],
    [v([-7,27,8]),v([7,27,8]),v([7,63,8]),v([-7,63,8])],n=>toneI(n,METAL));
  const tn=[-Math.sin(p.a),0,Math.cos(p.a)];
  if(vis(tn)){
    svg+=shape([v([-7,27,8]),v([7,27,8]),v([7,63,8]),v([-7,63,8])],METAL.l,.65);
    for(let y=30;y<63;y+=3)svg+=line([v([-7,y,8.05]),v([7,y,8.05])],.45);
    svg+=shape([v([5.8,27,8.1]),v([7,27,8.1]),v([7,63,8.1]),v([5.8,63,8.1])],escGold.l,.25);
  }
  const riser=[v([-7,27,.1]),v([-7,63,.1]),v([-7,63,6.8]),v([-7,27,6.8])];
  if(vis([-Math.cos(p.a),0,-Math.sin(p.a)]))svg+=shape(riser,escSteel.m,.7);
  parts.push({box:escBounds([...corners,...riser]),svg});
  if(detail){
    escRod(parts,v([0,20,0]),v([0,70,0]),.8,escSteel);
    for(const y of [25,65]){
      escRod(parts,v([0,y,0]),v([0,y,6.8]),.8,escSteel);
      escRod(parts,v([-10,y,-4]),v([0,y,6.8]),.75,escSteel);
      escRod(parts,v([0,y,6.8]),v([-6,y,6.8]),.7,escSteel);
    }
    for(const y of [20,70])escRod(parts,v([0,y-1,0]),v([0,y+1,0]),2,METAL);
    for(const y of [24,66])escRod(parts,v([-10,y-1,-4]),v([-10,y+1,-4]),1.6,escBlue);

}
function escWheel(parts,x,y,z,r,angle,m){
  const a=[x,y-1.2,z],b=[x,y+1.2,z],ring=on(PY(CAM_V[1]>0?y+1.25:y-1.25),ellUV(x,z,r*.66,r*.66,16));

  for(let i=0;i<6;i++){const t=angle+i*Math.PI/3;svg+=line([[x,y+(CAM_V[1]>0?1.3:-1.3),z],[x+r*.82*Math.cos(t),y+(CAM_V[1]>0?1.3:-1.3),z+r*.82*Math.sin(t)]],.75);}

function escRider(parts,st){
  let x=14,z=escFloor;
  if(st.rider==='riding'){const p=escAt(st.riderS);x=p.x;z=p.z+8;}
  if(st.rider==='leaving'||st.rider==='upper'){x=st.riderX;z=escUpper;}
  const y=48;
  for(const dy of [-3.2,3.2]){
    escBlock(parts,[x-3,y+dy-1.6,z],[x+3.5,y+dy+1.6,z+2],DARK);
    escRod(parts,[x,y+dy,z+2],[x,y+dy,z+23],2,escPants,1);
  }
  escBlock(parts,[x-4,y-6,z+22],[x+4,y+6,z+40],escShirt);
  escRod(parts,[x,y,z+40],[x,y,z+43],1.7,escSkin);
  parts.push({box:[[x-4.4,y-4.4,z+43],[x+4.4,y+4.4,z+56]],svg:cyl(x,y,z+43,z+51,4.4,escSkin,toneI,1,16)+cyl(x,y,z+51,z+56,4.5,DARK,toneI,.9,16)});
  for(const dy of [-6,6]){
    const handY=dy>0&&st.rider==='riding'?72:y+dy;
    escRod(parts,[x,y+dy,z+37],[x+3,y+dy,z+30],1.7,escShirt,1);
    escRod(parts,[x+3,y+dy,z+30],[x+5,handY,z+32],1.4,escSkin,1);

function escCallouts(items){
  const svg=document.getElementById('fig'),vb=svg.viewBox.baseVal,k=INK_K;
  const inverse=svg.getScreenCTM().inverse();
  const bottom=Math.max(...['btns','stats'].map(id=>document.getElementById(id).getBoundingClientRect().bottom));
  const top=new DOMPoint(0,bottom+12).matrixTransform(inverse).y+9*k;
  const sorted=items.map(it=>({...it,p:P(...it.at)})).sort((a,b)=>a.p[0]-b.p[0]);
  const half=Math.ceil(sorted.length/2);
  return [sorted.slice(0,half),sorted.slice(half)].map((col,side)=>{
    col.sort((a,b)=>a.p[1]-b.p[1]);
    const gap=Math.min(20*k,(vb.height-60*k-top)/Math.max(1,col.length-1));
    return col.map((it,i)=>tag(it.at,((side?vb.width-100*k:100*k)-it.p[0])/k,(top+i*gap-it.p[1])/k,it.text,it.on)).join('');
  }).join('');
}

  for(let i=0;i<escCount;i++){const p=escAt(i*escPitch+st.travel);if(xr>0||p.top&&p.x>=40&&p.x<=280)escStep(xr>0?mech:work,p,xr>0);}

  for(let x=306;x<319;x+=2)rr(mech,[x,49,shaftZ],[x+.6,49,shaftZ],6,escBlue);

const escState={mode:'stopped',direction:1,speed:0,travel:0,rider:'lower',riderS:0,riderX:303,pending:0};
let escUI,escLoop=false;
function escUpdate(st,dt){
  const target=st.mode==='run'?st.direction*18:0,old=st.speed;

  }

function escKick(){

}
function escStart(st,ui){
  if(st.mode==='emergency')return ui.flash('Reset the emergency stop first');

}
function escRide(st,ui){
  if(st.mode!=='run'||st.direction!==1||st.pending)return ui.flash('Start the escalator upward first');
  if(st.rider==='riding'||st.rider==='leaving')return ui.flash('The rider is already on a step');
  if(st.rider==='upper')return ui.flash('The rider has reached the upper floor');
  const choices=Array.from({length:escCount},(_,i)=>i*escPitch+st.travel).map(s=>((s%escLength)+escLength)%escLength);
  st.riderS=choices.filter(s=>escAt(s).top&&escAt(s).x>=36&&escAt(s).x<60).sort((a,b)=>a-b)[0];
  if(st.riderS==null)return ui.flash('Wait for the next level step');
  st.rider='riding';escKick();
}
function escReverse(st,ui){
  if(st.mode==='emergency')return ui.flash('Reset the emergency stop first');
  if(st.rider==='riding'||st.rider==='leaving')return ui.flash('Let the rider reach the landing before reversing');
  if(st.pending)return ui.flash('The drive is stopping before reversal');
  if(st.mode==='run'||st.speed){st.pending=-st.direction;st.mode='stopped';escKick();}
  else st.direction=-st.direction;
}
function escStop(st){st.mode='emergency';st.pending=0;escKick();}
function escReset(st,ui){
  if(st.mode!=='emergency')return ui.flash('The emergency stop is already reset');
  if(st.speed!==0)return ui.flash('Wait for the brake to stop the steps');
  st.mode='stopped';
}
escUI=mountFigure({fig:'escalator',turn:'full',title:'Escalator',size:[325,90,escUpper+56],palette:'cobalt',state:escState,scene:escScene,
  stats:st=>[{label:'Step speed',value:(Math.abs(st.speed)*.03).toFixed(2)+' m/s'},
    {label:'Direction',value:st.pending?'Stopping':st.direction===1?'Up':'Down',small:true},
    {label:'Drive',value:st.mode==='emergency'?'STOP LATCHED':st.mode==='run'?'Running':'Stopped',small:true}],
  buttons:[{label:'Start',onClick:escStart},{label:'Ride up',onClick:escRide},{label:'Reverse direction',onClick:escReverse},
    {label:'Emergency stop',onClick:escStop},{label:'Reset stop',onClick:escReset}],
  params:(st,q)=>{
    if(q.get('direction')==='down')st.direction=-1;
    if(['lower','upper'].includes(q.get('rider')))st.rider=q.get('rider');
    const n=Number(q.get('travel'));if(q.has('travel')&&Number.isFinite(n))st.travel=n;
    if(q.get('emergency')==='1')st.mode='emergency';
  }});
const escQuery=new URLSearchParams(location.search);
if(!escQuery.has('yaw'))setCam(135,35.264);
document.getElementById('vreset').addEventListener('click',()=>escUI.camTo(135,35.264));
xrMount(()=>escUI,()=> '');
</script>
