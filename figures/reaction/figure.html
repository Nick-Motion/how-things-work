<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A chemical reaction</title></head><body>
<script src="core.js"></script>
<script>
/* A chemical reaction: methane burning in oxygen, in a sealed glass reaction chamber on a lab bench.
   x = depth (front face toward +x), y = width (+y toward viewer-left), z = up. 1 unit ~ 3 mm; molecules are drawn huge.

   How it really works (and where every atom is after each step):
   1. Fill: the vent valve opens and the extract hose pulls the old gas out; then the CH4 and O2 needle valves on the
      manifold open and gas from the two lecture bottles (each with its regulator) runs down its hose, through the
      manifold and the flashback arrestor, into the base flange bore and up into the chamber: 4 CH4 + 8 O2 molecules
      (the 1 : 2 ratio of CH4 + 2 O2 -> CO2 + 2 H2O). At 25 C they bump around and nothing happens: a collision
      rarely brings the activation energy (Ea ~ 202 kJ/mol).
   2. Spark: the ignition coil in the control box puts ~20 kV down the HT lead to the spark plug in the top flange; the
      spark jumps the electrode gap and heats a speck of gas past the hump. Each CH4 that reacts gives out heat
      (bonds broken 4 C-H + 2 O=O = 2648 kJ/mol in, bonds made 2 C=O + 4 O-H = 3450 kJ/mol out, net -802 kJ/mol),
      which heats its neighbours past the hump, so a flame front runs out from the gap through the whole chamber.
      The gas flashes to ~2000 C and the pressure gauge jumps (same number of molecules, hotter), then the gas cools
      through the glass, the water condenses as mist on the glass and the pressure falls below 1 bar.
      Atoms only change partners: C + 4 H + 4 O before, the same atoms after.
   3. Slow motion: one CH4 meets two O2. The bonds stretch (climbing the hump), break, and the atoms snap into one CO2
      and two H2O, giving out more energy than went in.
   4. Catalyst: a palladium gauze on a heater pedestal lifts out of its cup on a rod driven by a solenoid under the
      base flange; the heater holds it at 350 C. On the hot metal surface CH4 and O2 react with a much lower hump
      (Ea ~ 85 kJ/mol), so the gas burns slowly and flamelessly on the gauze at 350 C, below the 540 C the gas needs
      on its own, and the gauze glows from the heat of reaction.

   Parts (each held by another):
   BENCH     lab bench board . fume-extract hose over the back edge
   CHAMBER   four threaded tie rods standing on rubber feet . lower nuts . base flange (steel, painted) . upper nuts .
             O-ring gasket . borosilicate glass cylinder . top flange . top nuts . gas inlet bore . vent bore
   TOP       spark plug (steel shell, ceramic insulator, rubber boot, centre electrode, ground electrode) . pressure
             gauge on its stem (case, dial, needle, Bourdon tube, link) . burst disc . thermocouple (head, probe)
   CATALYST  steel cup on the floor . palladium gauze plate . heater under the plate . lift rod . solenoid on its
             bracket under the base flange
   GAS       methane bottle (red) . oxygen bottle (black, white shoulder) . bottle stand with two collars . two valves .
             two regulators . two hoses . manifold block with two needle valves . flashback arrestor . vent valve
   CONTROL   control box . molecule display . bond-energy meter . spark button . catalyst switch . heater lamp .
             battery pack . circuit board . ignition coil . heater relay . three side ports . HT lead . thermocouple lead .
             solenoid and heater lead
   GAS INSIDE methane CH4 . oxygen O2 . carbon dioxide CO2 . water H2O (carbon black, hydrogen white, oxygen red) */

/* ---------- layout ---------- */
const W = 70, D = 154, BH = 3, TOPZ = 100;
const BTOP = boardTop(0, 0, W, D, BH, 6);
const CX = 34, CY = 90, RF = 26, RG = 21, RGI = 19.5, RR = 24;      // chamber axis, flange, glass outer / inner, tie-rod circle
const ZF0 = 14, ZF1 = 20, ZG1 = 70, ZT1 = 76;                         // base flange bottom / top, glass top, top flange top
const RODS = [67.5, 157.5, 247.5, 337.5].map(a => [CX + RR*Math.cos(a*Math.PI/180), CY + RR*Math.sin(a*Math.PI/180)]);
const GAP = [CX, CY, 56.8];                                            // spark gap
const GAUGE = [47, 82.5, 92], GR = 7;                                  // pressure gauge dial centre (faces +x), radius
const TCP = [CX - 13, CY - 11.5], BURST = [24, 104];                   // thermocouple, burst disc
const BX0 = 22, BX1 = 62, BY0 = 12, BY1 = 56, BZ1 = 33;               // control box
const OUTB = rrUV(BY0, BH, BY1, BZ1, 3);
const BOT = [[16, 135, 'CH4'], [16, 146, 'O2']];                       // lecture bottles
const PORTS = [42, 45, 48];                                            // box side ports (x) on y = BY1: heater, thermocouple, HT
const VIN = [CX - 16, CY, 24.5], IIN = [CX, CY + 15, 24.5];            // vent and inlet openings in the chamber floor
const SC = [CX, CY, 42];                                               // where the slow-motion collision is staged
const LEAD_A = 300, TCL_A = 304;                                       // where the HT and thermocouple leads leave the flange
const EA = 202, EA_CAT = 85, DH = -802, E_IN = 2648, E_OUT = 3450;     // kJ/mol
const N0 = 4;                                                          // CH4 molecules in a fresh fill (with 8 O2)

const rad = a => a*Math.PI/180;
const add3 = (a, b) => [a[0]+b[0], a[1]+b[1], a[2]+b[2]], scl3 = (a, k) => a.map(v => v*k);
const lerp3 = (a, b, t) => a.map((v, i) => v + (b[i] - v)*t);
const dist3 = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1], a[2]-b[2]);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const sstep = (a, b, x) => { const t = clamp((x - a)/(b - a)); return t*t*(3 - 2*t); };
const polar = (a, r, z) => [CX + r*Math.cos(rad(a)), CY + r*Math.sin(rad(a)), z];
const ringZ = (x, y, z, r, n = 24) => on(PZ(z), ellUV(x, y, r, r, n));
const circ = (X, Y, r, c, extra = '') => `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(r)}" fill="${c}" ${extra}/>`;
const clipHull = (pts3, inner) => { const id = 'k' + (++_clipN); return `<clipPath id="${id}"><path d="${sp(hull(pts3.map(p => P(...p))))}"/></clipPath><g clip-path="url(#${id})">${inner}</g>`; };
const boxOf = (pts, e = .05) => [[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - e), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + e)];
const ghost = (k, caseSvg, inside = '') => k > 0 ? `<g opacity="${f(1 - .78*k)}">${caseSvg}</g><g opacity="${f(k)}">${inside}</g>` : caseSvg;
const near = a => depthOf([Math.cos(rad(a)), Math.sin(rad(a)), 0]) > 0;    // is this direction from the axis toward the viewer?

const REDM = matOf('#d9473a'), BRASS = matOf('#d8b25a'), RUB = DARK, PDM = { l:'#dfe2e2', m:'#b9bec0', d:'#848c8f' };
const GLASS = '#cfe9f0', STEEL = METAL;

// a cable cut into short pieces, each with its own box, so it sorts with the solids it runs past
const bendPts = (pts, r = 1.2) => { if (pts.length < 3) return pts; const out = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++){ const [a, b, c] = [pts[i-1], pts[i], pts[i+1]];
    const la = dist3(a, b), lc = dist3(c, b), d = Math.min(r, la/2.2, lc/2.2);
    if (d < 1e-3){ out.push(b); continue; }
    const p = lerp3(b, a, d/la), q = lerp3(b, c, d/lc);
    for (let j = 0; j <= 4; j++){ const t = j/4; out.push([0,1,2].map(k => (1-t)*(1-t)*p[k] + 2*(1-t)*t*b[k] + t*t*q[k])); } }
  out.push(pts[pts.length - 1]); return out; };
const cable = (pts, col, w = .55, Lmax = 3.5) => { const q = bendPts(pts), out = [];
  for (let i = 0; i < q.length - 1; ){
    let j = i + 1, len = 0; while (j < q.length - 1 && len < Lmax){ len += dist3(q[j], q[j-1]); j++; }
    const seg = q.slice(i, j + 1), d = pd(seg, false);
    out.push({ box: boxOf(seg), svg: `<path d="${d}" fill="none" stroke="${INK}" style="stroke-width:${f(2*w + .7)}" stroke-linecap="round" stroke-linejoin="round"/>`
      + `<path d="${d}" fill="none" stroke="${col}" style="stroke-width:${f(2*w)}" stroke-linecap="round" stroke-linejoin="round"/>` });
    i = j; }
  return out; };
const cableSvg = (pts, col, w) => cable(pts, col, w).map(p => p.svg).join('');

/* ---------- molecules (space-filling balls on sticks; CPK colours) ---------- */
const MS = 1.55;
const EL = { C:{ r:1.6*MS, m:{ l:'#625c55', m:'#3a3632', d:'#1f1c19' } },
             H:{ r:1.05*MS, m:{ l:'#ffffff', m:'#e6e2d6', d:'#b9b2a2' } },
             O:{ r:1.5*MS, m:{ l:'#f47a68', m:'#e2483d', d:'#a3291f' } } };
const T3 = 2.3*MS/Math.sqrt(3);
const MOL = {
  CH4: { r:4.4*MS/1.3, atoms:[['C',[0,0,0]], ['H',[T3,T3,T3]], ['H',[-T3,-T3,T3]], ['H',[T3,-T3,-T3]], ['H',[-T3,T3,-T3]]], bonds:[[0,1,1],[0,2,1],[0,3,1],[0,4,1]] },
  O2:  { r:3.6*MS/1.3, atoms:[['O',[-1.25*MS,0,0]], ['O',[1.25*MS,0,0]]], bonds:[[0,1,2]] },
  CO2: { r:5.0*MS/1.3, atoms:[['C',[0,0,0]], ['O',[-2.35*MS,0,0]], ['O',[2.35*MS,0,0]]], bonds:[[0,1,2],[0,2,2]] },
  H2O: { r:4.0*MS/1.3, atoms:[['O',[0,0,0]], ['H',[1.6*MS,0,1.25*MS]], ['H',[-1.6*MS,0,1.25*MS]]], bonds:[[0,1,1],[0,2,1]] },
};
// quaternions for tumbling
const qMul = (a, b) => [a[0]*b[0]-a[1]*b[1]-a[2]*b[2]-a[3]*b[3], a[0]*b[1]+a[1]*b[0]+a[2]*b[3]-a[3]*b[2], a[0]*b[2]-a[1]*b[3]+a[2]*b[0]+a[3]*b[1], a[0]*b[3]+a[1]*b[2]-a[2]*b[1]+a[3]*b[0]];
const qRot = (q, v) => { const p = qMul(qMul(q, [0, ...v]), [q[0], -q[1], -q[2], -q[3]]); return [p[1], p[2], p[3]]; };
const qAxis = (ax, a) => { const s2 = Math.sin(a/2); return [Math.cos(a/2), ax[0]*s2, ax[1]*s2, ax[2]*s2]; };
const qNorm = q => { const l = Math.hypot(...q) || 1; return q.map(v => v/l); };
const qFromTo = (a, b) => { const c = cross(a, b), d0 = dot(a, b); if (d0 < -.9999) return [0, 0, 0, 1]; return qNorm([1 + d0, ...c]); };
let seed = 7;
const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
const rdir = () => { const z = rnd()*2 - 1, a = rnd()*2*Math.PI, s2 = Math.sqrt(1 - z*z); return [s2*Math.cos(a), s2*Math.sin(a), z]; };
const rquat = () => qNorm([rnd() - .5, rnd() - .5, rnd() - .5, rnd() - .5]);
const atomsOf = m => MOL[m.kind].atoms.map(([el, o]) => ({ el, p: add3(m.p, qRot(m.q, o)) }));
const newMol = (kind, p, v) => ({ kind, p, v: v || rdir(), q: rquat(), w: rdir(), ws: 1.5 + 2*rnd(), mode: null });

// where a molecule may be: inside the glass, above the floor (and the catalyst), below the spark plug
function limits(st, m, r){
  const rr = Math.hypot(m.p[0] - CX, m.p[1] - CY), plateTop = 21.8 + 10*st.catK;
  const lo = (rr < 11 ? Math.max(25, plateTop) : ZF1) + r, hi = (rr < 6.5 ? 54.4 : ZG1) - r;
  return { rr, lo, hi, rmax: RGI - r };
}
function freshSpot(st, list, r){
  for (let i = 0; i < 400; i++){
    const a = rnd()*2*Math.PI, rr = Math.sqrt(rnd())*(RGI - r - .5), p = [CX + rr*Math.cos(a), CY + rr*Math.sin(a), ZF1 + r + rnd()*(ZG1 - ZF1 - 2*r)];
    const lm = limits(st, { p }, r);
    if (p[2] < lm.lo || p[2] > lm.hi) continue;
    if (list.every(o => dist3(o.p, p) > MOL[o.kind].r + r + 1.2)) return p;
  }
  return [CX + 8, CY, 40];
}
function fillGas(st, kinds){
  const list = [];
  for (const kind of kinds) list.push(newMol(kind, freshSpot(st, list, MOL[kind].r)));
  return list;
}
const FRESH = ['CH4','O2','O2','CH4','O2','O2','CH4','O2','O2','CH4','O2','O2'];
const BURNT = ['CO2','H2O','H2O','CO2','H2O','H2O','CO2','H2O','H2O','CO2','H2O','H2O'];

/* ---------- reaction: CH4 + 2 O2 -> CO2 + 2 H2O. The atoms keep their identity; only their partners change ---------- */
function react(st, ch4, o2s, dur, heat){
  if (!o2s) o2s = st.mols.filter(m => m.kind === 'O2' && !m.mode).sort((a, b) => dist3(a.p, ch4.p) - dist3(b.p, ch4.p)).slice(0, 2);
  if (o2s.length < 2) return null;
  const A = [...atomsOf(ch4), ...atomsOf(o2s[0]), ...atomsOf(o2s[1])];   // 0 C, 1-4 H, 5-6 O (first O2), 7-8 O (second O2)
  const nearO = (i, j) => dist3(A[i].p, A[0].p) < dist3(A[j].p, A[0].p) ? [i, j] : [j, i];
  const [oa, oaf] = nearO(5, 6), [ob, obf] = nearO(7, 8);
  const hs = [1, 2, 3, 4].sort((i, j) => dist3(A[i].p, o2s[0].p) - dist3(A[j].p, o2s[0].p));
  const co2 = newMol('CO2', ch4.p.slice()); co2.q = qFromTo([1,0,0], norm(sub(o2s[0].p, o2s[1].p)));
  const wa = newMol('H2O', o2s[0].p.slice()), wb = newMol('H2O', o2s[1].p.slice());
  const pc = atomsOf(co2), pa = atomsOf(wa), pb = atomsOf(wb);
  const to = []; to[0] = pc[0].p; to[oa] = pc[1].p; to[ob] = pc[2].p;
  to[oaf] = pa[0].p; to[hs[0]] = pa[1].p; to[hs[1]] = pa[2].p;
  to[obf] = pb[0].p; to[hs[2]] = pb[1].p; to[hs[3]] = pb[2].p;
  const ev = { t:0, dur, heat, c: avg([ch4.p, o2s[0].p, o2s[1].p]), atoms: A.map((a, i) => ({ el: a.el, from: a.p, to: to[i] })),
    oldB: [[0,1,1],[0,2,1],[0,3,1],[0,4,1],[5,6,2],[7,8,2]],
    newB: [[0,oa,2],[0,ob,2],[oaf,hs[0],1],[oaf,hs[1],1],[obf,hs[2],1],[obf,hs[3],1]], products:[co2, wa, wb] };
  st.mols = st.mols.filter(m => m !== ch4 && m !== o2s[0] && m !== o2s[1]);
  st.events.push(ev);
  return ev;
}

/* ---------- slow motion: one collision, staged at the middle of the chamber 1.5x bigger ---------- */
const SLOW_T = 8;
const SD = (() => { const t = T3, s2 = 1.62*MS/1.3, u = norm([0, .6, .8]);
  const ca = [0, 7.4, 1.5], cb = [0, -7.4, -1.5];
  return {
    react: [[ 'C', [0,0,0]], ['H',[t,t,t]], ['H',[-t,t,-t]], ['H',[-t,-t,t]], ['H',[t,-t,-t]],
            ['O', add3(ca, scl3(u, -1.25*MS))], ['O', add3(ca, scl3(u, 1.25*MS))], ['O', add3(cb, scl3(u, 1.25*MS))], ['O', add3(cb, scl3(u, -1.25*MS))]],
    prod: [[0,0,0], [2.3, 9.9, 4.5], [-2.3, 9.9, 4.5], [-2.3, -9.9, -4.5], [2.3, -9.9, -4.5], [0, 2.35*MS, 0], [0, 8.6, 2.9], [0, -2.35*MS, 0], [0, -8.6, -2.9]],
    oldB: [[0,1,1],[0,2,1],[0,3,1],[0,4,1],[5,6,2],[7,8,2]],
    newB: [[0,5,2],[0,7,2],[6,1,1],[6,2,1],[8,3,1],[8,4,1]],
    mol: [0,0,0,0,0,1,1,2,2], centre: [[0,0,0], ca, cb] }; })();
// phase of the replay at time t: approach, stretch (climb the hump), break, form (release energy), drift apart
function slowPhase(t){
  const ap = sstep(0, 1.8, t), str = sstep(1.8, 3.2, t), brk = sstep(3.2, 3.7, t), frm = sstep(3.7, 5.2, t), dep = sstep(5.2, 7.6, t);
  const x = t < 1.8 ? .04 + .16*ap : t < 3.2 ? .2 + .3*str : t < 3.7 ? .5 : t < 5.2 ? .5 + .3*frm : .8 + .15*dep;
  return { ap, str, brk, frm, dep, x, broken: Math.round(E_IN*sstep(1.8, 3.7, t)), made: Math.round(E_OUT*frm) };
}
function slowScene(t){
  const ph = slowPhase(t), s = 1.25, th = .22*t, c = Math.cos(th), sn = Math.sin(th);
  const W3 = p => add3(SC, scl3([p[0]*c - p[1]*sn, p[0]*sn + p[1]*c, p[2]], s));
  const atoms = SD.react.map(([el, p0], i) => {
    const mi = SD.mol[i], cen = SD.centre[mi];
    let p = p0;
    if (mi) p = add3(p, scl3([0, Math.sign(cen[1]), Math.sign(cen[2])*.2], 9*(1 - ph.ap)));               // the O2s fly in
    p = add3(p, scl3(sub(p0, cen), .45*ph.str + .25*ph.brk));                                               // bonds stretch, then break
    p = lerp3(p, SD.prod[i], ph.frm);                                                                       // new partners
    if (i !== 0 && i !== 5 && i !== 7) p = add3(p, scl3([0, Math.sign(SD.prod[i][1]), Math.sign(SD.prod[i][2])*.3], 6*ph.dep));
    return { el, p: W3(p) };
  });
  return { atoms, ph, s, oldA: 1 - ph.brk, newA: sstep(.45, 1, ph.frm) };
}

/* ---------- drawing the molecules ---------- */
function atomSvg(el, p, s = 1){
  const [X, Y] = P(...p), R = EL[el].r*s*CAM_K, m = EL[el].m;
  return circ(X, Y, R, m.m) + circ(X + R*.16, Y - R*.18, R*.72, m.l) + circ(X + R*.34, Y - R*.36, R*.2, '#ffffff', 'opacity=".7"')
    + `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(R)}" fill="none" stroke="${INK}" stroke-width=".9"/>`;
}
function bondSvg(a, b, ra, rb, order, s = 1, alpha = 1, hot = 0){
  if (alpha <= .01) return '';
  const d = norm(sub(b.p || b, a.p || a)), A = add3(a.p || a, scl3(d, ra*.7)), B = sub(b.p || b, scl3(d, rb*.7));
  const [x0, y0] = P(...A), [x1, y1] = P(...B), Lh = Math.hypot(x1 - x0, y1 - y0) || 1, nx = -(y1 - y0)/Lh, ny = (x1 - x0)/Lh;
  const offs = order === 2 ? [-.5*s, .5*s] : [0], wo = (order === 2 ? .95 : 1.25)*s, wi = (order === 2 ? .42 : .62)*s;
  const col = hot ? mix('#d9d3c4', '#ff8a3d', hot) : '#d9d3c4';
  let o = '';
  for (const k of offs){ const dd = `M${f(x0 + nx*k)} ${f(y0 + ny*k)}L${f(x1 + nx*k)} ${f(y1 + ny*k)}`;
    o += `<path d="${dd}" fill="none" stroke="${INK}" style="stroke-width:${f(wo)}" stroke-linecap="round"/><path d="${dd}" fill="none" stroke="${col}" style="stroke-width:${f(wi)}" stroke-linecap="round"/>`; }
  return alpha < 1 ? `<g opacity="${f(alpha)}">${o}</g>` : o;
}
const atomItem = (el, p, s = 1, op = 1) => { const r = EL[el].r*s, svg = atomSvg(el, p, s);
  return { box: [[p[0]-r, p[1]-r, p[2]-r], [p[0]+r, p[1]+r, p[2]+r]], svg: op < 1 ? `<g opacity="${f(op)}">${svg}</g>` : svg }; };
const bondItem = (a, b, order, s = 1, alpha = 1, op = 1, hot = 0) => { const svg = bondSvg(a, b, EL[a.el].r*s, EL[b.el].r*s, order, s, alpha*op, hot);
  return svg ? { box: boxOf([a.p, b.p], -.4), svg } : null; };
function molItems(st, op){
  const out = [];
  for (const m of st.mols){
    const at = atomsOf(m);
    for (const a of at) out.push(atomItem(a.el, a.p, 1, op));
    for (const [i, j, o] of MOL[m.kind].bonds) out.push(bondItem(at[i], at[j], o, 1, 1, op));
  }
  for (const e of st.events){
    const t = clamp(e.t), te = ease(t), bulge = .45*Math.sin(Math.PI*Math.min(1, t*1.4));
    const at = e.atoms.map(a => ({ el: a.el, p: add3(lerp3(a.from, a.to, te), scl3(sub(a.from, e.c), bulge)) }));
    for (const a of at) out.push(atomItem(a.el, a.p, 1, op));
    for (const [i, j, o] of e.oldB) out.push(bondItem(at[i], at[j], o, 1, 1 - sstep(.1, .45, t), op, sstep(0, .4, t)));
    for (const [i, j, o] of e.newB) out.push(bondItem(at[i], at[j], o, 1, sstep(.55, .9, t), op));
  }
  return out;
}
function flashes(st){
  let o = '';
  for (const e of st.events){ const a = sstep(.35, .6, e.t)*(1 - sstep(.6, 1, e.t)); if (a <= .01) continue;
    const [X, Y] = P(...e.c), R = (5 + 6*e.t)*CAM_K;
    o += circ(X, Y, R, '#ffe27a', `opacity="${f(.55*a)}"`) + circ(X, Y, R*.55, '#fff7d6', `opacity="${f(.8*a)}"`); }
  return o;
}

/* ---------- the chamber ---------- */
function rodMid(x, y){ return rod([x, y, ZF1], [x, y, ZG1], 1, STEEL, toneI, .8, 1, 12) + cyl(x, y, ZF1, ZF1 + 1.8, 1.9, STEEL, toneI, .8, 6); }
function plugSvg(st, k){
  const hex = cyl(CX, CY, ZT1, ZT1 + 4, 3.2, STEEL, toneI, 1, 6);
  let ins = rod([CX, CY, ZT1 + 4], [CX, CY, 87], 2, CERAMIC, toneI, .9, 1.4, 18);

      continue; }

      if (vn > 0) m.v = sub(m.v, scl3(n, 2*vn)); m.p = [CX + n[0]*lm.rmax, CY + n[1]*lm.rmax, m.p[2]]; }
    if (m.p[2] < lm.lo){ m.p[2] = lm.lo; m.v[2] = Math.abs(m.v[2]); }
    if (m.p[2] > lm.hi){ m.p[2] = lm.hi; m.v[2] = -Math.abs(m.v[2]); }

    if (dl > rm || dl < 1e-6) continue;

  st.plateGlow = Math.max(0, st.plateGlow - dt/1.4);
  st.sparkT = Math.max(0, st.sparkT - dt); st.press = Math.max(0, st.press - dt);
  st.inK = clamp(st.inK + (st.reset && st.reset.t > 1.1 ? 1 : -1)*dt/.3); st.ventK = clamp(st.ventK + (st.reset && st.reset.t < 1.3 ? 1 : -1)*dt/.3);
  if (st.slow){ if (!st.slow.hold) st.slow.t += dt; if (st.slow.t >= SLOW_T) st.slow = null; return; }   // the gas waits while the replay runs
  if (st.reset){ const r = st.reset; r.t += dt;
    if (r.t > 1.2) st.mols = st.mols.filter(m => m.mode !== 'out');
    while (r.t > 1.2 && r.n < FRESH.length && r.t > 1.2 + r.n*.13){ const kind = FRESH[r.n++], mm = newMol(kind, IIN.slice());
      mm.steer = freshSpot(st, st.mols, MOL[kind].r); mm.mode = 'in'; mm.ss = 45; st.mols.push(mm); }
    st.T += (25 - st.T)*Math.min(1, dt/.4);
    if (r.t > 3.2){ st.reset = null; for (const m of st.mols) if (m.mode === 'in'){ m.mode = null; m.steer = null; } } }
  moveGas(st, dt);
  for (const e of st.events){ e.t += dt/e.dur; if (e.t >= 1){ st.mols.push(...e.products); st.T += e.heat; if (e.cat) st.plateGlow = 1;
    for (const p of e.products) if (e.cat) p.v = norm([rnd() - .5, rnd() - .5, 1.2]); } }
  st.events = st.events.filter(e => e.t < 1);
  if (st.flame){ const fl = st.flame; fl.age += dt; fl.r = Math.min(fl.rmax, fl.r + 36*dt);
    for (const m of st.mols.slice()) if (m.kind === 'CH4' && !m.mode && dist3(m.p, GAP) < fl.r) react(st, m, null, .42, 2775/N0);
    if (fl.age > fl.life) st.flame = null; }
  // catalysis: on the hot palladium a CH4 and two O2 meet on the surface and react without a flame
  if (st.cat && st.catK > .98 && st.plateT > 320 && !st.reset){
    const onPlate = st.mols.filter(m => m.mode === 'cat');
    if (onPlate.length === 3 && onPlate.every(m => m.arrived)){ const ch4 = onPlate.find(m => m.kind === 'CH4'), o2 = onPlate.filter(m => m.kind === 'O2');
      for (const m of onPlate){ m.mode = null; m.steer = null; m.arrived = false; }
      const ev = react(st, ch4, o2, .8, 110); if (ev) ev.cat = true; st.catT = .5; }
    else if (!onPlate.length && (st.catT -= dt) <= 0){
      const top = 21 + 10*st.catK + .8, pc = [CX, CY, top];
      const ch4 = st.mols.filter(m => m.kind === 'CH4' && !m.mode).sort((a, b) => dist3(a.p, pc) - dist3(b.p, pc))[0];
      const o2 = st.mols.filter(m => m.kind === 'O2' && !m.mode).sort((a, b) => dist3(a.p, pc) - dist3(b.p, pc)).slice(0, 2);
      if (ch4 && o2.length === 2){ const spots = [[CX, CY, top + 4.4], [CX + 4.8, CY + 1.5, top + 3.4], [CX - 4.8, CY - 1.5, top + 3.4]];
        [ch4, ...o2].forEach((m, i) => { m.mode = 'cat'; m.steer = spots[i]; m.ss = 13; m.arrived = false; }); } } }
  else for (const m of st.mols) if (m.mode === 'cat'){ m.mode = null; m.steer = null; m.arrived = false; }
  st.T += (25 - st.T)*Math.min(1, dt/(st.flame || st.events.length ? 6 : 2.6));
}

let ui;
function spark(st){
  if (st.reset) return ui.flash('Filling the chamber: one moment');
  if (st.slow) return ui.flash('The replay is running: wait for it to finish');
  st.sparkT = .3; st.press = .25;
  if (!st.mols.some(m => m.kind === 'CH4' && !m.mode)) return ui.flash('No methane left: reset the gas');
  st.flame = { r: 0, age: 0, life: 1.6, rmax: 46 };
}
function slowMo(st){
  if (st.reset) return ui.flash('Filling the chamber: one moment');
  if (st.flame || st.events.length) return ui.flash('Let the flame finish first');
  st.slow = { t: 0 };
}
function resetGas(st){
  st.slow = null; st.flame = null; st.events = [];
  for (const m of st.mols){ m.mode = 'out'; m.steer = VIN; m.ss = 34; m.arrived = false; }
  st.reset = { t: 0, n: 0 };
}
function setCat(st, on){ st.cat = on ? 1 : 0; }

const STATE = { pal:'cobalt', mols:[], events:[], T:25, flame:null, slow:null, reset:null, sparkT:0, press:0, cat:0, catK:0, plateT:25, plateGlow:0, catT:0, inK:0, ventK:0, freeze:false };
STATE.mols = fillGas(STATE, FRESH);
ui = mountFigure({
  fig:'R1', title:'A chemical reaction', turn:'full',
  size:[W, D, TOPZ], palette:'cobalt',
  state: STATE,
  scene,
  readout: st => `${Math.round(st.T)} C`,
  stats: st => { const c = counts(st), e = bondE(st);
    return [ { label:'CH4 / O2 → CO2 / H2O', value:`${c.CH4} / ${c.O2} → ${c.CO2} / ${c.H2O}`, small:true },
             { label:'Net bond energy', value:`${e.net > 0 ? '+' : ''}${e.net.toLocaleString('en-US')} kJ/mol`, small:true },
             { label:'Gas', value:`${Math.round(st.T).toLocaleString('en-US')} °C · ${pressure(st).toFixed(1)} bar`, small:true } ]; },
  buttons:[
    { label:'Spark', onClick: st => { spark(st); kick(); } },
    { label:'Slow motion', onClick: st => { slowMo(st); kick(); } },
    { label:'Reset gas', onClick: st => { resetGas(st); kick(); } },
    { label:'Catalyst', choices: st => [ { label:'Off', current: !st.cat, onClick: s2 => { setCat(s2, 0); kick(); } }, { label:'Palladium at 350 C', current: !!st.cat, onClick: s2 => { setCat(s2, 1); kick(); } } ] },
  ],
  acts:{ spark: st => { spark(st); kick(); }, cat: st => { setCat(st, !st.cat); kick(); } },
  params:(st, q) => {
    if (q.get('state') === 'burnt'){ st.mols = fillGas(st, BURNT); }
    if (q.has('T')) st.T = +q.get('T');
    if (q.get('cat') === '1'){ st.cat = 1; st.catK = 1; st.plateT = 350; }
    if (q.has('slow')) st.slow = { t: +q.get('slow'), hold: true };
    if (q.get('freeze') === '1') st.freeze = true;
    if (q.has('flame')){ const fr = +q.get('flame'); st.freeze = true; st.flame = { r: fr*46, age: fr*1.6*.5, life: 1.6, rmax: 46 };
      for (const m of st.mols.slice()) if (m.kind === 'CH4' && dist3(m.p, GAP) < st.flame.r){ const ev = react(st, m, null, .42, 0); if (ev) ev.t = .55; }
      st.T = 25 + 2775*(1 - st.mols.filter(m => m.kind === 'CH4').length/N0); st.sparkT = .2; }
  },
});
// the gas keeps moving while anything is happening and for half a minute after (moving the pointer over it wakes it);
// if the clock barely moves between frames (a headless virtual-time screenshot), the loop gives up instead of spinning
let looping = false, idleT = 0, frames = 0, clock = 0;
function kick(){ idleT = 0; if (looping || ui.st.freeze) return; looping = true; frames = 0; clock = 0;
  ui.animate(dt => { const st = ui.st; simStep(st, dt); frames++; clock += dt;
    const busy = st.flame || st.events.length || st.slow || st.reset || st.sparkT > 0 || Math.abs(st.T - 25) > 1 || (st.catK > 0 && st.catK < 1) || st.mols.some(m => m.mode);
    idleT = busy ? 0 : idleT + dt; looping = idleT < 30 && !(frames > 60 && clock < frames*.003); return looping; }); }
kick();
document.getElementById('fig').addEventListener('pointermove', kick);
xrMount(() => ui, () => '');
document.head.insertAdjacentHTML('beforeend', '<style>html.rx-xr:not(.nolabels) #stats{display:none}</style>');
</script></body></html>
