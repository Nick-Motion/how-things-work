<!doctype html>
<html lang="en" data-errors=""><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toaster</title></head><body>
<script src="core.js"></script>
<script>
/* Toaster: a two-slot pop-up toaster, built from the Colorfigures reference toaster.
   x = depth 70 (front at x = W), y = width 120, z = height 80. Lever + shade dial on the front, low y.

   HOW IT REALLY WORKS
   1. Bread goes in the slots and stands on the bread racks (wire shelves on the carriage).
   2. Pushing the lever slides the carriage down its guide rod, stretching the pop-up spring. At the bottom the carriage
      presses the two switch contacts together and the latch hook drops over the carriage, holding it down.
   3. Mains current: plug -> cord -> strain relief -> terminal block -> live wire (via the thermal fuse) -> contacts ->
      bus wire -> nichrome wire wound on the three mica cards -> neutral wire -> terminal block. The wire glows and toasts
      both faces of each slice; the bread guards keep the bread off the wire.
   4. The bimetal strip beside the outer card heats too. Its copper side grows more than its steel side, so it bends
      toward the latch. The shade dial (shaft -> crank -> push rod -> strip bracket) sets how far it must bend.
   5. The strip's tip pushes the latch's top, the hook swings off the carriage, the spring yanks the carriage up, the
      contacts spring open (power off) and the toast pops. The strip cools and straightens; the latch drops back.

   PARTS (each held by another)
   CASE       case shell . two slots . lever slot . shade dial . rating label . tray handle (back) . mains cord . plug
   STRUCTURE  base plate . crumb tray on it . four frame posts on the base plate . two card rails on the posts .
              side frame (a plate on the base plate beside the mechanism) . top bracket on the side frame
   HEAT       three mica cards in the rails . nichrome wire wound on each . four bread guards hung from guard bars on the rails
   POP-UP     guide rod (base plate to top bracket) . carriage riding it . lever arm out through the front . crossbar to two
              bread racks . pop-up spring (carriage to top bracket) . latch on its pivot pin in the side frame
   CONTROL    bimetal strip on its bracket on the side frame . dial shaft . crank . push rod to the strip bracket
   POWER      strain relief . terminal block . live wire . thermal fuse . switch contacts in their insulator . bus wire .
              neutral wire */
const W = 70, D = 120, H = 80;
const OUT = rrUV(0, 0, D, H, 12);                              // body profile in (y, z), swept along x
const SHADES = [
  { name:'light',  col:'#dcae62' },
  { name:'golden', col:'#bf7f37' },
  { name:'dark',   col:'#7d4a22' },
];
const RAW = '#f2dfab', BURNT = '#3a2417';
const BEND_MS = [2000, 2700, 3400];                            // time for the strip to bend all the way, per shade
const WARM = 900;                                              // the wires heat up before the strip starts to move
const SLOTS = [21.5, 38.5];                                    // each slot centred between two mica cards
const DY = D - 100, DZ = H - 61, DR = 5;                       // shade dial centre (y, z) and radius
const BEZ = '#d9dddd', CREAM = '#fff4d6', RECESS = '#2b2523';
const LEVM = { l:'#77716b', m:'#46413c', d:'#2a2724' }, KNOBM = { l:'#fff4d6', m:'#e6dcbd', d:'#bfb390' };

/* ---------- the front panel: a local (u right, v down) frame on the plane x = W + dx ---------- */
const FL = (u, v, dx = .3) => [W + dx, D - u, H - v];
const txB = (x,y,z,str,size,col=INK,weight=700) => `<text transform="${txM(P(x,y,z), Dv(0,1,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`;   // text on the back face, read from behind
const loc = (pts, dx) => pts.map(([u, v]) => FL(u, v, dx));
const lrr = (u, v, w, h, r = 0, dx = .3) => loc(r > 0 ? rrUV(u, v, u + w, v + h, Math.min(r, w/2, h/2), 4) : rectUV(u, v, u + w, v + h), dx);
const lcirc = (cu, cv, r, dx = .3, n = 14) => loc(ellUV(cu, cv, r, r, n), dx);
const mw = w => `style="stroke-width:${w.toFixed(2)}"`;      // a stroke in model units (not rescaled by inkScale)
const angS = s => (-60 + 60*s) * Math.PI / 180;

const tmix = (a, b, k) => mix(a, b, Math.max(0, Math.min(1, k)));
const toastCol = st => st.brown <= 1 ? tmix(RAW, SHADES[st.shade].col, st.brown) : tmix(SHADES[st.shade].col, BURNT, (st.brown - 1) / .3);
const zig = (u0, u1, v, a, n) => { const o = [[u0, v]]; for (let i = 1; i <= n; i++) o.push([u0 + (u1-u0)*i/n, v + (i % 2 ? -a : a) * (i === n ? 0 : 1)]); return o; };

/* ---------- one bread slice standing in a slot: thin along x (x0..x1), a convex profile in (y, z) above the top ---------- */
function hull2(pts){ const h = hull(pts.map(([y, z]) => [y, -z])); return h.map(([y, z]) => [y, -z]); }
function slice(x0, x1, top, crumb){
  const crust = mix(crumb, '#5a2c0e', .42), crustTop = mix(crumb, '#5a2c0e', .3);
  const arc = (cy, cz, r, a0, a1, n = 6) => Array.from({length:n+1}, (_, i) => { const a = (a0 + (a1-a0)*i/n)*Math.PI/180; return [cy + r*Math.cos(a), cz + r*Math.sin(a)]; });
  const y0 = 27, y1 = 93, sh = 9;
  const raw = [[y0, H], ...arc(y0 + sh, top - sh, sh, 180, 90), ...arc((y0+y1)/2, top - 36, 40, 116, 64, 10),
    ...arc(y1 - sh, top - sh, sh, 90, 0), [y1, H]].map(([y, z]) => [y, Math.max(H, z)]);
  const prof = hull2(raw);
  const A = on(PX(x0), prof), B = on(PX(x1), prof), CM = { l:crustTop, m:crust, d:mix(crust, '#000000', .25) };
  let s = loft(A, B, n => toneI(n, CM));
  const fx = vis([1,0,0]) ? x1 : vis([-1,0,0]) ? x0 : null;
  if (fx != null){
    const o = fx === x1 ? .05 : -.05, face = on(PX(fx), prof);
    s += shape(face, crust, .9);
    const cy = (y0+y1)/2, cz = (H + top)/2 + 4;
    s += fill(pd(prof.map(([y, z]) => [fx + o, cy + (y - cy)*.86, Math.max(H + .6, cz + (z - cz)*.86)])), mix(crumb, '#ffffff', .32));
    let pr = '';
    for (const [y, dz] of [[40,6],[52,11],[63,5],[73,9],[47,15],[66,14],[57,3],[80,6]]){ const z = top - 6 - dz;
      if (z > H + 1.5) pr += pd([[fx+2*o,y-.9,z-.6],[fx+2*o,y+.9,z-.6],[fx+2*o,y+.9,z+.6],[fx+2*o,y-.9,z+.6]]); }
    if (pr) s += fill(pr, mix(crumb, '#5a2c0e', .22));
  }
  return s + hullInk([...A, ...B], 1.4);
}

/* ---------- labels: xrCallouts (core.js), but split at the median anchor so ~36 labels fill both columns evenly ---------- */
const XB = [0, W + 8, 0, D, 0, H + 20];                        // label bounds
function tCallouts(items, B){
  const pts = []; for (const x of [B[0], B[1]]) for (const y of [B[2], B[3]]) for (const z of [B[4], B[5]]) pts.push(P(x, y, z));
  const xmin = Math.min(...pts.map(p => p[0])), xmax = Math.max(...pts.map(p => p[0]));
  const k = INK_K, u = window.LBL_U ? LBL_U() : 0, fs = u ? 10*u : 8.6*k, hgt = u ? 17*u : fs*1.8, gap = hgt + (u ? 3*u : 3*k);
  const Lc = [], Rc = [];
  const svgEl = document.getElementById('fig'), vb = svgEl.viewBox.baseVal, btn = document.getElementById('btns');
  const sorted = items.map(it => { const [X, Y] = P(...it.at); return { ...it, X, Y }; }).sort((a, b) => a.X - b.X);
  sorted.forEach((c, i) => (i < sorted.length/2 ? Lc : Rc).push(c));   // even halves; a side short of room clamps its pills to the frame edge
  const top = { [-1]: fs, [1]: fs + 30*k };
  if (btn && svgEl.getScreenCTM()){ const r = btn.getBoundingClientRect(), q = new DOMPoint(r.right, r.bottom + 50).matrixTransform(svgEl.getScreenCTM().inverse());
    if (q.y > 0) top[-1] = q.y + hgt; }
  let s = '';
  for (const [col, side] of [[Lc, -1], [Rc, 1]]){
    col.sort((a, b) => a.Y - b.Y);
    let y = -1e9; for (const c of col){ c.py = Math.max(c.Y, y + gap, top[side]); y = c.py; }
    const shift = col.length ? Math.max(0, col.reduce((a, c) => a + c.py - c.Y, 0) / col.length) : 0;
    const room = col.length ? col[0].py - top[side] : 0; for (const c of col) c.py -= Math.min(shift, room);
    for (const c of col){
      c.n = ((window.__ln || (window.__ln = {}))[c.text] || (__ln[c.text] = Object.keys(__ln).length + 1)); const w = u ? hgt*(c.n > 9 ? 1.3 : 1) : c.text.length*fs*.62 + fs*1.5;
      let px = side < 0 ? xmin - 10*k - w/2 : xmax + 10*k + w/2; px = Math.max(vb.x + w/2 + 2*k, Math.min(vb.x + vb.width - w/2 - 2*k, px));
      const ex = px - side*w/2;
      s += `<g class="tag${c.on ? ' on' : ''}" data-n="${c.n}" data-t="${c.text}"><path d="M${f(c.X)} ${f(c.Y)}L${f(ex + side*-4*k)} ${f(c.py)}L${f(ex)} ${f(c.py)}" fill="none" stroke="${INK}" stroke-width="1"/>`
        + `<circle cx="${f(c.X)}" cy="${f(c.Y)}" r="${f(1.4*k)}" fill="${INK}"/>`
        + `<rect x="${f(px - w/2)}" y="${f(c.py - hgt/2)}" width="${f(w)}" height="${f(hgt)}" rx="${f(hgt/2)}" fill="${c.on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
        + `<text x="${f(px)}" y="${f(c.py + fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${u ? c.n : c.text}</text></g>`;
    }
  }
  return s;
}

/* ---------- scene ---------- */
function scene(st, m){
  const FRONT = facing([1,0,0]), BACK = facing([-1,0,0]), LEFT = facing([0,1,0]);
  const front = tone([1,0,0], m);
  let s = `<defs><filter id="tsSoft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="${(1.4*INK_K).toFixed(2)}"/></filter></defs>`;
  s += castShadow([...on(PX(0), OUT), ...on(PX(W), OUT)]);

  // things on the front: the lever knob (follows the carriage) and the shade dial
  const lz = H - (14 + 30*st.pos);
  const lever = act('lever', box(W - 1, D - 106, lz - 3, W + 8, D - 93, lz + 3, LEVM, toneI, 1.1));
  const a = angS(st.shade);
  let dial = cylX(W, W + 3, DY, DZ, DR, KNOBM, toneI, 1.1, 24);
  if (FRONT) dial += ink(pd([[W + 3.05, DY, DZ], [W + 3.05, DY - DR*.8*Math.sin(a), DZ + DR*.8*Math.cos(a)]], false), 1.1);
  const mounted = byDepth([
    { at: [W + 3.5, D - 99.5, lz], box: [[W, D - 106, lz - 3], [W + 8, D - 93, lz + 3]], svg: lever },
    { at: [W + 1.5, DY, DZ], box: [[W, DY - DR, DZ - DR], [W + 3, DY + DR, DZ + DR]], svg: act('dial', dial) } ]);

  // ---- the body ----
  let body = '';
  if (FRONT){
    body += fill(pd(on(PX(W), OUT)), front);
    body += shape(lrr(91, 5, 18, 68, 4), CREAM, .9);
    body += shape(lrr(98.5, 10, 3, 40, 1.5, .33), RECESS, .7);
    body += act('lever', fill(pd(lrr(91, 5, 18, 48, 4, .36)), 'transparent'));
    for (const k of [0, 1, 2]){ const g = angS(k);
      body += shape(lcirc(100 + 7.4*Math.sin(g), 61 - 7.4*Math.cos(g), 1.3, .34), k === st.shade ? '#ff8a2e' : '#c9c1b2', .5); }
    body += tx(W + .35, D - 100, H - 71.6, 'SHADE', 2.8, INK, 800);
  }
  if (BACK){ const tb = tone([-1,0,0], m);
    body += fill(pd(on(PX(0), OUT)), tb);
    body += shape(on(PX(-.2), rrUV(30, 22, 62, 38, 2)), '#f3f0e6', .9);
    body += txB(-.3, 46, 32.4, '230V~ 900W', 2.6, INK, 800) + txB(-.3, 46, 26.6, 'MOD. TOASTY 2', 2.2, INK, 700); }
  body += extrude(OUT, 0, W, m);
  if (LEFT){
    const sm = tone([0,1,0], m);
    body += shape(on(PY(D + .2), rrUV(15, H - 38, 55, H - 16, 6)), mix(sm, '#ffffff', .22), 1);
    body += txY(35, D + .3, H - 30.5, 'TOASTY', 7, mix(sm, '#000000', .45), 800);
    let v = ''; for (let k = 50; k <= 66; k += 4) v += pd([[18, D + .2, H - k], [52, D + .2, H - k]], false);
    body += `<path d="${v}" fill="none" stroke="${INK}" stroke-width="1.2" opacity=".7"/>`;
  }
  for (const x of SLOTS){ const sl = on(PZ(H + .05), rrUV(x, 20, x + 8, 100, 3, 4));
    body += shape(sl, RECESS, 1.1) + fill(pd(sl), '#ff6a2a', `opacity="${(st.heat*.75).toFixed(3)}"`); }
  if (FRONT) body += ink(pd(on(PX(W), OUT)), 2.2);
  if (BACK) body += ink(pd(on(PX(0), OUT)), 2.2);
  body += hullInk([...on(PX(0), OUT), ...on(PX(W), OUT)], 2.8);

  let bread = '';
  if (st.bread){ const top = H + 3 + 20*(1 - st.pos), col = toastCol(st);
    bread = act('bread', byDepth(SLOTS.map(x => ({ at: [x + 4, D/2, H + 8], box: [[x + 1.5, 27, H], [x + 6.5, 93, top]], svg: slice(x + 1.5, x + 6.5, top, col) })))); }

  // on the back: the crumb tray's handle, and the mains cord out of its strain relief to the plug on the floor
  const cordPts = [[-1, 98, 9], [-4, 98.5, 6], [-6, 99.5, 2], [-9, 101.5, 1], [-18, 104, 1], [-28, 103, 1.2], [-36, 99, 1.4]];
  const cd = pd(cordPts, false);
  const cord = box(-1.6, 52, 1.6, 0, 68, 4.6, LEVM, toneI, 1)
    + cylX(-3, 0, 98, 9, 2.4, LEVM, toneI, 1, 16)
    + `<path d="${cd}" fill="none" stroke="${INK}" ${mw(3.4)} stroke-linecap="round" stroke-linejoin="round"/>`
    + `<path d="${cd}" fill="none" stroke="${LEVM.m}" ${mw(2)} stroke-linecap="round" stroke-linejoin="round"/>`
    + box(-41, 96, 0, -35.5, 102, 4.6, LEVM, toneI, 1);
  const k = ease(st.xr || 0);
  let labels = [];
  if (k > 0){ const mech = toastMech(st);
    body = xrGhost(body, '', k, OUT, 0, W, m) + `<g opacity="${f(k)}">${mech.svg}</g>`;   // inside parts over the ghost
    labels = mech.labels; }
  s += FRONT ? cord + body + mounted : mounted + body + cord;
  s += bread;
  if (k > .6){
    const up = 20*(1 - st.pos), any = st.bread;
    labels.push(
      { at: [SLOTS[0] + 4, 96, H], text: 'SLOT', on: false },
      ...(any ? [{ at: [SLOTS[1] + 4, 60, H + 10 + up], text: 'BREAD', on: st.heat > .05 }] : []),
      { at: [W + 4, D - 99.5, lz + 3], text: 'LEVER KNOB', on: st.pos > .5 },
      { at: [W + 3, DY, DZ + DR], text: 'SHADE DIAL', on: false },
      { at: [-20, 104, 1], text: 'MAINS CORD', on: st.phase === 'toast' });
    s += tCallouts(labels, XB);
  } else s += xrCallouts([
    ...(FRONT ? [{ at: [W + 8, D - 99.5, lz], text: 'LEVER', on: st.pos > .5 }, { at: [W + 3, DY, DZ + DR], text: 'SHADE DIAL', on: false }] : []),
    { at: [SLOTS[1] + 4, 60, H], text: 'SLOTS', on: st.heat > .05 } ], XB);
  return s;
}

/* ---------- see-through: the working parts ---------- */
const MICA = { l:'#f3ead2', m:'#e2d6b6', d:'#bdb08c' }, TCOP = { l:'#f0b07a', m:'#d08a52', d:'#9a5a2c' }, TGM = { l:'#7c8389', m:'#5c6369', d:'#3b4146' };
const INSUL = matOf('#e8e4da'), PLATE = matOf('#b9c0c3');
const CARDS = [17, 34, 51], CY0 = 22, CY1 = 98, CZ0 = 14, CZ1 = 74;
const GROD = [60, 16], SX = 56, LP = [24, 50];                     // guide rod (x, y); strip/latch plane; latch pivot (y, z)
const POSTS = [[15, 20.5], [53, 20.5], [15, 99.5], [53, 99.5]];   // frame posts holding the card rails
const tBoxOf = pts => [[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - .6), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + .6)];
// a wire as short straight pieces, so each sorts on its own; a dot at each end where it lands on a terminal
const tWire = (pts, col, w = .5) => pts.slice(1).map((b, i) => { const a = pts[i], d = pd([a, b], false);
  const dots = [i === 0 && a, i === pts.length - 2 && b].filter(Boolean).map(p => { const [X, Y] = P(...p); return `<circle cx="${f(X)}" cy="${f(Y)}" r="1.2" fill="${INK}"/>`; }).join('');
  return { box: tBoxOf([a, b]), svg: `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${f(2*w + 1)}" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${col}" stroke-width="${f(2*w)}" stroke-linecap="round"/>` + dots }; });
function toastMech(st){
  const h = st.heat, parts = [], put = (b, svg) => parts.push({ box: b, svg }), down = st.pos;
  const bx = (x0, y0, z0, x1, y1, z1, m, w = .8) => put([[x0, y0, z0], [x1, y1, z1]], box(x0, y0, z0, x1, y1, z1, m, toneI, w));
  const lz = H - (14 + 30*down), rack = lz - 25;                     // carriage height (same as the lever outside), bread rack
  const live = st.phase === 'toast', hot = c => h > .05 ? mix('#7d7169', c, h) : '#7d7169';
  // ---- structure: base plate, crumb tray, frame posts, card rails, side frame
  bx(3, 10, 1, 67, 110, 2, PLATE, .8);
  bx(1, 26, 2, 62, 94, 4, matOf('#c9cfd2'), .9);
  for (const [x, y] of POSTS) put([[x - .8, y - .8, 2], [x + .8, y + .8, CZ1]], rod([x, y, 2], [x, y, CZ1], .8, TGM, toneI, .5));
  for (const y of [20.5, 99.5]) bx(14, y - .8, CZ1, 54.2, y + .8, CZ1 + 1.4, TGM, .6);
  bx(54.2, 20, 2, 55, 38, 78, METAL, .8);
  // ---- heating: three mica cards in the rails, nichrome wire wound on each
  for (const xc of CARDS){
    let c = shape(on(PX(xc), rectUV(CY0, CZ0, CY1, CZ1)), MICA.m, .8), wd = '';
    for (let z = CZ0 + 6; z <= CZ1 - 6; z += 8) wd += pd(on(PX(xc + .12), zig(CY0 + 2, CY1 - 2, z, 1.6, 22)), false) + pd(on(PX(xc - .12), zig(CY0 + 2, CY1 - 2, z, 1.6, 22)), false);
    c += `<path d="${wd}" fill="none" stroke="${hot('#ff4d1a')}" style="stroke-width:.7" stroke-linejoin="round"/>`;
    if (h > .05) c += `<path d="${wd}" fill="none" stroke="#ff8a3d" style="stroke-width:2.4" opacity="${f(.5*h)}" stroke-linejoin="round" filter="url(#tsSoft)"/>`;
    put([[xc - .3, CY0, CZ0], [xc + .3, CY1, CZ1]], c);
  }
  // bread guards: wires hung from a bar between the two rails, each side of each slot
  for (const x of SLOTS) for (const xg of [x + .8, x + 7.2]){
    put([[xg - .3, 20.5, CZ1 + .4], [xg + .3, 99.5, CZ1 + 1]], rod([xg, 20.5, CZ1 + .7], [xg, 99.5, CZ1 + .7], .3, METAL, toneI, .3));
    for (const y of [30, 50, 70, 90]) put([[xg - .3, y - .3, CZ0], [xg + .3, y + .3, CZ1 + .4]], rod([xg, y, CZ0], [xg, y, CZ1 + .7], .25, METAL, toneI, .3)); }
  // ---- the bread, standing on its rack inside the slot (above the top the scene draws the slices)
  if (st.bread){ const col = toastCol(st), cm = { l: col, m: mix(col, '#000000', .12), d: mix(col, '#000000', .3) };
    for (const x of SLOTS) put([[x + 1.5, 27, rack + .6], [x + 6.5, 93, H]], box(x + 1.5, 27, rack + .6, x + 6.5, 93, H, cm, toneI, .9)); }
  // ---- pop-up: racks on a crossbar, carriage on the guide rod, lever arm, spring
  for (const x of SLOTS) bx(x + 1.3, 17.5, rack - .6, x + 6.7, 100, rack + .6, METAL, .6);
  put([[SLOTS[0] + 1.3, 17.3, rack - .7], [SX, 18.7, rack + .7]], rod([SLOTS[0] + 1.3, 18, rack], [SX, 18, rack], .7, METAL, toneI, .6));
  put([[GROD[0] - .8, GROD[1] - .8, 2], [GROD[0] + .8, GROD[1] + .8, 76]], rod([GROD[0], GROD[1], 2], [GROD[0], GROD[1], 76], .8, METAL, toneI, .6));
  bx(SX, 12, lz - 4, 64, 20, lz + 4, TGM, .8);
  bx(64, 15, lz - 1.5, W, 21, lz + 1.5, TGM, .6);                                                     // lever arm out through the front slot
  bx(55, 10, 76, 64, 22, 78, TGM, .6);                                                                // top bracket, on the side frame
  { const sp = [], n = 18, z0 = lz + 4, z1 = 76; for (let i = 0; i <= n; i++) sp.push([GROD[0] + (i && i < n ? (i % 2 ? 1.6 : -1.6) : 0), GROD[1] + 2.4, z0 + (z1 - z0)*i/n]);
    put([[GROD[0] - 2, GROD[1] + 1.5, z0], [GROD[0] + 2, GROD[1] + 3.3, z1]], `<path d="${pd(sp, false)}" fill="none" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/><path d="${pd(sp, false)}" fill="none" stroke="#cfd6d8" stroke-width=".7" stroke-linejoin="round"/>`); }
  // ---- switch contacts: two copper leaves from an insulator; the carriage's foot pushes the top leaf onto the bottom one
  const ct = Math.max(32.2, Math.min(34.6, lz - 4));
  bx(61, 7, 29, 65, 9.5, 36, INSUL, .5);
  put([[61, 9.5, 31], [65, 14, ct]], box(61, 9.5, 31, 65, 14, 31.6, TCOP, toneI, .5) + box(61, 9.5, ct - .6, 65, 14, ct, TCOP, toneI, .5));
  // ---- latch on its pivot pin: hook over the carriage, top pushed by the strip
  const la = -.42*st.latch, rot = ([y, z]) => [LP[0] + (y - LP[0])*Math.cos(la) - (z - LP[1])*Math.sin(la), LP[1] + (y - LP[0])*Math.sin(la) + (z - LP[1])*Math.cos(la)];
  const lat = [[23, 58], [25, 58], [25, 42], [23, 42], [23, 41], [18.5, 41], [18.5, 39.6], [23, 39.6], [23, 58]].map(rot);
  put([[55, LP[0] - 1, LP[1] - 1], [56.4, LP[0] + 1, LP[1] + 1]], rod([55, LP[0], LP[1]], [56.4, LP[0], LP[1]], .9, METAL, toneI, .5));
  put([[SX, 17, 38], [SX + .3, 28, 59]], shape(lat.map(([y, z]) => [SX, y, z]), '#f2c230', .7));
  // ---- bimetal strip on its bracket on the side frame; copper side grows more when hot, so it bends toward the latch
  const b = st.bend, br = [33, 74], tip = [33 - 7.5*b, 58.5 + .5*b], ctl = [33 - 1.5*b, 66];
  const strip = du => Array.from({length:13}, (_, i) => { const t = i/12; return [SX, (1-t)*(1-t)*br[0] + 2*(1-t)*t*ctl[0] + t*t*tip[0] + du, (1-t)*(1-t)*br[1] + 2*(1-t)*t*ctl[1] + t*t*tip[1]]; });
  bx(55, 31, 74, 56.6, 36, 77, TGM, .5);
  put([[SX, 24, 56], [SX + .3, 34, 74]], `<path d="${pd(strip(.5), false)}" fill="none" stroke="${mix('#e0773a', '#ff4d1a', h)}" stroke-width="1.6" stroke-linecap="round"/>`
    + `<path d="${pd(strip(-.5), false)}" fill="none" stroke="#c3cacc" stroke-width="1.6" stroke-linecap="round"/>` + ink(pd(strip(0), false), .4));
  // shade: dial shaft through the front, crank on its end, push rod up to the strip's bracket (sets the gap the strip must close)
  put([[SX + 2, DY - .7, DZ - .7], [W, DY + .7, DZ + .7]], rod([W, DY, DZ], [SX + 2, DY, DZ], .7, METAL, toneI, .5));
  put([[SX + 1.4, DY, DZ - .6], [SX + 2.6, 28.6, DZ + 3.6]], rod([SX + 2, DY, DZ], [SX + 2, 28, DZ + 3], .6, TGM, toneI, .5));
  put([[SX + 1.5, 27.5, DZ + 3], [SX + 2.5, 28.5, 72.5]], rod([SX + 2, 28, DZ + 3], [SX + 2, 28, 72.5], .5, METAL, toneI, .5));
  put([[SX + .6, 28, 72.5], [SX + 2.5, 31.5, 74.5]], rod([SX + 2, 28, 72.5], [SX + .6, 31.5, 74.5], .5, METAL, toneI, .5));
  // ---- power: terminal block, live wire through the thermal fuse to the bottom contact, bus from the top contact to the
  //      cards' front ends, neutral from the cards' back ends to the terminal block
  bx(1, 94, 2, 8, 102, 9, INSUL, .6);
  const LIVE = live ? '#ff6a2a' : '#8a3a24', BUS = live ? '#ff6a2a' : '#3a3632';
  parts.push(...tWire([[8, 97, 6], [12, 112, 5], [30, 112, 5]], LIVE));
  put([[30, 111, 4], [36, 113, 6]], rod([30, 112, 5], [36, 112, 5], 1, CERAMIC, toneI, .5));
  parts.push(...tWire([[36, 112, 5], [65, 112, 5], [65, 13, 5], [65, 13, 31]], LIVE));
  parts.push(...tWire([[61, 8, 35], [54, 8, 22], [54, 19, 13], [CARDS[0], 19, 13]], BUS));
  for (const xc of CARDS) parts.push(...tWire([[xc, 19, 13], [xc, CY0, CZ0]], BUS, .4));
  parts.push(...tWire([[8, 100, 7], [10, 101.5, 9], [CARDS[2], 101.5, 9]], '#3a6fb0'));
  for (const xc of CARDS) parts.push(...tWire([[xc, 101.5, 9], [xc, CY1, CZ0]], '#3a6fb0', .4));
  const svg = byDepth(parts);
  const labels = [
    { at: [CARDS[0], 30, 66], text: 'MICA CARD', on: false },
    { at: [CARDS[2], 60, 42.4], text: 'NICHROME WIRE', on: h > .05 },
    { at: [34, 99.5, CZ1 + 1.4], text: 'CARD RAIL', on: false },
    { at: [15, 99.5, 40], text: 'FRAME POST', on: false },
    { at: [SLOTS[0] + 7.2, 90, 30], text: 'BREAD GUARD', on: false },
    { at: [SLOTS[1] + 4, 100, rack], text: 'BREAD RACK', on: down > .5 },
    { at: [(SLOTS[0] + SX)/2, 18, rack], text: 'CROSSBAR', on: down > .5 },
    { at: [GROD[0], GROD[1], 8], text: 'GUIDE ROD', on: false },
    { at: [64, 12, lz + 4], text: 'CARRIAGE', on: down > .5 },
    { at: [W - 2, 18, lz + 1.5], text: 'LEVER ARM', on: down > .5 },
    { at: [GROD[0], GROD[1] + 3, (lz + 76)/2], text: 'SPRING', on: st.phase === 'pop' },
    { at: [60, 10, 78], text: 'TOP BRACKET', on: false },
    { at: [65, 11, ct], text: 'CONTACTS', on: live },
    { at: [SX, 18.5, 40], text: 'LATCH', on: st.latch > .05 },
    { at: [SX, 33 - 4*b, 66], text: 'BIMETAL STRIP', on: live && b > .02 },
    { at: [56.6, 34, 77], text: 'STRIP BRACKET', on: false },
    { at: [55, 37, 10], text: 'SIDE FRAME', on: false },
    { at: [(W + SX)/2 + 2, DY, DZ], text: 'DIAL SHAFT', on: false },
    { at: [SX + 2, 26, DZ + 2.5], text: 'CRANK', on: false },
    { at: [SX + 2, 28, 50], text: 'PUSH ROD', on: false },
    { at: [4.5, 94, 9], text: 'TERMINALS', on: live },
    { at: [50, 112, 5], text: 'LIVE WIRE', on: live },
    { at: [33, 112, 6], text: 'THERMAL FUSE', on: live },
    { at: [40, 19, 13], text: 'BUS WIRE', on: live },
    { at: [40, 101.5, 9], text: 'NEUTRAL WIRE', on: live },
    { at: [20, 94, 4], text: 'CRUMB TRAY', on: false },
    { at: [67, 100, 2], text: 'BASE PLATE', on: false } ];
  return { svg, labels };
}

/* ---------- behaviour (one state object, one clock) ---------- */
let ui, loopOn = false;
function stepSim(st, now, dt){
  if (st.phase === 'toast'){
    const el = now - st.t0, T = BEND_MS[st.shade];
    st.pos = Math.min(1, el / 220);
    st.heat = Math.min(1, el / 700);
    st.bend = Math.max(0, Math.min(1, (el - WARM) / T));
    st.brown = Math.min(1.3, st.brown + dt / (WARM + T));
    if (st.bend >= 1) release(st);
  } else if (st.phase === 'pop'){
    const c1 = 1.9, c3 = c1 + 1;
    st.latch = Math.min(1, (now - st.t0) / 110);
    if (now - st.t0 > 90){ const kk = Math.min(1, (now - st.t0 - 90) / 510);   // the latch lets go, then the spring fires
      st.pos = 1 - (1 + c3*(kk-1)**3 + c1*(kk-1)**2); }
    st.heat = Math.max(0, st.heat - dt / 900);
    if (now - st.t0 > 600){ st.pos = 0; st.phase = 'cool'; }
  } else {
    // cooling: the strip slowly straightens and the latch springs back
    st.heat = Math.max(0, st.heat - dt / 900);
    st.bend = Math.max(0, st.bend - dt / 1600);
    if (st.bend < .75) st.latch = Math.max(0, st.latch - dt / 250);
    if (st.phase === 'cool' && !st.heat && !st.bend && !st.latch) st.phase = 'idle';
  }
}
function runLoop(){
  if (loopOn) return; loopOn = true;
  let last = performance.now();
  ui.animate(() => { const st = ui.st, now = performance.now(), dt = Math.min(100, now - last); last = now;
    stepSim(st, now, dt);
    const busy = st.phase !== 'idle' || st.heat > 0 || st.bend > 0 || st.latch > 0;
    if (!busy) loopOn = false;
    return busy; });
}
function lever(st){
  if (st.phase === 'toast') return release(st);                // pushing it again stops early
  if (st.phase === 'pop') return;
  if (!st.bread) return ui.flash('fresh bread is coming — one moment');
  if (st.bend > .3) return ui.flash('wait — the strip is still cooling down');
  st.phase = 'toast'; st.t0 = performance.now(); st.latch = 0; runLoop();
}
function release(st){
  if (st.phase !== 'toast') return;
  st.phase = 'pop'; st.t0 = performance.now();
  runLoop();
}
function setShade(st, k){
  if (st.phase !== 'idle' && st.phase !== 'cool') return ui.flash('the shade is set before toasting');
  st.shade = k;
}
function take(st){
  if (st.bread && st.phase === 'idle' && st.brown < .1) return ui.flash('push the lever to toast it first');
  if (!st.bread) return ui.flash('fresh bread is coming — one moment');
  if (st.phase === 'toast' || st.phase === 'pop') return ui.flash('still toasting — wait for the pop');
  if (st.brown < .1) return;
  st.bread = false;
  setTimeout(() => { st.bread = true; st.brown = 0; ui.render(); }, 900);
}

ui = mountFigure({
  fig:'04', turn:'full', title:'Toaster',
  size:[W + 8, D, H + 24], center:[W/2 + 4, D/2], palette:'mint',
  // pos: 0 = carriage up, 1 = pushed down. heat 0..1, bend 0..1 (strip), latch 0..1 (0 holds, 1 let go), brown 0..1.3
  state:{ phase:'idle', t0:0, pos:0, heat:0, bend:0, latch:0, brown:0, shade:1, bread:true },
  scene,
  buttons:[
    { label:'Choose shade', choices: st => SHADES.map((s, k) => ({ label:s.name, current: st.shade === k,
        disabled: st.phase === 'toast' || st.phase === 'pop', why:'the shade is set before toasting',
        onClick:(st) => setShade(st, k) })) },
    { label:'Push the lever', onClick:(st) => lever(st) },
    { label:'Take the toast', onClick:(st) => take(st) },
  ],
  acts:{ lever:(st) => lever(st), dial:(st) => setShade(st, (st.shade + 1) % 3), bread:(st) => take(st) },
  params:(st, q) => {
    if (q.has('shade')) st.shade = Math.max(0, Math.min(2, +q.get('shade') | 0));
    for (const k of ['pos', 'heat', 'bend', 'latch', 'brown']) if (q.has(k)) st[k] = +q.get(k);
    if (q.get('bread') === '0') st.bread = false;
  },
});
addEventListener('keydown', e => {
  if (/input|textarea|button/i.test(e.target.tagName)) return;
  const k = e.key.toLowerCase(), st = ui.st;
  if (k === ' ' || k === 'enter') lever(st); else if (k === 'd') setShade(st, (st.shade + 1) % 3); else if (k === 't') take(st); else return;
  e.preventDefault(); ui.render();
});
xrMount(() => ui, () => '');
</script></body></html>
