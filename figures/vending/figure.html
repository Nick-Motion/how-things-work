<!doctype html>
<html lang="en" data-errors=""><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vending machine</title></head><body>
<script src="core.js"></script>
<script>
/* Snack vending machine (spiral / coil type, like a Crane National or AMS glass-front machine).
   How it really works, and where the coin and the snack are after each step:
   1. Insert coin: the coin goes in the slot -> the coin acceptor checks its size, metal and weight -> it drops into the
      matching change tube (or, if the tube is full, down the overflow chute into the cash box). The board adds credit
      and the display shows it.
   2. Type a code (letter = tray, digit = spiral): the board compares credit with the price. Too little: it shows the price.
   3. Enough: the board runs that spiral's gearmotor for one turn (a cam switch on the motor stops it at home). The coil
      screws every snack one pitch forward; the front one is pushed off the end of the coil and falls.
   4. It falls past the trays in the gap behind the glass, through an infrared beam curtain across the drop zone (the
      drop sensor: if no beam is broken the board turns the spiral again), and lands in the delivery bin.
   5. Change: the payout unit pushes coins out of the bottom of the change tubes, down the return chute, into the cup.
      Coin return does the same with unused credit.
   6. Push the flap and take the snack.
   Refrigeration (in the base and up the back): compressor -> condenser behind the kick grille (fan pulls room air
   through it) -> capillary tube -> evaporator under the cabinet floor; the evaporator fan blows the cold air up the duct
   on the back wall, out of louvres over each tray, down the drop zone and back to the fan. A thermostat on the duct
   switches the compressor.

   Coordinates: x = depth (front at x = W), y = width (+y = viewer-left at the front view), z = up. 1 unit = 1 cm.
   PARTS (each fixed to another):
   CASE      cabinet . door (the whole front) . door hinges (left edge) . glass window . header sign . kick grille .
             delivery opening + push flap . control panel . back louvres . rating plate . mains cord
   PRODUCT   5 trays on the side walls . price strips . 25 coils (spirals) . 25 spiral gearmotors on the tray backs .
             home (cam) switches . tray connectors . tray harness . LED light strips on the door either side of the glass
   DROP      IR emitter bar + IR receiver bar across the drop zone . delivery bin floor + back wall . push flap on its hinge
   COINS     coin slot . bill validator . coin acceptor . 3 change tubes . payout unit . return chute . return cup .
             overflow chute . cash box . coin return button
   CONTROL   keypad + keypad board . display module . control board (VMC) on the partition . power supply . door lock
             cylinder + lock bar
   COLD      deck . compressor . discharge line . condenser . condenser fan + motor . capillary tube . evaporator .
             drain pan + drain tube . evaporator fan . air duct with louvres . suction line . thermostat */

const W = 80, D = 100, H = 183;
const OUT = rrUV(0, 0, D, H, 2.5);
const WIN = [28, 56, 96, 170];               // glass: y0, z0, y1, z1 on the front
const BIN = [30, 16, 92, 42], BINX = 62;     // delivery opening (y0, z0, y1, z1) and the back of the bin
const CUP = [7, 72, 19, 82];                 // coin return cup opening
const TRAYZ = [148, 126, 104, 82, 60];       // tray tops A..E
const COLY = [90, 76, 62, 48, 34];           // spiral centres, column 1..5 (left to right seen from the front)
const X0S = 12, CPITCH = 9, NT = 6, CR = 6;   // coil: back end, pitch, turns, radius (front end at X0S + 54 = 66)
const DROPX = 73;                            // snacks fall here, between the tray fronts (68.6) and the glass (78)
const ROWS = 'ABCDE';
const PRICE = [150, 150, 100, 100, 50];      // cents per row; coins are 0.50
const COIN = 50;
const KINDS = [
  { name:'chips',    w:10.5, d:2.8, h:15.5, lab:'#fff4d6', cols:['#e2483d','#f2c230','#3e86d9','#38a565','#f08a2b'] },
  { name:'pretzels', w:10,   d:2.8, h:14,   lab:'#fff4d6', cols:['#8c4bd1','#5cc0e8','#f2c230','#d94f86','#3e86d9'] },
  { name:'bars',     w:10,   d:2.4, h:9,    lab:'#f3efe4', cols:['#6b3a22','#e2483d','#3e86d9','#f2c230','#38a565'] },
  { name:'cookies',  w:9,    d:2.8, h:11,   lab:'#fff4d6', cols:['#f08a2b','#3d4a6b','#d94f86','#38a565','#c98a52'] },
  { name:'mints',    w:8,    d:2.6, h:8,    lab:'#ffffff', cols:['#5cc0e8','#7cc46a','#f3a6bb','#f6d04a','#e2483d'] },
];
const LINER = { l:'#f3f1ea', m:'#dcd8cc', d:'#b5b0a2' };
const GEARM = { l:'#7c8389', m:'#5c6369', d:'#3b4146' };
const PCBM = { l:'#4fa36a', m:'#2f8a4a', d:'#1d5f31' };
const PLAST = matOf('#e8e4da');
const COINM = { l:'#f0d27a', m:'#d2ad4a', d:'#9a7a2a' };
const COPPER = { l:'#f0b07a', m:'#d08a52', d:'#9a5a2c' };
const FINM = { l:'#e3e7e8', m:'#b9c0c2', d:'#8a9396' };
const LEDM = { l:'#fffbe8', m:'#fff1c2', d:'#e8d79a' };
const KEYM = { l:'#eef0f0', m:'#c6ccce', d:'#8f989b' };
const LIVE = matOf('#ff9a3a');
const ACRYL = '#cfe9f0', PANELC = '#3d3935', BEZ = '#2a2622', SCREEN = '#1d2a26', LCD = '#8af0ae', PTXT = '#e8e2d2';
const KEYS = [['A','B','C'], ['D','E','F'], ['1','2','3'], ['4','5','6']];
const KEY_Y = [19, 14, 9], KEY_Z = [119.5, 112.5, 105.5, 98.5];
const fmt = c => (c/100).toFixed(2);
const vClamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- small helpers ---------- */
const vBoxOf = (pts, pad = 1) => [[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - pad), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + pad)];
const vBend = (pts, r = 2.5) => { if (pts.length < 3) return pts; const out = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++){ const [a, b, c] = [pts[i - 1], pts[i], pts[i + 1]];
    const la = Math.hypot(...a.map((v, k) => v - b[k])), lc = Math.hypot(...c.map((v, k) => v - b[k])), d = Math.min(r, la/2.2, lc/2.2);
    const p = a.map((v, k) => b[k] + (v - b[k]) * d/la), q = c.map((v, k) => b[k] + (v - b[k]) * d/lc);
    for (let j = 0; j <= 4; j++){ const t = j/4; out.push([0,1,2].map(k => (1-t)*(1-t)*p[k] + 2*(1-t)*t*b[k] + t*t*q[k])); } }
  out.push(pts[pts.length - 1]); return out; };
// a cable or tube as short pieces, each with its own box, so it sorts with the solids it passes
const wireParts = (pts, col, w = .55, ends = true) => { const q = vBend(pts), out = [], SEG = 8;
  for (let i = 0; i < q.length - 1; ){
    let j = i + 1, len = 0; while (j < q.length - 1 && len < SEG){ len += Math.hypot(...q[j].map((v, k) => v - q[j - 1][k])); j++; }
    if (len < SEG) while (j < q.length - 1) j++;
    const seg = q.slice(i, j + 1), d = pd(seg, false);
    let svg = `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${f(2*w + 1)}" stroke-linecap="round" stroke-linejoin="round"/>`
      + `<path d="${d}" fill="none" stroke="${col}" stroke-width="${f(2*w)}" stroke-linecap="round" stroke-linejoin="round"/>`;
    if (ends && i === 0){ const [X, Y] = P(...q[0]); svg += `<circle cx="${f(X)}" cy="${f(Y)}" r="1.1" fill="${INK}"/>`; }
    if (ends && j === q.length - 1){ const [X, Y] = P(...q[j]); svg += `<circle cx="${f(X)}" cy="${f(Y)}" r="1.1" fill="${INK}"/>`; }
    out.push({ box: vBoxOf(seg, w), svg }); i = j; }
  return out; };
const txYb = (x,y,z,str,size,col=INK,weight=700) => `<text transform="${txM(P(x,y,z), Dv(-1,0,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`;
const txB = (x,y,z,str,size,col=INK,weight=700) => `<text transform="${txM(P(x,y,z), Dv(0,1,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`;

/* ---------- a snack: a bag / bar standing upright (thin along x), or lying flat in the bin ---------- */
function snack(x0, x1, y0, y1, z0, z1, col, K, lying = false){
  const M = matOf(col); let s = box(x0, y0, z0, x1, y1, z1, M, toneI, .7);
  if (!lying){
    const fx = facing([1,0,0]) ? x1 + .05 : facing([-1,0,0]) ? x0 - .05 : null;
    if (fx != null){ const h = z1 - z0;
      s += shape(on(PX(fx), rrUV(y0 + 1.3, z0 + h*.3, y1 - 1.3, z0 + h*.64, 1)), K.lab, .4);
      s += ink(pd([[fx, y0 + .3, z1 - 1.3], [fx, y1 - .3, z1 - 1.3]], false), .4); }
  } else if (facing([0,0,1])){ const l = x1 - x0;
    s += shape(on(PZ(z1 + .05), rrUV(x0 + l*.3, y0 + 1.3, x0 + l*.64, y1 - 1.3, 1)), K.lab, .4);
    s += ink(pd([[x0 + 1.3, y0 + .3, z1 + .05], [x0 + 1.3, y1 - .3, z1 + .05]], false), .4); }
  return s;
}

/* ---------- a coil: the half turned away from the viewer, then the snacks in it, then the near half ---------- */
function coilHalves(yc, t, rot){
  const zc = t + CR, vy = CAM_V[1], vz = CAM_V[2], N = NT*24; let far = '', near = '', run = [], rn = null;
  const flush = () => { if (run.length > 1){ const d = pd(run, false); if (rn) near += d; else far += d; } };
  for (let i = 0; i <= N; i++){ const ps = 2*Math.PI*i/24 + rot, p = [X0S + CPITCH*i/24, yc + CR*Math.cos(ps), zc + CR*Math.sin(ps)];
    const nr = Math.cos(ps)*vy + Math.sin(ps)*vz > 0;
    if (rn === null) rn = nr;
    if (nr !== rn){ run.push(p); flush(); run = [p]; rn = nr; } else run.push(p); }
  flush();
  // the straight tail from the coil into the motor's drive hub
  far += pd([[X0S, yc, zc], [X0S, yc + CR*Math.cos(rot), zc + CR*Math.sin(rot)]], false);
  const st2 = d => d ? `<path d="${d}" fill="none" stroke="${INK}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="#e6eaeb" stroke-width=".75" stroke-linecap="round" stroke-linejoin="round"/>` : '';
  return { far: st2(far), near: st2(near) };
}
function slotUnit(st, r, c){
  const t = TRAYZ[r], yc = COLY[c], K = KINDS[r], n = st.slots[r][c];
  const sp = st.spin && st.spin.r === r && st.spin.c === c ? st.spin : null, a = sp ? sp.a : 0;
  const front = sp && sp.dropped ? NT - 2 : NT - 1;
  const { far, near } = coilHalves(yc, t, -2*Math.PI*a), items = [];
  for (let i = 0; i < n; i++){ const k = front - i, cx = X0S + CPITCH*(k + .5 + a);
    items.push({ box:[[cx - K.d/2, yc - K.w/2, t], [cx + K.d/2, yc + K.w/2, t + K.h]], svg: snack(cx - K.d/2, cx + K.d/2, yc - K.w/2, yc + K.w/2, t, t + K.h, K.cols[c], K) }); }
  return far + byDepth(items) + near;
}
function motorSvg(r, c, on, full){
  const t = TRAYZ[r], yc = COLY[c], zc = t + CR;
  let s = box(4, yc - 4, t + .4, 10, yc + 4, t + 10.6, on ? LIVE : GEARM, toneI, .7);
  s += cylX(10, 12, yc, zc, 2, METAL, toneI, .6, 14);
  if (full) s += box(5, yc + 1.5, t + 10.6, 8, yc + 3.5, t + 12, on ? LIVE : PLAST, toneI, .5);   // home (cam) switch
  return s;
}

/* ---------- the product cabinet: trays, coils, motors, lights, the falling snack ---------- */
function cabinetParts(st, full){
  const parts = [], put = (b, svg) => parts.push({ box: b, svg });
  for (let r = 0; r < 5; r++){ const t = TRAYZ[r];
    let tr = box(4, 27, t - 1.2, 67, 97, t, METAL, toneI, .6) + box(67, 27, t - 3.6, 68.6, 97, t, matOf('#fbf7ea'), toneI, .6);
    if (facing([1,0,0])) for (let c = 0; c < 5; c++){ tr += tx(68.65, COLY[c], t - 2.9, `${ROWS[r]}${c + 1}  ${fmt(PRICE[r])}`, 1.5, INK, 800); }
    put([[4, 27, t - 3.6], [68.6, 97, t]], tr);
    for (let c = 0; c < 5; c++){ const yc = COLY[c], on = st.spin && st.spin.r === r && st.spin.c === c;
      put([[12, yc - 6.6, t], [68, yc + 6.6, t + 16]], slotUnit(st, r, c));
      put([[4, yc - 4, t + .4], [12, yc + 4, t + 12]], motorSvg(r, c, on, full)); }
  }
  // LED strips on the inside of the door, either side of the glass
  for (const [y0, y1] of [[27.2, 29], [95, 96.8]]) put([[76, y0, 56], [77.5, y1, 170]], box(76, y0, 56, 77.5, y1, 170, LEDM, toneI, .6));
  if (st.fall){ const fl = st.fall, K = KINDS[fl.r], yc = COLY[fl.c];
    put([[fl.x - K.d/2, yc - K.w/2, fl.z], [fl.x + K.d/2, yc + K.w/2, fl.z + K.h]], snack(fl.x - K.d/2, fl.x + K.d/2, yc - K.w/2, yc + K.w/2, fl.z, fl.z + K.h, K.cols[fl.c], K)); }
  return parts;
}
function innerWalls(st){
  let s = '';
  const F = [[[1,0,0], [[3.5,27,46],[3.5,97,46],[3.5,97,172],[3.5,27,172]]], [[0,1,0], [[3.5,27,46],[78,27,46],[78,27,172],[3.5,27,172]]],
             [[0,-1,0], [[3.5,97,46],[78,97,46],[78,97,172],[3.5,97,172]]], [[0,0,1], [[3.5,27,46],[78,27,46],[78,97,46],[3.5,97,46]]],
             [[0,0,-1], [[3.5,27,172],[78,27,172],[78,97,172],[3.5,97,172]]]];
  for (const [n, q] of F) if (vis(n)) s += shape(q, toneI(n, LINER), .6);
  if (vis([1,0,0])) for (const t of TRAYZ) s += shape(on(PX(3.55), rrUV(34, t + 16.5, 90, t + 18.5, .8)), '#8f8a7e', .5);   // duct louvres
  return s;
}
const interior = st => innerWalls(st) + byDepth(cabinetParts(st, false));

/* ---------- delivery bin, flap, cup ---------- */
function binSnacks(st){
  return st.bin.map((b, i) => { const K = KINDS[b.r], y = 61 + (i % 3 - 1)*13 + Math.floor(i/3)*3, z = 16 + Math.floor(i/3)*(K.d + .2);
    return { box:[[63.5, y - K.w/2, z], [63.5 + K.h, y + K.w/2, z + K.d]], svg: snack(63.5, 63.5 + K.h, y - K.w/2, y + K.w/2, z, z + K.d, K.cols[b.c], K, true) }; });
}
function binCavity(st){
  let s = shape(on(PX(BINX), rectUV(BIN[0], BIN[1], BIN[2], 46)), '#2b2523', 0);
  const sy = vis([0,1,0]) ? BIN[0] : BIN[2];
  s += face(pd([[BINX, sy, BIN[1]], [W, sy, BIN[1]], [W, sy, 46], [BINX, sy, 46]]), '#3a3330');
  s += face(pd([[BINX, BIN[0], BIN[1]], [W, BIN[0], BIN[1]], [W, BIN[2], BIN[1]], [BINX, BIN[2], BIN[1]]]), '#564c46');
  const items = st.take ? [] : binSnacks(st);
  if (st.fall && st.fall.z < 46){ const fl = st.fall, K = KINDS[fl.r], yc = COLY[fl.c];
    items.push({ box:[[fl.x - K.d/2, yc - K.w/2, fl.z], [fl.x + K.d/2, yc + K.w/2, fl.z + K.h]], svg: snack(fl.x - K.d/2, fl.x + K.d/2, yc - K.w/2, yc + K.w/2, fl.z, fl.z + K.h, K.cols[fl.c], KINDS[fl.r]) }); }
  return s + byDepth(items);
}
// the push flap: hinged along its top edge, swings in (toward -x) when pushed
function flapSvg(st){
  const th = ease(st.flap) * 62 * Math.PI/180, y0 = BIN[0] + .5, y1 = BIN[2] - .5, len = BIN[3] - BIN[1] - .5, t = 1, hx = W - .6, hz = BIN[3];
  const dn = [-Math.sin(th), 0, -Math.cos(th)], nOut = [Math.cos(th), 0, -Math.sin(th)];
  const Q = (a, w, y) => [hx + a*dn[0] - w*nOut[0], y, hz + a*dn[2] - w*nOut[2]];
  const faces = [
    { n: nOut, p: [Q(0,0,y0), Q(0,0,y1), Q(len,0,y1), Q(len,0,y0)], clear: true },
    { n: dn,   p: [Q(len,0,y0), Q(len,0,y1), Q(len,t,y1), Q(len,t,y0)] },
    { n: [0,1,0],  p: [Q(0,0,y1), Q(len,0,y1), Q(len,t,y1), Q(0,t,y1)] },
    { n: [0,-1,0], p: [Q(0,0,y0), Q(len,0,y0), Q(len,t,y0), Q(0,t,y0)] },
    { n: nOut.map(v => -v), p: [Q(0,t,y0), Q(0,t,y1), Q(len,t,y1), Q(len,t,y0)], clear: true } ];
  let s = '';
  for (const fc of faces) if (vis(fc.n)) s += fc.clear ? fill(pd(fc.p), DARK.m, 'fill-opacity=".42"') + ink(pd(fc.p), 1) : shape(fc.p, tone(fc.n, DARK), .8);
  if (vis(nOut)){
    s += fill(pd([Q(len*.15,-.1,y0+8), Q(len*.15,-.1,y0+12), Q(len*.85,-.1,y0+24), Q(len*.85,-.1,y0+20)]), '#ffffff', 'opacity=".28"');
    const yc = (y0 + y1)/2; s += shape([Q(len-4,-.1,yc-9), Q(len-4,-.1,yc+9), Q(len-1.5,-.1,yc+9), Q(len-1.5,-.1,yc-9)], DARK.d, .7);
    if (th < .05) s += tx(W + .05, yc, BIN[1] + 3.6, 'PUSH', 2.6, PTXT, 800); }
  s += ink(pd([[hx, y0 - .5, hz], [hx, y1 + .5, hz]], false), 1.4);
  return s;
}
function cupCavity(st){
  const [y0, z0, y1, z1] = CUP, bx = W - 4;
  let s = shape(on(PX(bx), rectUV(y0, z0, y1, z1)), '#1d1a16', 0);
  const sy = vis([0,1,0]) ? y0 : y1;
  s += face(pd([[bx, sy, z0], [W, sy, z0], [W, sy, z1], [bx, sy, z1]]), '#2f2a26');
  s += face(pd([[bx, y0, z0], [W, y0, z0], [W, y1, z0], [bx, y1, z0]]), '#8f989b');
  for (let i = 0; i < Math.min(st.cup, 6); i++){ const cx = W - 2.2 + (i % 2)*.5, cy = 10 + i*1.6, A = on(PZ(z0 + .1 + i*.25), ellUV(cx, cy, 1.3, 1.3, 14)), B = on(PZ(z0 + .45 + i*.25), ellUV(cx, cy, 1.3, 1.3, 14));
    s += loft(A, B, n => toneI(n, COINM)) + fill(pd(B), COINM.l) + ink(pd(B), .5); }
  return s;
}

/* ---------- the case ---------- */
function displayLines(st){
  if (st.msgT > 0 && st.msg) return st.msg;
  if (st.code) return ['CODE', st.code.padEnd(2, '_')];
  if (st.spin || st.fall) return ['VENDING', '...'];
  if (st.credit) return ['CREDIT', fmt(st.credit)];
  return ['INSERT', 'COINS'];
}
function frontFace(st, m){
  const F = PX(W), fc = tone([1,0,0], m);
  const win = on(F, rrUV(WIN[0], WIN[1], WIN[2], WIN[3], 2)), binO = on(F, rectUV(...BIN)), cupO = on(F, rrUV(CUP[0], CUP[1], CUP[2], CUP[3], 1.5));
  let s = clipTo(win, interior(st));
  s += act('take', clipTo(binO, binCavity(st) + flapSvg(st)));
  s += act('cup', clipTo(cupO, cupCavity(st)));
  s += `<path d="${pd(on(F, OUT))}${pd(win)}${pd(binO)}${pd(cupO)}" fill="${fc}" fill-rule="evenodd"/>`;
  s += ink(pd(on(PX(W + .05), rrUV(1.4, 1.4, D - 1.4, H - 1.4, 2))), .9);                          // door seam
  // header sign
  s += shape(on(PX(W + .15), rrUV(WIN[0], 173.5, WIN[2], 180.5, 1.5)), '#fff4d6', 1.1);
  s += tx(W + .25, (WIN[0] + WIN[2])/2, 175.2, 'SNACKS', 5.4, '#e2483d', 800);
  // kick grille: the condenser's air intake
  for (let z = 3.5; z < 12; z += 2.2) s += shape(on(PX(W + .1), rrUV(BIN[0], z, BIN[2], z + 1.1, .5)), mix(fc, '#000000', .55), .5);
  // control panel (with the cup hole)
  const PF = PX(W + .15);
  s += `<path d="${pd(on(PF, rrUV(3, 14, 25, 171, 2)))}${pd(on(PF, rrUV(CUP[0], CUP[1], CUP[2], CUP[3], 1.5)))}" fill="${PANELC}" fill-rule="evenodd"/>` + ink(pd(on(PF, rrUV(3, 14, 25, 171, 2))), 1.2);
  const P2 = PX(W + .25), P3 = W + .35;
  // display
  s += shape(on(P2, rrUV(6, 149, 22, 160, 1.5)), SCREEN, 1);
  const [l1, l2] = displayLines(st);
  s += tx(P3, 14, 155.6, l1, 2.5, LCD, 700) + tx(P3, 14, 150.9, l2, 3.6, LCD, 800);
  // bill validator bezel
  s += shape(on(P2, rrUV(6, 138, 22, 146, 1.2)), BEZ, .9) + shape(on(PX(P3), rectUV(8, 141.6, 20, 142.5)), '#0e0c0a', .4);

    { at:[10, yc, t + 10.6], text:'SPIRAL MOTOR', on: !!st.spin },
    { at:[6.5, yc + 2.5, t + 12], text:'HOME SWITCH', on: !!st.spin },
    { at:[4.6, 70, TRAYZ[2] + .9], text:'TRAY HARNESS', on: !!st.spin },
    { at:[77.5, 96.8, 120], text:'LED LIGHT', on:false },
    { at:[71, 97, 52], text:'DROP SENSOR', on: st.beam > 0 },
    { at:[70, 92, 16], text:'DELIVERY BIN', on: st.bin.length > 0 },
    { at:[W, 92, 30], text:'PUSH FLAP', on: st.flap > 0 },
    { at:[22, 80, 12.5], text:'COMPRESSOR', on:true },
    { at:[69, 34, 12], text:'CONDENSER', on:true },
    { at:[61, 54, 12], text:'CONDENSER FAN', on:true },
    { at:[28, 90, 36], text:'EVAPORATOR', on:true },
    { at:[35, 62, 34.4], text:'EVAPORATOR FAN', on:true },
    { at:[2, 92, 140], text:'AIR DUCT', on:true },
    { at:[5, 66, 114], text:'THERMOSTAT', on:false },
    { at:[30, 36, 12], text:'CAPILLARY TUBE', on:false },
    { at:[6, 88, 18], text:'SUCTION LINE', on:false },
    { at:[29, 91, 18], text:'DRAIN PAN', on:false },
  ]; };
const SURF = st => facing([1,0,0]) ? [
  { at:[W + 1, 14, 112], text:'KEYPAD', on: st.keyT > 0 }, { at:[W, 17.5, 133], text:'COIN SLOT', on: st.coin != null },
  { at:[W, 14, 158], text:'DISPLAY', on:false }, { at:[W, 13, 74], text:'CHANGE CUP', on: st.cup > 0 },
  { at:[W, 80, 36], text:'PUSH FLAP', on: st.bin.length > 0 }, { at:[W, 92, 150], text:'SPIRALS', on: !!st.spin } ] : [];

// the core callout layout, with room kept for the switches top right (this figure has 34 labels)
function vCallouts(items, B){
  const pts = []; for (const x of [B[0], B[1]]) for (const y of [B[2], B[3]]) for (const z of [B[4], B[5]]) pts.push(P(x, y, z));
  const xmin = Math.min(...pts.map(p => p[0])), xmax = Math.max(...pts.map(p => p[0])), cx = (xmin + xmax)/2;
  // on a phone (LBL_U = drawing units per screen px) each label is a numbered badge and the names go in a legend under the figure
  const k = INK_K, u = window.LBL_U ? LBL_U() : 0, fs = u ? 10*u : 8.6*k, hgt = u ? 17*u : fs*1.8, gap = hgt + (u ? 3*u : 3*k);
  const L = [], R = [];
  const svgEl = document.getElementById('fig'), vb = svgEl.viewBox.baseVal, btn = document.getElementById('btns');
  const wMax = u ? hgt*1.3 + 12*k : Math.max(...items.map(it => it.text.length))*fs*.62 + fs*1.5 + 12*k;
  const roomL = xmin - vb.x >= wMax, roomR = vb.x + vb.width - xmax >= wMax;
  for (const it of items){ const [X, Y] = P(...it.at); ((X < cx && roomL) || !roomR ? L : R).push({ ...it, X, Y }); }
  let s = '';
  let top = { [-1]: fs, [1]: fs + 30*k };
  if (btn && svgEl.getScreenCTM()){ const r = btn.getBoundingClientRect(), q = new DOMPoint(r.right, r.bottom + 50).matrixTransform(svgEl.getScreenCTM().inverse());
    if (q.y > 0) top[-1] = q.y + hgt; }
  for (const el of [document.querySelector('.vset'), document.getElementById('stats')])
    if (el && svgEl.getScreenCTM() && getComputedStyle(el).position === 'absolute'){ const r = el.getBoundingClientRect(), q = new DOMPoint(r.left, r.bottom + 8).matrixTransform(svgEl.getScreenCTM().inverse());
      if (q.y > 0) top[1] = Math.max(top[1], q.y + hgt/2); }
  const cap = side => Math.floor((vb.y + vb.height - hgt/2 - top[side]) / gap) + 1;
  for (let n = 0; n < items.length && (L.length > cap(-1) || R.length > cap(1)); n++){
    const [A, Bc] = L.length > cap(-1) ? [L, R] : [R, L]; let bi = 0;
    A.forEach((c, i) => { if (Math.abs(c.X - cx) < Math.abs(A[bi].X - cx)) bi = i; }); Bc.push(A.splice(bi, 1)[0]); }
  for (const [col, side] of [[L, -1], [R, 1]]){
    col.sort((a, b) => a.Y - b.Y);
    let y = -1e9; for (const c of col){ c.py = Math.max(c.Y, y + gap, top[side]); y = c.py; }
    const shift = col.length ? Math.max(0, col.reduce((a, c) => a + c.py - c.Y, 0) / col.length) : 0;
    const room = col.length ? col[0].py - top[side] : 0; for (const c of col) c.py -= Math.min(shift, room);
    for (const c of col){
      c.n = ((window.__ln || (window.__ln = {}))[c.text] || (__ln[c.text] = Object.keys(__ln).length + 1)); const w = u ? hgt*(c.n > 9 ? 1.3 : 1) : c.text.length*fs*.62 + fs*1.5;
      let px = side < 0 ? xmin - 10*k - w/2 : xmax + 10*k + w/2; px = Math.max(vb.x + w/2 + 2*k, Math.min(vb.x + vb.width - w/2 - 2*k, px));
      const ex = px - side*w/2;
      s += `<g class="tag${c.on ? ' on' : ''}" data-n="${c.n}" data-t="${c.text}"><path d="M${f(c.X)} ${f(c.Y)}L${f(ex + side*-4*k)} ${f(c.py)}L${f(ex)} ${f(c.py)}" fill="none" stroke="${INK}" stroke-width="1"/>`
        + `<circle cx="${f(c.X)}" cy="${f(c.Y)}" r="${f(1.4*k)}" fill="${INK}"/>`
        + `<rect x="${f(px - w/2)}" y="${f(c.py - hgt/2)}" width="${f(w)}" height="${f(hgt)}" rx="${f(hgt/2)}" fill="${c.on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
        + `<text x="${f(px)}" y="${f(c.py + fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${u ? c.n : c.text}</text></g>`;
    }
  }
  return s;
}

/* ---------- scene ---------- */
function scene(st, m){
  const FR = facing([1,0,0]), BK = facing([-1,0,0]), LF = facing([0,1,0]), RT = facing([0,-1,0]);
  let s = castShadow([...on(PX(0), OUT), ...on(PX(W), OUT)]);
  let body = '';
  if (BK) body += backFace(m) + ink(pd(on(PX(0), OUT)), 2.2);
  body += extrude(OUT, 0, W, m);
  if (LF) body += sideDecal(m, true);
  if (RT) body += sideDecal(m, false);
  if (FR) body += frontFace(st, m) + ink(pd(on(PX(W), OUT)), 2.2);
  body += hullInk([...on(PX(0), OUT), ...on(PX(W), OUT)], 2.8);
  const k = ease(st.xr || 0);
  if (k > 0) body = xrGhost(body, '', k, OUT, 0, W, m) + `<g opacity="${f(k)}">${mech(st)}</g>`;
  s += BK ? body + cordSvg() : cordSvg() + body;
  if (FR || LF) s += hinges();
  if (FR) s += frontMounted(st, m);
  const B = [0, W + 3, 0, D, 0, H];
  s += vCallouts(k > .6 ? LBL(st) : SURF(st), B);
  return s;
}

/* ---------- behaviour ---------- */
function fresh(){
  const slots = ROWS.split('').map((_, r) => [0,1,2,3,4].map(c => [6, 5, 6, 4, 6, 3, 5, 6, 2, 6, 6, 4, 5, 6, 5, 6, 6, 5, 0, 4, 6, 3, 6, 5, 6][r*5 + c]));
  return { coins:10, credit:0, taken:0, slots, code:'', keyLit:null, keyT:0, keyQ:[], retT:0, msg:null, msgT:0,
    spin:null, fall:null, bin:[], flap:0, flapT:0, take:null, coin:null, pay:[], cup:0, cupT:0, beam:0, tubeN:24, cash:0, t:0 };
}
const vs = Object.assign({ pal:'tomato' }, fresh());
let ui, looping = false;
const active = () => vs.coin != null || vs.spin || vs.fall || vs.take || vs.flap !== vs.flapT || vs.pay.length || vs.cup > 0
  || vs.keyT > 0 || vs.keyQ.length || vs.retT > 0 || vs.msgT > 0 || vs.beam > 0;
function kick(){ if (looping) return; looping = true; ui.animate(dt => { update(dt); const more = active(); if (!more) looping = false; return !!more; }); }
const say = (a, b, s = 2) => { vs.msg = [a, b]; vs.msgT = s; };

function update(dt){
  const st = vs; st.t += dt;
  for (const k of ['keyT', 'retT', 'msgT', 'beam']) if (st[k] > 0) st[k] = Math.max(0, st[k] - dt);
  // queued key presses from the code picker
  if (st.keyQ.length){ st.keyQ[0].at -= dt; if (st.keyQ[0].at <= 0) press(st.keyQ.shift().k); }
  if (st.coin != null){ st.coin += dt/.9; if (st.coin >= 1){ st.coin = null; st.credit += COIN; if (st.tubeN < 54) st.tubeN++; else st.cash++; } }
  if (st.spin){ const sp = st.spin; sp.a = Math.min(1, sp.a + dt/1.8);
    if (sp.a >= .5 && !sp.dropped){ sp.dropped = true; st.slots[sp.r][sp.c]--; st.fall = { r:sp.r, c:sp.c, x:X0S + CPITCH*NT, z:TRAYZ[sp.r], vz:0 }; }
    if (sp.a >= 1) st.spin = null; }
  if (st.fall){ const fl = st.fall; fl.x += (DROPX - fl.x)*Math.min(1, dt*9);
    if (fl.x > 69.5){ fl.vz += 420*dt; fl.z -= fl.vz*dt; }
    if (fl.z < 52 && fl.z + KINDS[fl.r].h > 48) st.beam = .5;
    if (fl.z <= BIN[1]){ st.bin.push({ r:fl.r, c:fl.c }); st.fall = null; say('THANK', 'YOU', 2.2);
      if (st.credit > 0) payout(st.credit / COIN); } }
  for (const py of st.pay.slice()){ py.t += dt/.55; if (py.t >= 1){ st.pay.splice(st.pay.indexOf(py), 1); st.cup++; st.cupT = 2.6; } }
  if (st.cup > 0 && !st.pay.length){ st.cupT -= dt; if (st.cupT <= 0){ st.coins += st.cup; st.cup = 0; } }
  if (st.flap !== st.flapT){ const g = Math.sign(st.flapT - st.flap); st.flap = Math.max(0, Math.min(1, st.flap + g*dt/.3)); }
  if (st.take && st.flap >= 1){ st.take.t += dt/.8; if (st.take.t >= 1){ st.taken += st.take.items.length; st.take = null; st.flapT = 0; } }
}
function payout(n){
  const st = vs; st.credit = 0;
  for (let i = 0; i < n; i++) st.pay.push({ t: -i*.35 });
  st.tubeN = Math.max(0, st.tubeN - n); kick();
}
const busy = () => vs.spin || vs.fall;
function insertCoin(){
  const st = vs;
  if (st.coin != null) return ui.flash('one coin at a time');
  if (!st.coins) return ui.flash(st.cup ? 'your change is in the cup' : 'out of coins');
  if (st.credit >= 400) return ui.flash('credit is full — choose a snack');
  st.coins--; st.coin = 0; kick();
}
function press(k){
  const st = vs; st.keyLit = k; st.keyT = .28; kick();
  if (busy()) return ui.flash('wait — still vending');
  if ('ABCDE'.includes(k)){ st.code = k; return; }
  if ('12345'.includes(k)){
    if (!st.code) { say('LETTER', 'FIRST', 1.6); return; }
    const code = st.code + k; st.code = ''; return vend(code); }
  st.code = ''; say('INVALID', 'CODE', 1.6);
}
function vend(code){
  const st = vs, r = ROWS.indexOf(code[0]), c = +code[1] - 1, price = PRICE[r];
  if (!st.slots[r][c]){ say('SOLD', 'OUT', 2); return ui.flash(`${code} is sold out — choose another`); }
  if (st.credit < price){ say('PRICE', fmt(price), 2.4); return ui.flash(st.credit ? `${code} costs ${fmt(price)} — insert ${fmt(price - st.credit)} more` : `${code} costs ${fmt(price)} — insert coins first`); }
  st.credit -= price; st.spin = { r, c, a:0, dropped:false }; kick();
}
function chooseCode(code){
  const st = vs;
  if (busy() || st.keyQ.length) return ui.flash('wait — still vending');
  st.keyQ = [{ k:code[0], at:0 }, { k:code[1], at:.35 }]; kick();
}
function coinReturn(){
  const st = vs; st.retT = .25; kick();
  if (!st.credit) return ui.flash(st.coin != null ? 'the coin is still going in' : 'no credit to return');
  if (busy()) return ui.flash('wait — still vending');
  payout(st.credit / COIN); say('CHANGE', 'BELOW', 1.6);
}
function takeSnack(){
  const st = vs;
  if (st.take) return;
  if (!st.bin.length) return ui.flash(st.fall || st.spin ? 'wait — it is still dropping' : 'the bin is empty — buy a snack first');
  st.take = { t:0, items: st.bin.slice() }; st.bin = []; st.flapT = 1; kick();
}

ui = mountFigure({
  fig:'21', title:'Vending machine', size:[W + 3, D, H], palette:'tomato', state:vs, turn:'full',
  scene,
  stats: st => [ { label:'Coins', value:String(st.coins) }, { label:'Credit', value:fmt(st.credit) }, { label:'Snacks', value:String(st.taken), small:true } ],
  buttons:[
    { label:'Insert coin', onClick: insertCoin },
    { label:'Type a code', choices: st => { const out = [];
        for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++){ const code = `${ROWS[r]}${c + 1}`;
          out.push({ label:code, disabled: !st.slots[r][c], why:`${code} is sold out`, onClick: () => chooseCode(code) }); }
        return out; } },
    { label:'Coin return', onClick: coinReturn },
    { label:'Take snack', onClick: takeSnack },
  ],
  acts:{ coin: () => insertCoin(), key: (st, el) => press(el.dataset.k), ret: () => coinReturn(), take: () => takeSnack(), cup: () => {} },
  params:(st, q) => {
    if (q.has('credit')) st.credit = +q.get('credit');
    if (q.has('spin')){ const [code, a] = q.get('spin').split(':'); const r = ROWS.indexOf(code[0]), c = +code[1] - 1;
      st.spin = { r, c, a:+a, dropped:+a >= .5 }; if (+a >= .5) st.slots[r][c]--; }
    if (q.has('fall')){ const [code, z] = q.get('fall').split(':'); st.fall = { r:ROWS.indexOf(code[0]), c:+code[1] - 1, x:DROPX, z:+z, vz:0 }; }
    if (q.has('bin')) for (let i = 0; i < +q.get('bin'); i++) st.bin.push({ r:i % 5, c:(i*2) % 5 });
    if (q.has('flap')) st.flap = st.flapT = +q.get('flap');
    if (q.has('cup')) st.cup = +q.get('cup');
    if (q.has('coin')) st.coin = +q.get('coin');
    if (q.has('t')) st.t = +q.get('t');
  },
});
if (active()) kick();
xrMount(() => ui, () => '');
</script></body></html>
