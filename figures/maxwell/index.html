<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maxwell's electromagnetic wave</title><style>.mcap{display:none!important}@media (max-width:560px){.stat .v{font-size:20px!important}.stats{align-items:flex-end}}@media (min-width:561px){.vset{top:4px!important}#stats{top:var(--vset-h,44px)!important}}</style><style>@media (max-width:560px){body > header{display:none}}</style><script>window.FIG_A = () => innerWidth <= 560 ? 1.1 : .75;</script><script>window.LBL_U = () => { if (innerWidth > 560) return 0; const s = document.getElementById("fig"); return s && s.clientWidth && s.viewBox.baseVal.width ? s.viewBox.baseVal.width / s.clientWidth : 0; };</script></head><body>
<script>
/* ============================================================
   Colorfigures core: projection, shapes, shading, ink, labels, page shell.
   A figure page includes this file (scripts/build.py inlines it), then calls mountFigure({...}).
   See SKILL.md for the drawing contract and conventions.
   One fixed view (front-left-top) and one fixed light (from above, behind the viewer's right shoulder: the front is lit,
   the left side is in shade, and cast shadows fall toward the lower left of the screen).
   ============================================================ */

/* ---------- palettes ---------- */
const PALS = {
  mustard: { l:'#f4b829', m:'#d49c1f', d:'#4e4a18' },
  tomato:  { l:'#ef6a4c', m:'#cf5038', d:'#4a2219' },
  mint:    { l:'#93d3b0', m:'#71b693', d:'#1f4034' },
  cobalt:  { l:'#76a0e2', m:'#5a82c6', d:'#1c2948' },
  blush:   { l:'#f3a6bb', m:'#d8869c', d:'#4b2430' },
};
const METAL   = { l:'#eef0f0', m:'#c6ccce', d:'#8f989b' };
const CLEAR   = { l:'#e4f2f4', m:'#c4dfe4', d:'#97b9c0' };
const CERAMIC = { l:'#fbfaf3', m:'#e3e0d2', d:'#bdb8a6' };
const DARK    = { l:'#55504a', m:'#3d3935', d:'#272421' };
const INK = '#231e16';
const SHADOW = '#41538f';

/* ---------- projection (x = depth toward viewer-right, y = toward viewer-left, z = up) ---------- */
const C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6);
let OX = 0, OY = 0;
/* Free orthographic camera (internal names start with CAM_ / cam so they never clash with a figure's own names). YAW turns the viewer around the vertical axis (45° = the classic front-left view),
   PITCH is how far it looks down (35.26° = true isometric). At the defaults P() is exactly the old isometric
   projection, so every figure drawn for it still lines up. Drag the figure to orbit; double-click to reset.
   rotV(n) maps a world direction into the default view's frame, so vis / tone / any "sum of rotV > 0" test keep
   working at every angle: the viewer is always (1,1,1) and the light stays put relative to the viewer. */
let VIEW = 0, RC = [0, 0], RCZ = 0;
const VIEW_NAMES = ['front', 'left side', 'back', 'right side'];
const TURNS = [0, 2];
const YAW0 = 45, PITCH0 = Math.atan(1/Math.SQRT2) * 180/Math.PI, CAM_K = Math.sqrt(1.5);
let YAW = YAW0, PITCH = PITCH0, CAM_R, CAM_U, CAM_V, CAM_D;                       // right, up, toward viewer, screen-down
const camBasis = (yaw, pitch) => { const t = yaw*Math.PI/180, p = pitch*Math.PI/180, ct = Math.cos(t), st = Math.sin(t), cp = Math.cos(p), sp2 = Math.sin(p);
  return { R:[st,-ct,0], U:[-sp2*ct,-sp2*st,cp], V:[cp*ct,cp*st,sp2] }; };
const CAM_B0 = camBasis(YAW0, PITCH0);
// CAM_LIM: how far (deg) the camera may turn either side of the front view; null = all the way round (set per figure)
let CAM_LIM = null;
function setCam(yaw, pitch){ YAW = CAM_LIM == null ? yaw : Math.max(YAW0 - CAM_LIM, Math.min(YAW0 + CAM_LIM, yaw));
  PITCH = CAM_LIM == null ? Math.max(6, Math.min(78, pitch)) : Math.max(15, Math.min(62, pitch)); const b = camBasis(YAW, PITCH); CAM_R = b.R; CAM_U = b.U; CAM_V = b.V; CAM_D = CAM_U.map(v => -v); }
setCam(YAW0, PITCH0);
const camDot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const rotV = n => { const r = camDot(n,CAM_R), u = camDot(n,CAM_U), v = camDot(n,CAM_V); return [0,1,2].map(i => CAM_B0.R[i]*r + CAM_B0.U[i]*u + CAM_B0.V[i]*v); };
// the light's ground direction turns with the viewer's yaw only (shadows always fall toward the lower left of the screen)
const yawTurn = ([x,y]) => { const t = (YAW - YAW0)*Math.PI/180, c = Math.cos(t), s = Math.sin(t); return [x*c - y*s, x*s + y*c]; };
const rotXY = (x,y) => [x, y];                                                // kept for old callers
const P0 = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];                       // raw iso
const P  = (x,y,z) => { const q = [x-RC[0], y-RC[1], z-RCZ];
  return [CAM_K*camDot(q,CAM_R) + (RC[0]-RC[1])*C + OX, CAM_K*camDot(q,CAM_D) + (RC[0]+RC[1])*S - RCZ + OY]; };
const Dv = (x,y,z) => [CAM_K*camDot([x,y,z],CAM_R), CAM_K*camDot([x,y,z],CAM_D)];
// distance toward the viewer: draw parts with smaller depth first
const depthOf = p => camDot(p, CAM_V);
// sort [{at:[x,y,z], svg}] back-to-front for the current camera. A part may also give box:[[x0,y0,z0],[x1,y1,z1]]:
// when two boxes are separated along x, y or z, the one on the viewer's side goes last (a centre point alone gets long
// or wrapping parts wrong: a pole beside a row of keys, a spout reaching past a cup).
const boxMid = b => [0,1,2].map(k => (b[0][k] + b[1][k]) / 2);
const sepOrder = (p, q) => { if (!p.box || !q.box) return 0;
  for (let k = 0; k < 3; k++){ if (p.box[1][k] <= q.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? -1 : 1; if (q.box[1][k] <= p.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? 1 : -1; }
  return 0; };
const byDepth = parts => parts.filter(Boolean).sort((p,q) => sepOrder(p,q) || (depthOf(p.at || boxMid(p.box)) - depthOf(q.at || boxMid(q.box)))).map(p => p.svg).join('');
// the half of a vertical ring that faces the viewer / is turned away, as [from, to] angles in degrees (0 = +x, 90 = +y)
const nearHalf = () => [YAW - 90, YAW + 90], farHalf = () => [YAW + 90, YAW + 270];
// an open container (cup, bin, cone, drum) between two rings: far inner wall, then its contents, then the near outer wall
const openShell = (A, B, colour, contents = '') => loft(A, B, colour, true) + contents + loft(A, B, colour);
const f  = v => v.toFixed(1);
const pd = (pts, close=true) => 'M' + pts.map(p => { const q = P(p[0],p[1],p[2]); return f(q[0])+' '+f(q[1]); }).join('L') + (close ? 'Z' : '');
const sp = pts => 'M' + pts.map(q => f(q[0])+' '+f(q[1])).join('L') + 'Z';

/* ---------- 2D shapes in a plane's (u,v) coords (v up), mapped to 3D by a plane ---------- */
const arcUV  = (cu,cv,r,a0,a1,n=7) => { const o=[]; for (let i=0;i<=n;i++){ const a=(a0+(a1-a0)*i/n)*Math.PI/180; o.push([cu+r*Math.cos(a), cv+r*Math.sin(a)]); } return o; };
const rrUV   = (u0,v0,u1,v1,r,n=7) => r <= 0 ? rectUV(u0,v0,u1,v1) : [...arcUV(u1-r,v0+r,r,-90,0,n), ...arcUV(u1-r,v1-r,r,0,90,n), ...arcUV(u0+r,v1-r,r,90,180,n), ...arcUV(u0+r,v0+r,r,180,270,n)];
const rectUV = (u0,v0,u1,v1) => [[u0,v0],[u1,v0],[u1,v1],[u0,v1]];
const ellUV  = (cu,cv,ru,rv,n=24) => Array.from({length:n}, (_,i) => { const a=i/n*2*Math.PI; return [cu+ru*Math.cos(a), cv+rv*Math.sin(a)]; });
const PX = x => ([u,v]) => [x,u,v];      // front-facing plane x = const   (u = y, v = z)
const PY = y => ([u,v]) => [u,y,v];      // side plane y = const           (u = x, v = z)
const PZ = z => ([u,v]) => [u,v,z];      // horizontal plane z = const     (u = x, v = y)
const on = (plane, uv) => uv.map(plane);

/* ---------- vectors + shading ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm=a=>{ const l=Math.hypot(...a)||1; return a.map(v=>v/l); };
const avg=ps=>ps.reduce((s,p)=>[s[0]+p[0]/ps.length,s[1]+p[1]/ps.length,s[2]+p[2]/ps.length],[0,0,0]);
const vis = n => { const r = rotV(n); return r[0]+r[1]+r[2] > 1e-6; };   // viewer looks from (+1,+1,+1) after the turn
const facing = vis;                                                       // readable alias: is this face toward the viewer?
const SHADOW_K = 0.85, AZ_MIN = 20, AZ_MAX = 160;
// cast shadows are drawn shorter than the shading light implies (0.45 × height instead of 0.85 ×): long shadows of tall
// parts on thin supports (a lamp shade, a fan head) land far from the object and read as separate blobs
const SHADOW_LEN = 0.45;
let L = [0,0,1], SH = [0,0];
function setLight(deg){ const a=deg*Math.PI/180; SH=[SHADOW_K*Math.cos(a), SHADOW_K*Math.sin(a)]; L=norm([-SH[0],-SH[1],1]); }
const LIN = norm([.6,.2,1]);                       // fixed light for interiors / small props
// Three flat tones, but blended across a narrow band at each step, so a face that turns past a threshold while the
// figure rotates fades between tones instead of snapping (at rest almost every face still sits on a pure tone).
const SOFT = .18;
const step3 = (d, hi, lo, m) => { const ss = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a)/(b - a))); return k*k*(3 - 2*k); };
  const a = ss(hi - SOFT, hi + SOFT, d), b = ss(lo - SOFT, lo + SOFT, d);
  return a >= 1 ? m.l : b <= 0 ? m.d : a > 0 ? mix(m.m, m.l, a) : b < 1 ? mix(m.d, m.m, b) : m.m; };
const tone  = (n,m) => step3(dot(rotV(n),L),   -.15, -.45, m);   // exterior, follows the sun
const toneI = (n,m) => step3(dot(rotV(n),LIN),  .6,   .05, m);   // interior / props
const mix = (a,b,t) => '#' + [1,3,5].map(i => Math.round(parseInt(a.substr(i,2),16)*(1-t) + parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0')).join('');
const matOf = hex => ({ l:hex, m:mix(hex,'#000000',.16), d:mix(hex,'#000000',.42) });
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

/* ---------- drawing primitives (all return SVG strings) ---------- */
const ink   = (d,w=1.0) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
const fill  = (d,c,extra='') => `<path d="${d}" fill="${c}" ${extra}/>`;
const face  = (d,c) => `<path d="${d}" fill="${c}" stroke="${c}" stroke-width=".7" stroke-linejoin="round"/>`;
const shape = (pts,c,w=.9) => fill(pd(pts),c) + (w ? ink(pd(pts),w) : '');
const line  = (pts,w=.9) => ink(pd(pts,false),w);
// Loft between two rings of equal length (closed). colour(n) picks each strip's fill; flip = seen from inside.
function loft(A, B, colour, flip=false){
  const n=A.length, cen=avg(A.concat(B)); let s='';
  for (let i=0;i<n;i++){
    const a0=A[i], a1=A[(i+1)%n], b1=B[(i+1)%n], b0=B[i];
    let nr = norm(cross(sub(a1,a0), sub(b0,a0)));
    if (!isFinite(nr[0])) continue;
    if (dot(nr, sub(avg([a0,a1,b1,b0]), cen)) < 0) nr = nr.map(v=>-v);
    if (flip) nr = nr.map(v=>-v);
    if (vis(nr)) s += face(pd([a0,a1,b1,b0]), colour(nr));
  }
  return s;
}
function hull(pts){
  pts = pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[], up=[];
  for (const p of pts){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for (const p of pts.reverse()){ while(up.length>=2 && cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}
// Silhouette ink, weighted by how thick the part is on screen (like a hand inker): the w you pass is the most it gets.
// Thickness = 2 × area / perimeter of the outline (a rod's diameter, about half a box's width), as a share of the
// frame width. A long thin rod, a handle or a knob stays light (~1–1.5); a grinder, kettle or machine body gets the
// heavy ~2.4–2.8. Thin parts stay thin and parts keep air between them.
const hullInk = (pts3, w=1.4) => { const h = hull(pts3.map(p=>P(...p))); let a = 0, per = 0;
  for (let i = 0; i < h.length; i++){ const p = h[i], q = h[(i+1) % h.length]; a += p[0]*q[1] - q[0]*p[1]; per += Math.hypot(q[0]-p[0], q[1]-p[1]); }
  const thick = per ? Math.abs(a) / per / (INK_K * INK_REF_VB) : 0;
  return ink(sp(h), Math.min(w, .9 + 20*thick)); };
// Axis-aligned box: three visible faces, shaded, each outlined. shade = tone (sunlit) or toneI (interior).
function box(x0,y0,z0,x1,y1,z1,m,shade=toneI,w=.9){
  // all six faces, drawn only when they face the viewer (sides first, then top) — correct in every VIEW
  const F = [
    [[0,1,0],  [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]],
    [[1,0,0],  [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]],
    [[0,-1,0], [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]],
    [[-1,0,0], [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],
    [[0,0,1],  [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]] ];
  return F.filter(([n]) => vis(n)).map(([n,q]) => shape(q, shade(n,m), w)).join('');
}
// Rounded-profile extrusion: profile (u=y, v=z) swept along x from x0 to x1. Body of most machines.
function extrude(profileUV, x0, x1, m, shade=tone){ return loft(on(PX(x0),profileUV), on(PX(x1),profileUV), n=>shade(n,m)); }
// Vertical cylinder (axis z) centred (x,y), radius r from z0 to z1, with top cap.
function cyl(x,y,z0,z1,r,m,shade=toneI,w=1.2,n=24){
  const A=on(PZ(z0),ellUV(x,y,r,r,n)), B=on(PZ(z1),ellUV(x,y,r,r,n));
  return loft(A,B,nr=>shade(nr,m)) + fill(pd(B),shade([0,0,1],m)) + hullInk([...A,...B],w) + ink(pd(B),w*.8);
}
// Cylinder lying along x (e.g. a knob or dial sticking out of a front face): centred (y,z), from x0 to x1.
function cylX(x0,x1,y,z,r,m,shade=toneI,w=1.1,n=20){
  const A=on(PX(x0),ellUV(y,z,r,r,n)), B=on(PX(x1),ellUV(y,z,r,r,n));
  // cap on whichever end faces the viewer (the +x end in VIEW 0)
  const capB = vis([1,0,0]), cap = capB ? B : A, cn = capB ? [1,0,0] : [-1,0,0];
  return loft(A,B,nr=>shade(nr,m)) + (vis(cn) ? fill(pd(cap),shade(cn,m)) : '') + hullInk([...A,...B],w) + (vis(cn) ? ink(pd(cap),w*.8) : '');
}
// Cylinder between any two 3D points a and b (a lamp arm, a rod, a pipe at an angle, a handle bar), radius r.
// The end facing the viewer gets a cap. For a tapered part (a cone, a lamp shade) pass r1 for the radius at b.
function rod(a, b, r, m, shade=toneI, w=1, r1=r, n=16){
  const d = norm(sub(b, a)), u = norm(cross(d, Math.abs(d[2]) < .9 ? [0,0,1] : [1,0,0])), v = cross(d, u);
  const ring = (p, rr) => Array.from({length:n}, (_,i) => { const t = i/n*2*Math.PI, c = Math.cos(t)*rr, s2 = Math.sin(t)*rr;
    return [p[0] + u[0]*c + v[0]*s2, p[1] + u[1]*c + v[1]*s2, p[2] + u[2]*c + v[2]*s2]; });
  const A = ring(a, r), B = ring(b, r1), capB = vis(d), cap = capB ? B : A, cn = capB ? d : d.map(x => -x);
  return loft(A, B, nr => shade(nr, m)) + (Math.max(r, r1) > 0 ? fill(pd(cap), shade(cn, m)) + ink(pd(cap), w*.8) : '') + hullInk([...A, ...B], w);
}
// Text lying flat on a front plane x = const, centred at (y,z) baseline; reads left-to-right on screen.
// text sits on a face: if its reading direction comes out mirrored (or edge-on), that face is turned away, so the text is hidden
const txM = (o, U, V) => (U[0]*V[1] - U[1]*V[0]) <= .02 * Math.hypot(...U) * Math.hypot(...V) ? `matrix(0 0 0 0 ${f(o[0])} ${f(o[1])})` : `matrix(${U[0].toFixed(4)} ${U[1].toFixed(4)} ${V[0].toFixed(4)} ${V[1].toFixed(4)} ${f(o[0])} ${f(o[1])})`;
const tx = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(0,-1,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Text on a side plane y = const, centred at (x,z).
const txY = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(1,0,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Cast shadow of a set of 3D points (any outline of the object), pushed along the light onto z = 0.
// the light stays put relative to the viewer, so the shadow is cast in turned coordinates
// z0: the surface it falls on (a board, a counter); clip it to that surface with clipTo(...) if it could spill off.
// clip: the 3D outline of the surface it falls on (e.g. boardTop(...)), so it can't spill over the edge.
const castShadow = (pts3, z0=0, clip=null) => { const k = SHADOW_LEN / SHADOW_K, [sx, sy] = yawTurn(SH);
  const s = fill(sp(hull(pts3.map(([x,y,z]) => P(x+(z-z0)*sx*k, y+(z-z0)*sy*k, z0)))), SHADOW);
  return clip ? clipTo(clip, s) : s; };
// A board for the object to stand on (a tray, a desk top, a counter): a rounded slab from (x0,y0) to (x1,y1), h thick.
// Draw it first; then castShadow(points, h, boardTop(x0,y0,x1,y1,h,r)) so shadows lie on it and stop at its edge.
const BOARD = { l:'#e6e1d4', m:'#cfc8b8', d:'#aaa293' }, WOOD = { l:'#d9a86c', m:'#bf8a4f', d:'#8e6236' };
const boardTop = (x0,y0,x1,y1,h=3,r=5) => on(PZ(h), rrUV(x0,y0,x1,y1,r));
function board(x0,y0,x1,y1,h=3,r=5,m=BOARD){
  const A = on(PZ(0), rrUV(x0,y0,x1,y1,r)), B = boardTop(x0,y0,x1,y1,h,r);
  return loft(A, B, n => toneI(n, m)) + fill(pd(B), m.l) + ink(pd(B), 1) + hullInk([...A, ...B], 1.8);
}
// Group helpers: clickable target, clip to an opening.
const act  = (name, inner, data='') => `<g data-act="${name}" ${data}>${inner}</g>`;
let _clipN = 0;
// Part label (for "how does it work" figures): a cream pill with a leader line to a 3D point on the part.
// dx, dy = where the pill sits, in screen units at the reference zoom (they scale with the figure like stroke widths).
// on = that part is working right now (the pill turns the accent colour). Labels can be hidden with the Labels switch.
function tag(p3, dx, dy, text, on=false){
  // on a phone (LBL_U = drawing units per screen px) the pill is a numbered badge and the names go in a legend under the figure
  const u = window.LBL_U ? LBL_U() : 0, n = ((window.__ln || (window.__ln = {}))[text] || (__ln[text] = Object.keys(__ln).length + 1));
  const k = INK_K, [X,Y] = P(...p3), fs = u ? 10*u : 8.6*k, h = u ? 17*u : fs*1.8, w = u ? h*(n > 9 ? 1.3 : 1) : text.length*fs*.62 + fs*1.5, cx = X + dx*k, cy = Y + dy*k;
  return `<g class="tag${on ? ' on' : ''}" data-n="${n}" data-t="${text}"><path d="M${f(X)} ${f(Y)}L${f(cx)} ${f(cy)}" fill="none" stroke="${INK}" stroke-width="1"/>`
    + `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(1.3*k)}" fill="${INK}"/>`
    + `<rect x="${f(cx-w/2)}" y="${f(cy-h/2)}" width="${f(w)}" height="${f(h)}" rx="${f(h/2)}" fill="${on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
    + `<text x="${f(cx)}" y="${f(cy+fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${u ? n : text}</text></g>`;
}
const clipTo = (pts3, inner) => { const id = 'k' + (++_clipN); return `<clipPath id="${id}"><path d="${pd(pts3)}"/></clipPath><g clip-path="url(#${id})">${inner}</g>`; };

/* ---------- constant on-screen line weight ----------
   Stroke widths are written in model units, and each figure is zoomed to fill the frame, so a small
   object would get fat lines. INK_K rescales every stroke-width (and the wobble/grain filter) so all
   figures match the reference zoom of the booth / vending machine (viewBox ≈ 585 units wide). */

let INK_K = 1;
const inkScale = svg => INK_K === 1 ? svg : svg.replace(/stroke-width="([\d.]+)"/g, (_, w) => `stroke-width="${(+w * INK_K).toFixed(2)}"`);

const filterFor = k => `<filter id="hand" x="-3%" y="-3%" width="106%" height="106%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="${(0.045/k).toFixed(4)}" numOctaves="2" seed="4" result="warp"/>
  <feDisplacementMap id="wob" in="SourceGraphic" in2="warp" scale="${(2.4*k).toFixed(2)}" xChannelSelector="R" yChannelSelector="G" result="wob"/>
  <feTurbulence type="fractalNoise" baseFrequency="${(0.9/k).toFixed(4)}" numOctaves="3" seed="11" result="n1"/>
  <feColorMatrix in="n1" type="matrix" values=".3 0 0 0 .84  .3 0 0 0 .84  .3 0 0 0 .84  0 0 0 0 1" result="grain"/>
  <feTurbulence type="fractalNoise" baseFrequency="${(0.012/k).toFixed(4)}" numOctaves="2" seed="7" result="n2"/>
  <feColorMatrix in="n2" type="matrix" values=".3 0 0 0 .85  .3 0 0 0 .85  .3 0 0 0 .85  0 0 0 0 1" result="blot"/>
  <feBlend in="wob" in2="grain" mode="multiply" result="g1"/><feBlend in="g1" in2="blot" mode="multiply" result="g2"/>
  <feComposite in="g2" in2="wob" operator="in"/></filter>`;

/* The hand-drawn filter's noise never changes, but browsers recompute every feTurbulence each time the drawing changes
   (on phones SVG filters run on the CPU, so this is most of the cost of a frame). bakeNoise renders each noise layer once
   into an image and swaps it in: coarse layers as one small image over the whole view (they are smooth, so scaling up
   is invisible), fine grain as a seamless tile. If anything fails (an old browser), the live filter simply stays. */
function bakeNoise(svg){
  const fl = document.getElementById('hand'); if (!fl || typeof Image === 'undefined') return;
  const NS = 'http://www.w3.org/2000/svg', vb = svg.viewBox.baseVal;
  const x0 = vb.x - vb.width*.35, y0 = vb.y - vb.height*.35, w0 = vb.width*1.7, h0 = vb.height*1.7;
  for (const t of [...fl.querySelectorAll('feTurbulence')]){
    const fq = parseFloat(t.getAttribute('baseFrequency')), oct = +(t.getAttribute('numOctaves') || 1);
    if (!(fq > 0)) continue;
    const fine = fq * Math.max(w0, h0) > 80;
    if (fine) continue;   // fine grain stays live: a repeated tile leaves faint seams on some GPUs
    const rx = fine ? 0 : x0, ry = fine ? 0 : y0, rw = fine ? 48 / fq : w0, rh = fine ? 48 / fq : h0;
    const ppu = fq * (fine ? 7 : 5) * Math.pow(2, Math.max(0, oct - 1) * .5), PW = Math.ceil(rw * ppu), PH = Math.ceil(rh * ppu);
    if (PW * PH > 1200 * 1200) continue;
    const tb = t.cloneNode(); tb.removeAttribute('result'); if (fine) tb.setAttribute('stitchTiles', 'stitch');
    const src = `<svg xmlns="${NS}" width="${PW}" height="${PH}" viewBox="${rx} ${ry} ${rw} ${rh}"><filter id="n" filterUnits="userSpaceOnUse" x="${rx}" y="${ry}" width="${rw}" height="${rh}" color-interpolation-filters="sRGB">${tb.outerHTML}</filter><rect x="${rx}" y="${ry}" width="${rw}" height="${rh}" filter="url(#n)"/></svg>`;
    const img = new Image();
    img.onload = () => { try {
      const c = document.createElement('canvas'); c.width = PW; c.height = PH; const g = c.getContext('2d'); g.drawImage(img, 0, 0);
      // store the noise's colour values fully opaque: the filter reads its colour channels, and an image with
      // see-through pixels would be read premultiplied (darker) by some browsers
      const px = g.getImageData(0, 0, PW, PH); for (let i = 3; i < px.data.length; i += 4) px.data[i] = 255; g.putImageData(px, 0, 0);
      const url = c.toDataURL('image/png'), res = t.getAttribute('result');
      const im = document.createElementNS(NS, 'feImage');
      // a tile must sit inside the filter's region (the drawing's box) or it gets clipped: anchor it at the drawing's
      // centre, snapped to whole tiles so the grain keeps the same phase as the live noise would
      let ox = rx, oy = ry;
      if (fine){ const bb = svg.getElementById ? document.getElementById('art').getBBox() : { x: 0, y: 0, width: 0, height: 0 };
        ox = Math.floor((bb.x + bb.width/2) / rw) * rw; oy = Math.floor((bb.y + bb.height/2) / rh) * rh; }
      for (const [k, v] of [['x', ox], ['y', oy], ['width', rw], ['height', rh], ['preserveAspectRatio', 'none']]) im.setAttribute(k, v);
      im.setAttribute('href', url); im.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', url);
      if (!t.isConnected) return;
      if (fine){ im.setAttribute('result', res + '_tile'); const tl = document.createElementNS(NS, 'feTile'); tl.setAttribute('in', res + '_tile'); tl.setAttribute('result', res); t.replaceWith(im, tl); }
      else { im.setAttribute('result', res); t.replaceWith(im); }
    } catch (e) {} };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(src);
  }
}

  // Script errors and unknown labels are recorded on <html data-errors="…">
  window.__st = st;

  if (q.has('press')) q.get('press').split(',').forEach(item => { const [what, ms] = item.split('@'), [label, choice] = what.split('>');
    setTimeout(() => { const b = [...document.querySelectorAll('.act')].find(b => starts(b, label));

/* ---------- see-through + labels kit (shared; the figure supplies its own working parts) ----------
   xrCallouts(items, B): pills in two columns either side of the object, sorted top to bottom so leaders never cross.
     items: [{ at:[x,y,z], text, on }], B: the object's bounds [x0, x1, y0, y1, z0, z1].
   xrGhost(body, mech, k, OUTp, x0, x1, m): far walls faintly, the working parts, then the case as a ghost over them.
   xrMount(getUI, caption): the See-through / Labels switches (top right), the caption under the figure, label hiding. */
function xrCallouts(items, B){
  const pts = []; for (const x of [B[0], B[1]]) for (const y of [B[2], B[3]]) for (const z of [B[4], B[5]]) pts.push(P(x, y, z));
  const xmin = Math.min(...pts.map(p => p[0])), xmax = Math.max(...pts.map(p => p[0])), cx = (xmin + xmax)/2;
  // on a phone (LBL_U = drawing units per screen px) each label is a numbered badge and the names go in a legend under the figure
  const k = INK_K, u = window.LBL_U ? LBL_U() : 0, fs = u ? 10*u : 8.6*k, hgt = u ? 17*u : fs*1.8, gap = hgt + (u ? 3*u : 3*k);
  const L = [], R = [];
  const svgEl = document.getElementById('fig'), vb = svgEl.viewBox.baseVal, btn = document.getElementById('btns');
  const wMax = u ? hgt*1.3 + 12*k : Math.max(...items.map(it => it.text.length))*fs*.62 + fs*1.5 + 12*k;
  const roomL = xmin - vb.x >= wMax, roomR = vb.x + vb.width - xmax >= wMax;
  for (const it of items){ const [X, Y] = P(...it.at); ((X < cx && roomL) || !roomR ? L : R).push({ ...it, X, Y }); }
  let s = '';
  let top = { [-1]: fs, [1]: fs + 30*k };
  if (btn && svgEl.getScreenCTM()){ const r = btn.getBoundingClientRect(), q = new DOMPoint(r.right, r.bottom + 50).matrixTransform(svgEl.getScreenCTM().inverse());
    if (q.y > 0) top[-1] = q.y + hgt; }
  for (const [col, side] of [[L, -1], [R, 1]]){
    col.sort((a, b) => a.Y - b.Y);
    let y = -1e9; for (const c of col){ c.py = Math.max(c.Y, y + gap, top[side]); y = c.py; }
    const shift = col.length ? Math.max(0, col.reduce((a, c) => a + c.py - c.Y, 0) / col.length) : 0;
    const room = col.length ? col[0].py - top[side] : 0; for (const c of col) c.py -= Math.min(shift, room);
    for (const c of col){
      c.n = ((window.__ln || (window.__ln = {}))[c.text] || (__ln[c.text] = Object.keys(__ln).length + 1)); const w = u ? hgt*(c.n > 9 ? 1.3 : 1) : c.text.length*fs*.62 + fs*1.5;
      let px = side < 0 ? xmin - 10*k - w/2 : xmax + 10*k + w/2; px = Math.max(vb.x + w/2 + 2*k, Math.min(vb.x + vb.width - w/2 - 2*k, px));
      const ex = px - side*w/2;
      s += `<g class="tag${c.on ? ' on' : ''}" data-n="${c.n}" data-t="${c.text}"><path d="M${f(c.X)} ${f(c.Y)}L${f(ex + side*-4*k)} ${f(c.py)}L${f(ex)} ${f(c.py)}" fill="none" stroke="${INK}" stroke-width="1"/>`
        + `<circle cx="${f(c.X)}" cy="${f(c.Y)}" r="${f(1.4*k)}" fill="${INK}"/>`
        + `<rect x="${f(px - w/2)}" y="${f(c.py - hgt/2)}" width="${f(w)}" height="${f(hgt)}" rx="${f(hgt/2)}" fill="${c.on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
        + `<text x="${f(px)}" y="${f(c.py + fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${u ? c.n : c.text}</text></g>`;
    }
  }
  return s;
}
function xrGhost(body, mech, k, OUTp, x0, x1, m){
  const fF = facing([1,0,0]), fB = facing([-1,0,0]);
  const far = `<g opacity="${f(.5*k)}">` + loft(on(PX(x0), OUTp), on(PX(x1), OUTp), n => mix(toneI(n.map(v => -v), m), '#f2efe7', .55), true)
    + (fF ? fill(pd(on(PX(x0), OUTp)), mix(m.d, '#f2efe7', .5)) : '') + (fB ? fill(pd(on(PX(x1), OUTp)), mix(m.d, '#f2efe7', .5)) : '') + `</g>`;
  return far + mech + `<g opacity="${f(1 - .8*k)}">${body}</g>` + `<g opacity="${f(.6*k)}">` + hullInk([...on(PX(x0), OUTp), ...on(PX(x1), OUTp)], 2.8) + `</g>`;
}
function xrMount(getUI, caption, opt = {}){   // opt.labelsOnly: only the Labels switch (the insides are on show already)
  const ui = getUI(), q = new URLSearchParams(location.search), html = document.documentElement;
  if (q.get('labels') !== '1') html.classList.add('nolabels');
  if (ui.st.xr == null){ ui.st.xr = 0; ui.st.xrT = 0; }
  if (q.get('xr') === '1') ui.st.xr = ui.st.xrT = 1;
  const old = document.getElementById('lblctl'); if (old) old.style.display = 'none';
  const vset = document.createElement('div'); vset.className = 'vset';
  vset.innerHTML = '<div class="vrow">' + (opt.labelsOnly ? '' : '<button class="act" id="xrb" aria-pressed="false">See-through</button>') + '<button class="act" id="lblb" aria-pressed="false">Labels</button></div>';
  document.querySelector('.stage').appendChild(vset);
  // pages with a stats panel in the top right: the switches go just under it
  const place = () => { const sp = document.getElementById('stats'); vset.style.top = sp ? (sp.offsetTop + sp.offsetHeight + 10) + 'px' : ''; };
  place(); new ResizeObserver(place).observe(document.getElementById('stats') || vset);
  const xrb = document.getElementById('xrb'), lblb = document.getElementById('lblb');
  const sync = () => { if (xrb) xrb.setAttribute('aria-pressed', !!getUI().st.xrT); lblb.setAttribute('aria-pressed', !html.classList.contains('nolabels')); };
  if (xrb) xrb.onclick = () => { const u = getUI(), st = u.st; st.xr = st.xr || 0; st.xrT = st.xrT ? 0 : 1; sync();
    u.animate(dt => { const g = Math.sign(st.xrT - st.xr); st.xr = Math.min(1, Math.max(0, st.xr + g*dt/.7)); return st.xr !== st.xrT; }); };
  lblb.onclick = () => { html.classList.toggle('nolabels'); sync(); };
  sync();
  const cap = document.createElement('p'); cap.className = 'mcap'; document.querySelector('.stage').after(cap);
  const css = document.createElement('style');
  css.textContent = '.vset{position:absolute;top:4px;right:0;z-index:2}.vrow{display:flex;gap:6px}.vset .act[aria-pressed=true]{background:var(--ink);color:var(--paper)}'
    + 'html.nolabels #fig .tag{display:none}.mcap{width:100%;max-width:760px;min-height:3em;margin:0 0 14px;font-size:12.5px;line-height:1.5;text-align:center;transition:opacity .3s}'
    + '@media (max-width:560px){.vset{position:static;margin:4px 0}}';
  document.head.appendChild(css);
  const r0 = ui.render; ui.render = () => { r0(); const st = getUI().st; cap.style.opacity = st.xr > .5 ? 1 : 0; cap.textContent = caption(st); };
  ui.render();
}
// same, for a body lofted between two horizontal rings A (bottom) and B (top)
function xrGhostRings(body, mech, k, A, B, m){
  const far = `<g opacity="${f(.5*k)}">` + loft(A, B, n => mix(toneI(n.map(v => -v), m), '#f2efe7', .55), true) + fill(pd(A), mix(m.d, '#f2efe7', .5)) + `</g>`;
  return far + mech + `<g opacity="${f(1 - .8*k)}">${body}</g>` + `<g opacity="${f(.6*k)}">` + hullInk([...A, ...B], 2.8) + `</g>`;
}
// generic see-through for any figure: the whole drawing fades back and the inside parts show over it.
//   opts: { mech(st, k) -> svg, inside(st) -> label items, surface(st) -> label items (optional), B: bounds, getSt() }
// washer-style ghost for an object without a single box case: its inside parts first, then the object pale over them
const xrUnder = (svg, mech, k) => `<g opacity="${f(k)}">${mech}</g><g opacity="${f(1 - .62*k)}">${svg}</g>`;
function xrWrap(sceneFn, opts){
  return function(){
    let s = sceneFn.apply(this, arguments);
    const st = opts.getSt(), k = ease(st.xr || 0);
    if (k > 0 && opts.under) s = xrUnder(s, opts.mech(st, k), k);   // the whole drawing is the object
    else if (k > 0 && !opts.inline) s = `<g opacity="${f(1 - .5*k)}">${s}</g><g opacity="${f(k)}">${opts.mech(st, k)}</g>`;   // inline: the figure ghosts its own case
    const items = k > .6 ? opts.inside(st) : opts.surface ? opts.surface(st) : [];
    return s + (items.length ? xrCallouts(items, opts.B) : '');
  };
}

/* ---------- game keypad: mountKeypad({ rows, hub:[col,row], action:'DROP', keys:[{ key:'ArrowLeft', glyph:'\u25c0', name, at:[col,row] }] })
   An inked pad under the buttons that sends the same keyboard events as the arrows and space (set window.GAME_KEYS = true
   so the arrows play instead of turning the camera). ---------- */
function mountKeypad(spec){
  const host = document.getElementById('btns'); if (!host) return;
  const css = document.createElement('style');
  css.textContent = `.kpad{display:flex;align-items:center;gap:16px;margin-top:6px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:14px;
      background:var(--paper);box-shadow:0 3px 0 var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
    .kpad .dp{display:grid;grid-template-columns:repeat(3,34px);grid-template-rows:repeat(var(--rows),34px);gap:3px}
    .kpad .k{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:34px;height:34px;cursor:pointer;
      background:#fbf7ea;border:1.5px solid var(--ink);border-radius:7px;box-shadow:0 3px 0 var(--ink);color:var(--ink);font:700 13px ui-monospace,Menlo,monospace;
      transition:transform .05s,box-shadow .05s,background .05s}
    .kpad .hub{width:34px;height:34px;display:flex;align-items:center;justify-content:center}
    .kpad .hub i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink);background:#e6e0d1}
    .kpad .go{all:unset;box-sizing:border-box;width:62px;height:62px;border-radius:50%;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:#e2483d;border:1.5px solid var(--ink);box-shadow:0 4px 0 var(--ink),inset 0 -5px 0 rgba(0,0,0,.18);color:#fff;font:800 12px ui-monospace,Menlo,monospace;letter-spacing:.06em;
      transition:transform .05s,box-shadow .05s}
    .kpad .go small{font:700 8px ui-monospace,Menlo,monospace;opacity:.85;letter-spacing:.08em;margin-top:2px}
    .kpad .down{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
    .kpad .k.down{background:var(--accent,#f4b829)}
    .kpad .go.down{transform:translateY(3px);box-shadow:0 1px 0 var(--ink),inset 0 -3px 0 rgba(0,0,0,.18)}
    @media (max-width:560px){.kpad{gap:22px;padding:10px 16px}.kpad .dp{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(var(--rows),44px)}
      .kpad .k,.kpad .hub{width:44px;height:44px;font-size:15px}.kpad .go{width:74px;height:74px}}`;
  document.head.appendChild(css);
  const pad = document.createElement('div'); pad.className = 'kpad'; pad.setAttribute('role', 'group'); pad.setAttribute('aria-label', 'Keypad');
  const dp = document.createElement('div'); dp.className = 'dp'; dp.style.setProperty('--rows', spec.rows);
  const els = {};
  for (const k of spec.keys){
    const b = document.createElement('button'); b.className = 'k'; b.textContent = k.glyph; b.setAttribute('aria-label', k.name);
    b.style.gridColumn = k.at[0] + 1; b.style.gridRow = k.at[1] + 1; dp.appendChild(b); els[k.key] = b; }
  if (spec.hub){ const h = document.createElement('div'); h.className = 'hub'; h.innerHTML = '<i></i>'; h.style.gridColumn = spec.hub[0] + 1; h.style.gridRow = spec.hub[1] + 1; dp.appendChild(h); }
  const go = document.createElement('button'); go.className = 'go'; go.innerHTML = `${spec.action}<small>SPACE</small>`; go.setAttribute('aria-label', spec.action);
  els[' '] = go;
  pad.append(dp, go); host.appendChild(pad);
  const send = (type, key) => dispatchEvent(new KeyboardEvent(type, { key, bubbles: true }));
  for (const [key, el] of Object.entries(els)){
    let held = null;
    el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (held != null) return; held = e.pointerId;
      try { el.setPointerCapture(e.pointerId); } catch (_) {} send('keydown', key); });
    const release = e => { if (held == null || (e && e.pointerId !== held)) return; held = null; send('keyup', key); };
    el.addEventListener('pointerup', release); el.addEventListener('pointercancel', release); el.addEventListener('lostpointercapture', release);
    el.addEventListener('click', e => e.preventDefault());
    el.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); send('keydown', key); setTimeout(() => send('keyup', key), 120); } });
  }
  // space belongs to the game: a button that still has the focus from a click must not be pressed by it too
  addEventListener('keydown', e => { if (e.key === ' ' && e.target && e.target.closest && e.target.closest('button')) e.preventDefault(); }, true);
  addEventListener('keyup', e => { if (e.key === ' ' && e.target && e.target.closest && e.target.closest('button')) e.preventDefault(); }, true);
  // light the keys for real key presses too (and for the pad's own, which arrive the same way)
  addEventListener('keydown', e => { const el = els[e.key]; if (el) el.classList.add('down'); });
  addEventListener('keyup', e => { const el = els[e.key]; if (el) el.classList.remove('down'); });
  addEventListener('blur', () => Object.values(els).forEach(el => el.classList.remove('down')));
}

<script>
/* ---------- Truth first: sending a wave across a bench (Hertz, 1888) ----------
   1. The RF oscillator makes an alternating voltage: a transistor keeps an LC tank (a small coil and a tuning
      capacitor) ringing at the frequency on the dial; a power amplifier on a heat sink sends it out of the output
      socket into 50 ohm coax.
   2. The coax runs along the stand and the boom to the transmitting dipole's feed block: its centre conductor to the
      top rod, its braid (through a ferrite balun) to the bottom rod. The voltage pushes the free electrons of both
      rods up and down together: an alternating current, biggest at the feed and zero at the tips, where charge piles
      up, + and - in turn.
   3. The changing current makes a changing magnetic field, the changing charge a changing electric field, and each
      changing field makes the other (Maxwell: curl E = -dB/dt, curl B = mu0 eps0 dE/dt). The pair breaks away and
      travels at c = 1/sqrt(mu0 eps0) = 3.0e8 m/s. E is vertical (along the rods), B horizontal, both at right angles
      to the direction of travel and in step. It is strongest broadside to the rods (the bench's level), none straight
      up, so the crests spread as rings in the level plane.
   4. Wavelength = c / f: 150 MHz 2 m, 600 MHz 50 cm, 2.4 GHz 12.5 cm, 30 THz infrared 10 um, light 450-730 THz
      666-411 nm. The rods are cut for 600 MHz: 2 x 10.5 cm + the 3.2 cm feed block = 24 cm, about half a wavelength.
   5. A metal sheet at the far end (Hertz used a zinc sheet) forces E to zero on its surface, so the wave reflects,
      upside down. Going out and coming back add up to a standing wave: E nodes every half wavelength from the sheet,
      antinodes half way between (B has its antinodes at E's nodes).
   6. The receiving dipole rides a carriage along a rail with a scale. The E field pushes its electrons along the rods;
      that current runs through a small lamp's filament across the feed gap and heats it (power goes as E squared).
      At a node there is no E: dark. At an antinode it is brightest. Off tune (150 MHz, 2.4 GHz) it glows weakly.
      Infrared and light are far too fast for any circuit or 21 cm rod: atoms make and absorb light, so the lamp
      stays dark (the figure draws those waves as if an oscillator could make them, stretched to be seen).
   7. All drawn in slow motion: the real wave crosses the 1.4 m bench in under 5 ns.
   Parts (each held by another):
   BOARD       wooden baseboard
   OSCILLATOR  case . front panel . frequency display (module behind) . tuning dial on a potentiometer . power button .
               LED . output socket and the coax plug . circuit board on standoffs . oscillator transistor . tank coil .
               tuning capacitor . power amplifier . heat sink . mains transformer . mains inlet and cord off the board
   CABLE       coax: plug, along the board, over the stand base, up the stand rod, under the boom, into the feed block
   TRANSMITTER base disc . stand rod . clamp boss . boom (insulating) . feed block . balun . top and bottom rods
   RECEIVER    rail with a scale and end stops . carriage with a thumb screw . stand rod . clamp boss . boom . feed block .
               lead wires . lamp holder . bulb . filament . rods
   REFLECTOR   aluminium sheet . two slotted feet
   SPECTRUM    a sloping strip along the front edge: radio to X-ray on a log scale, the visible rainbow, a red pointer
   OVERLAYS    E arrows (red, vertical) . B arrows (blue, horizontal) . crests spreading as rings . nodes */

/* ---------- geometry (x = depth, y = along the board, z = up; 1 unit = 1 cm) ---------- */
const BX = 50, BY = 166, BH = 3;                                     // baseboard
const XA = 28, FZ = 38, HL = 10.5, FB = 1.6, RR = .55;               // antenna axis x, feed height, rod length, feed block half height, rod radius
const SX = 19, YT = 140, RY = 10, LEN = YT - RY;                     // stand rods x, transmitter y, reflector face y, path length
const RAIL = [17, 18, BH, 21, 124, 4.6], CARZ = 6.6, YR0 = 22, YR1 = 120;
const OSC = [3, 144, BH, 20, 163, 15];
const REFL = [12, RY - .5, 4.6, 44, RY, 54];
const SPX0 = 41, SPX1 = 48, SPY0 = 26, SPY1 = 122, SPH0 = 1.2, SPH1 = 6;
const VF = 90, AE = 6;                                               // drawn wave front speed (cm/s), arrow length per unit field
const STEELM = { l:'#dfe3e4', m:'#b4bcbf', d:'#7d878b' }, ALUM = { l:'#f3f5f5', m:'#cfd5d7', d:'#9aa4a8' };

const MX_F = [
  { label:'Radio 150 MHz',      band:'Radio',        f:150e6,  lam:2,       lamD:200,  res:.2 },
  { label:'UHF 600 MHz',        band:'Radio (UHF)',  f:600e6,  lam:.5,      lamD:50,   res:1 },
  { label:'Microwave 2.4 GHz',  band:'Microwave',    f:2.4e9,  lam:.125,    lamD:12.5, res:.3 },
  { label:'Infrared 30 THz',    band:'Infrared',     f:30e12,  lam:1e-5,    lamD:7,    res:0 },
  { label:'Red light 450 THz',  band:'Visible red',  f:450e12, lam:6.66e-7, lamD:5,    res:0, glow:'#e8402f' },
  { label:'Green light 560 THz', band:'Visible green', f:560e12, lam:5.35e-7, lamD:4,  res:0, glow:'#3fbf55' },
  { label:'Violet light 730 THz', band:'Visible violet', f:730e12, lam:4.11e-7, lamD:3, res:0, glow:'#8a4fd8' },

  [14.9, 16.5, 'UV', '#c0a8e0'], [16.5, 18, 'X-RAY', '#9ea7b2']];

const mxCorners = b => { const o = []; for (const x of [b[0], b[3]]) for (const y of [b[1], b[4]]) for (const z of [b[2], b[5]]) o.push([x, y, z]); return o; };
const mxStroke = (pts, col, w, extra = '') => { const d = pd(pts, false);
  return `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${f(w + .9)}" stroke-linecap="round" stroke-linejoin="round" ${extra}/><path d="${d}" fill="none" stroke="${col}" stroke-width="${f(w)}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`; };
const mxDot = (p, r, col, w = .5, extra = '') => { const [X, Y] = P(...p); return `<circle cx="${f(X)}" cy="${f(Y)}" r="${(r*CAM_K).toFixed(2)}" fill="${col}" stroke="${INK}" stroke-width="${w}" ${extra}/>`; };
// a cable in short pieces (each with its own box) so it sorts with the solids it passes; core = copper shown in see-through
function mxWire(pts, col, w = .7, seg = 3, core = null, k = 0){
  const q = [pts[0]];
  for (let i = 1; i < pts.length; i++){ const a = pts[i-1], b = pts[i], n = Math.max(1, Math.ceil(Math.hypot(...sub(b, a)) / seg));
    for (let j = 1; j <= n; j++) q.push(mxLerp(a, b, j/n)); }
  const out = [];
  for (let i = 0; i < q.length - 1; i++){ const pp = [q[i], q[i+1]];
    const svg = core && k > 0 ? `<g opacity="${f(1 - .65*k)}">${mxStroke(pp, col, w)}</g><g opacity="${f(k)}">${mxStroke(pp, core, w*.35)}</g>` : mxStroke(pp, col, w);
    out.push({ box: mxBoxOf(pp), svg }); }
  return out; }
const txT = (x, y, z, str, size, col = INK, weight = 700) => `<text transform="${txM(P(x, y, z), Dv(0,-1,0), Dv(1,0,0))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`;
function mxArrow(a, b, col, w = .8){
  const A = P(...a), B2 = P(...b), dx = B2[0] - A[0], dy = B2[1] - A[1], len = Math.hypot(dx, dy);
  if (len < .5) return '';
  const ux = dx/len, uy = dy/len, hl = Math.min(len*.42, 2.6*w), hw = hl*.5, e = [B2[0] - ux*hl*.8, B2[1] - uy*hl*.8];
  const head = `M${f(B2[0])} ${f(B2[1])}L${f(B2[0] - ux*hl - uy*hw)} ${f(B2[1] - uy*hl + ux*hw)}L${f(B2[0] - ux*hl + uy*hw)} ${f(B2[1] - uy*hl - ux*hw)}Z`;
  const ln = `M${f(A[0])} ${f(A[1])}L${f(e[0])} ${f(e[1])}`;
  return `<path d="${ln}" fill="none" stroke="${INK}" stroke-width="${f(w*2 + .5)}" stroke-linecap="round"/><path d="${ln}" fill="none" stroke="${col}" stroke-width="${f(w*1.2)}" stroke-linecap="round"/>`
    + `<path d="${head}" fill="${col}" stroke="${INK}" stroke-width="${f(w*.8)}" stroke-linejoin="round"/>`; }

// byDepth's pair rule is not transitive, so with a few hundred parts a far part can land over a near one: every
// separated pair that overlaps on screen becomes an edge, then the parts go out farthest-first
function mxSort(items){
  items = items.filter(Boolean); const n = items.length, out = Array.from({length:n}, () => []), deg = new Array(n).fill(0);
  const dep = items.map(p => depthOf(p.at || boxMid(p.box))), done = new Array(n).fill(false);
  const R = items.map(p => { if (!p.box) return null; const xs = [], ys = [];
    for (const x of [0, 1]) for (const y of [0, 1]) for (const z of [0, 1]){ const q = P(p.box[x][0], p.box[y][1], p.box[z][2]); xs.push(q[0]); ys.push(q[1]); }
    return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)]; });
  const hit = (a, b) => a && b && a[0] < b[2] && b[0] < a[2] && a[1] < b[3] && b[1] < a[3];
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++){ const o = hit(R[i], R[j]) ? sepOrder(items[i], items[j]) : 0;
    if (o < 0){ out[i].push(j); deg[j]++; } else if (o > 0){ out[j].push(i); deg[i]++; } }
  let svg = '';
  const ready = []; for (let i = 0; i < n; i++) if (!deg[i]) ready.push(i);
  for (let c = 0; c < n; c++){ let best = -1;
    for (let i = 0; i < n; i++) if (!done[i] && (best < 0 || (deg[i] === 0) > (deg[best] === 0) || ((deg[i] === 0) === (deg[best] === 0) && dep[i] < dep[best]))) best = i;
    done[best] = true; svg += items[best].svg; for (const j of out[best]) deg[j]--; }
  return svg; }

/* ---------- physics: a wave sent toward the sheet, reflected upside down, the two added ---------- */
const mxCh = st => MX_F[st.fi];
const mxTd = ch => Math.max(.45, Math.min(2.2, ch.lamD/70));          // drawn period (s): slow motion
// how strongly the oscillator was sending at time te (0 before it started / after it stopped)
const mxEnv = (st, te) => st.tOn == null || te < st.tOn || (st.tOff != null && te >= st.tOff) ? 0 : Math.min(1, (te - st.tOn)/.25);
// E (up) and B (along +x) at distance d from the transmitter, at time st.t + dt
function mxField(st, d, dt = 0){
  const ch = mxCh(st), kk = 2*Math.PI/ch.lamD, w = 2*Math.PI/mxTd(ch), t = st.t + dt;
  const e1 = mxEnv(st, t - d/VF), e2 = mxEnv(st, t - (2*LEN - d)/VF);
  const c1 = e1 ? e1*Math.cos(w*t - kk*d) : 0, c2 = e2 ? e2*Math.cos(w*t - kk*(2*LEN - d)) : 0;
  return [c1 - c2, -c1 - c2]; }
// the lamp's power: the square of the standing wave's amplitude at the receiver, times how well the rods are tuned
function mxLampTarget(st){
  const ch = mxCh(st), d = YT - st.yr, kk = 2*Math.PI/ch.lamD;
  const e1 = mxEnv(st, st.t - d/VF), e2 = mxEnv(st, st.t - (2*LEN - d)/VF);
  return ch.res * Math.max(0, e1*e1 + e2*e2 - 2*e1*e2*Math.cos(2*kk*(LEN - d))) / 4; }
const mxIT = st => { const ch = mxCh(st); return mxEnv(st, st.t) * Math.cos(2*Math.PI*st.t/mxTd(ch)); };
const mxQT = st => { const ch = mxCh(st); return mxEnv(st, st.t) * Math.sin(2*Math.PI*st.t/mxTd(ch)); };
const mxIR = st => mxCh(st).res * mxField(st, YT - st.yr)[0] / 2;
const mxQR = st => mxCh(st).res * mxField(st, YT - st.yr, -mxTd(mxCh(st))/4)[0] / 2;
const mxLF = st => Math.log10(mxCh(st).f);
const mxFmtF = f0 => f0 >= 1e12 ? `${Math.round(f0/1e12)} THz` : f0 >= 1e9 ? `${(f0/1e9).toFixed(1)} GHz` : `${Math.round(f0/1e6)} MHz`;
const mxFmtL = l => l >= 1 ? `${l.toFixed(2)} m` : l >= .01 ? `${(l*100).toFixed(1)} cm` : l >= 1e-6 ? `${Math.round(l*1e6)} µm` : `${Math.round(l*1e9)} nm`;

/* ---------- behaviour ---------- */
let ui, mxLoopOn = false;
const mxBusy = st => st.on || (st.tOn != null && st.tOff != null && st.t - st.tOff < 2*LEN/VF + .6) || st.yr !== st.yrT || st.lamp > .004 || Math.abs(st.lf - mxLF(st)) > .002;
function mxStep(st, dt){
  st.t += dt;
  if (st.yr !== st.yrT){ const dy = st.yrT - st.yr, v = Math.max(6, Math.min(45, Math.abs(dy)*2.5))*dt; st.yr = Math.abs(dy) <= v ? st.yrT : st.yr + Math.sign(dy)*v; }
  st.lamp += (mxLampTarget(st) - st.lamp)*(1 - Math.exp(-dt/.18));
  st.lf += (mxLF(st) - st.lf)*(1 - Math.exp(-dt/.22));
}
function mxRun(){ if (mxLoopOn) return; mxLoopOn = true;
  ui.animate(dt => { const st = ui.st; mxStep(st, dt); if (!mxBusy(st)){ mxLoopOn = false; st.lamp = 0; return false; } return true; }); }
function mxSayLight(st){ if (mxCh(st).res === 0) ui.flash('No circuit oscillates this fast: atoms make light. Drawn as if one could', 2600); }
function mxTransmit(st){
  st.on = !st.on;
  if (st.on){ st.tOn = st.t; st.tOff = null; mxSayLight(st); } else st.tOff = st.t;
  mxRun(); }
function mxSetF(st, i){
  st.fi = i;
  if (st.on){ st.tOn = st.t; st.tOff = null; } else st.tOn = null;   // a fresh wave goes out at the new frequency
  if (st.on) mxSayLight(st);
  mxRun(); }
// nearest node / antinode on the rail at the current wavelength (distance s from the sheet: nodes at n half waves)
function mxSpots(st, node){
  const lam = mxCh(st).lamD, out = [];
  for (let n = 0; n < 200; n++){ const s = (node ? n : n + .5)*lam/2, y = RY + s; if (y > YR1) break; if (y >= YR0) out.push(y); }
  return out; }
function mxMove(st, node){
  if (mxCh(st).lamD < 10) return ui.flash('Nodes of this wave are less than a micron apart');
  const c = mxSpots(st, node).filter(y => Math.abs(y - st.yr) > .5);
  if (!c.length) return ui.flash('No ' + (node ? 'node' : 'antinode') + ' on the rail at this wavelength');
  st.yrT = c.reduce((a, b) => Math.abs(b - st.yr) < Math.abs(a - st.yr) ? b : a);
  if (!st.on) ui.flash('Moved. Transmit to test it');
  mxRun(); }

/* ---------- parts ---------- */
function mxShadows(st){
  const top = boardTop(0, 0, BX, BY, BH, 4);
  const thin = (a, b, r) => [-r, r].flatMap(dx => [-r, r].flatMap(dy => [[a[0] + dx, a[1] + dy, a[2]], [b[0] + dx, b[1] + dy, b[2]]]));
  const stand = (y, zb) => [thin([SX, y, zb], [SX, y, FZ + 2.4], .5), thin([SX, y, FZ], [XA, y, FZ], .5), thin([XA, y, FZ - FB - HL], [XA, y, FZ + FB + HL], .6)];
  const ps = [mxCorners(OSC), mxCorners(REFL), mxCorners([12.5, RY - 4, BH, 16, RY + 3.5, 4.6]), mxCorners([40, RY - 4, BH, 43.5, RY + 3.5, 4.6]),
    on(PZ(BH + .9), ellUV(SX, YT, 3.4, 3.4, 12)), ...stand(YT, BH + .9), mxCorners([16.2, st.yr - 3, BH, 21.8, st.yr + 3, CARZ]), ...stand(st.yr, CARZ),

    put2([14.4, 149.4, 4.6, 16, 153.8, 6.7], mxStroke([[15.2, 149.6, 4.6], hel[0]], COPM.m, .35) + mxStroke(hel, on ? '#f08a3a' : COPM.m, .35) + mxStroke([hel[60], [15.2, 153.6, 4.6]], COPM.m, .35)); }
  put2([14.4, 154.6, 4.6, 16, 156.2, 5.9], cyl(15.2, 155.4, 4.6, 5.9, .8, matOf('#3f62b5'), toneI, .6, 16));

  put2([17.4, 156.8, 4.6, 18, 158.2, 5.4], mxBx([17.4, 156.8, 4.6, 18, 158.2, 5.4], STEELM, .4));
  put2([17.4, 156.3, 5.4, 20, 158.7, 7.8], cylX(17.4, 20, 157.5, 6.6, 1.2, STEELM, toneI, .6, 16));

  pi.push(...mxWire([[12.6, 151.6, 6.2], [13.8, 150.8, 6.2], [14.5, 149.8, 5.9]], '#d8a24a', .25, 1.5));
  pi.push(...mxWire([[18, 147.7, 5], [19, 147.6, 5.7], [19.9, 147.5, 6.4]], '#2b2725', .3, 1.5));
  pi.push(...mxWire([[3.1, 158, 6], [4.4, 158.4, 6], [5.2, 158.8, 6]], '#2b2725', .3, 1.5));

function mxOsc(st, m, k, put){
  const [x0, y0, z0, x1, y1, z1] = OSC; let sv = mxBx(OSC, m, 1.2);
  if (facing([1,0,0])){
    const X = x1 + .03, F = (u0, v0, u1, v1, c, w = .6, dx = 0) => shape(on(PX(X + dx), rectUV(u0, v0, u1, v1)), c, w);
    sv += F(145, 4, 162, 14, PANEL, .8);
    sv += F(153.6, 9.6, 161.4, 13.2, '#1d2a26', .7, .02);
    sv += tx(X + .05, 157.5, 10.8, st.on ? mxFmtF(mxCh(st).f) : '- - -', 1.55, '#8af0ae', 800);
    sv += tx(X + .05, 157.5, 4.6, 'TUNING', .75, CREAM, 800) + tx(X + .05, 147.5, 8.3, 'OUTPUT', .75, CREAM, 800)
      + tx(X + .05, 149.8, 9.9, 'POWER', .75, CREAM, 800) + tx(X + .05, 151.4, 4.6, '50 OHM', .65, CREAM, 700);
    sv += shape(on(PX(X + .04), ellUV(151.4, 12, .45, .45, 12)), st.on ? '#43c25c' : '#2c4a33', .4);
  }
  if (facing([-1,0,0])){ sv += shape(on(PX(x0 - .03), rectUV(156.6, 4.6, 159.4, 7.4)), '#2b2725', .6) + shape(on(PX(x0 - .03), rectUV(147, 9, 153, 13)), '#f3f0e6', .5)
      + `<text transform="${txM(P(x0 - .05, 150, 11.4), Dv(0,1,0), Dv(0,0,-1))}" font-size=".7" fill="${INK}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800">230V 15W</text>`; }
  if (facing([0,0,1])){ let v = ''; for (let y = 148; y <= 159; y += 1.4) v += pd([[6, y, z1 + .02], [12, y, z1 + .02]], false); sv += ink(v, .8);
    sv += txT(16, 153.5, z1 + .03, 'RF OSCILLATOR', 1.1, mix(m.d, '#000000', .2), 800); }
  if (facing([0,1,0])){ let v = ''; for (let x = 6; x <= 17; x += 1.6) v += pd([[x, y1 + .02, 7], [x, y1 + .02, 12]], false); sv += ink(v, .8); }
  put(mxBB(OSC), sv, k > 0 ? mxOscInside(st) : '');

  { const a = (-135 + 270*st.fi/(MX_F.length - 1))*Math.PI/180, KN = { l:'#fbf6e6', m:'#e8dcc0', d:'#bfb08c' };
    let d = cylX(20, 21.8, 157.5, 6.6, 2.1, KN, toneI, 1, 24);
    if (facing([1,0,0])) d += ink(pd([[21.85, 157.5, 6.6], [21.85, 157.5 - 1.6*Math.sin(a), 6.6 + 1.6*Math.cos(a)]], false), 1);

  put([[20, 148.6, 11], [21, 150.6, 13]], act('tx', cylX(20, 21, 149.6, 12, 1, matOf(st.on ? '#e2483d' : '#43c25c'), toneI, .8, 18)));
  put([[20, 146.4, 5.3], [21.2, 148.6, 7.5]], cylX(20, 21.2, 147.5, 6.4, 1.1, BRASSM, toneI, .7, 18));
  put([[21.2, 146.55, 5.45], [23.4, 148.45, 7.35]], cylX(21.2, 23.4, 147.5, 6.4, .95, BLK, toneI, .8, 16));
}

function mxAntenna(st, k, put, items, y, rx){
  const zb = rx ? CARZ : BH + .9;
  if (!rx) put([[SX - 3.4, y - 3.4, BH], [SX + 3.4, y + 3.4, BH + .9]], cyl(SX, y, BH, BH + .9, 3.4, BLK, toneI, 1, 26));
  // stand rod in two pieces either side of the clamp boss, the boss, the insulating boom out to the feed block
  put([[SX - .5, y - .5, zb], [SX + .5, y + .5, FZ - 1]], rod([SX, y, zb], [SX, y, FZ - 1], .5, STEELM, toneI, .8));
  put([[SX - 1.1, y - 1.1, FZ - 1], [SX + 1.1, y + 1.1, FZ + 1]], mxBx([SX - 1.1, y - 1.1, FZ - 1, SX + 1.1, y + 1.1, FZ + 1], BLK, .7));
  put([[SX - .5, y - .5, FZ + 1], [SX + .5, y + .5, FZ + 2.4]], rod([SX, y, FZ + 1], [SX, y, FZ + 2.4], .5, STEELM, toneI, .8));
  put([[SX + 1.1, y - .45, FZ - .45], [XA - 1.1, y + .45, FZ + .45]], rod([SX + 1.1, y, FZ], [XA - 1.1, y, FZ], .45, PVC, toneI, .7));
  // feed block: inside it the coax splits (transmitter) or the lamp's lead wires run (receiver)
  const fb = [XA - 1.1, y - 1.1, FZ - FB, XA + 1.1, y + 1.1, FZ + FB];
  let ins = '';
  if (k > 0){
    if (rx){ const lit = mix('#d08a52', '#ffb02e', Math.min(1, st.lamp*1.5));
      ins = mxStroke([[XA, y, FZ + FB], [XA + .5, y, FZ + .9], [XA + 1.1, y, FZ + .35]], lit, .35) + mxStroke([[XA, y, FZ - FB], [XA + .5, y, FZ - .9], [XA + 1.1, y, FZ - .35]], lit, .35); }
    else ins = cylX(XA - 1.05, XA - .55, y, FZ - 1.05, .5, BLK, toneI, .5, 12)
      + mxStroke([[XA - 1.1, y, FZ - 1.05], [XA - .3, y, FZ - 1.05], [XA - .1, y, FZ - .2], [XA, y, FZ + FB]], COPM.l, .35)
      + mxStroke([[XA - .55, y, FZ - 1.05], [XA - .3, y - .3, FZ - 1.3], [XA, y, FZ - FB]], '#b4bcbf', .35);
  }
  put(mxBB(fb), mxBx(fb, BLK, .8), ins);
  // the two rods; in see-through their free electrons slosh, and charge gathers at the tips
  const I = rx ? mxIR(st) : mxIT(st), q = rx ? mxQR(st) : mxQT(st);
  for (const sg of [1, -1]){
    const a = [XA, y, FZ + sg*FB], b = [XA, y, FZ + sg*(FB + HL)];
    let el = '';
    if (k > 0){
      const lo = sg > 0 ? FZ + FB + .3 : FZ - FB - HL + .3, hi = sg > 0 ? FZ + FB + HL - .3 : FZ - FB - .3;
      for (let i = 0; i < 6; i++){ const u = (i + .5)/6, z = FZ + sg*(FB + HL*u) - 1.1*I*Math.cos(Math.PI/2*u);
        el += mxDot([XA + .1, y, Math.max(lo, Math.min(hi, z))], .38, COL.el, .35); }
      const qq = sg*q;
      if (Math.abs(qq) > .05) el += mxDot(b, 1.4, qq > 0 ? COL.E : COL.B, 0, `opacity="${f(.55*Math.abs(qq))}"`)
        + `<text x="${f(P(...b)[0] + 2.2)}" y="${f(P(...b)[1] + .6)}" font-size="2" font-weight="800" fill="${qq > 0 ? COL.E : COL.B}" font-family="ui-monospace,Menlo,monospace" opacity="${f(Math.min(1, Math.abs(qq)*1.5))}">${qq > 0 ? '+' : '-'}</text>`;
    }
    put([[XA - RR, y - RR, Math.min(a[2], b[2])], [XA + RR, y + RR, Math.max(a[2], b[2])]], rod(a, b, RR, ALUM, toneI, .9), el);
  }
  if (!rx){ put([[XA - 2.1, y - .45, FZ - 1.5], [XA - 1.1, y + .45, FZ - .6]], cylX(XA - 2.1, XA - 1.1, y, FZ - 1.05, .45, BLK, toneI, .6, 12)); return; }
  // receiver: lamp holder on the block's front, the bulb in it, its glow; filament in see-through
  put([[XA + 1.1, y - .8, FZ - .8], [XA + 2.2, y + .8, FZ + .8]], cylX(XA + 1.1, XA + 2.2, y, FZ, .8, BRASSM, toneI, .7, 16));
  { const c = [XA + 3.3, y, FZ], g = st.lamp, [X, Y] = P(...c), r = 1.15*CAM_K;

    if (k > 0){ const fil = []; for (let i = 0; i <= 10; i++) fil.push([XA + 3.3, y - .55 + 1.1*i/10, FZ + .25 + (i % 2 ? .22 : -.22)*(i && i < 10 ? 1 : 0)]);
      const hot = mix('#6a5a4a', '#ff9a1f', Math.min(1, g*2));
      sv += `<g opacity="${f(k)}">` + mxStroke([[XA + 2.2, y - .3, FZ + .3], [XA + 3.3, y - .55, FZ + .25]], '#b4bcbf', .2) + mxStroke([[XA + 2.2, y + .3, FZ - .3], [XA + 3.3, y + .55, FZ + .25]], '#b4bcbf', .2)
        + `<path d="${pd(fil, false)}" fill="none" stroke="${hot}" stroke-width=".8" stroke-linejoin="round"/></g>`; }
    sv += `<path d="${pd([[c[0], y + .55, FZ + .75], [c[0], y + .1, FZ + .95]], false)}" fill="none" stroke="#ffffff" stroke-width=".7" opacity=".7" stroke-linecap="round"/>`;
    items.push({ box: [[XA + 2.15, y - 1.15, FZ - 1.15], [XA + 4.45, y + 1.15, FZ + 1.15]], svg: sv }); }
}

function mxRail(st, put){

function mxReflector(st, put){

const mxSpP = (y, a) => [SPX1 - (SPX1 - SPX0)*a, y, BH + SPH0 + (SPH1 - SPH0)*a];
const mxSpY = lf => SPY1 - 2 - (lf - 6)/12*(SPY1 - SPY0 - 4);
const mxSlopeV = norm([SPX1 - SPX0, 0, -(SPH1 - SPH0)]);
const txS = (y, a, str, size, col = INK) => `<text transform="${txM(P(...mxSpP(y, a)), Dv(0,-1,0), Dv(...mxSlopeV))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".03em">${str}</text>`;
function mxSpectrum(st, put){
  const nS = [SPH1 - SPH0, 0, SPX1 - SPX0], Q = (ya, yb, a0, a1) => [mxSpP(ya, a0), mxSpP(yb, a0), mxSpP(yb, a1), mxSpP(ya, a1)];
  const prof = [[SPX0, BH], [SPX1, BH], [SPX1, BH + SPH0], [SPX0, BH + SPH1]];
  let sv = '';
  if (facing([0,1,0])) sv += shape(prof.map(([x, z]) => [x, SPY1, z]), toneI([0,1,0], SPECM), .8);
  if (facing([0,-1,0])) sv += shape(prof.map(([x, z]) => [x, SPY0, z]), toneI([0,-1,0], SPECM), .8);
  if (facing([1,0,0])) sv += shape([[SPX1, SPY0, BH], [SPX1, SPY1, BH], [SPX1, SPY1, BH + SPH0], [SPX1, SPY0, BH + SPH0]], toneI([1,0,0], SPECM), .8);
  if (facing([-1,0,0])) sv += shape([[SPX0, SPY0, BH], [SPX0, SPY1, BH], [SPX0, SPY1, BH + SPH1], [SPX0, SPY0, BH + SPH1]], toneI([-1,0,0], SPECM), .8);
  if (facing(nS)){
    sv += shape(Q(SPY0, SPY1, 0, 1), toneI(nS, SPECM), .9);
    const a0 = .3, a1 = .74;
    for (const [l0, l1, name, c] of BANDS){ const ya = mxSpY(l0), yb = mxSpY(l1);
      sv += shape(Q(ya, yb, a0, a1), c, .45) + txS((ya + yb)/2, .46, name, name.length > 6 ? 1.15 : 1.4); }
    const v0 = 14.6, v1 = 14.9;
    RAINBOW.forEach((c, i) => { sv += fill(pd(Q(mxSpY(v0 + (v1 - v0)*i/7), mxSpY(v0 + (v1 - v0)*(i + 1)/7), a0, a1)), c); });
    sv += ink(pd(Q(mxSpY(v0), mxSpY(v1), a0, a1)), .45) + txS(mxSpY(14.75), .8, 'LIGHT', 1.1);
    let tk = '';
    for (let l = 6; l <= 18; l++) tk += pd([mxSpP(mxSpY(l), a0 - .04), mxSpP(mxSpY(l), a0)], false);
    sv += ink(tk, .45);
    [[6, '1 MHz'], [9, '1 GHz'], [12, '1 THz'], [15, '1 PHz'], [18, '1 EHz']].forEach(([l, t]) => { sv += txS(mxSpY(l), .1, t, 1.05); });
    // the pointer: a red window over the strip and a tab on its top edge
    const yp = mxSpY(st.lf);
    sv += `<path d="${pd(Q(yp - .45, yp + .45, a0 - .05, a1 + .05))}" fill="#e2483d" fill-opacity=".25" stroke="#e2483d" stroke-width="1.1"/>`
      + shape([mxSpP(yp, a1 + .07), mxSpP(yp - 1.2, .97), mxSpP(yp + 1.2, .97)], '#e2483d', .7);
  }
  sv += hullInk([...prof.map(([x, z]) => [x, SPY0, z]), ...prof.map(([x, z]) => [x, SPY1, z])], 1.6);
  put([[SPX0, SPY0, BH], [SPX1, SPY1, BH + SPH1]], sv);
}

function mxCables(st, k){
  const C0 = '#2b2725';
  return [
    // coax: out of the plug, down to the board, over the stand base, up the rod, under the boom, into the feed block
    ...mxWire([[23.4, 147.5, 6.4], [24.4, 147.5, 6.1], [24.8, 147.3, 4.6], [24.2, 146.4, BH + .4], [21.5, 144.4, BH + .4], [SX + .9, YT + 3.9, BH + .4],
      [SX + .9, YT + 3, BH + 1.25], [SX + .9, YT + .5, BH + 1.25], [SX + .9, YT + .5, FZ - 1.8], [SX + 1.6, YT, FZ - 1.05], [XA - 2.1, YT, FZ - 1.05]], C0, .55, 3, COPM.l, k),
    // mains cord out of the back, over the board's back edge, down to the floor
    ...mxWire([[3, 158, 6], [1.6, 158, 5.6], [.6, 158, BH + .3], [-.5, 158, BH - .2], [-.6, 158.5, .4], [-12, 161, .4]], C0, .55, 3),
  ]; }

/* ---------- the wave: E arrows up/down, B arrows across, the crests as rings, the nodes ---------- */
function mxWave(st, k, items){
  const ch = mxCh(st), lam = ch.lamD, sp = lam >= 24 ? Math.min(4, lam/8) : Math.max(.75, lam/4), wA = lam < 10 ? .5 : .8;
  const smp = [];
  for (let d = 2.6; d <= LEN - .3; d += sp){ const [e, b] = mxField(st, d); smp.push({ y: YT - d, e, b }); }
  let any = false;
  for (let i = 0; i < smp.length; i++){
    const p = smp[i], q = smp[i + 1] || p, inAnt = Math.abs(p.y - st.yr) < 1.4;
    if (Math.abs(p.e) < .01 && Math.abs(q.e) < .01) continue;
    any = true;
    const zE = FZ + AE*p.e, zq = FZ + AE*q.e, xB = XA + AE*p.b, xq = XA + AE*q.b;
    let sE = '', sB = '';
    if (ch.glow) sE += `<path d="${pd([[XA, p.y, FZ], [XA, q.y, FZ]], false)}" stroke="${ch.glow}" stroke-width="7" opacity=".28" stroke-linecap="round"/>`;
    sE += `<path d="${pd([[XA, p.y, FZ], [XA, q.y, FZ]], false)}" stroke="${INK}" stroke-width=".5" stroke-dasharray="1.2 1.2"/>`;
    if (!inAnt) sE += mxArrow([XA, p.y, FZ], [XA, p.y, zE], COL.E, wA);
    sE += `<path d="${pd([[XA, p.y, zE], [XA, q.y, zq]], false)}" fill="none" stroke="${COL.E}" stroke-width="${lam < 10 ? .7 : 1.1}" stroke-linecap="round"/>`;
    if (!inAnt) sB += mxArrow([XA, p.y, FZ], [xB, p.y, FZ], COL.B, wA);
    sB += `<path d="${pd([[xB, p.y, FZ], [xq, q.y, FZ]], false)}" fill="none" stroke="${COL.B}" stroke-width="${lam < 10 ? .7 : 1.1}" stroke-linecap="round"/>`;
    items.push({ box: [[XA - .3, q.y, Math.min(FZ, zE, zq) - .05], [XA + .3, p.y, Math.max(FZ, zE, zq) + .05]], svg: sE });
    items.push({ box: [[Math.min(XA, xB, xq) - .05, q.y, FZ - .3], [Math.max(XA, xB, xq) + .05, p.y, FZ + .3]], svg: sB });
  }
  if (lam < 10) return any;
  // nodes of E, once the reflected wave has come back that far
  for (let n = 1; ; n++){ const s = n*lam/2, d = LEN - s; if (d < 3) break;
    if (mxEnv(st, st.t - (2*LEN - d)/VF) > .6) items.push({ box: [[XA - .5, RY + s - .5, FZ - .5], [XA + .5, RY + s + .5, FZ + .5]], svg: mxDot([XA, RY + s, FZ], .55, '#ffffff', .7) }); }
  // crests of the outgoing wave, spreading as rings in the level plane
  const kk = 2*Math.PI/lam, w = 2*Math.PI/mxTd(ch);
  for (let n = Math.ceil((w*st.t - kk*LEN)/(2*Math.PI)); n <= Math.floor((w*st.t - kk*4)/(2*Math.PI)); n++){
    const d = (w*st.t - 2*Math.PI*n)/kk; if (mxEnv(st, st.t - d/VF) < .3) continue;
    const th = Math.min(70, Math.asin(Math.min(1, 19/d))*180/Math.PI), pts = [];
    for (let i = 0; i <= 24; i++){ const a = (-th + 2*th*i/24)*Math.PI/180, y = YT - d*Math.cos(a); if (y > RY + .5) pts.push([XA + d*Math.sin(a), y, FZ]); }
    for (let i = 0; i + 3 < pts.length; i += 3){ const seg = pts.slice(i, i + 4);
      items.push({ box: mxBoxOf(seg), svg: `<path d="${pd(seg, false)}" fill="none" stroke="${COL.crest}" stroke-width="1.4" opacity=".75" stroke-dasharray="2 1.4" stroke-linecap="round"/>` }); }
  }
  return any;
}

/* ---------- scene ---------- */
// xrCallouts from core.js with one change: the reflector fills the right edge, so core's room test sends every
// label left and the one column runs off the bottom; here the labels split by x into two columns, the right one
// under the stats, and a column that would overflow hands its innermost labels to the other side
function mxCallouts(items, B){
  const pts = []; for (const x of [B[0], B[1]]) for (const y of [B[2], B[3]]) for (const z of [B[4], B[5]]) pts.push(P(x, y, z));
  const xmin = Math.min(...pts.map(p => p[0])), xmax = Math.max(...pts.map(p => p[0])), cx = (xmin + xmax)/2;
  const k = INK_K, u = window.LBL_U ? LBL_U() : 0;
  let fs = u ? 10*u : 8.6*k, hgt = u ? 17*u : fs*1.8, gap = hgt + (u ? 3*u : 3*k);
  const svgEl = document.getElementById('fig'), vb = svgEl.viewBox.baseVal, btn = document.getElementById('btns'), sp = document.getElementById('stats');
  const top = { [-1]: fs, [1]: fs + 30*k }, inv = svgEl.getScreenCTM() && svgEl.getScreenCTM().inverse();
  if (btn && inv){ const r = btn.getBoundingClientRect(), q = new DOMPoint(r.right, r.bottom + 50).matrixTransform(inv); if (q.y > 0) top[-1] = q.y + hgt; }
  if (sp && inv && !u){ const r = sp.getBoundingClientRect(), q = new DOMPoint(r.left, r.bottom + 12).matrixTransform(inv);
    if (q.y > 0 && q.y < vb.y + vb.height*.6) top[1] = q.y + hgt/2; }
  // the right column stops above the zoom pill in the bottom right corner (about 46 screen px tall)
  const px2u = inv ? vb.width/svgEl.getBoundingClientRect().width : 1, bot = { [-1]: vb.y + vb.height - hgt, [1]: vb.y + vb.height - (u ? 66 : 46)*px2u - hgt };
  const cap = side => Math.max(0, Math.floor((bot[side] - top[side])/gap) + 1);
  // too many labels for both columns: shrink the pills until they fit (down to 75%)
  for (let i = 0; i < 6 && cap(-1) + cap(1) < items.length; i++){ fs *= .95; hgt *= .95; gap *= .95; }
  const all = items.map(it => { const [X, Y] = P(...it.at); return { ...it, X, Y }; }).sort((a, b) => a.X - b.X);
  const nL = Math.max(Math.min(all.filter(c => c.X < cx).length, cap(-1)), all.length - cap(1));
  const L = all.slice(0, nL), R = all.slice(nL);
  let s = '';
  for (const [col, side] of [[L, -1], [R, 1]]){
    col.sort((a, b) => a.Y - b.Y);
    let y = -1e9; for (const c of col){ c.py = Math.max(c.Y, y + gap, top[side]); y = c.py; }
    const over = col.length ? Math.max(0, col[col.length - 1].py - bot[side]) : 0, room = col.length ? col[0].py - top[side] : 0;
    for (const c of col) c.py -= Math.min(over, room);
    for (const c of col){
      c.n = ((window.__ln || (window.__ln = {}))[c.text] || (__ln[c.text] = Object.keys(__ln).length + 1)); const w = u ? hgt*(c.n > 9 ? 1.3 : 1) : c.text.length*fs*.62 + fs*1.5;
      let px = side < 0 ? xmin - 10*k - w/2 : xmax + 10*k + w/2; px = Math.max(vb.x + w/2 + 2*k, Math.min(vb.x + vb.width - w/2 - 2*k, px));
      const ex = px - side*w/2;
      s += `<g class="tag${c.on ? ' on' : ''}" data-n="${c.n}" data-t="${c.text}"><path d="M${f(c.X)} ${f(c.Y)}L${f(ex + side*-4*k)} ${f(c.py)}L${f(ex)} ${f(c.py)}" fill="none" stroke="${INK}" stroke-width="1"/>`
        + `<circle cx="${f(c.X)}" cy="${f(c.Y)}" r="${f(1.4*k)}" fill="${INK}"/>`
        + `<rect x="${f(px - w/2)}" y="${f(c.py - hgt/2)}" width="${f(w)}" height="${f(hgt)}" rx="${f(hgt/2)}" fill="${c.on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
        + `<text x="${f(px)}" y="${f(c.py + fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${u ? c.n : c.text}</text></g>`;
    }
  }
  return s;
}

function scene(st, m){
  const k = ease(st.xr || 0), items = [];
  const put = (b, svg, inside = '') => items.push({ box: b, svg: k > 0 && inside ? `<g opacity="${f(1 - .8*k)}">${svg}</g><g opacity="${f(k)}">${inside}</g>` : svg });
  let s = castShadow(mxCorners([0, 0, 0, BX, BY, BH]));
  s += board(0, 0, BX, BY, BH, 4, WOOD) + mxShadows(st);
  mxOsc(st, m, k, put);
  mxAntenna(st, k, put, items, YT, false);
  mxAntenna(st, k, put, items, st.yr, true);
  mxRail(st, put);
  mxReflector(st, put);
  mxSpectrum(st, put);
  items.push(...mxCables(st, k));
  const wave = mxWave(st, k, items);
  s += mxSort(items);

  // ---- labels
  const B = [0, BX, 0, BY, 0, 54], on = st.on, lit = st.lamp > .03, ch = mxCh(st), y = st.yr, dl = Math.min(LEN - 4, 40);

  if (wave){ const yE = YT - dl, [e, b] = mxField(st, dl);

  if (k > .6){
    lbl.push(
      { at: [20, 162, 15], text: 'RF OSCILLATOR', on },
      { at: [20, 160, 12.5], text: 'FREQUENCY DISPLAY', on },
      { at: [21.8, 157.5, 8.7], text: 'TUNING DIAL', on: false },
      { at: [21, 149.6, 13], text: 'POWER BUTTON', on },
      { at: [21.2, 147.5, 7.5], text: 'OUTPUT SOCKET', on },
      { at: [4.5, 161.5, 4.6], text: 'CIRCUIT BOARD', on: false },
      { at: [12.6, 151.2, 6.2], text: 'OSCILLATOR TRANSISTOR', on },
      { at: [15.2, 151.6, 6.6], text: 'TANK COIL', on },
      { at: [15.2, 155.4, 5.9], text: 'TUNING CAPACITOR', on },
      { at: [17.2, 146.4, 5], text: 'POWER AMPLIFIER', on },
      { at: [17.2, 148, 8.2], text: 'HEAT SINK', on: false },
      { at: [7, 160, 9], text: 'TRANSFORMER', on: false },
      { at: [SX + .9, YT + .5, 22], text: 'COAX CABLE', on },
      { at: [SX + 1.6, YT + 3.4, BH + .9], text: 'STAND BASE', on: false },
      { at: [SX, YT + .5, 14], text: 'STAND ROD', on: false },
      { at: [(SX + XA)/2, YT, FZ + .45], text: 'INSULATING BOOM', on: false },
      { at: [XA - .8, YT, FZ - 1.05], text: 'BALUN', on },
      { at: [XA, YT, FZ + FB + HL], text: 'TRANSMITTING DIPOLE', on },
      { at: [XA, YT, FZ - FB - HL*.6], text: 'FREE ELECTRONS', on },
      { at: [XA + 1.1, YT - 1.1, FZ - FB], text: 'FEED BLOCK', on: false },
      { at: [XA, y, FZ + FB + HL], text: 'RECEIVING DIPOLE', on: lit },
      { at: [XA + 3.3, y, FZ + 1.15], text: 'LAMP', on: lit },
      { at: [XA + 3.3, y + .4, FZ + .25], text: 'FILAMENT', on: lit },
      { at: [XA + 1.6, y, FZ - .8], text: 'LAMP HOLDER', on: false },
      { at: [XA + .6, y, FZ - 1], text: 'LEAD WIRES', on: lit },
      { at: [21.8, y + 2, 5.6], text: 'CARRIAGE', on: st.yr !== st.yrT },
      { at: [21, RAIL[1] + 8, 4.6], text: 'RAIL AND SCALE', on: st.yr !== st.yrT },
      { at: [28, RY, 52], text: 'METAL REFLECTOR', on: wave },
      { at: [SPX1, SPY0 + 6, BH + SPH0], text: 'SPECTRUM STRIP', on: false },
      { at: mxSpP(mxSpY(st.lf), .97), text: 'POINTER', on: Math.abs(st.lf - mxLF(st)) > .01 },
      { at: [BX, 6, BH], text: 'BASEBOARD', on: false });
    if (wave && lam10(ch)) lbl.push({ at: [XA, YT - 12, FZ], text: 'WAVE CREST', on: true });
    if (wave && lam10(ch)){ const s1 = ch.lamD/2; if (LEN - s1 > 3) lbl.push({ at: [XA, RY + s1, FZ - .5], text: 'NODE', on: true }); }
    s += mxCallouts(lbl, B);
  } else if (k === 0){
    s += mxCallouts([...lbl,
      { at: [20, 162, 15], text: 'OSCILLATOR', on },
      { at: [SX + .9, YT + .5, 22], text: 'COAX CABLE', on },
      { at: [XA, YT, FZ + FB + HL], text: 'TRANSMITTING DIPOLE', on },

      { at: [SPX1, SPY0 + 6, BH + SPH0], text: 'SPECTRUM STRIP', on: false } ], B);
  }
  return s;
}
const lam10 = ch => ch.lamD >= 10;

ui = mountFigure({
