<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elevator</title></head><body>
<script src="core.js"></script>
<script>
/* Elevator: a three-stop traction lift (machine room on top), its shaft cut open on the left side.
   1 unit = 5 cm. x = depth (landing doors on the front face x = 48), y = width (+y = the cut-open side), z = up.

   How it really works (where everything is after each step):
   1. Someone presses a floor button (a hall call button at a landing, or the button for that floor): the controller
      in the machine room registers the call and the button lights.
   2. If the doors are open the car door operator closes the car door; the vane on the car door is engaged with the
      landing door, so that landing's door closes with it; the door interlock proves the landing door shut.
   3. The controller lifts the machine brake and runs the motor. The motor turns a worm in the gearbox, the worm turns
      the wheel on the drive sheave shaft, and the sheave drives the hoist ropes by friction in its grooves.
   4. The ropes run car - up over the drive sheave - over the deflector sheave - down to the counterweight (1:1).
      Car goes up, counterweight comes down by the same distance (it weighs the car plus ~45 % of the rated load).
      Car and counterweight both run on their own T-section guide rails, held by guide shoes.
   5. Near the floor the levelling sensor on the car top meets that floor's vane; the car slows, stops level, the
      brake drops and the doors open (car door operator opens car door and, through the vane, the landing door).
   6. Safety: the overspeed governor in the machine room is turned by the governor rope, which is tied to the safety
      linkage on the car and loops round a tension sheave in the pit. If the car runs down too fast (115 % of rated
      speed) the governor's flyweights fly out, its jaw grips the governor rope, the rope stops, the car keeps falling
      for a moment so the rope lifts the safety lever, and the wedges of the safety gear clamp both car rails.
      Resetting: the car is driven up off the wedges. Spring buffers in the pit catch an overrunning car or counterweight.

   Parts list (each held by something; see the code for what):
   SHAFT     back wall . right wall . front wall with three landing openings . ring beams at each floor on the cut side .
             pit floor . machine room slab
   MACHINE   bedplates . gearbox (worm) . drive sheave . outboard bearing . deflector sheave on pedestals . brake drum,
   ROOM      brake shoes, arms, spring, solenoid . coupling . traction motor . encoder . controller . main switch .
             overspeed governor (sheave, flyweights, jaw) . lifting beam . power and control cables
   ROPES     4 hoist ropes . governor rope . travelling cable . junction box . conduit
   CAR       platform . cab (COP, handrail) . car sling: crosshead, stiles, plank . rope hitch with shackle springs .
             guide shoes (4) . safety gear (2) . safety linkage and lever . car door (2 panels) . door header . door
             vane . door operator and its motor . levelling sensor . limit cam . toe guard . car sill
   COUNTERWT frame (uprights, beams) . filler weights . guide shoes . hitch
   RAILS     2 car rails (flange + blade) . 2 counterweight rails . brackets
   LANDINGS  landing doors (2 panels each) . header . door interlock . sill . architrave . hall call buttons .
             floor indicator . floor slabs and columns of the building in front
   PIT       2 car buffers . counterweight buffer . governor tension sheave, arm and weight . pit ladder
   LIMITS    levelling vanes (one per floor) . final limit switches (top, bottom) */

const EW = 48, ED = 52, ET = 4, BX = 60;                     // shaft outer depth (x), width (y), wall thickness; building front
const FL = [24, 84, 144];                                    // landing floor levels: floor to floor 60 = 3 m
const MRZ = 216, MRF = 220, MRR = 266;                       // machine room: slab underside, floor, roof top
const DOOR = [18, 34], DH = 40;                              // door opening (y) and height (2 m)
const CAR = { x0:14, x1:42, y0:10, y1:42, h:45 };
const ROPES = [23, 25, 27, 29];
const SHV = { x:22, z:234, r:6, y0:21, y1:31 }, DEF = { x:12, z:226, r:4, y0:22, y1:30 };
const GOV = { x:39, z:232, r:3 }, TEN = { x:39, z:8, r:3 }, GRY = 45.5;
const CWX = 8;
const U = 20, VMAX = 32, ACC = 20, TRIP = 36.8;              // 20 units a metre: 1.6 m/s rated, 1 m/s², trip at 115 %
const BEAMZ = [18, 78, 138, 198];                            // ring beams on the cut side (bottom z, 6 deep)
// the rope leaves the drive sheave and meets the deflector on their common outer tangent (same angle on both)
const RT = Math.atan2(SHV.z - DEF.z, SHV.x - DEF.x) + Math.acos((SHV.r - DEF.r) / Math.hypot(SHV.x - DEF.x, SHV.z - DEF.z));

const SLABM = { l:'#ebe6da', m:'#d2cbbb', d:'#a9a192' };
const RAILM = { l:'#aab2b5', m:'#7f888c', d:'#4f575b' };
const MACH  = { l:'#9cc0b3', m:'#76998d', d:'#44615a' };
const CWM   = { l:'#77716a', m:'#57524c', d:'#34302c' };
const REDM  = matOf('#e2483d'), HOT = matOf('#ff9a3a');
const ROPEC = '#d6dbdc', CABLEC = '#3a3632';

/* ---------- small helpers ---------- */
const itm = (b, svg) => ({ box: b, svg });
const bI = (x0, y0, z0, x1, y1, z1, m, w = .8) => itm([[x0, y0, z0], [x1, y1, z1]], box(x0, y0, z0, x1, y1, z1, m, toneI, w));
const yOrd = ys => ys.slice().sort((a, b) => (a - b) * (CAM_V[1] >= 0 ? 1 : -1));
const ropeLine = (pts, w = .9, col = ROPEC) => { const d = pd(pts, false);
  return `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${f(w + .7)}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${col}" stroke-width="${f(w)}" stroke-linecap="round" stroke-linejoin="round"/>`; };
// a cable or rope polyline cut into short pieces, so each piece sorts with the solids beside it
const wireItems = (pts, col, w = .9) => { const o = [];
  for (let i = 0; i < pts.length - 1; i++){ const a = pts[i], b = pts[i + 1], r = w/2 + .1;
    o.push(itm([[0,1,2].map(k => Math.min(a[k], b[k]) - r), [0,1,2].map(k => Math.max(a[k], b[k]) + r)], ropeLine([a, b], w, col))); }
  return o; };
// the near half of a horizontal ring (for coil springs)
const nearRing = (x, y, z, r, n = 20) => { const pts = ellUV(x, y, r, r, n).map(([u, v]) => [u, v, z]), vs = pts.map(p => vis([p[0] - x, p[1] - y, 0]));
  const s0 = vs.findIndex((v, i) => v && !vs[(i + n - 1) % n]); if (s0 < 0) return [];
  const o = []; for (let i = 0; i < n; i++){ const j = (s0 + i) % n; if (!vs[j]) break; o.push(pts[j]); } return o; };
// a cut face on the open side (plane y = const): pale with hatching, like a section drawing
function cutY(y, x0, x1, z0, z1, m){
  const q = on(PY(y), rectUV(x0, z0, x1, z1)), hgt = z1 - z0; let h = '';
  for (let t = x0 - hgt; t < x1; t += 2.6) h += pd([[t, y, z0], [t + hgt, y, z1]], false);
  return fill(pd(q), mix(m.l, '#ffffff', .55)) + clipTo(q, `<path d="${h}" fill="none" stroke="${m.d}" stroke-width=".45" opacity=".55"/>`) + ink(pd(q), 1);
}
// topological back-to-front order: only pairs that overlap on screen are compared (separating axis first, then depth)
function elvSort(list){
  const it = list.filter(Boolean), n = it.length;
  for (const p of it){ const b = p.box; let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    for (const x of [b[0][0], b[1][0]]) for (const y of [b[0][1], b[1][1]]) for (const z of [b[0][2], b[1][2]]){ const q = P(x, y, z);
      if (q[0] < x0) x0 = q[0]; if (q[0] > x1) x1 = q[0]; if (q[1] < y0) y0 = q[1]; if (q[1] > y1) y1 = q[1]; }
    p._s = [x0, x1, y0, y1]; p._d = depthOf(boxMid(b)); }
  const out = it.map(() => []), deg = new Array(n).fill(0);
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++){ const a = it[i]._s, b = it[j]._s;
    if (a[1] <= b[0] || b[1] <= a[0] || a[3] <= b[2] || b[3] <= a[2]) continue;
    const s = sepOrder(it[i], it[j]) || (it[i]._d <= it[j]._d ? -1 : 1);
    if (s < 0){ out[i].push(j); deg[j]++; } else { out[j].push(i); deg[i]++; } }
  const done = new Array(n).fill(false), res = [];
  for (let c = 0; c < n; c++){ let best = -1;
    for (let i = 0; i < n; i++) if (!done[i] && deg[i] === 0 && (best < 0 || it[i]._d < it[best]._d)) best = i;
    if (best < 0) for (let i = 0; i < n; i++) if (!done[i] && (best < 0 || deg[i] < deg[best] || (deg[i] === deg[best] && it[i]._d < it[best]._d))) best = i;
    done[best] = true; res.push(it[best].svg); for (const j of out[best]) deg[j]--; }
  return res.join('');
}
const grp = (b, list) => itm(b, elvSort(list));

/* ---------- state helpers ---------- */
const atFloor = st => FL.findIndex(z => Math.abs(st.zc - z) < .3);
const nearest = st => FL.reduce((bi, z, i) => Math.abs(st.zc - z) < Math.abs(st.zc - FL[bi]) ? i : bi, 0);
const cwB = st => 14 + (FL[2] - st.zc);                     // counterweight underside: falls as the car rises
const cabM = st => st.pal === 'mustard' ? PALS.mint : PALS.mustard;

/* ---------- a sheave: drum along y, spokes on the visible end, rope in its grooves where the rim faces us ---------- */
function sheaveSvg(cx, cz, y0, y1, r, ang, m, ys, a0, a1, rw = .8){
  let s = rod([cx, y0, cz], [cx, y1, cz], r, m, toneI, .9, r, 22);
  const cy = vis([0, 1, 0]) ? y1 : vis([0, -1, 0]) ? y0 : null;
  if (cy != null){ const o = cy === y1 ? .06 : -.06;
    for (let i = 0; i < 4; i++){ const a = ang + i*Math.PI/2; s += line([[cx + .25*r*Math.cos(a), cy + o, cz + .25*r*Math.sin(a)], [cx + .8*r*Math.cos(a), cy + o, cz + .8*r*Math.sin(a)]], .6); }
    s += shape(on(PY(cy + o), ellUV(cx, cz, r*.22, r*.22, 12)), m.d, .5); }
  for (const y of yOrd(ys)){ let run = [];
    const flush = () => { if (run.length > 1) s += ropeLine(run, rw); run = []; };
    for (let i = 0; i <= 24; i++){ const a = a0 + (a1 - a0)*i/24, nn = [Math.cos(a), 0, Math.sin(a)];
      if (vis(nn)) run.push([cx + (r + .2)*nn[0], y, cz + (r + .2)*nn[2]]); else flush(); }
    flush(); }
  return s;
}
// vertical rope tails leaving a sheave at angle 0 (front, +x) or PI (back): in front of the drum or behind it
function withTails(drum, cx, cz, r, ys, tails, rw = .8){
  let fr = '', bk = '';
  for (const t of tails){ const x = cx + r*Math.cos(t.a), svg = yOrd(ys).map(y => ropeLine([[x, y, cz], [x, y, t.z1]], rw)).join('');
    if ((Math.cos(t.a) > 0) === (CAM_V[0] > 0)) fr += svg; else bk += svg; }
  return bk + drum + fr;
}
function springSvg(x, y, z0, z1, r){
  let s = cyl(x, y, z0, z1, r, RAILM, toneI, .8, 16);
  for (let z = z0 + 1.1; z < z1 - .4; z += 1.2) s += ink(pd(nearRing(x, y, z, r + .05, 16), false), .5);
  return s;
}

/* ---------- the shell: walls, ring beams, machine room, the building in front ---------- */
function frontWall(st, m){
  const x0 = EW - ET, x1 = EW; let s = '';
  for (const z of FL){
    if (vis([0, 1, 0])) s += face(pd([[x0, DOOR[0], z], [x1, DOOR[0], z], [x1, DOOR[0], z + DH], [x0, DOOR[0], z + DH]]), tone([0, 1, 0], m));
    if (vis([0, -1, 0])) s += face(pd([[x0, DOOR[1], z], [x1, DOOR[1], z], [x1, DOOR[1], z + DH], [x0, DOOR[1], z + DH]]), tone([0, -1, 0], m));
    if (vis([0, 0, 1])) s += face(pd([[x0, DOOR[0], z], [x1, DOOR[0], z], [x1, DOOR[1], z], [x0, DOOR[1], z]]), tone([0, 0, 1], m));
  }
  for (const [n, xx] of [[[1, 0, 0], x1], [[-1, 0, 0], x0]]) if (vis(n)){
    const d = pd(on(PX(xx), rectUV(0, 0, ED, MRZ))) + FL.map(z => pd(on(PX(xx), rectUV(DOOR[0], z, DOOR[1], z + DH)))).join('');
    s += `<path d="${d}" fill="${tone(n, m)}" fill-rule="evenodd"/>` + ink(d, 1.1);
    if (n[0] > 0) for (const z of [FL[1] - 4, FL[2] - 4, 200]) s += line([[xx + .05, 0, z], [xx + .05, 4, z]], .5);
  }
  if (vis([0, 1, 0])) s += cutY(ED, x0, x1, 0, MRZ, m);
  if (vis([0, -1, 0])) s += shape(on(PY(0), rectUV(x0, 0, x1, MRZ)), tone([0, -1, 0], m), 1);
  return itm([[x0, 0, 0], [x1, ED, MRZ]], s + frontDetails(st, m));
}
// on the front face: architraves, floor indicators, hall call buttons, painted floor numbers
function frontDetails(st, m){
  if (!vis([1, 0, 0])) return '';
  const X = EW + .06, cur = nearest(st), mov = st.phase === 'run' || st.phase === 'test' || st.phase === 'reset';
  let s = '';
  FL.forEach((z, i) => {
    const o = on(PX(X), rectUV(DOOR[0] - 1.6, z, DOOR[1] + 1.6, z + DH + 1.6)), h = on(PX(X), rectUV(DOOR[0], z, DOOR[1], z + DH));
    s += `<path d="${pd(o) + pd(h)}" fill="${METAL.l}" fill-rule="evenodd"/>` + ink(pd(o), .8) + ink(pd(h), 1);
    s += shape(on(PX(X), rectUV(21, z + 43, 31, z + 48.5)), '#1d2a26', .8) + tx(X + .05, 26, z + 44.3, String(cur + 1), 4.2, '#8af0ae', 800);
    if (mov && st.dir) { const az = z + 45.7, d = st.dir > 0 ? 1 : -1;
      s += fill(pd([[X + .05, 23.6, az + 1.2*d], [X + .05, 22.4, az - 1.1*d], [X + .05, 24.8, az - 1.1*d]]), '#8af0ae'); }
    s += shape(on(PX(X), rrUV(9, z + 17.5, 13, z + 27.5, 1, 3)), METAL.l, .8);
    const lit = st.calls[i] ? '#ffb02e' : '#efe9dc';
    for (const bz of i < 2 ? [z + 24.6] : []) s += act('call', shape(on(PX(X + .05), ellUV(11, bz, 1.25, 1.25, 14)), lit, .7), `data-f="${i}"`);
    for (const bz of i > 0 ? [z + 20.4] : []) s += act('call', shape(on(PX(X + .05), ellUV(11, bz, 1.25, 1.25, 14)), lit, .7), `data-f="${i}"`);
    s += tx(X + .05, 43.5, z + 27, String(i + 1), 9, mix(m.d, m.l, .25), 800);
  });
  return s;
}
function mrBox(st, m){
  let s = box(0, 0, MRZ, EW, ED, MRR, m, tone, 1.1);
  if (vis([1, 0, 0])){ const X = EW + .06;
    s += shape(on(PX(X), rectUV(36, MRF, 46, MRF + 34)), mix(DARK.l, '#ffffff', .25), 1) + shape(on(PX(X + .05), rectUV(37.5, MRF + 16, 38.5, MRF + 19)), METAL.l, .5);
    s += shape(on(PX(X), rectUV(8, 246, 30, 253)), '#fff4d6', .8) + tx(X + .05, 19, 248.2, 'LIFT ROOM', 3.2, INK, 800);
    s += line([[X, 0, MRF], [X, 36, MRF]], .5) + line([[X, 46, MRF], [X, ED, MRF]], .5); }
  if (vis([0, 1, 0])){ const Y = ED + .06;
    s += shape(on(PY(Y), rectUV(14, 236, 34, 250)), tone([0, 1, 0], DARK), .9);
    for (let z = 238; z < 249; z += 2) s += line([[15, Y + .05, z], [33, Y + .05, z]], .5);
    s += line([[0, Y, MRF], [EW, Y, MRF]], .5); }
  if (vis([-1, 0, 0])){ s += shape(on(PX(-.06), rectUV(18, 238, 34, 248)), tone([-1, 0, 0], DARK), .9);
    for (let z = 240; z < 247; z += 2) s += line([[-.1, 19, z], [-.1, 33, z]], .5); }
  return itm([[0, 0, MRZ], [EW, ED, MRR]], s);
}
function shellItems(st, m){
  const o = [];
  o.push(itm([[ET, ET, -.01], [EW - ET, ED, 0]], shape(on(PZ(0), rectUV(ET, ET, EW - ET, ED)), mix(SLABM.d, '#8a8273', .3), 1)));
  // back wall, right wall (full height), front wall (three openings)
  let bw = box(0, 0, 0, ET, ED, MRZ, m, tone, 1.1); if (vis([0, 1, 0])) bw += cutY(ED, 0, ET, 0, MRZ, m);
  if (vis([-1, 0, 0])) for (const z of [FL[1] - 4, FL[2] - 4, 200]) bw += line([[-.05, 0, z], [-.05, ED, z]], .5);
  o.push(itm([[0, 0, 0], [ET, ED, MRZ]], bw));
  let rw = box(ET, 0, 0, EW - ET, ET, MRZ, m, tone, 1.1);
  if (vis([0, -1, 0])) for (const z of [FL[1] - 4, FL[2] - 4, 200]) rw += line([[ET, -.05, z], [EW - ET, -.05, z]], .5);
  o.push(itm([[ET, 0, 0], [EW - ET, ET, MRZ]], rw));
  o.push(frontWall(st, m));
  // ring beams across the cut side at each floor and at the roof
  for (const z of BEAMZ){ let b = box(ET, ED - ET, z, EW - ET, ED, z + 6, m, tone, 1); if (vis([0, 1, 0])) b += cutY(ED, ET, EW - ET, z, z + 6, m);
    o.push(itm([[ET, ED - ET, z], [EW - ET, ED, z + 6]], b)); }
  o.push(mrBox(st, m));
  return o;
}
// the building in front of the shaft (all of it at x >= EW, so it is wholly in front of or behind the shaft)
function bldgItems(st, m){
  const o = [];
  // the building in front: ground floor, two floor slabs and the roof, on columns
  o.push(itm([[EW, 0, 0], [BX, ED, FL[0]]], box(EW, 0, 0, BX, ED, FL[0], SLABM, tone, 1.1)));
  for (const z of [FL[1], FL[2], 204]) o.push(itm([[EW, 0, z - 4], [BX - 2, ED, z]], box(EW, 0, z - 4, BX - 2, ED, z, SLABM, tone, 1)));
  for (const [z0, z1] of [[FL[0], FL[1] - 4], [FL[1], FL[2] - 4], [FL[2], 200]]) for (const y of [0, ED - 4])
    o.push(itm([[BX - 6, y, z0], [BX - 2, y + 4, z1]], box(BX - 6, y, z0, BX - 2, y + 4, z1, m, tone, 1)));
  return o;
}

/* ---------- inside the shaft (also seen through the cut side) ---------- */
function cabSvg(st, z, k){
  const { x0, x1, y0, y1, h } = CAR, t = 1, z1 = z + h, cm = cabM(st), inC = n => mix(toneI(n, cm), '#ffffff', .45);
  const hole = (xx) => pd(on(PX(xx), rectUV(DOOR[0], z, DOOR[1], z + DH)));
  let s = '';
  // far walls seen from inside, the floor, then what is in the cab
  if (vis([0, 0, 1])) s += shape(on(PZ(z + .05), rectUV(x0 + t, y0 + t, x1 - t, y1 - t)), '#c9b48f', .6);
  if (vis([1, 0, 0])) s += face(pd(on(PX(x0 + t), rectUV(y0 + t, z, y1 - t, z1 - t))), inC([1, 0, 0]));
  if (vis([-1, 0, 0])) s += `<path d="${pd(on(PX(x1 - t), rectUV(y0 + t, z, y1 - t, z1 - t))) + hole(x1 - t)}" fill="${inC([-1, 0, 0])}" fill-rule="evenodd"/>`;
  if (vis([0, 1, 0])) s += face(pd(on(PY(y0 + t), rectUV(x0 + t, z, x1 - t, z1 - t))), inC([0, 1, 0]));
  if (vis([0, -1, 0])) s += face(pd(on(PY(y1 - t), rectUV(x0 + t, z, x1 - t, z1 - t))), inC([0, -1, 0]));
  if (vis([1, 0, 0])) s += rod([x0 + 1.8, y0 + 2, z + 18], [x0 + 1.8, y1 - 2, z + 18], .45, METAL, toneI, .5);
  if (vis([0, 1, 0])){ const Y = y0 + t + .06;
    s += shape(on(PY(Y), rectUV(34, z + 14, 38, z + 30)), METAL.l, .6);
    FL.forEach((_, i) => s += shape(on(PY(Y + .05), ellUV(36, z + 18 + 4*i, .9, .9, 12)), st.calls[i] || (st.phase === 'run' && st.target === i) ? '#ffb02e' : '#efe9dc', .5));
    s += shape(on(PY(Y + .05), rectUV(34.6, z + 27, 37.4, z + 29.2)), '#1d2a26', .4); }
  // outer walls toward us (pale in see-through, so the cab's inside shows)
  let o = '';
  for (const [n, q] of [[[-1, 0, 0], on(PX(x0), rectUV(y0, z, y1, z1))], [[0, 1, 0], on(PY(y1), rectUV(x0, z, x1, z1))],
                        [[0, -1, 0], on(PY(y0), rectUV(x0, z, x1, z1))], [[0, 0, 1], on(PZ(z1), rectUV(x0, y0, x1, y1))]])
    if (vis(n)) o += shape(q, toneI(n, cm), .9);
  if (vis([1, 0, 0])){ const d = pd(on(PX(x1), rectUV(y0, z, y1, z1))) + hole(x1); o += `<path d="${d}" fill="${toneI([1, 0, 0], cm)}" fill-rule="evenodd"/>` + ink(d, .9); }
  return s + (k > 0 ? `<g opacity="${f(1 - .6*k)}">${o}</g>` : o);
}
function shaftItems(st, k){
  const o = [], push = (...a) => o.push(...a), zc = st.zc, cb = cwB(st), d = st.door, here = atFloor(st);
  // ---- car guide rails (flange on the wall / ring beams, blade toward the car) and their brackets
  for (const [fy, by] of [[[ET, ET + 1], [ET + 1, ET + 3]], [[ED - ET - 1, ED - ET], [ED - ET - 3, ED - ET - 1]]]){
    push(bI(26, fy[0], 0, 30, fy[1], MRZ, RAILM, .8), bI(27.2, by[0], 0, 28.8, by[1], MRZ, RAILM, .8));
    for (const z of BEAMZ) for (const x of [23.5, 30]) push(bI(x, fy[0], z + 1, x + 2.5, fy[1] + .4, z + 5, DARK, .6));
  }
  // ---- counterweight rails on brackets from the back wall
  for (const [fy, by] of [[[12, 13], [13, 15.4]], [[39, 40], [36.6, 39]]]){

/* ---------- scene ---------- */
const SHAFT_PTS = (() => { const p = []; for (const x of [0, EW]) for (const y of [0, ED]) for (const z of [0, MRR]) p.push([x, y, z]); return p; })();
const BLDG_PTS = (() => { const p = []; for (const y of [0, ED]) p.push([EW, y, 0], [BX, y, 0], [BX, y, FL[0]], [BX - 2, y, 204], [EW, y, 204]); return p; })();
// the See-through / Labels switches sit over the top right of the drawing: blank slots keep the right column below them
function padTags(B){
  const els = [document.querySelector('.vset'), document.getElementById('stats')].filter(Boolean), svgEl = document.getElementById('fig');
  if (!els.length || !svgEl.getScreenCTM() || (window.LBL_U && LBL_U())) return [];
  const q = new DOMPoint(0, Math.max(...els.map(e => e.getBoundingClientRect().bottom)) + 6).matrixTransform(svgEl.getScreenCTM().inverse());
  const fs = 8.6*INK_K, gap = fs*1.8 + 3*INK_K, n = Math.max(0, Math.ceil((q.y - fs - 30*INK_K)/gap));
  let c = null; for (const x of [B[0], B[1]]) for (const y of [B[2], B[3]]){ const X = P(x, y, B[5])[0]; if (!c || X > c[3]) c = [x, y, B[5] + 400, X]; }
  return Array.from({ length: n }, (_, i) => ({ at:[c[0], c[1], c[2] + i], text:'PAD' }));
}
function scene(st, m){
  const k = ease(st.xr || 0), B = [0, EW, 0, ED, 0, MRR];
  let s = castShadow([...SHAFT_PTS, ...BLDG_PTS]);
  const shaft = shaftItems(st, k);
  const sh = elvSort([...shellItems(st, m), ...shaft]) + hullInk(SHAFT_PTS, 2.8), bl = elvSort(bldgItems(st, m)) + hullInk(BLDG_PTS, 2.4);
  const base = CAM_V[0] > 0 ? sh + bl : bl + sh;
  if (k > 0){
    const fd = itm([[EW, 0, 0], [EW + .3, ED, MRZ]], frontDetails(st, m));
    s += `<g opacity="${f(1 - .8*k)}">${base}</g><g opacity="${f(k)}">${elvSort([...shaft, ...machineItems(st), fd])}</g>`;
  } else s += base;
  s += xrCallouts([...(k > .6 ? insideLabels(st) : surfaceLabels(st)), ...padTags(B)], B).replace(/<g class="tag" data-n="\d+" data-t="PAD">.*?<\/g>/g, '');
  return s;
}

/* ---------- behaviour ---------- */
let ui, looping = false;
const busy = st => !['idle', 'stuck'].includes(st.phase);
function kick(){ if (looping) return; looping = true;
  ui.animate(dt => { elUpdate(ui.st, dt); if (!busy(ui.st)) looping = false; return busy(ui.st); }); }
function moveCar(st, dz){
  st.zc += dz; st.shA += dz/SHV.r; st.defA += dz/DEF.r; st.motA += dz/SHV.r*8;
  if (!st.gov){ st.govA -= dz/GOV.r; st.tenA -= dz/TEN.r; }
}
function nextJob(st){
  if (st.after === 'test'){ st.after = null; return startTest(st); }
  if (st.queue.length){ st.target = st.queue.shift(); st.phase = atFloor(st) === st.target ? 'opening' : 'run'; }
  else st.phase = 'idle';
}
function elUpdate(st, dt){
  const ph = st.phase;
  // the car parks with its doors open; it only closes them when there is somewhere to go
  if (ph === 'opening'){ st.door = Math.min(1, st.door + dt/1.1); if (st.door >= 1){ st.calls[atFloor(st)] = 0; st.dwell = 2.6; st.phase = st.queue.length || st.after ? 'open' : 'idle'; } }
  else if (ph === 'open'){ st.dwell -= dt; if (st.dwell <= 0) st.phase = 'closing'; }
  else if (ph === 'closing'){ st.door = Math.max(0, st.door - dt/1.1); if (st.door <= 0) nextJob(st); }
  else if (ph === 'run'){
    st.brake = 0; const goal = FL[st.target], dist = Math.abs(goal - st.zc), dir = Math.sign(goal - st.zc); st.dir = dir;
    st.v = Math.min(VMAX, st.v + ACC*dt, Math.sqrt(2*ACC*dist));
    const stp = Math.min(dist, st.v*dt); moveCar(st, dir*stp);
    if (dist - stp < .02){ moveCar(st, goal - st.zc); st.v = 0; st.dir = 0; st.brake = 1; st.phase = 'opening'; }
  }
  else if (ph === 'test'){
    st.brake = 0; st.dir = -1;
    if (!st.gov){ st.v += 60*dt; if (st.v >= TRIP){ st.v = TRIP; st.gov = 1; st.zGrip = st.zc; ui.flash('1.84 m/s: the governor trips and its jaw grips the governor rope', 2600); } }
    else { st.wedge = Math.min(1, (st.zGrip - st.zc)/2); st.brake = 1; if (st.wedge >= 1) st.v = Math.max(0, st.v - 120*dt); }
    moveCar(st, -st.v*dt);
    if (st.gov && st.wedge >= 1 && st.v <= 0){ st.phase = 'stuck'; st.dir = 0; ui.flash('Safety gear set: its wedges clamp the rails. Press a floor to reset', 3200); }
  }
  else if (ph === 'reset'){
    st.brake = 0; st.gov = 0; st.dir = 1; st.v = 4; moveCar(st, 4*dt); st.wedge = Math.max(0, st.wedge - dt/.75);
    if (st.wedge <= 0){ st.v = 0; st.phase = 'run'; }
  }
}
function callFloor(st, i){
  if (st.phase === 'stuck'){ st.target = i; st.calls[i] = 1; st.phase = 'reset'; ui.flash('Reset: the car is driven up off the safety wedges'); return kick(); }
  const here = atFloor(st) === i;
  if (here && st.phase === 'idle' && st.door >= 1) return ui.flash(`The car is already at floor ${i + 1}`);
  if (here && ['idle', 'open', 'closing', 'opening'].includes(st.phase)){ if (st.phase !== 'opening') st.phase = 'opening'; return kick(); }
  if (st.phase === 'run' && st.target === i) return;
  if (!st.queue.includes(i)) st.queue.push(i); st.calls[i] = 1;
  if (st.phase === 'open' || st.phase === 'idle'){ if (st.door > 0) st.phase = 'closing'; else nextJob(st); }
  kick();
}
function startTest(st){ st.phase = 'test'; st.v = 0; st.gov = 0; st.wedge = 0; st.queue = []; ui.flash('Overspeed test: the car is driven down too fast', 2000); kick(); }
function overspeed(st){
  if (st.phase === 'stuck') return ui.flash('The safety gear is already set: press a floor to reset');
  if (['run', 'test', 'reset'].includes(st.phase)) return ui.flash('Wait for the car to stop at a floor');
  if (nearest(st) === 0) return ui.flash('Send the car up first: the test drives it down');
  if (st.door > 0){ st.after = 'test'; st.queue = []; st.phase = 'closing'; return kick(); }
  startTest(st);
}

ui = mountFigure({
  fig:'E1', title:'Elevator',
  size:[BX, ED, MRR], palette:'tomato', turn:'full',
  state:{ zc: FL[1], v:0, dir:0, phase:'idle', target:1, door:1, dwell:0, queue:[], calls:[0, 0, 0], after:null,
    shA:0, defA:0, govA:0, tenA:0, motA:0, gov:0, wedge:0, zGrip:0, brake:1 },
  scene,
  stats: st => [{ label:'Floor', value: String(nearest(st) + 1) }, { label:'Speed', value: `${(st.v/U).toFixed(2)} m/s`, small:true }],
  buttons:[
    { label:'Floor 1', onClick: st => callFloor(st, 0) },
    { label:'Floor 2', onClick: st => callFloor(st, 1) },
    { label:'Floor 3', onClick: st => callFloor(st, 2) },
    { label:'Overspeed test', onClick: st => overspeed(st) },
  ],
  acts:{ call: (st, el) => callFloor(st, +el.dataset.f) },
  params:(st, q) => {
    if (q.has('floor')) st.zc = FL[Math.max(0, Math.min(2, (+q.get('floor') | 0) - 1))];
    if (q.has('z')) st.zc = +q.get('z');
    if (atFloor(st) < 0 || q.get('door') === '0') st.door = 0;
    if (q.has('v')) st.v = +q.get('v') * U;
    if (q.get('stuck') === '1'){ st.phase = 'stuck'; st.gov = 1; st.wedge = 1; st.door = 0; }
    if (q.has('call')) for (const c of q.get('call')) st.calls[+c - 1] = 1;
  },
});
xrMount(() => ui, st => ({
  idle: 'The car waits at a floor, doors open, with the machine brake on. The counterweight, on the far side of the drive sheave, balances the car plus about half a load.',
  opening: 'The door operator on the car top opens the car door; its vane drags the landing door open with it.',
  open: 'Doors open. The levelling sensor has stopped the car flush with the floor.',
  closing: 'The doors close and the interlock proves the landing door locked before the car may move.',
  run: 'Brake lifted, the motor turns the drive sheave through the worm gearbox; friction in the grooves pulls the ropes, so the car and counterweight move in opposite directions.',
  test: 'Too fast: the governor sheave spins up until its flyweights trip the jaw, which grips the governor rope. The rope stops, the car does not, so the safety lever is pulled up.',
  stuck: 'The safety gear wedges are jammed between the car and both guide rails; the car is held by the rails, not the ropes.',
  reset: 'The machine drives the car upward, pulling the wedges back out of the rails.',
})[st.phase] || '');
</script></body></html>
