<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Food truck</title></head><body>
<script src="core.js"></script>
<script>
/* Food truck: a taco truck on a step-van chassis, parked with its serving window to the curb.
   HOW A TACO TRUCK SERVES (each button is one step; things move only along these paths)
   1. Open the hatch: the top-hinged awning hatch over the serving window swings up and two gas struts hold it; the
      pass shelf hangs under the window outside. The generator on the rear carrier feeds the shore-power inlet on the
      rear wall -> breaker panel -> fridges, hood fan and lights; the griddle burners are lit and the plate heats.
   2. Order: a customer walks up to the window and orders; the ticket prints on the printer on the serving counter
      and the cook clips it on the ticket rail above the window.
   3. Grill: propane from two 40 lb cylinders on the rear carrier -> pigtail hoses -> regulator on the rear wall ->
      yellow gas line under the floor -> up behind the chef base -> griddle manifold -> three burners under the steel
      plate. The cook sears the meat; smoke goes up into the hood (baffle filters) and out through the upblast fan.
      Then the cook builds three tacos in a paper boat on the counter beside the cutting board.
   4. Hand out: the cook slides the boat across the counter onto the sill; the customer lifts it off and leaves.
   Water: fill inlet on the street side -> fresh tank under the 3-bay sink -> pump -> water heater -> faucet; the sinks
   drain through the floor into the grey tank slung between the frame rails, emptied by its drain valve.
   PARTS
   case      box body (rounded shell) . serving window . serving hatch + piano hinge . gas struts x2 . pass shelf on
             braces . side door + step . menu board . roof A/C . upblast fan on its curb . cab (hood, windscreen, side
             windows, doors, mirrors, headlights, grille, bumper)
   structure frame rails x2 . axles + diffs . driveshaft . transmission . leaf springs . wheels (front singles, rear duals)
             . rear carrier deck on two arms . tank rack . floor . walls
   cooking   flat-top griddle (plate, 3 burners, manifold, knobs, backsplash) . chef base fridge (2 drawers) . steam
             table (2 pans) . exhaust hood (baffle filters, suppression nozzles) . duct . fire suppression tank .
             reach-in fridge (shelves, tubs) + compressor unit on top
   serving   serving counter (cabinet doors) . cutting board . ticket printer . POS tablet . ticket rail . hand sink .
             napkins + squeeze bottles on the shelf
   gas       propane tanks x2 (collar, valve) . pigtail hoses . regulator . gas line . shutoff valve
   power     generator . cord . shore power inlet . breaker panel . conduits . LED light strip
   water     water fill . fresh water tank . pump . water heater . 3-bay sink + faucet . drains . grey water tank . drain valve
   safety    fire extinguisher . fire suppression tank
   x = depth (curb side at x = TW faces the viewer), y = length (rear at y = 0, cab front at y = 748), z = up; 1 unit = 1 cm. */
const TW = 240, BY0 = 80, BY1 = 535, BZ0 = 76, BZ1 = 310, FZ = 84, CZ = 300;
const XI0 = 5, XI1 = 235, YI0 = 85, YI1 = 530;                          // inner faces of the walls
const OUTX = rrUV(0, BZ0, TW, BZ1, 12);                                  // box profile in (x, z), swept along y
const WY0 = 255, WY1 = 475, WZ0 = 174, WZ1 = 284;                        // serving window (sill flush with the counter)
const HZ = 290, HY0 = 250, HY1 = 480, HL = 120, HT = 3, HOPEN = 100;     // hatch: hinge height, ends, length, thickness, open angle
const TRAD = 37, AXF = 650, AXR = 230;                                   // wheel radius, front and rear axle
const CX0 = 10, CX1 = 230;                                               // cab sides
const CABL = [[535,76],[732,76],[735,82],[735,132],[728,140],[650,153],[535,153]];   // cab, lower (hood) profile in (y, z)
const CABU = [[535,153],[650,153],[614,238],[606,245],[535,248]];                    // cab, upper (windscreen) profile
const NWS = norm([0, 85, 36]);                                           // windscreen normal
const STRIPE = matOf('#e2483d'), TIRE = { l:'#4a4642', m:'#34302d', d:'#1f1c1a' }, GLASS = { l:'#d6edf2', m:'#a9cfd9', d:'#7fa9b6' };
const WALLM = { l:'#f7f4ec', m:'#e6e2d6', d:'#cbc5b6' }, FLOORM = { l:'#bdbab1', m:'#a29f97', d:'#7d7b74' };
const GAS = '#e8c23a', COLD = '#4f86c6', HOT = '#d9573f', GREY = '#8d9296', COND = '#a9b0b3', CORD = '#e07b2e', HOSE = '#3a3633';
const GENM = matOf('#d0423a'), TANKM = matOf('#ece9df'), SAFEM = matOf('#d8382f'), BLK = matOf('#3a3632'), TORT = { l:'#f3d58c', m:'#ddb86a', d:'#b48d45' };
const ftKinds = {
  pastor: { label:'Al pastor',   raw:'#e0784a', done:'#b7461e' },
  asada:  { label:'Carne asada', raw:'#b04a40', done:'#5c2b1b' },
  pollo:  { label:'Pollo',       raw:'#f1cfaa', done:'#c98b3f' } };
const ftDur  = { arrive:1.3, toGrill:.8, sear:2.6, toCounter:.8, plate:1.0, toWindow:.7, slide:1.1, take:.9, leave:1.4 };
const ftNext = { arrive:'ordered', toGrill:'sear', sear:'toCounter', toCounter:'plate', plate:'cooked', toWindow:'slide', slide:'take', take:'leave', leave:'idle' };
const ftServing = ['toWindow', 'slide', 'take', 'leave'];

/* ---------- helpers ---------- */
// round parts with as few sides as their size needs (thin rods 6, knobs 10, tanks 20): the scene stays light enough to animate
const ftSides = r => r < 2 ? 6 : r < 5 ? 10 : r < 12 ? 14 : 20;
const ftRod = (a, b, r, m, sh = toneI, w = 1, r1 = r) => rod(a, b, r, m, sh, w, r1, ftSides(Math.max(r, r1)));
const ftCyl = (x, y, z0, z1, r, m, sh = toneI, w = 1.2) => cyl(x, y, z0, z1, r, m, sh, w, ftSides(r));
// every part is an item {box, svg} for ftSort
const ftL3 = (a, b, t) => [0,1,2].map(i => a[i] + (b[i] - a[i])*t);
const ftBoxOf = (pts, pad = 0) => [[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - pad), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + pad)];

// byDepth sorts with a pairwise rule that is not transitive, which breaks down over a hundred parts; this is the same
// rule (separated boxes first, then centroid depth) applied as a topological order: farthest free part first, and on a
// cycle (three crossing sticks) the farthest part
function ftSort(parts){

  const rc = it.map(p => { if (!p.box) return null; const xs = [], ys = [];
    for (const x of [0, 1]) for (const y of [0, 1]) for (const z of [0, 1]){ const q = P(p.box[x][0], p.box[y][1], p.box[z][2]); xs.push(q[0]); ys.push(q[1]); }
    return [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)]; });
  // only parts whose outlines can overlap on screen are ordered against each other (the rest would only add false cycles)
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++){ const a = rc[i], b = rc[j];
    if (!a || !b || a[1] <= b[0] || b[1] <= a[0] || a[3] <= b[2] || b[3] <= a[2]) continue;
    const o = sepOrder(it[i], it[j]);
    if (o < 0){ nx[i].push(j); deg[j]++; } else if (o > 0){ nx[j].push(i); deg[i]++; } }
  let s = '';
  for (let c = 0; c < n; c++){
    let b = -1; for (let i = 0; i < n; i++) if (!done[i] && (b < 0 || (deg[i] === 0) > (deg[b] === 0) || ((deg[i] === 0) === (deg[b] === 0) && d[i] < d[b]))) b = i;
    done[b] = true; s += it[b].svg; for (const j of nx[b]) deg[j]--; }

}
const ftBx = (x0, y0, z0, x1, y1, z1, m, w = .9, extra = '', sh = toneI) => ftIt([[x0,y0,z0],[x1,y1,z1]], box(x0, y0, z0, x1, y1, z1, m, sh, w) + extra);
const ftCy = (x, y, z0, z1, r, m, w = 1, extra = '', sh = toneI) => ftIt([[x-r,y-r,z0],[x+r,y+r,z1]], ftCyl(x, y, z0, z1, r, m, sh, w) + extra);
const ftRd = (a, b, r, m, w = .8) => ftIt(ftBoxOf([a, b], r), ftRod(a, b, r, m, toneI, w));
const ftDot = (p, r, col, w = .5) => { const [X, Y] = P(...p); return `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(r*CAM_K)}" fill="${col}" stroke="${INK}" stroke-width="${w}"/>`; };
const ftTxt = (p, U, V, str, size, col = INK, wt = 800) => `<text transform="${txM(P(...p), Dv(...U), Dv(...V))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${wt}" letter-spacing=".04em">${str}</text>`;
const DOWN = [0, 0, -1];
const ftOp = (o, svg) => o >= .999 ? svg : `<g opacity="${f(o)}">${svg}</g>`;
// pipes, hoses, cords and conduits: short straight pieces (so they sort with solids), a fitting at every bend.
// Widths are true thickness (style, not scaled with the ink).
function ftPipe(pts, col, r = 1.2, seg = 45){
  const out = [], wI = (2*r*CAM_K + .9*INK_K).toFixed(2), wC = (2*r*CAM_K).toFixed(2);
  const st = (d, w, c) => `<path d="${d}" fill="none" stroke="${c}" style="stroke-width:${w}" stroke-linecap="butt"/>`;
  for (let i = 0; i < pts.length - 1; i++){
    const a = pts[i], b = pts[i+1], n = Math.max(1, Math.ceil(Math.hypot(...sub(b, a)) / seg));
    for (let j = 0; j < n; j++){ const p = ftL3(a, b, j/n), q = ftL3(a, b, (j+1)/n), d = pd([p, q], false);
      let svg = st(d, wI, INK) + st(d, wC, col);
      if (j === 0 && i > 0){ const [X, Y] = P(...p); svg += `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(r*CAM_K*1.3)}" fill="${col}" stroke="${INK}" style="stroke-width:${(.7*INK_K).toFixed(2)}"/>`; }

// culling, so frames stay light enough to animate: the screen outline of a box, and whether it lies wholly inside a convex outline
const ftCorners = b => [0, 1].flatMap(i => [0, 1].flatMap(j => [0, 1].map(k => P(b[i][0], b[j][1], b[k][2]))));
const ftRect = b => { const q = ftCorners(b), xs = q.map(p => p[0]), ys = q.map(p => p[1]); return [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)]; };
function ftHull2(q){ q = [...q].sort((a, b) => a[0] - b[0] || a[1] - b[1]); const cr = (o, a, b) => (a[0] - o[0])*(b[1] - o[1]) - (a[1] - o[1])*(b[0] - o[0]), lo = [], hi = [];
  for (const p of q){ while (lo.length > 1 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (const p of q.reverse()){ while (hi.length > 1 && cr(hi[hi.length - 2], hi[hi.length - 1], p) <= 0) hi.pop(); hi.push(p); }
  return lo.slice(0, -1).concat(hi.slice(0, -1)); }
const ftInHull = (H, p) => H.every((a, i) => { const b = H[(i + 1) % H.length]; return (b[0] - a[0])*(p[1] - a[1]) - (b[1] - a[1])*(p[0] - a[0]) >= 0; });
// a slab between edge vectors U, V, N from corner o (the hatch): every face that looks at the viewer
function ftSlab(o, U, V, N, m, w = 1, outer = '', inner = ''){
  const pt = (a, b, c) => [0,1,2].map(i => o[i] + U[i]*a + V[i]*b + N[i]*c), neg = v => v.map(x => -x);
  const nU = norm(U), nV = norm(V), nN = norm(N);
  const F = [[nU, [pt(1,0,0), pt(1,1,0), pt(1,1,1), pt(1,0,1)]], [neg(nU), [pt(0,0,0), pt(0,1,0), pt(0,1,1), pt(0,0,1)]],
    [nV, [pt(0,1,0), pt(1,1,0), pt(1,1,1), pt(0,1,1)]], [neg(nV), [pt(0,0,0), pt(1,0,0), pt(1,0,1), pt(0,0,1)]],
    [nN, [pt(0,0,1), pt(1,0,1), pt(1,1,1), pt(0,1,1)], 1], [neg(nN), [pt(0,0,0), pt(1,0,0), pt(1,1,0), pt(0,1,0)], 2]];
  let s = '';
  for (const [n, q, t] of F) if (facing(n)) s += shape(q, tone(n, m), w) + (t === 1 ? outer : t === 2 ? inner : '');
  return s;
}

/* ---------- people: legs, torso (apron on the front), head with hair or cap, two-bone arms reaching for targets ---------- */
function ftArmIK(Sh, T, L1, L2, bend){
  let d = sub(T, Sh), D = Math.hypot(...d);
  if (D > L1 + L2 - .05){ T = [0,1,2].map(i => Sh[i] + d[i]/D*(L1 + L2 - .05)); d = sub(T, Sh); D = L1 + L2 - .05; }
  const u = d.map(v => v/D), a = (L1*L1 - L2*L2 + D*D)/(2*D), h = Math.sqrt(Math.max(0, L1*L1 - a*a));
  let w = sub(bend, u.map(v => v*dot(bend, u))); w = norm(w);
  return { E: [0,1,2].map(i => Sh[i] + u[i]*a + w[i]*h), T };
}
function ftPerson(o){
  const kz = o.h/172, c = Math.cos(o.yaw), s2 = Math.sin(o.yaw), fw = [c, s2, 0], lt = [-s2, c, 0], tl = Math.tan(o.lean || 0), hipZ = 88*kz;
  const at = (a, l, z) => { const a2 = a + Math.max(0, z - hipZ)*tl; return [o.x + fw[0]*a2 + lt[0]*l, o.y + fw[1]*a2 + lt[1]*l, o.z + z]; };
  const SK = matOf(o.skin), SHM = matOf(o.shirt), PAM = matOf(o.pants), APM = o.apron ? matOf(o.apron) : null, op = o.op == null ? 1 : o.op;
  const sw = o.walk ? Math.sin(o.walkPh)*o.walk : 0, near = sd => camDot(lt.map(v => v*sd), CAM_V);
  const out = [];
  // legs and shoes, the far leg first
  let lg = ''; const lp = [];
  for (const sd of [-1, 1].sort((a, b) => near(a) - near(b))){
    const st = sd*sw*10, hip = at(0, sd*5.5, hipZ), foot = at(st, sd*6, 7);
    lg += ftRod(hip, foot, 5.2, PAM, toneI, 1) + ftRod(at(st - 3, sd*6, 3.4), at(st + 9, sd*6, 3.4), 3.4, BLK, toneI, .9);
    lp.push(hip, foot, at(st + 9, sd*6, 0)); }
  const lb = ftBoxOf(lp, 5.5); lb[0][2] = o.z; lb[1][2] = o.z + 90*kz;
  out.push(ftIt(lb, ftOp(op, lg)));
  // torso: pants at the hips, then shirt; the apron covers the front strips
  const ring = (z, a, b, n = 10) => Array.from({length:n}, (_, i) => { const t = i/n*2*Math.PI; return at(a*Math.cos(t), b*Math.sin(t), z*kz); });
  const R = [ring(80, 8, 12), ring(93, 8.4, 12.6), ring(118, 8.6, 13.5), ring(138, 9, 16.5), ring(146, 7, 14)];
  let tor = '';
  for (let i = 0; i < 4; i++) tor += loft(R[i], R[i+1], n => i === 0 ? toneI(n, PAM) : APM && i < 3 && dot(n, fw) > .45 ? toneI(n, APM) : toneI(n, SHM));
  if (facing([0,0,1])) tor += fill(pd(R[4]), toneI([0,0,1], SHM));
  tor += hullInk([...R[0], ...R[4]], 1.3);
  // neck, head, hair or cap
  const hc = at(1, 0, 161*kz), hr = 10*kz, [HX, HY] = P(...hc);
  tor += ftRod(at(0, 0, 144*kz), at(.5, 0, 153*kz), 4, SK, toneI, .8);
  tor += `<circle cx="${f(HX)}" cy="${f(HY)}" r="${f(hr*CAM_K)}" fill="${SK.l}" stroke="${INK}" stroke-width="1.2"/>`;
  if (camDot(fw, CAM_V) > -.15) tor += ftDot([hc[0] + fw[0]*hr*.96, hc[1] + fw[1]*hr*.96, hc[2] - 1], 1.2, SK.m, .4);
  const cm = matOf(o.cap || o.hair), dome = Array.from({length:5}, (_, i) => { const a = (i/4)*80*Math.PI/180, r = (hr + .6)*Math.cos(a);
    return ellUV(hc[0] - fw[0]*1.2, hc[1] - fw[1]*1.2, r, r, 10).map(([x, y]) => [x, y, hc[2] + 1.5 + (hr + .6)*Math.sin(a)]); });
  for (let i = 0; i < 4; i++) tor += loft(dome[i], dome[i+1], n => toneI(n, cm));
  if (facing([0,0,1])) tor += fill(pd(dome[4]), toneI([0,0,1], cm));
  tor += hullInk(dome.flat(), 1);
  const tb = ftBoxOf([...R[0], ...R[4], [hc[0], hc[1], hc[2] + hr + 2]], 1); tb[0][2] = o.z + 91*kz;
  out.push(ftIt(tb, ftOp(op, tor)));
  // arms: shoulder -> elbow -> hand on its target; the right hand may hold the spatula
  for (const sd of [-1, 1]){
    const Sh = at(0, sd*16, 140*kz), T0 = o.hands ? o.hands[sd > 0 ? 0 : 1] : at(2 - sd*sw*6, sd*18.5, 88*kz);
    const bend = [-fw[0]*.5 + lt[0]*sd*.35, -fw[1]*.5 + lt[1]*sd*.35, -.8];
    const { E, T } = ftArmIK(Sh, T0, 29*kz, 34*kz, bend);
    let a = ftRod(Sh, E, 3.8, SHM, toneI, .9) + ftRod(E, T, 3.1, SK, toneI, .8) + ftDot(T, 3.3, SK.l, .8);
    const pts = [Sh, E, T];
    if (o.tool && sd < 0){ const tip = [T[0] + fw[0]*9, T[1] + fw[1]*9, 170.4], b0 = [tip[0] - lt[0]*3.5, tip[1] - lt[1]*3.5, tip[2]], b1 = [tip[0] + lt[0]*3.5, tip[1] + lt[1]*3.5, tip[2]];
      a = ftRod(T, tip, .9, BLK, toneI, .6) + shape([b0, b1, [b1[0] + fw[0]*8, b1[1] + fw[1]*8, tip[2]], [b0[0] + fw[0]*8, b0[1] + fw[1]*8, tip[2]]], METAL.l, .7) + a;
      pts.push(tip); }
    out.push(ftIt(ftBoxOf(pts, 3.4), ftOp(op, a)));

}
const ftPoses = { counter:{ x:178, y:330, yaw:0 }, grill:{ x:100, y:300, yaw:Math.PI }, window:{ x:178, y:365, yaw:0 } };
const ftLerpPose = (a, b, t) => ({ x: a.x + (b.x - a.x)*t, y: a.y + (b.y - a.y)*t, yaw: a.yaw + (b.yaw - a.yaw)*t, walk: Math.sin(t*Math.PI) });
function ftCookPose(st){ const e = ease(Math.min(1, st.t)), Q = ftPoses;
  switch (st.phase){
    case 'toGrill':   return ftLerpPose(Q.counter, Q.grill, e);
    case 'sear':      return { ...Q.grill, walk:0 };
    case 'toCounter': return ftLerpPose(Q.grill, { ...Q.counter, yaw: 2*Math.PI }, e);
    case 'toWindow':  return ftLerpPose(Q.counter, Q.window, e);
    case 'slide': case 'take': return { ...Q.window, walk:0 };
    case 'leave':     return ftLerpPose(Q.window, Q.counter, e);

  } }
function ftCook(st){
  const p = ftCookPose(st), ph = st.phase, t = Math.min(1, st.t), fw = [Math.cos(p.yaw), Math.sin(p.yaw), 0], lt = [-fw[1], fw[0], 0];
  const wp = (a, l, z) => [p.x + fw[0]*a + lt[0]*l, p.y + fw[1]*a + lt[1]*l, FZ + z];
  let hands = null, lean = 0, tool = false;
  if (ph === 'sear'){ const w = Math.sin(st.t*ftDur.sear*9)*5; hands = [wp(28, 13, 91), wp(27 + w, -12, 92)]; tool = true; }
  else if (ph === 'plate'){ const w = Math.sin(t*20)*3; hands = [wp(30, 2, 95), wp(32 + w, -6 + w, 96)]; }
  else if (ph === 'toWindow' || ph === 'slide'){ const q = ftPlatePos(st); hands = [[q[0] - 7, q[1] + 9, q[2] + 3], [q[0] - 7, q[1] - 9, q[2] + 3]]; lean = ph === 'slide' ? .5*ease(t) : 0; }
  else if (ph === 'take'){ lean = .5*(1 - ease(t)); hands = [wp(22, 11, 94), wp(22, -11, 94)]; }
  else if (!ftDur[ph] || ph === 'arrive') hands = [wp(22, 11, 94), wp(22, -11, 94)];
  return ftPerson({ x:p.x, y:p.y, z:FZ, yaw:p.yaw, h:172, lean, walk:p.walk || 0, walkPh: st.t*14, hands, tool,
    skin:'#a8714a', shirt:'#f4f1ea', pants:'#3a3633', apron:'#2f2c2a', cap:'#e2483d' });
}
// the customer walks up beside the truck from the cab end, orders at the window, takes the boat and walks off to the rear
function ftCustPose(st){
  const ph = st.phase, t = Math.min(1, st.t), e = ease(t);
  if (ph === 'idle') return null;
  if (ph === 'arrive'){ const w = Math.min(1, t/.8); return { x:282, y:640 - 275*ease(w), yaw: -Math.PI/2 - Math.PI/2*Math.max(0, Math.min(1, (t - .75)/.25)), walk: w < 1 ? 1 : 0, op:1 }; }
  if (ph === 'take') return { x:282 + 18*Math.max(0, (t - .5)/.5), y:365, yaw:-Math.PI, walk:0, op:1 };
  if (ph === 'leave'){ const w = Math.max(0, (t - .15)/.85); return { x:300, y:365 - 215*w, yaw: -Math.PI + Math.PI/2*Math.min(1, t/.2), walk: w > 0 ? 1 : 0, op: t > .6 ? 1 - (t - .6)/.4 : 1 }; }
  return { x:282, y:365, yaw:-Math.PI, walk:0, op:1 };

const ftCarry = c => [c.x + Math.cos(c.yaw)*18, c.y + Math.sin(c.yaw)*18, 122];
function ftCustomer(st){
  const c = ftCustPose(st); if (!c) return [];
  const ph = st.phase, q = ftPlatePos(st);

    vis = items.filter(it => !it.box || it.box === body.box || sepOrder(it, body) >= 0 || !ftCorners(it.box).every(p => ftInHull(H, p))); }
  s += ftSort(vis.filter(i => under(i.box))) + ftSort(vis.filter(i => !under(i.box)));
  // labels go to the column on their side of the truck; from some turns one side has more parts than its column holds,
  // so each column keeps its first (most important) parts up to what fits under the buttons / beside the drawing
  const LB = [0, TW, 15, 750, 0, 335], lab = ftLabels(st, k);
  if (lab.length && (k > .6 || k === 0)){
    const xs = []; for (const x of [LB[0], LB[1]]) for (const y of [LB[2], LB[3]]) for (const z of [LB[4], LB[5]]) xs.push(P(x, y, z)[0]);
    // the same split xrCallouts makes: by side of the middle, unless a side has no room for the widest pill
    const x0 = Math.min(...xs), x1 = Math.max(...xs), cx = (x0 + x1)/2, vb = document.getElementById('fig').viewBox.baseVal;
    const u = window.LBL_U ? LBL_U() : 0, fs = u ? 10*u : 8.6*INK_K, wMax = u ? fs*1.7*1.3 + 12*INK_K : Math.max(...lab.map(it => it.text.length))*fs*.62 + fs*1.5 + 12*INK_K;
    const roomL = x0 - vb.x >= wMax, roomR = vb.x + vb.width - x1 >= wMax, n = { L:0, R:0 }, cap = { L:14, R:19 };
    s += xrCallouts(lab.filter(it => { const sd = (P(...it.at)[0] < cx && roomL) || !roomR ? 'L' : 'R'; return ++n[sd] <= cap[sd]; }), LB); }
  return s;
}

/* ---------- behaviour: one state object, one clock ---------- */
let ui, ftLoop = false;
const ftTempTarget = st => st.hatchT ? (st.phase === 'sear' ? 186 : 204) : 20;
function ftStep(st, dt){
  if (st.hatch !== st.hatchT) st.hatch = st.hatchT > st.hatch ? Math.min(1, st.hatch + dt/1.3) : Math.max(0, st.hatch - dt/1.3);
  const tg = ftTempTarget(st); st.temp += (tg - st.temp)*Math.min(1, dt*(tg > st.temp ? .9 : .45)); if (Math.abs(tg - st.temp) < .4) st.temp = tg;
  const d = ftDur[st.phase];
  if (d){ st.t += dt/d; if (st.t >= 1){ if (st.phase === 'leave'){ st.served++; st.kind = null; } st.phase = ftNext[st.phase]; st.t = 0; } }
  else st.t += dt;
  return st.hatch !== st.hatchT || !!ftDur[st.phase] || st.temp !== tg;
}
// the clock is our own: when frames keep coming at one instant (headless shots do this with a heavy scene) the loop
// steps aside for a short timer so time can move on, then carries on from where it was
let ftLast = 0;
function ftRun(resume){ if (ftLoop) return; ftLoop = true; if (!resume) ftLast = performance.now(); let still = 0;
  ui.animate(() => { const now = performance.now(), dt = Math.min(.05, (now - ftLast)/1000); ftLast = now;
    if (dt === 0 && ++still > 2){ ftLoop = false; setTimeout(() => ftRun(true), 16); return false; }
    if (dt > 0) still = 0;
    const go = ftStep(ui.st, dt); if (!go) ftLoop = false; return go; }); }
function ftToggleHatch(st){
  if (st.hatchT){ if (st.phase !== 'idle') return ui.flash('Hand out the order before closing up'); st.hatchT = 0; }
  else st.hatchT = 1;
  ftRun(); }
function ftOrder(st, kind){
  if (st.phase !== 'idle') return ui.flash('One order at a time');
  st.hatchT = 1; st.kind = kind; st.phase = 'arrive'; st.t = 0; ftRun(); }
function ftGrill(st){ const ph = st.phase;
  if (ph === 'ordered'){ st.phase = 'toGrill'; st.t = 0; return ftRun(); }
  ui.flash(ph === 'idle' ? (st.hatchT ? 'Take an order first' : 'Open the hatch and take an order first') : ph === 'arrive' ? 'The ticket is still printing'
    : ph === 'cooked' ? 'The tacos are ready: hand them out' : ftServing.includes(ph) ? 'This order is being served' : 'Already on the grill'); }
function ftHandOut(st){ const ph = st.phase;
  if (ph === 'cooked'){ st.phase = 'toWindow'; st.t = 0; return ftRun(); }
  ui.flash(ph === 'ordered' ? 'Grill the order first' : ph === 'idle' ? 'No order yet' : ph === 'arrive' ? 'The ticket is still printing'
    : ftServing.includes(ph) ? 'Already handing it out' : 'Still cooking'); }

ui = mountFigure({
  fig:'', title:'Food truck', turn:'full',
  size:[290, 750, 340], center:[125, 375], palette:'mustard',
  // hatch 0..1 (hatchT = where it is going), phase + t (0..1 through the phase), kind of order, griddle temperature
  state:{ hatch:0, hatchT:0, phase:'idle', t:0, kind:null, served:0, temp:20 },
  scene,
  buttons:[
    { label:'Open the hatch', onClick:(st) => ftToggleHatch(st) },
    { label:'Order', choices: st => Object.entries(ftKinds).map(([key, v]) => ({ label: v.label, disabled: st.phase !== 'idle', why:'One order at a time: hand this one out first',
        onClick:(st) => ftOrder(st, key) })) },
    { label:'Grill', onClick:(st) => ftGrill(st) },
    { label:'Hand out', onClick:(st) => ftHandOut(st) },
  ],
  stats: st => [{ label:'Griddle', value: Math.round(st.temp) + '°C' }, { label:'Order', value: st.kind ? ftKinds[st.kind].label : '-', small:true }, { label:'Served', value: st.served }],
  acts:{ hatch:(st) => ftToggleHatch(st) },
  params:(st, q) => {
    if (q.get('open') === '1'){ st.hatch = st.hatchT = 1; st.temp = 204; }
    if (q.has('hatch')) st.hatch = +q.get('hatch');
    if (q.has('order') && ftKinds[q.get('order')]) st.kind = q.get('order');
    if (q.has('phase') && (ftDur[q.get('phase')] || ['ordered', 'cooked'].includes(q.get('phase')))){
      st.phase = q.get('phase'); st.t = q.has('t') ? +q.get('t') : .5; st.hatch = st.hatchT = 1; st.temp = 200; if (!st.kind) st.kind = 'pastor'; }
  },
});
{ const r0 = ui.render; ui.render = () => { r0(); const b = document.querySelector('#btns .act'); if (b) b.textContent = ui.st.hatchT ? 'Close the hatch' : 'Open the hatch';
    document.documentElement.classList.toggle('ftxr', (ui.st.xr || 0) > .6); }; ui.render(); }
// the see-through labels fill both columns; the right one runs where the readout sits, so the readout steps aside meanwhile
document.head.insertAdjacentHTML('beforeend', '<style>@media (min-width:561px){html.ftxr:not(.nolabels) #stats{visibility:hidden}}</style>');
xrMount(() => ui, () => '');
</script>
