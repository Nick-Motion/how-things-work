<!doctype html>
<html lang="en" data-errors=""><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nail extractor</title></head><body>
<script src="core.js"></script>
<script>
/* Truth first.
   Primary evidence is The Way Things Work Now, 2016, printed page 22, NAIL EXTRACTOR.
   Hand effort is magnified about the wood contact to overcome nail extraction resistance.
   The saved 1998 page 22 supports the same action. The 1988 edition is inaccessible and unverified.
   This is a bench teaching adaptation of the named example, not a reproduction of a marketed tool.
   Representative construction is a one-piece forged steel pry bar with polished, beveled nail slots.
   Reference https://www.stanleytools.com/en-us/product/55-045/wonder-bar-ii-7-pry-bar
   Grip slides the open fork beneath the partly driven nail head. The nail stays in the wood.
   Pull rocks the curved heel on the wood. The claw lifts the head; the short nail tilts and clears the wood.
   Reset stages specimen replacement and returns the hand tool. No powered insertion hardware is implied.
   Parts. One continuous forging joins the long shank, flat effort end, curved claw and rocking heel.
   The claw has two tines, their V notch and polished bevels. These are physical features, not extra hardware.
   The wood block holds the nail shank and point. Its head bears on the two tines. The table holds the block.
   Anatomy labels exclude the nail, block, table, contact mark, force arrows and moment-arm overlays.
   Geometry. Model units represent 3 mm. A radius-4.8 heel rolls over the block at z=17.
   Claw contact is [-11,0,1.1] relative to the heel center, grip is [28,0,62].
   The short, rigid nail follows that contact and tilts toward its original wood entry until free.
   shortcut: motion is prescribed without wood deformation or friction, use a contact solver for force predictions.
*/
const nailState = {phase:'ready', seat:0, angle:0, motion:null};
const nailRad = Math.PI / 180;
const nailBox = (pts, r=0) => [
  [0,1,2].map(i => Math.min(...pts.map(p => p[i]))-r),
  [0,1,2].map(i => Math.max(...pts.map(p => p[i]))+r)
];
function nailGeo(st){
  const a=st.angle*nailRad, ca=Math.cos(a), sa=Math.sin(a), cx=32+4.8*a;
  const at=([x,y,z]) => [cx+x*ca+z*sa+5*(1-st.seat),35+y,21.8-x*sa+z*ca];
  const head=st.angle ? at([-11,0,1.1]) : [21,35,22.9];
  const axis=norm(sub(head,[21,35,17]));
  const tip=head.map((v,i)=>v-12*axis[i]);
  return {at,head,tip,axis,contact:[cx,35,17],hand:at([28,0,62])};
}
function nailPrism(profile, y0, y1, g, material){
  const aa=profile.map(([x,z])=>g.at([x,y0,z])), bb=profile.map(([x,z])=>g.at([x,y1,z]));
  let svg=loft(aa,bb,n=>tone(n,material));
  if(vis([0,-1,0])) svg+=shape(aa,tone([0,-1,0],material),.9);
  if(vis([0,1,0])) svg+=shape(bb,tone([0,1,0],material),.9);
  return {box:nailBox([...aa,...bb]),svg:svg+hullInk([...aa,...bb],1.6)};
}
function nailTool(g,m){
  const parts=[];
  const path=[[-7,1],[-4,0],[-3,-2.65],[0,-4],[3,-2.65],[4,0],[5,9],[25,58]];
  for(let i=0;i<path.length-1;i++){
    const [aa,bb]=[path[i],path[i+1]], d=norm([bb[0]-aa[0],0,bb[1]-aa[1]]), nx=-d[2]*.8,nz=d[0]*.8;
    parts.push(nailPrism([[aa[0]+nx,aa[1]+nz],[bb[0]+nx,bb[1]+nz],[bb[0]-nx,bb[1]-nz],[aa[0]-nx,aa[1]-nz]],-3.8,3.8,g,i<5?METAL:m));
  }
  // Convex halves leave a real open V notch; no dark decal stands in for a hole.
  for(const sg of [-1,1]){
    const top=[[-15,sg*4,.4],[-15,sg*2.4,.4],[-7,sg*.8,1.8],[-7,sg*4,1.8]].map(g.at);
    const bot=[[-15,sg*4,-.05],[-15,sg*2.4,-.05],[-7,sg*.8,.3],[-7,sg*4,.3]].map(g.at);
    const cap=sg>0?top:top.slice().reverse(), base=sg>0?bot:bot.slice().reverse();
    parts.push({box:nailBox([...top,...bot]),svg:loft(base,cap,n=>tone(n,METAL))+shape(cap,METAL.l,.8)+hullInk([...top,...bot],1.5)});
    const bevel=[[-15,sg*4,.4],[-15,sg*2.4,.4],[-12,sg*1.8,.93],[-12,sg*4,.93]].map(g.at);
    parts.push({box:nailBox(bevel,.02),svg:shape(bevel,'#fbfaf3',.45)});
  }
  parts.push(nailPrism([[24,55],[28,62],[30,63],[30,60],[26,54]],-4.5,4.5,g,m));
  return parts;
}
function nailArrow(aa,bb,col){
  const d=norm(sub(bb,aa)), side=norm(cross(d,[0,1,0]));
  const wings=[-1,1].map(s=>bb.map((v,i)=>v-d[i]*2.6+side[i]*s*1.3));
  return `<path d="${pd([aa,bb],false)}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linecap="round"/>`+shape([wings[0],bb,wings[1]],col,.5);
}
function nailScene(st,m){
  const g=nailGeo(st), k=ease(st.xr||0), parts=[];
  let svg=board(0,0,90,70,3,4,BOARD);
  svg+=castShadow([g.at([-15,-4,0]),g.at([30,4,63]),[65,54,17],[12,16,17]],3,boardTop(0,0,90,70,3,4));
  const block=box(10,14,3,70,56,17,WOOD,toneI,1.3);
  let grain='';
  for(const yy of [19,25,43,49]) grain+=line([[12,yy,17.05],[29,yy+.7,17.05],[48,yy-.5,17.05],[68,yy+.4,17.05]],.45);
  parts.push({box:[[10,14,3],[70,56,17]],svg:`<g opacity="${1-.85*k}">${block+grain}</g>`});
  const steel=matOf('#b7c7d0');
  // Splitting the shank at the wood surface gives the opaque block real occlusion from behind.
  const dz=g.head[2]-g.tip[2], cut=Math.max(0,Math.min(1,(17-g.tip[2])/dz));
  const exit=g.tip.map((v,i)=>v+(g.head[i]-v)*cut);
  if(cut>0) parts.push({box:nailBox([g.tip,exit],.7),svg:rod(g.tip,exit,.65,steel,toneI,.65)});
  if(cut<1) parts.push({box:nailBox([exit,g.head],.7),svg:rod(exit,g.head,.65,steel,toneI,.65)});
  const top=g.head.map((v,i)=>v+g.axis[i]*.85);
  parts.push({box:nailBox([g.head,top],2.7),svg:rod(g.head,top,2.7,METAL,toneI,1,2.7,24)});
  parts.push(...nailTool(g,m));
  svg+=byDepth(parts);
  if(k>.01){
    const hp=g.hand, np=g.head, cp=g.contact;
    const effortEnd=[hp[0],hp[1],hp[2]-12], loadStart=[np[0],np[1]-5,np[2]+12], loadEnd=[np[0],np[1]-5,np[2]+2];
    const effortArm=[[cp[0],30,21],[hp[0],30,21]],loadArm=[[np[0],26,19],[cp[0],26,19]];
    svg+=`<g opacity="${k}" data-overlay="force-and-moment-arms">`;
    svg+=nailArrow([hp[0],hp[1],hp[2]+8],effortEnd,'#c28714')+nailArrow(loadStart,loadEnd,'#ce5145');
    svg+=`<path d="${pd(effortArm,false)+pd(loadArm,false)}" fill="none" stroke="#527fb0" stroke-width="1.4" stroke-dasharray="2 1.5"/>`;
    svg+=shape([[cp[0]-1.8,cp[1],17.1],[cp[0]+1.8,cp[1],17.1],[cp[0],cp[1],20.2]],'#ce5145',.7);
    svg+=tag([hp[0],30,21],20,15,'EFFORT ARM')+tag([np[0],26,19],-22,15,'LOAD ARM');
    svg+=tag(cp,0,30,'FULCRUM')+tag([hp[0],hp[1],hp[2]+8],15,-12,'EFFORT')+tag(loadStart,-16,-18,'LOAD');
    svg+='</g>';
  }
  if(k>.6) svg+=xrCallouts([
    {at:g.at([15,0,35]),text:'LONG SHANK',on:st.phase==='pulling'},
    {at:g.at([28,0,62]),text:'FLAT EFFORT END',on:st.phase==='pulling'},
    {at:g.at([0,0,-4]),text:'ROCKING HEEL',on:st.angle>0},
    {at:g.at([-5,0,.5]),text:'CURVED CLAW',on:st.seat>0},
    {at:g.at([-11,-3,1]),text:'LEFT TINE',on:st.seat>0},
    {at:g.at([-11,3,1]),text:'RIGHT TINE',on:st.seat>0},
    {at:g.at([-10,0,1]),text:'V NOTCH',on:st.seat>0},
    {at:g.at([-14,3,.6]),text:'BEVELED TIPS',on:st.phase==='seating'}
  ],[10,75,14,56,3,84]);
  return svg;
}
function nailAct(st,ui,action){
  if(action==='reset'){
    st.motion=null; st.phase='ready'; st.seat=0; st.angle=0;
    return;
  }
  if(st.motion) return ui.flash('The tool is moving.');
  if(action==='grip' && st.phase!=='ready') return ui.flash(st.phase==='extracted'?'Reset for another nail.':'The claw is already seated.');
  if(action==='pull' && st.phase!=='gripped') return ui.flash(st.phase==='extracted'?'Reset for another nail.':'Grip beneath the nail head first.');
  const motion={action,t:0}; st.motion=motion; st.phase=action==='grip'?'seating':'pulling';
  ui.animate(dt=>{
    if(st.motion!==motion) return false;
    motion.t=Math.min(1,motion.t+dt/(action==='grip'?.65:1.7));
    const progress=ease(motion.t);
    if(action==='grip') st.seat=progress; else st.angle=50*progress;
    if(motion.t===1){st.motion=null; st.phase=action==='grip'?'gripped':'extracted';return false;}
    return true;
  });
}
const nailUI=mountFigure({
  fig:'22',turn:'full',title:'Nail extractor',size:[90,70,87],palette:'mustard',state:nailState,
  scene:nailScene,
  stats:st=>[{label:'Nail lift',value:Math.round((nailGeo(st).head[2]-22.9)*3)+' mm'}],
  buttons:[
    {label:'Grip',onClick:(st,ui)=>nailAct(st,ui,'grip')},
    {label:'Pull',onClick:(st,ui)=>nailAct(st,ui,'pull')},
    {label:'Reset',onClick:(st,ui)=>nailAct(st,ui,'reset')}
  ],
  params:(st,q)=>{
    const stage=q.get('stage');
    if(stage==='gripped'||stage==='extracted'){st.seat=1;st.phase=stage;st.angle=stage==='extracted'?50:0;}
  }
});
xrMount(()=>nailUI,()=>'');
</script></body></html>
