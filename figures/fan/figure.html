<script src="core.js"></script>
<script>
/* Desk fan (a 30 cm / 12 in oscillating desk fan, 1 unit = 1 cm).
   How it really works, and where everything is after each step:
   1. Speed key down: the piano key latches in the switch block; its contact leaf closes mains (in on the cord, held by the cord
      grip) onto one tap of the motor winding. The current runs up the wiring harness inside the stand tube, through the hollow
      tilt knuckle and swivel post, into the motor leads. Key 1/2/3 picks a tap (more turns in circuit = slower); the run
      capacitor in the base feeds the auxiliary winding so the motor starts and turns one way. Key 0 trips the latch: every
      key springs up and the motor coasts to a stop.
   2. The rotor (a squirrel cage) turns in the stator's field on its shaft, held by two oiled sleeve bearings in the end bells.
      The shaft's front end carries the hub and three blades (blade nut = spinner); they blow air forward through the guard.
   3. Oscillation knob pushed down: the dog clutch locks the worm wheel to its spindle. The worm cut on the shaft's rear end
      turns the wheel (about 1/30 of shaft speed drawn here, ~1/250 in a real fan), the pinion on the spindle turns the output
      gear, the output shaft turns the crank arm under the gearbox. The crank pin drags the connecting link, whose other end is
      pinned to the knuckle; the head can only swing about the swivel post, so it rocks about 42 degrees each way.
      Pulled up: the wheel spins free on the spindle and the head stays where it is.
   4. Tilt: the knuckle turns on the tilt bolt between the two fork cheeks; the tilt knob clamps it at the angle chosen.
   Parts (each fixed to the part named after it):
   CASE      base shell . 4 rubber feet . collar on the base . stand tube . yoke on the tube . 2 fork cheeks on the yoke .
             tilt knuckle on the tilt bolt . motor housing on the swivel post . gearbox cover on the housing's back .
             guard nut on the motor's front boss
   BASE      steel weight plate on the floor of the base . tube socket on the plate . switch block on the plate . 4 speed keys on
             the pivot rod . 4 plungers under the keys . 4 contact leaves on the switch block . run capacitor on the plate .
             cord grommet in the back wall . cord grip . mains cores to the switch . capacitor leads . harness to the tube
   STAND     wiring harness in a sleeve up the tube . tilt bolt (head, shank) . tilt knob on the bolt . anchor lug on the knuckle .
             anchor pin on the lug
   MOTOR     rear end bell . rear sleeve bearing + oil felt . rear and front winding end turns . stator stack . rotor . shaft (in
             pieces between the rings) . front end bell . front bearing + oil felt . 2 through bolts end bell to end bell .
             thermal fuse tied to the winding . 4 motor leads down into the swivel post
   GEARBOX   worm on the shaft . end bushing . worm wheel . dog clutch + spring on the spindle . spindle . pinion . output gear .
             output shaft and its floor bushing . oscillation knob on the spindle top
   SWING     swivel post + boss under the housing . crank arm on the output shaft . crank pin . connecting link
   AIR       rear guard (centre plate, spokes, rings) clamped by the guard nut . hub on the shaft . 3 blades . spinner . front guard
             (spokes, rings, badge) . rim wire . 4 guard clips */

/* ---------- world (x = depth toward the front, y = width, z = up) ---------- */
const BW = 34, BDP = 44, BH = 2, BRAD = 6;
const BTOP = boardTop(0, 0, BW, BDP, BH, BRAD);
const PVX = 16, PVY = 22;                                   // stand axis
const BZ0 = BH + .4, BZ1 = BH + 5;                         // base bottom (on its feet) and top
const BASE_A = on(PZ(BZ0), rrUV(10, 11, 28, 33, 6)), BASE_B = on(PZ(BZ1), rrUV(11, 12, 27, 32, 5));
const ZT = 20, KH = 2.6;                                    // tilt axis height; swivel plane above it (knuckle frame)
const TA = [PVX, PVY, ZT];
const KEY_X = [21.7, 25.9], keyY = i => PVY + 5.4 - i*3.6;   // speed keys 0..3, left to right as seen from the front
/* ---------- head frame: origin on the swivel axis at the swivel plane, motor axis along +x at z = ZA ---------- */
const ZA = 8;
const HOUSING = [[-6.5,4.6],[-5.8,5.6],[-4.6,6.1],[.5,6.1],[2.2,5.6],[3,4.8]];
const GR_R = 16.3, X_RIM = 5.6;
const xRear = r => 3.4 + 1.3*((r - 5.5)/10.8)**2;         // max 4.7, just behind the blades' leading edge (4.9)
const xFront = r => 6.0 + 4.4*Math.pow(Math.max(0, 1 - (r/GR_R)**2), .8);
const XB = 6.0;                                             // blade mid-plane
const GB = { x0:-11.6, x1:-6.5, y0:-5.8, y1:3.0, z0:3.6, z1:12.4 };
const SPIN = [-8.8, -3.05], OUTS = [-8, 0];                 // worm-wheel spindle, output shaft
const OC = 8, CR = 3, LK = 7, AB = 4.5;                     // swivel-to-crank, crank radius, link, swivel-to-anchor
const W_SPD = [0, 22, 26, 30], RPM_K = 45, GEAR_K = 30;     // drawn blade speed (rad/s); x45 = real rpm
const TILTS = { down:{ label:'Down', a:-10 }, level:{ label:'Level', a:0 }, up:{ label:'Up', a:22 } };
const SPD_N = ['Off', '1 Low', '2 Medium', '3 High'];

const rad = a => a*Math.PI/180, deg = a => a*180/Math.PI;
const addv = (a,b) => [a[0]+b[0], a[1]+b[1], a[2]+b[2]], scl = (a,k) => a.map(v => v*k);
const clamp1 = v => Math.max(-1, Math.min(1, v));
const f2 = v => v.toFixed(2);

/* ---------- the oscillation four-bar: head (swivel to crank) . crank . link . anchor (on the knuckle) ---------- */
const pinOf = phi => [-OC + CR*Math.cos(phi), CR*Math.sin(phi)];
const angA = phi => { const [px, py] = pinOf(phi), rho = Math.hypot(px, py), aP = Math.PI + Math.atan2(-py, -px);
  return aP + Math.acos(clamp1((rho*rho + AB*AB - LK*LK)/(2*rho*AB))); };
const TH_A = (() => { let lo = 1e9, hi = -1e9; for (let i = 0; i < 720; i++){ const a = angA(i*Math.PI/360); lo = Math.min(lo, a); hi = Math.max(hi, a); } return (lo + hi)/2; })();
const psiOf = phi => deg(TH_A - angA(phi));
const A_FR = [AB*Math.cos(TH_A), AB*Math.sin(TH_A)];        // anchor pin on the knuckle
const PHI0 = (() => { let b = 0, bv = 1e9; for (let i = 0; i < 720; i++){ const p = i*Math.PI/360, v = Math.abs(psiOf(p)); if (v < bv && Math.sin(p) > 0){ bv = v; b = p; } } return b; })();

/* ---------- frames ---------- */
let KC = 1, KS = 0, HCc = 1, HSs = 0, VL = [1,1,1];
const kDir = ([x,y,z]) => [x*KC - z*KS, y, x*KS + z*KC];
const kP = p => addv(TA, kDir(p));
const hRot = ([x,y,z]) => [x*HCc - y*HSs, x*HSs + y*HCc, z];
const hDir = v => kDir(hRot(v));
const hP = p => { const q = hRot(p); return kP([q[0], q[1], q[2] + KH]); };
const KN = { p: kP, d: kDir }, HD = { p: hP, d: hDir }, WD = { p: v => v, d: v => v };
function setFrames(st){ const t = rad(st.tiltA), p = rad(st.psi); KC = Math.cos(t); KS = Math.sin(t); HCc = Math.cos(p); HSs = Math.sin(p); }
const toHead = v => { const a = [v[0]*KC + v[2]*KS, v[1], -v[0]*KS + v[2]*KC]; return [a[0]*HCc + a[1]*HSs, -a[0]*HSs + a[1]*HCc, a[2]]; };

/* ---------- sorting: head parts compare in the head's own frame, everything else by world boxes ---------- */
const lboxOf = pts => [[0,1,2].map(i => Math.min(...pts.map(p => p[i]))), [0,1,2].map(i => Math.max(...pts.map(p => p[i])))];
const corners = b => { const o = []; for (const x of [b[0][0], b[1][0]]) for (const y of [b[0][1], b[1][1]]) for (const z of [b[0][2], b[1][2]]) o.push([x,y,z]); return o; };
const item = (F, lb, svg) => ({ lbox: F === HD ? lb : null, box: F === WD ? lb : lboxOf(corners(lb).map(F.p)), svg });
const sepL = (p, q) => { for (let k = 0; k < 3; k++){ if (p.lbox[1][k] <= q.lbox[0][k] + 1e-6) return VL[k] >= 0 ? -1 : 1; if (q.lbox[1][k] <= p.lbox[0][k] + 1e-6) return VL[k] >= 0 ? 1 : -1; } return 0; };
// a plain sort goes wrong with hundreds of guard-wire pieces (the box test is not transitive), so: order only the pairs
// that overlap on screen, then draw back to front through that graph (ties and cycles broken by depth)
function sortAll(items){
  items = items.filter(Boolean); const n = items.length;
  const sb = items.map(it => { const q = corners(it.box).map(c => P(...c)); return [Math.min(...q.map(v => v[0])), Math.max(...q.map(v => v[0])), Math.min(...q.map(v => v[1])), Math.max(...q.map(v => v[1]))]; });
  const dep = items.map(it => depthOf(boxMid(it.box))), out = items.map(() => []), indeg = new Array(n).fill(0);
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++){
    const a = sb[i], b = sb[j]; if (a[1] < b[0] || b[1] < a[0] || a[3] < b[2] || b[3] < a[2]) continue;
    const c = (items[i].lbox && items[j].lbox ? sepL(items[i], items[j]) : 0) || sepOrder(items[i], items[j]);
    if (c < 0){ out[i].push(j); indeg[j]++; } else if (c > 0){ out[j].push(i); indeg[i]++; } }
  const done = new Array(n).fill(false), res = [];
  for (let k = 0; k < n; k++){
    let b = -1; for (let i = 0; i < n; i++) if (!done[i] && (b < 0 || (indeg[i] === 0) > (indeg[b] === 0) || ((indeg[i] === 0) === (indeg[b] === 0) && dep[i] < dep[b]))) b = i;
    done[b] = true; res.push(items[b].svg); for (const j of out[b]) indeg[j]--; }
  return res.join('');
}
const ghost = (caseSvg, mech, k) => k > 0 ? `<g opacity="${f2(1 - .8*k)}">${caseSvg}</g><g opacity="${f2(k)}">${mech}</g>` : caseSvg;

/* ---------- primitives in a frame F ---------- */
const ringX = (F, x, r, n = 24, cy = 0, cz = ZA) => Array.from({length:n}, (_, i) => { const t = i/n*2*Math.PI; return F.p([x, cy + r*Math.cos(t), cz + r*Math.sin(t)]); });
const ringZ = (F, z, pts2) => pts2.map(([x, y]) => F.p([x, y, z]));
const circ2 = (cx, cy, r, n = 18) => ellUV(cx, cy, r, r, n);
// solid of revolution about the local x axis, profile [[x, r]...] convex; caps on the ends that face the viewer
function revX(F, prof, M, sh = toneI, w = 1, n = 24){
  const R = prof.map(([x, r]) => ringX(F, x, r, n)); let s = '';
  for (let i = 0; i < R.length - 1; i++) s += loft(R[i], R[i+1], nn => sh(nn, M));
  const ax = F.d([1,0,0]), nx = scl(ax, -1);
  if (vis(ax)) s += fill(pd(R[R.length-1]), sh(ax, M)) + ink(pd(R[R.length-1]), w*.6);
  if (vis(nx)) s += fill(pd(R[0]), sh(nx, M)) + ink(pd(R[0]), w*.6);
  return s + hullInk(R.flat(), w);
}
// a ring-shaped solid about the x axis (stator, winding end turns, end bells): bore, contents, outside, the end that faces you
function annX(F, x0, x1, r0, r1, M, sh = toneI, w = .8, n = 28, inner = '', op = 1){
  const A0 = ringX(F, x0, r0, n), A1 = ringX(F, x1, r0, n), B0 = ringX(F, x0, r1, n), B1 = ringX(F, x1, r1, n);
  const ax = F.d([1,0,0]), front = vis(ax), Bc = front ? B1 : B0, Ac = front ? A1 : A0, cn = front ? ax : scl(ax, -1);
  let o = loft(B0, B1, nn => sh(nn, M)) + `<path d="${pd(Bc)}${pd(Ac)}" fill="${sh(cn, M)}" fill-rule="evenodd"/>` + ink(pd(Bc), w*.7) + ink(pd(Ac), w*.6) + hullInk([...B0, ...B1], w);
  return loft(A0, A1, nn => mix(sh(nn, M), '#000000', .3), true) + inner + (op < 1 ? `<g opacity="${op}">${o}</g>` : o);
}
// a vertical prism in frame F: footprint pts2 (x, y), z0..z1; small footprints get an inked edge on every face
function slab(F, pts2, z0, z1, M, sh = toneI, w = .9){
  const A = ringZ(F, z0, pts2), B = ringZ(F, z1, pts2), up = F.d([0,0,1]), dn = scl(up, -1);
  let s = '';
  if (pts2.length <= 6){ const c = avg(pts2.map(([x, y]) => [x, y, 0]));
    for (let i = 0; i < pts2.length; i++){ const j = (i + 1) % pts2.length, [ax, ay] = pts2[i], [bx2, by] = pts2[j];
      let nn = [by - ay, -(bx2 - ax), 0]; if (nn[0]*((ax + bx2)/2 - c[0]) + nn[1]*((ay + by)/2 - c[1]) < 0) nn = scl(nn, -1);
      const wn = F.d(norm(nn)); if (vis(wn)) s += shape([A[i], A[j], B[j], B[i]], sh(wn, M), w*.6); } }
  else s += loft(A, B, nn => sh(nn, M));
  if (vis(up)) s += shape(B, sh(up, M), w*.6); if (vis(dn)) s += shape(A, sh(dn, M), w*.6);
  return s + hullInk([...A, ...B], w);
}
// a flat bar between two points of the (x, y) plane, width wd
const bar2 = (a, b, wd) => { const d = norm([b[0]-a[0], b[1]-a[1], 0]), n = [-d[1]*wd/2, d[0]*wd/2];
  return [[a[0]+n[0], a[1]+n[1]], [b[0]+n[0], b[1]+n[1]], [b[0]-n[0], b[1]-n[1]], [a[0]-n[0], a[1]-n[1]]]; };
const barEnds = (a, b, wd) => { const d = norm([b[0]-a[0], b[1]-a[1], 0]), n = [-d[1]*wd/2, d[0]*wd/2], e = [d[0]*wd/2, d[1]*wd/2];
  return [[a[0]+n[0]-e[0], a[1]+n[1]-e[1]], [b[0]+n[0]+e[0], b[1]+n[1]+e[1]], [b[0]-n[0]+e[0], b[1]-n[1]+e[1]], [a[0]-n[0]-e[0], a[1]-n[1]-e[1]]]; };
// spur gear about a vertical axis: sides, the face toward the viewer, a hub dot
function gearZ(F, cx, cy, z0, z1, r, nt, M, w = .7){
  const pts = []; for (let i = 0; i < nt*4; i++){ const a = (i + .5)/(nt*4)*2*Math.PI, rr = (i % 4 < 2) ? r : r - Math.min(.3, r*.18); pts.push([cx + rr*Math.cos(a), cy + rr*Math.sin(a)]); }
  const A = ringZ(F, z0, pts), B = ringZ(F, z1, pts), up = F.d([0,0,1]), cap = vis(up) ? B : A, cn = vis(up) ? up : scl(up, -1);
  return loft(A, B, nn => toneI(nn, M)) + shape(cap, toneI(cn, M), w*.6) + hullInk([...A, ...B], w);
}
// a rod between two local points, as an item
const rodItem = (F, a, b, r, M, w = .7, r1 = r, n = 14) => item(F, lboxOf([a, b]).map((c, i) => c.map(v => v + (i ? 1 : -1)*Math.max(r, r1))), rod(F.p(a), F.p(b), r, M, toneI, w, r1, n));
// ink on the half of a ring around the x axis that faces the viewer
function visArc(F, x, r, w = .6, col = INK, n = 48, cz = ZA){
  let s = '', seg = []; const out = () => { if (seg.length > 1) s += `<path d="${pd(seg, false)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`; seg = []; };
  for (let i = 0; i <= n; i++){ const t = i/n*2*Math.PI; if (vis(F.d([0, Math.cos(t), Math.sin(t)]))) seg.push(F.p([x, r*Math.cos(t), cz + r*Math.sin(t)])); else out(); }
  out(); return s;
}
// wires: cut into short pieces so they sort with the solids they pass
const bendPts = (pts, r = .7) => { if (pts.length < 3) return pts; const out = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++){ const [a, b, c] = [pts[i-1], pts[i], pts[i+1]];
    const la = Math.hypot(...a.map((v, k) => v - b[k])), lc = Math.hypot(...c.map((v, k) => v - b[k])), d = Math.min(r, la/2.2, lc/2.2);
    if (d < 1e-3){ out.push(b); continue; }
    const p = a.map((v, k) => b[k] + (v - b[k])*d/la), q = c.map((v, k) => b[k] + (v - b[k])*d/lc);
    for (let j = 0; j <= 4; j++){ const t = j/4; out.push([0,1,2].map(k => (1-t)*(1-t)*p[k] + 2*(1-t)*t*b[k] + t*t*q[k])); } }
  out.push(pts[pts.length-1]); return out; };
const stretch = (pts, e) => { const g = (a, b) => { const l = Math.hypot(...a.map((v, k) => v - b[k])) || 1; return a.map((v, k) => v + (v - b[k])*e/l); };
  return [g(pts[0], pts[1]), ...pts.slice(1, -1), g(pts[pts.length-1], pts[pts.length-2])]; };
const strokeSvg = (pts, col, w, F = WD) => `<path d="${pd(pts.map(F.p), false)}" fill="none" stroke="${INK}" style="stroke-width:${f2(2*w + .9*INK_K)}" stroke-linecap="round" stroke-linejoin="round"/><path d="${pd(stretch(pts, .35).map(F.p), false)}" fill="none" stroke="${col}" style="stroke-width:${f2(2*w)}" stroke-linecap="round" stroke-linejoin="round"/>`;
function wireItems(F, pts, col, w = .14, Ls = 2){
  const q = bendPts(pts), out = [];
  for (let i = 0; i < q.length - 1; ){
    let j = i + 1, len = 0; while (j < q.length - 1 && len < Ls){ len += Math.hypot(...q[j].map((v, k) => v - q[j-1][k])); j++; }
    if (len < Ls) while (j < q.length - 1) j++;
    const seg = q.slice(i, j + 1);
    out.push(item(F, lboxOf(seg), strokeSvg(seg, col, w, F))); i = j; }
  return out;
}

/* ---------- materials ---------- */
const IRON = matOf('#7a7f84'), LAM = { l:'#c3c9cc', m:'#98a0a4', d:'#646c70' }, COPPER = { l:'#f0b07a', m:'#d08a52', d:'#9a5a2c' };
const BRONZE = matOf('#d9ad62'), ALU = matOf('#d4d8da'), FELT = matOf('#c9a46a'), NYLON = matOf('#f4efe0'), NYLON2 = matOf('#ece2c4');
const KEYM = matOf('#f6f0de'), REDK = matOf('#e2483d'), CAPM = matOf('#4b78b8'), STEEL = matOf('#aab2b6'), SLEEVE = matOf('#6a655e');
const ROTM = matOf('#b6bcbf'), LIT = matOf('#ff9a3a'), FUSEM = matOf('#f3efe4');
const WC = { blk:'#2b2724', red:'#d8432f', wht:'#efe9da', blu:'#3c6fb4', brn:'#9a5a2c', yel:'#e8c03a' };
const GUARD_C = '#c9cfd2';

/* ---------- base ---------- */
function baseBody(st, m){
  let s = loft(BASE_A, BASE_B, n => tone(n, m)) + fill(pd(BASE_B), tone([0,0,1], m)) + ink(pd(BASE_B), 1.3);
  s += shape(on(PZ(BZ1 + .02), rrUV(21.3, PVY - 7.3, 26.3, PVY + 7.3, .6)), '#2b2523', 1);           // key slot
  // a moulded line round the base top and the printed speeds behind the keys
  s += ink(pd(on(PZ(BZ1 + .02), rrUV(12.4, 13.4, 25.6, 30.6, 3.8))), .6).replace('stroke="' + INK + '"', `stroke="${mix(m.d, m.l, .4)}"`);
  return s + hullInk([...BASE_A, ...BASE_B], 2.6);
}
const txZ = (x, y, z, str, size, col = INK) => `<text transform="${txM(P(x + size*.36, y, z), Dv(0,-1,0), Dv(1,0,0))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800">${str}</text>`;
function baseMech(st){
  const parts = [], put = (b, svg) => parts.push({ box: b, svg });
  const bx = (x0, y0, z0, x1, y1, z1, M, w = .7) => put([[x0, y0, z0], [x1, y1, z1]], box(x0, y0, z0, x1, y1, z1, M, toneI, w));
  const fl = BZ0 + .7, live = st.speed > 0;
  bx(11.6, 12.6, BZ0, 26.4, 31.4, fl, IRON, .8);                                                     // weight plate
  put([[PVX - 2.2, PVY - 2.2, fl], [PVX + 2.2, PVY + 2.2, BZ1]], cyl(PVX, PVY, fl, BZ1 - .05, 2.2, DARK, toneI, .8, 22));   // tube socket
  bx(21.0, PVY - 7.2, fl, 25.2, PVY + 7.2, BZ1 - 1.0, DARK, .8);                                       // switch block
  for (let i = 0; i < 4; i++){ const y = keyY(i), on1 = i > 0 && st.speed === i;
    bx(25.2, y - .5, fl + .5, 25.5, y + .5, BZ1 - 1.4, on1 ? LIT : COPPER, .5);                         // contact leaf
    bx(23.3, y - .45, BZ1 - 1.0, 24.3, y + .45, BZ1 - .25*(1 - st.key[i]) - .7*st.key[i], KEYM, .5); }   // plunger under the key
  put([[21.15, PVY - 7.6, BZ1 - .8], [21.65, PVY + 7.6, BZ1 - .3]], rod([21.4, PVY - 7.6, BZ1 - .55], [21.4, PVY + 7.6, BZ1 - .55], .25, METAL, toneI, .5, .25, 10));   // key pivot rod
  put([[12.7, PVY + 2.8, fl], [15.3, PVY + 8.2, fl + 2.6]], rod([14, PVY + 3, fl + 1.3], [14, PVY + 8, fl + 1.3], 1.3, CAPM, toneI, .8, 1.3, 20));   // run capacitor
  bx(13.7, PVY + 4.5, fl, 14.3, PVY + 5.2, fl + 2.7, METAL, .5);                                          // its strap
  // cord: grommet in the back wall, sheath, grip, the two mains cores to the switch
  put([[9.6, PVY + 5.5, 3.5], [11.2, PVY + 7.1, 5.1]], rod([9.6, PVY + 6.3, 4.3], [11.2, PVY + 6.3, 4.3], .8, DARK, toneI, .6, .8, 14));

  put([[0, -.8, ZA + 4.4], [.6, .8, ZA + 5.0]], rod(hP([.3, -.8, ZA + 4.7]), hP([.3, .8, ZA + 4.7]), .3, FUSEM, toneI, .5, .3, 10));
  [WC.blk, WC.red, WC.wht, WC.blu].forEach((col, i) => parts.push(...wireItems(HD, [[.5, -.45 + .3*i, ZA - 4.35], [.2, -.45 + .3*i, 2.9], [0, -.3 + .2*i, 1.95]], st.speed > 0 && (i === 0 || i === st.speed) ? '#ff7a3a' : col, .1, 1.5)));
  return sortAll(parts);
}
/* the gear train, inside the gearbox cover (see-through) */
function gearMech(st){
  const parts = [], run = st.w > .3, osc = st.osc && st.knob > .95, put = (lb, svg) => parts.push(item(HD, lb, svg));
  const drive = run && osc, NM = drive ? matOf('#ffd9a0') : NYLON;
  const [sx, sy] = SPIN, [ox, oy] = OUTS, cz = ZA + .45 + .5*(1 - st.knob);
  // shaft through the gearbox wall, the worm cut on it, the end bushing
  put([[-7.4, -.4, ZA - .4], [-6.5, .4, ZA + .4]], rod(hP([-7.4, 0, ZA]), hP([-6.5, 0, ZA]), .4, METAL, toneI, .6, .4, 12));
  let worm = revX(HD, [[-10.2, .78], [-7.4, .78]], run ? matOf('#f2f4f4') : STEEL, toneI, .7, 16), seg = [];
  const wl = () => { if (seg.length > 1) worm += ink(pd(seg, false), .45); seg = []; };
  for (let i = 0; i <= 140; i++){ const x = -10.2 + 2.8*i/140, t = (x + 10.2)/.45*2*Math.PI + st.ang;
    if (vis(hDir([0, Math.cos(t), Math.sin(t)]))) seg.push(hP([x, .8*Math.cos(t), ZA + .8*Math.sin(t)])); else wl(); }
  wl();
  put([[-10.2, -.8, ZA - .8], [-7.4, .8, ZA + .8]], worm);
  put([[-10.8, -.4, ZA - .4], [-10.2, .4, ZA + .4]], rod(hP([-10.8, 0, ZA]), hP([-10.2, 0, ZA]), .4, METAL, toneI, .6, .4, 12));
  put([[-11.4, -.9, ZA - .9], [-10.8, .9, ZA + .9]], slab(HD, rectUV(-11.4, -.9, -10.8, .9), ZA - .9, ZA + .9, DARK, toneI, .7));
  // worm wheel, dog clutch + spring, spindle pieces, pinion; output gear and shaft
  const wa = st.phi*7;
  put([[sx - 2.3, sy - 2.3, ZA - .45], [sx + 2.3, sy + 2.3, ZA + .45]], gearZ(HD, sx, sy, ZA - .45, ZA + .45, 2.3, 22, NM, .8)
    + (vis(hDir([0,0,1])) ? ink(pd([hP([sx, sy, ZA + .46]), hP([sx + 1.7*Math.cos(wa), sy + 1.7*Math.sin(wa), ZA + .46])], false), .4) : ''));
  put([[sx - .9, sy - .9, cz], [sx + .9, sy + .9, cz + .7]], slab(HD, circ2(sx, sy, .9, 12), cz, cz + .7, osc ? LIT : STEEL, toneI, .7));
  { const sp = [], z0 = cz + .7, z1 = GB.z1 - .2; for (let i = 0; i <= 90; i++){ const t = i/90*2*Math.PI*8; sp.push(hP([sx + .7*Math.cos(t), sy + .7*Math.sin(t), z0 + (z1 - z0)*i/90])); }
    put([[sx - .75, sy - .75, z0], [sx + .75, sy + .75, z1]], rod(hP([sx, sy, z0]), hP([sx, sy, z1]), .3, METAL, toneI, .5, .3, 10)
      + `<path d="${pd(sp, false)}" fill="none" stroke="${INK}" stroke-width="1.5"/><path d="${pd(sp, false)}" fill="none" stroke="#dfe4e6" stroke-width=".6"/>`); }
  put([[sx - .3, sy - .3, ZA - .45 - (ZA - .45 - 6.4)], [sx + .3, sy + .3, ZA - .45]], rod(hP([sx, sy, 6.4]), hP([sx, sy, ZA - .45]), .3, METAL, toneI, .5, .3, 10));
  put([[sx - .72, sy - .72, 5.6], [sx + .72, sy + .72, 6.4]], gearZ(HD, sx, sy, 5.6, 6.4, .72, 8, NM, .6));
  put([[sx - .3, sy - .3, GB.z0], [sx + .3, sy + .3, 5.6]], rod(hP([sx, sy, GB.z0]), hP([sx, sy, 5.6]), .3, METAL, toneI, .5, .3, 10));
  put([[ox - 2.4, oy - 2.4, 5.6], [ox + 2.4, oy + 2.4, 6.4]], gearZ(HD, ox, oy, 5.6, 6.4, 2.4, 24, drive ? matOf('#ffd9a0') : NYLON2, .8)
    + (vis(hDir([0,0,1])) ? ink(pd([hP([ox, oy, 6.41]), hP([ox + 1.8*Math.cos(st.phi), oy + 1.8*Math.sin(st.phi), 6.41])], false), .4) : ''));
  put([[ox - .45, oy - .45, GB.z0 + .5], [ox + .45, oy + .45, 5.6]], rod(hP([ox, oy, GB.z0 + .5]), hP([ox, oy, 5.6]), .45, STEEL, toneI, .6, .45, 12));
  put([[ox - .9, oy - .9, GB.z0], [ox + .9, oy + .9, GB.z0 + .5]], slab(HD, circ2(ox, oy, .9, 12), GB.z0, GB.z0 + .5, BRONZE, toneI, .6));
  return sortAll(parts);
}

/* ---------- cord, shadows ---------- */
function smooth3(pts, it = 3){
  for (let k = 0; k < it; k++){ const o = [pts[0]];
    for (let i = 0; i < pts.length - 1; i++){ const a = pts[i], b = pts[i+1]; o.push(a.map((v, j) => v*.75 + b[j]*.25), a.map((v, j) => v*.25 + b[j]*.75)); }
    o.push(pts[pts.length-1]); pts = o; }
  return pts;
}
function cordSvg(pts, r = .45){
  const d = pd(smooth3(pts), false), cap = 'fill="none" stroke-linecap="round" stroke-linejoin="round"';
  return `<path d="${d}" ${cap} stroke="${INK}" style="stroke-width:${f2(2*r + 1.8*INK_K)}"/><path d="${d}" ${cap} stroke="${DARK.l}" style="stroke-width:${f2(2*r)}"/>`;
}
const CORD_ON = [[9.4, PVY + 6.3, 4.3], [7.5, PVY + 6.6, BH + .5], [5, PVY + 8.5, BH + .45], [2, PVY + 10, BH + .45], [.3, PVY + 10.3, BH + .45]];
const CORD_OFF = [[.3, PVY + 10.3, BH + .45], [-1.2, PVY + 10.5, BH - .5], [-1.6, PVY + 10.6, -9]];
function shadows(st){
  const lite = s => s.split(SHADOW).join(mix(SHADOW, WOOD.l, .5));
  const head = [...HOUSING.flatMap(([x, r]) => ringX(HD, x, r, 12)), ...corners([[GB.x0, GB.y0, GB.z0], [GB.x1, GB.y1, GB.z1]]).map(hP)];
  return clipTo(BTOP, lite(castShadow(ringX(HD, X_RIM, GR_R, 32).concat(ringX(HD, xFront(0), 3.4, 8)), BH))
    + castShadow([...BASE_A, ...BASE_B], BH) + castShadow([...on(PZ(BZ1), circ2(PVX, PVY, 1.6, 10)), ...on(PZ(ZT + 1), circ2(PVX, PVY, 2, 10))], BH)
    + castShadow(head, BH));
}

/* ---------- labels ---------- */
// core's xrCallouts, except that the right-hand column starts below the stats panel and the See-through / Labels switches
function fanCallouts(items, B){
  const pts = []; for (const x of [B[0], B[1]]) for (const y of [B[2], B[3]]) for (const z of [B[4], B[5]]) pts.push(P(x, y, z));
  const xmin = Math.min(...pts.map(p => p[0])), xmax = Math.max(...pts.map(p => p[0])), cx = (xmin + xmax)/2;
  // on a phone (LBL_U = drawing units per screen px) each label is a numbered badge and the names go in a legend under the figure
  const k = INK_K, u = window.LBL_U ? LBL_U() : 0, fs = u ? 10*u : 8.6*k, hgt = u ? 17*u : fs*1.8, gap = hgt + (u ? 3*u : 3*k);
  const L = [], R = [];
  const svgEl = document.getElementById('fig'), vb = svgEl.viewBox.baseVal, btn = document.getElementById('btns');
  const wMax = u ? hgt*1.3 + 12*k : Math.max(...items.map(it => it.text.length))*fs*.62 + fs*1.5 + 12*k;
  const roomL = xmin - vb.x >= wMax, roomR = vb.x + vb.width - xmax >= wMax;
  const xs = items.map(it => P(...it.at)[0]).sort((a, b) => a - b), mid = xs.length ? xs[Math.floor(xs.length/2)] : cx;   // split at the median: even columns
  for (const it of items){ const [X, Y] = P(...it.at); ((X < mid && roomL) || !roomR ? L : R).push({ ...it, X, Y }); }
  let s = '';
  let top = { [-1]: fs, [1]: fs + 30*k };
  if (btn && svgEl.getScreenCTM()){ const r = btn.getBoundingClientRect(), q = new DOMPoint(r.right, r.bottom + 50).matrixTransform(svgEl.getScreenCTM().inverse());
    if (q.y > 0) top[-1] = q.y + hgt; }
  const vs = document.querySelector('.vset');   // (the one change from core's xrCallouts) the right column starts under the stats and switches
  if (vs && !u && svgEl.getScreenCTM() && vs.getBoundingClientRect().bottom < svgEl.getBoundingClientRect().top + .35*svgEl.getBoundingClientRect().height){ const r = vs.getBoundingClientRect(), q = new DOMPoint(r.left, r.bottom + 14).matrixTransform(svgEl.getScreenCTM().inverse()); if (q.y > 0) top[1] = q.y + hgt/2; }
  for (const [col, side] of [[L, -1], [R, 1]]){

    let y = -1e9; for (const c of col){ c.py = Math.max(c.Y, y + gap, top[side]); y = c.py; }
    const shift = col.length ? Math.max(0, col.reduce((a, c) => a + c.py - c.Y, 0) / col.length) : 0;
    const room = col.length ? col[0].py - top[side] : 0; for (const c of col) c.py -= Math.min(shift, room);
    for (const c of col){
      c.n = ((window.__ln || (window.__ln = {}))[c.text] || (__ln[c.text] = Object.keys(__ln).length + 1)); const w = u ? hgt*(c.n > 9 ? 1.3 : 1) : c.text.length*fs*.62 + fs*1.5;
      let px = side < 0 ? xmin - 10*k - w/2 : xmax + 10*k + w/2; px = Math.max(vb.x + w/2 + 2*k, Math.min(vb.x + vb.width - w/2 - 2*k, px));
      const ex = px - side*w/2;
      s += `<g class="tag${c.on ? ' on' : ''}" data-n="${c.n}" data-t="${c.text}"><path d="M${f(c.X)} ${f(c.Y)}L${f(ex + side*-4*k)} ${f(c.py)}L${f(ex)} ${f(c.py)}" fill="none" stroke="${INK}" stroke-width="1"/>`
        + `<circle cx="${f(c.X)}" cy="${f(c.Y)}" r="${f(1.4*k)}" fill="${INK}"/>`
        + `<rect x="${f(px - w/2)}" y="${f(c.py - hgt/2)}" width="${f(w)}" height="${f(hgt)}" rx="${f(hgt/2)}" fill="${c.on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
        + `<text x="${f(px)}" y="${f(c.py + fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${u ? c.n : c.text}</text></g>`;
    }
  }
  return s;
}
function labels(st, k){
  const B = [4, 28, 6, 38, 0, 47], run = st.w > .3, osc = st.osc && st.knob > .95, swing = run && osc, live = st.speed > 0, tilting = st.tK < 1;
  const H = p => hP(p);

    const bl = run ? rad(60) : st.ang + BLADE_SW(9);
    return fanCallouts([
      { at: H([XB, 9*Math.cos(bl), ZA + 9*Math.sin(bl)]), text:'BLADES', on: run },
      { at: H([8.4, 0, ZA + .5]), text:'SPINNER', on: false },
      { at: H([xFront(13.5), 13.5*Math.cos(rad(200)), ZA + 13.5*Math.sin(rad(200))]), text:'FRONT GUARD', on: false },
      { at: H([xRear(14.9), 14.9*Math.cos(rad(-35)), ZA + 14.9*Math.sin(rad(-35))]), text:'REAR GUARD', on: false },
      { at: H([4.2, 0, ZA + 3.5]), text:'GUARD NUT', on: false },
      { at: H([2.8, 0, ZA + .4]), text:'MOTOR SHAFT', on: run },
      { at: H([-.3, 0, ZA - 1.4]), text:'ROTOR', on: run },
      { at: H([-1.9, 0, ZA + 5.2]), text:'STATOR', on: live },
      { at: H([.8, 3.4*Math.cos(rad(-40)), ZA + 3.4*Math.sin(rad(-40))]), text:'WINDINGS', on: live },
      { at: H([2.6, 0, ZA - 1.0]), text:'FRONT BEARING', on: run },
      { at: H([-6.0, 0, ZA + 1.0]), text:'REAR BEARING', on: run },
      { at: H([1.0, 4.75*Math.cos(rad(45)), ZA + 4.75*Math.sin(rad(45))]), text:'THROUGH BOLT', on: false },
      { at: H([.3, 0, ZA + 5.0]), text:'THERMAL FUSE', on: false },
      { at: H([.2, 0, 2.6]), text:'MOTOR LEADS', on: live },
      { at: H([-8.8, 0, ZA + .8]), text:'WORM', on: run },
      { at: H([SPIN[0] - 1.6, SPIN[1] - 1.6, ZA + .45]), text:'WORM WHEEL', on: swing },
      { at: H([SPIN[0] + .9, SPIN[1], ZA + .8 + .5*(1 - st.knob)]), text:'CLUTCH', on: osc },
      { at: H([SPIN[0], SPIN[1] + .7, 6.0]), text:'PINION', on: swing },
      { at: H([OUTS[0] - 1.7, OUTS[1] + 1.7, 6.4]), text:'OUTPUT GEAR', on: swing },
      { at: H([SPIN[0], SPIN[1], GB.z1 + 1.55 + 1.0*(1 - st.knob)]), text:'OSCILLATION KNOB', on: osc },
      { at: H([(OUTS[0] + pin[0])/2, (OUTS[1] + pin[1])/2, 1.6]), text:'CRANK ARM', on: swing },
      { at: H([(pin[0] + aH[0])/2, (pin[1] + aH[1])/2, .85]), text:'CONNECTING LINK', on: swing },
      { at: kP([A_FR[0], A_FR[1], KH + 1.15]), text:'ANCHOR PIN', on: swing },
      { at: H([0, 1.0, .4]), text:'SWIVEL POST', on: swing },
      { at: [PVX, PVY + 3.9, ZT + .8], text:'TILT KNOB', on: tilting },
      { at: [PVX, PVY - 2.75, ZT], text:'TILT BOLT', on: tilting },
      { at: [PVX + 1.25*CAM_R[0], PVY + 1.25*CAM_R[1], 11.5], text:'STAND TUBE', on: false },
      { at: [PVX, PVY, 14.5], text:'WIRING HARNESS', on: live },
      { at: [KEY_X[1], keyY(1), BZ1 + 1.3 - .95*st.key[1]], text:'SPEED KEYS', on: live },
      { at: [25.5, keyY(2), BZ1 - 1.6], text:'SWITCH CONTACTS', on: live },
      { at: [14, PVY + 6.5, BZ0 + .7 + 2.6], text:'RUN CAPACITOR', on: live },
      { at: [26.4, 13.5, BZ0 + .7], text:'BASE WEIGHT', on: false },
      { at: [12.4, PVY + 6.6, 4.5], text:'CORD GRIP', on: false },
    ], B);
  }
  return fanCallouts([
    { at: [KEY_X[1], keyY(2), BZ1 + 1.3 - .95*st.key[2]], text:'SPEED KEYS', on: live },
    { at: H([SPIN[0], SPIN[1], GB.z1 + 1.55 + 1.0*(1 - st.knob)]), text:'OSCILLATION KNOB', on: osc },
    { at: [PVX, PVY + 3.9, ZT + .8], text:'TILT KNOB', on: tilting },
    { at: H([XB, 9*Math.cos(rad(60)), ZA + 9*Math.sin(rad(60))]), text:'BLADES', on: run },
    { at: H([xFront(10.2), 10.2*Math.cos(rad(200)), ZA + 10.2*Math.sin(rad(200))]), text:'GUARD', on: false },
    { at: H([-2, 0, ZA + 6.1]), text:'MOTOR HOUSING', on: live },

}

/* ---------- scene ---------- */
function scene(st, m){
  setFrames(st); VL = toHead(CAM_V);
  const k = ease(st.xr || 0), behind = facing([-1,0,0]);
  let s = (behind ? '' : cordSvg(CORD_OFF)) + board(0, 0, BW, BDP, BH, BRAD, WOOD) + (behind ? cordSvg(CORD_OFF) : '') + shadows(st);
  const cord = { box: [[0, PVY + 5.5, BH], [9.6, PVY + 10.8, 4.8]], svg: cordSvg(CORD_ON) + rod([9.0, PVY + 6.3, 4.3], [10.2, PVY + 6.3, 4.3], .85, DARK, toneI, .8, .85, 12) };
  s += sortAll([cord, ...baseItems(st, m, k), ...standItems(st, m, k), ...headItems(st, m, k)]);
  return s + labels(st, k);
}

/* ---------- behaviour (one state object, one clock) ---------- */
let ui, loopOn = false;
function stepSim(st, dt){
  const wt = W_SPD[st.speed];
  st.w += (wt - st.w)*Math.min(1, dt*(wt > st.w ? 1.5 : .8)); if (Math.abs(st.w - wt) < .08) st.w = wt;
  st.ang += st.w*dt;
  const kg = st.osc ? 1 : 0; st.knob += Math.sign(kg - st.knob)*Math.min(Math.abs(kg - st.knob), dt/.22);
  if (st.osc && st.knob > .95) st.phi += st.w/GEAR_K*dt;
  st.psi = psiOf(st.phi);
  st.zeroT = Math.max(0, st.zeroT - dt);
  for (let i = 0; i < 4; i++){ const g = (i > 0 && st.speed === i) || (i === 0 && st.zeroT > 0) ? 1 : 0; st.key[i] += Math.sign(g - st.key[i])*Math.min(Math.abs(g - st.key[i]), dt/.12); }
  if (st.tK < 1){ st.tK = Math.min(1, st.tK + dt/.9); st.tiltA = st.tFrom + (TILTS[st.tilt].a - st.tFrom)*ease(st.tK); }
  return st.w > 0 || st.tK < 1 || st.zeroT > 0 || Math.abs(kg - st.knob) > 1e-3 || st.key.some((v, i) => Math.abs(v - ((i > 0 && st.speed === i) ? 1 : 0)) > 1e-3);
}
function runLoop(){
  if (loopOn) return; loopOn = true;
  ui.animate(dt => { const busy = stepSim(ui.st, dt); if (!busy) loopOn = false; return busy; });
}
function setSpeed(st, i){
  if (i === 0 && st.speed === 0) return ui.flash('the fan is already off');
  if (i === 0) st.zeroT = .25;
  st.speed = i; runLoop();
  if (i > 0 && !st.osc && st.w === 0) ui.flash(`speed ${i}: about ${W_SPD[i]*RPM_K} rpm`);
}
function toggleOsc(st){
  st.osc = !st.osc; runLoop();
  if (st.osc && st.speed === 0) ui.flash('oscillation set: the head swings once the motor runs');
}
function setTilt(st, key){
  if (st.tilt === key && st.tK >= 1) return ui.flash('the head is already there');
  st.tilt = key; st.tFrom = st.tiltA; st.tK = 0; runLoop();
}
const tiltNext = st => { const o = Object.keys(TILTS), i = o.indexOf(st.tilt); return o[(i + 1) % o.length]; };

ui = mountFigure({
  fig:'21', title:'Desk fan', size:[BW, BDP, 47], palette:'mint', turn:'full',
  state:{ speed:0, w:0, ang:.35, osc:false, knob:0, phi:PHI0, psi:0, tilt:'level', tiltA:0, tFrom:0, tK:1, zeroT:0, key:[0,0,0,0] },
  scene,
  stats: st => [{ label:'Blades', value: st.w > .3 ? `${Math.round(st.w*RPM_K/10)*10} rpm` : 'still' },
                { label:'Head turned', value: Math.abs(st.psi) < 1 ? 'ahead' : `${Math.round(Math.abs(st.psi))}° ${st.psi > 0 ? 'left' : 'right'}`, small:true }],
  buttons:[
    { label:'Speed', choices: st => [0, 1, 2, 3].map(i => ({ label: SPD_N[i], current: st.speed === i, onClick: st => setSpeed(st, i) })) },
    { label:'Oscillate on / off', onClick: st => toggleOsc(st) },
    { label:'Tilt the head', choices: st => Object.keys(TILTS).map(key => ({ label: TILTS[key].label, current: st.tilt === key && st.tK >= 1, onClick: st => setTilt(st, key) })) },
  ],
  acts:{ k0: st => setSpeed(st, 0), k1: st => setSpeed(st, 1), k2: st => setSpeed(st, 2), k3: st => setSpeed(st, 3),
         knob: st => toggleOsc(st), tilt: st => setTilt(st, tiltNext(st)), blades: st => setSpeed(st, (st.speed + 1) % 4) },
  params:(st, q) => {
    if (q.has('speed')){ st.speed = Math.max(0, Math.min(3, +q.get('speed') | 0)); st.w = W_SPD[st.speed]; st.key = [0,1,2,3].map(i => i > 0 && i === st.speed ? 1 : 0); }
    if (q.get('osc') === '1'){ st.osc = true; st.knob = 1; }
    if (q.has('phi')) st.phi = +q.get('phi');
    if (q.has('ang')) st.ang = +q.get('ang');
    if (TILTS[q.get('tilt')]){ st.tilt = q.get('tilt'); st.tiltA = TILTS[st.tilt].a; }
    st.psi = psiOf(st.phi);
    if (q.get('still') === '1') st.still = true;
  },
});
if (ui.st.w > 0 && !ui.st.still) runLoop();
xrMount(() => ui, () => '');
</script></body></html>
