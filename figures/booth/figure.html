<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toilet booth</title></head><body>
<script src="core.js"></script>
<script>
/* Toilet booth: a self-cleaning street toilet (the automatic public toilet kind).
   TRUTH FIRST
   - You pay at a panel by the door (coin or card). The coin acceptor checks the coin and drops it down a chute into a
     locked cash box; the controller (a PLC in the technical room) then pulls the electric lock bolt and the door motor
     drives the door open along a top track with a toothed belt. The door is a sliding panel that runs into a pocket in the
     front wall; a rubber safety edge on its leading edge stops it closing on someone.
   - The booth is two rooms: the cabin, and behind a partition the technical room, reached by a service door at the back.
     Everything wet or electrical lives in the technical room.
   - Inside, a presence sensor in the ceiling and load cells under the floor plate tell the controller someone is in. The
     door closes and locks, the light outside turns red. A flush tank (cistern) high in the technical room empties through
     a flush valve and pipe into the stainless bowl; a solenoid valve on the mains refills it. Hand wash unit: soap, water
     (from a small heater), warm air.
   - After the user leaves and the load cells read empty, the door closes and the wash cycle runs (light amber): the bowl
     slides back through a hatch into the technical room on rails, driven by a motor and lead screw, where a spray bar
     washes it; a pump feeds jets along the skirting that wash the floor, which slopes to a drain gully; a blower dries it.
     The bowl slides back and the light goes green.
   PARTS (each held by another)
   DOOR    sliding door . safety edge . top track . hangers + rollers . toothed belt on two pulleys . belt clamp . gearmotor .
           lock housing + bolt in the jamb . door-closed sensor . status light over the door
   PAY     panel: display, coin slot, card pad . display board . coin acceptor . coin chute . cash box . card reader
   TECH    controller cabinet (PLC + relays) . fuse box . water heater . flush tank + fill valve + flush valve + flush pipe .
           mains inlet + stop valve + solenoid valve manifold . wash pump . bowl rails + actuator (motor, lead screw, nut) .
           bowl spray bar . floor dryer blower + duct . vent fan + duct to the roof grille . cables from the controller
   CABIN   bowl on its back block . paper roll . hand wash unit . grab rail . help button . floor plate on load cells .
           drain grate + gully + sewer pipe . floor wash manifold + nozzles . presence sensor . LED light
   x = depth (front at x = W), y = width (+y to the viewer's left), z = up; 1 unit = 1 cm. */
const W = 200, D = 250, H = 250, BR = 16, FT = 10;
const CX0 = 62, CX1 = W - FT, CY0 = 56, CY1 = D - 4, CZ0 = 10, CZ1 = 224;     // cabin
const DY0 = 140, DY1 = 226, DW = DY1 - DY0, DZ1 = 210;                        // door opening (door slides to lower y)
const RING = rrUV(0, 0, W, D, BR), RA = on(PZ(0), RING), RB = on(PZ(H), RING);
const ROOF = rrUV(-6, -6, W + 6, D + 6, BR + 6), RFA = on(PZ(H), ROOF), RFB = on(PZ(H + 12), ROOF);
const PLIN = rrUV(-1, -1, W + 1, D + 1, BR + 1);
const PX_OUT = W + 58, PX_IN = 142, PY0 = 183, BOWL_RET = 44;
const BM = { door: matOf('#c3ccd0'), frame: matOf('#7f8a8f'), tile: matOf('#eef0ec'), floor: matOf('#93a0a6'), steel: METAL,
  grey: matOf('#a9b1b5'), black: matOf('#3a3632'), water: matOf('#7cc3ec'), copper: matOf('#d08a52'), pvc: matOf('#a3a8ab'),
  pcb: matOf('#4fa36a'), brass: matOf('#d8b25a'), white: CERAMIC, red: matOf('#e2483d'), pump: matOf('#5c7fa3'), gold: matOf('#e8c45a'),
  jacket: matOf('#5a82c6'), trousers: matOf('#4a4f5c'), skin: matOf('#e9b48f'), shoe: matOf('#2d2a27'), hat: matOf('#ef6a4c'),
  concrete: matOf('#b3afa5') };
const LAMP = { free: '#43c25c', busy: '#e2483d', clean: '#f0a92a' };
const LAMP_T = { free: 'FREE', busy: 'IN USE', clean: 'CLEANING' };
const WATER = '#5fb4e8';

/* ---------- small helpers ---------- */
const bthBoxOf = (pts, e = .05) => [[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - e), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + e)];
const bthBend = (pts, r = 2.5) => { if (pts.length < 3) return pts; const out = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++){ const [a, b, c] = [pts[i - 1], pts[i], pts[i + 1]];
    const la = Math.hypot(...a.map((v, k) => v - b[k])), lc = Math.hypot(...c.map((v, k) => v - b[k])), d = Math.min(r, la/2.2, lc/2.2);
    if (d < 1e-3){ out.push(b); continue; }
    const p = a.map((v, k) => b[k] + (v - b[k]) * d/la), q = c.map((v, k) => b[k] + (v - b[k]) * d/lc);
    for (let j = 0; j <= 4; j++){ const t = j/4; out.push([0,1,2].map(k => (1-t)*(1-t)*p[k] + 2*(1-t)*t*b[k] + t*t*q[k])); } }
  out.push(pts[pts.length - 1]); return out; };
// a pipe or cable cut into short pieces, each with its own box, so byDepth sorts it among the solids it passes
const bthWire = (pts, col, w = .5, Lseg = 10) => { const q = bthBend(pts), out = [];
  for (let i = 0; i < q.length - 1; ){
    let j = i + 1, len = 0; while (j < q.length - 1 && len < Lseg){ len += Math.hypot(...q[j].map((v, k) => v - q[j - 1][k])); j++; }
    if (len < Lseg) while (j < q.length - 1) j++;
    const seg = q.slice(i, j + 1), d = pd(seg, false);
    out.push({ box: bthBoxOf(seg, w), svg: `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${f(2*w + .9)}" stroke-linecap="round" stroke-linejoin="round"/>`
      + `<path d="${d}" fill="none" stroke="${col}" stroke-width="${f(2*w)}" stroke-linecap="round" stroke-linejoin="round"/>` }); i = j; }
  return out; };
// a rigid pipe: one rod per straight run, a ball at each joint
const bthPipe = (pts, r, m) => { const out = [];
  for (let i = 0; i < pts.length - 1; i++) out.push({ box: bthBoxOf([pts[i], pts[i + 1]], r), svg: rod(pts[i], pts[i + 1], r, m, toneI, .9) });
  for (let i = 1; i < pts.length - 1; i++){ const [X, Y] = P(...pts[i]);
    out.push({ box: bthBoxOf([pts[i]], r + .1), svg: `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(r*CAM_K)}" fill="${toneI([0,0,1], m)}" stroke="${INK}" stroke-width=".9"/>` }); }
  return out; };
const fr = (y0, z0, y1, z1, r = 0, dx = .3) => on(PX(W + dx), r > 0 ? rrUV(y0, z0, y1, z1, r, 4) : rectUV(y0, z0, y1, z1));
const bthTxB = (x,y,z,str,size,col=INK,weight=700) => `<text transform="${txM(P(x,y,z), Dv(0,1,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`;
const bthTxR = (x,y,z,str,size,col=INK,weight=700) => `<text transform="${txM(P(x,y,z), Dv(-1,0,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`;
const cl01 = v => Math.max(0, Math.min(1, v));
const inside = st => st.px < W - 14;

/* ---------- the person ---------- */
function bthPersonZ(x){ return x <= W - FT ? CZ0 : x >= W + 6 ? 0 : CZ0 * (1 - (x - (W - FT)) / (FT + 6)); }
function bthPerson(st){
  const x = st.px, y = PY0, z0 = bthPersonZ(x), sw = st.moving ? Math.sin(st.walk) : 0, out = [], put = (b, svg) => out.push({ box: b, svg });
  for (const sd of [-1, 1]){
    const fx = x + sd*sw*12, yy = y + sd*7, hip = [x, yy, z0 + 84], foot = [fx, yy, z0 + 5];
    put([[Math.min(x, fx) - 5.5, yy - 5.5, z0 + 5], [Math.max(x, fx) + 5.5, yy + 5.5, z0 + 84]], rod(hip, foot, 5.4, BM.trousers, toneI, 1.1, 4.8));
    put([[fx - 8, yy - 4.6, z0], [fx + 7, yy + 4.6, z0 + 5]], box(fx - 8, yy - 4.4, z0, fx + 7, yy + 4.4, z0 + 5, BM.shoe, toneI, .9));
    const sh = [x, y + sd*19.5, z0 + 135], hd = [x - sd*sw*10, y + sd*20.5, z0 + 90], [hx, hy] = P(...hd);
    put([[Math.min(x, hd[0]) - 4.3, y + (sd > 0 ? 15.2 : -25), z0 + 86], [Math.max(x, hd[0]) + 4.3, y + (sd > 0 ? 25 : -15.2), z0 + 140]],
      rod(sh, hd, 4.4, BM.jacket, toneI, 1, 3.8) + `<circle cx="${f(hx)}" cy="${f(hy)}" r="${f(3.6*CAM_K)}" fill="${BM.skin.l}" stroke="${INK}" stroke-width=".8"/>`);
  }
  put([[x - 15, y - 15, z0 + 84], [x + 15, y + 15, z0 + 142]], rod([x, y, z0 + 84], [x, y, z0 + 142], 15, BM.jacket, toneI, 1.3, 13.5));
  const [hx, hy] = P(x, y, z0 + 156);
  put([[x - 10.6, y - 10.6, z0 + 142], [x + 10.6, y + 10.6, z0 + 170]], rod([x, y, z0 + 140], [x, y, z0 + 148], 4.6, BM.skin, toneI, .9)
    + `<circle cx="${f(hx)}" cy="${f(hy)}" r="${f(10.5*CAM_K)}" fill="${BM.skin.l}" stroke="${INK}" stroke-width="1.1"/>`
    + rod([x, y, z0 + 158.5], [x, y, z0 + 169], 10.7, BM.hat, toneI, 1, 5.5));
  return out;
}
const bthPersonPts = st => { const x = st.px, y = PY0, z0 = bthPersonZ(x); return [[x - 9, y - 13, z0], [x + 9, y + 13, z0], [x - 6, y - 20, z0 + 140], [x + 6, y + 20, z0 + 140], [x, y, z0 + 168]]; };

/* ---------- the cabin's furniture (seen through the open door, and in the see-through) ---------- */
function bthBowl(st, put){
  const dx = -BOWL_RET*st.bowl, cx = 88 + dx, cy = 200;
  put([[62 + dx, 184, 10], [70 + dx, 216, 76]], box(62 + dx, 184, 10, 70 + dx, 216, 76, BM.steel, toneI, 1));
  const A = on(PZ(10), ellUV(cx - 3, cy, 9, 8, 20)), B = on(PZ(46), ellUV(cx, cy, 17, 14.5, 20));
  let water = '';
  if (st.bowl < .05){ const sw = on(PZ(38), ellUV(cx + 1, cy, 10.5, 8.5, 18));
    water = fill(pd(sw), st.flowF ? '#8fd0f2' : '#c4e6f3') + ink(pd(sw), .5);
    if (st.flowF) for (let i = 0; i < 3; i++){ const a0 = st.spin*60 + i*120;
      water += line(on(PZ(38.2), arcUV(cx + 1, cy, 7 - i*1.6, a0, a0 + 150, 8)).map(([u, v, z]) => [u, cy + (v - cy)*.8, z]), .7); } }
  put([[70 + dx, 185, 10], [106 + dx, 215, 46]], openShell(A, B, n => toneI(n, BM.steel), water) + ink(pd(B), 1.1) + hullInk([...A, ...B], 1.4));
}
function bthCabin(st){
  const parts = [], put = (b, svg) => parts.push({ box: b, svg });
  const bx = (x0,y0,z0,x1,y1,z1,mm,w=.8) => put([[x0,y0,z0],[x1,y1,z1]], box(x0,y0,z0,x1,y1,z1,mm,toneI,w));
  bthBowl(st, put);
  bx(CX0, 220, 66, CX0 + 10, 234, 82, BM.white);                                                   // paper roll
  // hand wash unit set in the right-hand wall: steel panel, basin, tap, soap, dryer
  bx(118, CY0 - 1, 78, 162, CY0, 124, BM.steel, .9);
  bx(124, CY0, 86, 156, CY0 + 14, 94, BM.white, .9);
  bx(130, CY0, 108, 134, CY0 + 7, 112, BM.steel, .6);
  bx(138, CY0, 108, 142, CY0 + 7, 112, BM.white, .6);
  bx(146, CY0, 106, 154, CY0 + 8, 114, BM.black, .6);
  // grab rail and help button on the left-hand wall
  put([[82, CY1 - 9, 78], [142, CY1, 82]], rod([88, CY1, 80], [88, CY1 - 7, 80], 1.2, METAL, toneI, .6) + rod([136, CY1, 80], [136, CY1 - 7, 80], 1.2, METAL, toneI, .6)
    + rod([84, CY1 - 7, 80], [140, CY1 - 7, 80], 1.6, METAL, toneI, .8));
  put([[150, CY1 - 3, 112], [164, CY1, 128]], box(150, CY1 - 3, 112, 164, CY1, 128, BM.steel, toneI, .7)
    + (vis([0,-1,0]) ? shape(on(PY(CY1 - 3.1), ellUV(157, 120, 4, 4, 14)), BM.red.l, .7) : ''));
  if (inside(st)) parts.push(...bthPerson(st));
  return parts;
}
// the floor drain grate, flush with the floor
const bthGrate = () => { let s = shape(on(PZ(CZ0 + .1), rectUV(120, 140, 136, 156)), '#6d777c', .8), g = '';
  for (let x = 123; x <= 133; x += 2.5) g += pd(on(PZ(CZ0 + .15), [[x, 142], [x, 154]]), false);
  return s + `<path d="${g}" fill="none" stroke="${INK}" stroke-width=".7"/>`; };

function bthInterior(st, e){
  const T = BM.tile;
  let s = fill(pd(on(PZ(CZ0), rectUV(CX0, CY0, W, CY1))), toneI([0,0,1], BM.floor)) + bthGrate();
  s += fill(pd(on(PX(CX0), rectUV(CY0, CZ0, CY1, CZ1))), toneI([1,0,0], T));
  s += `<path d="${pd(on(PX(CX0 + .1), rectUV(182, CZ0, 218, 78)))}" fill="none" stroke="${INK}" stroke-width=".7" opacity=".6"/>`;   // the bowl hatch
  if (vis([0,1,0])) s += fill(pd(on(PY(CY0), rectUV(CX0, CZ0, W, CZ1))), toneI([0,1,0], T));
  if (vis([0,-1,0])) s += fill(pd(on(PY(CY1), rectUV(CX0, CZ0, W, CZ1))), toneI([0,-1,0], T));
  s += `<path d="${pd(on(PX(CX0 + .1), [[CY0, 120], [CY1, 120]]), false)}" fill="none" stroke="${INK}" stroke-width=".6" opacity=".35"/>`;
  s += byDepth(bthCabin(st));
  // the doorway: the door's leading edge and the fixed jamb
  if (vis([0,1,0])) s += shape(on(PY(e), rectUV(W - FT, CZ0, W, DZ1)), toneI([0,1,0], BM.door), .8) + fill(pd(on(PY(e + .1), rectUV(W - 4, CZ0 + 2, W, DZ1 - 2))), '#2d2a27');
  if (vis([0,-1,0])) s += shape(on(PY(DY1), rectUV(W - FT, CZ0, W, DZ1)), toneI([0,-1,0], BM.frame), .8);
  return s;
}

/* ---------- the outside of the booth ---------- */
const bthCoinAt = c => { const pts = [[W + 16, 34, 142], [W, 34, 142], [W - 22, 34, 140], [W - 26, 34, 128], [W - 30, 34, 62]];
  const L = []; let tot = 0; for (let i = 1; i < pts.length; i++){ const l = Math.hypot(...sub(pts[i], pts[i - 1])); L.push(l); tot += l; }
  let d = c*tot; for (let i = 0; i < L.length; i++){ if (d <= L[i] || i === L.length - 1){ const t = Math.min(1, d / L[i]); return pts[i].map((v, k) => v + (pts[i + 1][k] - v)*t); } d -= L[i]; }
  return pts[pts.length - 1]; };
const bthCoin = p => rod([p[0], p[1] - .9, p[2]], [p[0], p[1] + .9, p[2]], 4.5, BM.gold, toneI, .8);

function bthFront(st, m){
  const e = DY1 - DW*st.door, fm = tone([1,0,0], m);
  let s = '';
  // door frame, the visible part of the door, the opening
  s += shape(fr(DY0 - 5, CZ0, DY1 + 5, DZ1 + 5, 0, .2), tone([1,0,0], BM.frame), 1);
  if (e - DY0 > .5){ s += shape(fr(DY0, CZ0, e, DZ1, 0, .3), tone([1,0,0], BM.door), 1);
    let g = ''; for (const z of [60, 110, 160]) g += pd(on(PX(W + .35), [[DY0 + 1, z], [Math.max(DY0 + 1, e - 4), z]]), false);
    s += `<path d="${g}" fill="none" stroke="${INK}" stroke-width=".6" opacity=".55"/>`;
    s += fill(pd(fr(Math.max(DY0, e - 2.5), CZ0 + 2, e, DZ1 - 2, 0, .4)), '#2d2a27'); }
  if (st.door > .01) s += clipTo(fr(e, CZ0, DY1, DZ1, 0, 0), bthInterior(st, e)) + ink(pd(fr(e, CZ0, DY1, DZ1, 0, .3)), 1.1);
  // status light over the door, the name on the fascia, the WC sign
  s += shape(fr(152, 213, 214, 222, 3, .3), LAMP[st.light], 1) + tx(W + .4, 183, 215.6, LAMP_T[st.light], 6, '#ffffff', 800);
  s += tx(W + .4, 183, 230, 'TOILET', 12, INK, 800);
  s += shape(on(PX(W + .3), ellUV(34, 222, 12.5, 12.5, 24)), '#fff4d6', 1.2) + tx(W + .4, 34, 218.4, 'WC', 10, INK, 800);
  // the pay panel: display, coin slot, card pad
  const disp = st.phase === 'pay' ? (st.coin >= 0 ? 'COIN' : 'PAID') : st.phase === 'open' ? 'ENTER' : st.light === 'busy' ? 'BUSY' : st.light === 'clean' ? 'WAIT' : '0.50';
  let p = shape(fr(16, 96, 52, 196, 4, .3), tone([1,0,0], BM.steel), 1.2);
  p += shape(fr(21, 166, 47, 186, 1.5, .4), '#1d2b26', .8) + tx(W + .5, 34, 173.4, disp, 6.4, '#7dffa6', 800);
  p += tx(W + .5, 34, 157, 'PAY HERE', 3.4, INK, 800);
  p += shape(fr(30, 134, 38, 150, 1.5, .4), '#c9cfd2', .8) + fill(pd(fr(33.3, 136, 34.7, 148, 0, .5)), INK) + tx(W + .5, 34, 128.6, 'COINS', 3.2, INK, 700);
  p += shape(fr(24, 106, 44, 122, 2, .4), '#2d3236', .8);
  for (const r of [2.5, 4.5, 6.5]) p += `<path d="${pd(on(PX(W + .5), arcUV(30, 114, r, -40, 40, 6)), false)}" fill="none" stroke="#fff4d6" stroke-width=".8"/>`;
  p += tx(W + .5, 34, 100.4, 'CARD', 3.2, INK, 700);
  s += act('pay', p);
  if (st.phase === 'pay' && st.coin >= 0){ const c = bthCoinAt(st.coin); if (c[0] > W + .5) s += bthCoin(c); }
  return s;
}
function bthBack(m){
  const tb = tone([-1,0,0], m), dm = mix(tb, '#000000', .12);
  let s = shape(on(PX(-.3), rectUV(70, CZ0, 150, 200)), dm, 1.1);
  let g = ''; for (let z = 168; z <= 192; z += 5) g += pd(on(PX(-.4), [[80, z], [140, z]]), false);
  for (let z = 206; z <= 232; z += 5) g += pd(on(PX(-.4), [[170, z], [226, z]]), false);
  s += `<path d="${g}" fill="none" stroke="${INK}" stroke-width=".9"/>`;
  s += shape(on(PX(-.4), rectUV(136, 100, 140, 116)), '#c9cfd2', .7);
  s += bthTxB(-.4, 110, 140, 'SERVICE', 7, INK, 800) + bthTxB(-.4, 110, 131, 'STAFF ONLY', 4, INK, 700);
  return s;
}
function bthLeft(m){
  const sm = tone([0,1,0], m);
  let s = shape(on(PY(D + .3), rrUV(36, 50, 168, 200, 4)), '#fff4d6', 1.2);
  let g = ''; for (const [a, b] of [[[44, 80], [160, 92]], [[44, 140], [160, 128]], [[90, 58], [98, 178]], [[128, 58], [120, 178]], [[44, 112], [160, 112]]]) g += pd(on(PY(D + .4), [a, b]), false);
  s += `<path d="${g}" fill="none" stroke="#9aa3a8" stroke-width="2.2" stroke-linecap="round"/>`;
  s += shape(on(PY(D + .45), ellUV(110, 112, 3, 3, 12)), LAMP.busy, .7);
  s += txY(102, D + .5, 186, 'CITY MAP', 8, INK, 800);
  s += txY(100, D + .4, 30, 'OPEN 24 HOURS', 6, mix(sm, '#000000', .5), 800);
  return s;
}
function bthRight(m){
  const sm = tone([0,-1,0], m);
  return bthTxR(100, -.4, 176, 'PUBLIC', 12, mix(sm, '#000000', .5), 800) + bthTxR(100, -.4, 160, 'TOILET', 12, mix(sm, '#000000', .5), 800)
    + bthTxR(100, -.4, 140, 'SELF CLEANING', 5, mix(sm, '#000000', .5), 800);
}

/* ---------- see-through: the working parts ---------- */
let MECH_LABELS = '';
// pills in two columns either side (the shared xrCallouts), but split by how many fit each side and kept inside the frame:
// the left column starts under the buttons, the right one under the See-through switches
function bthCallouts(items, B){
  const pts = []; for (const x of [B[0], B[1]]) for (const y of [B[2], B[3]]) for (const z of [B[4], B[5]]) pts.push(P(x, y, z));
  const xmin = Math.min(...pts.map(p => p[0])), xmax = Math.max(...pts.map(p => p[0])), cx = (xmin + xmax)/2;
  const k = INK_K, u = window.LBL_U ? LBL_U() : 0, fs = u ? 10*u : 8.6*k, hgt = u ? 17*u : fs*1.8, gap = hgt + (u ? 3*u : 3*k);
  const svgEl = document.getElementById('fig'), vb = svgEl.viewBox.baseVal, ctm = svgEl.getScreenCTM();
  const below = (el, d) => { if (!el || !ctm) return null; const r = el.getBoundingClientRect(); return new DOMPoint(r.right, r.bottom + d).matrixTransform(ctm.inverse()).y; };
  // an element below the middle of the frame (phone layout) does not cap the column
  const lim = y => y == null || y > vb.y + vb.height/2 ? 0 : y;
  const top = { [-1]: Math.max(fs, lim(below(document.getElementById('btns'), 16))) + hgt/2, [1]: Math.max(fs, lim(below(document.querySelector('.vset'), 10))) + hgt/2 };
  // the built page puts a zoom chip (about 34 screen px tall, made after this runs) in the bottom-right corner: the right column ends above it
  const botV = vb.y + vb.height - hgt/2, bot = { [-1]: botV, [1]: botV - (!u && ctm ? 34/ctm.a : 0) };
  const all = items.map(it => { const [X, Y] = P(...it.at); return { ...it, X, Y }; }).sort((a, b) => a.X - b.X);
  const cap = side => Math.max(1, Math.floor((bot[side] - top[side]) / gap) + 1);

  } else if (st.phase === 'leave'){
    st.lock = 1 - cl01(u/.3);
    const o = cl01((u - .3)/1.4), w = cl01((u - 1.8)/2.6), c = cl01((u - 4.5)/1.4);
    st.door = u < 4.5 ? ease(o) : 1 - ease(c); st.dm = (o > 0 && o < 1) || (c > 0 && c < 1) ? 1 : 0;
    st.px = PX_IN + (PX_OUT - PX_IN)*w; st.moving = w > 0 && w < 1;
    if (u > 4.5) st.light = 'clean';
    if (u >= 6){ st.lock = 1; bthGo(st, 'wash'); }
  } else if (st.phase === 'wash'){
    st.bowl = u < 7 ? ease(cl01(u/1.5)) : 1 - ease(cl01((u - 7)/1.5));
    st.bjets = u > 1.6 && u < 4.2 ? 1 : 0;
    st.jets = u > 1.8 && u < 4.8 ? 1 : 0; if (st.jets) st.wet = Math.min(1, st.wet + dt/1.2);
    st.dry = u > 5 && u < 8.4 ? 1 : 0; if (st.dry) st.wet = Math.max(0, st.wet - dt/3);
    if (u >= 9.4){ st.wet = 0; st.bowl = 0; st.light = 'free'; bthGo(st, 'idle'); }
  }
  if (st.moving) st.walk += dt*9;
  return ANIM.has(st.phase);
}
let ui, bthLoop = false;
function bthRun(){ if (bthLoop) return; bthLoop = true;
  ui.animate(dt => { const go = bthStep(ui.st, dt); if (!go) bthLoop = false; return go; }); }
const NOTE = {
  pay:   'Coin in. The lock opens and the door motor slides the door open',
  enter: 'In you go. The door closes and locks, the light turns red',
  flush: 'The flush tank empties into the bowl, then refills',
  leave: 'The door opens. Once you are out, the wash cycle runs',
};
const WAIT = { busy: 'In use. Wait for the green light', clean: 'Cleaning. Wait for the green light' };
function bthPress(st, what){
  const ph = st.phase;
  if (what === 'pay'){
    if (ph === 'idle'){ bthStart(st, 'pay'); ui.flash(NOTE.pay, 2400); return bthRun(); }
    return ui.flash(ph === 'pay' ? 'Paid. The door is opening' : ph === 'open' || ph === 'enter' ? 'Already paid. Step in' : WAIT[st.light] || 'Wait for the green light');
  }
  if (what === 'enter'){
    if (ph === 'open'){ bthStart(st, 'enter'); ui.flash(NOTE.enter, 2400); return bthRun(); }
    return ui.flash(ph === 'idle' ? 'Pay first. The door is locked' : ph === 'pay' ? 'Wait for the door to open' : ph === 'enter' ? 'Going in' : ph === 'wash' ? WAIT.clean : 'Already inside');
  }
  if (what === 'flush'){
    if (ph === 'inuse'){ bthStart(st, 'flush'); ui.flash(NOTE.flush, 2000); return bthRun(); }
    return ui.flash(ph === 'flush' ? 'Flushing' : ph === 'wash' || ph === 'leave' ? 'The bowl washes itself now' : 'Step in first');
  }
  if (what === 'leave'){
    if (ph === 'inuse'){ bthStart(st, 'leave'); ui.flash(NOTE.leave, 2400); return bthRun(); }
    return ui.flash(ph === 'flush' ? 'Wait for the flush to finish' : ph === 'leave' ? 'Leaving' : ph === 'wash' ? WAIT.clean : 'Nobody is inside');
  }
}
// screenshot states: ?at=SECONDS runs the whole visit (pay, step in, flush, leave, wash) up to that moment and stops there
function bthSeek(st, T){
  for (const ph of ['pay', 'enter', 'flush', 'leave']){ bthStart(st, ph);
    while (T > 0 && ANIM.has(st.phase)){ bthStep(st, .02); T -= .02; }
    if (T <= 0) return; }
}
const bthCaption = st => ({
  idle:  'Inside: a door motor on a toothed belt, a flush tank, floor wash jets, sensors, and a controller in the technical room that runs every step.',
  pay:   'The coin acceptor checks the coin and drops it down the chute into the cash box. The controller pulls back the lock bolt and the door motor drives the belt that slides the door open.',
  open:  'The door waits open. The rubber safety edge on its leading edge stops it if it touches anyone.',
  enter: 'The presence sensor in the ceiling and the load cells under the floor tell the controller someone is in. The door closes, the lock shoots its bolt, the light turns red.',
  inuse: 'In use. The hand wash unit gives soap, warm water from the heater, and warm air.',
  flush: 'Flush: the flush valve opens and the tank empties down the flush pipe into the bowl. A solenoid valve then refills the tank from the mains.',
  leave: 'Leaving: the lock opens and the door slides back. When the load cells read empty, the door closes again.',
  wash:  'Wash cycle: the bowl slides back on its rails into the technical room, where a spray bar washes it. The pump sprays the floor from the skirting jets, the water runs to the drain, and a blower dries the floor.',
})[st.phase] || '';

ui = mountFigure({
  fig:'21', title:'Toilet booth', turn:'full',
  size:[W + 70, D, H + 18], center:[W/2 + 20, D/2], palette:'mint',
  // door 0 = closed, 1 = open; lock 1 = bolt out; px = the person's x; tank 0..1 full; bowl 0 = in the cabin, 1 = pulled back
  state:{ phase:'idle', t:0, door:0, lock:1, px:PX_OUT, walk:0, moving:false, coin:-1, tank:1, bowl:0, wet:0, spin:0,
    flowF:0, flowR:0, bjets:0, jets:0, dry:0, dm:0, light:'free' },
  scene,
  buttons:[
    { label:'Pay', onClick:(st) => bthPress(st, 'pay') },
    { label:'Step in', onClick:(st) => bthPress(st, 'enter') },
    { label:'Flush', onClick:(st) => bthPress(st, 'flush') },
    { label:'Leave', onClick:(st) => bthPress(st, 'leave') },
  ],
  acts:{ pay:(st) => bthPress(st, 'pay') },
  params:(st, q) => { if (q.has('at')) bthSeek(st, +q.get('at')); },
});
xrMount(() => ui, bthCaption);
</script></body></html>
