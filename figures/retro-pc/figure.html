<script>
/* Truth first.
   A representative early Pentium AT tower, not a reproduction of one motherboard.
   The AT mains switch feeds the supply. Its low-voltage harness feeds the motherboard
   and drive connectors. Power starts the cooling fans; Turbo selects normal versus
   compatibility speed. The jumper-programmed 33/66 front display is a preset, not a
   frequency counter. It does not overclock the CPU. Implementation of slow mode
   differed between boards. The GA-586AL manual describes half-speed switching.
   A floppy leaves the desk, rises in front of the slot and slides into its guides.
   A CD waits on the desk while the powered tray opens, then rises onto the tray's
   recess. The tray closes before the spindle turns. Repeating either action ejects
   and returns that same medium. No disc is made inside the drive.
   The user slides the removable side cover out and sets its lower edge on the desk.
   The see-through is a teaching cutaway. Drive housings also fade to show their parts.
   Parts and attachments.
   CASE. Feet and chassis floor support rear/front panels and top. The side cover
   engages the floor/top guides. The steel motherboard tray carries brass standoffs.
   BOARD. Motherboard on standoffs; CPU in socket; heatsink on CPU; fan on heatsink.
   Paired 72-pin SIMMs in sockets; chipset, cache, BIOS, battery and crystal on board.
   PCI/ISA slots carry VGA and sound cards secured to the rear expansion brackets.
   DRIVES. Drive cage bolted to chassis supports CD-ROM, floppy and hard disk.
   CD tray runs on side rails; spindle and optical sled are fixed to the drive deck.
   Floppy head rests on its guide; disk enters above it. Hard disk remains sealed.
   POWER. PSU bolted at rear/top; fan and mains inlet on its rear wall. Harness runs
   along the rear/floor and drive cage to AT and drive power connectors. Front mains
   switch has its own sheathed lead back to PSU. No exposed mains internals are shown.
   CONTROL. Display board and Turbo switch fixed behind front bezel. IDE and floppy
   ribbons run from board headers, along the cage, to the rear of their drives.
   Sources. Gigabyte GA-586AL user manual, pages 13 and 17, and GA-586HX manual,
   pages 37-45, for connectors and period board structure. Seagate ST3491 family
   installation guide, April 1994, for drive mounting, IDE ribbon and DC connector.
   This simplified model enlarges chips and cable thickness for legibility. */

const pcBoxBounds = p => [[0,1,2].map(i=>Math.min(...p.map(q=>q[i]))-.15),[0,1,2].map(i=>Math.max(...p.map(q=>q[i]))+.15)];
const pcPath = (pts,col,w=.6) => `<path d="${pd(pts,false)}" fill="none" stroke="${INK}" stroke-width="${w+.5}" stroke-linejoin="round" stroke-linecap="round"/><path d="${pd(pts,false)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
function pcFan(a,b,r,angle){
  const axis=norm(sub(b,a)), u=Math.abs(axis[0])>.9?[0,1,0]:[1,0,0], v=cross(axis,u);
  const cap=vis(axis)?b:a;
  const point=(radius,th)=>cap.map((n,i)=>n+radius*(u[i]*Math.cos(th)+v[i]*Math.sin(th)));
  let s=rod(a,b,r,pcBlack,toneI,.8,r,24);
  for(let i=0;i<5;i++){
    const th=angle+i*Math.PI*2/5;
    s+=shape([point(r*.2,th),point(r*.82,th+.15),point(r*.87,th+.7),point(r*.36,th+.9)],'#879396',.5);
  }
  s+=shape(Array.from({length:16},(_,i)=>point(r*.22,i*Math.PI/8)),METAL.l,.5);
  return s;
}

  cd+=ink(pd(rg),.6);
  if(!external||cx+6>50.15)parts.push({box:[[cx-6,cy-6,discZ],[cx+6,cy+6,discZ+.2]],svg:external&&cx-6<50.15?exposed(cd,discZ+.14):cd});

function pcShell(st,m){
  const p=[];
  const add=(b,svg,near=true)=>p.push({box:[[b[0],b[1],b[2]],[b[3],b[4],b[5]]],svg,near});
  const bx=(b,near)=>add(b,box(...b,pcCase,tone,1.1),near);

  if(vis([-1,0,0])){
    rear+=shape(on(PX(-.06),ellUV(14.5,58.5,5.7,5.7,32)),'#454a48',.8);
    for(let z=54;z<=63;z+=1.4)rear+=pcPath([[-.1,10,z],[-.1,19,z]],METAL.m,.45);

    for(const [z,col] of [[13,'#5482b3'],[23,'#c6aa53']])rear+=shape(on(PX(-.1),rectUV(5,z-1,19,z+1)),col,.7);

  }
  add([0,1,4,1,26,67],rear,vis([-1,0,0]));

    front+=shape(on(PX(50.3),ellUV(6,32,1,1,12)),st.power?'#64d382':'#787e66',.5);
  }
  add([49,1,4,51,26,67],front,vis([1,0,0]));
  const pp=ease(st.panel), py=26+13*pp, px=-4*pp, pz=-1.5*pp;

    panel+=shape(on(PY(py+.75),rectUV(3+px,8+pz,45+px,63+pz)),tone([0,1,0],pcCase),.8);
    for(let x=8;x<35;x+=3)panel+=pcPath([[x+px,py+.8,12+pz],[x+px,py+.8,22+pz]],'#847d68',.5);

  add([px,py,4+pz,49+px,py+.8,67+pz],act('panel',panel),vis([0,1,0]));

function pcMechanism(mech,media,xray){
  const back=byDepth(mech.backing), contents=byDepth([...mech.parts,...media]);
  return vis([0,1,0])?back+contents:contents+`<g opacity="${xray ? .18 : 1}">${back}</g>`;
}
function pcLabels(items){
  const fig=document.getElementById('fig'), vb=fig.viewBox.baseVal, k=INK_K;
  const u=window.LBL_U?LBL_U():0, fs=u?10*u:8.6*k, h=u?17*u:fs*1.8;
  const all=items.map(it=>({...it,p:P(...it.at)})).sort((a,b)=>a.p[0]-b.p[0]);
  const half=Math.ceil(all.length/2), columns=[all.slice(0,half),all.slice(half)];
  const points=[];
  for(const x of [pcBounds[0],pcBounds[1]])for(const y of [pcBounds[2],pcBounds[3]])for(const z of [0,68])points.push(P(x,y,z));
  const left=Math.min(...points.map(p=>p[0])), right=Math.max(...points.map(p=>p[0]));
  const buttons=document.getElementById('btns').getBoundingClientRect();
  const topLeft=new DOMPoint(buttons.right,buttons.bottom+15).matrixTransform(fig.getScreenCTM().inverse()).y+h;
  let svg='';
  columns.forEach((col,index)=>{
    col.sort((a,b)=>a.p[1]-b.p[1]);
    const top=index===0?Math.max(vb.y+h,topLeft):vb.y+h*2, bottom=vb.y+vb.height-h;
    const gap=Math.min(h+(u?3*u:3*k),(bottom-top)/Math.max(1,col.length-1));
    let prev=top-gap;
    col.forEach((it,i)=>{
      const n=((window.__ln||(window.__ln={}))[it.text]||(__ln[it.text]=Object.keys(__ln).length+1));
      const w=u?h*(n>9?1.3:1):it.text.length*fs*.62+fs*1.5;
      const side=index===0?-1:1;
      const x=Math.max(vb.x+w/2+2*k,Math.min(vb.x+vb.width-w/2-2*k,(side<0?left-w/2-10*k:right+w/2+10*k)));
      const y=Math.max(prev+gap,Math.min(it.p[1],bottom-(col.length-1-i)*gap)); prev=y;
      const ex=x-side*w/2;
      svg+=`<g class="tag${it.on?' on':''}" data-n="${n}" data-t="${it.text}"><path d="M${f(it.p[0])} ${f(it.p[1])}L${f(ex-side*4*k)} ${f(y)}L${f(ex)} ${f(y)}" fill="none" stroke="${INK}" stroke-width="1"/><circle cx="${f(it.p[0])}" cy="${f(it.p[1])}" r="${f(1.4*k)}" fill="${INK}"/><rect x="${f(x-w/2)}" y="${f(y-h/2)}" width="${f(w)}" height="${f(h)}" rx="${f(h/2)}" fill="${it.on?'var(--accent,#f4b829)':'#fff4d6'}" stroke="${INK}" stroke-width="1.2"/><text x="${f(x)}" y="${f(y+fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" fill="${INK}">${u?n:it.text}</text></g>`;
    });
  });
  return svg;
}
function pcScene(st,m){

  let s=board(-5,0,75,43,2.5,3,WOOD);
  s+=castShadow([...on(PX(0),pcProfile),...on(PX(50),pcProfile)],2.5,boardTop(-5,0,75,43,2.5,3));
  const feet=[];
  for(const x of [3,44])for(const y of [3,22])feet.push({box:[[x,y,2.5],[x+3,y+2,3.8]],svg:box(x,y,2.5,x+3,y+2,3.8,pcBlack,toneI,.8)});
  if(k>0)s+=byDepth(feet)+xrGhost(byDepth(shell),'',k,pcProfile,0,50,pcCase)+`<g opacity="${k}">${pcMechanism(mech,media,true)}</g>`;
  else{
    const outside=byDepth(pcMedia(st,true));
    s+=byDepth(feet)+(vis([1,0,0])?'':outside)+byDepth(shell.filter(p=>!p.near));
    if(st.panel>0)s+=pcMechanism(mech,media,false);
    s+=byDepth(shell.filter(p=>p.near))+(vis([1,0,0])?outside:'');
  }

}
let pcRunning=false;
function pcRun(st,ui){
  if(pcRunning)return;
  pcRunning=true;
  ui.animate(dt=>{
    for(const key of ['floppy','cd','panel']){
      if(key==='cd'&&!st.power)continue;
      const goal=st[key+'T']; st[key]+=Math.sign(goal-st[key])*Math.min(Math.abs(goal-st[key]),dt/(key==='cd'?2.2:1.4));
    }
    if(st.power)st.angle=(st.angle+dt*9)%(Math.PI*2);
    const more=st.power||['floppy','panel'].some(key=>st[key]!==st[key+'T']);
    if(!more)pcRunning=false;
    return more;
  });
}
function pcPower(st,ui){st.power=!st.power;pcRun(st,ui);}
function pcTurbo(st,ui){if(!st.power)return ui.flash('Press Power first');st.turbo=!st.turbo;}
function pcFloppy(st,ui){st.floppyT=1-st.floppyT;pcRun(st,ui);}
function pcCD(st,ui){if(!st.power)return ui.flash('Power the CD-ROM drive first');st.cdT=1-st.cdT;pcRun(st,ui);}
function pcPanel(st,ui){st.panelT=1-st.panelT;pcRun(st,ui);}
const pcUI=mountFigure({
  fig:'PC',turn:'full',title:'Retro Pentium PC',size:[75,43,68],center:[33,20],palette:'mustard',
  state:{power:false,turbo:false,angle:0,floppy:0,floppyT:0,cd:0,cdT:0,panel:0,panelT:0},scene:pcScene,
  buttons:[{label:'Power',onClick:pcPower},{label:'Turbo',onClick:pcTurbo},{label:'Insert floppy',onClick:pcFloppy},{label:'Insert CD',onClick:pcCD},{label:'Side panel',onClick:pcPanel}],
  acts:{power:(st,el,ui)=>pcPower(st,ui),turbo:(st,el,ui)=>pcTurbo(st,ui),panel:(st,el,ui)=>pcPanel(st,ui)},
  stats:st=>[{label:'Panel preset',value:st.power?(st.turbo?'66 MHz':'33 MHz'):'Off',small:true},{label:'CD-ROM',value:st.power&&st.cd===1?'4x':'Idle',small:true}],
  params:(st,q)=>{st.power=q.get('power')==='1';st.turbo=q.get('turbo')==='1';for(const key of ['floppy','cd','panel'])st[key]=st[key+'T']=q.get(key)==='1'?1:0;},
});
xrMount(()=>pcUI,()=> '');
if(pcUI.st.power)pcRun(pcUI.st,pcUI);
</script></body></html>
