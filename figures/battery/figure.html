<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A battery (Daniell cell)</title></head><body>
<script src="core.js"></script>
<script>
/* A Daniell cell on a bench — truth first.
   How it really works (and where every material is after each step):
   1. Open circuit. A zinc strip stands in 1 M zinc sulphate, a copper strip in 1 M copper sulphate, each strip bent over its
      beaker's rim. A glass U-tube full of potassium nitrate set in agar (the salt bridge, cotton-wool plugs in both ends)
      dips into both solutions; a retort-stand clamp holds it. The voltmeter, wired straight across the two strips, reads
      the cell's EMF: E = E(Cu2+/Cu) - E(Zn2+/Zn) = 0.34 - (-0.76) = 1.10 V. No current flows, so nothing changes.
   2. Close the knife switch. Zinc atoms give up two electrons each and leave as Zn2+ ions (Zn -> Zn2+ + 2e-). The electrons
      run up the zinc strip, through its crocodile clip, the black lead, the switch blade, the lead to the bulb, the bulb's
      filament (it glows), the red lead and down the copper strip, where Cu2+ ions take them and plate out as copper
      (Cu2+ + 2e- -> Cu). The voltmeter drops to the terminal voltage E - I r.
   3. Over hours: the zinc strip thins, the copper strip thickens, the blue of the copper sulphate fades. Faraday:
      mass = I t M / (2 F).
   4. Inside the salt bridge, K+ ions drift into the copper beaker (making up for the Cu2+ used) and NO3- ions into the zinc
      beaker (balancing the new Zn2+), so both solutions stay neutral. Lift the bridge out and that ionic path is broken:
      no current, the bulb goes out, the voltmeter reads 0.
   5. Swap the zinc half-cell for magnesium in magnesium sulphate: E = 0.34 - (-2.37) = 2.71 V, more current, brighter bulb.

   Parts (each held by another):
   BENCH   bench mat
   CELL    two 250 mL glass beakers with graduations, standing on the mat . 1 M zinc (or magnesium) sulphate . 1 M copper
           sulphate . zinc / magnesium strip and copper strip, each hooked over its beaker's rim
   BRIDGE  glass U-tube . potassium nitrate agar gel . two cotton-wool plugs
   STAND   retort-stand base . rod screwed into it . boss head clamped on the rod, thumbscrew . clamp arm in the boss .
           clamp head (back plate, two cork-lined fingers) gripping the top of the U-tube
   LEADS   four crocodile clips (insulating boot + two jaws) on the strips' outer tabs . black lead strip -> switch .
           lead switch -> bulb . red lead bulb -> copper . voltmeter leads (black to the zinc, red to the copper)
   SWITCH  slate base . two hinge plates . brass blade on a pivot . two spring jaw plates . neck and bakelite handle .
           two terminal screws
   BULB    batten holder base, its two contact strips and terminal screws . brass socket . 1.5 V MES bulb: screw cap,
           two support wires, coiled tungsten filament, glass envelope
   METER   case . dial plate, 0-3 V scale, pointer, zero-adjust screw, window . two binding posts . multiplier resistor .
           internal wires . horseshoe magnet . two pole pieces . soft-iron core . moving coil on its shaft . front and back
           hairsprings (they carry the current into the coil)
   UNSEEN  electrons in the metal . Zn2+ (Mg2+) . Cu2+ . sulphate . K+ . NO3-
   Units: 1 unit = 1 mm. x = depth (front x = BW), y = width (+y viewer-left), z = up. */

/* ---------- layout ---------- */
const BW = 246, BD = 318, BT = 3;                      // bench mat
const BR = 34, BZ1 = 98, LIQ = 70;                     // beaker radius, rim height, liquid level
const ZNC = [80, 240], CUC = [80, 130];                // beaker centres
const SX0 = 69, SX1 = 91, ST_BOT = 20, T0 = 3;         // strips: width along x, bottom, drawn thickness
const BRG = { x:80, yA:213, yB:157, yc:185, r:28, z0:45, z1:112, tr:5.5 };   // salt bridge (A in the zinc beaker)
const BRL = 58, SWL = 86;                              // how far the bridge / a strip lifts out
const ROD = [24, 185], ROD_TOP = 206;                  // retort stand rod
const VM = [158, 142, 3, 214, 198, 72];                // voltmeter case
const VP = [170, 30];                                  // meter pivot (y, z) on the face
const BUL = [186, 70];                                 // bulb holder centre
const SWB = [176, 238, 202, 300], SWX = 189, HZ = 16, HY = 292, BLADE = 46;   // knife switch
const T1 = [SWX, 297.5], T2 = [SWX, 242.5];            // switch terminal screws
const BA = [194, 78], BB = [178, 62];                  // bulb holder terminal screws
const K3 = 1.2247;                                     // model -> screen scale of the projection

/* ---------- chemistry ---------- */
const FARADAY = 96485, RT2F = 0.025693/2, E_CU = 0.34, R_INT = 3, R_BULB = 6, VSOL = .18;
const FAST = 4;                                        // fast time: hours per second
const METALS = {
  zn:{ name:'Zinc', up:'ZINC', ion:'ZN2+', E:-0.76, M:65.38, m0:7.85, col:'#aab4bf', ionCol:'#93a1b5' },
  mg:{ name:'Magnesium', up:'MAGNESIUM', ion:'MG2+', E:-2.37, M:24.31, m0:1.91, col:'#e3e7ea', ionCol:'#d8c9e8' } };
const CU_M = 63.55;
const COLS = { cu:'#2f7fd8', so4:'#f2c230', k:'#9b59d6', no3:'#43b05c', el:'#ffd84a' };
const GLASS = { l:'#e4f2f4', m:'#cfe6ea', d:'#a9c9cf' }, GEL = { l:'#f7f8ef', m:'#e6eadb', d:'#c4cbbb' };
const BRASS = matOf('#d8b25a'), COPM = matOf('#e08a5a'), BAKE = matOf('#3e3833'), CORK = matOf('#c9a46a'), IRON = matOf('#5b6670');
const SLATE = matOf('#6c7a80'), MAGM = matOf('#d64535'), REDM = matOf('#d9443a'), BLKM = matOf('#3a3632');

const clamp01 = v => Math.max(0, Math.min(1, v));
const f2 = v => (+v).toFixed(2);
function cellNow(st){
  const M = METALS[st.metal], nM = st.n[st.metal], nCu = st.n.zn + st.n.mg;
  const cM = 1 + nM/VSOL, cCu = Math.max(.02, 1 - nCu/VSOL);
  const E = E_CU - M.E - RT2F*Math.log(cM/cCu);
  const lost = nM*M.M, rem = 1 - lost/M.m0, gained = nCu*CU_M;
  const lift = st.lift || 0;
  const stripIn = ST_BOT + SWL*lift < LIQ - 8, bridgeIn = BRG.z0 + BRL*ease(st.br) < LIQ - 4;
  const ionic = stripIn && bridgeIn;
  const spent = rem < .12 || cCu < .06;
  const closed = st.sw < .04;
  const I = ionic && closed ? E/(R_INT + R_BULB) : 0;          // fast time stops once a strip is spent; the cell itself would carry on
  const V = !ionic ? 0 : I > 0 ? E - I*R_INT : E;
  return { E, I, V, cCu, rem, lost, gained, ionic, closed, spent, bridgeIn, stripIn, M };
}
function advance(st, c, hours){ const dn = c.I*hours*3600/(2*FARADAY); st.n[st.metal] += dn; st.hours += hours; }

/* ---------- small helpers ---------- */
const dcBoxOf = (pts, e = .05) => [[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - e), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + e)];
const grow = (b, r) => [b[0].map(v => v - r), b[1].map(v => v + r)];
const rodBox = (a, b, r) => { const d = norm(sub(b, a)), e = i => r*Math.sqrt(Math.max(0, 1 - d[i]*d[i])) + .02;
  return [[0,1,2].map(i => Math.min(a[i], b[i]) - e(i)), [0,1,2].map(i => Math.max(a[i], b[i]) + e(i))]; };
const addv = (a, b) => [a[0]+b[0], a[1]+b[1], a[2]+b[2]], scl = (a, k) => a.map(v => v*k);
const lerp3 = (a, b, t) => a.map((v, i) => v + (b[i] - v)*t);
// round each interior corner of a route (a lead bends, it doesn't kink)
const dcBend = (pts, r = 2) => { if (pts.length < 3) return pts; const out = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++){ const [a, b, c] = [pts[i - 1], pts[i], pts[i + 1]];
    const la = Math.hypot(...a.map((v, k) => v - b[k])), lc = Math.hypot(...c.map((v, k) => v - b[k])), d = Math.min(r, la/2.2, lc/2.2);
    if (d < 1e-3){ out.push(b); continue; }
    const p = a.map((v, k) => b[k] + (v - b[k]) * d/la), q = c.map((v, k) => b[k] + (v - b[k]) * d/lc);
    for (let j = 0; j <= 4; j++){ const t = j/4; out.push([0,1,2].map(k => (1-t)*(1-t)*p[k] + 2*(1-t)*t*b[k] + t*t*q[k])); } }
  out.push(pts[pts.length - 1]); return out; };
// a stroked tube in model units (not rescaled by inkScale): ink border, body colour, optional highlight
const tubeSvg = (pts, r, col, hi = null) => { const d = pd(pts, false), w = 2*r*K3;
  return `<path d="${d}" fill="none" stroke="${INK}" style="stroke-width:${f2(w + 1.5*INK_K)}" stroke-linejoin="round"/>`
    + `<path d="${d}" fill="none" stroke="${col}" style="stroke-width:${f2(w)}" stroke-linejoin="round"/>`
    + (hi ? `<path d="${d}" fill="none" stroke="${hi}" style="stroke-width:${f2(w*.28)}" opacity=".55" stroke-linejoin="round"/>` : ''); };
const dotAt = (p, r, col, w = .8) => { const [X, Y] = P(...p); return `<circle cx="${f(X)}" cy="${f(Y)}" r="${f2(r*K3)}" fill="${col}" stroke="${INK}" style="stroke-width:${f2(w*INK_K)}"/>`; };
// a lead cut into short pieces, each with its own box, so byDepth puts it behind or in front of the solids it passes
function dcWire(pts, col, r = 1.1, Lc = 7, br = 2){
  const q = dcBend(pts, br), out = [];
  for (let i = 0; i < q.length - 1; ){
    let j = i + 1, len = 0; while (j < q.length - 1 && len < Lc){ len += Math.hypot(...q[j].map((v, k) => v - q[j - 1][k])); j++; }
    if (len < Lc) while (j < q.length - 1) j++;
    const seg = q.slice(i, j + 1);
    let svg = tubeSvg(seg, r, col);
    if (i === 0) svg = dotAt(q[0], r*.95, col, .7) + svg;
    if (j === q.length - 1) svg += dotAt(q[j], r*.95, col, .7);
    out.push({ box: grow(dcBoxOf(seg), r), svg }); i = j; }
  return out;
}
// a prism: convex profile in (y, z) swept along x from x0 to x1, both end faces
function prismX(prof, x0, x1, Mt, w = .8){
  let s = loft(on(PX(x0), prof), on(PX(x1), prof), n => toneI(n, Mt));
  for (const [x, n] of [[x0, [-1,0,0]], [x1, [1,0,0]]]) if (vis(n)) s += shape(on(PX(x), prof), toneI(n, Mt), w);
  return s + hullInk([...on(PX(x0), prof), ...on(PX(x1), prof)], w + .2);
}
// a sign on an ion: + or -
const signMark = (p, plus, rr) => { const [X, Y] = P(...p), a = rr*K3*.55;
  return `<path d="M${f(X - a)} ${f(Y)}H${f(X + a)}${plus ? `M${f(X)} ${f(Y - a)}V${f(Y + a)}` : ''}" stroke="${INK}" style="stroke-width:${f2(.75*INK_K)}" stroke-linecap="round"/>`; };
const ionSvg = (p, col, plus, rr = 2.6, op = 1) => `<g opacity="${f2(op)}">${dotAt(p, rr, col, .6)}${signMark(p, plus, rr)}</g>`;
// fixed pseudo-random points in a beaker's liquid
function scatter(seed, n, cx, cy, avoid){ let s = seed; const rnd = () => (s = (s*16807) % 2147483647) / 2147483647, out = [];
  let guard = 0; while (out.length < n && guard++ < 500){ const a = rnd()*Math.PI*2, r = Math.sqrt(rnd())*27, p = [cx + r*Math.cos(a), cy + r*Math.sin(a), 10 + rnd()*52];
    if (avoid(p) || out.some(q => Math.hypot(q[0]-p[0], q[1]-p[1], q[2]-p[2]) < 9)) continue; out.push(p); }
  return out; }
const nearStrip = (p, y0, y1) => p[0] > SX0 - 4 && p[0] < SX1 + 4 && p[1] > y0 - 5 && p[1] < y1 + 5;
const nearLeg = (p, y) => Math.hypot(p[0] - BRG.x, p[1] - y) < BRG.tr + 5;
const ZN_BULK = scatter(11, 14, ZNC[0], ZNC[1], p => nearStrip(p, 254, 260) || nearLeg(p, BRG.yA));
const CU_BULK = scatter(29, 14, CUC[0], CUC[1], p => nearStrip(p, 100, 109) || nearLeg(p, BRG.yB));

/* ---------- geometry that moves ---------- */
function bridgePath(st){ const dz = BRL*ease(st.br), b = BRG, pts = [];
  for (let z = b.z0; z < b.z1; z += 7) pts.push([b.x, b.yA, z + dz]);
  for (let i = 0; i <= 18; i++){ const a = i/18*Math.PI; pts.push([b.x, b.yc + b.r*Math.cos(a), b.z1 + b.r*Math.sin(a) + dz]); }
  for (let z = b.z1 - 7; z >= b.z0 - .01; z -= 7) pts.push([b.x, b.yB, z + dz]);
  if (pts[pts.length - 1][2] > b.z0 + dz + .01) pts.push([b.x, b.yB, b.z0 + dz]);
  return pts; }
// cut a polyline into runs by height band: 0 = under the liquid, 1 = in the beaker above it, 2 = above the rims
function bandRuns(pts){ const cuts = [LIQ, BZ1], band = z => z < LIQ ? 0 : z < BZ1 ? 1 : 2, runs = [];
  let cur = { band: band(pts[0][2]), pts: [pts[0]] };
  for (let i = 1; i < pts.length; i++){ const a = pts[i - 1], b = pts[i];
    for (const c of cuts) if ((a[2] - c)*(b[2] - c) < 0){ const t = (c - a[2])/(b[2] - a[2]), m = lerp3(a, b, t); cur.pts.push(m); runs.push(cur); cur = { band: band(c + (b[2] > a[2] ? .01 : -.01)), pts: [m] }; }
    cur.pts.push(b); }
  runs.push(cur); return runs.filter(r => r.pts.length > 1); }
// knife-switch blade: pivot, direction along the blade, its up direction
function blade(st){ const a = 65*ease(st.sw)*Math.PI/180, d = [0, -Math.cos(a), Math.sin(a)], u = [0, Math.sin(a), Math.cos(a)];
  const piv = [SWX, HY, HZ], end = addv(piv, scl(d, BLADE)); return { a, d, u, piv, end }; }
// the strips' outer tab, clip boots and the leads hanging from them, for strip side s = 'zn' | 'cu'
function stripGeo(st, side){ const dz = side === 'zn' ? SWL*ease(st.lift || 0) : 0;
  const zn = side === 'zn', tab = zn ? [276, 279] : [91, 94], boot = zn ? 277.5 : 92.5;
  return { dz, zn, tab, boot, clips: [74, 86].map(x => [x, boot, 70 + dz]) }; }

/* ---------- leads (routes from port to port) ---------- */
function leads(st){ const zg = stripGeo(st, 'zn'), cg = stripGeo(st, 'cu'), [z1, z2] = zg.clips, [c1, c2] = cg.clips;
  const hangZ = (c, y1, y2, x1) => [c, [c[0] + .5, y1, Math.max(45, c[2] - 25)], [c[0] + 1, y2, 20], [x1, y2 + (y2 - c[1])*.4, 4.5]];
  const L1 = [...hangZ(z1, 280, 284, 76), [140, 300, 4.5], [182, 305, 4.5], [SWX, 304, 6.5], [SWX, 302.5, 11.5], [T1[0], T1[1], 11.5]];
  const L2 = [[T2[0], T2[1], 11.5], [SWX, 236.5, 11.5], [SWX, 235.2, 7], [191, 234, 4.5], [232, 226, 4.5], [232, 98, 4.5], [205, 88.5, 4.5], [202.5, 86.5, 7.5], [200.5, 84.5, 12.5], [BA[0], BA[1], 12.5]];
  const L3 = [[BB[0], BB[1], 12.5], [172, 56, 12.5], [170.5, 54.5, 8], [169, 53, 4.5], [110, 66, 4.5], ...hangZ(c1, 91, 86, 78).reverse()];
  const VN = [[166, 190, 76], [156.5, 190, 76], [155, 190, 74.5], [155, 190, 8], [153, 190, 4.5], [140, 212, 4.5], [128, 258, 4.5], [104, 280, 4.5], ...hangZ(z2, 280, 283, 90).reverse()];
  const VPos = [[166, 150, 76], [156.5, 150, 76], [155, 150, 74.5], [155, 150, 8], [153, 150, 4.5], [130, 118, 4.5], [112, 98, 4.5], ...hangZ(c2, 90, 86, 92).reverse()];
  return { L1, L2, L3, VN, VPos }; }
function electronPath(st, ld){ const zg = stripGeo(st, 'zn'), b = blade(st), dz = zg.dz;
  const zs = [80, 257.5, 30 + dz], cs = [80, 102.5, 30];
  return [zs, [80, 257.5, 99.2 + dz], [80, 277.5, 99.2 + dz], [80, 277.5, 86 + dz], [74, 277.5, 84 + dz], ...ld.L1,
    [SWX, T1[1], 11], [SWX, HY, HZ], b.end, [SWX, T2[1] + 2, 11], ...ld.L2,
    [190, 74, 11], [186, 72.5, 25], [186, 73, 33.5], [186, 67, 33.5], [186, 67.5, 25], [182, 66, 11], ...ld.L3,
    [74, 92.5, 84], [80, 92.5, 86], [80, 92.5, 99.2], [80, 102.5, 99.2], cs]; }
function pathAt(pts){ const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(...pts[i].map((v, k) => v - pts[i - 1][k])));
  const total = cum[cum.length - 1];
  return { total, at: s => { s = ((s % total) + total) % total; let i = 1; while (i < cum.length - 1 && cum[i] < s) i++;
    const t = (s - cum[i - 1]) / ((cum[i] - cum[i - 1]) || 1); return lerp3(pts[i - 1], pts[i], t); } }; }

/* ---------- parts ---------- */
// a strip: the part in the beaker (thinned or plated below the old liquid line), the hook over the rim, the outer tab
function stripParts(st, side, c, k){ const g = stripGeo(st, side), dz = g.dz, zn = g.zn, out = { low:[], mid:[], top:[] };
  const M = zn ? METALS[st.metal] : null;
  const base = zn ? matOf(M.col) : COPM;
  const worn = zn ? mix(M.col, '#6d747c', .55*(1 - c.rem)) : null;
  const dep = zn ? 0 : Math.min(4.5, c.gained*.6);
  const lowM = zn ? matOf(worn) : matOf(mix('#e08a5a', '#a4502c', clamp01(c.gained/3)));
  const yThin = zn ? [259 - T0*Math.max(.12, c.rem), 259] : [101, 104 + dep];
  const yFull = zn ? [256, 259] : [101, 104];
  const segs = [[ST_BOT, LIQ, yThin, lowM], [LIQ, BZ1, yFull, base]];
  for (const [z0, z1, yy, Mt] of segs){ const a = z0 + dz, b = z1 + dz;
    for (const [lo, hi, band] of [[-1e9, LIQ, 'low'], [LIQ, BZ1, 'mid'], [BZ1, 1e9, 'top']]){
      const p0 = Math.max(a, lo), p1 = Math.min(b, hi); if (p1 - p0 < .05) continue;
      out[band].push({ box: [[SX0, yy[0], p0], [SX1, yy[1], p1]], svg: act('strip', box(SX0, yy[0], p0, SX1, yy[1], p1, Mt, toneI, .8)) }); } }
  // hook over the rim and the outer tab the clips bite on
  const hy = zn ? [256, 279] : [91, 104];
  out.top.push({ box: [[SX0, hy[0], BZ1 + dz], [SX1, hy[1], BZ1 + 2.5 + dz]], svg: act('strip', box(SX0, hy[0], BZ1 + dz, SX1, hy[1], BZ1 + 2.5 + dz, base, toneI, .8)) });
  out.top.push({ box: [[SX0, g.tab[0], 84 + dz], [SX1, g.tab[1], BZ1 + dz]], svg: box(SX0, g.tab[0], 84 + dz, SX1, g.tab[1], BZ1 + dz, base, toneI, .8) });
  // crocodile clips: two jaws either side of the tab, the insulating boot under them
  g.clips.forEach((cp, i) => { const x = cp[0], red = !zn, bootM = red ? REDM : BLKM, jy = zn ? [[274.6, 276], [279, 280.4]] : [[94, 95.4], [89.6, 91]];
    for (const [y0, y1] of jy) out.top.push({ box: [[x - 2.6, y0, 84 + dz], [x + 2.6, y1, 92 + dz]], svg: box(x - 2.6, y0, 84 + dz, x + 2.6, y1, 92 + dz, METAL, toneI, .6) });
    out.top.push({ box: rodBox([x, g.boot, 70 + dz], [x, g.boot, 84 + dz], 3), svg: rod([x, g.boot, 70 + dz], [x, g.boot, 84 + dz], 2.4, bootM, toneI, .8, 3, 14) }); });
  return out;
}
// the salt bridge's pieces by band, with its cotton plugs
function bridgeParts(st){ const pts = bridgePath(st), runs = bandRuns(pts), dz = BRL*ease(st.br), out = { zn:{ low:[], mid:[] }, cu:{ low:[], mid:[] }, top:[] };
  for (const r of runs){ const svg = tubeSvg(r.pts, BRG.tr, GEL.m, '#ffffff'), b = grow(dcBoxOf(r.pts), BRG.tr);
    if (r.band === 2) out.top.push({ pts: r.pts, svg }); else { const side = r.pts[0][1] > BRG.yc ? 'zn' : 'cu'; out[side][r.band ? 'mid' : 'low'].push({ box: b, svg: act('bridge', svg) }); } }
  for (const [y, side] of [[BRG.yA, 'zn'], [BRG.yB, 'cu']]){ const tip = [BRG.x, y, BRG.z0 + dz - 1.5], z = tip[2], c = `<g>${dotAt(tip, 4.4, '#fbfaf3', .7)}${dotAt([BRG.x - 1.2, y + 1.6, z + 1], 2.2, '#ffffff', 0)}</g>`;
    const band = z < LIQ ? 'low' : z < BZ1 ? 'mid' : null, it = { box: [[BRG.x - 4.5, y - 4.5, z - 4.5], [BRG.x + 4.5, y + 4.5, z + 3]], svg: c };
    if (band) out[side][band].push(it); else out.top.push({ pts: [tip], svg: c, tip: true }); }
  return out; }

// a glass beaker with whatever stands in it: far wall, contents under the liquid, the liquid, contents above, near wall
function beakerSvg(cx, cy, sol, low, mid, k, grad){
  const n = 40, A = on(PZ(BT), ellUV(cx, cy, BR, BR, n)), B = on(PZ(BZ1), ellUV(cx, cy, BR, BR, n));
  let s = fill(pd(on(PZ(BT + .4), ellUV(cx, cy, BR - .8, BR - .8, n))), '#d6ebef', 'opacity=".6"') + ink(pd(on(PZ(BT + 2), ellUV(cx, cy, BR - 1.6, BR - 1.6, n))), .5);
  s += `<g opacity=".42">` + loft(A, B, nr => toneI(nr, GLASS), true) + `</g>`;
  s += byDepth(low);
  const LA = on(PZ(BT + 2), ellUV(cx, cy, BR - 1.5, BR - 1.5, n)), LB = on(PZ(LIQ), ellUV(cx, cy, BR - 1.5, BR - 1.5, n));
  const a = sol.a*(1 - .45*k);
  s += fill(sp(hull([...LA, ...LB].map(p => P(...p)))), sol.col, `opacity="${f2(a)}"`);

        const q = n[0] ? [[n[0] > 0 ? x1 : x0, y0, z0], [n[0] > 0 ? x1 : x0, y1, z0], [n[0] > 0 ? x1 : x0, y1, z1], [n[0] > 0 ? x1 : x0, y0, z1]] : [[x0, n[1] > 0 ? y1 : y0, z0], [x1, n[1] > 0 ? y1 : y0, z0], [x1, n[1] > 0 ? y1 : y0, z1], [x0, n[1] > 0 ? y1 : y0, z1]];
        return fill(pd(q), mix(m.d, '#f2efe7', .5)); }).join('') + `</g>`;
      svg = far + `<g opacity="${f2(k)}">${meterInside(st)}</g><g opacity="${f2(1 - .8*k)}">${box(...VM, m, tone, 1.2)}</g><g opacity="${f2(.6*k)}">${hullInk(bx8(...VM), 2.6)}</g>` + (front ? meterFace(st, k) : ''); }
    put([[VM[0], VM[1], VM[2]], [VM[3] + 1.2, VM[4], VM[5]]], svg);
    for (const [y, Mt] of [[150, REDM], [190, BLKM]]) put([[163, y - 3.4, VM[5]], [169, y + 3.4, 83]], cyl(166, y, VM[5], 74.5, 3.4, BRASS, toneI, .7, 16) + cyl(166, y, 77.5, 83, 3, Mt, toneI, .9, 16)); }

  // ---- leads
  const lit = c => live ? mix(c, '#ffb347', .35) : c;
  items.push(...dcWire(ld.L1, lit('#2e2a27')), ...dcWire(ld.L2, lit('#2e2a27')), ...dcWire(ld.L3, lit('#d9443a')), ...dcWire(ld.VN, '#2e2a27', 1), ...dcWire(ld.VPos, '#d9443a', 1));

  s += byDepth(items);

  // ---- see-through overlays: electrons round the wire, K+ and NO3- through the bridge
  if (k > 0){ const ph = st.ph || 0, ep = pathAt(electronPath(st, ld)), gap = 15, n = Math.floor(ep.total/gap); let e = '';
    const swLen = BLADE, closed = c.closed;
    for (let i = 0; i < n; i++){ const p = ep.at(i*gap + ph*26); if (!closed && p[1] < HY + 1 && p[1] > T2[1] && Math.abs(p[0] - SWX) < 2 && p[2] > 12) continue; e += ionSvg(p, COLS.el, false, 1.9); }
    const bpath = pathAt([[BRG.x, BRG.yA, BRG.z0 - 8 + dzB], ...bridgePath(st), [BRG.x, BRG.yB, BRG.z0 - 8 + dzB]]);
    let br = '';
    for (let i = 0; i < 6; i++){ const t = (i/6 + (c.I > 0 ? ph*.06 : 0)) % 1;
      br += ionSvg(bpath.at(t*bpath.total), COLS.k, true, 2.4);
      br += ionSvg(bpath.at((1 - ((i/6 + .08 + (c.I > 0 ? ph*.06 : 0)) % 1))*bpath.total), COLS.no3, false, 2.4); }
    s += `<g opacity="${f2(k)}">${br}${e}</g>`; }

  // ---- labels
  const M = c.M, zg = stripGeo(st, 'zn'), dzS = zg.dz, eAt = pathAt(ld.L2).at(60);
  if (k > .6) s += xrCallouts([
    { at:[SX0, 258, 40 + dzS], text: `${M.up} ANODE`, on: live },
    { at:[SX1, 104, 40], text:'COPPER CATHODE', on: live },
    { at:[SX0 + 4, 105 + Math.min(4.5, c.gained*.6), 30], text:'COPPER DEPOSIT', on: live },
    { at:[ZNC[0] + 26, ZNC[1] - 10, 20], text: solName(M), on: false },
    { at:[CUC[0] + 26, CUC[1] + 10, 22], text:'COPPER SULPHATE', on: live },
    { at:[ZNC[0] + BR*.7, ZNC[1] + BR*.7, BZ1], text:'GLASS BEAKER', on: false },
    { at:[BRG.x, BRG.yc + 16, BRG.z1 + 23 + dzB], text:'SALT BRIDGE', on: live },
    { at:[BRG.x, BRG.yB, BRG.z1 - 10 + dzB], text:'KNO3 AGAR GEL', on: false },
    { at:[BRG.x, BRG.yB, BRG.z0 - 3 + dzB], text:'COTTON PLUG', on: false },
    { at: ZN_BULK[0], text: `${M.ion} IONS`, on: live },
    { at: CU_BULK[0], text:'CU2+ IONS', on: live },
    { at: ZN_BULK[1], text:'SULPHATE IONS', on: false },
    { at:[BRG.x, BRG.yA - 6, BRG.z1 + 20 + dzB], text:'K+ IONS', on: live },
    { at:[BRG.x, BRG.yB + 6, BRG.z1 + 20 + dzB], text:'NO3- IONS', on: live },
    { at: eAt, text:'ELECTRONS', on: live },
    { at: zg.clips[0], text:'CROCODILE CLIP', on: false },
    { at:[120, 299, 4.5], text:'BLACK LEAD', on: live },
    { at:[130, 63, 4.5], text:'RED LEAD', on: live },
    { at: lerp3(b.piv, b.end, .55), text:'SWITCH BLADE', on: c.closed },
    { at:[SWX, 251, 21], text:'SPRING JAW', on: c.closed },
    { at:[BUL[0] - 9, BUL[1] - 9, 8], text:'BULB HOLDER', on: false },
    { at:[BUL[0], BUL[1], 33.5], text:'FILAMENT', on: glow > .05 },
    { at:[195, 176, 30], text:'MOVING COIL', on: (st.needle || 0) > .02 },
    { at:[195, 151, 30], text:'MAGNET', on: false },
    { at:[207, 170, 34], text:'HAIRSPRING', on: (st.needle || 0) > .02 },
    { at:[VM[3] + .7, ...onFace(22, ang(st.needle || 0)).slice(1)], text:'POINTER', on: (st.needle || 0) > .02 },
    { at:[170, 172, 62], text:'MULTIPLIER', on: (st.needle || 0) > .02 },
    { at:[166, 150, 83], text:'BINDING POST', on: false },
    { at:[86, 185, hz + 8], text:'CLAMP', on: false },
    { at:[ROD[0], ROD[1], 40], text:'RETORT STAND', on: false } ], LBL_B);
  else s += xrCallouts([
    { at:[SX1, 259, 85 + dzS], text: `${M.up} STRIP`, on: live },
    { at:[SX1, 104, 85], text:'COPPER STRIP', on: live },
    { at:[ZNC[0] + 30, ZNC[1] - 8, 40], text: solName(M), on: false },
    { at:[CUC[0] + 30, CUC[1] + 8, 40], text:'COPPER SULPHATE', on: false },
    { at:[BRG.x, BRG.yc, BRG.z1 + BRG.r + dzB], text:'SALT BRIDGE', on: c.bridgeIn },
    { at:[SWX, b.end[1], b.end[2] + 12], text:'KNIFE SWITCH', on: c.closed },
    { at:[BUL[0], BUL[1], 43], text:'BULB', on: glow > .05 },
    { at:[VM[3], VP[0], 55], text:'VOLTMETER', on: c.V > 0 },
    { at:[ROD[0], ROD[1], 150], text:'RETORT STAND', on: false } ], LBL_B);
  return s;
}

/* ---------- behaviour: one state object, one frame step ---------- */
let ui, dcLoop = false;
const approach = (v, t, d) => v < t ? Math.min(t, v + d) : Math.max(t, v - d);
function step(dt){
  const st = ui.st;
  st.sw = approach(st.sw, st.swT, dt/.35);
  st.br = approach(st.br, st.brT, dt/1.3);
  if (st.swap){ const w = st.swap; w.t += dt;
    st.lift = w.t < .7 ? w.t/.7 : w.t < .9 ? 1 : Math.max(0, 1 - (w.t - .9)/.7);
    if (w.t >= .8 && st.metal !== w.to) st.metal = w.to;
    if (w.t >= 1.6){ st.swap = null; st.lift = 0; } }
  const c = cellNow(st);
  st.needle += (c.V - st.needle)*Math.min(1, dt*6); if (Math.abs(st.needle - c.V) < .002) st.needle = c.V;
  const gT = Math.min(1, Math.pow(c.I*c.I*R_BULB/.5, .6)); st.glow = approach(st.glow, gT, dt/.25);
  if (c.I > 0) st.ph = (st.ph || 0) + dt*(.4 + c.I*3);
  const moving = st.sw !== st.swT || st.br !== st.brT || !!st.swap;
  if (st.fast){ if (c.I > 0 && !c.spent) advance(st, c, dt*FAST);
    else if (!moving){ st.fast = false; if (c.spent) ui.flash(c.rem < .12 ? `The ${c.M.name.toLowerCase()} is nearly eaten away: fresh strips` : 'The copper sulphate is nearly used up: fresh strips', 2600); } }
  const busy = moving || st.fast || st.needle !== c.V || st.glow !== gT || (c.I > 0 && (st.xr || 0) > 0);
  if (!busy) dcLoop = false;
  return busy;
}
function kick(){ if (dcLoop || !ui) return; dcLoop = true; ui.animate(step); }
function toggleSwitch(st){ st.swT = st.swT ? 0 : 1; kick(); }
function fastTime(st){
  if (st.fast){ st.fast = false; return; }
  const c = cellNow(st);
  if (!c.bridgeIn && st.brT) return ui.flash('Put the salt bridge back first: no ions, no current');
  if (c.spent) return ui.flash('This strip is spent: press Fresh strips');
  if (st.swT) st.swT = 0;                                       // close the switch: no current, no reaction
  st.fast = true; kick(); }
function swapTo(st, to){ if (st.swap) return; st.swap = { to, t: 0 }; kick(); }
function toggleBridge(st){ st.brT = st.brT ? 0 : 1; kick(); }
function fresh(st){ st.n = { zn: 0, mg: 0 }; st.hours = 0; st.fast = false; kick(); }

ui = mountFigure({
  fig:'B1', title:'A battery (Daniell cell)', turn:'full',
  size:[BW, BD, 270], palette:'cobalt',            // extra headroom: frames the low, wide bench smaller so the labels fit both sides
  state:{ metal:'zn', sw:1, swT:1, br:0, brT:0, lift:0, swap:null, n:{ zn:0, mg:0 }, hours:0, fast:false, needle:null, glow:0, ph:0 },
  scene,
  stats: st => { const c = cellNow(st);
    return [ { label:'Voltmeter', value: c.V.toFixed(2) + ' V' },
             { label:'Current', value: Math.round(c.I*1000) + ' mA', small:true },
             { label: `${c.M.name} lost / copper gained in ${st.hours.toFixed(1)} h`, value: `${c.lost.toFixed(2)} / ${c.gained.toFixed(2)} g`, small:true } ]; },
  buttons:[
    { label:'Switch on / off', onClick: st => toggleSwitch(st) },
    { label:'Fast time', onClick: st => fastTime(st) },
    { label:'Swap metal', choices: st => Object.keys(METALS).map(key => ({ label: METALS[key].name, current: st.metal === key && !st.swap,
        disabled: !!st.swap, why:'wait: the strip is being swapped', onClick: st2 => swapTo(st2, key) })) },
    { label:'Lift / replace bridge', onClick: st => toggleBridge(st) },
    { label:'Fresh strips', onClick: st => fresh(st) },
  ],
  acts:{ switch: st => toggleSwitch(st), bridge: st => toggleBridge(st), strip: st => swapTo(st, st.metal === 'zn' ? 'mg' : 'zn') },
  params:(st, q) => {
    if (q.get('on') === '1') st.sw = st.swT = 0;
    if (q.get('bridge') === '0') st.br = st.brT = 1;
    if (METALS[q.get('metal')]) st.metal = q.get('metal');
    if (q.has('h')){ const h = Math.max(0, +q.get('h') || 0), sw = st.sw; st.sw = 0; for (let t = 0; t < h; t += .05){ const c = cellNow(st); if (!c.I || c.spent) break; advance(st, c, Math.min(.05, h - t)); } st.sw = sw; }
    const c = cellNow(st); st.needle = c.V; st.glow = Math.min(1, Math.pow(c.I*c.I*R_BULB/.5, .6));
  },
});
xrMount(() => ui, () => '');
</script></body></html>
