<script>
/* How an LLM works: a cabinet "language machine" that runs the real steps of one small GPT (GPT-2 small: 12 layers,
   768 numbers per token, 12 attention heads, a 50257-token vocabulary) and then samples the next word.

   TRUTH FIRST (what really happens, and where the material is after each step)
   1. Text in. The sentence is only characters: the card standing in the hopper on top.
   2. Tokenize. A byte-pair tokenizer cuts the text into pieces it knows ('the', ' cat', ' sat' ...) and swaps each for
      its number in the vocabulary (' cat' = 3797). Material: one numbered tile per token, in order, on the conveyor.
   3. Embed. Each token number pulls one row of the embedding table: a vector of 768 numbers. A position code is added
      so the model knows the order. Material: one vector per token, standing on its tile.
   4. Transformer layers (x12). Each token's vector rides up its own column, the residual stream. In every layer:
      norm, then attention: Q, K and V projections; each of 12 heads scores how much the token should look at every
      EARLIER token (causal mask), softmaxes the scores and mixes those tokens' V vectors into its stream; then the MLP
      (expand x4, nonlinearity, shrink) adds its own update. Every token's K and V are kept in the KV cache, so a new
      token does not make the old ones run again.
   5. Output. Only the LAST token's vector is read: a final norm, then the LM head multiplies it by the vocabulary
      matrix, giving one score (logit) per token in the vocabulary. Softmax with a temperature turns scores into
      probabilities (low temperature: the top word nearly always; high: more surprises).
   6. Sample. One token is drawn at random by those probabilities (here among the top 5): the sampler wheel.
   7. Repeat. The token is turned back into text (printed on the tape) and appended to the input: its tile rides the
      return tube back into the token chute (it is already a token, so it skips the cutter), and the next pass embeds
      and runs only that new token, reading the rest from the KV cache.
   Token numbers are GPT-2's where known ('the' 1169, ' the' 262, ' on' 319, ' cat' 3797, ' and' 290, '.' 13, ',' 11);
   the rest, and the probabilities, are illustrative.

   PARTS (x = depth 0..60, front at x = 60; y = width 0..120, +y to the viewer's left; z = up, case 6..112 on feet)
   CASE      rounded cabinet . four feet . front display . five stage plates with lamps . temperature knob . NEXT window
             . power lamp . back: fan grille, power inlet, cord, vents . ends: name plate, rating plate
   INPUT     hopper on the top (right) . sentence card . two feed rollers on brackets bolted under the top . cutter blade
             . funnel . clear token chute down to the conveyor . vocabulary drum on two posts . ID stamp arch
   EMBED     conveyor belt with end drums . embedding table (cabinet, one drawer per slot) . position dial on its top .
             vector cells standing on each tile
   LAYERS    four trays (layers 1, 2, 3 and 12) on four corner posts . a residual column per slot through every tray . a
             puck per token per tray . on each tray: norm, Q/K/V projections, 12 head blocks, MLP block . attention arcs
             . KV cache rack on the back wall (one cartridge per token per layer) . weight memory on the floor at the back
             with its bus bar up to every tray
   OUTPUT    final norm (collector) riding the output rail over the last column . rail hanger from the top . LM head with
             five logit bars . softmax unit on a post . temperature shaft from the knob . sampler wheel on the spin motor
             . motor post . pointer . detokenizer on the floor . token lift and its carrier up into the printer . printer
             on the top (left) . output tape . return tube along the top with three clamps, down into the funnel
   POWER     power supply . controller board on the back wall . cooling fan . wiring */
const W = 60, D = 120, H = 112, Z0 = 6, TOP = 142;
const OUT = rrUV(0, Z0, D, H, 9);                                   // case profile in (y, z), swept along x

  [['and', 290, .31], ['.', 13, .29], [',', 11, .16], ['all', 477, .06], ['again', 757, .05]],
  [['then', 788, .22], ['it', 340, .2], ['the', 262, .15], ['purred', 47153, .08], ['slept', 21256, .07]],

const QKV = ['#ef8a5c', '#5fb0d6', '#8ccf7e'], SECT = ['#ef6a4c', '#f4b829', '#93d3b0', '#76a0e2', '#f3a6bb'];

// height, the right one starts under the See-through / Labels switches, and a crowded column packs upward

        + `<circle cx="${f(c.X)}" cy="${f(c.Y)}" r="${f(1.4*k)}" fill="${INK}"/>`

/* ---------- the state machine: stage = steps done this round, target = where the buttons asked to go ---------- */

    // right column: temperature knob markings, NEXT window, power lamp
    body += tx(W + .4, 108, 72.5, 'TEMP', 2.2, INK, 800);
    TEMPS.forEach((v, q) => { const a = (-60 + 60*q)*Math.PI/180; body += tx(W + .4, 108 - 7*Math.sin(a), 82 + 7*Math.cos(a) - .6, String(v), 1.6, INK, q === st.temp ? 900 : 600); });
    body += tx(W + .4, 108, 60.5, 'NEXT', 2.2, INK, 800) + shape(fr(101, 46, 115, 58, 2, .35), SCR, .8);
    if (picked(st)) body += tx(W + .45, 108, 50.8, NEXT[st.gen][st.pick][0], 2.6, AMBER, 800);
    body += shape(fcirc(108, 38, 1.6), '#43c25c', .6) + tx(W + .4, 108, 33.6, 'ON', 1.6, INK, 800);
    // five stage plates: the running one lights up, a green lamp once it has run this round
    PLATES.forEach((p, q) => { const lit = ph === q, dn = q < st.stage;
      body += shape(fr(PLY[q] - 8, 14, PLY[q] + 8, 23, 2, .35), lit ? AMBER : CREAM, .9) + tx(W + .45, PLY[q], 17.6, p, 2.3, INK, 800)
        + shape(fcirc(PLY[q], 26.6, 1.1), lit ? '#ffcf4a' : dn ? '#43c25c' : '#3a3632', .5); });
  }
  if (BACK){ const tb = tone([-1,0,0], m);
    body += fill(pd(on(PX(0), OUT)), tb);
    body += shape(on(PX(-.2), rrUV(20, 60, 90, 104, 4)), mix(tb, '#ffffff', .12), 1);                       // service panel
    for (let q = 0; q < 4; q++) body += shape(on(PX(-.25), ellUV(24 + q*62/3, 100, .8, .8, 8)), METAL.m, .4);
    let v = ''; for (let z = 66; z <= 96; z += 5) v += pd([[-.25, 32, z], [-.25, 78, z]], false);
    body += `<path d="${v}" fill="none" stroke="${INK}" stroke-width="1.1" opacity=".7"/>`;
    body += shape(on(PX(-.2), ellUV(108, 44, 8, 8, 24)), mix(tb, '#000000', .25), 1);                        // fan grille
    let g = ''; for (let q = -6; q <= 6; q += 2) g += pd([[-.3, 108 + q, 44 - Math.sqrt(64 - q*q)*.9], [-.3, 108 + q, 44 + Math.sqrt(64 - q*q)*.9]], false);
    body += `<path d="${g}" fill="none" stroke="${INK}" stroke-width=".8"/>`;
    body += shape(on(PX(-.2), rrUV(102, 9, 114, 17, 1.5)), '#3a3632', .8);                                    // power inlet
    body += shape(on(PX(-.2), rrUV(30, 20, 74, 34, 2)), '#f3f0e6', .9) + txB(-.3, 52, 28.6, 'GPT-2 SMALL  124M PARAMS', 2.3, INK, 800) + txB(-.3, 52, 23.4, '230V~  450W', 2, INK, 700);
  }
  body += extrude(OUT, 0, W, m);
  if (LEFT){ const sm = tone([0,1,0], m);
    body += shape(on(PY(D + .2), rrUV(10, 70, 50, 96, 5)), mix(sm, '#ffffff', .22), 1);
    body += txY(30, D + .3, 84, 'LLM-1', 8, mix(sm, '#000000', .5), 900) + txY(30, D + .3, 75.5, 'LANGUAGE MACHINE', 2.6, mix(sm, '#000000', .5), 800);
    let v = ''; for (let z = 22; z <= 46; z += 4) v += pd([[14, D + .2, z], [46, D + .2, z]], false);
    body += `<path d="${v}" fill="none" stroke="${INK}" stroke-width="1.2" opacity=".7"/>`; }
  if (RIGHT){ const sm = tone([0,-1,0], m);
    body += shape(on(PY(-.2), rrUV(12, 80, 48, 100, 3)), '#f3f0e6', .9);
    body += txY0(30, -.3, 94, '12 LAYERS  12 HEADS', 2.4, INK, 800) + txY0(30, -.3, 89, '768 DIMS  50257 TOKENS', 2.4, INK, 800) + txY0(30, -.3, 84, 'CONTEXT 1024', 2.4, INK, 800);
    let v = ''; for (let z = 22; z <= 46; z += 4) v += pd([[14, -.2, z], [46, -.2, z]], false);
    body += `<path d="${v}" fill="none" stroke="${INK}" stroke-width="1.2" opacity=".7"/>`; }
  if (FRONT) body += ink(pd(on(PX(W), OUT)), 2.2);
  if (BACK) body += ink(pd(on(PX(0), OUT)), 2.2);
  body += hullInk([...on(PX(0), OUT), ...on(PX(W), OUT)], 2.8);
  if (k > 0) body = xrGhost(body, '', k, OUT, 0, W, m) + `<g opacity="${f(k)}">${llmMech(st, k, k > .6)}</g>`;
  s += FRONT ? cord + body + knob : knob + body + cord;
  s += llmTop(st, k);
  if (k > .6) s += MECH_LABELS;
  else s += llmCallouts([
    ...(st.stage === 0 && st.gen === 0 ? [{ at:[42, 15, 128], text:'SENTENCE CARD', on: ph === 0 }] : []),
    { at:[30, 10, 116], text:'HOPPER', on: ph === 0 },
    ...(FRONT ? [{ at:[W, 30, 90], text:'DISPLAY', on: ph >= 0 }, { at:[W, PLY[2], 14], text:'STAGE LAMPS', on: ph >= 0 },
      { at:[W + 3, 108, 86.5], text:'TEMP KNOB', on: ph === 3 }, { at:[W, 102, 52], text:'NEXT WORD', on: picked(st) }] : []),
    { at:[10, 112, 122], text:'PRINTER', on: ph === 4 },
    ...(st.out.length ? [{ at:[22, 108, 124], text:'OUTPUT TAPE', on: ph === 4 }] : []),
    { at:[22, 66, 118], text:'RETURN TUBE', on: ph === 4 && st.t > .3 && st.t < .66 } ], [0, W + 3, 0, D, 0, TOP]);
  return s;
}

/* ---------- behaviour (one state object, one clock) ---------- */
let ui, llmLoop = false;
function llmReset(st){ Object.assign(st, { stage:0, target:0, t:0, ctx: PROMPT.map(c => c.slice()), out: [], gen:0, emb:0, lay:0, probs:null, pick:-1, ang:0, a0:0, a1:0 }); }
function begin(st){                                                  // a step starts
  if (st.stage !== 3) return;
  const cand = NEXT[st.gen], e = cand.map(c => Math.pow(c[2], 1/TEMPS[st.temp])), tot = e.reduce((a, b) => a + b, 0);
  st.probs = e.map(v => v/tot);
  const r = llmRand(st.seed++); let acc = 0, pick = cand.length - 1;
  for (let b = 0; b < cand.length; b++){ if (r < acc + st.probs[b]){ pick = b; break; } acc += st.probs[b]; }
  let mid = 0; for (let b = 0; b < pick; b++) mid += st.probs[b]; mid += st.probs[pick]/2;
  st.pick = pick; st.a0 = st.ang; st.a1 = st.ang + 720 + ((((90 - mid*360 - st.ang) % 360) + 360) % 360);
}
function finish(st){                                                 // a step ends
  const ph = st.stage; st.t = 0;
  if (ph === 1) st.emb = nTok(st);
  if (ph === 2) st.lay = nTok(st);
  if (ph === 3) st.ang = st.a1 % 360;
  if (ph === 4){ const c = NEXT[st.gen][st.pick]; st.ctx.push([c[0], c[1]]); st.out.push(c[0]); st.gen++; st.probs = null; st.pick = -1; st.stage = st.target = 1; return; }
  st.stage++;
}
function runLoop(){
  if (llmLoop) return; llmLoop = true;
  ui.animate(dt => { const st = ui.st;
    if (st.stage < st.target){ st.t += dt*1000/DUR[st.stage]; if (st.t >= 1){ finish(st); if (st.stage < st.target) begin(st); } }
    if (st.stage >= st.target){ llmLoop = false; return false; }
    return true; });
}
function doneMsg(st, s){
  const last = st.ctx[nTok(st) - 1];
  return s === 1 ? (st.gen ? `"${last[0]}" is already token ${last[1]}: it skips the tokenizer` : 'already split into tokens')
    : s === 2 ? 'already embedded' : s === 3 ? 'all 12 layers have run'
    : `already picked "${NEXT[st.gen][st.pick][0]}": Repeat feeds it back in`;
}
function go(st, s){
  if (s === 5 && st.gen >= NMAX - PROMPT.length){ if (llmRun(st)) return ui.flash('one moment');
    llmReset(st); return ui.flash('the context is full: a new sentence goes in', 2200); }
  if (llmRun(st)){ if (s > st.target) st.target = s; else if (s <= st.stage) ui.flash(doneMsg(st, s), 1800); runLoop(); return; }
  if (st.stage >= s) return ui.flash(doneMsg(st, s), 2000);
  st.target = s; st.t = 0; begin(st); runLoop();
}
function instant(st, s){                                             // jump straight to a state (for ?stage= / ?gen= / ?run=)
  if (s === 5){ instant(st, 4); st.target = 5; finish(st); return; }
  while (st.stage < s){ st.target = s; begin(st); finish(st); }
  st.target = st.stage;
}
function setTemp(st, q){
  if (llmPh(st) === 3) return ui.flash('the temperature is set before sampling');
  st.temp = q; if (st.stage === 4) ui.flash('the new temperature counts from the next sample');
}

const llmState = { temp:1, seed:3 }; llmReset(llmState);
ui = mountFigure({
  fig:'LM', title:'How an LLM works', turn:'full',
  size:[W + 3, D, TOP], center:[W/2, D/2], palette:'cobalt',
  state: llmState,
  scene,
  buttons:[
    { label:'Tokenize', onClick:(st) => go(st, 1) },
    { label:'Embed', onClick:(st) => go(st, 2) },
    { label:'Run layers', onClick:(st) => go(st, 3) },
    { label:'Sample next word', onClick:(st) => go(st, 4) },
    { label:'Repeat', onClick:(st) => go(st, 5) },
  ],
  stats: st => [
    { label:'TOKENS', value: String(nTok(st)) },
    { label:'LAYER', value: `${curLayer(st)}/12` },
    { label:'P(NEXT)', small: true, value: picked(st) ? Math.round(100*st.probs[st.pick]) + '%' : '--' },
    { label:'TEMP', value: TEMPS[st.temp].toFixed(1), small: true },
  ],
  acts:{ temp:(st) => setTemp(st, (st.temp + 1) % TEMPS.length) },
  params:(st, q) => {
    if (q.has('temp')) st.temp = Math.max(0, Math.min(2, +q.get('temp') | 0));
    if (q.has('seed')) st.seed = +q.get('seed') | 0;
    const g = Math.max(0, Math.min(NMAX - PROMPT.length, +(q.get('gen') || 0) | 0));
    for (let i = 0; i < g; i++) instant(st, 5);
    if (q.has('stage')) instant(st, Math.max(0, Math.min(4, +q.get('stage') | 0)));
    if (q.has('run')){ const p = Math.max(st.gen ? 1 : 0, Math.min(4, +q.get('run') | 0)); instant(st, p);
      st.target = p + 1; st.t = clamp01(+(q.get('t') || .5)); begin(st); }
  },
});
xrMount(() => ui, () => '');
</script></body></html>
