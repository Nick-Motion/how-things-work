<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The neuron</title></head><body>
<script src="core.js"></script>
<script>
/* The neuron: a teaching model of two nerve cells on a bench board, wired to a stimulator and a two-channel oscilloscope.
   How it really works (and where every ion, wave and molecule is after each step):
   1. At rest the membrane sits at -70 mV: inside negative, Na+ crowded outside, K+ inside (the Na/K pump keeps it so).
   2. Poke: the micromanipulator advances the stimulating electrode onto a dendrite and the stimulator injects a pulse.
      The dendrite depolarises where it is touched and the change spreads passively toward the cell body, shrinking as it
      goes (graded potential; here 60% of it is left at the cell body).
   3. The axon hillock / initial segment decides. If the cell body passes the -55 mV threshold, voltage-gated Na+ channels
      open, Na+ rushes in and the membrane swings to +40 mV. Then Na+ channels close and K+ channels open, K+ flows out,
      the membrane falls to -80 mV (undershoot) and recovers to -70 mV. A weak poke (-64 mV at the cell body) just fades.
   4. Myelin (one Schwann cell per sleeve) insulates the axon, so the action potential is only regenerated at the nodes of
      Ranvier between sleeves: it jumps node to node (saltatory conduction, ~60 m/s here instead of ~1 m/s bare).
   5. At the axon terminal the spike opens voltage-gated Ca2+ channels, Ca2+ enters, synaptic vesicles fuse with the
      membrane and release glutamate into the synaptic cleft (20-40 nm wide; drawn much wider).
   6. Glutamate crosses the cleft and opens AMPA receptors on neuron 2's dendritic spine: Na+ enters and neuron 2 depolarises
      (an EPSP of about +12 mV, recorded on channel 2). Reuptake pumps clear glutamate from the cleft.
   7. Blocker: a drop of CNQX (an AMPA receptor antagonist) from the dropper bottle sits on the receptors; the spike still
      arrives and glutamate is still released, but neuron 2 stays at -70 mV. A drop of saline washes it out.
   Time is slowed: one second on screen is about two milliseconds in the real cell.

   Parts (each held by another):
   BOARD    bench board . six clear acrylic support posts with feet and saddles under soma, sleeves, terminal, neuron 2
   NEURON 1 dendrites (stim branch + six more) with dendritic spines . cell body: nucleus, nucleolus, Nissl bodies (rough ER),
            Golgi apparatus, mitochondria . axon hillock . initial segment . axon with microtubules and mitochondria .
            five myelin sleeves (Schwann cells) with their nuclei . four nodes of Ranvier with Na+ channels, K+ channels and
            Na/K pumps . axon terminal bouton: vesicles, mitochondrion, Ca2+ channels, reuptake pumps
   SYNAPSE  synaptic cleft . glutamate . AMPA receptors on the spine head . postsynaptic density
   NEURON 2 dendritic spine and its dendrite . three more dendrites . cell body with nucleus, nucleolus, mitochondrion .
            hillock and axon with one myelin sleeve, a node and its onward axon
   RIG      stimulator (battery box, strength dial, red fire button, LED, output socket) . stimulating electrode on a
            micromanipulator stand (foot, post, clamp, arm, slide block, holder, glass pipette) . two recording electrodes on
            stands into the two cell bodies . two-channel oscilloscope (screen, knobs, power switch, CH1/CH2 sockets, mains
            cord out of the back) . cables socket to socket along posts and board . CNQX dropper bottle . saline dropper bottle */

/* ---------- geometry (x = depth toward the viewer, y = width toward viewer-left, z = up) ---------- */
const BW = 92, BD = 242, BH = 3, BR = 6;
const BTOP = boardTop(0, 0, BW, BD, BH, BR);
const AX = 50, AZ = 18, AR = 1.9;                                  // neuron 1's axon runs along y at x = AX, z = AZ
const S1 = [50, 180, 18], S1R = [10, 11, 8];                       // cell body 1
const S2 = [50, 22, 16], S2R = [8, 8, 6.5];                        // cell body 2
const SLEEVES = [[140, 156], [120, 136], [100, 116], [80, 96], [60, 76]];
const AX_SITES = [158, 138, 118, 98, 78, 56];                      // initial segment, four nodes, terminal: where the spike is made
const BOUT = [50, 48.6, 18], BOUTR = [4.4, 4, 4.4];                // terminal bouton, y 44.6..52.6
const SPN = [50, 39.8, 18], SPNR = [3.2, 1.8, 3.2];                // neuron 2's spine head, y 38..41.6
const CLEFT = [41.6, 44.6], SYN = [50, 43.1, 18];
const STIM = [68, 204, 21];                                        // where the stimulating electrode touches
const SC = { x0: 4, x1: 30, y0: 84, y1: 154, z1: 48 };             // oscilloscope
const SCP = rrUV(SC.y0, BH, SC.y1, SC.z1, 3);
const STB = { x0: 70, x1: 88, y0: 224, y1: 240, z1: 14 };          // stimulator
const STP = rrUV(STB.y0, BH, STB.y1, STB.z1, 1.6);
const BOTTLES = [ { x: 80, y: 72, name: 'CNQX', act: 'cnqx' }, { x: 80, y: 86, name: 'SALINE', act: 'saline' } ];
const BOT_R = 4, NECK_Z = 17.5, PIP_L = 10.5, DROP_Z = 30;
const SUPPORTS = [[50, 180, 10], [50, 128, 13.1], [50, 88, 13.1], [50, 56.5, 16.1], [50, 22, 9.5], [70, 5, 11.6]];

const addv = (a, b) => [a[0]+b[0], a[1]+b[1], a[2]+b[2]], scl = (a, k) => a.map(v => v*k);
const lerp3 = (a, b, t) => a.map((v, i) => v + (b[i] - v)*t);
const clamp01 = v => Math.max(0, Math.min(1, v));
const dist3 = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1], a[2]-b[2]);
const sm01 = t => { t = clamp01(t); return t*t*(3 - 2*t); };
const boxOf = (pts, e = .05) => [[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - e), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + e)];
const hullPath = pts3 => sp(hull(pts3.map(p => P(...p))));
const circ = (p, r, fillC, w = .6, extra = '') => { const [X, Y] = P(...p); return `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(r*CAM_K)}" fill="${fillC}"${w ? ` stroke="${INK}" stroke-width="${w}"` : ''} ${extra}/>`; };

/* ---------- colours ---------- */
const NEU2 = matOf('#b9a6ea');
const MYEL = { l: '#fff6df', m: '#efe0b8', d: '#c9b688' };
const SCOPEM = { l: '#b4c0c8', m: '#919ea8', d: '#5f6c76' };
const STIMM = PALS.mustard;
const KNOBM = { l: '#fff4d6', m: '#e6dcbd', d: '#bfb390' };
const REDM = matOf('#e2483d'), RUBM = matOf('#3a3632'), WHITEM = matOf('#f3efe4');
const AMBER = { l: '#d68f3e', m: '#ad6a2b', d: '#6e3f18' }, GLASSM = { l: '#e7f3f5', m: '#c9e1e6', d: '#9dbcc3' };
const NUCM = matOf('#9b80d6'), NUCLM = matOf('#5c3f96'), ERM = matOf('#6aa8de'), GOLM = matOf('#f0a646'), MITM = matOf('#ea7650');
const NACH = matOf('#ff9f1c'), KCH = matOf('#8a5cf0'), PUMPM = matOf('#43a86a'), CACH = matOf('#5fcf6a'), RECM = matOf('#d0573f'), TRANSM = matOf('#3f7fc0');
const NAC = '#ff9f1c', KC = '#8a5cf0', CAC = '#5fcf6a', GLUC = '#e2483d', DRUGC = '#22a99e';
const HOT = '#ffe14d', COLD = '#7d8cf0';
// membrane colour follows its voltage: yellow when depolarised, a little blue in the undershoot
function tint(M, v, span = 60){
  if (v >= -70){ const k = Math.pow(clamp01((v + 70)/span), .8); return k < .01 ? M : { l: mix(M.l, HOT, k), m: mix(M.m, HOT, k*.9), d: mix(M.d, '#b8901c', k*.8) }; }
  const k = clamp01((-70 - v)/14)*.6; return { l: mix(M.l, COLD, k), m: mix(M.m, COLD, k), d: mix(M.d, '#2c3470', k) };
}

/* ---------- shapes ---------- */
function ringAt(c, d, r, n = 12){
  const u = norm(cross(d, Math.abs(d[2]) < .9 ? [0,0,1] : [1,0,0])), v = cross(d, u), o = [];
  for (let i = 0; i < n; i++){ const t = i/n*2*Math.PI, a = Math.cos(t)*r, b = Math.sin(t)*r;
    o.push([c[0] + u[0]*a + v[0]*b, c[1] + u[1]*a + v[1]*b, c[2] + u[2]*a + v[2]*b]); }
  return o;
}
// a living tube (dendrite, hillock, organelle): one outline round the whole branch and no ink on its joints.
// rootIn: the first piece starts inside a body (cell body, bouton, parent branch), so it gets no outline and grows out smoothly.
function tubeSvg(pts, rs, cols, rootIn = true, wInk = 2.6, n = 12, shade = tone){
  let ik = '', disc = '', fl = '', d = [0, 1, 0];
  for (let i = 0; i < pts.length - 1; i++){
    const a = pts[i], b = pts[i+1]; d = norm(sub(b, a));
    const A = ringAt(a, d, rs[i], n), B = ringAt(b, d, rs[i+1], n), M = cols[i];
    if (i > 0){ disc += circ(a, rs[i], M.m, 0);
      if (!(rootIn && i === 1)) ik += circ(a, rs[i], INK, 0, `stroke="${INK}" stroke-width="${wInk}"`); }
    fl += loft(A, B, nr => shade(nr, M));
    if (!(rootIn && i === 0)) ik += `<path d="${hullPath([...A, ...B])}" fill="${INK}" stroke="${INK}" stroke-width="${wInk}" stroke-linejoin="round"/>`;
  }
  const e = pts[pts.length - 1], rl = rs[rs.length - 1];
  if (rl > .05 && vis(d)) fl += face(pd(ringAt(e, d, rl, n)), shade(d, cols[cols.length - 1]));
  return ik + disc + fl;
}
const tubeBox = (pts, rs) => boxOf(pts.flatMap((p, i) => [addv(p, [rs[i], rs[i], rs[i]]), addv(p, [-rs[i], -rs[i], -rs[i]])]));
// a rounded body (cell body, nucleus, bouton): latitude bands
function blob(c, R, M, w = 2.4, shade = tone, nl = 7, n = 20){
  const rings = [];
  for (let j = 0; j <= nl; j++){ const ph = (-80 + 160*j/nl)*Math.PI/180;
    rings.push(on(PZ(c[2] + R[2]*Math.sin(ph)), ellUV(c[0], c[1], R[0]*Math.cos(ph), R[1]*Math.cos(ph), n))); }
  let s = '';
  for (let j = 0; j < nl; j++) s += loft(rings[j], rings[j+1], nr => shade(nr, M));
  if (vis([0,0,1])) s += face(pd(rings[nl]), shade([0,0,1], M));
  if (vis([0,0,-1])) s += face(pd(rings[0]), shade([0,0,-1], M));
  return s + (w ? hullInk(rings.flat(), w) : '');
}
const blobBox = (c, R) => [[c[0]-R[0], c[1]-R[1], c[2]-R[2]], [c[0]+R[0], c[1]+R[1], c[2]+R[2]]];
// a point on a body's surface in direction d
const onBlob = (c, R, d) => { const t = 1/Math.hypot(d[0]/R[0], d[1]/R[1], d[2]/R[2]); return addv(c, scl(d, t)); };
// a myelin sleeve (one Schwann cell wrapped round the axon), along y or x, with rounded ends
function sleeveSvg(axis, a0, a1, c, rMax, M){
  const ts = [a0, a0+.6, a0+1.6, a0+3, a1-3, a1-1.6, a1-.6, a1], rs = [2.2, .73, .92, 1, 1, .92, .73, 2.2].map((k, i) => i === 0 || i === 7 ? k : k*rMax);
  const ring = (t, r) => axis === 'y' ? on(PY(t), ellUV(c[0], c[1], r, r, 18)) : on(PX(t), ellUV(c[0], c[1], r, r, 18));
  const R = ts.map((t, i) => ring(t, rs[i]));
  let s = ''; for (let i = 0; i < 7; i++) s += loft(R[i], R[i+1], nr => tone(nr, M));
  const n0 = axis === 'y' ? [0,-1,0] : [-1,0,0], n1 = n0.map(v => -v);
  if (vis(n0)) s += face(pd(R[0]), M.d); if (vis(n1)) s += face(pd(R[7]), M.d);
  return s + hullInk(R.flat(), 2.2);
}
// a bare stretch of axon along y
const bareY = (y0, y1, M, r = AR) => { const A = on(PY(y0), ellUV(AX, AZ, r, r, 16)), B = on(PY(y1), ellUV(AX, AZ, r, r, 16));
  return loft(A, B, nr => tone(nr, M)) + hullInk([...A, ...B], 1.4); };
const stud = (c, d, r0, r1, rr, M) => rod(addv(c, scl(d, r0)), addv(c, scl(d, r1)), rr, M, toneI, .5, rr, 8);
const mito = (a, b, r) => { const d = sub(b, a), pts = [a, addv(a, scl(d, .22)), addv(a, scl(d, .78)), b];
  let s = tubeSvg(pts, [r*.4, r, r, r*.4], [MITM, MITM, MITM], false, 1.3, 10, toneI);
  const u = norm(cross(norm(d), [0,0,1])), cr = []; for (let i = 0; i <= 8; i++) cr.push(addv(addv(addv(a, scl(d, .18 + .64*i/8)), [0, 0, r*.75]), scl(u, (i % 2 ? .5 : -.5)*r)));
  return s + line(cr, .45); };
const mitoBox = (a, b, r) => boxOf([a, b], r + .05);
const mtub = (y0, y1) => [[.8, 0], [-.6, .55], [-.25, -.75]].map(([dx, dz]) => `<path d="${pd([[AX+dx, y0, AZ+dz], [AX+dx, y1, AZ+dz]], false)}" fill="none" stroke="#2f7d6a" stroke-width=".55"/>`).join('');
// glass ghost of a membrane in see-through, and the insides drawn over it
const gh = (svg, k) => k > 0 ? `<g opacity="${f(1 - .74*k)}">${svg}</g>` : svg;
const inn = (svg, k) => k > 0 && svg ? `<g opacity="${(k).toFixed(2)}">${svg}</g>` : '';

/* ---------- the neurons' branches ---------- */
// grow(): a branch leaving a body, starting inside it (no outline there) and leaving through its surface
const grow = (c, R, pts, rs) => { const q = sub(pts[0], c), t1 = 1/Math.hypot(q[0]/R[0], q[1]/R[1], q[2]/R[2]);
  return { pts: [addv(c, scl(q, t1*.5)), addv(c, scl(q, t1*1.03)), ...pts], rs: [rs[0]*1.7, rs[0]*1.25, ...rs], fromBody: true }; };
const BR1 = [
  { ...grow(S1, S1R, [[62,194,20],[68,204,21],[72,214,20.5],[75,221.5,20]], [2.2,1.8,1.3,.8]), stim: true },
  { pts: [[68,204,21],[66.6,207,21.2],[64,213,21.5],[63,220.5,21.5]], rs: [1.4,1.35,1.1,.6], stim: true },
  { ...grow(S1, S1R, [[51,198,20.5],[50.5,210,21],[46,222,20.5],[43,231,20]], [2.4,1.9,1.3,.7]), spines: true },
  { pts: [[50.5,210,21],[52,213,21],[56,222,21],[58,230,20.5]], rs: [1.4,1.3,.9,.5], spines: true },
  { ...grow(S1, S1R, [[39,193,19],[35,203,18.5],[32,214,18]], [2.2,1.6,.8]), spines: true },
  { pts: [[35,203,18.5],[37.4,205.6,18.6],[40,210,19],[40.5,217,19]], rs: [1.3,1.2,.9,.5] },
  { ...grow(S1, S1R, [[61,173,15],[67,169,14],[72,164,13.5]], [1.9,1.4,.7]) },
  { ...grow(S1, S1R, [[39,173,15.5],[34,168,15],[31.5,162,14.5]], [1.9,1.4,.7]) },
];
const HILL1 = grow(S1, S1R, [[50,166,18],[50,161,18],[50,156,18]], [3.2,2.1,1.9]);
const TERM1 = grow(BOUT, BOUTR, [[50,56,18],[50,60,18]], [1.9,1.9]);
const BR2 = [
  { ...grow(S2, S2R, [[50,32,17],[50,35.5,17.6],[50,38.6,18]], [2.2,1.5,.9]), recv: true },
  { ...grow(S2, S2R, [[58,28,15.5],[65,33,15],[72,38,14.5],[79,36,14]], [2,1.6,1.1,.6]), spines: true },
  { ...grow(S2, S2R, [[42,28,16.5],[37,34,16],[33,41,15.5]], [2,1.4,.7]) },
  { ...grow(S2, S2R, [[42,16,15.5],[36,13,15],[30,8,14.5]], [1.8,1.3,.6]) },
];
const AX2 = grow(S2, S2R, [[56,14,15.5],[58.5,10,15],[61,6.5,15],[63,5,15]], [2.4,1.7,1.5,1.4]);
const SLV2 = [63, 77], N2Y = 5, N2Z = 15;
// how far each dendrite piece is from the stimulating electrode, along the cell (for the graded potential)
const SIM = { tS: .35, TR: .25, VD: 80, ATT: .6, STEP: .2, TR2: .35, EPSP: 12, DS: 22 };
SIM.LAM = SIM.DS / Math.log(1/SIM.ATT);
for (const b of BR1) b.segS = b.pts.slice(0, -1).map((p, i) => { const mid = lerp3(p, b.pts[i+1], .5);
  return b.stim ? dist3(mid, STIM) : SIM.DS + Math.max(0, dist3(mid, S1) - 10); });
// dendritic spines: little knobs on the top of the outer pieces
for (const b of [...BR1, ...BR2]) b.sp = !b.spines ? [] : b.pts.slice(2, -1).map((p, i) => { const q = lerp3(p, b.pts[i+3], .5), r = (b.rs[i+2] + b.rs[i+3])/2; return { base: addv(q, [0, 0, r*.5]), top: addv(q, [0, 0, r + 1]), seg: i + 2 }; });

/* ---------- the physiology (one clock, in slowed seconds) ---------- */
const alpha = (u, a, tr) => u <= 0 ? 0 : a*(u/tr)*Math.exp(1 - u/tr);
// a patch of membrane u seconds after it fires: up to +40 mV (Na+ in), down to -80 mV (K+ out), back to -70 mV
function apWave(u){
  if (u < -.06 || u > 1.1) return null;
  if (u < 0) return -70 + 15*(u + .06)/.06;
  if (u < .12) return -55 + 95*sm01(u/.12);
  if (u < .36) return 40 - 120*sm01((u - .12)/.24);
  return -80 + 10*(1 - Math.exp(-(u - .36)/.2))/(1 - Math.exp(-.74/.2));
}
function evMake(t0, kind){
  const a0 = kind === 'strong' ? 35 : 10, aS = a0*SIM.ATT, fires = aS >= 15;
  let x = 0;
  if (fires){ const want = 15/aS; let lo = 0, hi = 1; for (let i = 0; i < 30; i++){ const mm = (lo + hi)/2; if (mm*Math.exp(1 - mm) < want) lo = mm; else hi = mm; } x = (lo + hi)/2; }
  const tF = t0 + SIM.tS + SIM.DS/SIM.VD + x*SIM.TR;
  const sites = AX_SITES.map((_, i) => tF + .05 + SIM.STEP*i);
  return { t0, kind, a0, aS, fires, tF, sites, tT: sites[sites.length - 1], blk: null, said: 0 };
}
function vSoma(st, T){
  let v = -70;
  for (const e of st.ev){ if (T < e.t0) continue;
    if (e.fires && T >= e.tF){ const a = apWave(T - e.tF); if (a != null) return a; continue; }
    v += alpha(T - e.t0 - SIM.tS - SIM.DS/SIM.VD, e.aS, SIM.TR); }
  return v;
}
function vDend(st, s, T){ let v = -70;
  for (const e of st.ev) if (T >= e.t0) v += alpha(T - e.t0 - SIM.tS - s/SIM.VD, e.a0*Math.exp(-s/SIM.LAM), SIM.TR);
  return v; }
function vSite(st, i, T){ for (const e of st.ev){ if (!e.fires) continue; const a = apWave(T - e.sites[i]); if (a != null) return a; } return -70; }
const blkOf = (st, e) => e.blk != null ? e.blk : st.block > .5 ? 1 : 0;
function vN2(st, T, lead = 0){ let v = -70;
  for (const e of st.ev) if (e.fires) v += alpha(T - e.tT - .45 + lead, SIM.EPSP*(1 - blkOf(st, e)), SIM.TR2);
  return v; }
const lastFired = st => { for (let i = st.ev.length - 1; i >= 0; i--) if (st.ev[i].fires) return st.ev[i]; return null; };

/* ---------- ions at a patch of axon (Na+ in, then K+ out), split behind / in front of the membrane ---------- */
function ionsAt(st, i, yc, rr = AR){
  const e = lastFired(st), out = { far: '', near: '', na: false, k: false }; if (!e) return out;
  const u = st.T - e.sites[i];
  for (let j = 0; j < 6; j++){ const a = (j*60 + 15)*Math.PI/180, d = [Math.cos(a), 0, Math.sin(a)], y = yc + (j % 2 ? .9 : -.9);
    const pNa = (u + .05)/.2, pK = (u - .1)/.36;
    if (pNa > 0 && pNa < 1){ out.na = true; const r = rr + .4 + 5*(1 - sm01(pNa)), c = addv([AX, y, AZ], scl(d, r)), g = circ(c, .8, NAC, .6);
      if (vis(d)) out.near += g; else out.far += g; }
    if (pK > 0 && pK < 1){ out.k = true; const r = rr + .4 + 5*sm01(pK), c = addv([AX, y + (j % 2 ? -.5 : .5), AZ], scl(d, r)), g = circ(c, .8, KC, .6, `opacity="${f(1 - Math.max(0, pK - .7)/.3)}"`);
      if (vis(d)) out.near += g; else out.far += g; }
  }
  return out;
}
// channels in the membrane of a node (see-through): Na+ channels crowd the nodes, with K+ channels and Na/K pumps
const NODE_CH = [0,1,2,3,4,5,6,7].map(j => ({ a: j*45 + 22, dy: j % 2 ? .8 : -.8, M: j === 3 || j === 7 ? PUMPM : j === 1 || j === 5 ? KCH : NACH }));
const nodeChannels = (yc, rr = AR) => NODE_CH.map(c => { const a = c.a*Math.PI/180, d = [Math.cos(a), 0, Math.sin(a)];
  return { d, svg: stud([AX, yc + c.dy, AZ], d, rr - .3, rr + .9, .42, c.M) }; });

/* ---------- see-through insides ---------- */
const NISSL = [[43.5,178,17], [56.5,182.5,17.5], [47.5,173.6,17.4], [53,188.4,18], [45,186.6,19.4]];
const GOLGI = [5, 5.8, 6.6].map(r => Array.from({ length: 7 }, (_, i) => { const a = (-90 - 26 + 52*i/6)*Math.PI/180; return [50 + r*Math.cos(a)*.9, 179 + r*Math.sin(a), 18.6]; }));
const MITO1 = [[[44,182,21.5],[46.5,185,21.8]], [[55,176,20.6],[57,179.2,20.8]], [[53,186,15.4],[56.4,185,15.8]]];
function somaInside(){
  const it = [], put = (b, svg) => it.push({ box: b, svg });
  const NC = [50, 181, 18.6], NR = [4.3, 4.3, 3.8];
  put(blobBox(NC, NR), blob(NC, NR, NUCM, 1.4, toneI, 6, 18) + blob([51, 182, 19.6], [1.4, 1.4, 1.3], NUCLM, .8, toneI, 4, 12));

function run(){
  if (loopOn) return; loopOn = true;
  ui.animate(dt => { const st = ui.st; st.T += dt; st.press = Math.max(0, st.press - dt);
    if (st.drop){ const d = st.drop; d.t += dt;
      if (d.t >= 1.5 && !d.landed){ d.landed = true; st.blockT = d.src === 0 ? 1 : 0; ui.flash(d.src === 0 ? 'CNQX lands on the synapse: the AMPA receptors are blocked' : 'Saline washes the CNQX off the receptors', 2400); }
      if (d.t >= 2.6) st.drop = null; }
    if (st.block < st.blockT) st.block = Math.min(1, st.block + dt/.6); else if (st.block > st.blockT) st.block = Math.max(0, st.block - dt/1.2);
    const e = st.ev[st.ev.length - 1];
    if (e){
      if (e.said < 1 && e.fires && st.T >= e.tF){ e.said = 1; ui.flash('Threshold reached: an action potential fires', 2000); }
      if (e.said < 1 && !e.fires && st.T >= e.t0 + SIM.tS + SIM.DS/SIM.VD + SIM.TR){ e.said = 1; ui.flash('Too weak: it fades out below the -55 mV threshold', 2400); }
      if (e.fires && e.said < 2 && st.T >= e.tT){ e.said = 2; e.blk = st.block > .5 ? 1 : 0; }
      if (e.fires && e.said < 3 && st.T >= e.tT + .9){ e.said = 3; ui.flash(e.blk ? 'Blocked: glutamate is released but CNQX holds the receptors shut' : 'Glutamate opens the receptors: neuron 2 depolarises', 2400); }
    }
    const b = busy(st); if (!b) loopOn = false; return b; });
}
function poke(st, kind){
  const e = st.ev[st.ev.length - 1];
  if (e && st.T - e.t0 < (e.fires ? 3 : 1.1)) return ui.flash('Refractory: let the trace settle first');
  st.ev = st.ev.filter(x => st.T - x.t0 < 9); st.ev.push(evMake(st.T, kind)); st.kind = kind; st.press = .25; run();
}
function addDrop(st, src){
  if (st.drop) return ui.flash('One drop at a time');
  if (src === 0 && st.blockT === 1) return ui.flash('The blocker is already on the synapse');
  if (src === 1 && st.blockT === 0 && st.block === 0) return ui.flash('No blocker to wash out yet');
  st.drop = { src, t: 0, landed: false }; run();
}
const fmtV = v => (v > .5 ? '+' : '') + Math.round(v) + ' mV';

ui = mountFigure({
  fig: 'B1', title: 'The neuron', size: [BW + 90, BD, 130], center: [BW/2, BD/2], palette: 'blush', turn: 'full',
  state: { T: 0, ev: [], kind: 'strong', press: 0, block: 0, blockT: 0, drop: null },
  scene,
  stats: st => [ { label: 'Cell body CH1', value: fmtV(vSoma(st, st.T)) },
    { label: 'Neuron 2 CH2', value: fmtV(vN2(st, st.T)), small: true },
    { label: 'Threshold', value: '-55 mV', small: true } ],
  buttons: [
    { label: 'Poke strong', onClick: st => poke(st, 'strong') },
    { label: 'Poke weak', onClick: st => poke(st, 'weak') },
    { label: 'Add blocker', onClick: st => addDrop(st, 0) },
    { label: 'Wash out', onClick: st => addDrop(st, 1) },
  ],
  acts: { poke: st => poke(st, 'strong'), cnqx: st => addDrop(st, 0), saline: st => addDrop(st, 1) },
  params: (st, q) => {
    if (q.get('block') === '1') st.block = st.blockT = 1;
    if (q.has('poke')){ const kind = q.get('poke') === 'weak' ? 'weak' : 'strong', e = evMake(0, kind);
      st.T = +(q.get('pt') || 1.5); e.said = 9; if (st.T >= e.tT) e.blk = st.block > .5 ? 1 : 0; st.ev = [e]; st.kind = kind; }
    if (q.has('drop')){ const t = +q.get('drop'); st.drop = { src: q.get('src') === '1' ? 1 : 0, t, landed: t >= 1.5 }; }
  },
});
xrMount(() => ui, () => '');
addEventListener('load', () => setTimeout(() => ui.render(), 400));
</script></body></html>
