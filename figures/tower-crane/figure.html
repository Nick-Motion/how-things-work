   Hoist winds a two-fall rope from its drum, over lifting guides, around the trolley and hook sheaves,
   to the jib-tip anchorage. Raising the hook by d takes up 2d of rope. A separate trolley loop rolls
   the trolley on the jib rails. Counterweight balances the jib and load, as with the shadoof.
   Climb lowers the ordinary payload to the ground and detaches it. Move the empty hook to the waiting
   complete section. The ram pushes against a mast-supported crosshead and lifts the rigid climbing
   cage and entire top assembly. Hoist the section, trolley it into the gap, seat it and fasten bolts.
   The lower tower never stretches. This slowed scale sequence is not a construction procedure.
   It omits rigging labour, balance calculations, repeated ram strokes, temporary locks and frame removal.
   Reset replaces the teaching setup. Blue hoist and coral trolley ropes are real ropes recoloured in xray.
   Parts and attachment. Foundation, base plates and anchors hold mast chords, ties, braces, splice
   lugs and ladder. A mast crosshead holds the ram barrel. Its rod bears on the cage top crossbeam.
   Cage posts, guide shoes and platform move together. Slewing bearing and ring carry the deck.
   Motor pinion touches the ring. Deck holds cab, jib roots and A-frame. Jib webs and chords carry
   rails, trolley wheels, stops and rope anchor. A-frame stays support both jibs. Counter-jib carries
   counterweight, hoist bearings, drum, shaft, brake, motor and independent trolley winch and motor.
   Hook sheave, axle, cheeks, swivel, hook and slings support the payload or complete mast section.

function tcMove(st,ui,action,seconds,step){

}

  else if(elapsed<3.5){st.stage='Remove payload';st.payload.z=0;st.attached='';const q=ease((elapsed-2)/1.5);st.hook=tcMix(30,75,q);st.trolley=tcMix(start.trolley,156,q);}

  else if(elapsed<7){st.stage='Attach mast section';st.lift=32;st.hook=tcMix(75,50,ease((elapsed-5.5)/1.5));}
  else if(elapsed<9.5){st.stage='Hoist complete section';st.attached='section';st.hook=tcMix(50,181,ease((elapsed-7)/2.5));st.section.z=st.hook-50;}

}
