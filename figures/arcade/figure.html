<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arcade cabinet</title></head><body>
<script src="core.js"></script>
<script>
/* Real process (where every coin and every signal is after each step):
   1. Insert coin: the quarter goes edge-first into the slit of the left coin entry on the coin door, rolls down the coin
      mech (it checks size and metal; a slug goes to the coin return cup), drops past the coin switch, whose wire arm
      clicks once, and falls into the cash box. The coin switch grounds a pin on the JAMMA edge connector: the game
      board adds a credit (CREDIT 1 on screen) and pulses the coin meter on the door, which counts coins for the operator.
   2. Start: the start button's microswitch takes one credit and the game begins: 3 ships, score 0.
   3. Play: the joystick's actuator presses one of four microswitches (up, down, left, right); the fire button has its
      own. The board's CPU reads them, moves the ship, fires, and sends red, green, blue and sync to the monitor chassis,
      which steers the CRT's electron beams with the deflection yoke. Rocks fall; a shot breaks them (+50 / +100).
   4. A rock that hits the ship costs a life. After the last one: GAME OVER, the high score is kept, and the board goes
      back to its attract screen (INSERT COIN, or PUSH START while credit is left).

   Geometry (cm): an upright cabinet 64 wide, 80 deep with the control panel, 178 tall. x = depth (the front face is
   x = 62, the control panel juts to x = 80), y = width (+y = viewer-left), z = up. The side panels are one profile.

   Parts list (see-through) — each is held by the part named after it:
   CASE      side panels with T-molding (the frame) . floor . back panel with service door, vents, warning sticker .
             marquee with backlit plexi . bezel glass . control panel (top, lip, underside) . kick plate
   MONITOR   CRT tube with its metal rim band (on the monitor frame) . electron gun in the neck . deflection yoke on the
             neck . neck board on the gun's pins . anode cap on the funnel, high-voltage lead to the flyback .
             degauss coil round the rim . monitor frame bars, brackets to the side panels . monitor chassis with flyback,
             heatsink and capacitors (on the monitor shelf) . monitor shelf (on cleats in the side panels)
   GAME      game PCB (CPU, ROMs, custom chip, RAM) on standoffs on the right side panel . JAMMA edge connector
   POWER     power cord . AC inlet, fuse, power switch, interlock switch (back panel) . isolation transformer (floor) .
             switching power supply 5 V / 12 V (floor) . cooling fan (back panel) . fluorescent tube with its sockets
             and starter (side panels) . ballast (under the top)
   SOUND     speaker on the marquee floor, firing down through a grille
   COINS     coin entries, reject buttons, coin return cup (door) . coin mechs with coin lamps (back of the door) .
             coin switches (under the mechs) . coin meter (door) . cash box (floor, behind the cash door)
   CONTROLS  joystick: ball top, shaft, mounting plate (under the panel top), actuator, four microswitches .
             fire button and start button, each in a housing with its microswitch
   HARNESS   JAMMA to controls, to coin door, to speaker, to monitor chassis; power supply to JAMMA; mains from the inlet
             to the interlock, transformer, power supply, fan and ballast; transformer to chassis; chassis to neck board */

/* ---------- geometry ---------- */
const FX = 62, XM = 80, D = 64, H = 178, FL = 1.8, WL = 1.8;      // front face, panel lip, width, height, floor top, wall
const PROF = [[0,0],[FX,0],[FX,74],[XM,86],[XM,94],[64,100],[52,150],[64,150],[64,H],[0,H]];   // side profile (x, z)
const zcp = x => 94 + (XM - x) * .375;                             // control-panel top
const NCP = norm([6, 0, 16]), PCP = ([u, v]) => [u, v, zcp(u)];
const NS = [.9724, 0, .2334], VS = [-.2334, 0, .9724];             // bezel normal, up the bezel
const PSc = (off = 0) => ([u, v]) => [64 + VS[0]*v + NS[0]*off, u, 100 + VS[2]*v + NS[2]*off];
const GW = 38, GH = 28.8, GV0 = 8.74;                               // the picture: 38 x 28.8 cm, 8.74 cm up the bezel
const G = (gx, gy, off = .15) => PSc(off)([51 - gx, GV0 + gy]);     // game cm (left->right, bottom->top) to 3D
const CE = [37.5, 26.5];                                            // coin entries (y); coins go in the left one
const JOY = [71, 44], FIREB = [71.5, 24], STARTB = [66.5, 32];
const BLK = { l:'#4a4550', m:'#34303a', d:'#221f26' }, SPACE = '#2c1d5c', GOLD = '#ffd23f';
const COINM = { l:'#eceae2', m:'#c6c2b6', d:'#8f8b80' };
const edgeQ = i => { const a = PROF[i], b = PROF[(i + 1) % PROF.length];
  return { n: norm([b[1] - a[1], 0, a[0] - b[0]]), q: [[a[0],0,a[1]],[b[0],0,b[1]],[b[0],D,b[1]],[a[0],D,a[1]]] }; };
const txOn = (p, U, V, str, size, col, wt = 800) => `<text transform="${txM(P(...p), Dv(...U), Dv(...V))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${wt}" letter-spacing=".05em">${str}</text>`;
const txS = (gx, gy, str, size, col, wt) => txOn(G(gx, gy, .2), [0,-1,0], [-VS[0], 0, -VS[2]], str, size, col, wt);   // on the screen
const txCP = (x, y, str, size, col) => txOn([x, y, zcp(x) + .05], [0,-1,0], [NCP[2], 0, -NCP[0]], str, size, col);
const txB = (x, y, z, str, size, col) => txOn([x, y, z], [0,1,0], [0,0,-1], str, size, col);           // on the back
const circ = (X, Y, r, c) => `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(r)}" fill="${c}"/>`;

/* ---------- state ---------- */
function fresh(){
  return { credit:0, coins:0, score:0, hi:1200, lives:0, phase:'idle', t:0, gt:0, overT:0, seed:7,
    ship:{ x:GW/2, y:3.5 }, shots:[], rocks:[], fx:[], spawn:0, boom:0,
    coin:null, meterT:0, fireT:0, startT:0, snd:0, tilt:[0,0], tiltDir:[0,0], tiltHold:0, step:null };
}
const st = Object.assign({ pal:'mustard' }, fresh());
const keys = {};
const rnd = () => (st.seed = (st.seed * 16807) % 2147483647) / 2147483647;
const STARS = (() => { let s = 3; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  return Array.from({ length:26 }, () => [1 + r() * (GW - 2), r() * GH, 1.5 + r() * 3]); })();

/* ---------- the game on the screen ---------- */
const SHIP = ['...#...', '..###..', '..###..', '.#####.', '###.###', '##...##'];
const ROCK = ['.###.', '##.##', '#####', '###.#', '.###.'];
const pix = (x, y, p) => pd([G(x, y), G(x + p, y), G(x + p, y + p), G(x, y + p)]);
const sprite = (cx, cy, rows, p) => { let d = ''; const w = rows[0].length, h = rows.length;
  rows.forEach((r, i) => [...r].forEach((c, j) => { if (c === '#') d += pix(cx + (j - w/2)*p, cy + (h/2 - i - 1)*p, p); })); return d; };
const pad6 = n => String(n).padStart(6, '0');
function gameSvg(st){
  let s = '', d = '';
  for (const [x, y0, sp] of STARS) d += pix(x, ((y0 - st.gt * sp) % GH + GH) % GH, .3);
  s += fill(d, '#c9d6ff', 'opacity=".6"');
  s += txS(7, GH - 2.8, '1UP', 2.2, '#ff5a5a') + txS(7, GH - 5.4, pad6(st.score), 2.2, '#ffffff');
  s += txS(GW - 7, GH - 2.8, 'HIGH', 2.2, '#ff5a5a') + txS(GW - 7, GH - 5.4, pad6(Math.max(st.hi, st.score)), 2.2, '#ffffff');
  s += txS(GW - 7, 1.1, `CREDIT ${st.credit}`, 1.9, '#8af0ae');
  if (st.phase === 'play'){
    for (const r of st.rocks) s += fill(sprite(r.x, r.y, ROCK, r.r * .4), r.r > 1.5 ? '#ff9a3a' : '#c7a3ff');
    s += fill(st.shots.map(b => pd([G(b.x - .15, b.y - .6), G(b.x + .15, b.y - .6), G(b.x + .15, b.y + .6), G(b.x - .15, b.y + .6)])).join(''), '#fff36a');
    if (st.boom <= 0) s += fill(sprite(st.ship.x, st.ship.y, SHIP, .5), '#8af0ff');
    for (const e of st.fx){ let q = '';
      for (let i = 0; i < 8; i++){ const a = i * Math.PI / 4, rr = (e.big ? 1.3 : .7) * (.6 + e.t * 7); q += pix(e.x + Math.cos(a) * rr - .25, e.y + Math.sin(a) * rr - .25, .5); }
      s += fill(q, e.t < .25 ? '#fff36a' : '#ff5a3c', `opacity="${f(Math.max(0, 1 - e.t * 1.4))}"`); }
    let l = ''; for (let i = 0; i < st.lives - 1; i++) l += sprite(2.6 + i * 2.6, 1.6, SHIP, .3);
    s += fill(l, '#8af0ff');
  } else if (st.phase === 'over'){
    s += txS(GW/2, GH/2, 'GAME OVER', 4, '#ff5a5a') + txS(GW/2, GH/2 - 4.4, `SCORE ${pad6(st.score)}`, 2.2, '#ffffff');
  } else {
    s += txS(GW/2, 15.6, 'STAR', 4.6, GOLD, 900) + txS(GW/2, 10.6, 'BLASTER', 4.6, GOLD, 900);
    s += fill(sprite(9, 16, ROCK, .7) + sprite(29.5, 18, ROCK, .5), '#ff9a3a') + fill(sprite(GW/2, 3.2, SHIP, .5), '#8af0ff');
    s += txS(GW/2, 6.4, st.credit ? 'PUSH START' : 'INSERT COIN', 2.4, st.credit ? '#8af0ae' : '#ff5a5a');
  }
  return s;
}
function screen(st, m){
  const win = on(PSc(.1), rrUV(13, GV0, 51, GV0 + GH, 1.6));
  let s = `<path d="${pd(on(PSc(.05), rrUV(10.6, GV0 - 2.4, 53.4, GV0 + GH + 2.4, 2.4)))}" fill="none" stroke="${m.l}" stroke-width=".9"/>`;   // printed frame on the bezel glass
  s += shape(win, '#0d1513', 1.1) + clipTo(win, gameSvg(st));
  s += fill(pd(on(PSc(.25), [[44, GV0 + GH - 1.5], [47.5, GV0 + GH - 1.5], [36, GV0 + 2], [32.5, GV0 + 2]])), '#ffffff', 'opacity=".07"');   // glare
  s += txOn(PSc(.1)([32, GV0 + GH + 4.2]), [0,-1,0], [-VS[0], 0, -VS[2]], 'ONE PLAYER', 1.7, m.l);
  return s;
}

/* ---------- the cabinet ---------- */
function sidePanel(y, n, m){
  const pl = PY(y);
  let s = shape(on(pl, PROF), tone(n, m), 0);
  s += shape(on(pl, [[0,34],[0,58],[56,126],[57,104]]), SPACE, .8);                       // a band rising to the screen
  s += shape(on(pl, [[0,62],[0,66],[55,131],[55.6,128]]), '#e2483d', .6);
  s += shape(on(pl, ellUV(22, 146, 8, 8, 24)), '#ff9ad1', .9);                            // ringed planet
  const ring = ellUV(0, 0, 14, 3, 28).map(([u, v]) => [22 + u * .94 - v * .34, 146 + u * .34 + v * .94]);
  s += `<path d="${pd(on(pl, ring))}" fill="none" stroke="${INK}" stroke-width="1.6"/><path d="${pd(on(pl, ring))}" fill="none" stroke="${GOLD}" stroke-width=".8"/>`;
  for (const [x, z, r] of [[42, 166, 3], [8, 112, 2.4], [46, 70, 2.6], [28, 22, 3.2], [10, 168, 1.8]])
    s += shape(on(pl, [0,1,2,3,4,5,6,7].map(i => { const a = i * Math.PI / 4, k = i % 2 ? .35 : 1; return [x + Math.cos(a) * r * k, z + Math.sin(a) * r * k]; })), '#fff4d6', .6);
  return s + ink(pd(on(pl, PROF)), 2.4);                                                   // black T-molding round the edge
}
function coinStand(x, y, z, r = 1.2){
  const A = on(PY(y - .25), ellUV(x, z, r, r, 16)), B = on(PY(y + .25), ellUV(x, z, r, r, 16)), cap = vis([0,1,0]) ? B : A;
  return loft(A, B, n => toneI(n, COINM)) + fill(pd(cap), COINM.l) + ink(pd(cap), .6);
}
const lock = (x, y, z) => shape(on(PX(x), ellUV(y, z, 1.3, 1.3, 12)), METAL.l, .8) + line([[x + .05, y, z - .7], [x + .05, y, z + .7]], .6);
function coinDoor(st){
  const F = PX(FX + .15), F2 = PX(FX + .3), F3 = PX(FX + .45);
  let s = shape(on(F, rectUV(0, 0, D, 6)), BLK.m, 1);                                      // kick plate
  s += shape(on(F, rrUV(20, 40, 44, 71, 1.6)), METAL.m, 1.2) + shape(on(F, rrUV(22, 10, 42, 34, 1.2)), METAL.m, 1.1);
  for (const yc of CE){
    s += shape(on(F2, rrUV(yc - 3.4, 52, yc + 3.4, 68.5, .8)), METAL.l, .9);
    s += shape(on(F3, rectUV(yc - 2.6, 64.6, yc + 2.6, 67.6)), '#ff6a3d', .7) + tx(FX + .6, yc, 65.4, '25¢', 2.1, '#fff4d6', 800);
    s += act('coin', shape(on(F3, rrUV(yc - .9, 58.2, yc + .9, 63.8, .4)), METAL.d, .6) + shape(on(PX(FX + .55), rectUV(yc - .35, 58.8, yc + .35, 63.2)), '#1d1a16', .4));
    s += shape(on(F3, ellUV(yc, 55, 1.5, 1.5, 14)), '#c43a2a', .7);                       // reject button
  }
  s += shape(on(F2, rrUV(28.5, 42, 35.5, 47.5, 1)), '#1d1a16', .9);                       // coin return cup
  s += lock(FX + .35, 32, 50.5) + lock(FX + .35, 32, 28);
  if (st.coin != null && st.coin < .36){                                                   // the quarter going in
    const q = ease(Math.min(1, st.coin / .34)), x = FX + 14 - 15.4 * q, z = 61 + 2.5 * Math.sin(Math.PI * q);
    s += clipTo([[FX, CE[0], 40], [FX + 30, CE[0], 40], [FX + 30, CE[0], 90], [FX, CE[0], 90]], coinStand(x, CE[0], z));
  }
  return s;
}
function cpArt(m){
  let s = shape(on(PCP, rrUV(64.8, 3, 79.2, D - 3, 1.5)), SPACE, 1);
  s += txCP(76.5, FIREB[1], 'FIRE', 1.5, '#fff4d6') + txCP(68.9, STARTB[1], 'START', 1.2, '#fff4d6');
  for (const [x, y] of [[66, 56], [77, 12], [75, 52], [67, 8]]) s += fill(pd(on(PCP, ellUV(x, y, .5, .5, 8))), '#fff4d6');
  return s;
}
function cpProps(st){
  const parts = [], [jx, jy] = JOY, b = [jx, jy, zcp(jx)], [wx, wy] = st.tilt;
  let j = shape(on(PCP, ellUV(jx, jy, 3.6, 3.6, 22)), DARK.d, .9);                         // dust washer
  const top = [b[0] + NCP[0] * 10.5 + wx * 4, b[1] + wy * 4, b[2] + NCP[2] * 10.5];
  j += rod(b, top, .7, METAL, toneI, .9);
  const [X, Y] = P(...top), r = 2.6 * 1.2247, BALL = matOf('#e2483d');
  j += circ(X, Y, r, BALL.m) + circ(X + r * .14, Y - r * .16, r * .78, BALL.l)
    + `<ellipse cx="${f(X + r * .36)}" cy="${f(Y - r * .42)}" rx="${f(r * .22)}" ry="${f(r * .14)}" fill="#ffffff" opacity=".55"/>` + `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(r)}" fill="none" stroke="${INK}" stroke-width="1.1"/>`;
  // invisible push zones round the stick: toward the screen is up, toward +y is left
  j += [[-1,0],[1,0],[0,1],[0,-1]].map(([dx, dy]) => { const a0 = Math.atan2(dy, dx) - Math.PI / 4, pts = [[jx, jy, b[2] + 6]];
    for (let i = 0; i <= 6; i++){ const a = a0 + i / 6 * Math.PI / 2; pts.push([jx + 10 * Math.cos(a), jy + 10 * Math.sin(a), zcp(jx + 10 * Math.cos(a)) + 6]); }
    return `<path d="${pd(pts)}" fill="transparent" data-act="stick" data-gx="${-dy}" data-gy="${-dx}"/>`; }).join('');
  parts.push({ box:[[jx - 4, jy - 4, b[2]], [jx + 4, jy + 4, b[2] + 14]], svg: j });
  const btn = (c, rr, mm, down, name) => { const b0 = [c[0], c[1], zcp(c[0])], h = down ? .5 : 1.6;
    const g = shape(on(PCP, ellUV(c[0], c[1], rr + .9, rr + .9, 22)), DARK.m, .9) + rod(b0, b0.map((v, i) => v + NCP[i] * h), rr, mm, toneI, 1);
    return { box:[[c[0] - rr - 1, c[1] - rr - 1, b0[2] - .5], [c[0] + rr + 1, c[1] + rr + 1, b0[2] + 2]], svg: act(name, g) }; };
  parts.push(btn(FIREB, 2.4, matOf('#e2483d'), st.fireT > 0, 'fire'), btn(STARTB, 1.4, matOf('#f2efe7'), st.startT > 0, 'start'));
  return byDepth(parts);
}
function marquee(){
  const F = PX(64.15);
  let s = shape(on(F, rrUV(2.5, 152.5, D - 2.5, 175.5, 1.5)), SPACE, 1.2);
  for (const [y, z, r] of [[8, 171, .6], [20, 173, .4], [33, 171.5, .5], [47, 173, .6], [57, 170, .4], [6, 156, .5], [58, 156, .6]])
    s += fill(pd(on(PX(64.3), ellUV(y, z, r, r, 8))), '#fff4d6');
  s += shape(on(PX(64.3), [[44, 168], [26, 171.5], [26, 168.6]]), '#ff9ad1', .6) + shape(on(PX(64.35), ellUV(45, 168.8, 1.6, 1.6, 12)), '#ff9a3a', .7);   // a comet
  s += tx(64.35, D / 2, 158.8, 'STAR BLASTER', 6.2, GOLD, 900);
  return s;
}
function backDetails(m){
  const B = PX(-.15), bk = tone([-1,0,0], m);
  let s = shape(on(B, rrUV(10, 24, 54, 92, 1.5)), mix(bk, '#000000', .07), 1.1);            // service door
  s += shape(on(PX(-.3), ellUV(48, 58, 1.3, 1.3, 12)), METAL.l, .8);
  for (let i = 0; i < 5; i++) s += shape(on(B, rrUV(22, 121 + i * 2.6, 42, 122.4 + i * 2.6, .6)), mix(bk, '#000000', .5), .5);   // vents over the fan
  s += shape(on(B, rectUV(16, 100, 48, 108)), GOLD, .8) + txB(-.3, 32, 102.7, 'HIGH VOLTAGE', 2.8, INK);
  s += shape(on(PX(-.3), rrUV(9.5, 9, 16.5, 15, .8)), DARK.m, .8);                          // AC inlet
  s += shape(on(PX(-.3), rrUV(19.6, 10.4, 22.4, 13.4, .6)), METAL.d, .6);                    // fuse cap
  s += shape(on(PX(-.3), rectUV(24.5, 10.5, 27.5, 13.5)), '#e2483d', .7);                    // power switch
  return s;
}
const CORD = [[-.3, 13, 12], [-3, 13, 12], [-4.5, 13, 9], [-4.5, 13.5, .6], [-14, 18, .6]];
const cord = () => `<path d="${pd(CORD, false)}" fill="none" stroke="${INK}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="${pd(CORD, false)}" fill="none" stroke="#3a3632" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>`
  + box(-17.5, 16.4, 0, -14, 19.6, 2.4, DARK, toneI, .8);
function scene(st, m){
  const pan = (i, mm = m) => { const e = edgeQ(i); return vis(e.n) ? shape(e.q, tone(e.n, mm), 1.1) : ''; };
  const backV = vis([-1,0,0]);
  let s = castShadow([...on(PY(0), PROF), ...on(PY(D), PROF)]);
  if (!backV) s += cord();
  // front to top, in the order the parts can cover each other from above: the control panel overhangs the coin door,
  // the joystick stands in front of the screen, the marquee overhangs the screen; then top and back
  s += pan(1) + (vis([1,0,0]) ? coinDoor(st) : '');
  s += pan(2, BLK) + pan(3, BLK) + pan(4) + (vis(NCP) ? cpArt(m) : '');
  s += pan(5, BLK) + (vis(NS) ? screen(st, m) : '');
  if (vis(NCP) || vis([1,0,0])) s += cpProps(st);
  s += pan(6, BLK) + pan(7) + (vis([1,0,0]) ? marquee() : '');
  s += pan(8) + pan(9) + (backV ? backDetails(m) + cord() : '');
  // a side panel hides everything between the two panels behind it, so it goes last
  if (vis([0,-1,0])) s += sidePanel(0, [0,-1,0], m);
  if (vis([0,1,0])) s += sidePanel(D, [0,1,0], m);
  return s;
}

/* ---------- behaviour ---------- */
let ui, looping = false;
function kick(){
  if (looping) return; looping = true;
  ui.animate(dt => { update(dt); const more = active(); if (!more) looping = false; return more; });
}
const anyKey = () => keys.ArrowUp || keys.ArrowDown || keys.ArrowLeft || keys.ArrowRight;
const active = () => st.phase !== 'idle' || st.coin != null || st.meterT > 0 || st.fireT > 0 || st.startT > 0 || st.snd > 0
  || st.tiltHold > 0 || anyKey() || Math.abs(st.tilt[0]) + Math.abs(st.tilt[1]) > .01 || st.step;
const SPD = 16;
function beginGame(){
  st.credit--; Object.assign(st, { phase:'play', score:0, lives:3, gt:0, spawn:1.2, boom:0, ship:{ x:GW/2, y:3.5 }, shots:[], rocks:[], fx:[] });
}
function update(dt){
  st.t += dt;
  for (const k of ['meterT', 'fireT', 'startT', 'snd', 'tiltHold']) if (st[k] > 0) st[k] = Math.max(0, st[k] - dt);
  // the quarter: in through the slot, down the mech, past the coin switch (credit), into the cash box
  if (st.coin != null){ const was = st.coin; st.coin += dt / 1.6;
    if (was < .55 && st.coin >= .55){ st.credit = Math.min(9, st.credit + 1); st.coins++; st.meterT = .3; st.snd = .2; }
    if (st.coin >= 1) st.coin = null; }
  // joystick: held arrows, a click on the stick, or a tap that only tips it
  const gx = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0), gy = (keys.ArrowUp ? 1 : 0) - (keys.ArrowDown ? 1 : 0);
  const dir = st.step ? st.step.dir : (gx || gy) ? [gx, gy] : st.tiltHold > 0 ? st.tiltDir : [0, 0];
  const lk = Math.min(1, dt * 16), want = [-dir[1], -dir[0]];                                // up = toward the screen (-x), left = +y
  st.tilt = st.tilt.map((v, i) => v + (want[i] - v) * lk);
  if (!(dir[0] || dir[1]) && Math.abs(st.tilt[0]) + Math.abs(st.tilt[1]) < .01) st.tilt = [0, 0];

  parts.push(...wireParts([[17, 26, 98.6], [12, 28, 103], [11.7, 28.5, 107.5]], '#6f7f99', .45));
  parts.push(...wireParts([[44.7, 47, FL + 3], [43, 44, FL + .8], [43, 4.5, FL + .8], [43, 4.5, 48], [49, 4.5, 53]], RED, .7));
  parts.push(...wireParts([[5, 13, 12], [6, 40, FL + 1], [10, 45, FL + 5], [12, 45.8, FL + 7]], MAINS, .6));
  parts.push(...wireParts([[5, 15, 10], [20, 30, FL + .8], [24, 50, FL + 3]], MAINS, .6));
  parts.push(...wireParts([[4, 16, 14.5], [3.5, 31, 59], [3.5, 31.5, 60]], MAINS, .55));
  parts.push(...wireParts([[3.5, 32, 64], [3.5, 32, 119]], MAINS, .55, false));
  parts.push(...wireParts([[3.5, 35, 133], [3.5, 26, 174], [36, 26, 174]], MAINS, .55));
  parts.push(...wireParts([[50, 26, 174], [57, 10, 173], [58, 4, 167]], MAINS, .5));
  parts.push(...wireParts([[12, 58.2, FL + 7], [4, 60, 20], [4, 60, 94], [4, 60, 98.5], [14, 26, 98.8]], MAINS, .6));
  parts.push(...wireParts([FLYB, [33, 13, 114], [38, 30, 126], CAPB.map((v, i) => v + VS[i] * 1.4)], RED, .75));
  return byDepth(parts) + (st.snd > 0 ? [1, 2, 3].map(i => `<path d="${pd(on(PZ(150 - i * 1.6), arcUV(58, 32, 2 + i * 2, 0, 360, 24)), false)}" fill="none" stroke="${INK}" stroke-width=".7" opacity="${f(.9 - i * .2)}"/>`).join('') : '');
}
const XR_OPTS = { getSt: () => { try { return ui.st; } catch (e) { return st; } }, B: [0, XM, 0, D, 0, H], under: true,
  mech: s => arcMech(s),
  inside: st => { const play = st.phase === 'play', [wx, wy] = st.tilt, coin = st.coin != null;
    return [
      { at: tubeP(8, [21, 0]), text:'CRT TUBE', on: play },
      { at: at(24, 0, 6.2), text:'DEFLECTION YOKE', on: play },
      { at: at(36, 0, 1.5), text:'ELECTRON GUN', on: false },
      { at: [12.2, 37, 114], text:'NECK BOARD', on: false },
      { at: CAPB, text:'ANODE CAP', on: false },
      { at: FLYB, text:'FLYBACK', on: false },
      { at: [40, 26, 98.6], text:'MONITOR CHASSIS', on: play },
      { at: at(3, 23, 8), text:'DEGAUSS COIL', on: false },
      { at: at(1, -22.5, 14), text:'MONITOR FRAME', on: false },
      { at: [56, 6, 97], text:'MONITOR SHELF', on: false },
      { at: [17, 4, 76], text:'GAME PCB', on: play },
      { at: [50.5, 5, 74], text:'JAMMA CONNECTOR', on: play },
      { at: [34, 51, FL + 7], text:'SWITCHING PSU', on: false },
      { at: [12, 52, FL + 13], text:'ISOLATION TRANSFORMER', on: false },
      { at: [5, 13, 15], text:'AC INLET + FUSE', on: false },
      { at: [4.2, 26, 14], text:'POWER SWITCH', on: false },
      { at: [4.4, 32, 64], text:'INTERLOCK SWITCH', on: false },
      { at: [4.6, 36, 133], text:'COOLING FAN', on: play },
      { at: [58, 34, 155.8], text:'SPEAKER', on: st.snd > 0 },
      { at: [58, 44, 166.3], text:'FLUORESCENT TUBE', on: false },
      { at: [43, 26, H - WL], text:'BALLAST', on: false },
      { at: [57, CE[0], 67], text:'COIN MECH', on: coin },
      { at: [57, CE[0] + 3.4, 55], text:'COIN SWITCH', on: coin && st.coin > .45 && st.coin < .65 },
      { at: [59, 22.5, 48], text:'COIN METER', on: st.meterT > 0 },
      { at: [59.3, CE[1], 68.8], text:'COIN LAMP', on: false },
      { at: [52, 32, 32], text:'CASH BOX', on: false },
      { at: [JOY[0] + 3.2, JOY[1] + 1.2, zcp(JOY[0]) - 3.6], text:'JOYSTICK SWITCHES', on: !!(wx || wy) },
      { at: [JOY[0], JOY[1] - 1.1, zcp(JOY[0]) - 6], text:'ACTUATOR', on: !!(wx || wy) },
      { at: [FIREB[0], FIREB[1] + 1.6, zcp(FIREB[0]) - 10.6], text:'FIRE SWITCH', on: st.fireT > 0 },
      { at: [STARTB[0], STARTB[1] + 1.6, zcp(STARTB[0]) - 10.6], text:'START SWITCH', on: st.startT > 0 },
      { at: [43, 4.5, 30], text:'WIRING HARNESS', on: false } ]; },
  surface: st => facing([1,0,0]) ? [
      { at:[64, 50, 170], text:'MARQUEE', on: false }, { at: G(4, 20, .2), text:'SCREEN', on: false },
      { at:[JOY[0] + 4, JOY[1], zcp(JOY[0]) + 10], text:'JOYSTICK', on: false }, { at:[FIREB[0], FIREB[1] - 2.4, zcp(FIREB[0]) + 1.5], text:'FIRE BUTTON', on: false },
      { at:[STARTB[0], STARTB[1], zcp(STARTB[0]) + 1.5], text:'START BUTTON', on: false }, { at:[FX, CE[0], 61], text:'COIN SLOT', on: false },
      { at:[FX, 32, 44], text:'COIN RETURN', on: false }, { at:[FX, 24, 20], text:'CASH DOOR', on: false } ]
    : facing([-1,0,0]) ? [ { at:[0, 20, 80], text:'SERVICE DOOR', on: false }, { at:[0, 40, 126], text:'VENTS', on: false },
      { at:[0, 13, 12], text:'AC INLET', on: false }, { at:[-10, 16, .6], text:'POWER CORD', on: false } ] : [] };
const XR_CAPTION = st => {
  if (st.coin != null) return 'The quarter rolls down the coin mech, which checks its size and metal, then drops past the coin switch: its wire arm clicks once, the game board adds a credit and pulses the coin meter, and the coin falls into the cash box.';
  if (st.phase === 'play') return 'The joystick’s actuator presses one of four microswitches; the fire button has its own. Each grounds a pin on the JAMMA connector. The CPU moves the ship and sends red, green, blue and sync to the monitor chassis, whose yoke sweeps the CRT’s three electron beams across the screen.';
  if (st.phase === 'over') return 'Game over: the board keeps the high score and goes back to its attract screen. Every credit it used is now a quarter in the cash box.';
  return 'Inside: an isolation transformer feeds the CRT monitor, a switching power supply gives the game board 5 V and 12 V, and the wiring harness joins the board’s JAMMA connector to the controls, the coin door, the speaker and the monitor.';
};

scene = xrWrap(scene, XR_OPTS);
ui = mountFigure({
  fig:'19', turn:'full', title:'Arcade cabinet', hint:'insert a coin, press Start, steer with the arrow keys, fire with space',
  idea:'The game never sees the coin, only a switch: one click of the coin switch’s wire arm is one credit.',
  size:[XM, D, H], palette:'mustard', state:st,
  scene,
  readout: st => st.phase === 'play' ? `playing — ${st.lives} ${st.lives === 1 ? 'ship' : 'ships'} left` : st.phase === 'over' ? 'game over' : st.credit ? `credit ${st.credit} — press Start` : 'attract mode — insert a coin',
  stats: st => [ { label:'Credit', value: String(st.credit) }, { label:'Score', value: String(st.score) },
    { label:'Ships', value: String(st.phase === 'play' ? st.lives : 0) }, { label:'Cash box', value: `${st.coins}×25¢`, small: true } ],
  buttonsLabel:'Play',
  buttons:[
    { label:'Insert coin', onClick: insertCoin },
    { label:'Press Start', onClick: pressStart },
    { label:'Start over', onClick: startOver },
  ],
  acts:{
    coin: () => insertCoin(),
    start: () => pressStart(),
    fire: () => fire(),
    stick: (st, el) => move(+el.dataset.gx, +el.dataset.gy),
  },
  params:(st, q) => {
    if (q.has('credit')) st.credit = +q.get('credit');
    if (q.has('coin')) st.coin = +q.get('coin');
    if (q.get('play') === '1'){ st.credit = Math.max(1, st.credit); beginGame(); }
    if (q.has('sim')) for (let i = 0, n = +q.get('sim') * 30; i < n; i++){ if (i % 9 === 0 && st.phase === 'play' && st.shots.length < 3) st.shots.push({ x: st.ship.x, y: st.ship.y + 1.8 }); update(1/30); }
    if (q.has('tilt')){ const [a, b] = q.get('tilt').split(',').map(Number); st.tilt = [-b, -a]; }
    if (q.get('over') === '1'){ st.phase = 'over'; st.overT = 4; st.score = 2350; st.coins = Math.max(1, st.coins); }
  },
});
if (active()) kick();

mountKeypad({ rows: 3, hub: [1, 1], action: 'FIRE', keys: [
  { key:'ArrowUp', glyph:'▲', name:'Up', at:[1, 0] }, { key:'ArrowLeft', glyph:'◀', name:'Left', at:[0, 1] },
  { key:'ArrowRight', glyph:'▶', name:'Right', at:[2, 1] }, { key:'ArrowDown', glyph:'▼', name:'Down', at:[1, 2] } ] });
xrMount(() => ui, XR_CAPTION);
</script>
