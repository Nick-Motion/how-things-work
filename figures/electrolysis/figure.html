<title>Electrolysis of water</title>
<style>#stats{display:grid;grid-template-columns:auto auto;gap:8px 18px}#stats .stat.small{grid-column:1/-1}#stats .stat.small .v{font-size:16px}</style></head><body>

<script>
/* Truth first.
   A Hofmann voltameter contains acidified water, not conducting pure water.
   A battery drives electrons through the external leads. Ions carry charge through
   the liquid. At the negative platinum cathode, 4 H3O+ + 4 e- -> 2 H2 + 4 H2O.
   At the positive platinum anode, 6 H2O -> O2 + 4 H3O+ + 4 e-.
   Net: 2 H2O -> 2 H2 + O2. Gas is colourless; equal-area graduated arms show
   the ideal 2:1 gas volume ratio. Gas displaces liquid into the open central bulb.
   The blue tint marks liquid only. Molecular icons are enlarged teaching overlays.
   The clock is accelerated. Volumes are idealised, without dissolution or pressure
   corrections. The circuit stops before either meniscus reaches an electrode.
   Testing opens the matching tap, captures a small sample in a separate inverted
   test tube, closes the tap, and carries the sample away before a splint is applied.
   The lit splint gives a hydrogen pop. Oxygen rekindles a glowing splint.
   Vent both tubes is a teaching manipulation of the two real taps. Liquid returns
   from the central bulb. Reversal requires power off and empty gas spaces so gases
   cannot mix. Swapping connections exchanges which platinum plate makes each gas.
   Sources checked 2026-10-24.
   https://spark.iop.org/electrolysis-water-and-concept-charge
   https://demolab.chem.wisc.edu/analytical-chemistry-demonstrations/electrochemistry-and-redox-reactions-electrolysis-of-water-2/

   Parts and attachments.
   STRUCTURE: bench board; stand foot bolted to it; steel upright on foot;
   two crossbar halves on upright; two padded clamps on crossbar around the glass.
   GLASS: two equal-bore graduated collection arms fused to the lower U-tube;
   central fill stem fused to the U-tube, expanding into an open reservoir bulb;
   open fill rim; two upper stopcock barrels, their turning plugs and handles;
   two outlet nozzles; acidified water, menisci and collected gas spaces.
   ELECTRODES: two bottom stoppers, platinum feedthrough wires sealed in them,
   platinum plates welded to the wires, external screw terminals on the wires.
   POWER: battery case resting on board; positive and negative posts on its lid;
   knife-switch base on board, pivot, blade and fixed contact; insulated leads
   from positive post through switch to anode and negative post to cathode.
   TESTS: two inverted sample tubes held in the bench rack; wooden lit and glowing
   splints lying in a ceramic rest. A sample tube moves by the visitor's action.
   Molecular water, hydronium and bisulfate icons are overlays, not machine parts.
*/
const eSideY = [27, 77], eX = 30, eTop = 85, eFloor = 24;
const eGlass = matOf('#cfe9f0'), eWater = matOf('#a9dce3');
const eRubber = matOf('#4e535a'), eBrass = matOf('#d6a44e');
const eState = { on:false, reversed:false, gas:[0,0], clock:0, sample:null, vent:0, result:'' };
const eCathode = st => st.reversed ? 0 : 1;
const eGas = (st, i) => i === eCathode(st) ? 'H2' : 'O2';
const eLevel = (st, i) => eTop - 1.1*st.gas[i];
const eReservoirLevel = st => 80 + 1.1*3.7**2/10**2*(st.gas[0]+st.gas[1]);
const eBounds = (pts, r=0) => [0,1].map(hi => [0,1,2].map(j => (hi ? Math.max : Math.min)(...pts.map(p => p[j])) + (hi ? r : -r)));
const eRing = (x,y,z,r) => on(PZ(z), ellUV(x,y,r,r,24));
const eStroke = (pts,col,w=.65) => `<path d="${pd(pts,false)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
function eTube(x,y,z0,z1,r,inside,k=0,closed=false){
  const a=eRing(x,y,z0,r), b=eRing(x,y,z1,r);
  const glass = nr => mix(toneI(nr,eGlass),'#f2efe7',.35);
  const rim = ink(pd(a),.85)+ink(pd(b),.85);
  return `<g opacity="${1-.68*k}">`+loft(a,b,glass,true).replaceAll('<path ','<path fill-opacity=".12" ')+`</g>`
    +inside+`<g opacity="${1-.68*k}">`+loft(a,b,glass).replaceAll('<path ','<path fill-opacity=".14" ')
    +rim+(closed ? fill(pd(b),'#cfe9f0','fill-opacity=".2"') : ink(pd(eRing(x,y,z1,r-.6)),.5))
    +eStroke([[x+r*.5,y-r*.65,z0+3],[x+r*.5,y-r*.65,z1-3]],'#ffffff',.9)+`</g>`;
}
function eBead(p,r,col){
  const [x,y]=P(...p);
  return `<circle cx="${f(x)}" cy="${f(y)}" r="${f(r*1.2247)}" fill="${col}" stroke="${INK}" stroke-width=".55"/>`;
}
function eMolecule(p,kind,scale=1){
  const [x,y,z]=p, oxygen='#df785d', hydrogen='#fff7e5';
  const atom=(dx,dz,r,col)=>eBead([x+dx*scale,y,z+dz*scale],r*scale,col);
  if(kind==='H2') return atom(-.8,0,.75,hydrogen)+atom(.8,0,.75,hydrogen);
  if(kind==='O2') return atom(-.8,0,1,oxygen)+atom(.8,0,1,oxygen);
  return atom(0,0,1.2,oxygen)+atom(-1.3,-.7,.7,hydrogen)+atom(1.3,-.7,.7,hydrogen)
    +(kind==='H3O' ? atom(0,1.4,.7,hydrogen) : '');
}
function eCallouts(items){

  const ordered=items.map(it=>({...it,p:P(...it.at)})).sort((a,b)=>a.p[0]-b.p[0]);
  const cols=[ordered.slice(0,Math.ceil(ordered.length/2)),ordered.slice(Math.ceil(ordered.length/2))];
  return cols.map((col,side)=>{
    col.sort((a,b)=>a.p[1]-b.p[1]);
    const blocker=document.getElementById(side?'stats':'btns').getBoundingClientRect();
    const top=mobile?12*INK_K:new DOMPoint(0,blocker.bottom+16).matrixTransform(svg.getScreenCTM().inverse()).y;
    const bottom=vb.height-42*INK_K;
    // Fit the real component labels between the controls and the zoom bar.
    const fs=Math.min(8.6*INK_K,(bottom-top)/Math.max(1,col.length-1)/2.15), h=fs*1.8;
    return col.map((it,i)=>{
      const x=side?vb.width-88*INK_K:88*INK_K;
      const y=top+(bottom-top)*i/Math.max(1,col.length-1);
      if(mobile) return tag(it.at,(x-it.p[0])/INK_K,(y-it.p[1])/INK_K,it.text,it.on);
      const n=((window.__ln||(window.__ln={}))[it.text]||(__ln[it.text]=Object.keys(__ln).length+1));
      const w=it.text.length*fs*.62+fs*1.5;
      return `<g class="tag${it.on?' on':''}" data-n="${n}" data-t="${it.text}">`
        +`<path d="M${f(it.p[0])} ${f(it.p[1])}L${f(x)} ${f(y)}" fill="none" stroke="${INK}" stroke-width="1"/>`
        +`<circle cx="${f(it.p[0])}" cy="${f(it.p[1])}" r="${f(1.3*INK_K)}" fill="${INK}"/>`
        +`<rect x="${f(x-w/2)}" y="${f(y-h/2)}" width="${f(w)}" height="${f(h)}" rx="${f(h/2)}" fill="${it.on?'var(--accent,#f4b829)':'#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
        +`<text x="${f(x)}" y="${f(y+fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${it.text}</text></g>`;
    }).join('');
  }).join('');
}
function eFlame(p,big){

    +`<path d="M${f(x-r*.5)} ${f(y)}Q${f(x-r*.8)} ${f(y-r)} ${f(x)} ${f(y-r*1.8)}Q${f(x+r*.7)} ${f(y-r*.5)} ${f(x+r*.5)} ${f(y)}Z" fill="#ffe6a1"/>`;
}

  const rd=(a,b,r,mat,text) => { put([a,b],r,rod(a,b,r,mat,toneI,.8)); if(text) label(avg([a,b]),text); };
  let s=board(0,0,100,106,3,5,WOOD);
  s+=castShadow([[15,20,3],[34,23,96],[30,77,96],[30,52,107],[18,82,3]],3,boardTop(0,0,100,106,3,5));
  bx([9,19,3],[21,85,6],m,'STAND FOOT');
  for(const y of [23,81]) put([[15,y,6],[15,y,6.8]],1,cyl(15,y,6,6.8,1,METAL,toneI,.6,6));
  for(const [z0,z1] of [[6,48],[48,60],[60,82]]) rd([15,52,z0],[15,52,z1],1.35,METAL);
  label([15,52,40],'SUPPORT UPRIGHT');
  for(const y of eSideY){
    const i=eSideY.indexOf(y), lv=eLevel(st,i), gas=eGas(st,i), active=st.sample&&st.sample.side===i;
    rd([15,52,60],[15,y,60],.95,METAL);

    put([[30,y,58.6],[30,y,61.4]],5.1,eTube(30,y,58.6,61.4,5.1,'',k));

    if(st.gas[i]>.01){

      chemistry.push({box:[[26,y-4,24],[34,y+4,Math.min(lv,48)]],svg:`<g data-chemistry="${reacting?'products':'reactants'}" opacity="${k}">${overlays}</g>`});
      chemistry.push({box:[[29.7,y-2,24],[30.3,y+2,29]],svg:`<g opacity="${k}">${box(29.7,y-2,24,30.3,y+2,29,METAL,toneI,.8)}</g>`});
    }

    bx([29.7,y-2,24],[30.3,y+2,29],METAL,gas==='H2'?'PLATINUM CATHODE':'PLATINUM ANODE');
    put([[30,y,12],[30,y,14]],1.4,cyl(30,y,12,14,1.4,eBrass,toneI,.7,6));
    if(i) label([30,y,13],'ELECTRODE TERMINAL',st.on);
    rd([30,y,85],[30,y,89],2,eGlass);

    label([30,y,97],i?'LEFT GAS OUTLET':'RIGHT GAS OUTLET');

    if(k>.6){
      label([30,y,35],i?'OVERLAY WATER':'OVERLAY H3O IONS',st.on);
      if(i===0) label([30,y,39],'OVERLAY BISULFATE',st.on);

  }
  const uRoute=[[30,27,24],[30,27,16],[30,36,14],[30,52,14],[30,68,14],[30,77,16],[30,77,24]];
  for(let j=0;j<uRoute.length-1;j++){

  }

  put([[30,52,14],[30,52,70]],3.2,eTube(30,52,14,70,3.2,`<g opacity=".35">${cyl(30,52,14,70,2.6,eWater,toneI,.3)}</g>`,k));
  label([30,52,47],'RESERVOIR STEM');
  const r0=eRing(30,52,70,3.2),r1=eRing(30,52,80,10),r2=eRing(30,52,104,10), r3=eRing(30,52,106,11);

  put([[30,52,70],[30,52,80]],10,`<g opacity=".4">${loft(eRing(30,52,70,2.6),eRing(30,52,80,9.4),n=>toneI(n,eWater))}</g><g opacity="${.6-.35*k}">${lower}${hullInk([...r0,...r1],.8)}</g>`);

  label([30,52,101],'OPEN FILL RIM'); label([30,52,90],'RESERVOIR BULB');

  ];

  for(const y of [24,38]){

let eUI,eLoop=false;
function eUpdate(st,dt){
  st.clock+=dt;

    if(st.gas[c]>=50-1e-8||st.gas[a]>=50-1e-8){st.on=false;st.result='Tubes full';}
  }
  if(st.vent>0){
    st.vent=Math.max(0,st.vent-dt);
    st.gas=st.gas.map(v=>Math.max(0,v-30*dt));
    if(st.vent===0) st.gas=[0,0];
  }
  if(st.sample){
    const sample=st.sample;
    sample.t+=dt;
    if(sample.t>.5&&sample.t<1.3){ const take=Math.min(st.gas[sample.side],dt*3); st.gas[sample.side]-=take; sample.volume+=take; }
    if(sample.t>=2.65) st.result=sample.kind==='H2'?'Hydrogen pop':'Oxygen relights';
    if(sample.t>=4.3) st.sample=null;
  }
}
function eKick(){
  if(eLoop)return; eLoop=true;
  eUI.animate(dt=>{eUpdate(eUI.st,dt);const busy=eUI.st.on||eUI.st.sample||eUI.st.vent>0;if(!busy)eLoop=false;return !!busy;});
}
function eToggle(st,ui){
  if(st.sample||st.vent>0)return ui.flash('Finish the gas test or venting first.');
  if(!st.on&&Math.max(...st.gas)>=49.99)return ui.flash('Vent both tubes before collecting more.');
  st.on=!st.on; st.result=st.on?'Collecting gases':'Circuit open'; eKick();
}
function eTest(st,ui,kind){
  if(st.sample||st.vent>0)return ui.flash('One gas sample at a time.');
  if(st.on)return ui.flash('Switch off before opening a gas tap.');
  const side=kind==='H2'?eCathode(st):1-eCathode(st);
  if(st.gas[side]<3)return ui.flash('Collect at least 3 mL of '+(kind==='H2'?'hydrogen':'oxygen')+' first.');
  st.sample={kind,side,t:0,volume:0};st.result='Taking '+kind+' sample';eKick();
}
function eSwap(st,ui){
  if(st.on)return ui.flash('Switch off before swapping the battery connections.');
  if(st.sample||st.vent>0)return ui.flash('Finish the gas test or venting first.');
  if(st.gas.some(v=>v>.001))return ui.flash('Vent both tubes before reversal to keep gases separate.');
  st.reversed=!st.reversed;st.result='Connections swapped';
}
function eVent(st,ui){
  if(st.on)return ui.flash('Switch off before opening both taps.');
  if(st.sample||st.vent>0)return ui.flash('Finish the current action first.');
  if(st.gas.every(v=>v===0))return ui.flash('Both collecting tubes are already full of liquid.');
  st.vent=2;st.result='Venting gas';eKick();
}
eUI=mountFigure({
  fig:'E',turn:'full',title:'Electrolysis of water',size:[100,106,114],palette:'cobalt',state:eState,
  scene:eScene,
  stats:st=>[
    {label:'Hydrogen',value:st.gas[eCathode(st)].toFixed(1)+' mL'},
    {label:'Oxygen',value:st.gas[1-eCathode(st)].toFixed(1)+' mL'},
    {label:st.on?'Circuit':'Gas test / action',value:st.on?'ON':st.result||'OFF',small:true}
  ],
  buttons:[
    {label:'Switch on / off',onClick:eToggle},
    {label:'Test hydrogen',onClick:(st,ui)=>eTest(st,ui,'H2')},
    {label:'Test oxygen',onClick:(st,ui)=>eTest(st,ui,'O2')},
    {label:'Swap polarity',onClick:eSwap},
    {label:'Vent both tubes',onClick:eVent}
  ],
  params:(st,q)=>{
    if(q.get('reversed')==='1')st.reversed=true;
    for(const [key,side] of [['h2',eCathode(st)],['o2',1-eCathode(st)]]){
      const v=Number(q.get(key));if(q.has(key)&&Number.isFinite(v))st.gas[side]=Math.max(0,Math.min(50,v));
    }
    if(q.get('on')==='1')st.on=true;
  }
});
xrMount(()=>eUI,()=> '');
addEventListener('resize',()=>eUI.render());
if(eState.on)eKick();
addEventListener('unhandledrejection',e=>{document.documentElement.dataset.errors+=' '+String(e.reason)+';';});
</script></body></html>
