<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acid-base titration</title></head><body>
<script src="core.js"></script>
<script>
/* ---------- Truth first: a school acid-base titration with a pH meter ----------
   1. Set up: 25.0 mL of 0.100 M hydrochloric acid is pipetted into a 250 mL conical flask, 100 mL of deionised water
      is added from the wash bottle so the pH electrode's bulb and junction are covered, then three drops of
      phenolphthalein. A PTFE stir bar lies on the flask's floor; the flask stands on the magnetic stirrer's top plate.
      The 50 mL burette, clamped to the retort stand, is filled from the 0.100 M sodium hydroxide bottle to 0.00 mL;
      its jet tip sits inside the flask's neck. The pH electrode hangs from its holder arm through the neck beside it,
      its cable running down the holder post to the meter's BNC socket.
   2. Stirrer on: the motor spins the drive magnet under the top plate; the stir bar's magnet follows it, swirling the
      flask. Starting pH: [H+] = 2.5 mmol / 125 mL = 0.020 M, pH 1.70.
   3. Open the tap: turning the PTFE key lines its bore up with the burette, NaOH runs down the jet into the flask.
      Each OH- meets an H+ and they join into water (H+ + OH- -> H2O); Na+ and Cl- stay as spectators. Where the
      stream lands the liquid is briefly basic, so a pink plume flashes and is swirled away while acid is in excess.
   4. pH creeps: 24.00 mL -> pH 3.17, 24.95 mL -> 4.48. Close to the end the pink flashes linger; finish drop by drop
      (one drop = 0.05 mL). The drop that passes 25.00 mL takes the pH from about 4.5 to 9.5: the indicator
      (colourless below pH 8.2) turns pale pink and stays pink: the endpoint. Titre = 25.05 mL.
   5. Overshoot: excess OH- builds up: 26 mL -> pH 10.8 deep pink, 30 mL -> 11.5 magenta-purple.
   6. Reset: the flask is emptied and refilled with fresh acid, the burette refilled from the bottle to 0.00 mL.
   pH: d = (nHCl - nNaOH) / Vtotal; [H+] = (d + sqrt(d^2 + 4 Kw)) / 2.
   Parts (each is held by another):
   STAND    retort base on the bench . threaded foot . stand rod screwed into it . boss head clamped on the rod with
            two thumbscrews . burette clamp arm held in the boss . clamp body . two spring jaws . cork pads on the burette
   BURETTE  50 mL glass tube, 0-50 mL graduations, NaOH column with its meniscus, stopcock barrel, PTFE key and its
            handle, retaining nut, jet tip inside the flask's neck, drops / stream
   FLASK    250 mL conical flask on the top plate . acid + indicator solution . PTFE stir bar on the floor
   STIRRER  case on the retort base . ceramic top plate . motor on a mounting plate . drive magnet on its shaft .
            control board . speed potentiometer behind the knob . speed knob . rocker switch . power LED .
            mains inlet on the back with its cord
   PH       glass electrode in its holder ring . holder arm . sleeve and thumbscrew . holder post on a heavy foot .
            glass bulb . inner Ag/AgCl wire in its inner tube . KCl reference fill . ceramic junction . cap .
            coax cable down the post to the BNC socket on the meter's back
   METER    sloped case on the bench . LCD . CAL / MEAS keys . board on standoffs . high-impedance amplifier . MCU .
            9 V battery . BNC socket
   BENCH    bench board . NaOH bottle (polyethylene: NaOH etches glass) . wash bottle of deionised water
   SEE-THROUGH overlays: a magnifier into the liquid with H+, OH-, H2O, Na+, Cl-; the live pH-against-volume curve */

/* ---------- geometry (x = depth, y = width, z = up; 1 unit = 1 cm) ---------- */
const BW = 42, BD = 67, BH = 2;
const RX = 6, RY = 31.2, ROD_T = 90;                          // stand rod
const SB = [2, 22, BH, 30, 42, BH + 1.4];                     // retort base
const SZ0 = SB[5], SZ1 = SZ0 + 7;                             // stirrer case bottom / top
const STB = [10.8, 24.6, 28.8, 42.6];                         // stirrer footprint x0, y0, x1, y1
const FX = 19.8, FY = 33.6, FZ = SZ1 + .05;                   // flask centre and floor
const FZ_IN = FZ + .25, FR_IN = 4.0, FN_IN = 2.1, FCONE = 10.25;   // inside: floor height, floor radius, neck radius, cone height
const FTOP = FZ + 14.5;
const BXc = 19.3, BYc = 33.0;                                 // burette axis
const TIP_Z = 22, SC_Z = 27.3, TUBE_Z0 = 28.6, TUBE_Z1 = 86, BR = .75, BRI = .6;
const Z0ML = 80, ZPERML = .92;                                // 0 mL mark, cm per mL
const CL_Z = 58;                                              // burette clamp height
const EX = 20.2, EY = 35.0, EBOT = 11.8, ESH = 30.5;          // electrode axis, bulb bottom, top of glass shaft
const POST = [24.5, 47.5], POST_T = 34, HOLD_Z = 29.5;
const MY0 = 51, MY1 = 65, MP = [[26, BH], [40, BH], [40, 4.5], [29, 9.5], [26, 9.5]], MSL = Math.hypot(11, 5), MSN = [5/MSL, 0, 11/MSL];
const BOT = [30, 10], WASH = [36, 20];
const NA0 = 2.5, VW = 125, CB = .1, KW = 1e-14, DROP = .05, FLOW = 1.6, VMAX = 50;
const STANDM = matOf('#5f6e76'), STEELM = { l:'#e3e6e7', m:'#b4bcbf', d:'#7d878b' }, PTFE = { l:'#fbfaf5', m:'#e6e3d8', d:'#bcb7a6' };
const PCBM = { l:'#4fa36a', m:'#2f8a4a', d:'#1d5f31' }, CORK = matOf('#c99a62'), CAPM = matOf('#2f6fb8');
const NAOHC = '#d6ecf3';

/* ---------- small helpers ---------- */
const tiLerp = (a, b, t) => a.map((v, i) => v + (b[i] - v)*t);
const tiAdd = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], tiScl = (a, s) => a.map(v => v*s);
const tiClamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const tiBoxOf = (pts, e = .05) => [[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - e), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + e)];
const tiBx = (x0, y0, z0, x1, y1, z1, M, w = .8) => box(x0, y0, z0, x1, y1, z1, M, toneI, w);
const tiStroke = (pts, col, w, close = false) => { const d = pd(pts, close);
  return `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${f(w + .9)}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${col}" stroke-width="${f(w)}" stroke-linecap="round" stroke-linejoin="round"/>`; };
const tiRingZ = (cx, cy, z, r, n = 20) => on(PZ(z), ellUV(cx, cy, r, r, n));
// a prism: a convex profile in (x, z) swept along y, every visible face inked
function tiPrismY(prof, y0, y1, M, w = .9){
  const A = on(PY(y0), prof), B = on(PY(y1), prof), cen = avg(A.concat(B)); let s = '';
  for (let i = 0; i < prof.length; i++){ const j = (i + 1) % prof.length, q = [A[i], A[j], B[j], B[i]];
    let nr = norm(cross(sub(q[1], q[0]), sub(q[3], q[0]))); if (dot(nr, sub(avg(q), cen)) < 0) nr = nr.map(v => -v);
    if (vis(nr)) s += shape(q, toneI(nr, M), w); }
  if (vis([0,1,0])) s += shape(B, toneI([0,1,0], M), w);
  if (vis([0,-1,0])) s += shape(A, toneI([0,-1,0], M), w);
  return s + hullInk([...A, ...B], 1.6); }
// a cable cut into short pieces (each with its own box) so it sorts with the solids it passes
function tiWire(pts, col, w = .5, seg = 2.5){
  const q = [pts[0]];
  for (let i = 1; i < pts.length; i++){ const a = pts[i-1], b = pts[i], n = Math.max(1, Math.ceil(Math.hypot(...sub(b, a)) / seg));
    for (let j = 1; j <= n; j++) q.push(tiLerp(a, b, j/n)); }
  const out = [];
  for (let i = 0; i < q.length - 1; i++) out.push({ box: tiBoxOf([q[i], q[i+1]]), svg: tiStroke([q[i], q[i+1]], col, w) });
  return out; }
// a ball seen as a circle
function tiBall(c, r, M, wk = 1){ const [X, Y] = P(...c), R = r*CAM_K;
  return `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(R)}" fill="${M.m}"/><circle cx="${f(X + .25*R)}" cy="${f(Y - .3*R)}" r="${f(.45*R)}" fill="${M.l}"/>`
    + `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(R)}" fill="none" stroke="${INK}" stroke-width="${f(wk)}"/>`; }
// screen offset (dx, dy) from a 3D point, as a 3D point (labels for things drawn flat on the screen)
const tiUnP = (p, dx, dy) => tiAdd(p, tiAdd(tiScl(CAM_R, dx/CAM_K), tiScl(CAM_D, dy/CAM_K)));
// the two side lines of an upright round part (its silhouette), no ink across the ends where sections join
const tiSides = (cx, cy, za, zb, r, w) => { let s = ''; for (const a of nearHalf()){ const t = a*Math.PI/180, x = cx + r*Math.cos(t), y = cy + r*Math.sin(t); s += line([[x, y, za], [x, y, zb]], w); } return s; };
// a vertical glass tube section: far wall, contents, near wall, side lines
function tiGlass(cx, cy, za, zb, r, inner = '', w = .8){
  const A = tiRingZ(cx, cy, za, r), B = tiRingZ(cx, cy, zb, r);
  const t = (YAW + 35)*Math.PI/180, sx = cx + r*.8*Math.cos(t), sy = cy + r*.8*Math.sin(t);
  return `<g opacity=".45">${loft(A, B, () => mix(CLEAR.m, '#ffffff', .2), true)}</g>` + inner
    + `<g opacity=".3">${loft(A, B, n => toneI(n, CLEAR))}</g>`
    + `<path d="${pd([[sx, sy, za + .2], [sx, sy, zb - .2]], false)}" stroke="#ffffff" stroke-width=".5" opacity=".6"/>` + tiSides(cx, cy, za, zb, r, w); }
// a liquid column inside an upright tube, with its surface when the top is inside [za, zb]
function tiLiquid(cx, cy, za, zb, r, col, op = .6, top = true){
  if (zb <= za) return '';
  const A = tiRingZ(cx, cy, za, r), B = tiRingZ(cx, cy, zb, r);
  return `<g opacity="${op}">${loft(A, B, n => mix(col, '#7fa9b5', vis(n) ? .15 : 0))}${top ? fill(pd(B), mix(col, '#ffffff', .35)) : ''}</g>`; }

// byDepth's sort compares pairs in an order of its own choosing, and the box rule is not transitive, so with many parts a
// far part can end up over a near one. Here every separated pair that overlaps on screen is an edge, then farthest-first.
function tiSort(items){
  items = items.filter(Boolean); const n = items.length, out = Array.from({length:n}, () => []), deg = new Array(n).fill(0);
  const dep = items.map(p => depthOf(p.at || boxMid(p.box))), done = new Array(n).fill(false);
  const R = items.map(p => { if (!p.box) return null; const xs = [], ys = [];
    for (const x of [0, 1]) for (const y of [0, 1]) for (const z of [0, 1]){ const q = P(p.box[x][0], p.box[y][1], p.box[z][2]); xs.push(q[0]); ys.push(q[1]); }
    return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)]; });
  const hit = (a, b) => a && b && a[0] < b[2] && b[0] < a[2] && a[1] < b[3] && b[1] < a[3];
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++){ const o = hit(R[i], R[j]) ? sepOrder(items[i], items[j]) : 0;
    if (o < 0){ out[i].push(j); deg[j]++; } else if (o > 0){ out[j].push(i); deg[i]++; } }
  let svg = '';
  for (let c = 0; c < n; c++){ let best = -1;
    for (let i = 0; i < n; i++) if (!done[i] && (best < 0 || (deg[i] === 0) > (deg[best] === 0) || ((deg[i] === 0) === (deg[best] === 0) && dep[i] < dep[best]))) best = i;
    done[best] = true; svg += items[best].svg; for (const j of out[best]) deg[j]--; }
  return svg; }

/* ---------- chemistry ---------- */
function tiPH(V){ const d = (NA0 - CB*V) / (VW + V); return -Math.log10((d + Math.sqrt(d*d + 4*KW)) / 2); }
const tiSm = (a, b, x) => { const t = tiClamp((x - a)/(b - a)); return t*t*(3 - 2*t); };
// phenolphthalein: colourless below 8.2, pale pink, pink, then a deep magenta-purple when well overshot
function tiInd(pH){
  let c = '#e4f1f4', a = .38;
  const s1 = tiSm(8.2, 9.2, pH), s2 = tiSm(9.4, 10.9, pH), s3 = tiSm(11.0, 11.8, pH);
  if (s1 > 0){ c = mix(c, '#f7bcd8', s1); a += .2*s1; }
  if (s2 > 0){ c = mix(c, '#df4f98', s2); a += .2*s2; }
  if (s3 > 0){ c = mix(c, '#8c2d9a', s3); a += .1*s3; }
  return { c, a }; }
const tiIndName = pH => pH < 8.2 ? 'colourless' : pH < 9.6 ? 'pale pink' : pH < 11.1 ? 'pink' : 'purple';
// liquid height above the flask floor for a volume in mL (the inside is a cone frustum)
const tiRin = h => FR_IN - (FR_IN - FN_IN)*h/FCONE;
function tiLevel(vol){ let lo = 0, hi = FCONE;
  for (let i = 0; i < 24; i++){ const h = (lo + hi)/2, r = tiRin(h), v = Math.PI*h*(FR_IN*FR_IN + FR_IN*r + r*r)/3; if (v < vol) lo = h; else hi = h; }
  return (lo + hi)/2; }
const tiBurZ = Vb => Z0ML - ZPERML*Vb;          // the NaOH level in the burette

/* ---------- the parts ---------- */
const ST_PROF = rrUV(STB[1], SZ0, STB[3], SZ1, 1.4);
function tiStirrer(st, m, k){
  const FRONT = facing([1,0,0]), BACK = facing([-1,0,0]);
  let s = '';
  if (BACK) s += fill(pd(on(PX(STB[0]), ST_PROF)), tone([-1,0,0], m));
  if (FRONT) s += fill(pd(on(PX(STB[2]), ST_PROF)), tone([1,0,0], m));
  s += extrude(ST_PROF, STB[0], STB[2], m);
  if (facing([0,0,1])){ const tp = on(PZ(SZ1 + .02), rrUV(STB[0] + .8, STB[1] + .8, STB[2] - .8, STB[3] - .8, 1));
    s += shape(tp, CERAMIC.l, 1) + ink(pd(on(PZ(SZ1 + .03), ellUV(FX, FY, 5.2, 5.2, 28))), .5); }
  if (FRONT){
    s += ink(pd(on(PX(STB[2]), ST_PROF)), 1.6);
    for (let i = 0; i <= 6; i++){ const a = (-135 + 45*i)*Math.PI/180; s += shape(on(PX(STB[2] + .03), ellUV(29.5 + 2*Math.sin(a), 6.9 + 2*Math.cos(a), .16, .16, 8)), INK, 0); }
    s += tx(STB[2] + .04, 29.5, 4.2, 'SPEED', .75, INK, 800) + tx(STB[2] + .04, 37.8, 4.2, 'POWER', .75, INK, 800);
    s += shape(on(PX(STB[2] + .03), ellUV(35.2, 8.4, .32, .32, 10)), st.stir ? '#43c25c' : '#2f3a33', .4);
    s += tx(STB[2] + .04, 33.4, 4.6, 'MAGSTIR', 1.1, mix(m.d, '#000000', .2), 800);
  }
  if (BACK){ s += ink(pd(on(PX(STB[0]), ST_PROF)), 1.6) + shape(on(PX(STB[0] - .05), rrUV(37.6, 5, 40.4, 7.2, .3)), '#2b2725', .6); }
  s += hullInk([...on(PX(STB[0]), ST_PROF), ...on(PX(STB[2]), ST_PROF)], 2.4);
  if (!(k > 0)) return [s, ''];
  // inside: motor on its plate, drive magnet on the shaft, board, pot, switch, LED, mains inlet
  const a = st.spin, ca = Math.cos(a)*2.4, sa = Math.sin(a)*2.4, mz = SZ1 - 1.3;
  const parts = [];
  parts.push({ box: [[14.8, 28.6, SZ0], [24.8, 38.6, SZ0 + .5]], svg: tiBx(14.8, 28.6, SZ0, 24.8, 38.6, SZ0 + .5, STEELM, .6) });
  parts.push({ box: [[FX - 1.8, FY - 1.8, SZ0 + .5], [FX + 1.8, FY + 1.8, SZ0 + 4.2]], svg: cyl(FX, FY, SZ0 + .5, SZ0 + 4.2, 1.8, DARK, toneI, .8, 20) });
  parts.push({ box: [[FX - .2, FY - .2, SZ0 + 4.2], [FX + .2, FY + .2, mz - .4]], svg: cyl(FX, FY, SZ0 + 4.2, mz - .4, .2, STEELM, toneI, .5, 8) });
  parts.push({ box: [[FX - 2.5, FY - 2.5, mz - .45], [FX + 2.5, FY + 2.5, mz + .45]],
    svg: (depthOf([ca, sa, 0]) > 0 ? rod([FX - ca, FY - sa, mz], [FX, FY, mz], .45, matOf('#4f86d8'), toneI, .6) + rod([FX, FY, mz], [FX + ca, FY + sa, mz], .45, matOf('#e2483d'), toneI, .6)
      : rod([FX + ca, FY + sa, mz], [FX, FY, mz], .45, matOf('#e2483d'), toneI, .6) + rod([FX, FY, mz], [FX - ca, FY - sa, mz], .45, matOf('#4f86d8'), toneI, .6)) });
  parts.push({ box: [[22.4, 26.2, SZ0 + .4], [28, 33, SZ0 + .9]], svg: tiBx(22.4, 26.2, SZ0 + .4, 28, 33, SZ0 + .7, PCBM, .6) + tiBx(24, 28, SZ0 + .7, 25.4, 29.4, SZ0 + 1.1, DARK, .4) + tiBx(26, 30.6, SZ0 + .7, 26.8, 31.4, SZ0 + 1.6, matOf('#3f4a8a'), .4) });
  parts.push({ box: [[27.2, 28.7, 6.1], [28.8, 30.3, 7.7]], svg: cylX(27.2, 28.8, 29.5, 6.9, .8, STEELM, toneI, .6, 14) });
  parts.push({ box: [[27.2, 36.9, 6.1], [28.8, 38.7, 7.7]], svg: tiBx(27.2, 36.9, 6.1, 28.8, 38.7, 7.7, DARK, .6) });
  parts.push({ box: [[27.8, 34.9, 8.1], [28.8, 35.5, 8.7]], svg: cylX(27.8, 28.8, 35.2, 8.4, .3, matOf('#43c25c'), toneI, .4, 8) });
  parts.push({ box: [[10.8, 37.6, 5], [12.2, 40.4, 7.2]], svg: tiBx(10.8, 37.6, 5, 12.2, 40.4, 7.2, DARK, .6) });
  parts.push(...tiWire([[22.6, 29, SZ0 + .7], [21.6, 31.4, SZ0 + 1.6], [FX + 1.4, FY - .8, SZ0 + 2.4]], '#e2483d', .3, 1.2));
  parts.push(...tiWire([[12.2, 39, 6], [16, 39, SZ0 + .7], [22.6, 32.4, SZ0 + .7]], '#3a3632', .3, 1.2));
  parts.push(...tiWire([[27.4, 29.5, 6.2], [27.4, 29.5, SZ0 + 1.2], [27.6, 29.8, SZ0 + .7]], '#d8a24a', .25, 1.2));
  parts.push(...tiWire([[27.4, 37.8, 6.1], [27.4, 34, SZ0 + 1.2], [27.6, 32.6, SZ0 + .7]], '#d8a24a', .25, 1.2));
  return [s, tiSort(parts)]; }

function tiMeter(st, m, k, pH){
  const slope = (y, s, off = .05) => [40 - 11*s/MSL + MSN[0]*off, y, 4.5 + 5*s/MSL + MSN[2]*off];
  const txS = (y, s, str, size, col = INK, weight = 700) => `<text transform="${txM(P(...slope(y, s, .08)), Dv(0,-1,0), Dv(11/MSL, 0, -5/MSL))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`;
  let s = tiPrismY(MP, MY0, MY1, m, 1);
  const lcd = off => [slope(53.5, 4.6, off), slope(62.5, 4.6, off), slope(62.5, 10.6, off), slope(53.5, 10.6, off)];
  if (vis(MSN)){
    s += shape(lcd(.04), '#1d2a26', 1);
    s += txS(57.4, 6.3, pH.toFixed(2), 2.6, '#8af0ae', 800) + txS(61.3, 6.3, 'pH', 1.2, '#8af0ae', 700) + txS(58, 9.4, '25.0 C  MEAS', .8, '#8af0ae', 700);
    for (const [y, lab, M] of [[55, 'CAL', DARK], [58, 'MEAS', DARK], [61.5, 'ON', matOf('#e2483d')]]){ const a = slope(y, 2.2, 0), b = slope(y, 2.2, .45);
      s += rod(a, b, .7, M, toneI, .7) + txS(y, 1, lab, .62, INK, 800); }
    s += txS(58, 11.6, 'PH METER', .9, mix(m.d, '#000000', .2), 800);
  }
  if (facing([-1,0,0])) s += shape(on(PX(25.97), rectUV(55, 3.4, 57.6, 4.6)), '#f3f0e6', .5);
  if (!(k > 0)) return [s, ''];
  let ins = '';
  for (const [x, y] of [[29, 53], [38.5, 53], [29, 63], [38.5, 63]]) ins += cyl(x, y, BH, 2.6, .3, STEELM, toneI, .4, 8);
  ins += tiBx(28.4, 52.4, 2.6, 39, 63.6, 2.9, PCBM, .6);
  ins += tiBx(30, 58.6, 2.9, 31.6, 60.6, 3.4, DARK, .5) + tiBx(33.5, 55, 2.9, 36, 57.5, 3.3, DARK, .5);
  ins += tiBx(30.5, 53, 2.9, 33.2, 57.2, 4.6, matOf('#3f4a8a'), .6);
  ins += shape(lcd(-.6), '#3c4a44', .6);
  ins += tiStroke([[26.4, 60, 6], [28, 60, 4], [30, 59.8, 3]], '#d8a24a', .35);
  return [s, ins]; }

// the electrode's glass shaft between two heights, its insides drawn faintly through the glass
function tiElectrode(za, zb, k){
  const wire = `<path d="${pd([[EX, EY, Math.max(za, 12.6)], [EX, EY, zb]], false)}" stroke="#c9ced0" stroke-width=".35"/>`;
  const tube = zb > 12.6 ? tiLiquid(EX, EY, Math.max(za, 12.6), zb, .22, '#f2f6f6', .5 + .3*k, false) : '';
  const kcl = zb > 12.8 ? tiLiquid(EX, EY, Math.max(za, 12.8), Math.min(zb, 27), .55, '#f6eab8', .35 + .35*k, zb > 27 && za < 27) : '';
  return tiGlass(EX, EY, za, zb, .6, kcl + tube + wire, .7); }

function tiFlask(st, k, pH){
  const ind = tiInd(pH), h = tiLevel(VW + st.V), zs = FZ_IN + h, rs = tiRin(h);
  const rings = [[FZ, 3.95], [FZ + .4, 4.25], [FZ + 10.5, 2.25], [FZ + 14, 2.25], [FZ + 14, 2.5], [FZ + 14.5, 2.5]].map(([z, r]) => [z, r, tiRingZ(FX, FY, z, r, 28)]);
  let far = '', near = '';

  const tgt = st.tap ? 1 : st.dropQ > 0 || st.form > 0 ? .3 : 0;
  st.tapA = st.tapA < tgt ? Math.min(tgt, st.tapA + dt/.3) : Math.max(tgt, st.tapA - dt/.3);
  if (st.phase === 'reset'){ st.rt += dt/1.4; const e = ease(Math.min(1, st.rt)); st.V = st.Vfrom*(1 - e); st.Vb = st.Vbfrom*(1 - e);
    if (st.rt >= 1){ st.phase = 'idle'; st.V = st.Vb = 0; st.trace = [[0, tiPH(0)]]; st.endV = null; } return; }
  // stream: the open tap runs NaOH straight into the flask
  if (st.tapA > .6){ const dv = Math.min(VMAX - st.Vb, FLOW*(st.tapA - .6)/.4*dt);
    if (dv > 0){ st.Vb += dv; st.V += dv; st.pt = (st.pt || 0) + dt; if (st.pt > .12){ st.pt = 0; tiPlume(st); } tiRecord(st); }
    if (st.Vb >= VMAX - 1e-6 && st.tap){ st.tap = 0; ui.flash('The burette is empty: press Reset'); } }
  // drop by drop: the key cracked open, a drop swells on the jet, lets go and falls
  if (!st.tap && st.dropQ > 0 && st.tapA >= .29){ st.form = Math.min(1, st.form + dt/.35);
    if (st.form >= 1){ st.form = 0; st.dropQ--; st.Vb = Math.min(VMAX, st.Vb + DROP); st.drops.push({ z: TIP_Z - .3, vz: 0 }); } }
  const zs = FZ_IN + tiLevel(VW + st.V);
  for (const d of st.drops){ d.vz += 300*dt; d.z -= d.vz*dt; }
  for (const d of st.drops.filter(d => d.z <= zs)){ st.V = Math.min(st.Vb, st.V + DROP); tiPlume(st); tiRecord(st); }
  st.drops = st.drops.filter(d => d.z > zs);
  // a plume fades as the swirl mixes it in; close to the end the pink lingers (few H+ left to use up the OH-)
  const near = 1 + 7*Math.exp(-Math.max(0, NA0/CB - st.V)/.5), tau = (st.w > .5 ? .35 : 2.6)*near;
  for (const p of st.plumes){ p.i *= Math.exp(-dt/tau); p.r += dt*(st.w > .5 ? 4 : .8); }
  st.plumes = st.plumes.filter(p => p.i > .03);
}
function tiRun(){ if (tiLoopOn) return; tiLoopOn = true;
  ui.animate(dt => { const st = ui.st; tiStep(st, dt); if (!tiBusy(st)){ tiLoopOn = false; return false; } return true; }); }
function tiStir(st){ st.stir = !st.stir; tiRun(); }
function tiNeedStir(st){ if (!st.stir){ st.stir = true; ui.flash('Stirrer on: the flask must be swirled as the base goes in'); } }
function tiTap(st){
  if (st.phase === 'reset') return ui.flash('One moment: refilling');
  if (st.tap){ st.tap = 0; tiRun(); return; }
  if (st.Vb >= VMAX - 1e-6) return ui.flash('The burette is empty: press Reset');
  tiNeedStir(st); st.tap = 1; st.dropQ = 0; tiRun(); }
function tiDrop(st){
  if (st.phase === 'reset') return ui.flash('One moment: refilling');
  if (st.tap) return ui.flash('Close the tap first, then add drop by drop');
  if (st.Vb + DROP*(st.dropQ + 1) > VMAX + 1e-6) return ui.flash('The burette is empty: press Reset');
  tiNeedStir(st); st.dropQ = Math.min(st.dropQ + 1, 6); tiRun(); }
function tiReset(st){ st.tap = 0; st.dropQ = 0; st.form = 0; st.drops = []; st.plumes = []; st.phase = 'reset'; st.rt = 0; st.Vfrom = st.V; st.Vbfrom = st.Vb; tiRun(); }

ui = mountFigure({
  fig:'C1', title:'Acid-base titration', turn:'full',
  size:[BW, BD, ROD_T], palette:'mint',
  state:{ phase:'idle', V:0, Vb:0, tap:0, tapA:0, dropQ:0, form:0, drops:[], plumes:[], stir:false, w:0, spin:.6, t:0, trace:[[0, tiPH(0)]], endV:null, rt:0, Vfrom:0, Vbfrom:0 },
  scene,
  stats: st => { const p = tiPH(st.V);
    return [ { label:'pH', value: p.toFixed(2) },
      { label:'NaOH added', value: st.Vb.toFixed(2) + ' mL', small:true },
      { label:'Indicator', value: tiIndName(p), small:true },
      st.endV != null ? { label:'Endpoint', value: st.endV.toFixed(2) + ' mL', small:true } : null ]; },
  buttons:[
    { label:'Stirrer on / off', onClick: st => tiStir(st) },
    { label:'Open / close tap', onClick: st => tiTap(st) },
    { label:'Add a drop', onClick: st => tiDrop(st) },
    { label:'Reset', onClick: st => tiReset(st) },
  ],
  acts:{ tap: st => tiTap(st), knob: st => tiStir(st) },
  params:(st, q) => {
    if (q.has('V')){ const v = tiClamp(+q.get('V') || 0, 0, VMAX); st.V = st.Vb = v; st.trace = [];
      for (let x = 0; x < v; x += x > 23 && x < 26 ? .05 : .5) st.trace.push([x, tiPH(x)]); st.trace.push([v, tiPH(v)]); if (tiPH(v) >= 8.2) st.endV = 25.05; }
    if (q.get('stir') === '1'){ st.stir = true; st.w = 1; }
    if (q.get('tap') === '1'){ st.tap = 1; st.tapA = 1; }
    if (q.has('drop')){ st.tapA = .3; st.drops = [{ z: +q.get('drop') || 18, vz: 0 }]; }
    if (q.get('plume') === '1') st.plumes = [{ i: .9, r: .6, sp: 0 }];
    if (q.has('spin')) st.spin = +q.get('spin');
  },
});
xrMount(() => ui, () => '');
// the panels and label columns steer round the page's controls, some of which (the switches, the zoom chip) arrive and
// settle after the first draw: draw again whenever the figure or the stats change size, and once the page has loaded
new ResizeObserver(() => ui.render()).observe(document.getElementById('fig'));
new ResizeObserver(() => ui.render()).observe(document.getElementById('stats'));
addEventListener('load', () => { for (const t of [0, 450, 1200]) setTimeout(() => ui.render(), t); });   // after the page's own fit-to-window
</script></body></html>
