/* Truth first.
   Heat an 80 ml charge in a supported round-bottom flask with an electric mantle.
   Water evaporates; salt stays in the flask. Wine gives ethanol-enriched water, never pure ethanol.
   The thermometer bulb sits at the sidearm, in vapour, not in the liquid.
   Vapour travels down the inner tube. Cooling water enters the LOW end of the separate jacket,
   leaves the HIGH end and drains to the sink. Condensate runs downhill and drips into an open receiver.
   With cooling off the jacket warms; vapour leaves the open receiver vent instead of collecting.
   This is an accelerated qualitative model at atmospheric pressure. Wine starts near 92 C,
   increasing as alcohol is removed; salt-water vapour is near 100 C. Not a predictive VLE calculation.
   Sources.
   https://www.chem.rochester.edu/notvoodoo/pages/purification/simple_distillation.php
   https://iu.pressbooks.pub/iuegenchemlabs/chapter/alcohol-production-by-fermentation-and-distillation/
   Parts and attachments.
   BENCH. Board supports mantle, two weighted stands, receiver and sink with tap.
   GLASS. Round flask in mantle; neck held by a lined clamp; ground joint to still head;
   thermometer and adapter above head; sidearm joins sloping condenser; inner tube within sealed
   water jacket; two hose barbs; outlet joint and bent delivery adapter; open receiving flask.
   SUPPORTS. Each base holds a vertical rod; bosshead and screw hold a cross-arm; lined jaws grip glass.
   HEATER. Housing, insulation bowl, resistance winding, control knob, pilot light and mains lead.
   WATER. Tap body, valve handle, spout, supply hose to lower barb; upper barb to return hose and sink drain.
   CONTENTS. Charge, boiling chips, salt ions or wine molecules; distillate. Moving dots are overlays,
   not apparatus. Heat is cut before the flask runs dry. Specimen selection replaces a cooled teaching setup. */
const dstA = [38,94,72], dstB = [38,36,49];
const dstMix = (a,b,t) => a.map((v,i) => v+(b[i]-v)*t);
const dstBounds = (pts,r=0) => [[0,1,2].map(i=>Math.min(...pts.map(p=>p[i]))-r),[0,1,2].map(i=>Math.max(...pts.map(p=>p[i]))+r)];
const dstRing = (x,y,z,r) => on(PZ(z),ellUV(x,y,r,r,28));
const dstAt = t => dstMix(dstA,dstB,t);
const dstFeed = { salt:{name:'Salt water',col:'#6faeca',product:'Pure water',bp:100.5}, wine:{name:'Wine',col:'#ad4b68',product:'Ethanol-rich water',bp:92} };
const dstState = {feed:'salt',heating:false,temp:20,head:20,cool:true,jacket:18,collected:0,escaped:0,time:0,travel:0,phase:'ready',xr:0,xrT:0};
const dstBoil = st => dstFeed[st.feed].bp + (st.feed==='wine' ? Math.min(7,(st.collected+st.escaped)*.18) : 0);
let dstUI, dstRunning=false;
function dstTick(st,dt){
  st.time+=dt;
  const bp=dstBoil(st), used=st.collected+st.escaped;
  st.temp=st.heating ? Math.min(bp,st.temp+18*dt) : Math.max(20,st.temp-13*dt);
  st.jacket+=Math.sign((st.cool?18:82)-st.jacket)*Math.min(Math.abs((st.cool?18:82)-st.jacket),dt*32);
  const boiling=st.heating && st.temp>=bp-.05 && used<60;
  st.phase=boiling?'boiling':st.heating?'warming':st.temp>20?'cooling':'ready';
  st.head=boiling ? Math.min(st.feed==='salt'?100:bp,st.head+80*dt) : Math.max(20,st.head-18*dt);
  st.travel=boiling?Math.min(1,st.travel+dt/1.5):Math.max(0,st.travel-dt*2);
  if(boiling && st.travel>=1){
    const amount=Math.min(2*dt,60-used);
    if(st.jacket<45) st.collected+=amount; else st.escaped+=amount;
  }
  if(st.collected+st.escaped>=60-1e-8) st.heating=false;
}
function dstKick(){
  if(dstRunning)return; dstRunning=true;
  dstUI.animate(dt=>{dstTick(dstState,dt);const more=dstState.heating||dstState.temp>20||dstState.head>20;dstRunning=more;return more;});
}
function dstHeat(st,ui){st.heating=!st.heating;if(st.collected+st.escaped>=60){st.heating=false;return ui.flash('Replace the cooled charge before heating again');}dstKick();}
function dstSelect(st,ui){

  st.feed=st.feed==='salt'?'wine':'salt';Object.assign(st,{temp:20,head:20,collected:0,escaped:0,travel:0,phase:'ready'});
  ui.flash(dstFeed[st.feed].name+' charge, clean receiver');
}
function dstGlassEdge(rings){
  const edges=new Map(),n=rings[0].length;
  for(let i=0;i<rings.length-1;i++)for(let j=0;j<n;j++){
    const ids=[i*n+j,i*n+(j+1)%n,(i+1)*n+(j+1)%n,(i+1)*n+j],p=ids.map(id=>rings[Math.floor(id/n)][id%n]);
    let nr=norm(cross(sub(p[1],p[0]),sub(p[3],p[0])));
    const center=avg(rings[i].concat(rings[i+1]));if(dot(nr,sub(avg(p),center))<0)nr=nr.map(v=>-v);
    if(!vis(nr))continue;
    for(let e=0;e<4;e++){const a=ids[e],b=ids[(e+1)%4],key=[Math.min(a,b),Math.max(a,b)].join(',');if(edges.has(key))edges.delete(key);else edges.set(key,[p[e],p[(e+1)%4]]);}
  }
  return ink([...edges.values()].map(p=>pd(p,false)).join(''),1.5);
}
function dstGlass(rings,inside,k){

  }
  return `<g opacity="${.18-.1*k}">${far}</g>`+inside+`<g opacity="${.24-.16*k}">${near}</g>`+dstGlassEdge(rings)+ink(pd(rings.at(-1)),.8);
}
function dstCallouts(items){

  items=items.filter(it=>!omitted.test(it.text));

  let svg='';

    const panel=document.getElementById(side<0?'btns':'stats').getBoundingClientRect();
    const chip=document.querySelector('.zchip');
    const top=mobile?vb.y+10*unit:point(panel.left,panel.bottom+14).y;
    const bottom=chip?point(0,chip.getBoundingClientRect().top-10).y:vb.y+vb.height-35*unit;

    col.sort((a,b)=>a.p[1]-b.p[1]);
    col.forEach((it,i)=>{
      const w=mobile?h*1.3:it.text.length*fs*.62+fs*1.5,x=side<0?vb.x+4*unit+w/2:vb.x+vb.width-4*unit-w/2,y=top+i*gap,ex=x-side*w/2;
      const n=((window.__ln||(window.__ln={}))[it.text]||(__ln[it.text]=Object.keys(__ln).length+1));
      svg+=`<g class="tag${it.on?' on':''}" data-n="${n}" data-t="${it.text}" pointer-events="none"><path d="M${f(it.p[0])} ${f(it.p[1])}L${f(ex)} ${f(y)}" fill="none" stroke="${INK}" stroke-width=".7"/><circle cx="${f(it.p[0])}" cy="${f(it.p[1])}" r="${f(INK_K)}" fill="${INK}"/><rect x="${f(x-w/2)}" y="${f(y-h/2)}" width="${f(w)}" height="${f(h)}" rx="${f(h/2)}" fill="${it.on?'var(--accent)':'#fff4d6'}" stroke="${INK}" stroke-width="1"/><text x="${f(x)}" y="${f(y+fs*.35)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" fill="${INK}">${mobile?n:it.text}</text></g>`;
    });
  }
  return svg;
}
function dstTube(a,b,r,k,inside=''){
  const axis=norm(sub(b,a)),u=norm(cross(axis,[1,0,0])),v=cross(axis,u);
  const ring=p=>Array.from({length:24},(_,i)=>{const t=i*Math.PI/12;return p.map((q,j)=>q+r*(u[j]*Math.cos(t)+v[j]*Math.sin(t)));});
  const aa=ring(a),bb=ring(b);
  return `<g opacity="${.16-.08*k}">${loft(aa,bb,()=>CLEAR.m,true)}</g>`+inside+`<g opacity="${.24-.14*k}">${loft(aa,bb,n=>toneI(n,CLEAR))}</g>`+hullInk([...aa,...bb],1.5)+ink(pd(aa),.65)+ink(pd(bb),.65);
}
function dstDot(p,r,col){const q=P(...p);return `<circle cx="${f(q[0])}" cy="${f(q[1])}" r="${f(r)}" fill="${col}" stroke="${INK}" stroke-width=".6"/>`;}

  labels.push({at:[38,108,55],text:'FLASK NECK'},{at:[38,108,level],text:st.feed==='salt'?'SALT WATER CHARGE':'WINE CHARGE',on:st.heating},{at:[38,108,19],text:'BOILING CHIPS'});
