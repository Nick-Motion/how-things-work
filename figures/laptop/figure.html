<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laptop</title></head><body>
<script src="core.js"></script>
<script>
/* Laptop: a 14-inch clamshell on a desk with its USB-C charger.
   Truth (how a real laptop works, and where the energy goes after each step):
   1. Open the lid: the lid turns on two friction hinges at the back of the base; the hinge leaves are screwed to the
      top case and to the lid's back cover, and the display cable and Wi-Fi antenna cables pass through the hinge area.
   2. Press power: the power key closes a small switch on the keyboard flex. The embedded controller (always powered
      from the battery's standby rail) sees it and tells the PMIC to bring up the rails; the VRM chokes feed the CPU.
      The CPU leaves reset and runs UEFI firmware from the SPI BIOS flash (POST, RAM training, the fan spins briefly),
      lights the panel over the eDP display cable (T-CON board -> LCD, LED backlight), then loads the OS from the NVMe
      SSD into RAM. The desktop appears and the speakers chime.
   3. Plug in the charger: mains -> brick -> USB-C cable -> USB-C port -> charge controller -> battery (charge light on).
      Unplugged, the battery feeds everything through the same controller.
   4. Heavy load: the CPU draws ~45 W. Heat goes die -> copper cold plate -> heat pipe -> fin stack; the blower fan
      speeds up, pulls air in and pushes it through the fins and out of the rear vent. Load off: it cools, the fan stops.

   Parts (each held by another):
   CASE      bottom case . top case with keyboard well, keycaps, power key, trackpad . 4 rubber feet . rear exhaust vent .
             side ports (2 USB-C, audio jack, USB-A) . speaker grilles . power light (front) . charge light (left side)
   LID       back cover with logo . bezel . display . webcam . hinge barrel . LCD panel . LED backlight strip . T-CON board .
             2 Wi-Fi antennas . 2 lid hinge leaves
   HINGES    2 base leaves on the top case . risers . pins
   BOARD     motherboard on 4 standoffs . CPU (substrate + die) . cold plate with 4 spring screws . 4 LPDDR RAM packages .
             5 VRM chokes . PMIC . embedded controller . BIOS flash . M.2 socket . NVMe SSD (controller, 2 NAND, screw) .
             Wi-Fi card with 2 antenna connectors . 2 USB-C receptacles . charge controller + inductor .
             connectors: display, keyboard, trackpad, battery, fan, audio, 2 speakers, power switch
   COOLING   heat pipe . fin stack . blower fan (housing, impeller, hub) . fan cable
   POWER     battery pack (3 cells) . battery cable . charger brick . USB-C cable + plug . mains cord
   OTHER     2 speakers + cables . audio jack + cable . trackpad module + ribbon . keyboard ribbon . power switch + flex
             display cable . 2 antenna cables . webcam cable */

/* ---------- geometry (1 unit = 1 mm; x = depth, front at XF; y = width, +y viewer-left; z up) ---------- */
const BRD = [335, 450], BT = 4;                    // desk board, its top
const XB = 80, YR = 36, LW = 220, LD = 310;        // base: back edge, right side, depth, width
const XF = XB + LW, YL = YR + LD;
const Z0 = BT + 1.5, Z1 = Z0 + 14;                 // base bottom (on rubber feet) and top
const HX = XB + 7, LIDT = 3, HZ = Z1 + LIDT;       // hinge axis; lid half thickness
const LIDL = 212, OPEN = 112;                      // lid length from the axis; fully open angle
const PZc = Z0 + 6.75;                             // port centre height
const PORTS = [50, 70];                            // USB-C ports (local x); the first one takes the charger
const BRK = [230, 285, 395, 435, BT + 18];         // charger brick x0, x1, y0, y1, top
const Lq = ([x, y, z]) => [XB + x, YR + y, z];     // base-local -> desk
const AMB = 30;

const KEYM = { l:'#4d4a46', m:'#34312e', d:'#211f1d' }, PCBM = { l:'#4fa36a', m:'#2f8a4a', d:'#1d5f31' };
const CHIPM = { l:'#57534f', m:'#3b3835', d:'#252321' }, COPPER = { l:'#f0b07a', m:'#d08a52', d:'#9a5a2c' };
const GOLD = matOf('#d8b25a'), CONN = matOf('#e8e4da'), BATM = matOf('#45505c'), FANM = matOf('#3e4247');
const SSDM = { l:'#3d5a8a', m:'#2c4670', d:'#1b2c48' }, PANELM = matOf('#b9cbd8'), PLUGM = CERAMIC;
const BEZEL = '#1c1b1a';
const tmix = (a, b, t) => mix(a, b, Math.max(0, Math.min(1, t)));
const clamp01 = v => Math.max(0, Math.min(1, v));

/* ---------- lid frame ---------- */
let LC = 1, LS = 0;                                 // cos / sin of the lid angle (0 = closed)
const LPt = (y, s, t) => [HX + s*LC - t*LS, YR + y, HZ + s*LS + t*LC];
const ES = () => [LC, 0, LS], ET = () => [-LS, 0, LC];
const scl3 = (v, k) => v.map(a => a*k);
// a box along any three edges from corner o
function obx(o, e1, e2, e3, M, w = .6, shade = toneI){
  const at = (a, b, c) => [0,1,2].map(i => o[i] + a*e1[i] + b*e2[i] + c*e3[i]), E = [e1, e2, e3].map(norm), neg = v => v.map(a => -a);
  const F = [[E[0], [at(1,0,0),at(1,1,0),at(1,1,1),at(1,0,1)]], [neg(E[0]), [at(0,0,0),at(0,1,0),at(0,1,1),at(0,0,1)]],
             [E[1], [at(0,1,0),at(1,1,0),at(1,1,1),at(0,1,1)]], [neg(E[1]), [at(0,0,0),at(1,0,0),at(1,0,1),at(0,0,1)]],
             [E[2], [at(0,0,1),at(1,0,1),at(1,1,1),at(0,1,1)]], [neg(E[2]), [at(0,0,0),at(1,0,0),at(1,1,0),at(0,1,0)]]];
  return F.filter(([n]) => vis(n)).map(([n, q]) => shape(q, shade(n, M), w)).join('');
}
const lbox = (y0, s0, t0, y1, s1, t1, M, w = .6) => obx(LPt(y0, s0, t0), [0, y1 - y0, 0], scl3(ES(), s1 - s0), scl3(ET(), t1 - t0), M, w);
const lpoly = (pts, t) => pd(pts.map(([y, s]) => LPt(y, s, t)));
// text on the lid: on the screen side it reads toward -y, on the back toward +y; hidden when that face is turned away
const ltx = (y, s, t, str, size, col, back = false, wt = 800) => `<text transform="${txM(P(...LPt(y, s, t)), Dv(0, back ? 1 : -1, 0), Dv(-LC, 0, -LS))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${wt}" letter-spacing=".04em">${str}</text>`;

/* ---------- small helpers ---------- */
const boxOf = (pts, e = .05) => [[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - e), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + e)];
const bendPts = (pts, r = 3) => { if (pts.length < 3) return pts; const out = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++){ const [a, b, c] = [pts[i - 1], pts[i], pts[i + 1]];
    const la = Math.hypot(...a.map((v, k) => v - b[k])), lc = Math.hypot(...c.map((v, k) => v - b[k])), d = Math.min(r, la/2.2, lc/2.2);
    if (d < 1e-3){ out.push(b); continue; }
    const p = a.map((v, k) => b[k] + (v - b[k]) * d/la), q = c.map((v, k) => b[k] + (v - b[k]) * d/lc);
    for (let j = 0; j <= 4; j++){ const t = j/4; out.push([0,1,2].map(k => (1-t)*(1-t)*p[k] + 2*(1-t)*t*b[k] + t*t*q[k])); } }
  out.push(pts[pts.length - 1]); return out; };
const wireSvg = (pts, col, w) => { const d = pd(pts, false);
  return `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${f(2*w + .8)}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${col}" stroke-width="${f(2*w)}" stroke-linecap="round" stroke-linejoin="round"/>`; };
// a cable cut into short pieces, each with its own box, so it sorts with the solids it passes
const wireParts = (pts, col, w = .4, segL = 9) => { const q = bendPts(pts), out = [];
  for (let i = 0; i < q.length - 1; ){
    let j = i + 1, len = 0; while (j < q.length - 1 && len < segL){ len += Math.hypot(...q[j].map((v, k) => v - q[j - 1][k])); j++; }
    if (len < segL) while (j < q.length - 1) j++;
    const seg = q.slice(i, j + 1); out.push({ box: boxOf(seg), svg: wireSvg(seg, col, w) }); i = j; }
  return out; };
function smooth3(pts, it = 3){
  for (let k = 0; k < it; k++){ const o = [pts[0]];
    for (let i = 0; i < pts.length - 1; i++){ const a = pts[i], b = pts[i + 1]; o.push(a.map((v, j) => v*.75 + b[j]*.25), a.map((v, j) => v*.25 + b[j]*.75)); }
    o.push(pts[pts.length - 1]); pts = o; }
  return pts;
}
const cord = (pts, r, col) => { const d = pd(smooth3(pts), false), c = 'fill="none" stroke-linecap="round" stroke-linejoin="round"';
  return `<path d="${d}" ${c} stroke="${INK}" style="stroke-width:${f(2*r + 1.6*INK_K)}"/><path d="${d}" ${c} stroke="${col}" style="stroke-width:${f(2*r)}"/>`; };
const dotZ = (x, y, z, r, c, w = .3) => { const q = on(PZ(z), ellUV(x, y, r, r, 10)); return fill(pd(q), c) + ink(pd(q), w); };

/* ---------- keyboard: rows of key widths (units), listed from the viewer's left (high y) ---------- */
const KPU = 250/15, KY1 = 280;
const KROWS = [
  { x0: 25, d: 8.5, keys: Array(15).fill(1) },
  { x0: 36, d: 14.4, keys: [...Array(13).fill(1), 2] },
  { x0: 52.5, d: 14.4, keys: [1.5, ...Array(12).fill(1), 1.5] },
  { x0: 69, d: 14.4, keys: [1.75, ...Array(11).fill(1), 2.25] },
  { x0: 85.5, d: 14.4, keys: [2.25, ...Array(10).fill(1), 2.75] },
  { x0: 102, d: 14.4, keys: [1, 1, 1, 1.25, 5.5, 1.25, 1, 'L', 'UD', 'R'] } ];
const KEYS = (() => { const out = [];
  KROWS.forEach((r, ri) => { let u = 0;
    for (const k of r.keys){ const w = typeof k === 'number' ? k : 1, y1 = YR + KY1 - u*KPU - 1.1, y0 = YR + KY1 - (u + w)*KPU + 1.1, X0 = XB + r.x0, X1 = X0 + r.d;
      if (k === 'UD'){ out.push({ x0: X0, x1: X0 + 6.7, y0, y1 }, { x0: X0 + 7.7, x1: X1, y0, y1 }); }
      else if (k === 'L' || k === 'R') out.push({ x0: X0 + 7.7, x1: X1, y0, y1 });
      else out.push({ x0: X0, x1: X1, y0, y1, power: ri === 0 && u === 14 });
      u += w; } });
  return out; })();
const PWR = KEYS.find(k => k.power);

/* ---------- the base ---------- */
const ringB = (z, ins, r) => on(PZ(z), rrUV(XB + ins, YR + ins, XF - ins, YL - ins, r, 6));
const BA = ringB(Z0, 3, 9), BM = ringB(Z0 + 3, 0, 12), BTOPR = ringB(Z1, .6, 11.4);
const TPAD = [XB + 132, YR + 95, XB + 197, YR + 215];
const FEET = [[XB + 22, YR + 24], [XB + 22, YL - 24], [XF - 22, YR + 24], [XF - 22, YL - 24]];
function baseSvg(st, m){
  const top = tone([0,0,1], m);
  let s = loft(BA, BM, n => tone(n, m)) + loft(BM, BTOPR, n => tone(n, m)) + fill(pd(BTOPR), top);
  // keyboard well and keys
  const well = on(PZ(Z1 + .02), rrUV(XB + 22, YR + 28, XB + 119.5, YR + 282, 3, 3));
  s += shape(well, mix(top, '#000000', .45), .8);
  s += byDepth(KEYS.map(k => { const zt = Z1 - .25 - (k.power && st.pwrT > 0 ? .6 : 0);
    let svg = box(k.x0, k.y0, Z1 - 1.4, k.x1, k.y1, zt, k.power ? matOf('#5b5752') : KEYM, toneI, .55);
    if (k.power){ const cx = (k.x0 + k.x1)/2, cy = (k.y0 + k.y1)/2, ring = arcUV(cx, cy, 2.2, 120, 420, 12).map(([x, y]) => [x, y, zt + .02]);
      svg += `<path d="${pd(ring, false)} ${pd([[cx - 1, cy, zt + .02], [cx - 3, cy, zt + .02]], false)}" fill="none" stroke="${st.pw === 'on' || st.pw === 'boot' ? '#f4f1e6' : '#a9a39a'}" stroke-width=".6" stroke-linecap="round"/>`; }
    return { box: [[k.x0, k.y0, Z1 - 1.4], [k.x1, k.y1, zt]], svg: k.power ? act('power', svg) : svg }; }));
  // trackpad
  const tp = on(PZ(Z1 + .03), rrUV(TPAD[0], TPAD[1], TPAD[2], TPAD[3], 5, 4));
  s += shape(tp, mix(top, '#ffffff', .14), 1);
  // front: notch and the power light
  if (facing([1,0,0])){
    s += shape(on(PX(XF + .05), rrUV(YR + 148, Z0 + 6.6, YR + 162, Z0 + 7.8, .6, 2)), st.pw === 'on' || st.pw === 'boot' ? '#f6f3e8' : st.pw === 'sleep' ? '#c9b98a' : '#6b6760', .4);
  }
  // left side (+y): two USB-C ports, the charge light, the left speaker grille
  if (facing([0,1,0])){ const sy = YL + .05;
    for (const px of PORTS) s += shape(on(PY(sy), rrUV(XB + px - 4.5, PZc - 1.7, XB + px + 4.5, PZc + 1.7, 1.6, 3)), '#1e1c1a', .7);
    const chg = st.plug >= 1 ? (st.bat >= 99.5 ? '#f6f3e8' : '#f5a531') : '#6b6760';
    s += shape(on(PY(sy), ellUV(XB + 84, PZc, 1.2, 1.2, 10)), chg, .4);
    let g = ''; for (let x = XB + 146; x <= XB + 200; x += 3.6) g += pd([[x, sy, Z0 + 5.4], [x, sy, Z0 + 9.6]], false);
    s += `<path d="${g}" fill="none" stroke="${INK}" stroke-width="1" opacity=".65" stroke-linecap="round"/>`;
  }
  // right side (-y): USB-A, audio jack, the right speaker grille
  if (facing([0,-1,0])){ const sy = YR - .05;
    s += shape(on(PY(sy), rectUV(XB + 34, Z0 + 4.4, XB + 47, Z0 + 9.4)), '#1e1c1a', .7) + fill(pd(on(PY(sy - .02), rectUV(XB + 36, Z0 + 7.2, XB + 45, Z0 + 8.2))), '#3f6fb4');
    s += shape(on(PY(sy), ellUV(XB + 80, PZc, 1.9, 1.9, 14)), '#1e1c1a', .7);
    let g = ''; for (let x = XB + 146; x <= XB + 200; x += 3.6) g += pd([[x, sy, Z0 + 5.4], [x, sy, Z0 + 9.6]], false);
    s += `<path d="${g}" fill="none" stroke="${INK}" stroke-width="1" opacity=".65" stroke-linecap="round"/>`;
  }
  // back: the exhaust vent in front of the fin stack
  if (facing([-1,0,0])){ const sx = XB - .05;
    s += shape(on(PX(sx), rrUV(YR + 67, Z0 + 3.5, YR + 123, Z0 + 10, 1.5, 3)), '#2a2724', .8);
    let g = ''; for (let y = YR + 70; y <= YR + 120; y += 3) g += pd([[sx - .02, y, Z0 + 4.2], [sx - .02, y, Z0 + 9.3]], false);
    s += `<path d="${g}" fill="none" stroke="#8f989b" stroke-width=".9"/>`;
  }
  s += ink(pd(BTOPR), 1.5) + hullInk([...BA, ...BM, ...BTOPR], 2.8);
  return s;
}

/* ---------- the lid ---------- */
const lidRing = t => rrUV(1, 0, LD - 1, LIDL, 10, 6).map(([y, s]) => LPt(y, s, t));
const SCR = [12, 14, LD - 12, 200];                          // display area (y0, s0, y1, s1) on the screen face
function screenState(st){
  if (st.pw === 'off' || st.pw === 'sleep') return 'off';
  if (st.pw === 'boot') return st.bt < 1.2 ? 'dark' : st.bt < 1.45 ? 'black' : 'logo';
  return 'desk';
}
function screenSvg(st){
  const t = -LIDT - .06, sc = screenState(st);
  const R = (y0, s0, y1, s1, c, extra = '') => fill(lpoly([[y0, s0], [y1, s0], [y1, s1], [y0, s1]], t), c, extra);
  const E = (y, s, r, c, extra = '') => fill(lpoly(ellUV(y, s, r, r, 18), t), c, extra);
  const [y0, s0, y1, s1] = SCR;
  if (sc === 'off' || sc === 'dark'){
    return R(y0, s0, y1, s1, '#24282c') + fill(lpoly([[y1 - 30, s1], [y1 - 80, s1], [y0 + 120, s0], [y0 + 170, s0]], t), '#ffffff', 'opacity=".05"'); }
  let s = R(y0, s0, y1, s1, '#07090a');
  if (sc === 'black') return s;
  const cy = (y0 + y1)/2, acc = PALS[st.pal].l;
  if (sc === 'logo'){
    s += fill(lpoly(rrUV(cy - 13, 112, cy + 13, 138, 6, 4), t), acc) + E(cy, 125, 6, '#07090a') + E(cy, 125, 3.6, acc);
    const on8 = Math.floor(st.bt * 10) % 8;
    for (let i = 0; i < 8; i++){ const a = i/8*2*Math.PI; s += E(cy + 8*Math.sin(a), 78 + 8*Math.cos(a), 1.5, i === on8 ? '#ffffff' : '#5b6066'); }
    return s;
  }
  // desktop: wallpaper, hills, sun, taskbar, a window
  s = R(y0, s0, y1, s1, '#8ec7ea');
  s += E(y0 + 70, 168, 13, '#ffd56a');
  s += fill(lpoly([[y1, 24], [y1, 92], [y1 - 60, 120], [y1 - 130, 96], [y0 + 120, 124], [y0 + 40, 104], [y0, 112], [y0, 24]], t), '#79b98a');
  s += fill(lpoly([[y1, 24], [y1, 62], [y1 - 90, 80], [y0 + 90, 58], [y0, 72], [y0, 24]], t), '#5e9f74');
  s += R(y0, s0, y1, 24, '#262a30');
  ['#e2483d', '#f4b829', '#43c25c', '#76a0e2', '#f3a6bb'].forEach((c, i) => { const yy = y1 - 10 - i*11; s += fill(lpoly(rrUV(yy - 4, 16, yy + 4, 22, 1.5, 2), t), c); });
  s += ltx(y0 + 18, 16.6, t, '9:41', 5.4, '#f2efe7', false, 700);
  if (st.load){
    const wy0 = cy - 70, wy1 = cy + 70;
    s += fill(lpoly([[wy1, 46], [wy0, 46], [wy0, 168], [wy1, 168]], t), '#f4f1e8') + fill(lpoly([[wy1, 158], [wy0, 158], [wy0, 168], [wy1, 168]], t), '#3b3f46');
    s += ltx(cy, 160.6, t, 'RENDER', 6, '#f2efe7');
    s += ltx(cy, 136, t, `FRAME ${Math.floor(st.frame)}  ${Math.round(st.prog*100)}%`, 7, INK);
    s += R(wy0 + 10, 118, wy1 - 10, 126, '#d9d4c6') + R(wy1 - 10 - 120*st.prog, 118, wy1 - 10, 126, acc);
    for (let i = 0; i < 12; i++){ const h = 8 + 30*Math.abs(Math.sin(i*1.7 + st.frame*.9)), yy = wy1 - 14 - i*10; s += R(yy - 7, 56, yy, 56 + h, '#e2483d'); }
    s += ltx(cy, 100, t, 'CPU 8 CORES 100%', 5.6, INK, false, 700);
  } else {
    s += fill(lpoly([[y1 - 30, 70], [y1 - 120, 70], [y1 - 120, 150], [y1 - 30, 150]], t), '#f4f1e8') + R(y1 - 120, 142, y1 - 30, 150, '#3b3f46');
    for (let i = 0; i < 4; i++) s += R(y1 - 110, 124 - i*14, y1 - 98, 132 - i*14, '#f4b829') + R(y1 - 94, 126 - i*14, y1 - 50, 129 - i*14, '#b9b3a6');
  }
  return s;
}
function lidSvg(st, m, k){
  const A = lidRing(-LIDT), B = lidRing(LIDT), nScr = [LS, 0, -LC], nBack = [-LS, 0, LC];
  let s = rod([HX, YR + 22, HZ], [HX, YL - 22, HZ], LIDT, m, tone, 1.4, LIDT, 20);
  s += loft(A, B, n => tone(n, m));
  if (facing(nScr)){
    s += fill(pd(A), BEZEL) + screenSvg(st);
    s += ltx(LD/2, 5, -LIDT - .06, 'COLORBOOK', 4.4, '#8a857c');
    s += fill(lpoly(ellUV(LD/2, 206, 1.8, 1.8, 12), -LIDT - .06), '#3a4a5c') + fill(lpoly(ellUV(LD/2 + .5, 206.5, .6, .6, 8), -LIDT - .07), '#9fc4e8');
    s += ink(pd(A), 1.3);
  }
  if (facing(nBack)){
    s += fill(pd(B), tone(nBack, m));
    const lg = lpoly(rrUV(LD/2 - 13, 100, LD/2 + 13, 126, 6, 4), LIDT + .05);
    s += fill(lg, mix(tone(nBack, m), '#ffffff', .35)) + ink(lg, .9) + ink(lpoly(ellUV(LD/2, 113, 6, 6, 18), LIDT + .06), .9);
    s += ink(pd(B), 1.4);
  }
  s += hullInk([...A, ...B], 2.6);
  if (k <= 0) return s;
  return `<g opacity="${f(1 - .8*k)}">${s}</g><g opacity="${f(k)}">${lidMech(st)}</g><g opacity="${f(.6*k)}">${hullInk([...A, ...B], 2.6)}</g>`;
}

/* ---------- see-through: inside the lid ---------- */
function lidMech(st){
  const lit = st.pw === 'on' || (st.pw === 'boot' && st.bt > 1.2), items = [];
  const put = (t, svg) => items.push({ t, svg });
  const wl = (pts, col, w = .45) => wireSvg(bendPts(pts.map(([y, s, t]) => LPt(y, s, t)), 3), col, w);
  // LCD panel (a pale plate so the parts behind stay readable), LED backlight strip along its bottom edge
  put(-1.6, `<g opacity=".55">${lbox(10, 12, -2.6, LD - 10, 202, -.6, PANELM, .7)}</g>`);
  put(-1.5, lbox(14, 9, -2.4, LD - 14, 12, -.8, lit ? matOf('#fff3c4') : matOf('#d9d4c6'), .5)
    + (lit ? fill(lpoly(rectUV(16, 9.5, LD - 16, 11.5), -2.5), '#fffbe0', 'opacity=".9"') : ''));
  // T-CON board on the chin, the display cable up through the hinge into it, the webcam cable down the back of the panel
  put(.7, lbox(140, 2, .2, 232, 9, 1.2, PCBM, .6) + lbox(170, 3.5, 1.2, 182, 7.5, 1.8, CHIPM, .4) + lbox(214, 3, 1.2, 226, 8, 2, CONN, .4));

/* ---------- the charger on the desk: brick, USB-C cable and plug, mains cord ---------- */
function plugPose(p){
  const rest = [XB + 64, YL + 20, BT + 3.2], align = [XB + PORTS[0], YL + 14, PZc], inn = [XB + PORTS[0], YL - 6.5, PZc];
  if (p <= .55){ const k = ease(p/.55), lift = Math.sin(k*Math.PI)*8; return [0,1,2].map(i => rest[i] + (align[i] - rest[i])*k + (i === 2 ? lift : 0)); }
  const k = ease((p - .55)/.45); return [0,1,2].map(i => align[i] + (inn[i] - align[i])*k);
}
function chargerParts(st){
  const out = [], [px, ny, pz] = plugPose(st.plug), cut = y => Math.max(y, YL);
  // plug: metal shell, overmold, strain relief (only what is outside the port)
  let pl = '';
  if (ny + 6.5 > YL) pl += box(px - 4.2, cut(ny), pz - 1.3, px + 4.2, ny + 6.5, pz + 1.3, METAL, toneI, .6);
  pl += box(px - 6, cut(ny + 6.5), pz - 3.2, px + 6, ny + 24, pz + 3.2, PLUGM, toneI, .9) + box(px - 3, ny + 24, pz - 2.3, px + 3, ny + 30, pz + 2.3, PLUGM, toneI, .7);
  out.push({ box: [[px - 6, cut(ny), pz - 3.2], [px + 6, ny + 30, pz + 3.2]], svg: act('plug', pl) });
  const tail = ny + 30, zc = pz;
  const pts = [[px, tail, zc], [px, tail + 7, Math.max(BT + 1.2, zc - 2)], [px + 8, tail + 14, BT + 1.2], [BRK[0] - 10, BRK[2] - 7, BT + 1.2], [BRK[0] + 22, BRK[2] - 6, BT + 1.2], [BRK[0] + 27, BRK[2] - 1, BT + 6], [BRK[0] + 27, BRK[2], BT + 7]];
  out.push({ box: boxOf([...pts, [px, tail - .1, zc]]), svg: cord(pts, 1.4, '#efeee8') });
  // brick with its light; mains cord off the left edge of the desk
  const rA = on(PZ(BT), rrUV(BRK[0], BRK[2], BRK[1], BRK[3], 6, 5)), rB = on(PZ(BRK[4]), rrUV(BRK[0], BRK[2], BRK[1], BRK[3], 6, 5));
  let br = loft(rA, rB, n => tone(n, CERAMIC)) + fill(pd(rB), CERAMIC.l) + ink(pd(rB), 1) + hullInk([...rA, ...rB], 2);
  br += dotZ((BRK[0] + BRK[1])/2, BRK[3] - 8, BRK[4] + .05, 1.4, st.plug >= 1 ? '#43c25c' : '#bdb8a6', .4);
  br += `<text transform="${txM(P((BRK[0] + BRK[1])/2 + 6, (BRK[2] + BRK[3])/2, BRK[4] + .05), Dv(0,-1,0), Dv(-1,0,0))}" font-size="7" fill="#9a958a" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800">65W</text>`;
  out.push({ box: [[BRK[0], BRK[2], BT], [BRK[1], BRK[3], BRK[4]]], svg: br });
  const mp = [[BRK[0] + 27, BRK[3], BT + 7], [BRK[0] + 27, BRK[3] + 6, BT + 1.2], [BRK[0] + 30, BRD[1] - .5, BT + 1.2], [BRK[0] + 30, BRD[1] + 1.5, -10]];
  out.push({ box: boxOf(mp), svg: cord(mp, 1.8, '#3a3632') });
  return out;
}

/* ---------- hot air out of the rear vent ---------- */
function airSvg(st){
  const a = clamp01((st.rpm - 2200) / 3000); if (a <= 0) return '';
  let s = '';
  for (let i = 0; i < 5; i++){ const y = YR + 74 + i*11, pts = [];
    for (let j = 0; j <= 10; j++){ const d = j*3.4, ph = st.clock*9 - j*.8 + i; pts.push([XB - 2 - d, y + 2.2*Math.sin(ph), Z0 + 7 + d*.18 + .8*Math.cos(ph)]); }
    s += `<path d="${pd(pts, false)}" fill="none" stroke="#ff9a5a" stroke-width="1.3" stroke-linecap="round" opacity="${f(.55*a)}"/>`; }
  return s;
}

/* ---------- scene ---------- */
// 30 pills don't fit one column, and most of the insides sit on the left of the picture, so split them here: the right
// column takes the right-most half of the parts whose anchors sit below the stats and switches (top right), whichever is lower; the rest go
// left. Each half goes through xrCallouts with B stretched off-screen on the other side, so it lands in its own column.
function callouts2(items, B){
  const svg = document.getElementById('fig'), M = svg.getScreenCTM(), vs = ['.vset', '#stats'].map(q => document.querySelector(q)).filter(Boolean);
  if ((window.LBL_U && LBL_U()) || !M || !vs.length) return xrCallouts(items, B);
  const vb = svg.viewBox.baseVal, k = INK_K, fs = 8.6*k;
  const xs = []; for (const x of [B[0], B[1]]) for (const y of [B[2], B[3]]) xs.push(P(x, y, 0)[0]);
  const wMax = Math.max(...items.map(it => it.text.length))*fs*.62 + fs*1.5 + 12*k;
  if (vb.x + vb.width - Math.max(...xs) < wMax) return xrCallouts(items, B);
  const yMin = new DOMPoint(0, Math.max(...vs.map(e => e.getBoundingClientRect().bottom)) + 10).matrixTransform(M.inverse()).y;
  const R = items.map(it => ({ it, p: P(...it.at) })).filter(o => o.p[1] > yMin).sort((a, b) => b.p[0] - a.p[0]).slice(0, Math.floor(items.length/2)).map(o => o.it);
  // stretch the box along x and y towards one side of the screen only (so the other side's column stays put)
  const O = P(0, 0, 0), ex = Math.sign(P(1, 0, 0)[0] - O[0]), ey = Math.sign(P(0, 1, 0)[0] - O[0]);
  const grow = side => [B[0] - (ex*side < 0 ? 5e3 : 0), B[1] + (ex*side > 0 ? 5e3 : 0), B[2] - (ey*side < 0 ? 5e3 : 0), B[3] + (ey*side > 0 ? 5e3 : 0), B[4], B[5]];
  // xrCallouts packs its right column up from the top of the frame, under the stats; slide those pills (not their dots) down
  let rs = xrCallouts(R, grow(-1));
  const pys = [...rs.matchAll(/<rect x="[^"]*" y="([^"]*)"/g)].map(a => +a[1]), dy = pys.length ? Math.max(0, yMin - Math.min(...pys)) : 0;
  if (dy) rs = rs.replace(/L([-\d.]+) ([-\d.]+)L([-\d.]+) ([-\d.]+)"/g, (_, a, b, c, d) => `L${a} ${f(+b + dy)}L${c} ${f(+d + dy)}"`)
    .replace(/(<(?:rect|text) x="[^"]*" y=")([^"]*)"/g, (_, a, b) => `${a}${f(+b + dy)}"`);
  return xrCallouts(items.filter(it => !R.includes(it)), grow(1)) + rs;
}
function scene(st, m){
  const a = OPEN*ease(st.lid)*Math.PI/180; LC = Math.cos(a); LS = Math.sin(a);
  const k = ease(st.xr || 0), BTP = boardTop(0, 0, BRD[0], BRD[1], BT, 8);
  let s = board(0, 0, BRD[0], BRD[1], BT, 8, WOOD);
  // one shadow for the laptop (base + lid), one for the brick
  // the lid's shadow is kept short (its height squashed) so it stays a slim band joined to the base
  const lidPts = []; for (const y of [1, LD - 1]) for (const sv of [0, LIDL]) for (const t of [-LIDT, LIDT]){ const p = LPt(y, sv, t); lidPts.push([p[0], p[1], Z1 + (p[2] - Z1)*.3]); }
  s += clipTo(BTP, castShadow([...BA, ...BTOPR], BT) + castShadow([...BTOPR, ...lidPts], BT) + castShadow([...on(PZ(BT), rrUV(BRK[0], BRK[2], BRK[1], BRK[3], 6, 3)), ...on(PZ(BRK[4]), rrUV(BRK[0], BRK[2], BRK[1], BRK[3], 6, 3))], BT));
  // rubber feet, under the base
  for (const [x, y] of FEET) s += cyl(x, y, BT, Z0 + .6, 6, DARK, toneI, .8, 16);
  // the base (ghosted in see-through, with the insides over it), then the lid, which always sits above it
  let base = baseSvg(st, m);
  if (k > 0){ base = xrGhostRings(base, '', k, BA, BTOPR, m) + `<g opacity="${f(k)}">${baseMech(st)}</g>`; }
  const lap = base + lidSvg(st, m, k);
  const lidTop = Math.max(HZ + LIDT, HZ + LIDL*LS + LIDT);
  s += byDepth([
    { box: [[XB - 75, YR, Z0], [XF, YL, lidTop]], svg: lap },
    { box: [[XB - 40, YR + 70, Z0 + 3], [XB - 1, YR + 122, Z0 + 16]], svg: airSvg(st) },
    ...chargerParts(st) ]);
  // labels: the parts inside in see-through, the surface parts otherwise
  const B = [XB, XF, YR, YL, 0, Z1];
  if (k > .6) s += callouts2(MECH_LABELS, B);
  else {
    const it = [
      { at: [(PWR.x0 + PWR.x1)/2, (PWR.y0 + PWR.y1)/2, Z1], text: 'POWER BUTTON', on: st.pwrT > 0 },
      { at: [XB + 95, YR + 150, Z1], text: 'KEYBOARD', on: false },
      { at: [XB + 180, YR + 120, Z1], text: 'TRACKPAD', on: false },
      { at: [XB + 7, YR + 60, HZ + LIDT*LC], text: 'HINGE', on: !!st.lidMoving },
      { at: [(BRK[0] + BRK[1])/2, BRK[2] + 8, BRK[4]], text: 'CHARGER', on: st.plug >= 1 },
      ...(facing([0,1,0]) ? [{ at: [XB + PORTS[0], YL, PZc], text: 'USB-C PORT', on: st.plug >= 1 }, { at: [XB + 84, YL, PZc], text: 'CHARGE LIGHT', on: st.plug >= 1 }] : []),
      ...(facing([-1,0,0]) ? [{ at: [XB, YR + 95, Z0 + 7], text: 'EXHAUST VENT', on: st.rpm > 2200 }] : []),
      ...(facing([LS, 0, -LC]) && st.lid > .3 ? [{ at: LPt(80, 110, -LIDT), text: 'DISPLAY', on: st.pw !== 'off' }, { at: LPt(LD/2, 206, -LIDT), text: 'WEBCAM', on: false }] : []) ];
    s += xrCallouts(it, B);
  }
  return s;
}

/* ---------- behaviour: one state object, one clock ---------- */
let ui, loopOn = false;
const cpuW = st => st.pw === 'off' ? 0 : st.pw === 'sleep' ? .4 : st.pw === 'boot' ? 14 : st.load ? 45 : 5;
const fanTarget = st => (st.pw === 'boot' && st.bt > .6 && st.bt < 1.6) ? 3000 : st.temp < 46 ? 0 : Math.min(5800, 1600 + (st.temp - 46)/44*4200);
function stepSim(st, dt){
  st.clock += dt;
  if (st.pwrT > 0) st.pwrT = Math.max(0, st.pwrT - dt);
  if (st.chime >= 0) st.chime = st.chime + dt > 1.2 ? -1 : st.chime + dt;
  // lid on its hinges, plug along its path
  const lg = st.lidT - st.lid; st.lid += Math.sign(lg)*Math.min(Math.abs(lg), dt/.9); st.lidMoving = Math.abs(lg) > 1e-4;
  const pg = st.plugT - st.plug; st.plug += Math.sign(pg)*Math.min(Math.abs(pg), dt/.8);
  // boot sequence
  if (st.pw === 'boot'){ st.bt += dt; if (st.bt >= 3.4){ st.pw = 'on'; st.chime = 0; } }
  // energy: charger in -> battery charges; otherwise the battery feeds the laptop
  const ac = st.plug >= 1, draw = cpuW(st) + (st.pw === 'on' || st.pw === 'boot' ? 5 : st.pw === 'sleep' ? .3 : 0);
  if (ac){ if (st.bat < 100) st.bat = Math.min(100, st.bat + dt*(st.bat < 80 ? 2.4 : .9)); }
  else if (draw > 0){ st.bat = Math.max(0, st.bat - draw*dt*.012);
    if (st.bat <= 0 && st.pw !== 'off'){ st.pw = 'off'; st.load = false; ui.flash('Battery flat - plug in the charger', 2400); } }
  // heat: the die heats toward a steady temperature set by its power; the fan follows the temperature
  const tT = AMB + cpuW(st)*1.35; st.temp += (tT - st.temp)*Math.min(1, dt/1.6); if (Math.abs(tT - st.temp) < .05) st.temp = tT;
  const rT = fanTarget(st); st.rpm += (rT - st.rpm)*Math.min(1, dt/.7); if (Math.abs(rT - st.rpm) < 5) st.rpm = rT;
  st.fanA += st.rpm/60*2*Math.PI*dt*.12;
  if (st.load && st.pw === 'on'){ st.prog += dt/6; if (st.prog >= 1){ st.prog -= 1; } st.frame += dt*3; }
  return st.pw === 'boot' || st.pw === 'on' || st.lidMoving || Math.abs(pg) > 1e-4 || st.rpm > 0 || st.temp !== tT || (ac && st.bat < 100) || st.chime >= 0 || st.pwrT > 0;
}
function kick(){
  if (loopOn) return; loopOn = true;
  ui.animate(dt => { const busy = stepSim(ui.st, dt); if (!busy) loopOn = false; return busy; });
}
function toggleLid(st){
  st.lidT = st.lidT > .5 ? 0 : 1;
  if (st.lidT === 0 && (st.pw === 'on' || st.pw === 'boot')){ st.pw = st.pw === 'boot' ? 'off' : 'sleep'; st.load = false; ui.flash('Lid closed - it goes to sleep'); }
  else if (st.lidT === 1 && st.pw === 'sleep'){ st.pw = 'on'; ui.flash('Lid open - it wakes up'); }
  kick();
}
function power(st){
  st.pwrT = .25;
  if (st.pw === 'off'){
    if (st.bat <= 0 && st.plug < 1){ kick(); return ui.flash('Battery flat - plug in the charger'); }
    if (st.lidT < .5) st.lidT = 1;                 // open it first: the power key is under the lid
    st.pw = 'boot'; st.bt = 0;
  } else if (st.pw === 'sleep'){ st.pw = 'on'; if (st.lidT < .5) st.lidT = 1; }
  else { st.pw = 'off'; st.load = false; ui.flash('Shut down'); }
  kick();
}
function charger(st){ st.plugT = st.plugT > .5 ? 0 : 1; if (!st.plugT) ui.flash('Charger unplugged - running on battery'); kick(); }
function load(st){
  if (st.pw === 'off') return ui.flash('Press power first');
  if (st.pw === 'boot') return ui.flash('Still booting - one moment');
  if (st.pw === 'sleep') return ui.flash('Open the lid to wake it first');
  st.load = !st.load; if (!st.load) ui.flash('Load stopped - it cools down'); kick();
}

ui = mountFigure({
  fig:'31', turn:'full', title:'Laptop',
  size:[BRD[0] + 70, BRD[1], HZ + LIDL + 6], palette:'cobalt',
  state:{ lid:0, lidT:0, pw:'off', bt:0, plug:0, plugT:0, bat:34, temp:AMB, rpm:0, fanA:0, load:false, prog:0, frame:1, pwrT:0, chime:-1, clock:0, lidMoving:false },
  scene,
  stats: st => [
    { label:'Battery', value: `${Math.floor(st.bat)}%${st.plug >= 1 && st.bat < 100 ? ' +' : ''}`, small:true },
    { label:'CPU', value: `${Math.round(st.temp)} °C`, small:true },
    { label:'Fan', value: `${Math.round(st.rpm/10)*10} rpm`, small:true } ],
  buttons:[
    { label:'Open / close lid', onClick:(st) => toggleLid(st) },
    { label:'Press power', onClick:(st) => power(st) },
    { label:'Plug / unplug charger', onClick:(st) => charger(st) },
    { label:'Heavy load', onClick:(st) => load(st) },
  ],
  acts:{ power:(st) => power(st), plug:(st) => charger(st), fan:(st) => load(st) },
  params:(st, q) => {
    if (q.has('lid')) st.lid = st.lidT = +q.get('lid');
    if (q.get('plug') === '1') st.plug = st.plugT = 1;
    if (q.has('plugp')) st.plug = st.plugT = +q.get('plugp');
    if (q.get('on') === '1'){ st.pw = 'on'; st.lid = st.lidT = q.has('lid') ? st.lid : 1; }
    if (q.has('bt')){ st.pw = 'boot'; st.bt = +q.get('bt'); st.lid = st.lidT = 1; }
    if (q.get('load') === '1'){ st.pw = 'on'; st.load = true; st.lid = st.lidT = 1; st.temp = 88; st.rpm = 5400; st.prog = .64; st.frame = 214; }
    for (const k of ['bat', 'temp', 'rpm']) if (q.has(k)) st[k] = +q.get(k);
  },
});
xrMount(() => ui, () => '');
if (ui.st.pw !== 'off' || ui.st.rpm > 0) kick();
</script></body></html>
