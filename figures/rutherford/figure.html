<!doctype html>
<html lang="en" data-errors=""><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rutherford's gold foil</title></head><body>
<script src="core.js"></script>
<script>
/* Truth first.
   Radium and its decay products emit alphas. Lead absorbs those outside a narrow aperture.
   A shutter admits a collimated beam into an evacuated chamber and onto a thin gold foil.
   Most pass with little deviation. Coulomb repulsion near a dense positive nucleus scatters
   some through a large angle, occasionally backwards. Each alpha stops in the ZnS coating
   and produces a faint flash. A microscope on a radial arm observes a small angular sector.
   The source never moves to the foil. Only the microscope and its supporting arm rotate.
   Teaching adaptations. A continuous ring screen and clear lid expose the ray paths.
   Each burst has 200 illustrative events, with large deflections deliberately oversampled.
   The atom detail is a magnified overlay, not hardware. Nuclei and paths are enlarged;
   the electron clouds have no hard boundary and empty space is not an apparatus component.
   The plum-pudding overlay predicts weak scattering. It does not replace the observed rays.
   Sources read on 2026-10-24.
   https://chemed.chem.purdue.edu/genchem/history/rutherford
   https://micro.magnet.fsu.edu/electromag/java/rutherford/index.html
   https://galileo.phys.virginia.edu/classes/252/Rutherford_Scattering/Rutherford_Scattering.html
   Parts and attachments.
   STRUCTURE. Board on four feet. Chamber floor on board, wall and lid on floor, seal in lid rim.
   SOURCE. Lead base and four shielding walls on floor, lid on walls. Source capsule in holder
   on lead base. Aperture and collimator in outlet wall. Sliding shutter and tab on outlet.
   TARGET. Foil post on pedestal, frame on post, foil between upper and lower frame clamps.
   DETECTOR. Glass screen backing on chamber floor, ZnS coating on inner face, upper and lower rims.
   OPTICS. Pivot on board under target, radial arm on pivot, saddle on arm, barrel on saddle,
   objective at inward end, focusing sleeve and eyepiece at outer end, lenses in both ends.
   VACUUM. Port in wall, valve on port, hose connected to valve and continuing off the board.
   ANGLE. Graduated scale on chamber rim, index fixed to the swinging arm.
*/
const rfGold = matOf('#e9b840'), rfBrass = matOf('#c29b63'), rfLead = matOf('#7b8b9c');
const rfGreen = matOf('#b9d7a0'), rfPaper = matOf('#f6e7c9');
const rfCenter = [76,66,23], rfRadius = 40;
const rfState = {angle:0,target:0,prediction:false,elapsed:0,emitted:0,total:0,straight:0,deflected:0,back:0,counts:Array(12).fill(0),rays:[],running:false,moving:false};
const rfAt = (angle,r,z=23) => [76+r*Math.cos(angle*Math.PI/180),66+r*Math.sin(angle*Math.PI/180),z];
const rfBounds = (pts,pad=0) => [0,1].map(j=>[0,1,2].map(k=>(j?Math.max:Math.min)(...pts.map(p=>p[k]))+(j?pad:-pad)));
const rfAngle = n => n===199 ? 150 : n===179 ? 90 : n===159 ? 45 : n%19===0 ? 8 : (n%5-2)*.5;
const rfSector = angle => Math.round(((angle%360)+360)%360/30)%12;
const rfPath = (ray,t) => t<.42 ? [49+27*t/.42,66,23] : rfAt(ray.angle,rfRadius*(t-.42)/.58);
function rfUpdate(st,dt){
  st.elapsed+=dt;
  const goal=Math.min(200,Math.floor(st.elapsed/3.8*200));
  while(st.emitted<goal){
    const angle=rfAngle(st.emitted++);
    st.rays.push({angle,age:0}); st.total++;
    if(angle>90) st.back++; else if(Math.abs(angle)>2) st.deflected++; else st.straight++;
  }
  for(const ray of st.rays){
    const before=ray.age; ray.age+=dt;
    if(before<.85 && ray.age>=.85) st.counts[rfSector(ray.angle)]++;
  }
  st.rays=st.rays.filter(ray=>ray.age<1.2);
  return st.emitted<200 || st.rays.length>0;
}
function rfFire(st,ui){
  if(st.running) return ui.flash('The current burst is still arriving');
  st.elapsed=0; st.emitted=0; st.running=true;
  ui.animate(dt=>{st.running=rfUpdate(st,dt);return st.running;});
}
function rfSwing(st,ui){
  st.target=(st.target+30)%360;
  if(st.moving) return;
  st.moving=true;
  ui.animate(dt=>{const gap=(st.target-st.angle+360)%360,step=Math.min(gap,dt*100);
    st.angle=(st.angle+step)%360;
    if(step>=gap){st.angle=st.target;st.moving=false;return false;}return true;});
}
function rfReset(st,ui){
  if(st.running) return ui.flash('Wait for the burst before clearing the counts');
  st.total=st.straight=st.deflected=st.back=0;st.counts.fill(0);
}
function rfScene(st,m){
  const parts=[],labels=[],k=ease(st.xr||0), put=(pts,svg,label,anchor,on=false)=>{
    parts.push({box:rfBounds(pts,.05),svg});
    if(label) labels.push({at:anchor||avg(pts),text:label,on});
  };
  const bx=(b,mat,label,anchor)=>put([b.slice(0,3),b.slice(3)],box(...b,mat,toneI,.8),label,anchor);
  const rd=(a,b,r,mat,label,on=false)=>put([a,b],rod(a,b,r,mat,toneI,.7),label,avg([a,b]),on);
  const vc=(x,y,z0,z1,r,mat,label)=>put([[x-r,y-r,z0],[x+r,y+r,z1]],cyl(x,y,z0,z1,r,mat,toneI,.8),label,[x,y,z1]);
  const ring=(r0,r1,z0,z1,mat,label)=>{
    for(let i=0;i<72;i++){
      const a=i*5,b=(i+1)*5,pts=[rfAt(a,r0,z0),rfAt(b,r0,z0),rfAt(b,r1,z0),rfAt(a,r1,z0)],top=pts.map(p=>[p[0],p[1],z1]);
      const mid=(a+b)/2,normal=[Math.cos(mid*Math.PI/180),Math.sin(mid*Math.PI/180),0];
      let svg=shape(top,toneI([0,0,1],mat),.25);
      if(vis(normal)) svg+=shape([pts[3],pts[2],top[2],top[3]],toneI(normal,mat),.25);
      if(vis(normal.map(v=>-v))) svg+=shape([pts[0],pts[1],top[1],top[0]],toneI(normal.map(v=>-v),mat),.25);
      put([...pts,...top],svg);
    }
    if(label) labels.push({at:rfAt(60,(r0+r1)/2,z1),text:label,on:false});
  };
  let s=board(0,0,154,134,4,6,WOOD);
  s+=castShadow([[20,18,4],[128,18,4],[128,114,4],[20,114,4],[20,66,34],[128,66,34]],4,boardTop(0,0,154,134,4,6));
  for(const [x,y] of [[8,8],[146,8],[8,126],[146,126]]) vc(x,y,0,4,2.8,DARK);
  vc(76,66,4,7,48,m,'CHAMBER FLOOR');
  ring(46.7,48,7,17,m,'VACUUM CHAMBER WALL');
  const opaque=parts.splice(0);
  ring(46.7,48,17,29,CLEAR,'ANNULAR VIEWING WINDOW');
  for(const p of parts) p.svg=`<g opacity=".18">${p.svg}</g>`;
  parts.unshift(...opaque);
  ring(46.7,48,29,33,m);
  ring(46,48.5,33,34,DARK,'LID SEAL');
  const shell=parts.splice(0);
  const floor=shell.filter(p=>p.box[1][2]<8),walls=shell.filter(p=>p.box[1][2]>=8);
  const screenStart=parts.length;
  ring(40,41.7,8,30,CLEAR,'SCREEN BACKING');
  for(const p of parts.slice(screenStart)) p.svg=`<g opacity=".24">${p.svg}</g>`;
  ring(39.7,40,17.5,28.5,rfGreen,'ZINC SULPHIDE COATING');
  ring(39.5,42,8,10,METAL,'LOWER SCREEN RIM');
  ring(39.5,42,29,31,METAL,'UPPER SCREEN RIM');
  // The channel is open through the outlet wall, so the beam never crosses solid lead.
  bx([40,58,8,60,74,13],rfLead,'LEAD BASE');
  bx([40,58,13,43,74,31],rfLead,'REAR SHIELD');
  bx([43,58,13,60,61,31],rfLead,'SIDE SHIELD');
  bx([43,71,13,60,74,31],rfLead);
  bx([57,61,13,60,71,21.6],rfLead,'APERTURE WALL');
  bx([57,61,24.4,60,71,31],rfLead);
  bx([57,61,21.6,60,64.7,24.4],rfLead);
  bx([57,67.3,21.6,60,71,24.4],rfLead);
  bx([40,58,31,60,74,33],rfLead,'SOURCE LID');
  const cover=parts.splice(0);
  bx([44,63,13,49,69,20],METAL,'SOURCE HOLDER');
  rd([46,66,20],[50,66,23],1.5,METAL,'SOURCE CAPSULE');
  vc(49,66,22,24,.7,matOf('#e28363'),'RADIUM SOURCE');
  bx([61,62,19,63,64.7,27],DARK,'COLLIMATING SLIT',[62,64.7,23]);
  bx([61,67.3,19,63,70,27],DARK);
  const shutterZ=st.running?27:21;
  bx([60,64.5,shutterZ,60.8,67.5,shutterZ+5],METAL,'SHUTTER',[60.8,66,shutterZ+2]);
  bx([60,67.5,shutterZ+3,61,72,shutterZ+5],rfBrass,'SHUTTER TAB');
  vc(76,66,7,9,7,METAL,'FOIL PEDESTAL');
  vc(76,66,9,14,1.3,METAL,'FOIL SUPPORT POST');
  bx([75.5,58,13,76.5,60,32],rfBrass,'FOIL FRAME');
  bx([75.5,72,13,76.5,74,32],rfBrass);
  bx([75,58,13,77,74,15],METAL,'LOWER FOIL CLAMP');
  bx([75,58,30,77,74,32],METAL,'UPPER FOIL CLAMP');
  bx([75.9,60,15,76.1,72,30],rfGold,'GOLD FOIL',[76.1,70,23]);
  const a=st.angle,armA=rfAt(a,0,5.6),armB=rfAt(a,61,5.6),scopeA=rfAt(a,51,23),scopeB=rfAt(a,60,23),saddle=rfAt(a,51,6);
  vc(76,66,4,6,4,METAL,'ARM PIVOT');
  rd(armA,armB,1.1,rfBrass,'SWINGING ARM',st.moving);
  vc(saddle[0],saddle[1],6,20,1.2,METAL,'MICROSCOPE STAND');
  rd(rfAt(a,49,20),rfAt(a,54,20),2,METAL,'BARREL SADDLE');
  rd(scopeA,scopeB,3.1,DARK,'MICROSCOPE BARREL');
  rd(rfAt(a,49),rfAt(a,52),2.1,rfBrass,'OBJECTIVE MOUNT');
  rd(rfAt(a,48.8),rfAt(a,49),1.7,CLEAR,'OBJECTIVE LENS');
  rd(rfAt(a,54),rfAt(a,58),3.3,rfBrass,'FOCUSING SLEEVE');
  rd(rfAt(a,60),rfAt(a,63),2.3,DARK,'EYEPIECE');
  rd(rfAt(a,63),rfAt(a,63.2),1.6,CLEAR,'EYEPIECE LENS');
  const indexA=rfAt(a,43,33.5),indexB=rfAt(a,46,33.5);
  rd(rfAt(a,51,20),indexA,.4,rfBrass);
  rd(indexA,indexB,.5,matOf('#db6349'),'ANGLE INDEX');
  for(let i=0;i<36;i++){
    const q=rfAt(i*10,45,34.3),p=rfAt(i*10,i%3?46:47,34.3);
    put([q,p],line([q,p],.5));
  }
  labels.push({at:rfAt(300,45,34.3),text:'ANGLE SCALE',on:st.moving});
  rd([76,18,14],[76,12,14],2,METAL,'VACUUM PORT');
  rd([76,12,14],[76,8,14],2.7,rfBrass,'VACUUM VALVE');
  rd([76,10,14],[76,10,19],.8,METAL);
  rd([73,10,19],[79,10,19],.8,DARK);
  const hose=[[76,8,14],[76,4,12],[70,3,6],[55,3,6],[40,3,6]];
  for(let i=0;i<hose.length-1;i++) rd(hose[i],hose[i+1],1.2,DARK,i===0?'VACUUM HOSE':null);
  let lid=fill(pd(on(PZ(34.1),ellUV(76,66,46,46,72))),'#cfe9f0','opacity=".12"')+ink(pd(on(PZ(34.1),ellUV(76,66,46,46,72))),.7);
  labels.push({at:rfAt(220,30,34.1),text:'CLEAR TEACHING LID',on:false});
  for(const ray of st.rays){
    const t=Math.min(1,ray.age/.85),p=rfPath(ray,t),old=rfPath(ray,Math.max(0,t-.08));
    let svg=`<path d="${pd([old,p],false)}" fill="none" stroke="#d87739" stroke-width="1.2"/>`;
    const q=P(...p);
    if(ray.age<.85) svg+=`<circle cx="${f(q[0])}" cy="${f(q[1])}" r="1.1" fill="#ef9b43"/>`;
    else{const flash=P(...rfAt(ray.angle,39.6));svg=`<circle cx="${f(flash[0])}" cy="${f(flash[1])}" r="2.2" fill="#fffac4" opacity="${f(1-(ray.age-.85)/.35)}"/>`;}
    put([old,p],svg);
  }
  if(st.prediction){
    for(const off of [-1.2,0,1.2]) put([[63,66,23],rfAt(off,39.6)],`<path d="${pd([[63,66,23],rfCenter,rfAt(off,39.6)],false)}" fill="none" stroke="#6e75bd" stroke-width="1.3" stroke-dasharray="2 1.5"/>`);
    labels.push({at:rfAt(0,28),text:'PLUM-PUDDING PREDICTION',on:true});
  }
  const ghost=p=>({...p,svg:k?`<g opacity="${f(1-.8*k)}">${p.svg}</g>`:p.svg});
  const below=parts.filter(p=>p.box[1][2]<7),above=parts.filter(p=>p.box[1][2]>=7);
  s+=byDepth(below)+byDepth(floor)+byDepth([...walls.map(ghost),...cover.map(ghost),...above])+`<g opacity="${f(1-k)}">${lid}</g>`;
  if(k>0){
    const atoms=[];
    for(const y of [48,66,84]) for(const z of [24,42,60]){
      const pos=[76,y,z],q=P(...pos);
      atoms.push({at:pos,box:[[68,y-8,z-8],[84,y+8,z+8]],svg:`<circle cx="${f(q[0])}" cy="${f(q[1])}" r="9" fill="#e9b840" fill-opacity=".08" stroke="#c09c5c" stroke-width=".55" stroke-dasharray="1 1.5"/><circle cx="${f(q[0])}" cy="${f(q[1])}" r=".6" fill="#d76544" stroke="${INK}" stroke-width=".3"/>`});
    }
    const detail=[[[55,65,42],[96,65,42]],[[55,79,42],[74,79,42],[78,85,42],[85,100,42]],[[55,48,60],[73,48,60],[70,47,60],[56,47,60]]];
    const rays=detail.map(pts=>`<path d="${pd(pts,false)}" fill="none" stroke="#d87739" stroke-width=".9"/>`).join('');
    s+=`<g opacity="${f(k)}">${byDepth(atoms)}${rays}</g>`;
    labels.push({at:[76,66,60],text:'NUCLEUS (ENLARGED)',on:st.running},{at:[76,84,42],text:'ELECTRON CLOUD (ENLARGED)',on:false});
    if(k>.6){
      const fineDetail=new Set(['SOURCE LID','REAR SHIELD','SIDE SHIELD','LEAD BASE','APERTURE WALL','LOWER SCREEN RIM','UPPER SCREEN RIM','BARREL SADDLE','OBJECTIVE MOUNT','EYEPIECE LENS']);
      s+=xrCallouts(labels.filter(p=>!fineDetail.has(p.text)),[58,94,48,84,4,60]);
    }
  }else if(st.prediction) s+=xrCallouts(labels.filter(p=>p.text==='PLUM-PUDDING PREDICTION'),[20,139,8,128,4,35]);
  return s;
}
const rfUI=mountFigure({fig:'RF',title:"Rutherford's gold foil",turn:'full',size:[154,134,70],palette:'cobalt',state:rfState,scene:rfScene,
  stats:st=>[{label:'Demo alphas',value:String(st.total)},{label:'Microscope angle',value:Math.round(st.angle)+' deg',small:true},{label:'Flashes in sector',value:String(st.counts[rfSector(st.angle)]),small:true},{label:'Backscattered',value:String(st.back),small:true}],
  buttons:[{label:'Fire alphas',onClick:rfFire},{label:'Swing microscope',onClick:rfSwing},{label:'Plum-pudding prediction',onClick:(st)=>{st.prediction=!st.prediction;}},{label:'Reset counts',onClick:rfReset}],
  params:(st,q)=>{const angle=Number(q.get('angle'));if(Number.isFinite(angle))st.angle=st.target=((angle%360)+360)%360;st.prediction=q.get('prediction')==='1';}
});
xrMount(()=>rfUI,()=> '');
const rfRender=rfUI.render,rfViewHeight=document.getElementById('fig').viewBox.baseVal.height;
rfUI.render=()=>{
  rfRender();
  const svg=document.getElementById('fig');
  const bottom=Math.max(0,...[...svg.querySelectorAll('.tag rect')].map(r=>Number(r.getAttribute('y'))+Number(r.getAttribute('height'))));
  svg.viewBox.baseVal.height=innerWidth<=560&&!document.documentElement.classList.contains('nolabels')?Math.max(rfViewHeight,bottom+6):rfViewHeight;
};
rfUI.render();
addEventListener('resize',()=>requestAnimationFrame(()=>rfUI.render()));
</script></body></html>
