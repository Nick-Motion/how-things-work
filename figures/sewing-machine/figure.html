<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sewing machine</title></head><body>
<script src="core.js"></script>
<script>
/* Sewing machine: a domestic lockstitch machine on the table, with its foot pedal on the floor beside it.
   Units: 1 = 5 mm (machine 40 cm wide, 27 cm tall). x = depth (the sewer sits at +x; the arm's front face is x = 28,
   the bed's x = 36), y = width (+y = the sewer's left: head and needle at high y, handwheel at low y), z = up.

   HOW IT REALLY WORKS (each button is one real step)
   1 Thread it: with the foot up (that opens the tension discs) the thread runs from the spool on its pin, forward to
     the top thread guide, down between the tension discs, under the check spring, up through the eye of the take-up
     lever, down to the guide at the foot of the head, the guide on the needle bar and through the needle's eye.
     The bobbin, wound beforehand on the bobbin winder, already sits in its case inside the rotary hook.
   2 Lower the foot: the lifter at the back of the head lets the presser spring push the foot down onto the cloth
     (and closes the tension discs on the thread).
   3 Press the pedal: the speed control in the pedal feeds the motor; the motor pulley drives the belt, the belt turns
     the pulley on the upper shaft (and the handwheel with it). Every turn of the upper shaft:
       . crank + needle-bar link drive the needle bar down and up once; the crank pin also swings the take-up lever;
       . the bevel gears turn the vertical shaft and the lower shaft once; the hook gears (2:1) spin the hook twice;
       . the lift cam raises the feed dogs through the needle plate while the needle is out of the cloth, the feed
         eccentric + rock shaft push them back one stitch length (set by the stitch dial through the regulator),
         then they drop and come forward again.
     The lockstitch: the needle carries the top thread down through the cloth; as it starts to rise it leaves a loop,
     the hook point catches the loop and carries it round the bobbin case, so the bobbin thread ends up inside it;
     the take-up lever pulls the loop back up and the two threads lock in the middle of the cloth.
   PARTS (each fixed to the next one)
     case     bed . pillar . arm . head . face plate . needle plate . handwheel . stitch dial
     drive    motor (on the pillar's back wall) . motor pulley . belt . shaft pulley . upper shaft + bushings
     needle   crank . crank pin . needle-bar link . needle bar + bushings . needle clamp . needle
     thread   spool pin . spool . top guide . tension discs + knob . check spring . take-up lever . lower guide .
              bobbin winder
     presser  presser bar + bushing . presser spring . lifter bracket . foot lifter . presser foot
     below    bevel gears (top, bottom) . vertical shaft . lower shaft + bearings . hook gears . hook shaft + bearing .
              rotary hook . bobbin case . bobbin . lift cam . feed eccentric . feed rod . feed rock shaft . fork .
              feed bar . feed dogs . stitch regulator + its rod from the dial
     power    socket on the bed's right end . motor wires . light wire . sewing light . pedal cord .
              foot pedal with its speed control */

const TAU = Math.PI * 2;
const NX = 22, NY = 85.5, BZ = 10, PT = 10.3, FT = 10.9;           // needle line (x, y); bed top, needle-plate top, cloth top
const UX0 = 8, UX1 = 28, BX1 = 36;                                    // upper body depth; bed front
const SHX = 18.4, SHZ = 47, LSZ = 4.5, HKX = 22, HKR = 3.1, VSY = 33.6;   // shafts (x, z), hook, vertical shaft y
const FAB0 = 10, FAB1 = 42, FY0 = 64, FY1 = 96;                       // the cloth at the start (x range), its width (y)
const LENS = [{ label:'2 mm', u:.4 }, { label:'3 mm', u:.6 }, { label:'4 mm', u:.8 }];
const OMEGA = 1.3 * TAU, PEN = 1.25, WIN = 1.1;                       // slowed right down; needle enters the cloth at PEN
const THREAD = '#d23a48', THM = matOf('#d23a48'), CREAMM = { l:'#fff4d6', m:'#e6dcbd', d:'#bfb390' };
const FABC = '#f6e6bf', FABM = matOf('#f6e6bf'), GREYM = matOf('#8a9196'), BRASS = matOf('#e2c06a');
const HOOKM = matOf('#9aa3a8'), RUBBER = '#3a3632', RECESS = '#2b2523', HWM = matOf('#f1ece0');
const PEDM = { l:'#6b645c', m:'#4f4943', d:'#2f2b27' };

/* ---------- small helpers ---------- */
const f2 = v => v.toFixed(2);
const smBoxOf = pts => [[0,1,2].map(i => Math.min(...pts.map(p => p[i]))), [0,1,2].map(i => Math.max(...pts.map(p => p[i])))];
// rounds the corners of a closed (u,v) polygon; r = radius per corner (0 = sharp); works for inside corners too
function smRound(pts, rad, n = 4){
  const o = [];
  pts.forEach((p, i) => { const r = rad[i]; if (!r){ o.push(p); return; }
    const a = pts[(i + pts.length - 1) % pts.length], b = pts[(i + 1) % pts.length];
    const da = Math.hypot(a[0]-p[0], a[1]-p[1]), db = Math.hypot(b[0]-p[0], b[1]-p[1]);
    const p0 = [p[0] + (a[0]-p[0])*r/da, p[1] + (a[1]-p[1])*r/da], p1 = [p[0] + (b[0]-p[0])*r/db, p[1] + (b[1]-p[1])*r/db];
    for (let k = 0; k <= n; k++){ const t = k/n; o.push([0, 1].map(j => (1-t)*(1-t)*p0[j] + 2*(1-t)*t*p[j] + t*t*p1[j])); } });
  return o;
}
// a rod as a sortable part: box widened only across its axis
const smRodP = (a, b, r, m, w = .6, r1 = r, sh = toneI) => { const d = norm(sub(b, a)), e = Math.max(r, r1), bx = smBoxOf([a, b]), ex = d.map(v => e*Math.sqrt(Math.max(0, 1 - v*v)));
  return { box: [bx[0].map((v, i) => v - ex[i]), bx[1].map((v, i) => v + ex[i])], svg: rod(a, b, r, m, sh, w, r1) }; };
const smBoxP = (x0, y0, z0, x1, y1, z1, m, w = .6, sh = toneI) => ({ box: [[x0, y0, z0], [x1, y1, z1]], svg: box(x0, y0, z0, x1, y1, z1, m, sh, w) });
// A comparison sort can violate occlusion when disjoint parts impose contradictory axis orders.
function smDepth(parts){
  const nodes = parts.filter(Boolean).map(p => {
    const b = p.box, q = [];
    for (const x of [b[0][0], b[1][0]]) for (const y of [b[0][1], b[1][1]]) for (const z of [b[0][2], b[1][2]]) q.push(P(x,y,z));
    return { p, depth:depthOf(boxMid(b)), rect:[Math.min(...q.map(v => v[0])), Math.min(...q.map(v => v[1])), Math.max(...q.map(v => v[0])), Math.max(...q.map(v => v[1]))], next:[], incoming:0 };
  });
  for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++){
    const a = nodes[i], b = nodes[j], r = a.rect, t = b.rect;
    if (r[2] < t[0] || t[2] < r[0] || r[3] < t[1] || t[3] < r[1]) continue;
    const order = sepOrder(a.p, b.p);
    if (!order) continue;
    const [far, near] = order < 0 ? [a,b] : [b,a];
    far.next.push(near); near.incoming++;
  }
  let svg = '';
  const remaining = new Set(nodes);
  while (remaining.size){
    const ready = [...remaining].filter(n => n.incoming === 0);
    const node = (ready.length ? ready : [...remaining]).reduce((a,b) => a.depth < b.depth ? a : b);
    remaining.delete(node); svg += node.p.svg;
    for (const near of node.next) near.incoming--;
  }
  return svg;
}
// a thread, wire, cord or thin shaft: a stroked line cut into short pieces so it sorts with the solids (widths in model units)
function smWire(pts, col, w, Lmax = 6){
  const out = [];
  for (let i = 0; i < pts.length - 1; i++){
    const a = pts[i], b = pts[i + 1], n = Math.max(1, Math.ceil(Math.hypot(...sub(b, a)) / Lmax));
    for (let k = 0; k < n; k++){
      const p = a.map((v, j) => v + (b[j] - v)*k/n), q = a.map((v, j) => v + (b[j] - v)*(k + 1)/n), d = pd([p, q], false);
      const cap = (k === 0 || k === n - 1) ? 'round' : 'butt', bx = smBoxOf([p, q]);
      out.push({ box: [bx[0].map(v => v - w/2), bx[1].map(v => v + w/2)], svg: `<path d="${d}" fill="none" stroke="${INK}" style="stroke-width:${f2(w + .45)}" stroke-linecap="${cap}"/><path d="${d}" fill="none" stroke="${col}" style="stroke-width:${f2(w)}" stroke-linecap="${cap}"/>` });
    }
  }
  return out;
}
// a polyline cut to its first `t` share of length
function smCut(pts, t){
  const seg = pts.slice(1).map((p, i) => Math.hypot(...sub(p, pts[i]))), tot = seg.reduce((a, b) => a + b, 0);
  let left = t*tot; const o = [pts[0]];
  for (let i = 0; i < seg.length; i++){ if (left >= seg[i]){ o.push(pts[i + 1]); left -= seg[i]; continue; }
    if (left > 1e-3) o.push(pts[i].map((v, j) => v + (pts[i + 1][j] - v)*left/seg[i])); break; }
  return o;
}
// a disc on an axis-aligned shaft with tooth marks on the face that is toward the viewer (ax: 1 = y axis, 2 = z axis)
function smGear(c, ax, r, t, ang, m, n = 12, r1 = r){
  const e = ax === 1 ? [0, t, 0] : [0, 0, t], b = c.map((v, i) => v + e[i]), part = smRodP(c, b, r, m, .6, r1);
  const fn = ax === 1 ? [0, Math.sign(t), 0] : [0, 0, Math.sign(t)], cap = facing(fn) ? b : facing(fn.map(v => -v)) ? c : null, rr = facing(fn) ? r1 : r;
  if (cap){ let d = '';
    for (let i = 0; i < n; i++){ const a = ang + i*TAU/n, u = Math.sin(a), v = Math.cos(a);
      const pt = q => ax === 1 ? [cap[0] + q*u, cap[1] + .01*Math.sign(fn[1]), cap[2] + q*v] : [cap[0] + q*u, cap[1] + q*v, cap[2] + .01];
      d += pd([pt(rr*.72), pt(rr*.97)], false); }
    part.svg += ink(d, .6); }
  return part;
}
// a straight prism of any (u = y, v = z) profile swept along x, even a concave one: every face is its own sortable part,
// carrying its share of the silhouette ink; the end face toward the viewer carries its outline and its decals
function smPrism(prof, x0, x1, m, decal = () => '', w = 2.4){
  const n = prof.length, A = on(PX(x0), prof), B = on(PX(x1), prof), parts = [];
  let ar = 0; for (let i = 0; i < n; i++){ const p = prof[i], q = prof[(i + 1) % n]; ar += p[0]*q[1] - q[0]*p[1]; }
  const sg = ar > 0 ? 1 : -1, nrm = prof.map((p, i) => { const q = prof[(i + 1) % n]; return norm([0, sg*(q[1] - p[1]), -sg*(q[0] - p[0])]); });
  const sv = nrm.map(v => vis(v)), fF = facing([1,0,0]), fB = facing([-1,0,0]);
  for (let i = 0; i < n; i++){ if (!sv[i]) continue; const j = (i + 1) % n, q = [A[i], A[j], B[j], B[i]];
    let s = face(pd(q), tone(nrm[i], m)), e = '';
    if (!fB) e += pd([A[i], A[j]], false);
    if (!fF) e += pd([B[i], B[j]], false);
    if (!sv[(i + n - 1) % n]) e += pd([A[i], B[i]], false);
    if (!sv[j]) e += pd([A[j], B[j]], false);
    if (e) s += ink(e, w);
    parts.push({ box: smBoxOf(q), svg: s }); }
  for (const [ok, ring, nx] of [[fF, B, 1], [fB, A, -1]]) if (ok)
    parts.push({ box: smBoxOf(ring), svg: face(pd(ring), tone([nx, 0, 0], m)) + decal(nx) + ink(pd(ring), w*.85) });
  return parts;
}

/* ---------- the machine's outline ---------- */
const UPPER = smRound([[24,10],[40,10],[40,40],[76,40],[76,26],[92,26],[92,54],[24,54]], [0,0,4,4,3,3,9,7]);   // pillar, arm, head
const BEDP = rrUV(18, 0, 98, BZ, 2);

/* ---------- motion: one shaft angle drives everything ---------- */
// feed-dog travel 0..1: back one stitch while up (needle out of the cloth), forward again while down
const smG = A => { let th = ((A % TAU) + TAU) % TAU; if (th > Math.PI) th -= TAU;
  if (Math.abs(th) <= WIN) return ease((th + WIN)/(2*WIN));
  return 1 - ease((th > 0 ? th - WIN : th + TAU - WIN)/(TAU - 2*WIN)); };
function smGeo(st){
  const th = ((st.A % TAU) + TAU) % TAU, c = Math.cos(th), s2 = Math.sin(th), len = LENS[st.lenI].u;
  const tip = 9.5 + 4.5*c, ntop = tip + 8;
  return { th, c, s2, len, tip, ntop,
    pin: y => [SHX + 4.5*s2, y, SHZ + 4.5*c],                 // crank pin
    eye: 44.5 + 5.6*c,                                         // take-up lever eye height
    footZ: FT + 4.6*(1 - st.foot),
    dx: len*(.5 - smG(st.A)),                                  // feed dogs' travel
    z0: 6.8 + .6*c,                                            // feed bar, riding the lift cam
    dogTop: 10.05 + .6*c,                                      // above the plate (10.3) only while the needle is up
    hook: 2*st.A - 2*(Math.PI + .3) };                         // the hook turns twice per stitch; its point is up at the needle as it starts to rise
}
const smThreadPts = G => [[16.8, 36, 58], [28.4, 66, 54.7], [29.0, 71, 48.8], [29.0, 71, 45.4], [29.6, 71.5, 42.5], [30.2, 80, G.eye], [28.7, 84, 25.4], [22.5, NY, G.ntop + 1], [22.0, NY, G.tip + 1.2]];

/* ---------- outside parts (drawn in the normal view, and again over the ghost in see-through) ---------- */
function smOutside(st, G, m, xr){
  const parts = [], add = p => parts.push(p), FRONT = facing([1,0,0]), RIGHT = facing([0,-1,0]);
  // handwheel on the upper shaft, out of the pillar's right end; the mark and grips turn with the shaft
  { const hw = smRodP([SHX, 24, SHZ], [SHX, 19.4, SHZ], 8, HWM, 1.4), hub = smRodP([SHX, 19.4, SHZ], [SHX, 17.4, SHZ], 4.2, METAL, 1);
    let g = '';
    if (RIGHT){ for (let i = 0; i < 12; i++){ const a = G.th + i*TAU/12; g += pd([[SHX + 5.4*Math.sin(a), 19.35, SHZ + 5.4*Math.cos(a)], [SHX + 7.4*Math.sin(a), 19.35, SHZ + 7.4*Math.cos(a)]], false); }
      g = ink(g, .8) + fill(pd(on(PY(17.3), ellUV(SHX + 2.6*G.s2, SHZ + 2.6*G.c, .7, .7, 10))), RECESS); }
    add({ box: [[SHX - 8, 17.4, SHZ - 8], [SHX + 8, 24, SHZ + 8]], svg: hw.svg + (RIGHT ? ink(g.match(/d="([^"]*)"/) ? '' : '', 0) : '') + (RIGHT ? g.split('<path d="M').length ? '' : '' : '') + hub.svg.replace(/^/, '') + (RIGHT ? g : '') }); }
  // spool on its pin, bobbin winder, top thread guide (on the arm's top)
  add({ box: [[13.4, 31.4, 54], [18.6, 36.6, 63]], svg: cyl(16, 34, 54, 54.5, .9, METAL, toneI, .6) + cyl(16, 34, 54.5, 55.1, 2.6, CREAMM, toneI, .8) + cyl(16, 34, 55.1, 60.6, 2.1, THM, toneI, .8)
    + cyl(16, 34, 60.6, 61.2, 2.6, CREAMM, toneI, .8) + cyl(16, 34, 61.2, 63, .35, METAL, toneI, .5) });
  add({ box: [[15.4, 42.4, 54], [18.6, 45.6, 57.8]], svg: cyl(17, 44, 54, 55, 1.6, METAL, toneI, .7) + cyl(17, 44, 55, 56.8, 1.1, CREAMM, toneI, .6) + cyl(17, 44, 56.8, 57.8, .35, METAL, toneI, .5) });
  add(smRodP([27.6, 66, 54], [28.5, 66, 55.2], .25, METAL, .5));
  // on the front of the arm and head: tension discs + knob, check spring, the take-up lever's tip in its slot, lower guide
  { let d = cylX(28, 28.6, 71, 47, 2.3, METAL, toneI, .7) + cylX(28.6, 29.4, 71, 47, 2.3, METAL, toneI, .7) + cylX(29.4, 30.8, 71, 47, 1.7, CREAMM, toneI, .8);
    if (FRONT) d += ink(pd([[30.85, 71, 47], [30.85, 71 - 1.3*Math.sin(.6 + st.foot), 47 + 1.3*Math.cos(.6 + st.foot)]], false), .8);
    add({ box: [[28, 68.7, 44.7], [30.8, 73.3, 49.3]], svg: d }); }
  add(smRodP([28, 71.8, 43.4], [29.6, 71.5, 42.3], .2, METAL, .5));
  { const tipP = [30.2, 80, G.eye], ring = on(PY(80), ellUV(30.2, G.eye, .6, .6, 10));
    add({ box: [[28, 79.4, G.eye - 1], [30.9, 80.6, G.eye + 1.4]], svg: rod([28, 80, G.eye + .9], tipP, .45, GREYM, toneI, .6) + shape(ring, METAL.l, .6) + fill(pd(on(PY(79.98), ellUV(30.2, G.eye, .25, .25, 8))), RECESS) }); }
  add(smRodP([28, 84, 26], [28.7, 84, 25.4], .22, METAL, .5));
  // stitch dial on the pillar's front
  { let d = cylX(28, 29.4, 32, 33, 3.2, CREAMM, toneI, 1);
    if (FRONT){ const a = (-50 + 50*st.lenI)*Math.PI/180; d += ink(pd([[29.45, 32, 33], [29.45, 32 - 2.6*Math.sin(a), 33 + 2.6*Math.cos(a)]], false), 1.1); }
    add({ box: [[28, 28.8, 29.8], [29.4, 35.2, 36.2]], svg: act('dial', d) }); }
  // foot lifter at the back of the head
  { const lz = 31 + 2.2 - 3.4*st.foot;
    add({ box: [[5, 88, 29], [8, 89.2, 34]], svg: act('lifter', rod([8, 88.6, 31], [5.6, 88.6, lz], .45, GREYM, toneI, .6) + rod([5.9, 88.6, lz], [5.2, 88.6, lz], .7, DARK, toneI, .6)) }); }
  // needle bar, clamp, needle; presser bar and foot (below the head)
  const top = xr ? G.ntop + 24 : 26;
  add(smRodP([NX, NY, G.ntop + .4], [NX, NY, top], .7, METAL, .7));
  add(smBoxP(NX - .9, NY - .8, G.ntop - .2, NX + 1.2, NY + .8, G.ntop + 1.4, METAL, .6));
  add(smRodP([NX + 1.2, NY, G.ntop + .6], [NX + 2.1, NY, G.ntop + .6], .35, METAL, .5));
  const sole = G.footZ + .7, lo = xr ? G.tip : Math.max(G.tip, FT);
  if (G.ntop - .2 > sole && lo < sole) add(smRodP([NX, NY, Math.min(G.ntop - .2, sole)], [NX, NY, lo], .3, METAL, .5, .1));
  if (G.ntop - .2 > sole) add(smRodP([NX, NY, G.ntop - .2], [NX, NY, Math.max(sole, lo)], .3, METAL, .5, Math.max(sole, lo) === lo ? .1 : .28));
  else add(smRodP([NX, NY, G.ntop - .2], [NX, NY, lo], .3, METAL, .5, .1));
  add(smRodP([NX, 88.6, G.footZ + 3.6], [NX, 88.6, xr ? 52 : 26], .65, METAL, .7));
  add(smBoxP(21.1, 87.7, G.footZ + .8, 23.1, 89.5, G.footZ + 3.8, METAL, .6));
  { const fz = G.footZ; let d = box(18.4, 84, fz, 26, 89.8, fz + .7, METAL, toneI, .8) + box(26, 84, fz + .3, 27.2, 89.8, fz + 1.5, METAL, toneI, .8);
    d += fill(pd([[20.4, 85.1, fz + .72], [24, 85.1, fz + .72], [24, 85.9, fz + .72], [20.4, 85.9, fz + .72]]), RECESS);
    add({ box: [[18.4, 84, fz], [27.2, 89.8, fz + 1.5]], svg: d }); }
  // feed dogs' teeth peeping up through the needle plate (normal view; see-through draws the whole dogs)
  if (!xr && G.dogTop > PT + .02) for (const y of [84, 86.3]) add(smBoxP(18.6 + G.dx, y, PT, 25.4 + G.dx, y + .7, G.dogTop, METAL, .5));
  // the cloth (moves with the feed), its check, the seam on top; in see-through it is pale so the hook shows
  parts.push(...smCloth(st, G, xr));
  // the top thread from the spool to the needle, then to the seam
  if (st.thr > 0){
    let pts = smThreadPts(G);
    if (st.thr < 1) pts = smCut(pts, ease(st.thr));
    else { const xl = st.pts.length ? st.pts[st.pts.length - 1] - st.feed : null, eyeZ = G.tip + 1.2;
      if (xl == null) pts.push([NX, NY, FT + .05], [NX - 5, NY + .5, FT + .05]);
      else if (eyeZ > FT || xr) pts.push([xl, NY, FT + .05]); }
    parts.push(...smWire(pts, THREAD, .32, 4));
  }
  // the pedal on the floor and its cord to the socket on the bed's right end
  parts.push(...smWire([[40, 8.5, 1.4], [37.5, 8.5, .5], [20, 9.5, .5], [9, 12.5, .5], [8, 15.5, 1.6], [8, 17.3, 3.6]], RUBBER, .9, 5));
  add(smBoxP(6.6, 17.2, 2.2, 9.4, 18, 5, DARK, .6));
  add(smPedal(st, xr));
  return parts;
}
function smPedal(st, xr){
  const y0 = 2.5, y1 = 14.5, base = [[40, 0], [55, 0], [55, 1.8], [40, 3.6]], ez = 5.4 - 1.5*st.pedal;
  const plate = [[54.8, 2.1], [54.8, 2.9], [40.4, ez], [40.4, ez - .8]];
  const solid = (pr, m, w) => { const A = on(PY(y0), pr), B = on(PY(y1), pr); let s = loft(A, B, n => toneI(n, m));
    if (facing([0,1,0])) s += shape(B, toneI([0,1,0], m), .8); if (facing([0,-1,0])) s += shape(A, toneI([0,-1,0], m), .8);
    return s + hullInk([...A, ...B], w); };
  let s = `<g opacity="${xr ? .45 : 1}">` + solid(base, DARK, 1.6) + solid(plate, PEDM, 1.3);
  let rib = ''; for (let i = 1; i < 6; i++){ const t = i/6, x = 54.8 + (40.4 - 54.8)*t, z = 2.9 + (ez - 2.9)*t + .02; rib += pd([[x, y0 + 1, z], [x, y1 - 1, z]], false); }
  s += ink(rib, .7) + '</g>';
  if (xr) s += box(44, 6, .4, 49, 11, 2.2, matOf('#3d3935'), toneI, .6) + box(45, 7, 2.2, 48, 10, 2.8 - .3*st.pedal, matOf('#c9a46a'), toneI, .5);   // speed control (carbon pile) under the plate
  return { box: [[40, y0, 0], [55, y1, 5.6]], svg: act('pedal', s) };
}
function smCloth(st, G, xr){
  const x0 = FAB0 - st.feed, x1 = FAB1 - st.feed, a = Math.max(x0, 0), b = Math.min(x1, BX1), out = [];
  let s = box(a, FY0, PT, b, FY1, FT, FABM, toneI, 1);
  // gingham lines, moving with the cloth
  let ln = ''; for (let y = FY0 + 2; y < FY1; y += 4) ln += pd([[a, y, FT + .02], [b, y, FT + .02]], false);
  for (let u = FAB0 + 2; u < FAB1; u += 4){ const x = u - st.feed; if (x > a + .2 && x < b - .2) ln += pd([[x, FY0, FT + .02], [x, FY1, FT + .02]], false); }
  s += `<path d="${ln}" fill="none" stroke="#e2c88c" style="stroke-width:.55"/>`;
  // the sewing light's pool under the head
  s += fill(pd(on(PZ(FT + .03), ellUV(NX + 1, NY, 5, 6, 18))), '#fff6c0', 'opacity=".35"');
  // drapes where the cloth hangs over the bed's front or back edge
  const drape = (xe, o, sgn) => { const q = [[xe, FY0, FT], [xe, FY1, FT], [xe + sgn*o*.55, FY1, FT - o*.85], [xe + sgn*o*.55, FY0, FT - o*.85]];
    return { box: smBoxOf(q), svg: shape(q, toneI([sgn*.85, 0, .5], FABM), 1) }; };
  if (x1 > BX1) out.push(drape(BX1, x1 - BX1, 1));
  if (x0 < 0) out.push(drape(0, -x0, -1));
  let seam = '';
  // top thread: one stitch between each pair of holes; before the first stitch, the tail runs back under the foot
  const xs = st.pts.map(u => u - st.feed);
  for (let i = 0; i + 1 < xs.length; i++) seam += pd([[xs[i] - .07, NY, FT + .05], [xs[i + 1] + .07, NY, FT + .05]], false);
  if (xs.length) seam += pd([[xs[0], NY, FT + .05], [xs[0] - 4, NY + .6, FT + .05]], false);
  const seamSvg = seam ? `<path d="${seam}" fill="none" stroke="${INK}" style="stroke-width:.62" stroke-linecap="round"/><path d="${seam}" fill="none" stroke="${THREAD}" style="stroke-width:.34" stroke-linecap="round"/>` : '';
  out.push({ box: [[a, FY0, PT], [b, FY1, FT]], svg: (xr ? `<g opacity=".42">${s}</g>` : s) + seamSvg });
  return out;
}

// Keep dense callouts inside the frame even when a rear view leaves no room beside the case.
function smCallouts(items){
  const svg = document.getElementById('fig'), vb = svg.viewBox.baseVal, k = INK_K;
  const u = window.LBL_U ? LBL_U() : 0, fs = u ? 10*u : 8.6*k, h = u ? 17*u : fs*1.8;
  const cols = u ? 3 : 2, anchors = items.map(it => ({ ...it, p:P(...it.at) })).sort((a,b) => a.p[0] - b.p[0]);
  const matrix = svg.getScreenCTM(), tops = Array(cols).fill(vb.y + h/2 + 3*k);
  if (!u && matrix) for (const [i, id] of [[0,'btns'], [1,'stats']]){
    const r = document.getElementById(id)?.getBoundingClientRect();
    if (r) tops[i] = Math.max(tops[i], new DOMPoint(r.left,r.bottom + 8).matrixTransform(matrix.inverse()).y + h/2);
  }
  let out = '';
  for (let i = 0; i < cols; i++){
    const col = anchors.slice(Math.ceil(i*anchors.length/cols), Math.ceil((i+1)*anchors.length/cols)).sort((a,b) => a.p[1] - b.p[1]);
    const bottom = vb.y + vb.height - h/2 - (u ? 8 : 30)*k;
    const gap = Math.min(h + (u ? 3*u : 3*k), (bottom - tops[i])/Math.max(1,col.length-1));
    col.forEach((it,j) => {
      const w = u ? h*1.3 : it.text.length*fs*.62 + fs*1.5;
      const x = i === 0 ? vb.x + w/2 + 3*k : i === cols-1 ? vb.x + vb.width - w/2 - 3*k : vb.x + vb.width/2;
      const y = tops[i] + j*gap;
      out += tag(it.at,(x-it.p[0])/k,(y-it.p[1])/k,it.text,it.on);
    });
  }
  return out;
}

    if (dg > 0) st.feed += len*dg;                              // the dogs carry the cloth back only while they are up
    st.A = a1;
    if (Math.floor((a1 - PEN)/TAU) > Math.floor((a0 - PEN)/TAU)){
      st.pts.push(NX + st.feed);                                // the needle goes through the cloth here (cloth coordinates)
      if (st.run && NX + st.feed > FAB1 - 1.5 - len){ st.run = false; st.done = true; st.stopA = Math.ceil(st.A/TAU)*TAU; if (ui) ui.flash('Seam done. Press the pedal for a new piece', 2600); }
    }
  }
}
function smLoop(){
  if (smLoopOn) return; smLoopOn = true;
  ui.animate(dt => { const st = ui.st;
    const df = st.footT - st.foot; st.foot += Math.sign(df)*Math.min(Math.abs(df), dt/.35);
    if (st.threading){ st.thr = Math.min(1, st.thr + dt/2.6); if (st.thr >= 1) st.threading = false; }
    st.pedal += ((st.run ? 1 : 0) - st.pedal)*Math.min(1, dt*10);
    const moving = st.run || st.stopA != null;
    if (moving){ st.w += ((st.run ? OMEGA : OMEGA*.7) - st.w)*Math.min(1, dt*5);
      let dA = st.w*dt; if (!st.run) dA = Math.max(0, Math.min(dA, st.stopA - st.A));
      smAdvance(st, dA);
      if (!st.run && st.stopA != null && st.A >= st.stopA - 1e-6){ st.A = st.stopA; st.stopA = null; st.w = 0; } }
    const busy = st.run || st.stopA != null || st.threading || Math.abs(st.footT - st.foot) > 1e-4 || st.pedal > .01;
    if (!busy){ st.pedal = 0; smLoopOn = false; }
    return busy; });
}
const smBusy = st => st.run || st.stopA != null;
function smThread(st){
  if (st.thr >= 1) return ui.flash('Already threaded');
  if (st.threading) return;
  if (smBusy(st)) return ui.flash('Release the pedal first');
  if (st.footT > 0){ st.footT = 0; ui.flash('Foot up first: that opens the tension discs so the thread seats', 2400); }
  st.threading = true; smLoop();
}
function smFoot(st){
  if (smBusy(st)) return ui.flash('Release the pedal first');
  st.footT = st.footT ? 0 : 1; if (!st.footT) ui.flash('Foot raised');
  smLoop();
}
function smPress(st){
  if (st.run){ st.run = false; st.stopA = Math.ceil(st.A/TAU - 1e-6)*TAU; return ui.flash('Pedal released: the needle stops at the top'); }
  if (st.stopA != null) return;
  if (st.thr < 1) return ui.flash(st.threading ? 'Wait, still threading' : 'Thread the machine first');
  if (st.footT < 1) return ui.flash('Lower the presser foot first');
  if (st.done){ st.feed = 0; st.pts = []; st.done = false; }
  st.run = true; st.stopA = null; smLoop();
}

ui = mountFigure({
  fig:'31', title:'Sewing machine', turn:'full',
  size:[55, 100, 63], palette:'mint',
  // A = upper-shaft angle (0 = needle at the top); feed = how far the cloth has moved back; pts = needle holes (cloth x)
  state:{ thr:0, threading:false, foot:0, footT:0, run:false, stopA:null, w:0, A:0, feed:0, pts:[], lenI:1, pedal:0, done:false },
  scene,
  buttons:[
    { label:'Thread it', onClick: st => smThread(st) },
    { label:'Lower the foot', onClick: st => smFoot(st) },
    { label:'Press the pedal', onClick: st => smPress(st) },
    { label:'Stitch length', choices: st => LENS.map((L, i) => ({ label: L.label, current: st.lenI === i, disabled: smBusy(st),
        why:'Release the pedal before changing the stitch length', onClick: st => { st.lenI = i; } })) },
  ],
  stats: st => [{ label:'Stitches', value: st.pts.length }, { label:'Seam', value: (st.pts.length > 1 ? (st.pts[st.pts.length - 1] - st.pts[0])*.5 : 0).toFixed(1) + ' cm', small:true }],
  acts:{ pedal: st => smPress(st), lifter: st => smFoot(st), dial: st => { if (smBusy(st)) return ui.flash('Release the pedal first'); st.lenI = (st.lenI + 1) % LENS.length; } },
  params:(st, q) => {
    if (q.has('len')) st.lenI = Math.max(0, Math.min(2, +q.get('len') | 0));
    if (q.has('thr')) st.thr = +q.get('thr');
    if (q.has('foot')) st.foot = st.footT = +q.get('foot');
    if (q.has('sewn')){ st.thr = 1; st.foot = st.footT = 1; st.run = true; smAdvance(st, (+q.get('sewn'))*TAU); st.run = false; }
    if (q.has('th')) smAdvance(st, +q.get('th'));
    if (q.has('pedal')) st.pedal = +q.get('pedal');
  },
});
xrMount(() => ui, () => '');
</script></body></html>
