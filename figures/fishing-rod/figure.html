<!doctype html>
<html lang="en" data-errors=""><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fishing rod</title></head><body>
<script src="core.js"></script>
<script>
/* Truth first.
   The 2016 book pages 21 and 23 and 1998 page 23 describe a third-class lever.
   The rear hand fixes the fulcrum. The forward hand supplies upward effort between it and the fish load.
   A rigid light rod turns through 26 degrees. The tip and attached mass rise four times as far as the effort hand.
   Vertical forces have horizontal moment arms. Effort times its arm equals load times its arm in slow equilibrium.
   Load clips the loose line to the fish-shaped teaching mass on its cradle above the tank.
   Lift keeps that line taut and the rear hand fixed. Compare lowers, then repeats slowly with travel overlays.
   Reset lowers the mass onto the cradle before detaching the line. No casting, reel, hook or powered drive is modeled.
   Structure. Solid tapered pole with two cork grips and a butt cap, held by two cropped illustrative human hands.
   Connections. Line is lashed around the rod tip, then clipped to the eye of the teaching mass.
   Representative fixed-line construction is supported by Minnesota DNR fishing/fin/equipment.html.
   Source URL https://www.dnr.state.mn.us/fishing/fin/equipment.html.
   The two grips and short line are teaching adaptations, not an exact copy of the illustrated rod.
   Fixtures. Board supports the tank and cradle. Tank, mass, cradle, grips, chosen dimensions and controls stage the lesson.
   Anatomy. Butt cap, rear grip, forward grip, rod shaft, rod tip, fishing line, tip lashing.
   Overlays. Fulcrum and effort roles, force arrows, perpendicular moment arms and travel arcs are not anatomy.
   The simple-tool minimum was declared as six before building. The 1988 edition remains inaccessible and unverified.
   shortcut: the rod is rigid and weightless and the load is lifted slowly, include flex and inertia for casting lessons.
*/
const fishRig = { pivot:[24,32,43], effort:24, tip:96, low:8*Math.PI/180, sweep:26*Math.PI/180, line:26, load:1 };
const fishCork = matOf('#dbad70'), fishSkin = matOf('#e7b192'), fishSleeve = matOf('#688eab');
const fishState = { phase:'empty', p:0, elapsed:0, from:0, travel:false, loop:false };
const fishPoint = (distance, p) => { const a=fishRig.low+fishRig.sweep*p; return [24+distance*Math.cos(a),32,43+distance*Math.sin(a)]; };
const fishBounds = (pts, r=.2) => [[0,1,2].map(i=>Math.min(...pts.map(p=>p[i]))-r),[0,1,2].map(i=>Math.max(...pts.map(p=>p[i]))+r)];
const fishLoaded = st => st.phase !== 'empty';
const fishBusy = st => ['lift','compare','reset'].includes(st.phase);
function fishArrow(a,b,color,width=1.7){
  const v=norm(sub(b,a)), side=norm(cross(v,[0,1,0])), q=b.map((x,i)=>x-v[i]*2.7);
  return `<path d="${pd([a,b],false)}" fill="none" stroke="${color}" stroke-width="${width}"/>`+
    shape([b,q.map((x,i)=>x+side[i]*1.3),q.map((x,i)=>x-side[i]*1.3)],color,.4);
}
function fishScene(st,material){
  const parts=[], ghosts=[], fixtureParts=[], k=ease(st.xr||0), tip=fishPoint(96,st.p), effort=fishPoint(24,st.p);
  const loaded=fishLoaded(st), massAt=loaded?[tip[0],32,tip[2]-fishRig.line-5.5]:[fishPoint(96,0)[0],32,fishPoint(96,0)[2]-fishRig.line-5.5];
  const put=(pts,svg,r=.2,group=parts)=>group.push({box:fishBounds(pts,r),svg});
  const bar=(a,b,r,m,group=parts,r1=r)=>group.push({box:fishBounds([a,b],Math.max(r,r1)),svg:rod(a,b,r,m,toneI,1,r1)});
  const block=(a,b,m,group=parts)=>put([a,b],box(...a,...b,m,toneI,1),0,group);
  let out=board(0,0,138,68,3,5,WOOD);
  out+=castShadow([fishPoint(-10,st.p),tip,...[0,24].flatMap(d=>[fishPoint(d,st.p),[fishPoint(d,st.p)[0],54,32]]),[93,18,21],[132,47,21]],3,boardTop(0,0,138,68,3,5));
  block([93,18,3],[132,47,5],material);
  put([[94,19,5],[131,46,13]],fill(pd(on(PZ(13),rectUV(94,19,131,46))),'#82c6dd','opacity=".55"'),0);
  for(const [a,b] of [[[93,18,5],[132,18,21]],[[93,47,5],[132,47,21]],[[93,18,5],[93,47,21]],[[132,18,5],[132,47,21]]]){
    const pts=[[a[0],a[1],a[2]],[b[0],b[1],a[2]],b,[a[0],a[1],b[2]]];
    put(pts,`<g opacity="${.26-.14*k}">${shape(pts,'#cfe9f0',1)}</g>`,0);
    bar([a[0],a[1],21],[b[0],b[1],21],.6,METAL);
  }
  const home=fishPoint(96,0), bottom=home[2]-fishRig.line-9.3;
  for(const dx of [-5,5]) block([home[0]+dx-1,29,5],[home[0]+dx+1,35,bottom],CERAMIC,fixtureParts);
  block([home[0]-7,28,bottom-1],[home[0]+7,36,bottom],CERAMIC,fixtureParts);
  for(const [a,b,r,r1] of [[-10,-7,2.1,2.1],[-7,7,2.1,2.1],[7,17,1.45,1.35],[17,31,2.1,2.1],[31,57,1.3,.95],[57,78,.95,.7],[78,94,.7,.45],[94,96,.45,.35]]){
    const pts=[fishPoint(a,st.p),fishPoint(b,st.p)], grip=(a===-7||a===17), m=a===-10?DARK:grip?fishCork:material;
    const item={box:fishBounds(pts,r),svg:rod(...pts,r,m,tone,1.2,r1)};
    parts.push({...item,svg:`<g opacity="${grip?1-.78*k:1}">${item.svg}</g>`});
    if(grip&&k>0) bar(...pts,1.35,material,ghosts);
  }
  for(const d of [95,95.6,96]){
    const p=fishPoint(d,st.p); bar([p[0],p[1],p[2]-.5],[p[0]+.25,p[1],p[2]+.5],.24,DARK);
  }
  // Each finger wraps the grip. Its three short sections sort independently around the rod.
  for(const d of [0,24]){
    const p=fishPoint(d,st.p), handGroup=k>0?ghosts:parts, opacity=1-.78*k;
    const hand=[];
    bar([p[0],48,p[2]-6],[p[0],40,p[2]-3],4,fishSkin,hand);
    bar([p[0],54,p[2]-8],[p[0],48,p[2]-6],4.5,fishSleeve,hand);
    bar([p[0]-3.7,37,p[2]-1],[p[0]+3.7,37,p[2]-1],3.4,fishSkin,hand);
    for(const dx of [-3.3,-1.1,1.1,3.3]){
      bar([p[0]+dx,37,p[2]-1],[p[0]+dx,33,p[2]-3.1],.95,fishSkin,hand);
      bar([p[0]+dx,33,p[2]-3.1],[p[0]+dx,29.1,p[2]-1],.95,fishSkin,hand);
      bar([p[0]+dx,29.1,p[2]-1],[p[0]+dx,30,p[2]+1.5],.95,fishSkin,hand);
    }
    bar([p[0]-4,37,p[2]+1],[p[0]-3,32,p[2]+3],1.4,fishSkin,hand);
    for(const item of hand) parts.push({...item,svg:`<g opacity="${opacity}">${item.svg}</g>`});
  }
  const eye=[massAt[0],32,massAt[2]+5.5], end=loaded?eye:[eye[0]+5,32,eye[2]+2];
  const linePts=loaded?[tip,eye]:[tip,[tip[0]+4,32,tip[2]-13],end];
  for(let i=1;i<linePts.length;i++) put([linePts[i-1],linePts[i]],line([linePts[i-1],linePts[i]],1.2));
  const mx=massAt[0], mz=massAt[2], profile=ellUV(mx,mz,7,3.8,20), rings=[on(PY(30.5),profile),on(PY(33.5),profile)];
  const nearY=facing([0,1,0])?33.5:30.5, fishFace=on(PY(nearY),profile);
  let specimen=loft(...rings,n=>toneI(n,matOf('#ed9d4e')))+shape(fishFace,'#ed9d4e',1.1)+hullInk(rings.flat(),1.2);
  specimen+=shape(on(PY(nearY+.03*Math.sign(nearY-32)),ellUV(mx+3.7,mz+.8,.7,.7,10)),INK,.4);
  put(rings.flat(),specimen,0,fixtureParts);
  bar([mx-6,32,mz],[mx-10,32,mz-2.7],.6,matOf('#ed9d4e'),fixtureParts);
  bar([mx-10,32,mz-2.7],[mx-10,32,mz+2.7],.6,matOf('#ed9d4e'),fixtureParts);
  bar([mx-10,32,mz+2.7],[mx-6,32,mz],.6,matOf('#ed9d4e'),fixtureParts);
  bar([mx,32,mz+3.7],eye,.45,METAL,fixtureParts);
  put([eye],shape(on(PY(32),ellUV(eye[0],eye[2],.85,.85,16)),loaded?'#ce6043':METAL.l,.7),1,fixtureParts);
  // Sort the touching mass and cradle together before mixing in the surrounding tank walls.
  parts.push({box:fishBounds(fixtureParts.flatMap(p=>p.box),0),svg:byDepth(fixtureParts)});
  out+=byDepth(parts);
  if(k>0) out+=`<g opacity="${k}">${byDepth(ghosts)}</g>`;
  if(k>.01||st.travel){
    const show=k>.01?k:1;
    let overlays='';
    if(loaded){
      overlays+=fishArrow([effort[0],22,effort[2]-24],[effort[0],22,effort[2]],'#c17e10',2.3);
      overlays+=fishArrow([tip[0],24,tip[2]],[tip[0],24,tip[2]-6],'#c05243',1.7);
      overlays+=fishArrow([24,23,43],[24,23,25],'#517cab',1.7);
    }
    overlays+=shape([[21,25,38],[27,25,38],[24,25,43]],'#517cab',.7);
    if(st.travel){
      for(const [d,color,y] of [[24,'#c17e10',18],[96,'#3d8996',16]]){
        const arc=Array.from({length:31},(_,i)=>{const p=fishPoint(d,st.p*i/30);return [p[0],y,p[2]];});
        overlays+=`<path d="${pd(arc,false)}" fill="none" stroke="${color}" stroke-width="1.8" stroke-dasharray="2 1"/>`;
        if(st.p>.03) overlays+=fishArrow(arc[29],arc[30],color,1.8);
      }
      for(const [d,y,z,color] of [[24,12,33,'#c17e10'],[96,8,24,'#3d8996']]){
        const p=fishPoint(d,st.p); overlays+=`<path d="${pd([[24,y,z],[p[0],y,z]],false)}" fill="none" stroke="${color}" stroke-width="1"/>`;
        for(const x of [24,p[0]]) overlays+=line([[x,y,z-1.5],[x,y,z+1.5]],.7);
        overlays+=tag([(24+p[0])/2,y,z],0,14,`${d===24?'EFFORT':'LOAD'} ARM ${(p[0]-24).toFixed(1)} CM`);
      }
      overlays+=tag([effort[0],18,effort[2]],-24,-26,`HAND ${(24*fishRig.sweep*st.p).toFixed(1)} CM`);
      overlays+=tag([tip[0],16,tip[2]],26,-24,`TIP ${(96*fishRig.sweep*st.p).toFixed(1)} CM`);
    }
    out+=`<g opacity="${show}">${overlays}</g>`;
  }
  const labels=[
    {at:fishPoint(-9,st.p),text:'BUTT CAP'}, {at:fishPoint(-5,st.p),text:'REAR GRIP'},
    {at:fishPoint(29,st.p),text:'FORWARD GRIP',on:fishBusy(st)}, {at:fishPoint(60,st.p),text:'ROD SHAFT',on:fishBusy(st)},
    {at:fishPoint(94,st.p),text:'ROD TIP',on:fishBusy(st)}, {at:linePts[1],text:'FISHING LINE',on:loaded},
    {at:tip,text:'TIP LASHING'}, {at:[24,37,42],text:'REAR HAND FULCRUM'},
    {at:[effort[0],37,effort[2]],text:'FORWARD HAND EFFORT',on:fishBusy(st)}];
  out+=xrCallouts(labels,[15,124,28,40,36,97]);
  return out;
}
function fishRun(st,ui,phase){
  if(!fishLoaded(st)) return ui.flash('Load the test mass first');
  st.from=st.p; st.elapsed=0; st.travel=phase==='compare'; st.phase=phase;
  if(st.loop) return;
  st.loop=true;
  ui.animate(dt=>{
    st.elapsed+=dt;
    if(st.phase==='lift') st.p=st.from+(1-st.from)*ease(Math.min(1,st.elapsed/1.8));
    if(st.phase==='compare'){
      if(st.elapsed<1.3) st.p=st.from*(1-ease(st.elapsed/1.3));
      else st.p=ease(Math.min(1,(st.elapsed-1.3)/4));
    }
    if(st.phase==='reset') st.p=st.from*(1-ease(Math.min(1,st.elapsed/1.8)));
    const duration=st.phase==='compare'?5.3:1.8;
    if(st.elapsed>=duration){st.p=st.phase==='reset'?0:1;st.phase=st.phase==='reset'?'empty':'raised';st.loop=false;return false;}
    return true;
  });
}
const fishUI=mountFigure({fig:'23',title:'Fishing rod',turn:'full',size:[138,68,103],palette:'mint',state:fishState,scene:fishScene,
  stats:st=>[
    {label:'Effort / load',value:fishLoaded(st)?'4 N / 1 N':'0 N / 0 N',small:true},
    {label:'Tip rise',value:`${(96*(Math.sin(fishRig.low+fishRig.sweep*st.p)-Math.sin(fishRig.low))).toFixed(1)} cm`,small:true},
    {label:'Travel tip / hand',value:'4 : 1',small:true}],
  buttons:[
    {label:'Load',onClick:(st,ui)=>{if(fishLoaded(st))return ui.flash('The 1 N test mass is already attached');st.phase='ready';}},
    {label:'Lift',onClick:(st,ui)=>fishRun(st,ui,'lift')},
    {label:'Compare travel',onClick:(st,ui)=>fishRun(st,ui,'compare')},
    {label:'Reset',onClick:(st,ui)=>{if(!fishLoaded(st))return;fishRun(st,ui,'reset');}}],
  params:(st,q)=>{if(q.get('loaded')==='1')st.phase='ready';const p=Number(q.get('p'));if(q.has('p')&&Number.isFinite(p)){st.p=Math.max(0,Math.min(1,p));st.phase=st.p>0?'raised':'ready';}st.travel=q.get('travel')==='1';}
});
xrMount(()=>fishUI,()=> '');
</script></body></html>
