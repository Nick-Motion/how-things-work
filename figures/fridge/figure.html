<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fridge</title></head><body>
<script src="core.js"></script>
<script>
/* Fridge: a kitchen fridge-freezer (freezer at the bottom), 60 wide x 65 deep x 180 tall, 1 unit = 1 cm.
   x = depth (the doors' fronts at x = 65, the cabinet's back at x = 3), y = width (hinges at y = 0), z = up.

   HOW IT REALLY WORKS (vapour compression; a "static" fridge-freezer: one compressor, one thermostat)
   1. Compressor (bottom back, in the machine compartment) squeezes the cold refrigerant gas (R600a) into a hot,
      high-pressure gas -> discharge line out through the back -> up the side of the back to the top of the condenser.
   2. Condenser on the back: a black steel tube bent in a serpentine, with wire fins. Room air takes the heat; the gas
      condenses to a warm liquid on its way down -> filter drier (catches moisture and grit).
   3. Capillary tube (0.7 mm bore): the restriction. It is wound round the suction line (a heat exchanger), then runs
      up inside the foam of the back wall to the fridge evaporator.
   4. Fridge evaporator: a roll-bond aluminium cold plate on the fridge's back wall. The liquid boils at about -25 C
      and takes heat out of the fridge. Frost on the plate melts between runs: drain channel -> drain tube ->
      drip tray on the warm compressor, where the water evaporates.
   5. Crossover tube down the back wall -> freezer evaporator (serpentine on the freezer's back wall) -> suction line
      -> back to the compressor as a cold low-pressure gas.
   6. Thermostat (housing in the fridge ceiling, dial on its front): its sensing bulb is clipped to the cold plate.
      Warm (cut-in 6 C here) -> contacts close -> current runs down the wiring loom to the start relay -> compressor
      runs. Cold (cut-out 3 C) -> contacts open -> it stops.
   7. Door switch: a plunger in the cabinet frame. Door shut -> plunger pushed in, light off. Door open -> it springs
      out -> the LED light on the thermostat housing comes on. Door left open: room air pours in, the fridge warms past
      the cut-in, the compressor runs (and cannot keep up until the door is shut).
   Food comes from the shopping bag on the floor: lifted out over its rim, carried to the open fridge, slid onto a shelf.

   PARTS
   CASE       cabinet (steel skin, foam between skin and liner) . inner liner . divider . fridge door (gasket, inner
              panel, 3 door bins) . freezer door . 2 handles . 3 hinges . 4 levelling feet . kick grille .
              back vent panel over the machine compartment . rating label
   STRUCTURE  3 glass shelves (the lowest is the crisper cover) . 2 crisper drawers . 3 freezer drawers . thermostat housing
   COOLING    compressor on 4 rubber mounts on its base plate . process tube . discharge line . condenser coil + wire fins
              on 4 brackets . filter drier . capillary tube (wound round the suction line = heat exchanger) . fridge
              evaporator (cold plate) . crossover tube . freezer evaporator . suction line
   DEFROST    drain channel under the cold plate . drain tube . drip tray on the compressor
   POWER      power cord + plug . start relay . overload protector . wiring loom to the thermostat . door switch .
              interior light
   CONTROLS   thermostat + temperature dial + sensing bulb (clipped to the cold plate)
*/
const FW = 65, FD = 60, FH = 180;
const CX0 = 3, CX1 = 59, CZ0 = 5, DTH = 6;                     // cabinet back / front, its underside, door thickness
const OUTC = rrUV(0, CZ0, FD, FH, 2.5);                         // cabinet profile (y, z), swept along x
const HOLE = [4, 75, 56, 174];                                  // fridge opening in the front (y0, z0, y1, z1)
const LX0 = 9;                                                  // inner liner's back wall
const DZ0 = 68.5, DZ1 = 179.5, FZ0 = 6, FZ1 = 67.5;             // fridge door, freezer door (z)
const DOOR_MAX = 95 * Math.PI / 180;
const SHELF_Z = [96, 120, 145], SHX1 = 47.5;                    // glass shelves (the lowest covers the crispers)
const PLATE_Z = Array.from({length: 7}, (_, i) => 133 + i*34/6), COIL_Z = Array.from({length: 11}, (_, i) => 166 - i*13.2);
const BAG = [33, 70, 53, 86, 18];
const LINER = { l:'#fbfbf6', m:'#e6e7e1', d:'#c6c9c2' }, COP = { l:'#f0b07a', m:'#d08a52', d:'#9a5a2c' };
const RUB = matOf('#3a3633'), COMPM = matOf('#50544f'), GASK = matOf('#9a9e9b'), PAPER = matOf('#d9b27c'), FOAM = matOf('#f1e3a6');
const LENS_ON = '#fff6c8', HOT = '#e2483d', WARM = '#f4b829', COLD = '#76a0e2', COLDER = '#3f63b8';
const FZW = { u:[1,0,0], n:[0,1,0], Q:(a, w, z) => [a, w, z] };   // world axes as a "frame" for fzOB
const FOODS = [
  { kind:'carton', col:'#f6f6f0', acc:'#5a82c6', w:7, d:7, h:17, dest:[30, 44, SHELF_Z[1] + .8], bag:[39, 75, 8] },
  { kind:'block', col:'#f6cf48', w:8, d:6, h:5, dest:[30, 16, SHELF_Z[2] + .8], bag:[47.5, 82, 8] },
  { kind:'jar', col:'#c8283a', r:3.2, h:7, dest:[40, 24, SHELF_Z[1] + .8], bag:[47, 75, 8] },
  { kind:'bottle', col:'#f39a2c', r:3, h:18, dest:[34, 40, SHELF_Z[0] + .8], bag:[40, 82, 8] },
];
const DOOR_BINS = [
  { z: 84, items: [{ kind:'bottle', col:'#6aa86a', r:2.8, h:20, a:16 }, { kind:'bottle', col:'#dfe9ec', r:2.8, h:19, a:24 }, { kind:'carton', col:'#f6f6f0', acc:'#ef6a4c', w:6, d:5.5, h:15, a:40 }] },
  { z: 113, items: [{ kind:'jar', col:'#c8283a', r:2.6, h:7, a:18 }, { kind:'jar', col:'#e6b52a', r:2.6, h:8, a:26 }] },
  { z: 142, items: [{ kind:'block', col:'#f6e7a1', w:9, d:5, h:3.5, a:36 }] } ];

/* ---------- helpers ---------- */
const fzBoxOf = (pts, e = .05) => [[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - e), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + e)];
const fzBend = (pts, r = 1.2) => { if (pts.length < 3) return pts; const out = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++){ const [a, b, c] = [pts[i - 1], pts[i], pts[i + 1]];
    const la = Math.hypot(...a.map((v, k) => v - b[k])), lc = Math.hypot(...c.map((v, k) => v - b[k])), d = Math.min(r, la/2.2, lc/2.2);
    if (d < 1e-3){ out.push(b); continue; }
    const p = a.map((v, k) => b[k] + (v - b[k]) * d/la), q = c.map((v, k) => b[k] + (v - b[k]) * d/lc);
    for (let j = 0; j <= 4; j++){ const t = j/4; out.push([0,1,2].map(k => (1-t)*(1-t)*p[k] + 2*(1-t)*t*b[k] + t*t*q[k])); } }
  out.push(pts[pts.length - 1]); return out; };
// a tube cut into short sorted pieces; flow = { ph, c0, c1 } draws the refrigerant moving along it (colour c0 -> c1)
function fzPipe(pts, col, r = .5, flow = null, Lp = 3, bendR = 1.5){
  const q = fzBend(pts, bendR), cum = [0];
  for (let i = 1; i < q.length; i++) cum.push(cum[i - 1] + Math.hypot(...sub(q[i], q[i - 1])));
  const tot = cum[cum.length - 1] || 1, out = [], g = 6;
  for (let i = 0; i < q.length - 1; ){
    let j = i + 1; while (j < q.length - 1 && cum[j] - cum[i] < Lp) j++;
    const seg = q.slice(i, j + 1), d = pd(seg, false);
    let svg = `<path d="${d}" fill="none" stroke="${INK}" style="stroke-width:${f(2*r + .7)}" stroke-linecap="round" stroke-linejoin="round"/>`
      + `<path d="${d}" fill="none" stroke="${col}" style="stroke-width:${f(2*r)}" stroke-linecap="round" stroke-linejoin="round"/>`;
    if (flow) for (let s = Math.ceil((cum[i] - flow.ph) / g) * g + flow.ph; s < cum[j]; s += g){
      let kk = i; while (kk < j - 1 && cum[kk + 1] < s) kk++;
      const t = Math.max(0, Math.min(1, (s - cum[kk]) / ((cum[kk + 1] - cum[kk]) || 1))), [X, Y] = P(...q[kk].map((v, c) => v + (q[kk + 1][c] - v) * t));
      svg += `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(Math.max(.45, r*1.15))}" fill="${mix(flow.c0, flow.c1, Math.min(1, s / tot))}" stroke="${INK}" style="stroke-width:.25"/>`; }
    out.push({ box: fzBoxOf(seg, r), svg }); i = j; }
  return out;
}
const fzJoin = parts => parts.map(p => p.svg).join('');
// a serpentine in the plane x = const: runs ya -> yb, yb -> ya, ... at the heights zs
const fzSerp = (x, ya, yb, zs) => zs.flatMap((z, i) => i % 2 ? [[x, yb, z], [x, ya, z]] : [[x, ya, z], [x, yb, z]]);
// an oriented box: a along F.u, w along F.n, z up. Returns { svg, pts, box }.
function fzOB(F, a0, a1, w0, w1, z0, z1, m, o = {}){
  const { u, n, Q } = F, sh = o.sh || toneI, wd = o.w ?? .8, op = o.op ?? 1, neg = v => v.map(x => -x);
  const fs = [
    [u, [Q(a1,w0,z0), Q(a1,w1,z0), Q(a1,w1,z1), Q(a1,w0,z1)]],
    [neg(u), [Q(a0,w0,z0), Q(a0,w1,z0), Q(a0,w1,z1), Q(a0,w0,z1)]],
    [n, [Q(a0,w1,z0), Q(a1,w1,z0), Q(a1,w1,z1), Q(a0,w1,z1)]],
    [neg(n), [Q(a0,w0,z0), Q(a1,w0,z0), Q(a1,w0,z1), Q(a0,w0,z1)]],
    [[0,0,1], [Q(a0,w0,z1), Q(a1,w0,z1), Q(a1,w1,z1), Q(a0,w1,z1)]] ];
  let s = '';
  for (const [nr, p] of fs){ if ((o.top === false && nr[2] === 1) || !vis(nr)) continue;
    s += op < 1 ? fill(pd(p), sh(nr, m), `fill-opacity="${op}"`) + ink(pd(p), wd) : shape(p, sh(nr, m), wd); }
  const pts = fs.flatMap(x => x[1]);
  return { svg: s, pts, box: fzBoxOf(pts) };
}
const fzDoorF = th => { const u = [Math.sin(th), Math.cos(th), 0], n = [Math.cos(th), -Math.sin(th), 0];
  return { u, n, Q: (a, w, z) => [CX1 + a*u[0] + w*n[0], a*u[1] + w*n[1], z] }; };   // hinge line at (x 59, y 0)
const fzTxB = (x, y, z, str, size) => `<text transform="${txM(P(x,y,z), Dv(0,1,0), Dv(0,0,-1))}" font-size="${size}" fill="${INK}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="700">${str}</text>`;
// a round fruit: seen the same from every side, so a shaded disc with a highlight
function fzBall(c, r, col){
  const [X, Y] = P(...c), R = r*Math.sqrt(1.5), mm = matOf(col);
  return { box: [c.map(v => v - r), c.map(v => v + r)], svg: `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(R)}" fill="${mm.m}"/>`
    + `<circle cx="${f(X - R*.18)}" cy="${f(Y - R*.2)}" r="${f(R*.72)}" fill="${col}"/>`
    + `<circle cx="${f(X - R*.38)}" cy="${f(Y - R*.4)}" r="${f(R*.18)}" fill="#ffffff" opacity=".55"/>`
    + `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(R)}" fill="none" stroke="${INK}" stroke-width=".8"/>` };
}
// food and drink, standing on c = [x, y, z of its base]
function fzFood(it, c){
  const [x, y, z] = c, cm = matOf(it.col);
  if (it.kind === 'carton'){ const w = it.w/2, d = it.d/2, h = it.h, am = matOf(it.acc);
    return { box: [[x-w-.1, y-d-.1, z], [x+w+.1, y+d+.1, z+h+2.5]], svg: box(x-w, y-d, z, x+w, y+d, z+h, cm, toneI, .8)
      + box(x-w-.05, y-d-.05, z+h*.4, x+w+.05, y+d+.05, z+h*.68, am, toneI, .6) + box(x-w+.6, y-.5, z+h, x+w-.6, y+.5, z+h+2.5, cm, toneI, .7) }; }
  if (it.kind === 'block'){ const w = it.w/2, d = it.d/2, h = it.h;
    let s = box(x-w, y-d, z, x+w, y+d, z+h, cm, toneI, .8);
    if (it.col === '#f6cf48') for (const [dx, dy, r] of [[-2, -1, .9], [1.5, 1.2, .7], [2.5, -1.5, .5]]) s += fill(pd(on(PZ(z+h+.05), ellUV(x+dx, y+dy, r, r, 10))), cm.d, 'opacity=".5"');
    return { box: [[x-w, y-d, z], [x+w, y+d, z+h]], svg: s }; }
  if (it.kind === 'jar'){ const r = it.r, h = it.h;
    return { box: [[x-r, y-r, z], [x+r, y+r, z+h+1.4]], svg: cyl(x, y, z, z+h, r, cm, toneI, .9, 18) + cyl(x, y, z+h, z+h+1.4, r*.92, METAL, toneI, .7, 18) }; }
  const r = it.r, h = it.h;   // bottle: body, shoulder, neck, cap
  return { box: [[x-r, y-r, z], [x+r, y+r, z+h]], svg: cyl(x, y, z, z+h*.62, r, cm, toneI, .9, 18)
    + rod([x, y, z+h*.62], [x, y, z+h*.8], r, cm, toneI, .8, r*.4, 18) + cyl(x, y, z+h*.8, z+h*.93, r*.4, cm, toneI, .7, 12)
    + cyl(x, y, z+h*.93, z+h, r*.46, matOf('#3d3935'), toneI, .6, 12) };
}

/* ---------- the condenser assembly on the back (discharge riser, coil, wire fins, brackets, filter drier) ---------- */
const DIS_OUT = [[CX0, 17, 17], [1.6, 17, 17], [1.6, 3, 19], [1.6, 3, 166], [.8, 6, 166]];
const COIL = fzSerp(.8, 6, 54, COIL_Z);
const DRY = [[.8, 54, 34], [1.6, 57, 32], [1.6, 57, 21], [CX0, 56, 20]];
function fzBack(st, run){
  const rear = facing([-1,0,0]), ph = st.flow % 6;
  const fins = xf => { let d = ''; for (let y = 8; y <= 52; y += 4) d += pd([[xf, y, 30], [xf, y, 170]], false);
    return `<path d="${d}" fill="none" stroke="${INK}" style="stroke-width:.55"/><path d="${d}" fill="none" stroke="#6a655e" style="stroke-width:.28"/>`; };
  let brk = ''; for (const y0 of [6, 51.5]) for (const z0 of [29.5, 168.5]) brk += box(.1, y0, z0, CX0, y0 + 2.5, z0 + 2, DARK, toneI, .6);
  const tube = fzJoin(fzPipe(DIS_OUT, COP.m, .5, run ? { ph, c0: HOT, c1: HOT } : null, 6, 5))
    + fzJoin(fzPipe(COIL, '#2e2b28', .45, run ? { ph, c0: HOT, c1: WARM } : null, 6, 6.6))
    + fzJoin(fzPipe(DRY, COP.m, .4, run ? { ph, c0: WARM, c1: WARM } : null, 6, 2))
    + rod([1.6, 57, 31], [1.6, 57, 22], 1.3, COP, toneI, .8);
  return rear ? brk + fins(1.4) + tube + fins(.2) : fins(.2) + tube + fins(1.4) + brk;
}

/* ---------- the fridge's inside: liner, shelves, crispers, cold plate, thermostat, food ---------- */
function fzFlyPos(it, t){
  const [bx, by, bz] = it.bag, [dx, dy, dz] = it.dest;
  const W = [[bx, by, bz], [bx, by, 34], [76, 78, dz + 2], [76, dy, dz + 2], [dx, dy, dz + 2], [dx, dy, dz]];
  const lens = W.slice(1).map((p, i) => Math.hypot(...sub(p, W[i]))), tot = lens.reduce((a, b) => a + b, 0);
  let s = ease(Math.max(0, Math.min(1, t))) * tot;
  for (let i = 0; i < lens.length; i++){ if (s <= lens[i] || i === lens.length - 1){ const k = lens[i] ? Math.min(1, s / lens[i]) : 1; return W[i].map((v, c) => v + (W[i + 1][c] - v) * k); } s -= lens[i]; }
  return W[W.length - 1];
}
function fzInside(st, flow){
  const parts = [], put = (b, svg) => parts.push({ box: b, svg }), lit = st.light;
  // fridge evaporator: the cold plate on the back wall, its channels bulging on the face toward the viewer
  { const xc = facing([1,0,0]) ? 10.15 : 8.85;
    let sv = box(LX0, 12, 130, 10, 48, 170, matOf('#dde2e3'), toneI, .8)
      + fzJoin(fzPipe(fzSerp(xc, 46, 14, PLATE_Z), '#c3cacd', .5, flow && { ...flow, c0: COLD, c1: COLD }, 6, 2.8));
    put([[8.6, 11.9, 129.9], [10.7, 48.1, 170.1]], sv); }
  put([[10, 12, 127], [13, 48, 128.8]], box(10, 12, 127, 13, 48, 128.8, LINER, toneI, .7));          // drain channel
  // thermostat's sensing bulb: capillary along the ceiling and down to two clips on the cold plate
  parts.push(...fzPipe([[38, 30, 171], [13, 30, 173], [11.6, 30, 171], [11.6, 30, 160], [11.6, 27.5, 158.5]], '#b9c0c3', .3, null, 3, 1.5));
  put([[10.75, 19.5, 157.6], [12.4, 27.6, 159.4]], box(10.75, 21.5, 157.5, 12.3, 22.5, 159.5, METAL, toneI, .5) + box(10.75, 25, 157.5, 12.3, 26, 159.5, METAL, toneI, .5)
    + rod([11.6, 27.5, 158.5], [11.6, 20, 158.5], .7, METAL, toneI, .6));
  // thermostat housing hanging from the ceiling: LED light panel and the temperature dial on its front
  { const fr = facing([1,0,0]), hs = box(38, 16, 168, 53, 44, 174, LINER, toneI, .9);
    let fc = box(53, 18, 169, 53.5, 30, 173, lit ? { l: LENS_ON, m: LENS_ON, d: '#f2e3a0' } : matOf('#d8dcd6'), toneI, .6)
      + cylX(53, 54.6, 37, 171, 2.2, CERAMIC, toneI, .8, 16);
    if (fr) fc += ink(pd([[54.65, 37, 171], [54.65, 37 - 1.4, 172.2]], false), .9);
    if (lit && fr) fc += `<circle cx="${f(P(53.6, 24, 171)[0])}" cy="${f(P(53.6, 24, 171)[1])}" r="9" fill="${LENS_ON}" opacity=".35"/>`;
    put([[38, 16, 168], [54.6, 44, 174]], fr ? hs + fc : fc + hs); }
  // glass shelves on ledges, each with a front trim
  for (const z of SHELF_Z) put([[12, HOLE[0], z - .4], [SHX1, HOLE[2], z + 1.2]],
    fzOB(FZW, 12, SHX1 - 2, HOLE[0], HOLE[2], z, z + .8, CLEAR, { op: .5, w: .7 }).svg + box(SHX1 - 2, HOLE[0], z - .4, SHX1, HOLE[2], z + 1.2, LINER, toneI, .7));
  // crisper drawers under the lowest shelf, with fruit and veg
  const veg = [[fzBall([24, 17, 82.6], 6, '#7cc05a'), fzBall([38, 11, 80.2], 3.4, '#e2483d'), fzBall([38, 22, 80.2], 3.4, '#9ccc3c')],
               [fzBall([22, 38, 79.8], 3, '#ef4c3a'), fzBall([31, 46, 79.8], 3, '#ef4c3a'), fzBall([40, 38, 79.8], 3, '#f08a2a')]];
  [[5, 29.5], [30.5, 55]].forEach(([y0, y1], i) => put([[13, y0, 76], [SHX1, y1, 94]],
    box(13, y0, 76, SHX1, y1, 76.8, LINER, toneI, .6) + byDepth(veg[i]) + fzOB(FZW, 13, SHX1, y0, y1, 76, 94, matOf('#e8f2f4'), { op: .38, w: .8, top: false }).svg
    + box(SHX1 - 1.4, y0 + 4, 90, SHX1 + .4, y1 - 4, 92.5, LINER, toneI, .7)));
  // a bowl of grapes already on the top shelf
  put([[16, 34, SHELF_Z[2] + .8], [28, 46, SHELF_Z[2] + 4.8]], cyl(22, 40, SHELF_Z[2] + .8, SHELF_Z[2] + 4.6, 6, CERAMIC, toneI, .9, 22)
    + fill(pd(on(PZ(SHELF_Z[2] + 4.7), ellUV(22, 40, 5, 5, 18))), '#7a3a6a'));
  // food put in so far, and the one on its way in (once it is inside the opening)
  for (let i = 0; i < st.food; i++) parts.push(fzFood(FOODS[i], FOODS[i].dest));
  if (st.fly && st.fly.t > 0){ const p = fzFlyPos(FOODS[st.fly.i], st.fly.t); if (p[0] <= CX1) parts.push(fzFood(FOODS[st.fly.i], p)); }
  return parts;
}
function fzInterior(st){
  const [y0, z0, y1, z1] = HOLE, x0 = LX0, x1 = CX1;
  const W5 = [[[1,0,0], [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]], [[0,1,0], [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]],
    [[0,-1,0], [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]], [[0,0,1], [[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]]]];
  let s = ''; for (const [nr, p] of W5) if (vis(nr)) s += shape(p, toneI(nr, LINER), .7);
  // shelf ledges moulded into the side walls
  for (const z of SHELF_Z) for (const [ya, yb] of [[y0, y0 + .8], [y1 - .8, y1]]) s += box(12, ya, z - 1.4, SHX1 - 2, yb, z, LINER, toneI, .5);
  s += byDepth(fzInside(st, null));
  if (st.light) s += fill(pd(on(PX(CX1), rectUV(y0, z0, y1, z1))), '#fff3c4', 'opacity=".14"');
  return s;
}

/* ---------- case: cabinet, doors, feet, hinges ---------- */
function fzCabinet(st, m, th){
  const FRONT = facing([1,0,0]), BACK = facing([-1,0,0]), fpl = on(PX(CX1), OUTC), bpl = on(PX(CX0), OUTC);
  let s = '';
  if (BACK){ const tb = tone([-1,0,0], m);
    s += fill(pd(bpl), tb);
    // vent panel over the machine compartment, and the rating label above the condenser
    s += shape(on(PX(CX0 - .12), rrUV(4, 7, 56, 27, 1.5)), mix(tb, '#000000', .28), 1);

  if (fzLoop) return; fzLoop = true;
  // dt floor: headless shots barely advance the clock between frames; a real screen's frames are longer than this anyway
  ui.animate(dt => { const st = ui.st; dt = Math.max(dt, 1/120);
    if (st.door !== st.doorT){ const g = Math.sign(st.doorT - st.door); st.door = Math.min(1, Math.max(0, st.door + g*dt/.8)); }
    st.light = st.door > .02;
    if (st.fly){ st.fly.t += dt / 1.8; if (st.fly.t >= 1){ st.food++; st.temp += .5; st.fly = null; } }
    const busy = st.door !== st.doorT || !!st.fly;
    if (!busy) fzLoop = false;
    return busy; });
}
function fzClock(){
  if (fzTick) return;
  const dt = .1;
  fzTick = setTimeout(() => { fzTick = 0; const st = ui.st;
    if (st.doorT === 0) st.ff = 0;
    const open = st.door > .05, ffOn = st.ff > 0 && st.door > .9;
    if (ffOn) st.ff -= dt;
    const sdt = dt * 6 * (ffOn ? 10 : 1);
    st.temp = Math.min(14, st.temp + sdt * ((open ? .05 : 0) - (st.run ? (open ? .03 : .045) : 0)));
    if (!st.run && st.temp >= 6){ st.run = true; ui.flash('6°C: the thermostat clicks on and the compressor starts', 2600); }
    if (st.run && st.temp <= 3){ st.run = false; st.temp = 3; ui.flash('3°C: the thermostat clicks off and the compressor stops', 2600); }
    if (st.run){ st.flow += dt * 14; st.vib += dt; }
    if (!fzLoop) ui.render();
    if (open || st.run || st.ff > 0) fzClock(); }, dt * 1000);
}
function fzOpen(st){
  if (st.doorT === 1) return ui.flash('The door is already open');
  st.doorT = 1; ui.flash('The door switch springs out and the light comes on', 2000); fzRun();
}
function fzPut(st){
  if (st.fly) return ui.flash('One thing at a time');
  if (st.food >= FOODS.length) return ui.flash('The shopping bag is empty');
  const wait = st.doorT !== 1 || st.door < .95; st.doorT = 1;
  st.fly = { i: st.food, t: wait ? -.5 : 0 }; fzRun();
}
function fzLeave(st){
  st.doorT = 1; st.ff = 1; ui.flash('A minute later: warm room air has poured in', 2200); fzRun();
}
function fzClose(st){
  if (st.fly) return ui.flash('Wait, the food is going in');
  if (st.doorT === 0) return ui.flash('The door is already shut');
  st.doorT = 0; fzRun();
}

ui = mountFigure({
  fig:'05', title:'Fridge',
  size:[110, 88, FH + 3], center:[34, 40], palette:'mint', turn:'full',
  // door 0 = shut .. 1 = open 95 deg; temp in C; run = compressor on; fly = food on its way from the bag to a shelf
  state:{ door:0, doorT:0, light:false, temp:4, run:false, food:0, fly:null, ff:0, flow:0, vib:0 },
  scene,
  stats: st => [{ label:'Fridge', value: st.temp.toFixed(1) + '°C' }, { label:'Compressor', value: st.run ? 'ON' : 'OFF', small: true }],
  buttons:[
    { label:'Open the door', onClick: st => fzOpen(st) },
    { label:'Put in food', onClick: st => fzPut(st) },
    { label:'Leave it open', onClick: st => fzLeave(st) },
    { label:'Close the door', onClick: st => fzClose(st) },
  ],
  acts:{ door: st => st.doorT ? fzClose(st) : fzOpen(st), bag: st => fzPut(st) },
  params:(st, q) => {
    if (q.get('open') === '1') st.door = st.doorT = 1;
    if (q.has('door')) st.door = st.doorT = Math.max(0, Math.min(1, +q.get('door') || 0));
    if (q.has('food')) st.food = Math.max(0, Math.min(FOODS.length, +q.get('food') | 0));
    if (q.has('temp')) st.temp = +q.get('temp') || 4;
    if (q.get('run') === '1'){ st.run = true; st.flow = 2; }
    st.light = st.door > .02;
  },
});
if (ui.st.door > 0 || ui.st.run) fzRun();
xrMount(() => ui, () => '');
</script></body></html>
