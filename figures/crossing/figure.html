<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Traffic light</title></head><body>
<script src="core.js"></script>
<script>
/* Traffic light: a puffin-style pedestrian crossing (1 unit = 1 cm).
   How it really works (and where the signal / current is after each step):
   1. Rest: cars green, red man. Mains from the street (buried cable) -> cutout -> RCD -> isolator -> power supply card
      in the controller's card rack. The lamp supply relay is closed; the CPU card drives each lamp through the lamp
      switch cards and an output relay; the multicore cable runs out through the gland plate, the underground duct, up
      inside the pole to the terminal block in the vehicle signal head, then to each LED driver and LED module.
   2. A pedestrian presses the button on the push-button unit (PBU, 1.1 m up the pole, facing the waiting person).
      The button's plunger closes a microswitch; the low-voltage push-button pair runs down the pole, through the duct
      to the terminal rail and the push-button input card. The controller latches the demand and lights WAIT
      (its own output, back up the multicore).
   3. After the minimum green the controller switches green off, amber on (about 3 s), then red, then a short all-red.
   4. Green man on the PBU's nearside display, the sounder bleeps, the tactile cone under the PBU spins (for blind
      people); WAIT goes out.
   5. Red man again; the on-crossing detector on top of the pole watches the crossing and holds the all-red while
      people are still on it. The kerbside detector watches the waiting area.
   6. Red + amber, then green: back to rest. A photocell on the head lets the controller dim the LEDs at night.
   Layout: road y 0..42 (traffic arrives from +x), kerb at y = 42, pavement y 42..167. Crossing studs at x 20 and 95,
   stop line at x 130; the pole stands just past the stop line, its vehicle head facing the oncoming cars (+x).
   Parts (each held by another):
   GROUND     road, stop line, crossing studs, kerb stones, paving slabs, cable duct (cabinet -> pole), mains cable
   CABINET    concrete plinth, case, roof, door (hinges, handle, lock, louvres, label, wiring-diagram pocket),
              mains cutout, RCD, isolator (rotary handle), manual panel (signals on/off switch), card rack (side plates,
              rails, backplane), power supply card, CPU card, two lamp switch cards, push-button input card, spare card,
              DIN rails, 8 output relays (lamp supply, R, A, G, red man, green man, WAIT, audible), terminal rail with
              terminal blocks, heater, gland plate with glands, looms
   POLE       pole, cap, ground collar, clamp bands, head brackets, signal multicore, push-button pair
   HEAD       backboard (white border), housing, three visors, red / amber / green LED modules, LED drivers, terminal
              block, photocell; on-crossing detector on the pole top; kerbside detector on its band
   PBU        case, hood, nearside red man / green man display (LED modules), WAIT lamp, button + bezel, plunger,
              microswitch, PBU board, sounder (grille on the side), cone motor, tactile cone */

/* ---------- geometry ---------- */
const PW = 170, KY = 42, PD = 167, PH = 12;              // pavement x 0..PW, y KY..PD, top at PH; road y 0..KY
const POX = 110, POY = 70, POR = 5.5, POT = 302;         // pole
const VXB = 117, VXH = 118.5, VXF = 140, VVIS = 12;      // vehicle head: backboard back, housing back, front, visor length
const VY0 = POY - 14, VY1 = POY + 14, VZ0 = 206, VZ1 = 290;
const BBY0 = POY - 22, BBY1 = POY + 22, BBZ0 = 197, BBZ1 = 299;
const LENS_R = 9.5;
const ASP = [ { k:'R', z:276, on:'#ff4a3a', off:'#4f2622', name:'RED' },
              { k:'A', z:248, on:'#ffb21e', off:'#54431f', name:'AMBER' },
              { k:'G', z:220, on:'#35e39a', off:'#1f4237', name:'GREEN' } ];
const BX0 = 101, BX1 = 119, BY0 = POY + POR, BY1 = 87, BZ0 = 96, BZ1 = 166;   // push-button unit
const BTNZ = 111;
const CX0 = 15, CX1 = 55, CY0 = 92, CY1 = 162, CZ0 = 17, CZ1 = 127;           // controller cabinet
const DY0 = 94, DY1 = 160, DZ0 = 21, DZ1 = 123, DOOR_MAX = 75;                  // door (hinge at y = DY0)
const IX0 = 17, IX1 = 53, IY0 = 94, IY1 = 160, IZ0 = 19, IZ1 = 125;             // cabinet inside

const PAVE = { l:'#e6e2d8', m:'#cdc8ba', d:'#a39d8e' }, KERBM = { l:'#d9d6cf', m:'#bdb9b0', d:'#8f8b82' };
const ASPH = { l:'#6e6a64', m:'#58544f', d:'#3d3a36' }, CONC = { l:'#dcd7ca', m:'#c2bcad', d:'#968f80' };
const HEADM = { l:'#4c4946', m:'#363331', d:'#211f1d' }, BBM = { l:'#3a3735', m:'#2a2826', d:'#1a1817' };
const PBUM = { l:'#eeece6', m:'#d2cfc6', d:'#a09c91' }, BTNM = matOf('#f2d14a');
const PCBM = { l:'#4fa36a', m:'#2f8a4a', d:'#1d5f31' }, PANELM = matOf('#b9bfc2'), RACKM = matOf('#9aa2a6');
const BAKE = matOf('#3f3a36'), WHITEM = matOf('#ecebe4'), RELM = matOf('#5b8fd6'), TERMM = matOf('#9aa0a4'), TERMY = matOf('#e0c040');
const DUCTM = matOf('#4a4642'), REDM = matOf('#d8402f'), CABIN = matOf('#cfd3cf');
const CARDS = [ { k:'PSU', y0:112, y1:120 }, { k:'CPU', y0:121, y1:127 }, { k:'LS1', y0:128, y1:134 },
                { k:'LS2', y0:135, y1:141 }, { k:'PBI', y0:142, y1:148 }, { k:'SPR', y0:149, y1:156 } ];
const RELAYS = ['SUP', 'R', 'A', 'G', 'RM', 'GM', 'WAIT', 'AUD'];

const tlB = (x0,y0,z0,x1,y1,z1) => [[x0,y0,z0],[x1,y1,z1]];
const tlCorners = (x0,y0,z0,x1,y1,z1) => { const o = []; for (const x of [x0,x1]) for (const y of [y0,y1]) for (const z of [z0,z1]) o.push([x,y,z]); return o; };
const tlBoxOf = (pts, e = .05) => [[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - e), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + e)];
const mw = w => `style="stroke-width:${w.toFixed(2)}"`;                    // a stroke in model units (not rescaled)
const tlDots = (plane, pts, r, col) => fill(pts.map(([u, v]) => pd(on(plane, ellUV(u, v, r, r, 8)))).join(''), col);

/* ---------- signal state ---------- */
const PHASES = {
  green:    { lamps:['G','RM'] },
  amber:    { lamps:['A','RM'], d:2.4, next:'red' },
  red:      { lamps:['R','RM'], d:1.0, next:'walk' },
  walk:     { lamps:['R','GM'], d:4.8, next:'clear' },
  clear:    { lamps:['R','RM'], d:1.6, next:'redamber' },
  redamber: { lamps:['R','A','RM'], d:1.2, next:'green' },
  start:    { lamps:['R','RM'], d:1.5, next:'redamber' },
};
const lampsOn = st => st.sig ? new Set([...PHASES[st.ph].lamps, ...(st.wait ? ['WAIT'] : []), ...(st.ph === 'walk' ? ['AUD'] : []), 'SUP']) : new Set();
const beepOn = st => st.sig && st.ph === 'walk' && (st.t % .24) < .12;

/* ---------- ground ---------- */
function road(){
  let s = box(0, 0, 0, PW, KY, 2, ASPH, tone, 1);
  s += fill(pd(on(PZ(2.05), rectUV(128, 3, 132, KY - 3))), '#f1eee4');                            // stop line
  for (const x of [20, 95]) for (let y = 5; y < KY - 2; y += 8)                                   // crossing studs
    s += shape(on(PZ(2.1), rectUV(x - 1.6, y - 1.6, x + 1.6, y + 1.6)), '#dfe2e2', .5);
  return s;
}
function pavement(){
  let s = box(0, KY, 0, PW, PD, PH, PAVE, tone, 1);
  s += shape(on(PZ(PH + .03), rectUV(0, KY, PW, KY + 15)), KERBM.l, .9);                          // kerb stones
  let j = ''; for (let x = 50; x < PW; x += 50) j += pd([[x, KY, PH + .05], [x, KY + 15, PH + .05]], false);
  for (let x = 45; x < PW; x += 45) j += pd([[x, KY + 15, PH + .05], [x, PD, PH + .05]], false);
  for (const y of [KY + 60, KY + 105, KY + 150]) j += pd([[0, y, PH + .05], [PW, y, PH + .05]], false);
  if (facing([0,-1,0])) for (let x = 50; x < PW; x += 50) j += pd([[x, KY - .05, 2], [x, KY - .05, PH]], false);
  s += `<path d="${j}" fill="none" stroke="${INK}" stroke-width=".6" opacity=".55"/>`;
  return s;
}
function shadows(st){
  const ring = (z, r) => on(PZ(z), ellUV(POX, POY, r, r, 12));
  let s = castShadow(tlCorners(CX0 - 2, CY0 - 2, PH, CX1 + 2, CY1 + 2, CZ1 + 4), PH)
    + castShadow([...ring(PH, POR), ...ring(POT, POR)], PH)
    + castShadow(tlCorners(VXB, BBY0, BBZ0, VXF + VVIS, BBY1, BBZ1), PH)
    + castShadow(tlCorners(BX0, BY0, BZ0, BX1, BY1, BZ1), PH);
  if (st.door > .005){ const d = doorGeo(st); s += castShadow([...d.A, ...d.B], PH); }
  return clipTo(on(PZ(PH), rectUV(0, KY, PW, PD)), s);
}

/* ---------- pole ---------- */
function pole(m){
  let s = cyl(POX, POY, PH, PH + 2, POR + 2, CONC, tone, 1, 24);                                     // ground collar
  s += cyl(POX, POY, PH + 2, POT, POR, m, tone, 1.8, 24);
  s += cyl(POX, POY, POT, POT + 2.5, POR + .8, m, tone, 1.1, 24);                                    // cap
  for (const z of [102, 160, 218, 240, 278]) s += cyl(POX, POY, z - 1.6, z + 1.6, POR + .5, METAL, toneI, .8, 24);   // clamp bands
  return s;
}
const brackets = () => [218, 278].map(z => box(POX + POR, POY - 3, z - 2.2, VXB, POY + 3, z + 2.2, METAL, toneI, .8)).join('');
function kerbDetector(){
  let s = box(105, BY0, 236, 115, 83, 244, HEADM, tone, .9);
  if (facing([0,1,0])) s += shape(on(PY(83.05), ellUV(110, 239.6, 2.4, 2.4, 14)), '#2b3a46', .6) + fill(pd(on(PY(83.1), ellUV(109.3, 240.4, .7, .7, 8))), '#ffffff', 'opacity=".5"');
  return s;
}
function topDetector(){
  let s = rod([POX, POY, POT + 2.5], [POX, POY, POT + 6], 1.2, METAL, toneI, .8);
  s += box(POX - 12, POY - 5, POT + 6, POX + 2, POY + 5, POT + 13, HEADM, tone, 1);
  if (facing([-1,0,0])) s += shape(on(PX(POX - 12.05), ellUV(POY, POT + 9.5, 2.6, 2.6, 14)), '#2b3a46', .6);
  return s;
}

/* ---------- vehicle signal head ---------- */
const LEDS = (() => { const o = [[0,0]]; for (const [r, n, a] of [[3.3, 6, 0], [6.5, 12, .26]]) for (let i = 0; i < n; i++){ const t = i/n*2*Math.PI + a; o.push([r*Math.cos(t), r*Math.sin(t)]); } return o; })();
function backboard(){
  const P2 = rrUV(BBY0, BBZ0, BBY1, BBZ1, 4);
  let s = extrude(P2, VXB, VXH, BBM);
  if (facing([1,0,0])) s += fill(pd(on(PX(VXH), P2)), '#f1eee4') + fill(pd(on(PX(VXH + .02), rrUV(BBY0 + 2.6, BBZ0 + 2.6, BBY1 - 2.6, BBZ1 - 2.6, 2.5))), BBM.m) + ink(pd(on(PX(VXH), P2)), 1.1);
  if (facing([-1,0,0])) s += fill(pd(on(PX(VXB), P2)), tone([-1,0,0], BBM)) + ink(pd(on(PX(VXB), P2)), 1.1);
  return s + hullInk([...on(PX(VXB), P2), ...on(PX(VXH), P2)], 2.2);
}
function housing(st){
  const P2 = rrUV(VY0, VZ0, VY1, VZ1, 3), lit = lampsOn(st);
  let s = extrude(P2, VXH, VXF, HEADM);
  if (facing([1,0,0])){
    s += fill(pd(on(PX(VXF), P2)), tone([1,0,0], HEADM)) + ink(pd(on(PX(VXF), P2)), 1.2);
    for (const a of ASP){ const on1 = lit.has(a.k), pl = PX(VXF + .1);
      s += shape(on(PX(VXF + .05), ellUV(POY, a.z, LENS_R + 1.3, LENS_R + 1.3, 28)), '#191715', .8);
      s += fill(pd(on(pl, ellUV(POY, a.z, LENS_R, LENS_R, 28))), on1 ? a.on : a.off);
      s += tlDots(PX(VXF + .14), LEDS.map(([u, v]) => [POY + u, a.z + v]), .95, on1 ? mix(a.on, '#ffffff', .55) : mix(a.off, '#ffffff', .08));
      if (on1) s += fill(pd(on(PX(VXF + .16), ellUV(POY, a.z, LENS_R*1.55, LENS_R*1.55, 28))), a.on, 'opacity=".28"');
      s += fill(pd(on(PX(VXF + .18), arcUV(POY, a.z, LENS_R*.72, 100, 160, 6).concat(arcUV(POY, a.z, LENS_R*.55, 160, 100, 6)))), '#ffffff', 'opacity=".32"');
    }
  }
  s += hullInk([...on(PX(VXH), P2), ...on(PX(VXF), P2)], 2.2);
  s += cyl(131, POY, VZ1, VZ1 + 3, 2.2, CERAMIC, toneI, .9, 16);                                      // photocell
  return s;
}
function visor(a, lit){
  const R = LENS_R + 1.6, n = 12, a0 = -12, a1 = 192, th = i => (a0 + (a1 - a0)*i/n)*Math.PI/180;
  const pt = (x, t) => [x, POY + R*Math.cos(t), a.z + R*Math.sin(t)];
  let inner = '', outer = '', edges = ''; const vs = [];
  for (let i = 0; i < n; i++){ const t0 = th(i), t1 = th(i + 1), tm = (t0 + t1)/2, nr = [0, Math.cos(tm), Math.sin(tm)];
    const q = [pt(VXF, t0), pt(VXF + VVIS, t0), pt(VXF + VVIS, t1), pt(VXF, t1)], ov = vis(nr); vs.push(ov);
    if (ov) outer += face(pd(q), tone(nr, HEADM)); else inner += face(pd(q), lit ? mix(HEADM.d, a.on, .3) : HEADM.d); }
  for (let i = 0; i <= n; i++) if (i === 0 || i === n || vs[i - 1] !== vs[i]) edges += pd([pt(VXF, th(i)), pt(VXF + VVIS, th(i))], false);
  return inner + outer + ink(edges, .9) + ink(pd(Array.from({length: n + 1}, (_, i) => pt(VXF + VVIS, th(i))), false), 1.1);
}

/* ---------- push-button unit (with the nearside red man / green man display) ---------- */
function man(plane, u0, v0, w, h, walking, col){
  const cu = u0 + w/2, U = (du, dv) => plane([cu + du*h, v0 + dv*h]);
  const torso = walking ? [[.03, .68], [-.03, .43]] : [[0, .68], [0, .43]];
  const limbs = walking
    ? [[[-.03, .44], [-.18, .25], [-.24, .06]], [[-.03, .44], [.1, .25], [.18, .07]], [[.02, .66], [.18, .5]], [[.02, .66], [-.15, .5]]]
    : [[[-.05, .44], [-.06, .06]], [[.05, .44], [.06, .06]], [[-.08, .66], [-.11, .42]], [[.08, .66], [.11, .42]]];
  const hc = walking ? [.05, .84] : [0, .84];
  const head = Array.from({length: 12}, (_, i) => { const t = i/12*2*Math.PI; return U(hc[0] + .085*Math.cos(t), hc[1] + .085*Math.sin(t)); });
  const sk = (pts, wd) => `<path d="${pts.map(seg => pd(seg.map(([a, b]) => U(a, b)), false)).join('')}" fill="none" stroke="${col}" ${mw(wd)} stroke-linecap="round" stroke-linejoin="round"/>`;
  return sk([torso], h*.2) + sk(limbs, h*.11) + fill(pd(head), col);
}
const RM_ON = '#ff4a3a', RM_OFF = '#4a2a26', GM_ON = '#4df08a', GM_OFF = '#21392c';
function pbuFront(st, plane, dy){
  const lit = lampsOn(st);
  let s = shape(on(plane(dy), rrUV(102.5, 131, 117.5, 163.5, 1.5)), '#1d1a18', .9);
  s += fill(pd(on(plane(dy + .02), rectUV(104, 148.5, 116, 162))), lit.has('RM') ? '#3a1612' : '#221d1b');
  s += fill(pd(on(plane(dy + .02), rectUV(104, 132.5, 116, 146))), lit.has('GM') ? '#123a20' : '#1d211e');
  s += man(plane(dy + .05), 104, 149, 12, 12.5, false, lit.has('RM') ? RM_ON : RM_OFF);
  s += man(plane(dy + .05), 104, 133, 12, 12.5, true, lit.has('GM') ? GM_ON : GM_OFF);
  s += shape(on(plane(dy), rectUV(103.5, 119, 116.5, 128)), '#1d1a18', .8);
  if (lit.has('WAIT')) s += fill(pd(on(plane(dy + .02), rectUV(103.5, 119, 116.5, 128))), '#ffb21e', 'opacity=".25"');
  s += txY(110, dy + .1, 121.6, 'WAIT', 4.3, lit.has('WAIT') ? '#ffc23a' : '#4a4034', 800);
  s += txY(110, dy + .1, 103.4, 'PUSH BUTTON', 2.1, INK, 800);
  s += shape(on(plane(dy + .03), ellUV(110, BTNZ, 4.6, 4.6, 20)), '#2a2724', .8);
  return s;
}
function pbuButton(st){ const ext = st.btnT > 0 ? 1 : 2.4;
  return act('pbtn', rod([110, BY1, BTNZ], [110, BY1 + ext, BTNZ], 3.2, BTNM, toneI, 1, 3.2, 20)); }
function cone(st){
  let s = rod([110, 82, BZ0], [110, 82, BZ0 - 5.5], 2.4, METAL, toneI, .8, .5, 16);
  for (const k of [0, 1, 2]){ const c = st.cone + k*2.094, d = [Math.cos(c), Math.sin(c), .4];
    if (vis(d)) s += ink(pd([[110 + 2.3*Math.cos(c), 82 + 2.3*Math.sin(c), BZ0 - .3], [110 + .5*Math.cos(c), 82 + .5*Math.sin(c), BZ0 - 5.2]], false), .7); }
  return s;
}
function pbu(st){
  const FY = facing([0,1,0]), FXp = facing([1,0,0]);
  let body = box(BX0, BY0, BZ0, BX1, BY1, BZ1, PBUM, tone, 1) + hullInk(tlCorners(BX0, BY0, BZ0, BX1, BY1, BZ1), 2);
  if (FXp){ let g = ''; for (const y of [79, 80.5, 82, 83.5, 85]) g += pd([[BX1 + .05, y, 106], [BX1 + .05, y, 115]], false); body += ink(g, 1); }
  const hood = box(102, BY1, 163.5, 118, BY1 + 4, 165, PBUM, tone, .7), btn = pbuButton(st), cn = cone(st);
  return FY ? cn + body + pbuFront(st, PY, BY1 + .05) + btn + hood : btn + hood + cn + body;
}

/* ---------- controller cabinet ---------- */
function doorGeo(st){
  const a = ease(st.door)*DOOR_MAX*Math.PI/180, sa = Math.sin(a), ca = Math.cos(a), DW = DY1 - DY0;
  const Pt = (s, z, off = 0) => [CX1 + s*sa + off*ca, DY0 + s*ca - off*sa, z];
  const ring = z => [Pt(0, z, 0), Pt(DW, z, 0), Pt(DW, z, -2), Pt(0, z, -2)];
  return { a, sa, ca, DW, Pt, A: ring(DZ0), B: ring(DZ1), no: [ca, -sa, 0] };
}
function doorFace(g){
  const { Pt, DW, sa, ca } = g, o = .06;
  let s = ink(pd([Pt(0, DZ0, o), Pt(DW, DZ0, o), Pt(DW, DZ1, o), Pt(0, DZ1, o)]), 1.5);
  let lv = ''; for (let z = 30; z <= 44; z += 3.5) lv += pd([Pt(18, z, o), Pt(48, z, o)], false);
  s += ink(lv, 1);
  s += shape([Pt(15, 103, o), Pt(51, 103, o), Pt(51, 114, o), Pt(15, 114, o)], '#f1eee4', .8);
  const tq = P(...Pt(33, 107.4, o + .05));
  s += `<text transform="${txM(tq, Dv(-sa, -ca, 0), Dv(0, 0, -1))}" font-size="3" fill="${INK}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em">TRAFFIC SIGNALS</text>`;
  s += rod(Pt(DW - 6, 88, 0), Pt(DW - 6, 88, .9), 1.3, METAL, toneI, .7, 1.3, 12);                    // lock
  for (const z of [34, 102]) s += rod(Pt(-.2, z, 1), Pt(-.2, z + 9, 1), 1.1, METAL, toneI, .7, 1.1, 10);   // hinges
  return s;
}
const doorHandle = g => rod(g.Pt(g.DW - 6, 76, 0), g.Pt(g.DW - 6, 76, 2.4), 1.2, DARK, toneI, .8, 1.2, 12) + rod(g.Pt(g.DW - 6, 76, 2.4), g.Pt(g.DW - 6, 67, 2.4), .9, DARK, toneI, .8, .9, 10);
function doorInner(g){
  const { Pt } = g, o = -2.06;
  let s = shape([Pt(10, 56, o), Pt(56, 56, o), Pt(56, 114, o), Pt(10, 114, o)], '#c9ccc4', .8);        // document pocket
  s += shape([Pt(13, 64, o - .05), Pt(53, 64, o - .05), Pt(53, 112, o - .05), Pt(13, 112, o - .05)], '#f4f1e6', .6);   // wiring diagram
  let l = ''; for (let z = 70; z <= 106; z += 6) l += pd([Pt(16, z, o - .1), Pt(50, z, o - .1)], false) + pd([Pt(20 + (z % 12), z, o - .1), Pt(20 + (z % 12), z - 4, o - .1)], false);
  s += `<path d="${l}" fill="none" stroke="#5a7aa8" stroke-width=".6"/>`;
  return s + ink(pd([Pt(2, DZ0 + 2, o), Pt(64, DZ0 + 2, o), Pt(64, DZ1 - 2, o), Pt(2, DZ1 - 2, o)]), .6);
}
function doorItem(st, m){
  const g = doorGeo(st), outV = vis(g.no), inV = vis(g.no.map(v => -v));
  let s = (outV ? '' : doorHandle(g)) + loft(g.A, g.B, n => tone(n, m)) + fill(pd(g.B), tone([0,0,1], m)) + ink(pd(g.B), .9);
  if (outV) s += doorFace(g) + doorHandle(g);
  if (inV) s += doorInner(g);
  s += hullInk([...g.A, ...g.B], 2.2);
  const b = tlBoxOf([...g.A, ...g.B]); b[0][0] = Math.max(b[0][0], CX1 + 2);
  return { box: b, svg: act('door', s) };
}
function cabWalls(){
  const c = n => mix(toneI(n, CABIN), '#f2efe7', .2), F = [
    [[1,0,0],  [[IX0,IY0,IZ0],[IX0,IY1,IZ0],[IX0,IY1,IZ1],[IX0,IY0,IZ1]]],

    { at:[110, BY1, 140], text:'GREEN MAN', on:lit.has('GM') }, { at:[110, 82, 91], text:'TACTILE CONE', on:st.sig && st.ph === 'walk' },
    { at:[CX1, 140, 100], text:'CONTROLLER CABINET', on:st.door > .5 }, { at:[POX - 12, POY, POT + 9.5], text:'ON-CROSSING DETECTOR', on:false },
    { at:[110, 83, 240], text:'KERBSIDE DETECTOR', on:false }, { at:[VXH, BBY1, 250], text:'BACKBOARD', on:false },
    { at:[POX, POY + POR, 190], text:'POLE', on:false }, { at:[130, 20, 2], text:'STOP LINE', on:false },
    { at:[20, 21, 2], text:'CROSSING STUDS', on:false }, { at:[80, KY, PH], text:'KERB', on:false } ];
}
function scene(st, m){
  const k = ease(st.xr || 0);
  let s = byDepth([{ box: tlB(0, 0, 0, PW, KY, 2), svg: road() }, { box: tlB(0, KY, 0, PW, PD, PH), svg: pavement() }]);
  s += shadows(st);
  const body = byDepth(objects(st, m));
  s += k > 0 ? `<g opacity="${f(1 - .8*k)}">${body}</g><g opacity="${f(k)}">${mech(st)}</g>` : body;
  s += soundArcs(st);
  s += xrCallouts(k > .6 ? insideLabels(st) : surfaceLabels(st), XR_B);
  return s;
}

/* ---------- behaviour (one state object, one clock) ---------- */
let tlUI = null, tlLoop = false, tlAudio = null;
function tlAudioInit(){ try { if (!tlAudio && window.AudioContext) tlAudio = new AudioContext(); if (tlAudio && tlAudio.state === 'suspended') tlAudio.resume(); } catch (e) { tlAudio = null; } }
function tlBeep(){ try { if (!tlAudio) return; const t = tlAudio.currentTime, o = tlAudio.createOscillator(), g = tlAudio.createGain();
  o.type = 'square'; o.frequency.value = 2300; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.04, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + .1);
  o.connect(g); g.connect(tlAudio.destination); o.start(t); o.stop(t + .11); } catch (e) {} }
function tlSet(st, ph){ st.ph = ph; st.t = 0; st.beat = -1;
  if (ph === 'walk') st.wait = false;
  if (ph === 'green' && st.wait) st.hold = 1.5; }                                    // a demand made late: served after the next minimum green
function tlStep(st, dt){
  st.clock += dt; st.btnT = Math.max(0, st.btnT - dt);
  if (st.door !== st.doorT) st.door = Math.min(1, Math.max(0, st.door + Math.sign(st.doorT - st.door)*dt/1.1));
  if (st.pulse >= 0){ st.pulse += dt/.9; if (st.pulse >= 1){ st.pulse = -1; st.wait = true; if (st.ph === 'green') st.hold = .6; } }
  if (st.hold > 0){ st.hold -= dt; if (st.hold <= 0){ st.hold = 0; if (st.ph === 'green' && st.sig) tlSet(st, 'amber'); } }
  const ph = PHASES[st.ph];
  if (st.sig && ph.d){ st.t += dt; if (st.t >= ph.d) tlSet(st, ph.next); }
  if (st.sig && st.ph === 'walk'){ st.cone += dt*5; const b = Math.floor(st.t / .24); if (b !== st.beat){ st.beat = b; tlBeep(); } }
}
function tlRun(){
  if (tlLoop || tlUI.st.freeze) return; tlLoop = true;
  tlUI.animate(dt => { const st = tlUI.st; tlStep(st, dt);
    const busy = (st.sig && st.ph !== 'green') || st.pulse >= 0 || st.hold > 0 || st.btnT > 0 || st.door !== st.doorT || (st.door > 0 && st.sig) || st.xr > 0;
    if (!busy) tlLoop = false; return busy; });
}
function tlPress(st, ui){
  st.btnT = .25; tlAudioInit();
  if (!st.sig) ui.flash('The signals are switched off at the cabinet');
  else if (st.ph === 'walk') ui.flash('The green man is on: cross now');
  else if (st.wait || st.pulse >= 0 || st.ph === 'amber' || st.ph === 'red') ui.flash('Already pressed: wait for the green man');
  else st.pulse = 0;
  tlRun();
}
function tlDoor(st){ st.doorT = st.doorT ? 0 : 1; tlRun(); }
function tlSig(st, ui){
  st.sig = !st.sig;
  if (!st.sig){ st.ph = 'green'; st.t = 0; st.wait = false; st.pulse = -1; st.hold = 0; ui.flash('Signals off: the lamp supply relay opens'); }
  else { tlSet(st, 'start'); ui.flash('Signals on: start-up all-red, then green'); }
  tlRun();
}

tlUI = mountFigure({
  fig:'21', title:'Traffic light',
  size:[PW, PD, POT + 14], palette:'mint',
  state:{ ph:'green', t:0, beat:-1, wait:false, pulse:-1, hold:0, btnT:0, door:0, doorT:0, sig:true, cone:0, clock:0 },
  scene,
  buttons:[
    { label:'Press the button', onClick:(st, ui) => tlPress(st, ui) },
    { label:'Open / close the cabinet', onClick:(st) => tlDoor(st) },
    { label:'Signals off / on', onClick:(st, ui) => tlSig(st, ui) },
  ],
  acts:{ pbtn:(st, el, ui) => tlPress(st, ui), door:(st) => tlDoor(st), panel:(st, el, ui) => tlSig(st, ui) },
  params:(st, q) => {
    if (PHASES[q.get('ph')]) st.ph = q.get('ph');
    if (q.has('t')) st.t = +q.get('t');
    if (q.get('door') === '1') st.door = st.doorT = 1;
    if (q.get('sig') === '0') st.sig = false;
    if (q.get('wait') === '1') st.wait = true;
    if (q.has('pulse')) st.pulse = +q.get('pulse');
    if (q.has('cone')) st.cone = +q.get('cone');
    if (q.get('freeze') === '1') st.freeze = true;
  },
});
xrMount(() => tlUI, () => '');
if (tlUI.st.ph !== 'green' || tlUI.st.pulse >= 0) tlRun();
</script></body></html>
