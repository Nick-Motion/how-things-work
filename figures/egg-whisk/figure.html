<!doctype html>
<html lang="en" data-errors=""><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Egg whisk</title><style>@media(min-width:561px){#stats{flex-direction:row;align-items:flex-start;gap:20px}}</style></head><body>
<script src="core.js"></script>
<script>
/* Truth first. 2016 page 44, also 1998 page 44, names a hand-driven double-sided crown wheel.
   The crank and crown share an axle. Opposite toothed faces drive two vertical bevel pinions.
   Each pinion is fixed to its beater shaft, so the beaters turn faster and in opposite directions.
   The frame holds the crank axle in side bearings and both output shafts in its lower bridge.
   The holding hand supports the top grip. Lift raises that hand and the entire tool by 27 units.
   The bowl and mixture remain on the board. Only immersed, rotating beaters agitate the mixture.
   Teaching adaptation. Enlarged simplified teeth and illustrative 32:8 ratio, not a measured reconstruction.
   Bowl, mixture, holding hand, reset and input speed controls stage the lesson. There is no lift mechanism,
   motor, speed selector or invented gearbox. 1988 remains inaccessible and unverified.
   Parts. Structure has frame, top grip, axle bearings and lower shaft bearings.
   Drive has crank grip, crank arm, crank axle, crown wheel with two toothed faces, two bevel pinions.
   Outputs have two shafts, two beater collars and two sets of wire loops. All are attached as above.
   Anatomy labels exclude the hand, bowl, mixture and motion overlays. Declared minimum is 10.
*/
const ewGear={wheel:32,pinion:8,radius:16,pinionRadius:4,axle:[45,45,74],shafts:[38.8,51.2]};
const ewState={angle:.2,running:false,speed:1,lift:0,liftTarget:0,mixed:0};
const ewAngles=st=>({crown:st.angle,left:4*st.angle,right:-4*st.angle});
const ewBounds=(pts,r=0)=>[[0,1,2].map(i=>Math.min(...pts.map(p=>p[i]))-r),[0,1,2].map(i=>Math.max(...pts.map(p=>p[i]))+r)];
function ewScene(st,m){
 const ewParts=[],ewLabels=[],ewFarWalls=[],ewNearWalls=[],ewRise=27*ease(st.lift),ewXr=ease(st.xr||0),ewA=ewAngles(st);
 const ewPoint=p=>[p[0],p[1],p[2]+ewRise];
 const ewPut=(pts,svg,r=0)=>ewParts.push({box:ewBounds(pts,r),svg});
 const ewLabel=(p,text,on=false)=>ewLabels.push({at:ewPoint(p),text,on});
 const ewRod=(a,b,r,material,ghost=false)=>{a=ewPoint(a);b=ewPoint(b);ewPut([a,b],`<g opacity="${ghost?1-.8*ewXr:1}">${rod(a,b,r,material,toneI,.85,r,12)}</g>`,r);};
 const ewWire=(pts)=>{for(let i=1;i<pts.length;i++){const a=ewPoint(pts[i-1]),b=ewPoint(pts[i]);ewPut([a,b],`<path d="${pd([a,b],false)}" fill="none" stroke="${INK}" style="stroke-width:.85" stroke-linecap="round"/><path d="${pd([a,b],false)}" fill="none" stroke="${METAL.l}" style="stroke-width:.38" stroke-linecap="round"/>`,.45);}};
 let ewSvg=board(10,10,82,80,2,5,WOOD);
 ewSvg+=castShadow([[25,25,20],[65,25,20],[65,65,20],[25,65,20],[32,45,102+ewRise],[58,45,102+ewRise]],2,boardTop(10,10,82,80,2,5));
 // The open bowl is split into wall segments so its near wall occludes submerged beaters from every yaw.
 for(let i=0;i<48;i++){
  const a=i*Math.PI/24,b=(i+1)*Math.PI/24;
  const q=[[45+13*Math.cos(a),45+13*Math.sin(a),4],[45+25*Math.cos(a),45+25*Math.sin(a),29],[45+25*Math.cos(b),45+25*Math.sin(b),29],[45+13*Math.cos(b),45+13*Math.sin(b),4]];
  const nr=[Math.cos((a+b)/2),Math.sin((a+b)/2),-.48];
  const near=vis([nr[0],nr[1],0]);
  const col=near?tone(nr,m):mix(m.l,'#ffffff',.55);
  const wall=shape(q,col,.3)+line([q[1],q[2]],1.4);
  (near?ewNearWalls:ewFarWalls).push(`<g opacity="${1-.87*ewXr}">${wall}</g>`);
 }
 const ewMixture=`<g opacity="${1-.87*ewXr}">${shape(on(PZ(20.5),ellUV(45,45,20.8,20.8,48)),mix('#f2cc64','#fff3ca',Math.min(.75,st.mixed/15)),.6)}</g>`;
 if(st.running&&27*ease(st.lift)<9.5){
  for(const [i,x] of ewGear.shafts.entries()){
   const a=(i?-1:1)*st.angle*4;
   const pts=Array.from({length:22},(_,j)=>{const t=a+j/21*4.8;return[x+(5+j/21*2)*Math.cos(t),45+(5+j/21*2)*Math.sin(t),20.7];});
   ewPut(pts,`<path d="${pd(pts,false)}" fill="none" stroke="#e6a93e" stroke-width="1.2" stroke-linecap="round"/>`);
  }
 }
 for(const x of [32,58]){
  for(const [z0,z1] of [[52,64],[64,74],[74,88],[88,100]])ewRod([x,45,z0],[x,45,z1],1.1,METAL,true);
  ewRod([x-1.4,45,74],[x+1.4,45,74],2.4,DARK,true);
 }
 ewRod([32,45,52],[58,45,52],1.4,METAL,true);
 ewRod([32,45,100],[58,45,100],1.4,METAL);
 ewRod([35,45,100],[55,45,100],3.2,m);
 ewRod([30,45,74],[66,45,74],1.05,METAL);
 ewLabel([35,45,100],'TOP GRIP');ewLabel([32,45,90],'SUPPORT FRAME');
 ewLabel([58,45,74],'AXLE BEARING');ewLabel([54,45,74],'CRANK AXLE',st.running);
 // Both toothed faces share one crown body and one phase.
 const ewRing=(x,r)=>Array.from({length:64},(_,i)=>{const a=i*Math.PI/32+st.angle;return ewPoint([x,45+r*Math.cos(a),74+r*Math.sin(a)]);});
 const ewBodyA=ewRing(44,14.8),ewBodyB=ewRing(46,14.8),ewNear=vis([1,0,0])?ewBodyB:ewBodyA;
 let ewDisc=loft(ewBodyA,ewBodyB,n=>toneI(n,METAL))+shape(ewNear,toneI([vis([1,0,0])?1:-1,0,0],METAL),1.1);
 const ewFaceX=vis([1,0,0])?46.05:43.95;
 for(let i=0;i<4;i++){
  const a=st.angle+i*Math.PI/2;
  ewDisc+=line([ewPoint([ewFaceX,45+3*Math.cos(a),74+3*Math.sin(a)]),ewPoint([ewFaceX,45+12*Math.cos(a),74+12*Math.sin(a)])],1.5);
 }
 ewPut([...ewBodyA,...ewBodyB],`<g opacity="${1-.86*ewXr}">${ewDisc}</g>`);
 for(const side of [-1,1])for(let i=0;i<32;i++){
  const a=st.angle+i*Math.PI/16,da=Math.PI/64;
  const ring=(r,x)=>[a-da,a+da].map(t=>ewPoint([x,45+r*Math.cos(t),74+r*Math.sin(t)]));
  const a0=ring(14.5,45+side),a1=ring(16.9,45+side),b0=ring(14.5,45+side*2.2),b1=ring(16.9,45+side*2.2);
  const q=[...a0,...a1,...b0,...b1];
  const faces=[[a0[0],a0[1],a1[1],a1[0]],[b0[0],b0[1],b1[1],b1[0]],[a0[0],a1[0],b1[0],b0[0]],[a0[1],a1[1],b1[1],b0[1]],[a1[0],a1[1],b1[1],b1[0]]];
  ewPut(q,byDepth(faces.map(p=>({box:ewBounds(p),svg:shape(p,toneI(norm(cross(sub(p[1],p[0]),sub(p[2],p[0]))),METAL),.35)}))));
 }
 ewLabel([45,45,87],'CROWN WHEEL',st.running);
 ewLabel([42.8,57,84],'LEFT TOOTHED FACE',st.running);ewLabel([47.2,34,85],'RIGHT TOOTHED FACE',st.running);
 for(const [i,x] of ewGear.shafts.entries()){
  const angle=i?ewA.right:ewA.left;
  const rings=[55.3,60.7].map((z,j)=>Array.from({length:32},(_,n)=>{const a=angle+n*Math.PI/16,r=(j?3:4.7)*(n%4===0?1.08:1);return ewPoint([x+r*Math.cos(a),45+r*Math.sin(a),z]);}));
  const gear=loft(rings[0],rings[1],n=>toneI(n,matOf('#d9a54c')))+shape(rings[1],matOf('#d9a54c').l,.7);
  ewPut(rings.flat(),gear);
  for(let n=0;n<8;n++){
   const a=angle+n*Math.PI/4;
   const p=[ewPoint([x+4.9*Math.cos(a),45+4.9*Math.sin(a),55.3]),ewPoint([x+3.25*Math.cos(a),45+3.25*Math.sin(a),60.7])];
   ewPut(p,line(p,.7),.4);
  }
  ewRod([x,45,32],[x,45,61],.72,METAL);
  ewRod([x,45,50.5],[x,45,53.5],1.9,DARK,true);
  ewRod([x,45,30],[x,45,33],1.65,METAL);
  for(let n=0;n<3;n++){
   const a=angle+n*Math.PI/3;
   const pts=Array.from({length:33},(_,j)=>{const t=j*Math.PI/16;return[x+4.25*Math.sin(t)*Math.cos(a),45+4.25*Math.sin(t)*Math.sin(a),21+10*Math.cos(t)];});
   ewWire(pts);
  }
  ewLabel([x,45,58],i?'RIGHT BEVEL PINION':'LEFT BEVEL PINION',st.running);
  ewLabel([x,45,42],i?'RIGHT SHAFT':'LEFT SHAFT',st.running);
  ewLabel([x,45,52],i?'RIGHT SHAFT BEARING':'LEFT SHAFT BEARING');
  ewLabel([x,45,31],i?'RIGHT BEATER COLLAR':'LEFT BEATER COLLAR',st.running);
  ewLabel([x+4.25*Math.cos(angle),45+4.25*Math.sin(angle),21],i?'RIGHT WIRE BEATER':'LEFT WIRE BEATER',st.running);
 }
 const ewCrank=[66,45+13*Math.cos(st.angle),74+13*Math.sin(st.angle)];
 ewRod([66,45,74],ewCrank,1.1,METAL);ewRod(ewCrank,[77,ewCrank[1],ewCrank[2]],2.3,m);
 ewLabel([66,ewCrank[1],ewCrank[2]],'CRANK ARM',st.running);ewLabel([73,ewCrank[1],ewCrank[2]],'CRANK GRIP',st.running);
 // The depicted hand holds the grip throughout the teaching lift, rather than implying powered lift hardware.
 const ewSkin=matOf('#e4b18f');
 ewRod([44,46,103],[44,56,106],4.4,ewSkin);
 ewRod([44,56,106],[39,67,110],3.8,ewSkin);
 for(const x of [39,42.5,46,49.5]){
  ewRod([x,44,103],[x,41,100],1.05,ewSkin);
  ewRod([x,41,100],[x,43,97.5],1.05,ewSkin);
 }
 ewRod([49,48,103],[52,47,99],1.6,ewSkin);
 ewSvg+=ewFarWalls.join('');
 const ewBelow=ewParts.filter(p=>p.box[1][2]<20.5),ewAbove=ewParts.filter(p=>p.box[1][2]>=20.5);
 ewSvg+=ewXr>.6?ewMixture+byDepth(ewBelow):byDepth(ewBelow)+ewMixture;
 ewSvg+=byDepth(ewAbove)+ewNearWalls.join('');
 if(ewXr>.6)ewSvg+=xrCallouts(ewLabels,[10,82,10,80,0,139]);
 return ewSvg;
}
let ewLoop=false,ui;
function ewKick(){
 if(ewLoop)return;ewLoop=true;
 ui.animate(dt=>{
  const st=ui.st;
  if(st.running){st.angle+=Math.PI*st.speed*dt;if(27*ease(st.lift)<9.5)st.mixed+=dt*st.speed;}
  st.lift+=Math.sign(st.liftTarget-st.lift)*Math.min(Math.abs(st.liftTarget-st.lift),dt/.9);
  const active=st.running||st.lift!==st.liftTarget;
  if(!active)ewLoop=false;
  return active;
 });
}
const ewCrankAction=(st)=>{st.running=!st.running;ewKick();};
ui=mountFigure({fig:'49',title:'Egg whisk',turn:'full',size:[90,90,139],palette:'mint',state:ewState,scene:ewScene,
 stats:st=>[{label:'Hand crank',value:(st.running?30*st.speed:0)+' rpm'},{label:'Each beater',value:(st.running?120*st.speed:0)+' rpm',small:true},{label:'Fixed ratio',value:'4:1',small:true}],
 buttons:[
  {label:'Crank',onClick:ewCrankAction},
  {label:'Speed up',onClick:(st,u)=>{if(st.speed<3)st.speed++;else u.flash('Fastest hand-crank rate');}},
  {label:'Lift',onClick:st=>{st.liftTarget=st.liftTarget?0:1;ewKick();}},
  {label:'Reset',onClick:st=>{st.running=false;st.speed=1;st.angle=.2;st.mixed=0;st.liftTarget=0;ewKick();}}
 ],
 params:(st,q)=>{
  const a=Number(q.get('angle'));if(q.has('angle')&&Number.isFinite(a))st.angle=a;
  if(['1','2','3'].includes(q.get('speed')))st.speed=Number(q.get('speed'));
  if(q.get('lift')==='1')st.lift=st.liftTarget=1;
  if(q.get('run')==='1')st.running=true;
 }
});
xrMount(()=>ui,()=> '');
if(ui.st.running)ewKick();
</script></body></html>
