<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wind-up toy</title></head><body>
<script src="core.js"></script>
<script>
/* Wind-up toy: a lithographed tin walking robot with an open-spring clockwork motor.
   Truth first (where the energy is after each step):
   1. Wind: the key turns the winding arbor. The ratchet wheel is fixed to the arbor; the click riding on the great wheel
      slips over its teeth, so the great wheel stays put and the mainspring (inner end hooked to the arbor, outer end to a
      pillar) coils tighter round the arbor. Energy is now in the spring.
   2. Hold: the stop lever's tip sits in the governor's star wheel, so the whole train is locked.
   3. Release: the lever swings clear. The spring turns the arbor back, the ratchet drives the click and the great wheel
      with it (the key turns slowly backwards as it runs down). Great wheel -> crank pinion (crank axle) -> second wheel ->
      third pinion -> third wheel -> governor pinion -> star wheel. The anchor rocks on the star wheel's teeth: its
      inertia (balance weight) limits the speed, which gives the buzz.
   4. Walk: the crank axle runs out through both frame plates to a crank disc each side, pins 180 deg apart. Each leg hangs
      on its crank pin and slides through a slot over a guide pin on the base plate, so the foot shuffles forward, lifts a
      little and comes back: the planted foot pushes the toy forward. A link from each crank pin rocks a lever on the
      shoulder axle, so the arms swing too.
   5. Run down: the spring is slack, the train stops. Wind again.
   Parts (each held by another):
   CASE    tin body shell (two halves, folded tabs) . base plate . head on its neck . antenna . ears . shoulder discs .
           arms with hands . legs . feet . key bushing . printed chest panel
   FRAME   left and right frame plates standing on the base plate . three pillars . spring anchor pillar
   POWER   key . winding arbor . mainspring . ratchet wheel . click on the great wheel . click spring
   TRAIN   great wheel . crank pinion on the crank axle . second wheel . third pinion . third wheel . governor pinion .
           star wheel . anchor with pallets . anchor pivot . balance weight
   CONTROL stop lever on its shaft through the right plate . stop handle outside
   WALK    crank axle . two crank discs . two crank pins . legs with slots . guide pins in staples . arm links . arm
           levers . shoulder axles
   Coordinates: x = depth (front x = 44), y = width (+y = the key side), z = up; 1 unit ~ 1.5 mm. */

/* ---------- geometry (robot-local) ---------- */
const OUT = rrUV(8, 32, 62, 82, 5);                       // body profile in (y, z), swept along x 4..44
const HOUT = rrUV(18, 85, 52, 108, 4);                    // head profile, swept along x 12..38
const polar = (c, d, deg) => [c[0] + d*Math.cos(deg*Math.PI/180), c[1] + d*Math.sin(deg*Math.PI/180)];
const R1 = 8, r2 = 4, R2 = 7, r3 = 2.3, R3 = 4.5, r4 = 1.8, RS = 3.4;     // wheel / pinion radii (x-z plane)
const A1 = [14, 61];                                      // winding arbor (x, z)
const A2 = polar(A1, R1 + r2, -75);                       // crank axle
const A3 = polar(A2, R2 + r3, -10);
const A4 = polar(A3, R3 + r4, 40);                        // governor arbor (star wheel)
const APV = [A4[0], A4[1] + 5.2];                         // anchor pivot
const SPV = [37, 42];                                     // stop lever pivot
const SPRING_ANCHOR = [22.5, 66];
const PILLARS = [[10, 37], [35, 37], [36.5, 64.5]];
const PLATE = rrUV(8, 34, 38.5, 68.5, 3);                 // frame plate profile (x, z)
const GP = [A2[0], 35.5];                                 // guide pin (x, z)
const CR = 1.4, LL = 40.5, FOOT_H = 7;                    // crank radius, crank pin to ankle, foot height
const SHO = [30, 74];                                      // shoulder axle (x, z)
const LEGY = [[11, 19], [51, 59]], LINKY = [[9.1, 10.1], [59.9, 60.9]];
const WMAX = 4, WIND_T = .55, RUN_W = .3;                 // key turns max, s per turn winding, turns/s running
const GZ = 3, XMAX = 40, BX1 = XMAX + 54, BY1 = 82, LIFT = 20;
// slabs along y: every rod is cut at these so each piece sorts against the flat parts it passes
const YS = [8, 9.1, 10.1, 11, 19, 19.5, 20.5, 22, 23, 24.5, 25.5, 26.5, 27.5, 29, 30, 31.5, 38.5, 41, 42, 44, 45, 45.4, 46, 47, 48, 49.5, 50.5, 51, 59, 59.9, 60.9, 62];

/* ---------- materials ---------- */
const BRASS = matOf('#e2b34c'), STEEL = matOf('#c3cbcf'), BLUED = matOf('#7f9ab2'), PLM = matOf('#b9c2c6');
const TIN = METAL, FEETM = matOf('#3d4a6b'), REDM = matOf('#e2483d'), CREAMM = matOf('#fff4d6');
const LITC = { l:'#ffd27a', m:'#f4a93a', d:'#b86d14' };   // a part that is working right now

/* ---------- small helpers ---------- */
const rot2 = (p, c, a) => { const ca = Math.cos(a), sa = Math.sin(a), dx = p[0] - c[0], dz = p[1] - c[1]; return [c[0] + dx*ca - dz*sa, c[1] + dx*sa + dz*ca]; };
const nrm2 = v => { const l = Math.hypot(v[0], v[1]) || 1; return [v[0]/l, v[1]/l]; };
const bx3 = (pts, e = .05) => [[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - e), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + e)];
// a convex profile in (x, z) extruded along y from y0 to y1: sides, the cap toward the viewer, silhouette ink
function prismY(prof, y0, y1, M, shade = toneI, w = 1){
  const A = on(PY(y0), prof), B = on(PY(y1), prof), up = facing([0,1,0]), cn = up ? [0,1,0] : [0,-1,0], cap = up ? B : A;
  return { svg: loft(A, B, n => shade(n, M)) + fill(pd(cap), shade(cn, M)) + ink(pd(cap), w*.7) + hullInk([...A, ...B], w), box: bx3([...A, ...B]) };
}
const capY = (y0, y1) => facing([0,1,0]) ? y1 + .03 : y0 - .03;   // the y of the cap that faces the viewer
// a bar from p to q (x, z) of width wd, as a convex profile
const barUV = (p, q, wd) => { const d = nrm2([q[0] - p[0], q[1] - p[1]]), n = [-d[1]*wd/2, d[0]*wd/2];
  return [[p[0] + n[0], p[1] + n[1]], [q[0] + n[0], q[1] + n[1]], [q[0] - n[0], q[1] - n[1]], [p[0] - n[0], p[1] - n[1]]]; };
const discUV = (c, r, n = 18) => ellUV(c[0], c[1], r, r, n);
// thin pins and arbors as stroked lines (a faceted rod per slab piece costs ~10x the drawing for the same look)
function pinSvg(a, b, r, M){
  const A = P(...a), B = P(...b), d = `M${f(A[0])} ${f(A[1])}L${f(B[0])} ${f(B[1])}`, o = f(-r*.35);
  return `<path d="${d}" stroke="${INK}" stroke-width="${f(2*r + .9)}" fill="none"/><path d="${d}" stroke="${M.m}" stroke-width="${f(2*r - .2)}" fill="none"/>`
    + `<path d="${d}" transform="translate(0 ${o})" stroke="${M.l}" stroke-width="${f(r*.55)}" fill="none"/>`;
}
const yPin = (c, y0, y1, r, M) => ({ box:[[c[0] - r, y0, c[1] - r], [c[0] + r, y1, c[1] + r]], svg: pinSvg([c[0], y0, c[1]], [c[0], y1, c[1]], r, M) });
// a rod along y, cut at the slab planes
function yRod(c, y0, y1, r, M){
  const cuts = [y0, ...YS.filter(v => v > y0 + 1e-6 && v < y1 - 1e-6), y1], out = [];
  for (let i = 0; i < cuts.length - 1; i++) out.push(yPin(c, cuts[i], cuts[i+1], r, M));
  return out;
}
// toothed wheels in a y slab
const gearPts = (c, R, n, a, td) => { const o = [], w = Math.PI/n;
  for (let i = 0; i < n; i++){ const t = a + i/n*2*Math.PI; for (const [da, r] of [[-w*.5, R - td], [-w*.22, R], [w*.22, R], [w*.5, R - td]]) o.push([c[0] + r*Math.cos(t + da), c[1] + r*Math.sin(t + da)]); }
  return o; };
const sawPts = (c, R, n, a, td) => { const o = [], p = 2*Math.PI/n;   // ratchet: steep face, long slope
  for (let i = 0; i < n; i++){ const t = a + i*p; o.push([c[0] + (R - td)*Math.cos(t), c[1] + (R - td)*Math.sin(t)], [c[0] + R*Math.cos(t + p*.9), c[1] + R*Math.sin(t + p*.9)]); }
  return o; };
const starPts = (c, R, n, a, td) => { const o = [], p = 2*Math.PI/n;
  for (let i = 0; i < n; i++){ const t = a + i*p; o.push([c[0] + (R - td)*Math.cos(t - p/2), c[1] + (R - td)*Math.sin(t - p/2)], [c[0] + R*Math.cos(t), c[1] + R*Math.sin(t)]); }
  return o; };
function wheel(prof, c, R, y0, y1, M, holes = 0, a = 0){
  const A = on(PY(y0), prof), B = on(PY(y1), prof), up = facing([0,1,0]), cn = up ? [0,1,0] : [0,-1,0], cap = up ? B : A, yy = capY(y0, y1);
  let s = loft(A, B, n => toneI(n, M)) + fill(pd(cap), toneI(cn, M)) + ink(pd(cap), .5);
  for (let i = 0; i < holes; i++){ const h = polar(c, R*.56, a*180/Math.PI + 45 + i*360/holes); s += shape(on(PY(yy), discUV(h, R*.17, 12)), mix(M.d, '#2a2420', .35), .4); }
  const hr = Math.max(.9, R*.2); s += shape(on(PY(yy), discUV(c, hr, 12)), M.m, .45);
  return { box:[[c[0] - R, y0, c[1] - R], [c[0] + R, y1, c[1] + R]], svg: s + hullInk([...A, ...B], .8) };
}

/* ---------- kinematics ---------- */
function legAt(ph){
  const C = [A2[0] + CR*Math.cos(ph), A2[1] + CR*Math.sin(ph)], u = nrm2([GP[0] - C[0], GP[1] - C[1]]);
  return { C, u, A:[C[0] + LL*u[0], C[1] + LL*u[1]], tG: Math.hypot(GP[0] - C[0], GP[1] - C[1]) };
}
const LEVER = 8, LINK_L = Math.hypot(SHO[0] - A2[0], SHO[1] - LEVER - A2[1]);
function armTheta(pin){   // the shoulder lever's angle that keeps the link at its length
  let lo = -.9, hi = .9;
  for (let i = 0; i < 30; i++){ const m = (lo + hi)/2, E = [SHO[0] + LEVER*Math.sin(m), SHO[1] - LEVER*Math.cos(m)];
    if (Math.hypot(E[0] - pin[0], E[1] - pin[1]) > LINK_L) hi = m; else lo = m; }
  return (lo + hi)/2;
}
function kin(st){
  const a2 = -st.g1*R1/r2, a3 = -a2*R2/r3, a4 = -a3*R3/r4;
  const legs = [legAt(a2), legAt(a2 + Math.PI)];
  return { a1: st.a1, g1: st.g1, a2, a3, a4, legs, arms: legs.map(l => armTheta(l.C)), bob: FOOT_H - Math.min(legs[0].A[1], legs[1].A[1]) };
}

/* ---------- outside of the robot ---------- */
const txB = (x,y,z,str,size,col=INK,weight=700) => `<text transform="${txM(P(x,y,z), Dv(0,1,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`;
const dotX = (x, y, z, r = .7, c = TIN.l) => shape(on(PX(x), ellUV(y, z, r, r, 10)), c, .4);
const dotY = (x, y, z, r = .7, c = TIN.l) => shape(on(PY(y), ellUV(x, z, r, r, 10)), c, .4);
function bodySvg(st, m){
  const FR = facing([1,0,0]), BK = facing([-1,0,0]), LF = facing([0,1,0]), RT = facing([0,-1,0]), TOP = facing([0,0,1]);
  let s = extrude(OUT, 4, 44, m, tone);
  if (FR){ const fx = 44.2, F = PX(fx);
    s += fill(pd(on(PX(44), OUT)), tone([1,0,0], m));
    s += shape(on(F, rrUV(15, 45, 55, 77, 3)), CREAMM.l, 1.1);                            // printed chest panel
    s += shape(on(PX(fx + .05), ellUV(25, 66, 6, 6, 24)), '#fbfaf3', .9);                    // gauge
    for (let i = 0; i <= 6; i++){ const a = (200 - i*36.7)*Math.PI/180; s += line([[fx + .1, 25 + 4.6*Math.cos(a), 66 + 4.6*Math.sin(a)], [fx + .1, 25 + 5.4*Math.cos(a), 66 + 5.4*Math.sin(a)]], .5); }
    s += line([[fx + .12, 25, 66], [fx + .12, 21.5, 68.6]], .9).replace(INK, '#e2483d');
    [['#e2483d', 20], ['#f4b829', 28], ['#43c25c', 36]].forEach(([c, y]) => { s += shape(on(PX(fx + .05), ellUV(y, 53, 2.6, 2.6, 16)), c, .7) + fill(pd(on(PX(fx + .1), ellUV(y + .7, 53.8, .8, .8, 8))), '#ffffff', 'opacity=".7"'); });
    let gr = ''; for (let y = 40; y <= 51; y += 2.2) gr += pd([[fx + .05, y, 50], [fx + .05, y, 73]], false);
    s += shape(on(F, rrUV(38, 48, 53, 75, 2)), '#5b6a7a', .8) + `<path d="${gr}" fill="none" stroke="#c9d3db" stroke-width=".9"/>`;
    s += tx(fx + .1, 35, 38.2, 'SPACE WALKER', 3.6, INK, 800);
    for (const [y, z] of [[11, 35], [59, 35], [11, 79], [59, 79]]) s += dotX(fx, y, z);
    for (const z of [42, 62]) for (const y of [8.4, 61.6]) s += shape(on(PX(fx + .02), rectUV(y - .4, z - 1.5, y + .4, z + 1.5)), m.d, .4);   // folded tabs on the seam
    s += ink(pd(on(PX(44), OUT)), 2.2);
  }
  if (BK){ const bxx = 3.8;
    s += fill(pd(on(PX(4), OUT)), tone([-1,0,0], m));
    s += shape(on(PX(bxx), rrUV(14, 40, 56, 72, 3)), mix(tone([-1,0,0], m), '#ffffff', .35), 1);
    s += txB(bxx - .1, 35, 60, 'WIND-UP', 4.4, INK, 800) + txB(bxx - .1, 35, 52, 'MECHANICAL', 2.8, INK, 700) + txB(bxx - .1, 35, 47, 'TIN TOY', 2.8, INK, 700);
    for (const [y, z] of [[11, 35], [59, 35], [11, 79], [59, 79]]) s += dotX(bxx, y, z);
    s += ink(pd(on(PX(4), OUT)), 2.2);
  }
  if (LF){ const fy = 62.2, sm = tone([0,1,0], m);
    s += shape(on(PY(fy), rrUV(24, 37, 41, 56, 3)), mix(sm, '#ffffff', .3), .9);
    let v = ''; for (let z = 40; z <= 53; z += 3.2) v += pd([[26.5, fy + .05, z], [38.5, fy + .05, z]], false);
    s += `<path d="${v}" fill="none" stroke="${INK}" stroke-width=".8" opacity=".6"/>`;
    s += shape(on(PY(fy), ellUV(A1[0], A1[1], 3, 3, 18)), TIN.m, .8) + shape(on(PY(fy + .05), ellUV(A1[0], A1[1], 1.6, 1.6, 14)), '#2a2420', .5);   // key bushing
    s += shape(on(PY(fy), ellUV(SPV[0], SPV[1], 2.2, 2.2, 14)), '#2a2420', .6);                                                                   // stop shaft hole
    s += txY(16, fy + .05, 37.5, 'WIND', 3.2, INK, 800);
  }
  if (RT){ const fy = 7.8, sm = tone([0,-1,0], m);
    s += shape(on(PY(fy), rrUV(10, 37, 41, 56, 3)), mix(sm, '#ffffff', .3), .9);
    let v = ''; for (let z = 40; z <= 53; z += 3.2) v += pd([[13, fy - .05, z], [38, fy - .05, z]], false);
    s += `<path d="${v}" fill="none" stroke="${INK}" stroke-width=".8" opacity=".6"/>`;
  }
  if (TOP) for (const [x, y] of [[8, 13], [8, 57], [40, 13], [40, 57]]) s += shape(on(PZ(82.05), ellUV(x, y, .7, .7, 10)), TIN.l, .4);
  s += hullInk([...on(PX(4), OUT), ...on(PX(44), OUT)], 2.8);
  return s;
}
function headSvg(st, m){
  const HM = TIN, FR = facing([1,0,0]), BK = facing([-1,0,0]);
  let s = extrude(HOUT, 12, 38, HM, tone);
  if (FR){ const fx = 38.2;
    s += fill(pd(on(PX(38), HOUT)), tone([1,0,0], HM));
    s += shape(on(PX(fx), rrUV(21, 92, 49, 104.5, 3)), '#1d2a26', 1);
    const glow = st.run && st.w > 0 ? '#ffe066' : '#f4d03f';
    for (const y of [28, 42]){ s += shape(on(PX(fx + .05), ellUV(y, 98.2, 3.3, 3.3, 18)), glow, .8) + shape(on(PX(fx + .1), ellUV(y, 98.2, 1.3, 1.3, 12)), '#231e16', .3)
      + fill(pd(on(PX(fx + .15), ellUV(y + .8, 99.2, .5, .5, 8))), '#ffffff'); }
    s += shape(on(PX(fx), rrUV(26, 87, 44, 90.4, 1.2)), '#d8dde0', .8);
    let g = ''; for (let y = 28; y <= 42; y += 2) g += pd([[fx + .05, y, 87.3], [fx + .05, y, 90.1]], false);
    s += `<path d="${g}" fill="none" stroke="${INK}" stroke-width=".6"/>`;
    s += ink(pd(on(PX(38), HOUT)), 1.8);
  }
  if (BK){ s += fill(pd(on(PX(12), HOUT)), tone([-1,0,0], HM)) + shape(on(PX(11.8), rrUV(26, 90, 44, 102, 2)), mix(tone([-1,0,0], HM), '#000000', .08), .8) + ink(pd(on(PX(12), HOUT)), 1.8); }
  return s + hullInk([...on(PX(12), HOUT), ...on(PX(38), HOUT)], 2.4);
}
// legs: a bar along the leg from t0 to t1 (distance from the crank pin), cut where it enters the body
function legPiece(L, t0, t1, y0, y1, M, slot = false){
  const p = [L.C[0] + L.u[0]*t0, L.C[1] + L.u[1]*t0], q = [L.C[0] + L.u[0]*t1, L.C[1] + L.u[1]*t1];
  const it = prismY(barUV(p, q, 6), y0, y1, M, toneI, 1);
  if (slot){ const a = Math.max(t0 + .6, 11.4), b = Math.min(t1 - .2, 16.4);
    if (b > a) it.svg += shape(on(PY(capY(y0, y1)), barUV([L.C[0] + L.u[0]*a, L.C[1] + L.u[1]*a], [L.C[0] + L.u[0]*b, L.C[1] + L.u[1]*b], 1.6)), '#2a2420', .4); }
  return it;
}
const tAtZ = (L, z) => (L.C[1] - z) / -L.u[1];
function outside(st, m, K){
  const items = [];
  // legs below the body and the feet
  K.legs.forEach((L, i) => { const [y0, y1] = LEGY[i];
    const lg = legPiece(L, tAtZ(L, 32), LL, y0, y1, TIN); lg.box[1][2] = 32; lg.box[0][2] = L.A[1];
    const kn = L.u.map(v => v), mid = [L.C[0] + kn[0]*(LL - 9), L.C[1] + kn[1]*(LL - 9)];
    lg.svg += shape(on(PY(capY(y0, y1)), discUV(mid, 1.1, 10)), TIN.l, .5);
    items.push(lg);
    const ft = prismY(rrUV(L.A[0] - 7, L.A[1] - FOOT_H, L.A[0] + 15, L.A[1], 2.5), y0 - 1, y1 + 1, FEETM, toneI, 1.2);
    if (facing([0,0,1])) ft.svg += line([[L.A[0] + 9, y0 - .9, L.A[1] + .03], [L.A[0] + 9, y1 + .9, L.A[1] + .03]], .7);
    if (facing([1,0,0])) ft.svg += shape(on(PX(L.A[0] + 15.03), rectUV(y0, L.A[1] - FOOT_H + 1.5, y1, L.A[1] - FOOT_H + 2.6)), '#e2483d', .4);
    ft.box[1][2] = L.A[1]; items.push(ft);
  });
  // arms: shoulder disc, arm, hand (left at y 1.5..7, right at 63..68.5)
  [[1.5, 7, 7, 8, -1], [63, 68.5, 62, 63, 1]].forEach(([y0, y1, d0, d1], i) => { const th = K.arms[i];
    const dir = [Math.sin(th), -Math.cos(th)], E = [SHO[0] + dir[0]*19, SHO[1] + dir[1]*19];
    items.push({ box:[[SHO[0] - 4.5, d0, SHO[1] - 4.5], [SHO[0] + 4.5, d1, SHO[1] + 4.5]], svg: rod([SHO[0], d0, SHO[1]], [SHO[0], d1, SHO[1]], 4.5, m, toneI, 1, 4.5, 20) });
    const arm = prismY(barUV([SHO[0] - dir[0]*2, SHO[1] - dir[1]*2], E, 6.2), y0, y1, TIN, toneI, 1.1);
    const hp = rrUV(-3.6, -5.5, 3.6, 1, 1.8).map(([u, v]) => [E[0] + u*Math.cos(th) - v*Math.sin(th), E[1] + u*Math.sin(th) + v*Math.cos(th)]);
    const hand = prismY(hp, y0 - .4, y1 + .4, m, toneI, 1.1);
    hand.svg += shape(on(PY(capY(y0 - .4, y1 + .4)), discUV(SHO, 2, 12)), TIN.d, .5);
    items.push({ box: bx3([[SHO[0] - 6, y0, SHO[1] + 4], ...on(PY(y0), hp), ...on(PY(y1), hp), ...on(PY(y0), barUV(SHO, E, 6.2))]), svg: arm.svg + hand.svg + act('pick', '') });
  });
  // key: shaft out of the bushing, then the bow (turns with the winding arbor)
  items.push({ box:[[A1[0] - 1.2, 62, A1[1] - 1.2], [A1[0] + 1.2, 69, A1[1] + 1.2]], svg: rod([A1[0], 62, A1[1]], [A1[0], 69, A1[1]], 1.2, BRASS, toneI, .9, 1.2, 12) });
  { const a = K.a1, kp = (u, v) => rot2([A1[0] + u, A1[1] + v], A1, a);
    const lobe = sg => ellUV(0, 0, 3.6, 3.1, 18).map(([u, v]) => kp(sg*5 + u, v));
    const parts = [prismY([kp(-2.2, -1.4), kp(2.2, -1.4), kp(2.2, 1.4), kp(-2.2, 1.4)], 69, 71.5, BRASS, toneI, .9), prismY(lobe(-1), 69, 71.5, BRASS, toneI, 1), prismY(lobe(1), 69, 71.5, BRASS, toneI, 1)];
    let svg = parts.map(p => p.svg).join('');

  const B = [off[0] + 4, off[0] + 47, off[1], off[1] + 72, off[2], off[2] + 120];
  const wl = isWalking(st);
  if (k > .6) s += callouts(MECH_ITEMS.map(it => ({ ...it, at: W2(it.at) })), B);
  else s += callouts([
    { at: W2([A1[0], 71.5, A1[1] + 5.5]), text:'KEY', on: st.windQ > 0 },
    { at: W2([SPV[0] + 2, 64.4, SPV[1] - 5]), text:'STOP LEVER', on: st.lev > .5 },
    { at: W2([SHO[0], 68.5, SHO[1] - 14]), text:'ARM', on: wl },
    { at: W2([K.legs[1].A[0] + 12, 60, K.legs[1].A[1] - 3]), text:'FOOT', on: wl },
    { at: W2([25, 35, 118.5]), text:'ANTENNA', on: false } ], B);
  return s;
}

/* ---------- behaviour (one state object, one clock) ---------- */
let ui, loopOn = false;
const isWalking = st => st.lev >= .95 && st.w > 1e-4 && st.run;
function tick(st, dt){
  let busy = false;
  if (st.windQ > 0){ const d = Math.min(st.windQ, dt/WIND_T); st.windQ -= d; st.a1 += d*2*Math.PI; st.w = Math.min(WMAX, st.w + d); busy = true; }
  const goal = st.run ? 1 : 0;
  if (st.lev !== goal){ st.lev += Math.sign(goal - st.lev)*Math.min(Math.abs(goal - st.lev), dt/.25); busy = true; }
  if (isWalking(st)){
    const before = kin(st), d = Math.min(st.w, RUN_W*dt);
    st.w -= d; st.g1 -= d*2*Math.PI; st.a1 -= d*2*Math.PI;
    if (!st.carry && st.lift <= 0){ const after = kin(st), i = before.legs[0].A[1] <= before.legs[1].A[1] ? 0 : 1;
      st.X += Math.max(0, before.legs[i].A[0] - after.legs[i].A[0]); }
    if (st.X >= XMAX){ st.X = XMAX; st.run = false; ui.flash('Caught it at the table edge — pick it up'); }
    if (st.w <= 1e-4){ st.w = 0; ui.flash('Run down — the mainspring is slack. Wind the key'); }
    busy = true;
  }
  if (st.carry){ busy = true;
    if (st.carry === 'up'){ st.lift = Math.min(1, st.lift + dt/.4); if (st.lift >= 1) st.carry = 'back'; }
    else if (st.carry === 'back'){ st.X = Math.max(0, st.X - dt*Math.max(40, st.carryV)); if (st.X <= 0) st.carry = 'down'; }
    else { st.lift = Math.max(0, st.lift - dt/.4); if (st.lift <= 0) st.carry = null; } }
  return busy;
}
function runLoop(){
  if (loopOn) return; loopOn = true;
  ui.animate(dt => { const busy = tick(ui.st, dt); if (!busy) loopOn = false; return busy; });
}
function wind(st){
  if (st.w + st.windQ >= WMAX - .01) return ui.flash('Fully wound — the key will not turn any further');
  st.windQ += Math.min(1, WMAX - st.w - st.windQ); runLoop();
}
function flip(st){
  if (!st.run && st.X >= XMAX - .5) return ui.flash('It is at the edge — pick it up first');
  st.run = !st.run;
  if (st.run && st.w + st.windQ <= 1e-3) ui.flash('Lever released, but the spring is slack — wind the key');
  runLoop();
}
function pick(st){
  if (st.carry) return;
  if (st.X < .5) return ui.flash('It is already at the start line');
  st.carry = 'up'; st.carryV = st.X/.7; runLoop();
}

ui = mountFigure({
  fig:'W1', title:'Wind-up toy', size:[BX1, BY1, 124 + LIFT], palette:'cobalt', turn:'full',
  state:{ w:0, a1:0, g1:0, run:false, lev:0, X:0, lift:0, carry:null, carryV:0, windQ:0 },
  scene,
  stats: st => [{ label:'Spring', value: st.w.toFixed(1) + ' turns' }],
  buttons:[
    { label:'Wind the key', onClick:(st) => wind(st) },
    { label:'Flip the stop lever', onClick:(st) => flip(st) },
    { label:'Pick it up', onClick:(st) => pick(st) },
  ],
  acts:{ key:(st) => wind(st), lever:(st) => flip(st), pick:(st) => pick(st) },
  params:(st, q) => {
    if (q.has('w')) st.w = Math.max(0, Math.min(WMAX, +q.get('w')));
    if (q.has('x')) st.X = Math.max(0, Math.min(XMAX, +q.get('x')));
    if (q.has('phi')){ st.g1 = -(+q.get('phi'))*r2/R1; st.a1 = st.g1; }
    if (q.get('run') === '1'){ st.run = true; st.lev = 1; }
    if (q.has('lift')) st.lift = +q.get('lift');
  },
});
xrMount(() => ui, () => '');
</script></body></html>
