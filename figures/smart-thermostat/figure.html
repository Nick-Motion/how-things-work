/* Truth first.
   A generic 24 VAC, single-stage gas furnace and split air conditioner, not a heat pump.
   R supplies 24 VAC; C returns it. The thermostat closes R-W for heat, R-Y and R-G for cooling.
   The furnace board starts the inducer, proves draft, ignites the burners and then runs the blower.
   Combustion gases stay inside the heat exchanger and exit the flue; room air flows outside it.
   Cooling moves heat from indoor evaporator to outdoor condenser through a closed refrigerant loop.
   Wi-Fi is for remote access. The sensor, stored schedule and local relays work without it.
   Teaching adaptations: thermostat enlarged; equipment placed together on a display plinth;
   thermal response, clock and furnace timing accelerated. One clock hour takes three seconds. Night button installs a 22:00-06:00
   heating setback and advances to 22:00. Away uses a 16-28 C deadband, independent of the schedule.
   Parts and supports.
   Thermostat: wall-mounted backplate and screws, PCB on standoffs, sensor at a lower air vent,
   processor, flash, clock crystal, regulator, radio, antenna, three relays and terminal block on PCB,
   LCD and touch electrode on front cover; five insulated conductors land on labelled terminals.
   Furnace: filter and blower housing on base, motor on blower hub, board and transformer on chassis,
   gas valve and burner manifold on brackets, igniter and flame sensor beside burner outlets,
   sealed heat exchanger above burners, inducer and pressure switch beside flue, evaporator above,
   expansion valve at liquid inlet, supply plenum above coil, return duct attached to blower inlet.
   Condenser: compressor on base feet, finned coil against side walls, fan and motor on upper bracket,
   contactor and capacitor on service panel, suction and liquid lines connected to indoor coil.
   References checked 2026-10-24.
   https://support.google.com/googlehome/answer/9243422?hl=en
   https://www.carrier.com/us/en/residential/hvac-resources/furnaces/how-does-a-gas-furnace-work/
   https://www.ahrinet.org/scholarships-education/education/homeowners/how-things-work/air-conditioning-system
