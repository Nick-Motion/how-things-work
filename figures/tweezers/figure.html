<!doctype html>
<html lang="en" data-errors=""><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tweezers</title></head><body>
<script src="core.js"></script>
<script>
/* Truth first.
   Book evidence is The Way Things Work Now, 2016, printed pages 21 and 23,
   and The New Way Things Work, 1998, printed page 23. The 1988 edition is unverified.
   Both arms act as third-class levers. Finger effort lies between the joined end
   and the load at the tips. The joined end is an effective fulcrum, not a pin hinge.
   Spring steel bends under finger effort and reopens when that effort is removed.
   Dumont patent WO2008071750A1 describes elastic arms joined by welding or clipping.
   This representative tool has plain integral tips and a welded rear, not that patent's removable tips.
   1. Squeeze bends both arms inward. The bead stays on the tabletop between the tips.
   2. Lift represents the user's hand raising the whole tool while keeping it squeezed.
      Friction at the contacting tips carries the same bead, from z=5.2 to z=23.2 mm.
   3. Release removes finger effort. The arms reopen and the bead falls onto the table.
      The user's tool then lowers to its original position. No new bead is supplied.
   Teaching adaptations are the bead instead of hair, the table, slow motion and force overlays.
   The user supplies the lifting and squeezing actions. There is no hidden actuator or fixture.
   Parts are the joined rear, two elastic arms, their integral tapered tips and grip ridges.
   Each arm attaches to the joined rear. The ridges and tips are features of the arms.
   Board and spare beads rest on the table. Force arrows and centerlines are teaching overlays,
   never additional anatomy. Minimum anatomy is 5, declared in the brief before construction.
   Geometry uses millimetres, with an illustrative bend shape and slowed gravity for readable motion.
   The tool is 94 mm long. Effort is at x=58, between rear x=18 and load x=100.
   The inner tip faces are at y=32 +/- 2.2 while gripping the 4.4 mm bead.
*/
const twBaseZ = 5.2, twBeadR = 2.2, twCY = 32;
const twState = {phase:'ready', closure:0, lift:0, beadZ:twBaseZ, velocity:0, elapsed:0, looping:false};
let twUI;
const twHolding = st => ['gripped','lifting','lifted'].includes(st.phase);
const twArmPoint = (st, side, x) => {
  const t = Math.max(0, Math.min(1, (x-18)/82));
  return [x, twCY + side*(.65 + 6*t - 3.85*st.closure*t*t*(3-t)/2), twBaseZ+st.lift];
};
const twBounds = (pts, pad=0) => [0,1].map(end => [0,1,2].map(i => (end ? Math.max : Math.min)(...pts.map(p=>p[i])) + (end ? pad : -pad)));
function twBlade(st, side, x0, x1, material){
  const a=twArmPoint(st,side,x0), b=twArmPoint(st,side,x1);
  const halfHeight=x=>x<82 ? 2.2 : 2.2-(x-82)/22*.95;
  const ring=(p,x)=>[[p[0],p[1]-.6,p[2]-halfHeight(x)],[p[0],p[1]+.6,p[2]-halfHeight(x)],[p[0],p[1]+.6,p[2]+halfHeight(x)],[p[0],p[1]-.6,p[2]+halfHeight(x)]];
  const ar=ring(a,x0), br=ring(b,x1), pts=[...ar,...br];
  let svg=loft(ar,br,n=>tone(n,material));
  if(x0===18&&vis([-1,0,0])) svg+=shape(ar,tone([-1,0,0],material),.7);
  if(x1===104&&vis([1,0,0])) svg+=shape(br,tone([1,0,0],material),.7);
  svg+=line([ar[0],br[0]],.7)+line([ar[1],br[1]],.7)+line([ar[2],br[2]],.7)+line([ar[3],br[3]],.7);
  if(x0>=48&&x1<=72&&vis([0,side,0])){
    for(let x=x0+1;x<x1;x+=2){const p=twArmPoint(st,side,x);svg+=line([[x,p[1]+side*.62,p[2]-1.55],[x,p[1]+side*.62,p[2]+1.55]],.65);}
  }
  return {box:twBounds(pts),svg};
}
function twBead(x,y,z,color){
  const p=P(x,y,z),r=twBeadR*1.2247;
  const svg=`<circle cx="${f(p[0])}" cy="${f(p[1])}" r="${f(r)}" fill="${color}" stroke="${INK}" stroke-width="1.2"/><circle cx="${f(p[0]-.28*r)}" cy="${f(p[1]-.3*r)}" r="${f(.27*r)}" fill="#ffffff" opacity=".5"/>`;
  return {box:[[x-twBeadR,y-twBeadR,z-twBeadR],[x+twBeadR,y+twBeadR,z+twBeadR]],svg};
}
function twArrow(a,b,color){
  const pa=P(...a),pb=P(...b),dx=pb[0]-pa[0],dy=pb[1]-pa[1],len=Math.hypot(dx,dy);
  if(len<.01)return '';
  const ux=dx/len,uy=dy/len,w=2.2*INK_K,h=6*INK_K;
  return `<path d="M${f(pa[0])} ${f(pa[1])}L${f(pb[0])} ${f(pb[1])}" fill="none" stroke="${color}" stroke-width="2"/><path d="${sp([pb,[pb[0]-ux*h+uy*w,pb[1]-uy*h-ux*w],[pb[0]-ux*h-uy*w,pb[1]-uy*h+ux*w]])}" fill="${color}"/>`;
}
function twScene(st,m){
  const k=ease(st.xr||0),metal={l:mix(METAL.l,m.l,.18),m:mix(METAL.m,m.m,.18),d:METAL.d};
  let svg=board(0,0,120,70,3,5,WOOD);
  const twParts=[],twTool=[];
  const z=twBaseZ+st.lift;
  twTool.push({box:[[10,30.75,z-2.2],[18,33.25,z+2.2]],svg:box(10,30.75,z-2.2,18,33.25,z+2.2,metal,tone,.9)});
  for(const side of [-1,1]) for(const pair of [[18,32],[32,48],[48,60],[60,72],[72,82],[82,94],[94,100],[100,104]]) twTool.push(twBlade(st,side,...pair,metal));
  svg+=castShadow(twTool.flatMap(p=>p.box),3,boardTop(0,0,120,70,3,5));
  for(const [x,y,col] of [[91,48,'#76a0e2'],[104,53,'#93d3b0'],[79,53,'#f3a6bb'],[96,61,'#ef6a4c']]){
    svg+=castShadow([[x-2.2,y-2.2,3],[x+2.2,y+2.2,7.4]],3,boardTop(0,0,120,70,3,5));
    twParts.push(twBead(x,y,twBaseZ,col));
  }
  svg+=castShadow([[97.8,29.8,st.beadZ-2.2],[102.2,34.2,st.beadZ+2.2]],3,boardTop(0,0,120,70,3,5));
  twParts.push(twBead(100,32,st.beadZ,'#f4b829'));
  twParts.push(...twTool.map(p=>({...p,svg:`<g opacity="${1-.72*k}">${p.svg}</g>`})));
  svg+=byDepth(twParts);
  if(k>0){
    let overlay='';
    for(const side of [-1,1]){
      const points=[18,32,48,60,72,82,94,100,104].map(x=>twArmPoint(st,side,x));
      overlay+=`<path d="${pd(points,false)}" fill="none" stroke="#41538f" stroke-width="1.5" stroke-dasharray="3 2"/>`;
      const effort=twArmPoint(st,side,58),tip=twArmPoint(st,side,100);
      overlay+=twArrow([58,effort[1]+side*12,z+3],[58,effort[1]+side*1,z+3],'#c15c27');
      overlay+=twArrow([100,tip[1]+side*7,z+3],[100,tip[1]+side*.7,z+3],'#41538f');
    }
    const pivot=P(18,32,z);
    overlay+=`<circle cx="${f(pivot[0])}" cy="${f(pivot[1])}" r="${f(5*INK_K)}" fill="none" stroke="#c15c27" stroke-width="1.5" stroke-dasharray="2 2"/>`;
    svg+=`<g opacity="${k}" data-overlay="third-class-levers">${overlay}</g>`;
  }
  if(k>.6){
    svg+=xrCallouts([
      {at:[14,32,z+2.2],text:'JOINED END',on:st.closure>0},
      {at:twArmPoint(st,-1,38),text:'LEFT SPRING ARM',on:st.closure>0},
      {at:twArmPoint(st,1,76),text:'RIGHT SPRING ARM',on:st.closure>0},
      {at:twArmPoint(st,-1,103),text:'LEFT TIP',on:twHolding(st)},
      {at:twArmPoint(st,1,103),text:'RIGHT TIP',on:twHolding(st)},
      {at:twArmPoint(st,1,58),text:'GRIP RIDGES',on:st.closure>0}
    ],[10,104,23,41,3,z+5]);
    svg+=tag([18,32,z+3],-18,-21,'FULCRUM',false);
    svg+=tag([58,32,z+4],0,-34,'FINGER EFFORT',st.closure>0);
    svg+=tag([100,32,z+4],18,-22,'TIP FORCE',twHolding(st));
  }
  return svg;
}
function twRun(st,ui){
  if(st.looping)return;
  st.looping=true;
  ui.animate(dt=>{
    st.elapsed+=dt;
    if(st.phase==='squeezing'){
      st.closure=Math.min(1,st.closure+dt/.55);
      if(st.closure===1)st.phase='gripped';
    }else if(st.phase==='lifting'){
      st.lift=Math.min(18,st.lift+dt*18/.9);st.beadZ=twBaseZ+st.lift;
      if(st.lift===18)st.phase='lifted';
    }else if(st.phase==='releasing'){
      st.closure=Math.max(0,st.closure-dt/.4);
      st.velocity+=170*dt;st.beadZ=Math.max(twBaseZ,st.beadZ-st.velocity*dt);
      if(st.closure===0&&st.beadZ===twBaseZ){st.phase='lowering';st.elapsed=0;}
    }else if(st.phase==='lowering'){
      st.lift=Math.max(0,st.lift-dt*24);
      if(st.lift===0)st.phase='ready';
    }
    const active=['squeezing','lifting','releasing','lowering'].includes(st.phase);
    if(!active)st.looping=false;
    return active;
  });
}
function twSqueeze(st,ui){
  if(st.phase!=='ready')return ui.flash(twHolding(st)?'The bead is already gripped':'Wait for the tool to settle');
  st.phase='squeezing';st.elapsed=0;twRun(st,ui);
}
function twLift(st,ui){
  if(st.phase!=='gripped')return ui.flash(st.phase==='lifted'?'The bead is already raised':'Squeeze the bead first');
  st.phase='lifting';st.elapsed=0;twRun(st,ui);
}
function twRelease(st,ui){
  if(['ready','releasing','lowering'].includes(st.phase))return ui.flash(st.phase==='ready'?'The tips are already open':'The bead is returning to the table');
  st.phase='releasing';st.velocity=0;st.elapsed=0;twRun(st,ui);
}
twUI=mountFigure({
  fig:'23',turn:'full',title:'Tweezers',size:[120,70,30],palette:'mint',state:twState,scene:twScene,
  stats:st=>[{label:'Tip gap',value:(12.1-7.7*st.closure).toFixed(1)+' mm'},{label:'Bead lift',value:(st.beadZ-twBaseZ).toFixed(0)+' mm'}],
  buttons:[{label:'Squeeze',onClick:twSqueeze},{label:'Lift',onClick:twLift},{label:'Release',onClick:twRelease}],
  params:(st,q)=>{
    const pose=q.get('pose');
    if(pose==='gripped'||pose==='lifted'){st.closure=1;st.phase=pose;}
    if(pose==='lifted'){st.lift=18;st.beadZ=twBaseZ+18;}
  }
});
xrMount(()=>twUI,()=> '');
</script></body></html>
