<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wi-Fi router</title></head><body>
<script src="core.js"></script>
<script>
/* Home Wi-Fi router (AX1800 class: 2x2 2.4 GHz + 2x2 5 GHz, five gigabit ports), on a desk with its fibre modem,
   its 12 V power adapter and a phone. We look at the router from behind, where the cables go in.
   x = depth (the back panel is at x = RW, toward the viewer), y = width, z = up. 1 unit = 2 mm.

   How it really works (and where the packet is after each step):
   1. Plug in the WAN cable: the RJ45 plug from the modem's LAN port clicks into the router's blue WAN jack.
   2. Power on: 12 V from the adapter -> DC jack -> power switch -> buck regulators make 3.3 V / 1.8 V / 1 V for the
      chips. The SoC boots from NAND flash into DDR RAM (PWR light blinks), then starts both radios (2.4G, 5G lights).
      With the WAN link up, it asks the modem's network for an address (DHCP) and the WAN light turns green.
   3. Connect the phone: the phone and the 5 GHz radio swap association and key-handshake frames over the air;
      the phone joins HOME-5G at 1201 Mbps (2 streams, 80 MHz, Wi-Fi 6).
   4. Send a packet: phone -> radio wave -> 5 GHz antenna's sleeve dipole -> coax pigtail -> U.FL jack -> front-end
      module (low-noise amplifier) -> 5 GHz radio chip -> PCIe lane -> SoC (routing + NAT: swaps the phone's private
      address for the router's public one) -> RGMII link -> Ethernet switch chip -> WAN magnetics (isolation
      transformer) -> WAN jack -> cable -> modem -> the internet. With no WAN link the SoC has nowhere to send it.

   Parts (each held by another):
   CASE      top shell (vents, LED windows, logo) . bottom shell . four rubber feet . four hinge blocks on the back
   ANTENNAS  four housings on hinges . a coax up each . a brass sleeve and a radiator (a sleeve dipole, quarter-wave
             for its band) . 2.4 GHz at y 8 / 40, 5 GHz at y 80 / 112
   BOARD     main board on four screws . SoC . heatsink with five fins . DDR3 RAM . NAND flash . 40 MHz crystal .
             UART header (4 pins) . PCIe lanes and RGMII link (traces)
   RADIOS    two RF shield fences (lids off) . a radio chip in each . two front-end modules in each . four U.FL jacks .
             four coax pigtails up over the jacks to the hinges
   ETHERNET  switch chip . quad LAN magnetics . WAN magnetics . four LAN jacks . blue WAN jack . port LEDs
   POWER     DC jack . power switch . buck regulator chip . two inductors . two output capacitors . input capacitor
   CONTROLS  reset button . WPS button . six status LEDs under six light pipes
   ON THE DESK  fibre modem (+ fibre off the desk) . WAN cable and its two plugs . 12 V adapter, DC plug, mains cord .
             phone */

/* ---------- geometry ---------- */
const RW = 75, RD = 120, BH = 3, ZB = 4.5, ZT = 20.5, RR = 6;     // router depth, width; desk; shell bottom/top; corner
const PZ0 = 7, PZ1 = 8, PORTZ = 11.5;                              // main board; centre of every back-panel opening
const BRD = [-6, -6, 116, 178];
const BTOP = boardTop(...BRD, BH, 8);
const ANT = [{ y:8, band:2.4 }, { y:40, band:2.4 }, { y:80, band:5 }, { y:112, band:5 }];
const AX = RW + 2.5, AZ = 18.3, ALEN = 78;                         // antenna pivot (x, z), length above the shell
const PORTS = { dc:14, pwr:28, rst:42, wps:50, lan:[90, 81, 72, 63], wan:104 };
const LEDS = [{ k:'pwr', y:86, t:'PWR' }, { k:'w24', y:74, t:'2.4G' }, { k:'w5', y:62, t:'5G' }, { k:'net', y:50, t:'WAN' }, { k:'lan', y:38, t:'LAN' }, { k:'wps', y:26, t:'WPS' }];
const MOD = [0, 132, 24, 154, 53];                                 // modem x0, y0, x1, y1, top
const PHN = [36, 136, 110, 172], PHZ = BH + 3.6;                   // phone, lying screen up
const BRK = [90, 7, 106, 21, 11.5];                                // power adapter
const UFL = [[32.5, 10], [32.5, 26], [32.5, 94], [32.5, 110]];     // U.FL jack for each antenna
const SCREWS = [[5.5, 5], [5.5, 115], [64, 5], [64, 115]];
const TR = {
  pcie5: [[17, 102], [21, 102], [31, 92], [31, 60], [34.5, 55]],
  pcie24: [[21, 18], [30, 30], [30, 40], [34.5, 45]],
  rgmii: [[46, 55], [48, 62], [48, 78], [44, 82]],
  wan: [[47, 89.5], [50, 104]],
};
const GRN = '#43c25c', AMB = '#f2a03a', LOFF = '#8d877a', GLOW = '#ffd34a';
const PCBM = { l:'#4fa36a', m:'#2f8a4a', d:'#1d5f31' }, CHIP = matOf('#3a3632'), SHLD = matOf('#d4d8da'), BRASS = matOf('#d8b25a');
const WANC = matOf('#3f7fc0'), LANC = matOf('#f2c230'), MAGM = matOf('#2e2c2a'), CAPM = matOf('#3a5f9f'), INDM = matOf('#55585c');
const PHM = { l:'#5b5f66', m:'#3d4046', d:'#26282c' }, MODM = CERAMIC;

/* ---------- helpers ---------- */
const rtDist = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1], a[2]-b[2]);
const rtBoxOf = (pts, e = .05) => [[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - e), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + e)];
function rtAlong(pts, u){
  let tot = 0; for (let i = 1; i < pts.length; i++) tot += rtDist(pts[i-1], pts[i]);
  if (tot < 1e-6) return pts[0].slice();
  let d = Math.max(0, Math.min(1, u)) * tot;
  for (let i = 1; i < pts.length; i++){ const l = rtDist(pts[i-1], pts[i]);
    if (d <= l || i === pts.length - 1){ const t = l ? Math.min(1, d/l) : 0; return pts[i-1].map((v, j) => v + (pts[i][j] - v)*t); } d -= l; }
}
// round each inside corner of a route (a cable bends, it doesn't kink)
function rtBend(pts, r = 1.6){ if (pts.length < 3) return pts; const out = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++){ const [a, b, c] = [pts[i-1], pts[i], pts[i+1]], la = rtDist(a, b), lc = rtDist(c, b), d = Math.min(r, la/2.2, lc/2.2);
    if (d < 1e-3){ out.push(b); continue; }
    const p = a.map((v, k) => b[k] + (v - b[k])*d/la), q = c.map((v, k) => b[k] + (v - b[k])*d/lc);
    for (let j = 0; j <= 4; j++){ const t = j/4; out.push([0,1,2].map(k => (1-t)*(1-t)*p[k] + 2*(1-t)*t*b[k] + t*t*q[k])); } }
  out.push(pts[pts.length - 1]); return out; }
// a cable of radius r (model units) cut into short pieces, each with its own box, so it sorts with the solids it passes
function rtWire(pts, col, r, L = 5){ const q = rtBend(pts), out = [];
  for (let i = 0; i < q.length - 1; ){
    let j = i + 1, len = 0; while (j < q.length - 1 && len < L){ len += rtDist(q[j], q[j-1]); j++; }
    if (j === q.length - 2 && rtDist(q[j], q[j+1]) < L/2) j++;
    const seg = q.slice(i, j + 1), d = pd(seg, false), cap = 'fill="none" stroke-linecap="round" stroke-linejoin="round"';
    out.push({ box: rtBoxOf(seg, r*.7), svg: `<path d="${d}" ${cap} stroke="${INK}" style="stroke-width:${f(2.45*r + 1.3*INK_K)}"/><path d="${d}" ${cap} stroke="${col}" style="stroke-width:${f(2.45*r)}"/>` });
    i = j; }
  return out; }
const rtCable = (pts, col, r) => rtWire(pts, col, r, 99).map(p => p.svg).join('');
// text printed on a top face, read from the default side (the back of the router)
const txZ = (x, y, z, str, size, col = INK, weight = 700) => `<text transform="${txM(P(x, y, z), Dv(0,-1,0), Dv(1,0,0))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`;
// a rounded slab between z0 and z1 (modem, phone, adapter)
function slab(x0, y0, x1, y1, z0, z1, r, M, sh = tone, w = 1.6){
  const A = on(PZ(z0), rrUV(x0, y0, x1, y1, r, 4)), B = on(PZ(z1), rrUV(x0, y0, x1, y1, r, 4));
  return loft(A, B, n => sh(n, M)) + fill(pd(B), sh([0,0,1], M)) + ink(pd(B), w*.55) + hullInk([...A, ...B], w); }
// the near half of a horizontal ring (a seam line)
function rtNear(ring, w){ const c = avg(ring); let out = '', run = [];
  for (let i = 0; i < ring.length; i++){ const a = ring[i], b = ring[(i+1) % ring.length];
    let n = [b[1]-a[1], -(b[0]-a[0]), 0]; if (dot(n, sub(avg([a, b]), c)) < 0) n = n.map(v => -v);
    if (vis(n)){ if (!run.length) run.push(a); run.push(b); } else if (run.length){ out += line(run, w); run = []; } }
  return out + (run.length > 1 ? line(run, w) : ''); }
const glowDot = (p, r, col, o = .55) => { const [X, Y] = P(...p); return `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(r)}" fill="${col}" opacity="${o}"/>`; };

/* ---------- state helpers ---------- */
const booted = st => st.power && st.boot >= 1;
const online = st => booted(st) && st.wan >= 1 && st.dhcp >= 1;
const blinkOn = (st, hz = 8) => Math.floor(st.tm * hz) % 2 === 0;
function wanPlug(st){ const p = ease(Math.max(0, Math.min(1, st.wan))), lift = Math.min(1, p/.35), slide = Math.max(0, (p - .35)/.65);
  return { xa: RW + 6 - 15*slide, zc: BH + 2.6 + (PORTZ - BH - 2.6)*lift }; }
function wanRoute(st){ const { xa, zc } = wanPlug(st), xe = xa + 17, zf = BH + 1.5;
  return [[xe, PORTS.wan, zc], [xe + 3, PORTS.wan, Math.max(zf, zc - 1)], [xe + 5, 110, zf], [xe + 4, 121.5, zf], [60, 123.5, zf], [26, 123.5, zf], [16, 122, zf], [14, 122.5, 5.5], [14, 125, 8]]; }
const coaxRoute = i => { const [x, y] = UFL[i], c = ANT[i].y; return [[x, y, PZ1 + 1.1], [x + 1.5, y, PZ1 + 1.6], [x + 3.5, y, 16.5], [RW - 4.5, c, 16.5], [RW - 1.5, c, AZ], [RW + 1, c, AZ]]; };
const PH_C = [73, 154, PHZ + .3];
function pktLegs(st){
  const c = ANT[3].y, z = PZ1 + .6, T = pts => pts.map(([x, y]) => [x, y, z]);
  return [
    { k:'air', d:1.0, pts:[PH_C, [AX, c, ZT + 40]] },
    { k:'ant', d:.5, pts:[[AX, c, ZT + 40], [AX, c, AZ]] },
    { k:'coax', d:.8, pts: coaxRoute(3).slice().reverse() },
    { k:'fem', d:.25, pts: T([[32.5, 110], [26, 110]]) },
    { k:'radio', d:.3, pts: T([[26, 110], [17, 102]]) },
    { k:'pcie', d:.55, pts: T(TR.pcie5) },
    { k:'soc', d:.45, pts: T([[40, 50], [40, 50]]) },
    { k:'rgmii', d:.45, pts: T([[40, 50], ...TR.rgmii]) },
    { k:'switch', d:.25, pts: T([[44, 82], [42.5, 86.5], [47, 89.5]]) },
    { k:'mag', d:.3, pts: [...T(TR.wan), [53, 104, 11.9]] },
    { k:'jack', d:.3, pts: [[53, 104, 11.9], [60, 104, PORTZ], [RW, 104, PORTZ]] },
    { k:'cable', d:1.2, pts: [[RW, 104, PORTZ], ...wanRoute(st)] },
  ];
}
const PKT_T = () => pktLegs(ui ? ui.st : { wan:1 }).reduce((a, l) => a + l.d, 0);
const pktStage = st => st.pkt ? pktLegs(st)[st.pkt.leg].k : '';
// on the cable the packet rides on top of it, not hidden inside it
const pktPos = st => { const l = pktLegs(st)[st.pkt.leg], p = rtAlong(l.pts, l.k === 'air' || l.k === 'cable' ? ease(st.pkt.u) : st.pkt.u);
  if (l.k === 'cable') p[2] += 2.6; return p; };
const INSIDE = ['ant', 'coax', 'fem', 'radio', 'pcie', 'soc', 'rgmii', 'switch', 'mag', 'jack'];

function rtLeds(st){
  const b = blinkOn(st), stg = pktStage(st), radioAct = ['air', 'ant', 'coax', 'fem', 'radio'].includes(stg) || st.phone === 'join';
  const wanAct = ['switch', 'mag', 'jack', 'cable'].includes(stg);
  return {
    pwr: !st.power ? 0 : st.boot < 1 ? (b ? GRN : 0) : GRN,
    w24: booted(st) ? GRN : 0,
    w5: booted(st) ? (radioAct && !b ? 0 : GRN) : 0,
    net: !booted(st) ? 0 : online(st) ? (wanAct && !b ? 0 : GRN) : st.wan >= 1 ? (b ? AMB : 0) : AMB,
    lan: 0, wps: 0,
    link: st.power && st.wan >= 1 ? GRN : 0,
    act: st.power && st.wan >= 1 && (wanAct || (booted(st) && st.dhcp < 1)) && b ? AMB : 0,
  };
}

/* ---------- the router case ---------- */
const rRing = (z, ins = 0) => on(PZ(z), rrUV(ins, ins, RW - ins, RD - ins, RR - ins, 5));
const RA = rRing(ZB), RB = rRing(ZT - 1.6), RT = rRing(ZT, 1.3);
function routerBody(st, m){
  const top = tone([0,0,1], m), led = rtLeds(st);
  let s = '';
  for (const [x, y] of [[9, 9], [9, RD - 9], [RW - 9, 9], [RW - 9, RD - 9]]) s += cyl(x, y, BH, ZB + .3, 3, DARK, toneI, .8, 14);
  s += loft(RA, RB, n => tone(n, m)) + loft(RB, RT, n => tone(n, m)) + fill(pd(RT), top);
  // side vents
  for (const [sy, n] of [[RD + .05, [0,1,0]], [-.05, [0,-1,0]]]) if (facing(n)){ let v = '';
    for (let i = 0; i < 11; i++) v += pd(on(PY(sy), rectUV(17 + 4*i, 10, 18.3 + 4*i, 15.5)));
    s += fill(v, mix(tone(n, m), '#000000', .45)); }
  s += rtNear(rRing(ZB + 4.2), .8) + rtNear(RB, .9);
  // top: two vent fields, the logo, six LED windows with their names
  let v = ''; for (const y0 of [14, 80]) for (let i = 0; i < 9; i++){ const y = y0 + 3.2*i; v += pd(on(PZ(ZT + .05), rrUV(31, y, 63, y + 1.3, .6, 2))); }
  s += fill(v, mix(top, '#000000', .5));
  s += txZ(48.5, 60, ZT + .06, 'LINKHOME', 4.6, mix(top, '#000000', .55), 800) + txZ(53.5, 60, ZT + .06, 'AX1800', 2.6, mix(top, '#000000', .45), 700);
  for (const L of LEDS){ const c = led[L.k], w = on(PZ(ZT + .06), rrUV(3.8, L.y - 1.7, 6.4, L.y + 1.7, .8, 3));
    s += shape(w, c || mix(top, '#000000', .35), .6) + (c ? glowDot([5.1, L.y, ZT], 3.2, c, .35) : '') + txZ(10.4, L.y, ZT + .06, L.t, 2, mix(top, '#000000', .55), 800); }
  // back panel: ports, buttons, printing
  if (facing([1,0,0])){
    const pf = (y0, z0, y1, z1) => on(PX(RW + .05), rectUV(y0, z0, y1, z1)), pc = (y, z, r) => on(PX(RW + .06), ellUV(y, z, r, r, 16));
    const tb = (y, t) => tx(RW + .1, y, 6.1, t, 1.7, INK, 800);
    const rj = (c, M, lk, ac) => shape(pf(c - 3.9, 8.4, c + 3.9, 15.4), M.l, .8)
      + shape(on(PX(RW + .07), [[c - 3.1, 10], [c - 1.5, 10], [c - 1.5, 9], [c + 1.5, 9], [c + 1.5, 10], [c + 3.1, 10], [c + 3.1, 14], [c - 3.1, 14]]), '#1d1a16', .7)
      + `<path d="${Array.from({ length:8 }, (_, i) => pd([[RW + .08, c - 2.1 + .6*i, 13.9], [RW + .08, c - 2.1 + .6*i, 13.1]], false)).join('')}" stroke="${GOLDC}" stroke-width=".5" fill="none"/>`
      + shape(pf(c - 3.5, 14.4, c - 2.4, 15.1), lk || LOFF, .4) + shape(pf(c + 2.4, 14.4, c + 3.5, 15.1), ac || LOFF, .4);
    s += rj(PORTS.wan, WANC, led.link, led.act) + tb(PORTS.wan, 'WAN');
    PORTS.lan.forEach((c, i) => { s += rj(c, LANC, 0, 0) + tb(c, String(i + 1)); });
    s += shape(pc(PORTS.dc, PORTZ, 2.9), '#4a4642', .8) + shape(pc(PORTS.dc, PORTZ, 2.1), '#1d1a16', .6) + shape(pc(PORTS.dc, PORTZ, .6), METAL.m, .4) + tb(PORTS.dc, '12V');
    s += shape(pc(PORTS.pwr, PORTZ, 2.9), mix(tone([1,0,0], m), '#000000', .3), .6) + tb(PORTS.pwr, 'POWER');
    s += shape(pc(PORTS.rst, PORTZ, .8), '#1d1a16', .5) + tb(PORTS.rst, 'RESET');
    s += shape(pc(PORTS.wps, PORTZ, 2.2), mix(tone([1,0,0], m), '#000000', .3), .5) + tb(PORTS.wps, 'WPS');
  }
  s += ink(pd(RT), 1.3) + hullInk([...RA, ...RT], 2.8);
  return s;
}
const GOLDC = '#d8a24a';

/* ---------- antennas ---------- */
function antennaSvg(a, st, k){
  const c = a.y;
  const hous = box(RW, c - 2.6, ZT - 4.5, RW + 4.6, c + 2.6, ZT, DARK, tone, 1.1) + rod([AX, c, ZT - 1], [AX, c, ZT + ALEN], 2.4, DARK, tone, 1.2, 1.9, 18);
  if (k <= 0) return hous;
  // inside the housing: a coax up to the feed, a brass sleeve below it and the radiator above (a quarter wave each)
  const q = a.band === 5 ? 7.5 : 15.5, zf = ZT + 52, lit = a.band === 5 && ['air', 'ant'].includes(pktStage(st)) || (a.band === 5 && st.phone === 'join');
  const inside = rod([AX, c, AZ], [AX, c, zf - q], .55, matOf('#3a3632'), toneI, .5, .55, 8) + rod([AX, c, zf - q], [AX, c, zf], 1.1, BRASS, toneI, .6, 1.1, 12)
    + rod([AX, c, zf], [AX, c, zf + q], .55, lit ? matOf('#ffb347') : matOf('#c9792e'), toneI, .5, .55, 8)
    + rod([AX, c - 2.4, AZ], [AX, c + 2.4, AZ], .9, METAL, toneI, .6, .9, 10);
  return `<g opacity="${f(1 - .75*k)}">${hous}</g><g opacity="${f(k)}">${inside}</g>`;
}

/* ---------- plugs, desk things ---------- */
function wanPlugSvg(st){
  const { xa, zc } = wanPlug(st), y = PORTS.wan, x0 = Math.max(RW, xa), x1 = xa + 10, xb = xa + 17, pp = [];
  if (x1 > x0){ let b = box(x0, y - 3, zc - 2.4, x1, y + 3, zc + 2.4, CLEAR, toneI, .8);
    if (xa + 3 > x0) b += `<path d="${Array.from({ length:8 }, (_, i) => pd([[Math.max(x0, xa + .4), y - 2.1 + .6*i, zc + 2.45], [xa + 3, y - 2.1 + .6*i, zc + 2.45]], false)).join('')}" stroke="${GOLDC}" stroke-width=".6" fill="none"/>`;
    pp.push({ box:[[x0, y - 3, zc - 2.4], [x1, y + 3, zc + 2.4]], svg: b });
    const t0 = Math.max(x0, xa + 2); if (xa + 8 > t0) pp.push({ box:[[t0, y - 1.4, zc - 3.1], [xa + 8, y + 1.4, zc - 2.4]], svg: box(t0, y - 1.4, zc - 3.1, xa + 8, y + 1.4, zc - 2.4, CLEAR, toneI, .6) }); }
  const b0 = Math.max(RW, x1); pp.push({ box:[[b0, y - 3.3, zc - 2.7], [xb, y + 3.3, zc + 2.7]], svg: box(b0, y - 3.3, zc - 2.7, xb, y + 3.3, zc + 2.7, WANC, toneI, 1) });
  return act('wan', byDepth(pp));
}
function phoneSvg(st){
  const [x0, y0, x1, y1] = PHN, z = PHZ + .05;
  let s = slab(x0, y0, x1, y1, BH, PHZ, 5, PHM, toneI, 1.6);
  s += shape(on(PZ(z), rrUV(x0 + 2, y0 + 2, x1 - 2, y1 - 2, 3.6, 4)), '#1d2a26', .7);
  const tc = '#8af0ae', name = booted(st) ? 'HOME-5G' : 'NO NETWORKS';
  const stat = st.phone === 'on' ? 'CONNECTED' : st.phone === 'join' ? 'JOINING' + '...'.slice(0, 1 + Math.floor(st.tm*3) % 3) : booted(st) ? 'TAP TO JOIN' : 'SEARCHING';
  s += txZ(42.4, 166, z, '9:41', 2.4, tc, 700) + txZ(50, 154, z, 'WI-FI', 3.4, tc, 800);
  s += txZ(62, 154, z, name, 3.6, '#ffffff', 800) + txZ(68, 154, z, stat, 2.6, tc, 700);
  if (st.phone === 'on'){ s += txZ(74.5, 154, z, '5 GHZ  1201 MBPS', 2.2, tc, 700);
    let w = ''; for (const r of [1.2, 2.2, 3.2]) w += pd(on(PZ(z), arcUV(43.6, 142, r, 135, 225, 6)), false);
    s += `<path d="${w}" fill="none" stroke="${tc}" stroke-width=".7" stroke-linecap="round"/>` + glowDot([43.6, 142, z], .5, tc, 1); }
  if (st.pkt && st.pkt.leg === 0) s += txZ(90, 154, z, 'SENDING', 2.8, GLOW, 800);
  s += shape(on(PZ(z + .02), rrUV(x1 - 5.5, 150, x1 - 4.6, 158, .4, 2)), '#55606a', .3);     // home bar
  return act('phone', s);
}
function modemSvg(st){
  const [x0, y0, x1, y1, zt] = MOD, led = online(st) || (st.power && st.wan >= 1);
  let s = slab(x0, y0, x1, y1, BH, zt, 3, MODM, tone, 2.2);
  let v = ''; for (let i = 0; i < 6; i++) v += pd(on(PZ(zt + .05), rrUV(5, 136 + 3*i, 19, 137.2 + 3*i, .5, 2)));

    if (st.join >= 1){ st.phone = 'on'; if (st.queue){ st.queue = false; startPkt(st); } } }
  if (st.pkt) stepPkt(st, dt);
  return st.wan !== st.wanT || st.press > 0 || st.arrive > 0 || (st.power && st.boot < 1) || (linkUp && st.dhcp < 1) || st.phone === 'join' || !!st.pkt;
}
function rtRun(){ if (rtLoopOn) return; rtLoopOn = true;
  ui.animate(dt => { const busy = rtStep(ui.st, dt); if (!busy) rtLoopOn = false; return busy; }); }
function plugWan(st){
  if (st.pkt && st.pkt.leg >= 9) return ui.flash('Wait: a packet is on its way out of the WAN port');
  st.wanT = st.wanT ? 0 : 1; rtRun(); }
function power(st){
  st.power = !st.power; st.press = .25; st.boot = 0; st.dhcp = 0;
  if (!st.power){ st.phone = 'off'; st.join = 0; st.pkt = null; st.queue = false; }
  rtRun(); }
function connect(st){
  if (!st.power) return ui.flash('Power the router on first');
  if (st.boot < 1) return ui.flash('Still booting: wait for the Wi-Fi lights');
  if (st.phone === 'on') return ui.flash('The phone is already on HOME-5G');
  if (st.phone === 'join') return;
  st.phone = 'join'; st.join = 0; rtRun(); }
function startPkt(st){ st.pkt = { t:0, leg:0, u:0 }; rtRun(); }
function send(st){
  if (!st.power) return ui.flash('Power the router on first');
  if (st.boot < 1) return ui.flash('Still booting: wait for the Wi-Fi lights');
  if (st.pkt) return ui.flash('One packet at a time');
  if (st.phone !== 'on'){ st.queue = true; return connect(st); }   // join the network first, then send
  startPkt(st); }

ui = mountFigure({
  fig:'31', title:'Wi-Fi router',
  size:[RW + 41, 178, ZT + ALEN + 2], center:[42, 72], palette:'cobalt', turn:'full',
  // wan: plug 0 (on the desk) .. 1 (in the jack); boot 0..1; dhcp 0..1; phone 'off' | 'join' | 'on'; pkt { t, leg, u }
  state:{ tm:0, wan:0, wanT:0, power:false, press:0, boot:0, dhcp:0, phone:'off', join:0, pkt:null, queue:false, sent:0, arrive:0 },
  scene,
  stats: st => [
    { label:'Packets out', value: String(st.sent) },
    { label:'Wi-Fi link', value: st.phone === 'on' ? '1201 Mbps' : '--', small:true },
    { label:'Signal', value: st.phone === 'on' ? '-47 dBm' : '--', small:true },
    { label:'Internet', value: online(st) ? '1 Gbps' : booted(st) ? 'no link' : 'off', small:true } ],
  buttons:[
    { label:'Plug in WAN cable', onClick: st => plugWan(st) },
    { label:'Power on / off', onClick: st => power(st) },
    { label:'Connect phone', onClick: st => connect(st) },
    { label:'Send a packet', onClick: st => send(st) },
  ],
  acts:{ wan: st => plugWan(st), power: st => power(st), phone: st => st.phone === 'on' ? send(st) : connect(st) },
  params:(st, q) => {
    if (q.get('wan') === '1') st.wan = st.wanT = 1;
    if (q.get('power') === '1'){ st.power = true; st.boot = 1; st.dhcp = st.wan >= 1 ? 1 : 0; }
    if (q.get('phone') === '1' && st.power) st.phone = 'on';
    if (q.has('sent')) st.sent = +q.get('sent') || 0;
    if (q.has('pkt') && st.phone === 'on'){ st.pkt = { t:0, leg:0, u:0 }; stepPkt(st, +q.get('pkt') * pktLegs(st).reduce((a, l) => a + l.d, 0)); }
  },
});
xrMount(() => ui, () => '');
</script></body></html>
